<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SUPRA LAB v14 — FULL SPECTRUM + IA GROQ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --green: #00ff41;
            --red: #ff0044;
            --bg-dark: #001100;
            --bg-darker: #000;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: var(--bg-darker);
            color: var(--green);
            font-family: 'VT323', monospace;
            font-size: 18px;
            line-height: 1.35;
            min-height: 100vh;
            overflow-y: auto;
            touch-action: manipulation;
        }

        body.night-vision {
            --green: #00cc22;
            filter: brightness(1.2) contrast(1.3) hue-rotate(80deg);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(to bottom, rgba(0,255,65,0.04) 0px, rgba(0,255,65,0.04) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            z-index: 9999;
            animation: crt 0.12s linear infinite;
        }
        @keyframes crt { 0% { opacity: 0.9; } 100% { opacity: 1; } }

        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #000; border: 2px solid var(--green); }
        ::-webkit-scrollbar-thumb { background: var(--green); }

        header {
            background: var(--bg-dark);
            border-bottom: 6px solid var(--green);
            padding: 14px;
            text-align: center;
            font-size: 26px;
            text-shadow: 0 0 15px var(--green);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        #main {
            display: none;
            padding: 12px;
            gap: 14px;
            flex-direction: column;
        }

        .panel {
            background: var(--bg-dark);
            border: 4px solid var(--green);
            box-shadow: 0 0 30px var(--green);
            padding: 12px;
            position: relative;
            min-height: 230px;
        }

        .panel-header {
            position: absolute;
            top: -14px;
            left: 16px;
            background: var(--bg-dark);
            padding: 0 14px;
            font-size: 18px;
            z-index: 10;
        }

        canvas {
            width: 100% !important;
            height: 190px !important;
            background: #000;
            display: block;
        }

        #log {
            min-height: 320px;
            max-height: 420px;
            overflow-y: scroll !important;
            background: rgba(0,20,0,0.9);
            padding: 14px;
            font-size: 17px;
            border: 3px solid var(--green);
        }

        .log-line { white-space: pre-wrap; margin-bottom: 6px; }
        .log-line::before { content: "> "; color: #00cc33; margin-right: 8px; }
        .alert-critical { color: var(--red); font-weight: bold; }

        .value {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(0,17,0,0.95);
            padding: 6px 14px;
            border: 3px solid var(--green);
            font-size: 19px;
            z-index: 20;
        }

        .control-bar {
            margin-top: 12px;
            padding: 10px;
            border: 3px solid var(--green);
            background: var(--bg-dark);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .btn {
            background: transparent;
            color: var(--green);
            border: 4px solid var(--green);
            padding: 12px 26px;
            font-size: 20px;
            cursor: pointer;
        }
        .btn:hover { background: var(--green); color: #000; }

        .floating-btn {
            position: fixed;
            right: 15px;
            z-index: 300;
            padding: 10px 18px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- PARAMÈTRES -->
    <div id="settings-page" style="display:none;position:fixed;inset:0;background:var(--bg-darker);z-index:10001;padding:20px;overflow-y:auto;border:8px solid var(--green);">
        <button id="closeSettings" style="position:absolute;top:15px;right:15px;font-size:32px;background:none;border:none;color:var(--green);">✕</button>
        <div style="text-align:center;font-size:26px;margin-bottom:25px;">⚙️ PARAMÈTRES</div>

        <div style="margin-bottom:20px;">
            <h3>🔑 Clé API Groq</h3>
            <input type="text" id="groqApiKey" placeholder="gsk_xxxxxxxxxxxxxxxx" style="width:100%;padding:12px;font-size:17px;">
        </div>

        <div style="text-align:center;margin-top:30px;">
            <button class="btn" id="saveSettings">💾 Sauvegarder</button>
        </div>
    </div>

    <!-- START SCREEN -->
    <div id="start-screen">
        <div style="text-align:center;margin-bottom:40px;font-size:26px;">
            SUPRA LAB v11<br>
            FULL SPECTRUM SIGINT + IA GROQ
        </div>
        <button id="btnStart" class="btn" style="padding:25px 80px;font-size:36px;">LANCER TOUT LE SYSTÈME</button>
        <button id="btnSettings" class="btn" style="margin-top:20px;">⚙️ PARAMÈTRES</button>
        <button id="btnStartIA" class="btn" style="margin-top:20px;">🎤 ACTIVER L'IA VOCALE</button>
    </div>

    <!-- MAIN -->
    <div id="main">
        <header>SUPRA LAB v11 — FULL SPECTRUM + IA GROQ</header>

        <div class="panel">
            <div class="panel-header">SPECTROGRAMME WATERFALL</div>
            <canvas id="spectrogram"></canvas>
        </div>
        <div class="panel">
            <div class="panel-header">OSCILLOSCOPE</div>
            <canvas id="scope"></canvas>
        </div>
        <div class="panel">
            <div class="panel-header">CAPTEURS + ANOMALIE</div>
            <canvas id="sensors"></canvas>
            <div class="value" id="rms-value">RMS: -- dB</div>
            <div class="value" id="anomaly-badge" style="top:55px;background:var(--red);color:#fff;display:none;">⚠️ ANOMALIE</div>
        </div>

        <div class="panel">
            <div class="panel-header">BAND ANALYSIS</div>
            <div id="band-info" style="padding:12px;font-size:18px;"></div>
        </div>

        <div class="panel" style="min-height:360px;">
            <div class="panel-header">SIGINT LOG + IA GROQ</div>
            <div id="log"></div>
        </div>
    </div>

    <!-- Boutons flottants -->
    <button class="floating-btn btn" id="btnFullscreen">⛶ PLEIN ÉCRAN</button>
    <button class="floating-btn btn" id="btnNightVision">🌙 NIGHT VISION</button>
    <button class="floating-btn btn" id="btnAnalyzeNow">📡 ANALYSE IA</button>

    <script>
        // ==================== CONFIG ====================
        const DEFAULT_CONFIG = {
            groqApiKey: "",
            micSensitivity: 50,
            echoCancellation: true,
            noiseSuppression: true
        };

        let config = {...DEFAULT_CONFIG};
        let audioCtx, analyser, microphone, gainNode, mediaRecorder, recordedChunks = [];
        let frequencyArray, timeArray;
        let spectroHistory = [];
        let rmsHistory = [];
        let isRunning = false;
        let recognition = null;
        let isNightVision = false;

        let audioSummary = {
            rms: 0,
            peakFreq: 0,
            anomaly: false,
            band: "UNKNOWN",
            transcript: ""
        };

        // ==================== LOG (amélioré) ====================
        function log(text, important = false) {
            const logDiv = document.getElementById('log');
            if (!logDiv) return;
            const line = document.createElement('div');
            line.className = 'log-line' + (important ? ' alert-critical' : '');
            line.innerHTML = `<span style="color:#00cc33">[${new Date().toLocaleTimeString('fr-FR')}]</span> ${text}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight + 100;   // force scroll
            if (logDiv.children.length > 180) logDiv.removeChild(logDiv.children[0]);
        }

        // ==================== NIGHT VISION ====================
        function toggleNightVision() {
            isNightVision = !isNightVision;
            document.body.classList.toggle('night-vision', isNightVision);
            document.getElementById('btnNightVision').textContent = isNightVision ? "☀️ NORMAL" : "🌙 NIGHT VISION";
        }

        function playCriticalAlert() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.value = 880;
                const gain = ctx.createGain();
                gain.gain.value = 0.25;
                osc.connect(gain).connect(ctx.destination);
                osc.start();
                setTimeout(() => osc.stop(), 600);
                if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
            } catch(e) {}
        }

        function classifyBand(freq) {
            if (freq < 30000) return "VLF - POSSIBLE EVP";
            if (Math.abs(freq - 121500000) < 1000000) return "VHF EMERGENCY";
            if (Math.abs(freq - 243000000) < 2000000) return "UHF MILITARY";
            return "RF INCONNU";
        }

        // ==================== ANALYSE GROQ ====================
        async function analyzeWithGroq() {
            if (!config.groqApiKey) {
                log("[GROQ] Clé API manquante !", true);
                return;
            }

            log("[GROQ] Analyse en cours...", true);

            const prompt = `Analyse ces données SIGINT :
RMS: ${audioSummary.rms.toFixed(1)} dB
Fréquence: ${audioSummary.peakFreq} Hz
Anomalie: ${audioSummary.anomaly ? "OUI" : "Non"}
Dernier mot entendu: "${audioSummary.transcript}"

Donne une analyse courte en français militaire.`;

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${config.groqApiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: prompt }],
                        temperature: 0.7,
                        max_tokens: 300
                    })
                });

                const data = await res.json();
                const response = data.choices?.[0]?.message?.content || "Pas de réponse de l'IA";
                log(`[SUPRA IA] ${response}`, true);
            } catch (e) {
                log(`[GROQ ERREUR] ${e.message}`, true);
            }
        }

        // ==================== IA VOCALE LOCALE ====================
        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                log("[IA] Reconnaissance vocale non supportée sur ce navigateur", true);
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'fr-FR';

            recognition.onresult = (e) => {
                const transcript = e.results[e.results.length - 1][0].transcript.trim();
                audioSummary.transcript = transcript;

                log(`[VOIX] "${transcript}"`, true);

                // Déclenchement Groq quand tu dis "supra"
                if (transcript.toLowerCase().includes("supra")) {
                    log("[COMMANDE] Analyse Groq demandée...", true);
                    analyzeWithGroq();
                }
            };

            recognition.onerror = (e) => log(`[IA ERREUR] ${e.error}`, true);
            recognition.onend = () => setTimeout(() => recognition.start(), 500);

            recognition.start();
            log("[IA VOCALE] Écoute activée - Dis 'Supra' pour tester", true);
        }

        // ==================== INITIALISATION AUDIO (ton code) ====================
        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 48000 }
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                await audioCtx.resume();

                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 4096;

                frequencyArray = new Uint8Array(analyser.frequencyBinCount);
                timeArray = new Uint8Array(analyser.frequencyBinCount);

                isRunning = true;
                requestAnimationFrame(loop);

                log("[AUDIO] Micro activé avec succès");
            } catch (err) {
                log(`[ERREUR MICRO] ${err.message}`, true);
            }
        }

        // ==================== BOUCLE PRINCIPALE ====================
        function loop() {
            if (!isRunning || !analyser) return;

            analyser.getByteFrequencyData(frequencyArray);
            const rms = Math.sqrt(frequencyArray.reduce((a,b)=>a + b*b, 0) / frequencyArray.length) / 128;

            audioSummary.rms = rms;
            audioSummary.anomaly = rms > 45;

            document.getElementById('rms-value').textContent = `RMS: ${rms.toFixed(1)} dB`;

            drawSpectrogram();
            drawScope();

            requestAnimationFrame(loop);
        }

        function drawSpectrogram() {
            const canvas = document.getElementById('spectrogram');
            if (!canvas || !analyser) return;
            const ctx = canvas.getContext('2d');
            analyser.getByteFrequencyData(frequencyArray);
            spectroHistory.unshift([...frequencyArray]);
            if (spectroHistory.length > 100) spectroHistory.pop();

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width / frequencyArray.length;
            for (let y = 0; y < spectroHistory.length; y++) {
                for (let x = 0; x < spectroHistory[y].length; x++) {
                    const val = spectroHistory[y][x];
                    ctx.fillStyle = `hsl(${90 + val/2.5}, 100%, ${val/2.8}%)`;
                    ctx.fillRect(x * w, y * 2, w + 1, 2);
                }
            }
        }

        function drawScope() {
            const canvas = document.getElementById('scope');
            if (!canvas || !analyser) return;
            const ctx = canvas.getContext('2d');
            analyser.getByteTimeDomainData(timeArray);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = var(--green);
            ctx.lineWidth = 3;
            ctx.beginPath();
            const slice = canvas.width / timeArray.length;
            let x = 0;
            for (let i = 0; i < timeArray.length; i++) {
                const y = (timeArray[i] / 128) * canvas.height / 2;
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                x += slice;
            }
            ctx.stroke();
        }

        // ==================== DÉMARRAGE ====================
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnStart').addEventListener('click', async () => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main').style.display = 'flex';

                log("=== SUPRA LAB v11 DÉMARRÉ ===", true);
                log("Dis 'Supra' pour tester l'IA Groq", true);

                await initAudio();
                initSpeech();
            });

            document.getElementById('btnStartIA').addEventListener('click', initSpeech);
            document.getElementById('btnNightVision').addEventListener('click', toggleNightVision);
            document.getElementById('btnAnalyzeNow').addEventListener('click', analyzeWithGroq);
            document.getElementById('btnSettings').addEventListener('click', () => document.getElementById('settings-page').style.display = 'block');
            document.getElementById('closeSettings').addEventListener('click', () => document.getElementById('settings-page').style.display = 'none');

            document.getElementById('saveSettings').addEventListener('click', () => {
                config.groqApiKey = document.getElementById('groqApiKey').value.trim();
                localStorage.setItem('supraLabConfig', JSON.stringify(config));
                log("[CONFIG] Clé Groq sauvegardée", true);
                document.getElementById('settings-page').style.display = 'none';
            });
        });
    </script>
</body>
</html>
