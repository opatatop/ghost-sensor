<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUPRA AI v7.0.1 FINALE</title>
<style>
    :root {
        --bg-color: #050508;
        --primary: #00f3ff;
        --secondary: #bc13fe;
        --font-main: 'Courier New', monospace;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    body {
        margin: 0;
        background-color: var(--bg-color);
        color: #e0e0e0;
        font-family: var(--font-main);
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
        border-top: 4px solid var(--primary);
    }

    /* Fond animé */
    body::before {
        content: ""; position: absolute; top: 0; left: 0; width: 200%; height: 200%;
        background-image: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px; z-index: 0; pointer-events: none;
        animation: gridMove 60s linear infinite;
    }
    @keyframes gridMove { 0% { transform: translate(0, 0); } 100% { transform: translate(-50px, -50px); } }

    header {
        position: relative; z-index: 10; height: 70px;
        background: rgba(0,0,0,0.95);
        border-bottom: 1px solid var(--primary);
        display: flex; justify-content: space-between; align-items: center; padding: 0 15px;
    }

    .brand { font-size: 1.1rem; font-weight: 900; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; }
    
    .controls { display: flex; gap: 10px; }

    button {
        background: rgba(0,0,0,0.6); border: 1px solid var(--primary); color: var(--primary);
        padding: 8px 16px; font-family: var(--font-main); font-weight: bold; font-size: 0.8rem;
        cursor: pointer; transition: 0.2s; text-transform: uppercase; border-radius: 4px;
    }
    button:hover:not(:disabled) { background: var(--primary); color: #000; }
    button.active { background: var(--secondary); color: #fff; border-color: var(--secondary); box-shadow: 0 0 15px var(--secondary); animation: glow 2s infinite; }
    
    @keyframes glow { 0% { box-shadow: 0 0 5px var(--secondary); } 50% { box-shadow: 0 0 20px var(--secondary); } 100% { box-shadow: 0 0 5px var(--secondary); } }

    #canvas-container { flex-grow: 1; position: relative; z-index: 1; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }

    #terminal {
        height: 180px; background: rgba(5, 5, 10, 0.95);
        border-top: 1px solid var(--primary);
        padding: 10px; font-size: 12px; overflow-y: auto;
        z-index: 10; scrollbar-width: thin; scrollbar-color: var(--primary) #000;
    }
    .log-line { margin-bottom: 4px; border-left: 2px solid transparent; padding-left: 8px; opacity: 0; animation: slideIn 0.3s forwards; word-break: break-word;}
    .log-sys { color: #888; border-color: #888; }
    .log-user { color: var(--primary); border-color: var(--primary); }
    .log-ai { color: #fff; border-color: #fff; font-weight: bold; }
    
    @keyframes slideIn { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }

    /* CONFIG MODAL */
    #config-modal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-box { background: #0a0a0a; border: 1px solid var(--primary); padding: 20px; width: 100%; max-width: 400px; }
    .modal-box input {
        width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 12px; margin: 15px 0; font-family: monospace;
    }
</style>
</head>
<body>

<header>
    <div class="brand">SUPRA <span>AI FINALE</span></div>
    <div class="controls">
        <button id="btnMic">1. MICRO</button>
        <button id="btnVoice">2. ÉCOUTE</button>
        <button id="btnConfig">⚙️</button>
    </div>
</header>

<div id="canvas-container">
    <canvas id="canvas"></canvas>
</div>

<div id="terminal"></div>

<!-- CONFIG MODAL -->
<div id="config-modal">
    <div class="modal-box">
        <h3 style="color:var(--primary); margin:0;">Clé API (Optionnel)</h3>
        <p style="color:#666; font-size:0.8rem; margin-top:5px;">Laissez vide pour le Mode Local.</p>
        <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off">
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
            <button onclick="toggleModal()" style="border-color:#333; color:#888;">Fermer</button>
            <button onclick="saveKey()" style="background:var(--primary); color:#000; font-weight:bold;">OK</button>
        </div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
const COLORS = { primary: '#00f3ff', listen: '#bc13fe', speak: '#ffffff' };

const Logger = {
    log: (msg, type="sys") => {
        const t = $('terminal');
        const d = document.createElement("div");
        d.className = `log-line log-${type}`;
        d.innerHTML = `<span style="color:#555">[${new Date().toLocaleTimeString('fr-FR', {hour12:false})}]</span> ${msg}`;
        t.appendChild(d);
        t.scrollTop = t.scrollHeight;
        if(t.childElementCount > 50) t.removeChild(t.firstChild);
    }
};

/* --- AUDIO --- */
class AudioEngine {
    constructor() { this.ready = false; this.analyser = null; this.dataArray = null; this.ctx = null; }
    async start() {
        if(this.ready) return;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (this.ctx.state === 'suspended') await this.ctx.resume();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const src = this.ctx.createMediaStreamSource(stream);
            this.analyser = this.ctx.createAnalyser();
            this.analyser.fftSize = 256;
            this.analyser.smoothingTimeConstant = 0.8;
            src.connect(this.analyser);
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
            this.ready = true;
            Logger.log("Microphone actif.", "sys");
            $('btnMic').classList.add('active');
        } catch(e) { Logger.log("Erreur micro.", "sys"); }
    }
    getData() {
        if(!this.ready) return { vol:0, raw:null };
        this.analyser.getByteFrequencyData(this.dataArray);
        let sum=0;
        for(let i=0;i<this.dataArray.length;i++) sum+=this.dataArray[i];
        return { vol: sum/this.dataArray.length, raw: this.dataArray };
    }
}

/* --- CERVEAU --- */
class Brain {
    constructor() {
        this.apiKey = localStorage.getItem('supra_api_key') || "";
        this.synth = window.speechSynthesis;
        this.voices = [];
        if(speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = () => this.voices = this.synth.getVoices();
    }
    setKey(key) { this.apiKey = key.trim(); localStorage.setItem('supra_api_key', this.apiKey); }
    async process(text) {
        if(text.length < 2) return;
        Logger.log(`VOIX: "${text}"`, "user");
        
        let response = "";
        if (this.apiKey.length > 10) {
            try {
                response = await this.fetchGPT(text);
            } catch (e) {
                response = this.localProcess(text);
            }
        } else {
            response = this.localProcess(text);
        }
        this.speak(response);
    }
    async fetchGPT(prompt) {
        const controller = new AbortController();
        setTimeout(() => controller.abort(), 5000); 
        try {
            const res = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${this.apiKey}` },
                body: JSON.stringify({
                    model: "gpt-3.5-turbo",
                    messages: [{role: "system", content: "Tu es Supra. Réponds court."}, {role: "user", content: prompt}]
                }),
                signal: controller.signal
            });
            if (!res.ok) throw new Error();
            const data = await res.json();
            return data.choices[0].message.content;
        } catch(e) { throw e; }
    }
    localProcess(text) {
        const t = text.toLowerCase();
        // COMMANDES SPÉCIALES
        if (t.includes("musique") || t.includes("allume") || t.includes("lance")) return "C'est parti, lancement de la procédure audio.";
        if (t.includes("heure")) return `Il est ${new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}.`;
        if (t.includes("date")) return `Nous sommes le ${new Date().toLocaleDateString('fr-FR')}.`;
        if (t.includes("qui es-tu")) return "Je suis Supra IA, version finale.";
        if (t.includes("bonjour") || t.includes("salut")) return "Bonjour humain. Système opérationnel.";
        if (t.includes("merci")) return "Avec plaisir.";
        if (t.includes("stop") || t.includes("arrête")) return "Arrêt de la séquence.";
        // CALCULS SIMPLES
        if (t.includes("plus") && t.match(/\d+/)) {
            const nums = t.match(/\d+/g);
            if(nums && nums.length>=2) return `Ça fait ${parseInt(nums[0])+parseInt(nums[1])}.`;
        }
        return "Commande reçue.";
    }
    speak(text) {
        this.synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const fr = this.voices.find(v => v.lang.includes('fr'));
        if(fr) u.voice = fr;
        u.rate = 1.1;
        u.onstart = () => { Logger.log(`IA: "${text}"`, "ai"); app.pauseVoice(); };
        u.onend = () => { app.resumeVoice(); };
        this.synth.speak(u);
    }
}

/* --- VOIX --- */
class VoiceEngine {
    constructor(callback) {
        this.callback = callback;
        this.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        this.isActive = false;
        if(!this.SpeechRecognition) { $('btnVoice').disabled = true; return; }
        this.rec = new this.SpeechRecognition();
        this.rec.lang = 'fr-FR';
        this.rec.continuous = true;
        this.rec.interimResults = false;
        this.rec.onstart = () => { this.isActive = true; $('btnVoice').classList.add('active'); $('btnVoice').textContent = "ECOUTE"; };
        this.rec.onend = () => {
            if(this.isActive) { try { this.rec.start(); } catch(e){} }
            else { $('btnVoice').classList.remove('active'); $('btnVoice').textContent = "ECOUTE"; }
        };
        this.rec.onresult = (e) => this.callback(e.results[e.results.length-1][0].transcript);
    }
    toggle() { if(this.isActive) { this.isActive = false; this.rec.stop(); } else { try { this.rec.start(); } catch(e){} } }
    pause() { this.wasActive = this.isActive; this.isActive = false; try { this.rec.stop(); } catch(e){} }
    resume() { if(this.wasActive) { this.isActive = true; try { this.rec.start(); } catch(e){} } }
}

/* --- VISUELS --- */
class Visuals {
    constructor() {
        this.c = $('canvas');
        this.ctx = this.c.getContext('2d');
        this.nodes = Array.from({length:40}, () => ({ x:Math.random()*innerWidth, y:Math.random()*innerHeight, vx:(Math.random()-0.5), vy:(Math.random()-0.5), s:Math.random()*2+1 }));
        const resize = () => { this.c.width=innerWidth; this.c.height=innerHeight-$('header').offsetHeight-$('terminal').offsetHeight; };
        onresize = resize; resize();
    }
    draw(audio) {
        const { vol, raw } = audio; const w = this.c.width, h = this.c.height;
        this.ctx.fillStyle = "rgba(2,2,5,0.2)"; this.ctx.fillRect(0,0,w,h);
        let col = app.isSpeaking ? COLORS.speak : (app.isListening ? COLORS.listen : COLORS.primary);
        this.nodes.forEach(n => {
            n.x+=n.vx; n.y+=n.vy; if(n.x<0||n.x>w)n.vx*=-1; if(n.y<0||n.y>h)n.vy*=-1;
            this.ctx.beginPath(); this.ctx.arc(n.x, n.y, n.s + vol/30, 0, Math.PI*2); this.ctx.fillStyle = col; this.ctx.fill();
        });
        this.ctx.beginPath(); this.ctx.arc(w/2, h/2, 30 + vol/2, 0, Math.PI*2); this.ctx.strokeStyle = col; this.ctx.stroke();
        if(raw) { this.ctx.beginPath(); for(let i=0;i<raw.length;i++) this.ctx.lineTo((i/raw.length)*w, h-(raw[i]/255)*(h/3)); this.ctx.strokeStyle = col; this.ctx.globalAlpha=0.2; this.ctx.stroke(); this.ctx.globalAlpha=1; }
    }
}

/* --- APP --- */
class App {
    constructor() {
        this.audio = new AudioEngine();
        this.brain = new Brain();
        this.visuals = new Visuals();
        this.voice = new VoiceEngine(t => this.brain.process(t));
        this.isListening = false; this.isSpeaking = false;

        $('btnMic').onclick = () => this.audio.start();
        $('btnVoice').onclick = () => { 
            this.voice.toggle(); 
            this.isListening = this.voice.isActive;
        };
        $('btnConfig').onclick = () => { $('apiKeyInput').value = this.brain.apiKey; $('config-modal').style.display = 'flex'; };
        this.loop();
        Logger.log("Système Finale Prêt.", "sys");
    }
    pauseVoice() { this.voice.pause(); this.isListening = false; }
    resumeVoice() { this.voice.resume(); this.isListening = this.voice.isActive; }
    loop() { requestAnimationFrame(() => this.loop()); this.visuals.draw(this.audio.getData()); }
}

window.toggleModal = () => $('config-modal').style.display = 'none';
window.saveKey = () => { app.brain.setKey($('apiKeyInput').value); toggleModal(); Logger.log("Config ok", "sys"); };

const app = new App();
</script>
</body>
</html>
