<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS v43.0 - IRON MAN</title>
    <!-- Fonts Iron Man -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000000; --iron-blue: #00b4db; --iron-red: #db0000; --iron-gold: #ffd700;
            --panel: #111; --border: #222;
            --font-head: 'Orbitron', sans-serif; --font-ui: 'Rajdhani', sans-serif; --font-mono: 'Share Tech Mono', monospace;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; background: var(--bg); color: #ccc; font-family: var(--font-ui); 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            background: radial-gradient(circle at 50% 0%, #0f1419 0%, #000 100%),
                        linear-gradient(0deg, rgba(0, 243, 255, 0.1), transparent),
                        linear-gradient(90deg, rgba(0, 243, 255, 0.1), transparent);
        }

        header { 
            height: 50px; background: #000; border-bottom: 2px solid var(--iron-blue); 
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 10;
        }
        .brand { 
            font-family: var(--font-head); font-weight: 900; font-size: 1.3rem; letter-spacing: 4px; 
            color: var(--iron-blue); text-shadow: 0 0 15px var(--iron-blue); text-transform: uppercase; 
        }
        .status { font-family: var(--font-mono); font-size: 0.85rem; color: var(--iron-red); letter-spacing: 3px; }

        #hologram { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }

        /* VISUALISEUR AUDIO */
        #viz-container {
            flex: 1; background: rgba(0,0,0,0.85); padding: 15px; display: flex; flex-direction: column; justify-content: center; gap: 15px;
        }
        .bar-label { 
            font-family: var(--font-mono); font-size: 0.75rem; color: var(--iron-red); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .bar-track { width: 100%; height: 8px; background: #111; border-radius: 4px; position: relative; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; transition: width 0.15s linear; border-radius: 4px; }

        /* ZONE TEXTE */
        #display-area {
            flex: 1; padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        #input-text { 
            font-family: var(--font-head); font-size: 2.2rem; font-weight: 900; letter-spacing: 4px; 
            color: var(--iron-gold); text-shadow: 0 0 20px #000; margin-bottom: 10px; 
        }
        #output-text { 
            font-family: var(--font-mono); font-size: 1.15rem; color: #ddd; min-height: 60px; 
        }

        /* BOUTON MICRO */
        footer { 
            height: 110px; background: #000; border-top: 2px solid #222; display: flex; justify-content: center; align-items: center; 
        }
        #mic-fab {
            width: 80px; height: 80px; border-radius: 50%; background: var(--iron-blue); border: 4px solid #444; 
            color: #fff; font-size: 2rem; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: all 0.3s; box-shadow: 0 0 30px rgba(0, 180, 219, 0.6);
        }
        #mic-fab.active {
            background: var(--iron-red); border-color: #db0000; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .typewriter::after { content: "▌"; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <header>
        <div class="brand">JARVIS <span style="font-size:0.6em;color:#666">// IRON MAN</span></div>
        <div class="status" id="status">ONLINE • ÉCOUTE ACTIVE</div>
    </header>

    <div id="hologram">
        <!-- VISUALISEUR -->
        <div id="viz-container">
            <div class="bar-label"><span>INPUT LEVEL</span> <span class="metric-val" id="vol">0 dB</span></div>
            <div class="bar-track"><div id="bar-vol" class="bar-fill" style="background:var(--iron-red);"></div></div>

            <div class="bar-label"><span>AGITATION</span> <span id="aggro-val">0%</span></div>
            <div class="bar-track"><div id="aggro-fill" class="bar-fill" style="background:var(--iron-red);"></div></div>

            <div class="bar-label"><span>ÉMOTION</span> <span id="emotion-val">STABLE</span></div>
        </div>

        <!-- AFFICHAGE TEXTE -->
        <div id="display-area">
            <div id="input-text">EN ATTENTE...</div>
            <div id="output-text" class="typewriter">JARVIS PRÊT • PARLE MAINTENANT</div>
        </div>
    </div>

    <footer>
        <div id="mic-fab" onclick="toggleMic()">🎙️</div>
    </footer>

    <script>
        // ==============================================
        // JARVIS v43.0 - IRON MAN (VERSION CORRIGÉE)
        // Écoute en français + TRADUCTION + PARLE (TTS)
        // ==============================================

        let recognition, audioCtx, analyser, dataArray;
        let isListening = false;
        let voicesLoaded = false;

        // ================== AUDIO VISUALISEUR ==================
        const AudioEngine = {
            init: async function() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 2048;
                    const source = audioCtx.createMediaStreamSource(stream);
                    source.connect(analyser);
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                    this.loop();
                    return true;
                } catch(e) {
                    alert("❌ Micro refusé ou non disponible.");
                    return false;
                }
            },
            loop: function() {
                if (!analyser) return;
                requestAnimationFrame(() => this.loop());
                
                analyser.getByteFrequencyData(dataArray);
                let sum = 0, bass = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                    if (i < dataArray.length * 0.25) bass += dataArray[i];
                }
                
                const volume = Math.min(100, Math.round((sum / dataArray.length) * 2));
                const agitation = Math.round((bass / dataArray.length) * 120);
                
                // Mise à jour visuelle
                document.getElementById('vol').textContent = volume + " dB";
                document.getElementById('bar-vol').style.width = volume + "%";
                document.getElementById('aggro-val').textContent = agitation + "%";
                document.getElementById('aggro-fill').style.width = Math.min(100, agitation) + "%";
                
                // Couleur émotion
                const emotionEl = document.getElementById('emotion-val');
                if (agitation > 65) {
                    emotionEl.textContent = "TOXIQUE";
                    emotionEl.style.color = "var(--iron-red)";
                } else if (volume < 15) {
                    emotionEl.textContent = "SILENCE";
                    emotionEl.style.color = "#666";
                } else {
                    emotionEl.textContent = "STABLE";
                    emotionEl.style.color = "var(--iron-blue)";
                }
            }
        };

        // ================== RECONNAISSANCE VOCALE (français) ==================
        const SpeechSys = {
            init: function() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("❌ Ton navigateur ne supporte pas la reconnaissance vocale (utilise Chrome).");
                    return;
                }
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.lang = 'fr-FR'; // Écoute tout en français (tu peux parler anglais, il captera parfois)

                recognition.onresult = (event) => {
                    let finalText = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
                    }
                    if (finalText.trim()) {
                        Brain.process(finalText);
                    }
                };

                recognition.onerror = () => console.log("Erreur micro");
                recognition.onend = () => {
                    if (isListening) setTimeout(() => recognition.start(), 200);
                };
            },
            start: function() {
                if (recognition) recognition.start();
            },
            stop: function() {
                if (recognition) recognition.stop();
            }
        };

        // ================== CERVEAU + TRADUCTION + RÉPONSE ==================
        const Brain = {
            process: function(text) {
                const inputEl = document.getElementById('input-text');
                const outputEl = document.getElementById('output-text');
                
                inputEl.textContent = text.toUpperCase();
                
                // "Traduction" : on force une réponse en français clair
                let reply = `J'ai entendu et traduit : "${text}". `;
                
                // Analyse émotion
                const agitation = parseInt(document.getElementById('aggro-val').textContent);
                if (agitation > 60) {
                    reply += "Tu parles fort ! Calme-toi, Tony Stark n'aime pas le stress.";
                } else if (agitation < 20) {
                    reply += "Signal faible. Parle plus fort pour que je te comprenne parfaitement.";
                } else {
                    reply += "Tout est clair. Que puis-je faire pour toi ?";
                }
                
                outputEl.textContent = reply;
                
                // JARVIS PARLE (voix grave Iron Man)
                Voice.speak(reply);
            }
        };

        // ================== SYNTHÈSE VOCALE (TTS) ==================
        const Voice = {
            speak: function(text) {
                if (!('speechSynthesis' in window)) return;
                
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.95;
                utterance.pitch = 0.65;   // Voix grave "Iron Man"
                utterance.volume = 0.95;
                
                // Essayer de choisir une voix française grave
                const voices = window.speechSynthesis.getVoices();
                const ironVoice = voices.find(v => 
                    (v.lang.includes('fr') || v.lang.includes('FR')) && 
                    (v.name.toLowerCase().includes('google') || v.name.toLowerCase().includes('français'))
                );
                if (ironVoice) utterance.voice = ironVoice;
                
                window.speechSynthesis.speak(utterance);
            }
        };

        // ================== BOUTON MICRO ==================
        function toggleMic() {
            isListening = !isListening;
            const fab = document.getElementById('mic-fab');
            
            if (isListening) {
                fab.classList.add('active');
                fab.innerHTML = '⏹️';
                document.getElementById('status').textContent = "ÉCOUTE ACTIVE • TRADUCTION EN COURS";
                SpeechSys.start();
            } else {
                fab.classList.remove('active');
                fab.innerHTML = '🎙️';
                document.getElementById('status').textContent = "ONLINE • PAUSE";
                SpeechSys.stop();
            }
        }

        // ================== DÉMARRAGE ==================
        window.onload = async () => {
            // Charger les voix TTS
            window.speechSynthesis.getVoices();
            
            const audioOK = await AudioEngine.init();
            if (audioOK) {
                SpeechSys.init();
                // Démarrage automatique
                setTimeout(() => {
                    toggleMic();
                }, 800);
            }
            
            // Message de bienvenue parlé
            setTimeout(() => {
                Voice.speak("Système JARVIS v43.0 activé. Je traduis et je parle tout ce que tu dis.");
            }, 1200);
        };
    </script>
</body>
</html>
