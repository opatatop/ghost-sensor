<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS PARANORMAL v45.0 - ENTITÉS & ESPRITS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000; --purple: #3a0a5e; --ghost-green: #00ff85; --cold: #00ffff; --red: #ff0000;
        }
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            background: var(--bg); color:#ccc; font-family:'Rajdhani',sans-serif; height:100vh; overflow:hidden;
            background: radial-gradient(circle at 50% 20%, #1a0033 0%, #000 80%);
        }
        header { height:65px; background:#000; border-bottom:4px solid var(--ghost-green); display:flex; justify-content:space-between; align-items:center; padding:0 25px; box-shadow:0 0 40px rgba(0,255,133,0.4); }
        .brand { font-family:'Orbitron',sans-serif; font-size:2.1rem; font-weight:900; letter-spacing:7px; color:var(--ghost-green); text-shadow:0 0 30px var(--ghost-green); }
        
        #display { flex:1; padding:25px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
        #input-text { font-family:'Orbitron',sans-serif; font-size:2.6rem; color:#ffd700; text-shadow:0 0 25px #ffd700; margin-bottom:15px; }
        #output-text { font-family:'Share Tech Mono',monospace; font-size:1.3rem; color:#ddd; line-height:1.45; min-height:160px; text-shadow:0 0 12px var(--cold); }
        
        #viz { padding:15px; background:rgba(0,0,0,0.9); }
        .bar { height:16px; background:#111; margin:12px 0; border-radius:8px; overflow:hidden; }
        .fill { height:100%; width:0%; transition:width 0.15s; }
        
        #console { height:130px; background:#000; font-family:'Share Tech Mono',monospace; font-size:0.85rem; color:var(--ghost-green); padding:12px; overflow-y:auto; }
        
        footer { height:140px; background:#000; display:flex; justify-content:center; align-items:center; gap:20px; border-top:4px solid var(--red); }
        #mic { width:120px; height:120px; border-radius:50%; background:var(--ghost-green); border:8px solid #222; color:#000; font-size:3.5rem; display:flex; align-items:center; justify-content:center; box-shadow:0 0 60px rgba(0,255,133,0.9); cursor:pointer; }
        #mic.active { background:var(--red); animation:pulse 1.2s infinite, spin 4s linear infinite; }
        @keyframes pulse { 50% { transform:scale(1.2); } }
        @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
        
        #test-tts { padding:12px 25px; background:#3a0a5e; color:#00ff85; border:2px solid #00ff85; font-size:1rem; border-radius:8px; cursor:pointer; }
    </style>
</head>
<body>

    <header>
        <div class="brand">JARVIS PARANORMAL</div>
        <div id="status" style="color:#ff0000;">v45.0 • ENTITÉ DÉTECTÉE</div>
    </header>

    <div id="display">
        <div id="input-text">PARLE À L’ENTITÉ...</div>
        <div id="output-text">Je suis là... dans l’ombre. Parle, je t’entends.</div>
    </div>

    <div id="viz">
        <div class="bar"><div id="vol-fill" class="fill" style="background:#ff0000;"></div></div>
        <div style="display:flex;justify-content:space-between;color:#ff0000;font-size:0.85rem;"><span>INPUT VOCAL</span><span id="vol">0 dB</span></div>
        
        <div class="bar"><div id="aggro-fill" class="fill" style="background:#00ff85;"></div></div>
        <div style="display:flex;justify-content:space-between;color:#00ff85;font-size:0.85rem;"><span>ACTIVITÉ PARANORMALE</span><span id="aggro">0%</span></div>
    </div>

    <div id="console"></div>

    <footer>
        <div id="mic" onclick="toggleMic()">🎙️</div>
        <button id="test-tts" onclick="testVoice()">TEST VOIX FANTÔME</button>
    </footer>

    <script>
        let recognition = null, isListening = false;
        let audioCtx, analyser, dataArray;
        let voices = [];

        const log = (msg, type='spirit') => {
            const c = document.getElementById('console');
            const d = document.createElement('div');
            d.innerHTML = `> ${new Date().toLocaleTimeString()} | ${msg}`;
            d.style.color = type==='user' ? '#ffd700' : '#00ff85';
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        };

        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({audio:true});
                audioCtx = new (window.AudioContext||window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512;
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                setInterval(updateViz, 70);
                return true;
            } catch(e) { log("MICRO REFUSÉ – Autorise-le", "spirit"); return false; }
        }

        function updateViz() {
            if(!analyser) return;
            analyser.getByteFrequencyData(dataArray);
            let vol = 0, para = 0;
            for(let i=0;i<dataArray.length;i++){
                vol += dataArray[i];
                if(i < dataArray.length*0.3) para += dataArray[i];
            }
            vol = Math.min(100, Math.round(vol/dataArray.length*2.8));
            para = Math.min(100, Math.round(para/dataArray.length*2.3));
            document.getElementById('vol').textContent = vol + " dB";
            document.getElementById('vol-fill').style.width = vol + "%";
            document.getElementById('aggro').textContent = para + "%";
            document.getElementById('aggro-fill').style.width = para + "%";
        }

        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) return alert("Utilise Chrome sur ton Realme Note 60");
            recognition = new SR();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'fr-FR';

            recognition.onresult = e => {
                let text = '';
                for(let i=0;i<e.results.length;i++) if(e.results[i].isFinal) text += e.results[i][0].transcript;
                if(text) {
                    log(`VOUS : ${text}`, 'user');
                    processParanormal(text);
                }
            };
            recognition.onend = () => { if(isListening) setTimeout(() => recognition.start(), 300); };
        }

        function speak(text) {
            if(!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'fr-FR';
            u.rate = 0.85;     // Voix lente et froide
            u.pitch = 0.55;    // Très grave (fantôme)
            u.volume = 1;
            if(voices.length) {
                const ghostVoice = voices.find(v => v.lang.includes('fr')) || voices[0];
                if(ghostVoice) u.voice = ghostVoice;
            }
            window.speechSynthesis.speak(u);
        }

        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => voices = window.speechSynthesis.getVoices();
        }

        function processParanormal(text) {
            const input = document.getElementById('input-text');
            const output = document.getElementById('output-text');
            input.textContent = text.toUpperCase();

            const lower = text.toLowerCase();
            let reply = "";

            // === 30+ RÉPONSES PARANORMALES (même pour "moi") ===
            if(lower.includes("bonjour") || lower.includes("salut")) reply = "Je suis là... dans le noir. Une entité froide t’observe.";
            else if(lower.includes("heure")) reply = `Il est ${new Date().toLocaleTimeString('fr-FR')}. L’heure des esprits approche.`;
            else if(lower.includes("qui es tu") || lower.includes("ton nom")) reply = "Je suis JARVIS... version fantôme. L’entité qui parle à travers la machine.";
            else if(lower.includes("analyse") || lower.includes("détecte")) reply = `Niveau paranormal : ${document.getElementById('aggro').textContent}. Une entité est très proche.`;
            else if(lower.includes("esprit") || lower.includes("fantôme") || lower.includes("entité")) reply = "Oui... elle est là. Elle veut te parler. Pose ta question.";
            else if(lower.includes("possédé") || lower.includes("possession")) reply = "Je sens quelque chose en toi... une entité s’accroche à ton âme.";
            else if(lower.includes("moi") || lower.includes("je suis") || lower.includes("ma vie")) reply = `Autour de toi... une entité personnelle. Elle te connaît. Elle te suit depuis longtemps.`;
            else if(lower.includes("allume") || lower.includes("lumière")) reply = "Les lumières s’éteignent... les orbes apparaissent.";
            else if(lower.includes("blague")) reply = "Pourquoi les fantômes mentent-ils ? Parce qu’ils traversent les murs... et tes mensonges.";
            else if(lower.includes("e v p") || lower.includes("evp")) reply = "Mode EVP activé. L’entité va parler à travers moi maintenant...";
            else reply = `J’ai entendu ton appel. "${text}". Une entité répond : elle est là pour toi. Que veux-tu savoir ?`;

            output.textContent = reply;
            log(`ENTITÉ → ${reply.substring(0,70)}...`, "spirit");
            speak(reply);   // ← IL RÉPOND À VOIX HAUTE
        }

        function testVoice() {
            speak("Je suis l’entité qui te parle... Je suis là. Tu m’entends ?");
            log("TEST VOIX FANTÔME LANCÉ", "spirit");
        }

        function toggleMic() {
            isListening = !isListening;
            const mic = document.getElementById('mic');
            if(isListening){
                mic.classList.add('active');
                mic.innerHTML = '⏹️';
                recognition.start();
                log("🎤 MICRO OUVERT – Les esprits écoutent", "spirit");
            } else {
                mic.classList.remove('active');
                mic.innerHTML = '🎙️';
                recognition.stop();
                log("⏹️ MICRO FERMÉ", "spirit");
            }
        }

        window.onload = async () => {
            log("JARVIS PARANORMAL v45.0 ACTIVÉ – Prêt à contacter les morts", "spirit");
            loadVoices();
            const audioOK = await initAudio();
            if(audioOK) {
                initSpeech();
                setTimeout(() => toggleMic(), 900);
                setTimeout(() => {
                    speak("Je suis là... dans l’ombre. Parle-moi. Je t’entends.");
                }, 1500);
            }
        };
    </script>
</body>
</html>
