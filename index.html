<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>JARVIS MACGYVER</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--fg:#00ff41;--dim:#00aa2a;--muted:#006618;--red:#ff0033;--blue:#00ccff;--orange:#ff6600;--panel:#0a0a0a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;color:var(--fg);font-family:VT323,monospace}
button,input,select,textarea{font-family:VT323,monospace;font-size:16px}
.btn{background:transparent;border:3px solid var(--fg);color:var(--fg);padding:12px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.btn:active{background:var(--fg);color:#000}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.blue{border-color:var(--blue);color:var(--blue)}
.btn.on{background:var(--fg)!important;color:#000!important}
.btn.sm{min-height:42px;padding:8px 10px}
.btntitle{font-size:18px}
.btndesc{font-size:11px;color:var(--muted)}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid var(--fg);text-align:center;padding:20px;z-index:20}
#boot h1{font-size:28px;letter-spacing:2px}
#boot p{color:var(--red);margin:10px 0}
#boot .acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}
#boot .acts .btn{min-width:160px;min-height:70px;font-size:20px}
#app{display:none;position:fixed;inset:0;border:3px solid var(--fg);flex-direction:column}
#app.show{display:flex}
header{display:flex;align-items:center;justify-content:space-between;padding:8px;border-bottom:2px solid var(--fg);background:var(--panel)}
header .title{flex:1;text-align:center;font-size:14px}
main{flex:1;overflow:auto;padding:10px;padding-bottom:52px;display:flex;flex-direction:column;gap:8px}
footer{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:8px 10px;border-top:2px solid var(--fg);background:var(--panel);font-size:12px}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar .btn{width:100%;min-height:64px}
.live{border:2px solid var(--fg);background:#050505;padding:12px 10px;position:relative;min-height:72px}
.live .lab{position:absolute;top:-9px;left:8px;background:#050505;padding:0 5px;font-size:11px}
.live .badge{position:absolute;top:6px;right:8px;border:1px solid var(--muted);color:var(--muted);padding:2px 8px;font-size:12px}
.live .badge.listen{color:var(--blue);border-color:var(--blue)}
.live .badge.rec{color:var(--red);border-color:var(--red)}
.live .badge.speak{color:var(--blue);border-color:var(--blue)}
.live .badge.stop{color:var(--red);border-color:var(--red)}
.live .txt{margin-top:12px;font-size:16px}
.live .txt.dim{color:var(--muted);font-size:13px}
.live .txt.red{color:var(--red)}
.inputrow{display:flex;border:2px solid var(--dim);background:#050505}
.inputrow .pre{padding:10px;border-right:2px solid var(--dim);color:var(--dim)}
.inputrow input{flex:1;border:0;background:transparent;color:var(--fg);padding:10px;outline:0}
.inputrow button{border:0;border-left:2px solid var(--dim);background:rgba(0,255,65,.12);color:var(--fg);padding:0 14px}
.out,.logbox{border:2px dashed var(--dim);background:#050505;padding:10px;min-height:70px;max-height:170px;overflow:auto;white-space:pre-wrap;font-size:14px}
.logbox{border-color:var(--orange);font-size:12px}
.logbox .err{color:var(--red)}
.logbox .info{color:var(--orange)}
.logbox .qa{color:var(--fg)}
.sys{font-size:12px;color:var(--muted)}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;padding:10px 14px;border:2px solid var(--fg);background:var(--panel);opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{border-color:var(--red);color:var(--red)}
dialog{border:3px solid var(--fg);background:#000;color:var(--fg);width:95vw;max-width:680px;max-height:90vh;padding:0;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.92)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:2px solid var(--fg);position:sticky;top:0;background:#000}
.db{padding:12px}
.df{display:flex;gap:10px;justify-content:center;padding:12px;border-top:2px solid var(--muted);position:sticky;bottom:0;background:#000}
.sec{color:var(--red);margin:12px 0 8px}
.fl{margin-bottom:10px}
.fl input,.fl select,.fl textarea{width:100%;padding:10px;background:#050505;border:2px solid var(--dim);color:var(--fg)}
.fl textarea{min-height:54px}
.check{display:flex;gap:10px;align-items:center}
#keystatus{margin-top:6px;padding:8px;border:1px dashed var(--dim)}
#keystatus.ok{border-color:var(--fg);color:var(--fg)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--orange);line-height:1.35;margin:8px 0;border:1px solid var(--orange);padding:8px}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <div class="dh"><span>PARAMÈTRES MACGYVER</span><button class="btn sm" id="x" type="button">FERMER</button></div>
  <div class="db">
    <div class="hint">Alertes précises et utiles. Ex: « Porte qui claque. Courant d'air ou quelqu'un ? » — pas de roman, pas de liste technique.</div>
    <div class="sec">CLÉ GROQ</div>
    <div class="fl"><textarea id="key" placeholder="gsk_..." spellcheck="false"></textarea><div id="keystatus">Aucune clé</div></div>
    <div class="grid3">
      <button class="btn blue sm" id="paste" type="button">COLLER</button>
      <button class="btn sm" id="savekey" type="button">SAUVER</button>
      <button class="btn blue sm" id="test" type="button">TESTER</button>
    </div>
    <div class="sec">OPTIONS</div>
    <div class="fl"><label class="check"><input type="checkbox" id="agentMode" checked> Agent ambiance</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="reportSpeech" checked> Paroles autour</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="always" checked> Sans mot d'appel</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="noise" checked> Bruits / porte / vibration</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="speakNoise" checked> Annoncer les alertes</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="smartAlert" checked> Alerte utile (MacGyver)</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="tts" checked> Voix</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="wakelock" checked> Écran allumé</label></div>
    <div class="sec">IA</div>
    <div class="fl"><label>Modèle</label>
      <select id="model">
        <option value="llama-3.1-8b-instant">llama-3.1-8b-instant (rapide)</option>
        <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
      </select>
    </div>
    <div class="fl"><label>Nom</label><input id="aiName" value="Jarvis"></div>
    <div class="fl"><label>Mots stop</label><input id="stopw" value="stop,arrête,arrete,tais-toi,silence"></div>
    <div class="fl"><label>Mots d'appel</label><input id="wake" value="jarvis,kitt,hey,ok"></div>
  </div>
  <div class="df"><button class="btn" id="save" type="button" style="min-width:140px;min-height:54px">SAUVER</button></div>
</dialog>

<section id="boot">
  <h1>JARVIS MACGYVER</h1>
  <p>PRÉCIS · UTILE · RAPIDE</p>
  <div class="acts">
    <button class="btn" id="go" type="button"><span class="btntitle">LANCER</span><span class="btndesc">Start</span></button>
    <button class="btn blue" id="cfg" type="button"><span class="btntitle">PARAMÈTRES</span><span class="btndesc">Clé</span></button>
  </div>
</section>

<div id="app">
  <header>
    <button class="btn sm" id="cfg2" type="button">MENU</button>
    <div class="title"><span id="nameTag">Jarvis</span> — <span id="mode">OFF</span></div>
    <button class="btn sm red" id="halt" type="button">STOP</button>
  </header>
  <main>
    <div class="bar">
      <button class="btn blue" id="auto" type="button"><span class="btntitle">AUTO</span><span class="btndesc">Écoute</span></button>
      <button class="btn" id="comp" type="button"><span class="btntitle">24/7</span><span class="btndesc">Permanent</span></button>
      <button class="btn" id="agentBtn" type="button"><span class="btntitle">AGENT</span><span class="btndesc">Autour</span></button>
      <button class="btn" id="mute" type="button"><span class="btntitle">SON ON</span><span class="btndesc">Voix</span></button>
      <button class="btn red" id="clr" type="button"><span class="btntitle">EFFACER</span><span class="btndesc">Vider</span></button>
      <button class="btn" id="export" type="button"><span class="btntitle">LOG</span><span class="btndesc">Export</span></button>
    </div>
    <div class="live">
      <div class="lab">STATUT</div>
      <div class="badge" id="badge">PRÊT</div>
      <div class="txt dim" id="live">En attente</div>
    </div>
    <div class="inputrow">
      <div class="pre">&gt;</div>
      <input id="txt" placeholder="Message… ou stop" autocomplete="off">
      <button type="button" id="send">OK</button>
    </div>
    <div class="out" id="out">…</div>
    <div class="logbox" id="log"></div>
    <div class="sys" id="sys">—</div>
    <div class="sys" id="stats">—</div>
  </main>
  <footer><span id="status">OFF</span><span>MACGYVER · <span id="clock">--:--:--</span></span></footer>
</div>

<script>
(function(){
'use strict';

var GROQ='https://api.groq.com/openai/v1';
var S_CFG='jarvis_mac_cfg';
var S_LOG='jarvis_mac_log';

var cfg={
  key:'', model:'llama-3.1-8b-instant', lang:'fr', tts:true, aiName:'Jarvis',
  agentMode:true, reportSpeech:true, always:true,
  noise:true, speakNoise:true, smartAlert:true, wakelock:true,
  sens:3, noiseVol:6, silence:550, maxRecord:6, gapMs:1000, coolSec:14,
  temp:0.2, maxTokens:70, rate:1.05,
  wakeWords:'jarvis,kitt,hey,ok',
  stopWords:'stop,arrête,arrete,tais-toi,silence'
};

var st={
  stream:null,ctx:null,an:null,volNode:null,fdata:null,vdata:null,
  auto:false,comp:false,speaking:false,hardStop:false,muted:false,
  loopId:0,ready:false,hist:[],fullLog:[],ctrl:null,reqs:0,lat:0,
  lastVol:0,lastBass:0,lastMid:0,lastHigh:0,
  recentSays:[], lastEvent:'', lastEventAt:0,
  motionMag:0, impactLevel:0, gravity:{x:0,y:9.8,z:0}, wake:null
};

function $(s){return document.querySelector(s)}
function now(){return new Date().toLocaleTimeString('fr-FR')}
function delay(ms){return new Promise(function(r){setTimeout(r,ms)})}
function norm(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function cleanKey(k){return String(k||'').replace(/[\u200B-\u200D\uFEFF\u00A0\r\n\t ]+/g,'').trim()}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function cleanSpeech(t){return String(t||'').replace(/[*|#`]+/g,' ').replace(/\s+/g,' ').trim()}
function aiName(){return (cfg.aiName||'Jarvis').trim()||'Jarvis'}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function safeGet(k,f){try{var v=localStorage.getItem(k);return v==null?f:v}catch(e){return f}}

function toast(msg,type){
  var el=$('#toast'); if(!el) return;
  el.textContent=msg; el.className='toast '+(type||'')+' show';
  clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove('show')},2200);
}
function log(m,t){
  t=t||'ok';
  var el=$('#log');
  if(el){
    var d=document.createElement('div'); d.className=t; d.textContent='['+now()+'] '+m;
    el.appendChild(d); el.scrollTop=el.scrollHeight;
    while(el.children.length>45) el.firstChild.remove();
  }
  st.fullLog.push('['+now()+'] ['+(t==='err'?'ERR':t==='qa'?'QA':'INFO')+'] '+m);
  if(st.fullLog.length>500) st.fullLog=st.fullLog.slice(-400);
  safeSet(S_LOG, JSON.stringify(st.fullLog.slice(-150)));
}
function live(txt,mode){
  var t=$('#live'), b=$('#badge'); if(!t||!b) return;
  t.className='txt'; b.className='badge';
  if(mode==='listen'){t.classList.add('dim'); t.textContent=txt; b.textContent='ÉCOUTE'; b.classList.add('listen')}
  else if(mode==='rec'){t.classList.add('red'); t.textContent=txt; b.textContent='REC'; b.classList.add('rec')}
  else if(mode==='think'){t.textContent=txt; b.textContent='…'}
  else if(mode==='speak'){t.textContent=txt; b.textContent='PARLE'; b.classList.add('speak')}
  else if(mode==='stop'){t.classList.add('red'); t.textContent=txt; b.textContent='STOP'; b.classList.add('stop')}
  else {t.classList.add('dim'); t.textContent=txt; b.textContent='PRÊT'}
}
function showOut(text){
  var el=$('#out'); if(!el) return;
  var d=document.createElement('div');
  d.textContent='['+now()+'] '+text;
  d.style.color='var(--fg)'; d.style.margin='3px 0';
  el.appendChild(d); el.scrollTop=el.scrollHeight;
  while(el.children.length>20) el.firstChild.remove();
}
function sys(){
  var el=$('#sys'); if(el) el.textContent='Micro '+(st.stream?'ON':'OFF')+' · '+(st.comp?'24/7':(st.auto?'AUTO':'OFF'))+(cfg.agentMode?' · AGENT':'');
  var s=$('#stats'); if(s) s.textContent=st.reqs+' req · '+(st.lat||'—')+' ms';
}

function getKey(){
  var from=$('#key')&&$('#key').value?cleanKey($('#key').value):'';
  var k=from||cleanKey(cfg.key);
  if(k&&k!==cfg.key){cfg.key=k; safeSet(S_CFG, JSON.stringify(cfg))}
  return k;
}
function hasKey(){return (getKey()||'').length>=20}
function isStop(t){
  var n=norm(t); if(!n) return false;
  return (cfg.stopWords||'').split(',').some(function(w){w=norm(w); return w&&(n===w||n.indexOf(w)!==-1)}) || /^(stop|arrete|arrête|silence)/.test(n);
}
function isGarbage(t){
  t=String(t||'').trim();
  if(t.length<2) return true;
  if(t.replace(/[^a-zA-Zà-üÀ-Ü0-9]/gi,'').length<2) return true;
  var n=norm(t);
  var junk=['sous-titrage','subtitle','netflix','youtube','musique','st\'','st '];
  for(var i=0;i<junk.length;i++) if(n.indexOf(junk[i])!==-1 && n.length<30) return true;
  // charabia: trop de mots rares collés sans structure
  if(t.length>80 && (t.match(/\s+/g)||[]).length>12) {
    // laisse passer, géré plus bas
  }
  return false;
}
function isNonsense(t){
  var n=norm(t);
  if(!n || n.length<3) return true;
  // très cassé / absurde court
  if(n.split(/\s+/).length>=6){
    var weird=0;
    var words=n.split(/\s+/);
    for(var i=0;i<words.length;i++){
      if(words[i].length>=8) weird++;
    }
    // pas un vrai test linguistique, mais aide sur les délires STT
  }
  return false;
}

/* anti-répétition */
function tooSimilar(a,b){
  a=norm(a); b=norm(b);
  if(!a||!b) return false;
  if(a===b) return true;
  if(a.length>10 && b.indexOf(a)!==-1) return true;
  if(b.length>10 && a.indexOf(b)!==-1) return true;
  var wa=a.split(/\s+/), wb=b.split(/\s+/), hit=0;
  for(var i=0;i<wa.length;i++) if(wa[i].length>3 && wb.indexOf(wa[i])!==-1) hit++;
  return hit>=Math.max(2, Math.floor(wa.length*0.55));
}
function alreadySaid(text){
  for(var i=0;i<st.recentSays.length;i++) if(tooSimilar(text, st.recentSays[i])) return true;
  return false;
}
function rememberSay(text){
  st.recentSays.unshift(String(text||''));
  if(st.recentSays.length>12) st.recentSays=st.recentSays.slice(0,12);
}
function eventCooldown(type, ms){
  ms=ms||(cfg.coolSec*1000);
  if(st.lastEvent===type && Date.now()-st.lastEventAt<ms) return true;
  st.lastEvent=type; st.lastEventAt=Date.now();
  return false;
}

/* classification ambiance */
function classifyRaw(){
  if(st.impactLevel>=2 || st.motionMag>18){
    if(st.lastVol>=cfg.noiseVol && st.lastBass>=st.lastMid) return 'door';
    return 'vibration';
  }
  if(st.lastVol>=cfg.noiseVol+1 && st.lastBass>=st.lastMid+5 && st.lastBass>=st.lastHigh+5) return 'door';
  if(st.lastVol>=cfg.sens && st.lastMid>=st.lastBass && st.lastMid>=st.lastHigh-2) return 'voice';
  if(st.lastVol>=cfg.noiseVol) return 'noise';
  return '';
}

/** MacGyver: précise + utile, 1-2 phrases max */
function macAlert(type){
  if(!cfg.smartAlert){
    if(type==='door') return 'Porte.';
    if(type==='vibration') return 'Vibration.';
    if(type==='voice') return 'Voix.';
    return 'Bruit.';
  }
  if(type==='door'){
    // style demandé: précise ce qu'il entend + doute utile
    if(st.impactLevel>=2 || st.lastVol>=12)
      return "Porte qui claque. Courant d'air, ou quelqu'un ?";
    return "Bruit de porte. Possible courant d'air, ou présence.";
  }
  if(type==='vibration') return 'Vibration / choc. Je surveille.';
  if(type==='voice') return "Voix détectée près de toi.";
  if(type==='noise'){
    if(st.lastBass>st.lastMid+4) return 'Bruit grave. Possible porte, moteur ou voix grave.';
    if(st.lastMid>=st.lastBass) return 'Bruit médium. Possible voix ou objet.';
    return 'Bruit net. Je reste attentif.';
  }
  return 'Bruit.';
}

/* audio */
function releaseMic(){
  try{ if(st.stream) st.stream.getTracks().forEach(function(t){try{t.stop()}catch(e){}})}catch(e){}
  st.stream=null; st.ready=false; st.an=null; st.volNode=null; st.fdata=null; st.vdata=null;
  try{ if(st.ctx&&st.ctx.state!=='closed'){ var c=st.ctx; st.ctx=null; c.close().catch(function(){}) } }catch(e){}
  sys();
}
function ensureMic(){
  if(st.hardStop) return Promise.resolve(false);
  if(st.stream&&st.ready&&st.ctx){ try{ if(st.ctx.state==='suspended') st.ctx.resume() }catch(e){} return Promise.resolve(true); }
  try{
    if(!st.ctx||st.ctx.state==='closed') st.ctx=new (window.AudioContext||window.webkitAudioContext)();
    return st.ctx.resume().then(function(){
      return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}});
    }).then(function(stream){
      st.stream=stream;
      var src=st.ctx.createMediaStreamSource(stream);
      st.an=st.ctx.createAnalyser(); st.an.fftSize=2048; st.an.smoothingTimeConstant=0.6; src.connect(st.an);
      st.fdata=new Uint8Array(st.an.frequencyBinCount);
      st.volNode=st.ctx.createAnalyser(); st.volNode.fftSize=256; src.connect(st.volNode);
      st.vdata=new Uint8Array(st.volNode.frequencyBinCount);
      st.ready=true; sys(); return true;
    }).catch(function(e){ log('Micro: '+(e.message||e),'err'); return false; });
  }catch(e){ log('Micro: '+(e.message||e),'err'); return Promise.resolve(false); }
}
function vol(){
  if(!st.volNode||!st.vdata) return 0;
  st.volNode.getByteFrequencyData(st.vdata);
  var s=0; for(var i=0;i<st.vdata.length;i++) s+=st.vdata[i];
  return s/st.vdata.length;
}
function bands(){
  if(!st.an||!st.fdata) return {bass:0,mid:0,high:0};
  st.an.getByteFrequencyData(st.fdata);
  var n=st.fdata.length,a=Math.floor(n*0.1),b=Math.floor(n*0.4);
  var bass=0,mid=0,high=0,c1=0,c2=0,c3=0;
  for(var i=0;i<n;i++){
    var v=st.fdata[i];
    if(i<a){bass+=v;c1++} else if(i<b){mid+=v;c2++} else {high+=v;c3++}
  }
  return {bass:c1?Math.round(bass/c1):0, mid:c2?Math.round(mid/c2):0, high:c3?Math.round(high/c3):0};
}
function getMime(){
  var list=['audio/webm;codecs=opus','audio/webm','audio/mp4'];
  for(var i=0;i<list.length;i++) if(window.MediaRecorder&&MediaRecorder.isTypeSupported(list[i])) return list[i];
  return '';
}
function initMotion(){
  function onAccel(e){
    if(!e||!e.accelerationIncludingGravity) return;
    var a=e.accelerationIncludingGravity,rx=a.x||0,ry=a.y||0,rz=a.z||0,α=0.8;
    st.gravity.x=α*st.gravity.x+(1-α)*rx;
    st.gravity.y=α*st.gravity.y+(1-α)*ry;
    st.gravity.z=α*st.gravity.z+(1-α)*rz;
    var lx=rx-st.gravity.x,ly=ry-st.gravity.y,lz=rz-st.gravity.z;
    var mag=Math.sqrt(lx*lx+ly*ly+lz*lz);
    st.motionMag=mag;
    if(mag>28){ st.impactLevel=3; setTimeout(function(){st.impactLevel=0},1200); }
    else if(mag>16){ st.impactLevel=2; setTimeout(function(){st.impactLevel=0},900); }
  }
  if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){
    DeviceMotionEvent.requestPermission().then(function(s){ if(s==='granted') window.addEventListener('devicemotion',onAccel,true); }).catch(function(){});
  } else window.addEventListener('devicemotion',onAccel,true);
}

function stopTTS(){ try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} st.speaking=false; }
function speak(text){
  if(!cfg.tts||st.muted||st.hardStop) return Promise.resolve();
  var cleaned=cleanSpeech(text); if(!cleaned) return Promise.resolve();
  return new Promise(function(resolve){
    if(!window.speechSynthesis){ resolve(); return; }
    stopTTS();
    var u=new SpeechSynthesisUtterance(cleaned);
    u.lang='fr-FR'; u.rate=clamp(cfg.rate||1.05,0.7,1.3);
    st.speaking=true;
    var safety=setTimeout(function(){ st.speaking=false; resolve(); }, Math.min(14000, cleaned.length*130+1200));
    u.onend=function(){ clearTimeout(safety); st.speaking=false; resolve(); };
    u.onerror=function(){ clearTimeout(safety); st.speaking=false; resolve(); };
    speechSynthesis.speak(u);
  });
}

function transcribe(blob){
  var key=getKey(); if(!key) return Promise.resolve('');
  var fd=new FormData();
  fd.append('file', blob, 'a.webm');
  fd.append('model','whisper-large-v3');
  fd.append('language','fr');
  fd.append('response_format','json');
  fd.append('temperature','0');
  return fetch(GROQ+'/audio/transcriptions',{method:'POST', headers:{Authorization:'Bearer '+key}, body:fd})
    .then(function(r){ if(!r.ok) throw new Error('STT '+r.status); return r.json(); })
    .then(function(j){ return (j.text||'').trim(); })
    .catch(function(e){ log('STT: '+e.message,'err'); return ''; });
}

function systemPrompt(){
  return 'Tu es '+aiName()+', style MacGyver: concret, calme, utile, rapide.\n'+
    'RÈGLES:\n'+
    '- 1 à 2 phrases max.\n'+
    '- Pas de listes, pas de markdown, pas de roman.\n'+
    '- Si transcript incohérent/charabia: réponds seulement « J\'ai mal saisi. »\n'+
    '- N\'invente JAMAIS « je n\'entends rien » si un message audio vient d\'arriver.\n'+
    '- Si on te demande de l\'aide: réponse directe et pratique.\n'+
    '- Ambiance déjà gérée à part: ne refais pas un rapport technique.';
}

function callAI(messages, maxTokens){
  var key=getKey(); if(!key) return Promise.reject(new Error('Pas de clé'));
  var ctrl=new AbortController(); st.ctrl=ctrl;
  var tid=setTimeout(function(){ ctrl.abort(); }, 16000);
  return fetch(GROQ+'/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json', Authorization:'Bearer '+key},
    body:JSON.stringify({
      model:cfg.model,
      messages:messages,
      max_tokens:clamp(maxTokens||cfg.maxTokens,15,120),
      temperature:clamp(cfg.temp,0,0.5),
      top_p:0.85
    }),
    signal:ctrl.signal
  }).then(function(r){
    clearTimeout(tid);
    if(!r.ok) throw new Error('API '+r.status);
    return r.json();
  }).then(function(j){
    return cleanSpeech((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'');
  }).catch(function(e){
    clearTimeout(tid);
    if(e.name==='AbortError') throw new Error('Timeout');
    throw e;
  });
}

function addHist(role,content){
  st.hist.push({role:role, content:String(content).slice(0,700)});
  if(st.hist.length>14) st.hist=st.hist.slice(-10);
}

function announce(text){
  text=cleanSpeech(text);
  if(!text) return Promise.resolve();
  if(alreadySaid(text)){ log('Skip répéta: '+text,'info'); return Promise.resolve(); }
  rememberSay(text);
  showOut(text);
  log(text, text.indexOf('?')!==-1 || text.length>40 ? 'qa' : 'info');
  if(cfg.tts && !st.muted){
    live(text.slice(0,48),'speak');
    return speak(text);
  }
  return Promise.resolve();
}

function hardStop(){
  st.hardStop=true; st.auto=false; st.comp=false; st.loopId++;
  stopTTS();
  try{ if(st.ctrl) st.ctrl.abort(); }catch(e){}
  releaseMic();
  try{ if(st.wake){ st.wake.release(); st.wake=null; } }catch(e){}
  if($('#auto')) $('#auto').classList.remove('on');
  if($('#comp')) $('#comp').classList.remove('on');
  live('STOP','stop'); if($('#status')) $('#status').textContent='STOP'; if($('#mode')) $('#mode').textContent='STOP';
  log('STOP'); toast('Stop'); sys();
}

function waitSound(myId){
  return new Promise(function(resolve){
    var t0=0, sens=Math.max(2,cfg.sens||3);
    (function tick(){
      if(!st.auto||st.loopId!==myId||st.hardStop||st.speaking) return resolve(false);
      var v=vol();
      if(v>=sens || st.impactLevel>=2){
        if(!t0) t0=Date.now();
        if(Date.now()-t0>=70) return resolve(true);
      } else t0=0;
      requestAnimationFrame(tick);
    })();
  });
}

function recordUntilSilent(myId){
  return new Promise(function(resolve){
    if(!st.stream) return resolve(null);
    var mime=getMime(); if(!mime) return resolve(null);
    var rec; try{ rec=new MediaRecorder(st.stream,{mimeType:mime}); }catch(e){ return resolve(null); }
    var chunks=[];
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=function(){
      st.lastVol=vol();
      var b=bands(); st.lastBass=b.bass; st.lastMid=b.mid; st.lastHigh=b.high;
      resolve(new Blob(chunks,{type:rec.mimeType}));
    };
    var start=Date.now(), last=Date.now(), spoken=false;
    var maxMs=(cfg.maxRecord||6)*1000, sil=cfg.silence||550;
    rec.start(30);
    var iv=setInterval(function(){
      if(!st.auto||st.loopId!==myId||st.hardStop){ clearInterval(iv); if(rec.state==='recording') rec.stop(); return; }
      var v=vol();
      if(v>=Math.max(2,(cfg.sens||3)*0.25) || st.impactLevel>=2){ last=Date.now(); spoken=true; st.lastVol=v; }
      if(spoken && (Date.now()-last>=sil || Date.now()-start>=maxMs)){ clearInterval(iv); if(rec.state==='recording') rec.stop(); }
      if(!spoken && Date.now()-start>1300){ clearInterval(iv); if(rec.state==='recording') rec.stop(); }
    },30);
  });
}

function processUser(text){
  if(isStop(text)){ hardStop(); return Promise.resolve(); }
  if(!hasKey()){ toast('Clé manquante','err'); openSettings(); return Promise.resolve(); }

  // charabia STT → sec
  if(isNonsense(text) || (norm(text).split(/\s+/).length>=8 && /tarzan|barracuda|coteau|my guy/i.test(text))){
    // si clairement absurde
  }
  // heuristique simple: si ça ressemble à du bruit de mots collés sans ponctuation utile
  var words=norm(text).split(/\s+/).filter(Boolean);
  if(words.length>=7){
    var alpha=text.replace(/[^a-zA-Zà-üÀ-Ü]/gi,'').length;
    if(alpha>0 && text.length>40){
      // on laisse l'IA, mais avec ordre strict mal saisi si incohérent
    }
  }

  live('…','think');
  addHist('user', text);
  var sys=systemPrompt();
  if(st.recentSays.length) sys+='\nNe répète pas: '+st.recentSays.slice(0,4).join(' | ');
  var msgs=[{role:'system',content:sys}].concat(st.hist.slice(-8));
  var t0=Date.now();
  return callAI(msgs, 70).then(function(resp){
    st.lat=Date.now()-t0; st.reqs++;
    var r=resp||"J'ai mal saisi.";
    // bloque le délire "je n'entends rien"
    if(/n['’]entends? (aucun|pas|rien)|capteur reste immobile|je ne comprends pas bien ta demande/i.test(r)){
      r="J'ai mal saisi.";
    }
    if(alreadySaid(r)) r='Compris.';
    addHist('assistant', r);
    log('Entendu: « '+text+' »','qa');
    log('Réponse: '+r,'qa');
    return announce(r);
  }).catch(function(e){ log('API: '+e.message,'err'); toast('Erreur IA','err'); });
}

function handleAmbient(blob){
  var type=classifyRaw();

  // alerte locale d'abord (rapide, précis, MacGyver)
  if(type && cfg.noise && cfg.speakNoise){
    if(!eventCooldown('amb_'+type, (cfg.coolSec||14)*1000)){
      var line=macAlert(type);
      // si blob tout petit: que l'alerte
      if(!blob || blob.size<750){
        return announce(line).then(function(){ return delay(cfg.gapMs||1000); });
      }
      // sinon on annonce l'alerte bruit, puis on regarde s'il y a de la parole
      return announce(line).then(function(){
        return transcribe(blob).then(function(text){
          if(isGarbage(text) || !text) return;
          log('Entendu: « '+text+' »','qa');
          var addressed=cfg.always;
          if(!cfg.always){
            var wakes=(cfg.wakeWords||'').split(',');
            var tn=norm(text);
            addressed=wakes.some(function(w){w=norm(w); return w&&tn.indexOf(w)!==-1});
          }
          if(addressed) return processUser(text);
          if(cfg.agentMode && cfg.reportSpeech){
            // paroles autour: une ligne utile, pas un roman
            if(eventCooldown('speech', (cfg.coolSec||14)*1000)) return;
            return announce('Parole autour: « '+text.slice(0,80)+(text.length>80?'…':'')+' »');
          }
        });
      });
    }
  }

  if(!blob || blob.size<750) return delay(100);

  live('STT…','think');
  return transcribe(blob).then(function(text){
    if(isGarbage(text)){
      log('Transcript ignoré: ['+text+']','info');
      return;
    }
    log('Entendu: « '+text+' »','qa');
    var addressed=cfg.always;
    if(!cfg.always){
      var wakes=(cfg.wakeWords||'').split(',');
      var tn=norm(text);
      addressed=wakes.some(function(w){w=norm(w); return w&&tn.indexOf(w)!==-1});
    }
    if(addressed) return processUser(text);
    if(cfg.agentMode && cfg.reportSpeech){
      if(eventCooldown('speech', (cfg.coolSec||14)*1000)) return;
      return announce('Parole autour: « '+text.slice(0,80)+(text.length>80?'…':'')+' »');
    }
  });
}

function autoStart(comp){
  if(st.hardStop) st.hardStop=false;
  if(st.auto && st.comp===!!comp) return;
  if(st.auto) autoStop();
  if(!hasKey()){ toast('Mets ta clé','err'); openSettings(); return; }
  st.auto=true; st.comp=!!comp; st.loopId++;
  var myId=st.loopId;
  if($('#auto')) $('#auto').classList.toggle('on', !comp);
  if($('#comp')) $('#comp').classList.toggle('on', !!comp);
  live(comp?'24/7':'AUTO','listen');
  if($('#status')) $('#status').textContent=comp?'24/7':'AUTO';
  if($('#mode')) $('#mode').textContent=comp?'24/7':'AUTO';
  log((comp?'24/7':'AUTO')+' ON');
  if(cfg.wakelock && navigator.wakeLock) navigator.wakeLock.request('screen').then(function(s){st.wake=s}).catch(function(){});

  (function loop(){
    if(!st.auto||st.loopId!==myId||st.hardStop) return;
    ensureMic().then(function(ok){
      if(!ok) return delay(1000).then(function(){ if(st.auto&&st.loopId===myId&&!st.hardStop) loop(); });
      live('Veille…','listen');
      return waitSound(myId);
    }).then(function(heard){
      if(!heard||!st.auto||st.loopId!==myId||st.hardStop){ if(st.auto&&st.loopId===myId&&!st.hardStop) setTimeout(loop,150); return; }
      live('Rec…','rec');
      return recordUntilSilent(myId);
    }).then(function(blob){
      if(!st.auto||st.loopId!==myId||st.hardStop) return;
      return handleAmbient(blob);
    }).then(function(){
      if(!st.auto||st.loopId!==myId||st.hardStop) return;
      sys();
      return delay(cfg.gapMs||1000);
    }).then(function(){
      if(st.auto&&st.loopId===myId&&!st.hardStop) loop();
    }).catch(function(e){
      log('Loop: '+(e.message||e),'err');
      if(st.auto&&st.loopId===myId&&!st.hardStop) setTimeout(loop,1000);
    });
  })();
}
function autoStop(){
  st.auto=false; st.comp=false; st.loopId++;
  try{ if(st.ctrl) st.ctrl.abort(); }catch(e){}
  if($('#auto')) $('#auto').classList.remove('on');
  if($('#comp')) $('#comp').classList.remove('on');
  live('OFF','idle'); if($('#status')) $('#status').textContent='OFF'; if($('#mode')) $('#mode').textContent='OFF';
  stopTTS(); releaseMic();
  try{ if(st.wake){ st.wake.release(); st.wake=null; } }catch(e){}
  log('OFF'); sys();
}

function openSettings(){
  var el=$('#keystatus'); if(el){ el.textContent=hasKey()?'Clé OK':'Aucune clé'; el.className=hasKey()?'ok':''; }
  try{$('#dlg').showModal()}catch(e){}
}
function saveAll(){
  var k=cleanKey(($('#key')&&$('#key').value)||''); if(k.length>=10) cfg.key=k;
  cfg.model=$('#model').value;
  cfg.aiName=($('#aiName').value||'Jarvis').trim();
  cfg.agentMode=$('#agentMode').checked;
  cfg.reportSpeech=$('#reportSpeech').checked;
  cfg.always=$('#always').checked;
  cfg.noise=$('#noise').checked;
  cfg.speakNoise=$('#speakNoise').checked;
  cfg.smartAlert=$('#smartAlert').checked;
  cfg.tts=$('#tts').checked;
  cfg.wakelock=$('#wakelock').checked;
  cfg.wakeWords=$('#wake').value.trim();
  cfg.stopWords=$('#stopw').value.trim();
  safeSet(S_CFG, JSON.stringify(cfg));
  if($('#nameTag')) $('#nameTag').textContent=aiName();
  toast('Sauvé'); $('#dlg').close();
}
function load(){
  try{ var raw=safeGet(S_CFG,null); if(raw){ var p=JSON.parse(raw); for(var k in p) cfg[k]=p[k]; } }catch(e){}
  try{ var s=JSON.parse(safeGet(S_LOG,'[]')||'[]'); if(Array.isArray(s)) st.fullLog=s; }catch(e){}
  if($('#key')) $('#key').value=cfg.key||'';
  if($('#model')) $('#model').value=cfg.model;
  if($('#aiName')) $('#aiName').value=cfg.aiName||'Jarvis';
  ['agentMode','reportSpeech','always','noise','speakNoise','smartAlert','tts','wakelock'].forEach(function(id){
    var e=$('#'+id); if(e) e.checked=cfg[id]!==false;
  });
  if($('#wake')) $('#wake').value=cfg.wakeWords;
  if($('#stopw')) $('#stopw').value=cfg.stopWords;
  if($('#nameTag')) $('#nameTag').textContent=aiName();
}
function bind(){
  $('#go').onclick=function(){ $('#boot').style.display='none'; $('#app').classList.add('show'); initMotion(); };
  $('#cfg').onclick=openSettings; $('#cfg2').onclick=openSettings; $('#x').onclick=function(){$('#dlg').close()};
  $('#halt').onclick=hardStop;
  $('#auto').onclick=function(){ if(st.auto&&!st.comp) autoStop(); else autoStart(false); };
  $('#comp').onclick=function(){ if(st.comp) autoStop(); else autoStart(true); };
  $('#agentBtn').onclick=function(){ cfg.agentMode=!cfg.agentMode; safeSet(S_CFG,JSON.stringify(cfg)); toast(cfg.agentMode?'Agent ON':'Agent OFF'); };
  $('#mute').onclick=function(){ st.muted=!st.muted; var t=$('#mute .btntitle'); if(t) t.textContent=st.muted?'SON OFF':'SON ON'; toast(st.muted?'Mute':'Son'); };
  $('#clr').onclick=function(){ $('#out').textContent='…'; $('#log').textContent=''; st.hist=[]; st.recentSays=[]; toast('Effacé'); };
  $('#export').onclick=function(){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([st.fullLog.join('\n')],{type:'text/plain'}));
    a.download='jarvis-mac-log.txt'; a.click();
  };
  $('#send').onclick=function(){ var el=$('#txt'); var v=el.value; el.value=''; if(v.trim()) processUser(v.trim()); };
  $('#txt').onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); var v=e.target.value; e.target.value=''; if(v.trim()) processUser(v.trim()); } };
  $('#paste').onclick=function(){ navigator.clipboard&&navigator.clipboard.readText().then(function(t){ $('#key').value=t; toast('Collé'); }).catch(function(){toast('Refusé','err')}); };
  $('#savekey').onclick=function(){ var k=cleanKey($('#key').value||''); if(k){cfg.key=k; safeSet(S_CFG,JSON.stringify(cfg)); toast('Clé');} };
  $('#test').onclick=function(){
    if(!hasKey()){toast('Clé?','err');return;}
    fetch(GROQ+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+getKey()},body:JSON.stringify({model:cfg.model,messages:[{role:'user',content:'OK'}],max_tokens:3,temperature:0})})
      .then(function(r){toast(r.ok?'Clé OK':'Erreur')}).catch(function(){toast('Réseau','err')});
  };
  $('#save').onclick=saveAll;
  setInterval(function(){ var el=$('#clock'); if(el) el.textContent=now(); },1000);
}

load(); bind(); log('Jarvis MacGyver prêt');
})();
</script>
