<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SUPRA LAB - Simple & Robuste</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            overflow: hidden;
            touch-action: manipulation;
        }
        #app {
            padding: 10px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
            margin-bottom: 20px;
        }
        button {
            background: transparent;
            color: #00ff41;
            border: 2px solid #00ff41;
            padding: 10px 20px;
            margin: 5px;
            font-size: 14px;
            cursor: pointer;
            display: block;
            width: 100%;
        }
        button:hover {
            background: #00ff41;
            color: #000;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #log {
            height: 200px;
            overflow-y: auto;
            background: #001100;
            border: 1px solid #00ff41;
            padding: 8px;
            margin: 10px 0;
            font-size: 12px;
            line-height: 1.2;
        }
        .log-line {
            margin: 2px 0;
            word-break: break-word;
        }
        .log-line::before {
            content: "> ";
            color: #00cc33;
        }
        .log-line.error {
            color: #ff0044;
        }
        .log-line.success {
            color: #00ff41;
        }
        canvas {
            width: 100%;
            height: 150px;
            background: #000;
            display: block;
            margin: 10px 0;
        }
        #status {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #001100;
            border-top: 1px solid #00ff41;
            padding: 5px;
            font-size: 12px;
            text-align: center;
        }
        .indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 5px;
            vertical-align: middle;
        }
        .indicator.ready {
            background: #00ff41;
        }
        .indicator.error {
            background: #ff0044;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>SUPRA LAB - Simple & Robuste</h1>

        <button id="startBtn">🚀 LANCER TOUT</button>

        <div>
            <button id="testMicroBtn">🎙️ Tester le micro</button>
            <span class="indicator" id="microIndicator"></span>
        </div>

        <div>
            <button id="testVoiceBtn">🗣️ Tester la voix</button>
            <span class="indicator" id="voiceIndicator"></span>
        </div>

        <div class="panel">
            <div>SPECTROGRAMME</div>
            <canvas id="spectrogram"></canvas>
            <div>RMS: <span id="rmsValue">-- dB</span></div>
        </div>

        <div class="panel">
            <div>OSCILLOSCOPE</div>
            <canvas id="scope"></canvas>
        </div>

        <div>
            <div>LOG</div>
            <div id="log"></div>
        </div>
    </div>

    <div id="status">En attente...</div>

    <script>
        // ========== VARIABLES ==========
        let audioCtx = null;
        let analyser = null;
        let microphone = null;
        let gainNode = null;
        let mediaRecorder = null;
        let audioStream = null;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let frequencyArray = null;
        let timeArray = null;
        let spectroHistory = [];
        let isRunning = false;
        let isRecording = false;
        let recordedChunks = [];

        // ========== CONFIG ==========
        const config = {
            noiseThreshold: 0.4,
            voiceRate: 1.0,
            voiceVolume: 1.0,
            voiceLanguage: 'fr-FR'
        };

        // ========== LOG ==========
        function log(text, type = "normal") {
            const logDiv = document.getElementById('log');
            if (!logDiv) return;

            const line = document.createElement('div');
            line.className = `log-line ${type === 'error' ? 'error' : type === 'success' ? 'success' : ''}`;
            line.innerHTML = `<span style="color: #00cc33;">[${new Date().toLocaleTimeString('fr-FR')}]</span> ${text}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;

            if (logDiv.children.length > 30) {
                logDiv.removeChild(logDiv.children[0]);
            }
        }

        // ========== STATUS ==========
        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }

        // ========== INITIALISATION COMPLÈTE ==========
        async function initAll() {
            try {
                log("Démarrage...", "normal");
                updateStatus("Initialisation en cours...");

                // 1. Initialiser le micro
                await initMicro();
                log("✅ Micro prêt", "success");

                // 2. Initialiser l'IA vocale
                await initSpeech();
                log("✅ IA vocale prête", "success");

                // 3. Démarrer la boucle
                if (!isRunning) {
                    isRunning = true;
                    requestAnimationFrame(loop);
                }

                // 4. Tester la voix
                setTimeout(() => {
                    speak("Système prêt. Parlez maintenant.");
                }, 1000);

                updateStatus("✅ TOUT EST PRÊT !");
                document.getElementById('microIndicator').className = 'indicator ready';
                document.getElementById('voiceIndicator').className = 'indicator ready';

            } catch (err) {
                log(`❌ Erreur: ${err.message}`, "error");
                updateStatus(`Erreur: ${err.message}`);
            }
        }

        // ========== INIT MICRO ==========
        async function initMicro() {
            if (audioStream && !audioStream.getAudioTracks().some(t => t.readyState === 'ended')) {
                return true;
            }

            try {
                // Fermer l'ancien contexte
                if (audioCtx) await audioCtx.close().catch(() => {});
                if (audioStream) audioStream.getTracks().forEach(t => t.stop());

                // Nouveau contexte
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                await audioCtx.resume();

                // Stream micro (TOUS LES SONS)
                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });

                // Nœuds audio
                microphone = audioCtx.createMediaStreamSource(audioStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.1;

                gainNode = audioCtx.createGain();
                gainNode.gain.value = 1.0;

                microphone.connect(analyser);
                analyser.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                frequencyArray = new Uint8Array(analyser.frequencyBinCount);
                timeArray = new Uint8Array(analyser.frequencyBinCount);

                // Enregistreur
                mediaRecorder = new MediaRecorder(audioStream);
                recordedChunks = [];
                mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `rec-${Date.now()}.webm`;
                    a.click();
                    recordedChunks = [];
                    log("Enregistrement sauvegardé.", "success");
                };

                return true;
            } catch (err) {
                throw new Error(`Micro: ${err.message}`);
            }
        }

        // ========== INIT SPEECH ==========
        async function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                throw new Error("Reconnaissance vocale non supportée (Chrome requis)");
            }

            try {
                if (recognition) recognition.stop();

                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = config.voiceLanguage.split('-')[0];
                recognition.maxAlternatives = 1;

                let finalTranscript = '';

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript + ' ';
                            processTranscript(finalTranscript.trim());
                        } else {
                            interimTranscript += transcript;
                        }
                    }
                    if (interimTranscript) {
                        log(`Fragment: "${interimTranscript}"`, "normal");
                    }
                };

                recognition.onerror = (event) => {
                    log(`Erreur IA vocale: ${event.error}`, "error");
                };

                recognition.onstart = () => {
                    log("IA vocale démarrée.", "success");
                };

                recognition.onend = () => {
                    if (isRunning) {
                        setTimeout(() => {
                            try { recognition.start(); } catch (e) {}
                        }, 1000);
                    }
                };

                recognition.start();
                return true;
            } catch (e) {
                throw new Error(`IA vocale: ${e.message}`);
            }
        }

        // ========== TRAITEMENT TRANSCRIPTION ==========
        function processTranscript(transcript) {
            if (!transcript) return;
            log(`Transcription: "${transcript}"`, "success");

            const keywords = ['avion', 'drone', 'urgence', 'sos', 'alerte', 'danger', 'bruit', 'son'];
            if (keywords.some(kw => transcript.toLowerCase().includes(kw))) {
                log(`Mot-clé détecté: "${transcript}"`, "success");
                triggerAIAnalysis(transcript);
            }
        }

        // ========== SYNTHÈSE VOCALE ==========
        function speak(text) {
            if (!synthesis) {
                log("Synthèse vocale non supportée.", "error");
                return;
            }

            try {
                if (synthesis.speaking || synthesis.pending) {
                    synthesis.cancel();
                }

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = config.voiceLanguage;
                utterance.rate = config.voiceRate;
                utterance.volume = config.voiceVolume;

                // Meilleure voix française disponible
                const voices = synthesis.getVoices();
                const frenchVoice = voices.find(v => v.lang.includes('fr')) || voices[0];
                if (frenchVoice) utterance.voice = frenchVoice;

                utterance.onerror = (e) => {
                    log(`Erreur voix: ${e.error}`, "error");
                };

                synthesis.speak(utterance);
                log(`Voix: "${text}"`, "success");
            } catch (e) {
                log(`Erreur: ${e.message}`, "error");
            }
        }

        // ========== DÉTECTION BRUITS ==========
        function detectNoise(rms) {
            const rmsEl = document.getElementById('rmsValue');
            if (rmsEl) {
                rmsEl.textContent = `${rms.toFixed(2)} dB`;
                rmsEl.style.color = rms > config.noiseThreshold ? '#ff0044' : '#00ff41';
            }

            if (rms > config.noiseThreshold) {
                log(`Bruit détecté: ${rms.toFixed(2)} dB`, "success");
                speak(`Attention, bruit détecté à ${rms.toFixed(1)} décibels.`);
            }
        }

        // ========== ANALYSE IA ==========
        function triggerAIAnalysis(transcript) {
            if (!audioCtx || !analyser) return;

            analyser.getByteFrequencyData(frequencyArray);
            const rms = Math.sqrt(frequencyArray.reduce((a, b) => a + b * b, 0) / frequencyArray.length) / 128;

            const report = `
[RAPPORT - ${new Date().toLocaleTimeString('fr-FR')}]
Transcription: "${transcript}"
Niveau sonore: ${rms.toFixed(2)} dB
Statut: ${rms > config.noiseThreshold ? "⚠️ BRUIT FORT" : "✅ Normal"}
            `.trim();

            log(report, "success");
            speak(report);
        }

        // ========== BOUCLE PRINCIPALE ==========
        function loop() {
            if (!audioCtx || !analyser) {
                requestAnimationFrame(loop);
                return;
            }

            analyser.getByteFrequencyData(frequencyArray);
            const rms = Math.sqrt(frequencyArray.reduce((a, b) => a + b * b, 0) / frequencyArray.length) / 128;

            detectNoise(rms);
            drawSpectrogram();
            drawScope();

            requestAnimationFrame(loop);
        }

        // ========== DESSINS ==========
        function drawSpectrogram() {
            const canvas = document.getElementById('spectrogram');
            if (!canvas || !analyser) return;

            const ctx = canvas.getContext('2d');
            analyser.getByteFrequencyData(frequencyArray);

            spectroHistory.unshift([...frequencyArray]);
            if (spectroHistory.length > 80) spectroHistory.pop();

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width / frequencyArray.length;
            for (let y = 0; y < spectroHistory.length; y++) {
                for (let x = 0; x < spectroHistory[y].length; x++) {
                    const val = spectroHistory[y][x];
                    ctx.fillStyle = `hsl(${90 + val/2.5}, 100%, ${val/2.8}%)`;
                    ctx.fillRect(x * w, y * 2, w + 1, 2);
                }
            }
        }

        function drawScope() {
            const canvas = document.getElementById('scope');
            if (!canvas || !analyser) return;

            const ctx = canvas.getContext('2d');
            analyser.getByteTimeDomainData(timeArray);

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#00ff41';
            ctx.lineWidth = 2;
            ctx.beginPath();

            const slice = canvas.width / timeArray.length;
            for (let i = 0; i < timeArray.length; i++) {
                const y = (timeArray[i] / 128) * canvas.height / 2;
                i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * slice, y);
            }
            ctx.stroke();
        }

        // ========== BOUTONS ==========
        function setupButtons() {
            document.getElementById('startBtn').addEventListener('click', initAll);

            document.getElementById('testMicroBtn').addEventListener('click', async () => {
                try {
                    await initMicro();
                    log("Micro testé avec succès.", "success");
                } catch (err) {
                    log(`Test micro échoué: ${err.message}`, "error");
                }
            });

            document.getElementById('testVoiceBtn').addEventListener('click', () => {
                speak("Test de la voix. Si vous entendez ceci, tout fonctionne.");
            });
        }

        // ========== INIT ==========
        window.addEventListener('DOMContentLoaded', () => {
            log("SUPRA LAB - Simple & Robuste prêt.", "success");
            log("Cliquez sur 'LANCER TOUT' pour démarrer.", "normal");
            setupButtons();
        });

        window.addEventListener('beforeunload', () => {
            if (recognition) recognition.stop();
            if (audioStream) audioStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close().catch(() => {});
        });
    </script>
</body>
</html>
