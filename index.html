<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS v24.1 - REALMOBILE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Creepster&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-red: #ff003c;
            --neon-green: #0aff0a;
            --panel: rgba(20, 20, 20, 0.95);
            --font-tech: 'Rajdhani', sans-serif;
            --font-head: 'Orbitron', sans-serif;
            --font-spooky: 'Creepster', cursive;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: var(--font-tech); 
            height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- OVERLAY START (CRITICAL FOR ANDROID PERMISSIONS) --- */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
        }
        #start-btn {
            padding: 20px 40px; font-size: 1.5rem; background: var(--neon-red); color: #fff;
            border: none; font-family: var(--font-head); border-radius: 5px; cursor: pointer;
            box-shadow: 0 0 20px var(--neon-red); animation: pulse 2s infinite;
        }

        /* --- HEADER --- */
        header {
            height: 50px; background: #111; border-bottom: 1px solid #333; display: flex; 
            justify-content: space-between; align-items: center; padding: 0 15px;
        }
        .brand { font-family: var(--font-head); font-weight: 700; font-size: 1rem; color: var(--neon-cyan); }

        /* --- MAIN LAYOUT (STACKED FOR MOBILE) --- */
        #interface { flex: 1; display: flex; flex-direction: column; position: relative; }

        /* --- ENTITY SELECTOR (TOP) --- */
        #entity-scroller {
            height: 80px; background: #050505; display: flex; overflow-x: auto;
            border-bottom: 1px solid #333; align-items: center; padding: 0 10px; gap: 10px;
        }
        .ent-btn {
            min-width: 120px; height: 60px; background: #111; border: 1px solid #333; color: #666;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: var(--font-head); font-size: 0.8rem; border-radius: 5px; flex-shrink: 0;
        }
        .ent-btn.active { border-width: 2px; background: rgba(255,255,255,0.05); }
        .ent-human.active { color: var(--neon-green); border-color: var(--neon-green); }
        .ent-ghost.active { color: var(--neon-purple); border-color: var(--neon-purple); font-family: var(--font-spooky); letter-spacing: 1px;}
        .ent-demon.active { color: var(--neon-red); border-color: var(--neon-red); }
        .ent-spirit.active { color: var(--neon-cyan); border-color: var(--neon-cyan); }

        /* --- MAIN VISUAL AREA --- */
        #stage { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.4; }

        #text-display {
            z-index: 10; text-align: center; width: 90%; padding: 20px;
            background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 10px;
        }
        #interim-text { color: #666; font-size: 1.2rem; min-height: 25px; margin-bottom: 5px; }
        #final-text { color: #fff; font-size: 1.8rem; font-weight: bold; text-transform: uppercase; font-family: var(--font-head); min-height: 40px; }
        #entity-response { color: var(--neon-cyan); font-size: 1.1rem; margin-top: 15px; min-height: 30px; border-top: 1px solid #333; padding-top: 10px; }

        /* --- CONTROLS (BOTTOM) --- */
        #controls { 
            height: 120px; background: #080808; border-top: 1px solid #333; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 20;
        }
        
        #mic-btn {
            width: 80px; height: 80px; border-radius: 50%; background: #111; border: 2px solid #444;
            color: #fff; font-size: 2rem; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: 0.2s;
        }
        #mic-btn.listening { border-color: var(--neon-red); background: var(--neon-red); animation: pulse-ring 1.5s infinite; }
        
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 0, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 0, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0); } }

        /* STATUS LOG */
        #status-bar {
            position: absolute; bottom: 10px; width: 100%; text-align: center; 
            font-size: 0.7rem; color: #555; text-transform: uppercase;
        }

    </style>
</head>
<body>

    <!-- ÉCRAN DE DÉMARRAGE (Obligatoire pour Android) -->
    <div id="start-overlay">
        <h1 style="font-family:var(--font-head); color:var(--neon-red); margin-bottom:20px;">JARVIS MOBILE</h1>
        <p style="color:#666; margin-bottom:40px;">Appuie pour activer le système audio</p>
        <button id="start-btn">DÉMARRER</button>
    </div>

    <header>
        <div class="brand">JARVIS <span style="font-size:0.6em; color:#555">// REALME EDITION</span></div>
        <div id="clock" style="font-size:0.9rem; color:#666;">00:00</div>
    </header>

    <div id="interface">
        <!-- SELECTEUR ENTITÉ -->
        <div id="entity-scroller">
            <div class="ent-btn ent-human active" onclick="setEntity('human')">
                <span>HUMAN</span>
            </div>
            <div class="ent-btn ent-ghost" onclick="setEntity('ghost')">
                <span>GHOST</span>
            </div>
            <div class="ent-btn ent-demon" onclick="setEntity('demon')">
                <span>DEMON</span>
            </div>
            <div class="ent-btn ent-spirit" onclick="setEntity('spirit')">
                <span>SPIRIT</span>
            </div>
        </div>

        <!-- VISUAL ET TEXTE -->
        <div id="stage">
            <canvas id="visu-canvas"></canvas>
            
            <div id="text-display">
                <div id="interim-text">...</div>
                <div id="final-text">EN ATTENTE</div>
                <div id="entity-response">En attente de voix...</div>
            </div>
        </div>
    </div>

    <div id="controls">
        <button id="mic-btn" onclick="toggleMic()">🎙️</button>
        <div id="status-bar">SYSTÈME PRÊT</div>
    </div>

    <script>
        /* ==============================================================================
           JARVIS v24.1 - MOBILE OPTIMIZED ENGINE
           ============================================================================== */

        // --- CONFIGURATION ---
        const Entities = {
            human: { color: "var(--neon-green)", pitch: 1.0, rate: 1.0, name: "HUMAIN" },
            ghost: { color: "var(--neon-purple)", pitch: 1.6, rate: 0.7, name: "FANTÔME" }, // Haut, lent
            demon: { color: "var(--neon-red)", pitch: 0.4, rate: 1.4, name: "DÉMON" }, // Bas, rapide
            spirit: { color: "var(--neon-cyan)", pitch: 1.1, rate: 0.9, name: "ESPRIT" }
        };

        let currentEntity = 'human';
        let isListening = false;
        let recognition;
        let audioCtx, analyser, dataArray;

        // --- INITIALISATION (START BUTTON) ---
        document.getElementById('start-btn').addEventListener('click', async () => {
            document.getElementById('start-overlay').style.display = 'none';
            await initAudio();
            initSpeech();
        });

        // --- AUDIO ENGINE ---
        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                const src = audioCtx.createMediaStreamSource(stream);
                src.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                drawVisuals();
            } catch(e) {
                alert("ERREUR: Accès micro refusé. Vérifie les permissions Android.");
            }
        }

        function drawVisuals() {
            if(!isListening && !audioCtx) return;
            requestAnimationFrame(drawVisuals);
            analyser.getByteFrequencyData(dataArray);

            const cvs = document.getElementById('visu-canvas');
            const ctx = cvs.getContext('2d');
            cvs.width = window.innerWidth; cvs.height = window.innerHeight;
            ctx.clearRect(0,0,cvs.width, cvs.height);

            const barW = cvs.width / 32;
            const entColor = getComputedStyle(document.body).getPropertyValue(Entities[currentEntity].color).trim();
            
            for(let i=0; i<32; i++) {
                const val = dataArray[i*4];
                const h = (val/255) * cvs.height;
                ctx.fillStyle = val > 150 ? entColor : '#222';
                ctx.fillRect(i*barW, cvs.height - h, barW-2, h);
            }
        }

        // --- RECONNAISSANCE VOCALE (OPTIMISÉE MOBILE) ---
        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) {
                alert("Ton navigateur ne supporte pas la voix. Utilise CHROME.");
                return;
            }

            recognition = new SR();
            recognition.continuous = true;
            // CRITIQUE POUR MOBILE: interimResults = true permet de voir ce qu'on dit en temps réel
            recognition.interimResults = true; 
            recognition.lang = 'fr-FR';

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('mic-btn').classList.add('listening');
                document.getElementById('status-bar').innerText = "ECOUTE EN COURS...";
                document.getElementById('status-bar').style.color = "var(--neon-green)";
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('mic-btn').classList.remove('listening');
                document.getElementById('status-bar').innerText = "PAUSE";
                document.getElementById('status-bar').style.color = "#555";
                
                // Auto-restart (Android coupe souvent la connexion)
                if (document.getElementById('mic-btn').classList.contains('listening-active-flag')) {
                    try { recognition.start(); } catch(e){}
                }
            };

            recognition.onerror = (e) => {
                console.error(e);
                if(e.error === 'not-allowed') alert("Micro refusé !");
            };

            recognition.onresult = (e) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) {
                        finalTranscript += e.results[i][0].transcript;
                    } else {
                        interimTranscript += e.results[i][0].transcript;
                    }
                }

                // 1. Affichage Temps Réél (L'utilisateur voit que ça marche)
                if (interimTranscript) {
                    document.getElementById('interim-text').innerText = interimTranscript;
                    document.getElementById('interim-text').style.opacity = 1;
                } else {
                    document.getElementById('interim-text').style.opacity = 0;
                }

                // 2. Traitement Final (Quand la phrase est finie)
                if (finalTranscript) {
                    document.getElementById('final-text').innerText = finalTranscript;
                    document.getElementById('interim-text').innerText = "";
                    processEntityLogic(finalTranscript);
                }
            };
        }

        function toggleMic() {
            const btn = document.getElementById('mic-btn');
            
            if (!isListening) {
                // START
                try {
                    recognition.start();
                    btn.classList.add('listening-active-flag'); // Flag pour le restart auto
                } catch(e) { console.log("Déjà lancé"); }
            } else {
                // STOP
                recognition.stop();
                btn.classList.remove('listening-active-flag');
            }
        }

        // --- LOGIQUE ENTITÉ (FANTÔME / DÉMON) ---
        function processEntityLogic(text) {
            const ent = Entities[currentEntity];
            const responseEl = document.getElementById('entity-response');
            const finalEl = document.getElementById('final-text');

            let response = "";
            const t = text.toLowerCase();

            // Changement de style visuel selon l'entité
            finalEl.style.color = ent.color;
            responseEl.style.color = ent.color;
            responseEl.style.fontFamily = currentEntity === 'ghost' ? 'var(--font-spooky)' : 'var(--font-tech)';

            if (currentEntity === 'human') {
                response = `J'ai bien entendu : ${text}.`;
            } 
            else if (currentEntity === 'ghost') {
                // Effet Fantôme
                response = `...${text}... qui m'a appelé...`;
            } 
            else if (currentEntity === 'demon') {
                // Effet Démon
                response = `TU AS DIT "${text.toUpperCase()}". JE SUIS PRÉSENT.`;
            } 
            else if (currentEntity === 'spirit') {
                response = `L'esprit capte : "${text}".`;
            }

            // Affichage et Voix
            responseEl.innerText = response;
            speak(response, ent);
        }

        function speak(txt, ent) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(txt);
            u.lang = 'fr-FR';
            u.pitch = ent.pitch;
            u.rate = ent.rate;
            window.speechSynthesis.speak(u);
        }

        function setEntity(type) {
            currentEntity = type;
            document.querySelectorAll('.ent-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.ent-${type}`).classList.add('active');
            
            // Feedback visuel immédiat
            const ent = Entities[type];
            document.getElementById('final-text').style.color = ent.color;
            document.getElementById('entity-response').innerText = `Canal ${ent.name} activé.`;
            
            // Petit son de confirmation
            speak(`Mode ${ent.name} activé.`, {pitch:1, rate:1});
        }

        // Horloge
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
        }, 1000);

    </script>
</body>
</html>
