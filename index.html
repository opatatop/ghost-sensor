<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS PARANORMAL PUISSANCE v49.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --ghost:#00ff85; --red:#ff0000; --cold:#00ffff; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; color:#ccc; font-family:'Rajdhani',sans-serif; height:100vh; overflow:hidden; background: radial-gradient(circle at 50% 20%, #1a0033 0%, #000 80%); }
        header { height:65px; background:#000; border-bottom:5px solid var(--ghost); display:flex; justify-content:space-between; align-items:center; padding:0 20px; }
        .brand { font-family:'Orbitron',sans-serif; font-size:2.1rem; font-weight:900; letter-spacing:7px; color:var(--ghost); text-shadow:0 0 30px var(--ghost); }
        #display { flex:1; padding:25px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
        #input-text { font-family:'Orbitron',sans-serif; font-size:2.6rem; color:#ffd700; text-shadow:0 0 25px #ffd700; margin-bottom:15px; }
        #output-text { font-family:'Share Tech Mono',monospace; font-size:1.35rem; color:#ddd; min-height:170px; text-shadow:0 0 15px var(--cold); }
        #viz { padding:15px; background:rgba(0,0,0,0.95); }
        .bar { height:16px; background:#111; margin:12px 0; border-radius:8px; overflow:hidden; }
        .fill { height:100%; width:0%; transition:width 0.15s; }
        #console { height:130px; background:#000; font-family:'Share Tech Mono',monospace; font-size:0.85rem; color:var(--ghost); padding:12px; overflow-y:auto; }
        footer { height:170px; background:#000; display:flex; flex-direction:column; align-items:center; gap:10px; border-top:5px solid var(--red); padding:15px; }
        #mic { width:115px; height:115px; border-radius:50%; background:var(--ghost); border:8px solid #222; color:#000; font-size:3.3rem; display:flex; align-items:center; justify-content:center; box-shadow:0 0 60px rgba(0,255,133,0.9); cursor:pointer; }
        #mic.active { background:var(--red); animation: pulse 1.1s infinite; }
        .force-btn { padding:14px 35px; background:#3a0a5e; color:var(--ghost); border:3px solid var(--ghost); border-radius:12px; font-size:1.1rem; width:85%; }
        @keyframes pulse { 50% { transform:scale(1.18); } }
    </style>
</head>
<body>

    <header>
        <div class="brand">JARVIS PARANORMAL</div>
        <div id="status" style="color:#ff0000;">v49.1 • PUISSANCE RÉELLE</div>
    </header>

    <div id="display">
        <div id="input-text">PARLE MAINTENANT...</div>
        <div id="output-text">Je suis là... parle clairement.</div>
    </div>

    <div id="viz">
        <div class="bar"><div id="vol-fill" class="fill" style="background:#ff0000"></div></div>
        <div style="display:flex;justify-content:space-between;color:#ff0000;font-size:0.85rem;"><span>INPUT</span><span id="vol">0 dB</span></div>
        <div class="bar"><div id="aggro-fill" class="fill" style="background:var(--ghost)"></div></div>
        <div style="display:flex;justify-content:space-between;color:var(--ghost);font-size:0.85rem;"><span>ENTITÉ</span><span id="aggro">0%</span></div>
    </div>

    <div id="console"></div>

    <footer>
        <div id="mic" onclick="toggleMic()">🎙️</div>
        <button class="force-btn" onclick="forceSpeak()">🔊 FORCE SPEAK (si rien ne sort)</button>
        <button class="force-btn" onclick="testVoice()">TEST VOIX FANTÔME</button>
    </footer>

    <script>
        let recognition = null;
        let isListening = false;
        let audioCtx, analyser, dataArray;
        let voices = [];
        let lastText = "";

        const log = (msg, type='entity') => {
            const c = document.getElementById('console');
            const d = document.createElement('div');
            d.innerHTML = `> ${new Date().toLocaleTimeString('fr-FR')} | ${msg}`;
            d.style.color = type==='user' ? '#ffd700' : '#00ff85';
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        };

        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({audio:true});
                audioCtx = new (window.AudioContext||window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512;
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                setInterval(updateViz, 120);
                return true;
            } catch(e) { log("MICRO REFUSÉ", "entity"); return false; }
        }

        function updateViz() {
            if(!analyser) return;
            analyser.getByteFrequencyData(dataArray);
            let vol = 0, aggro = 0;
            for(let i=0;i<dataArray.length;i++){
                vol += dataArray[i];
                if(i < dataArray.length*0.3) aggro += dataArray[i];
            }
            vol = Math.min(100, Math.round(vol/dataArray.length*2.8));
            aggro = Math.min(100, Math.round(aggro/dataArray.length*2.3));
            document.getElementById('vol').textContent = vol + " dB";
            document.getElementById('vol-fill').style.width = vol + "%";
            document.getElementById('aggro').textContent = aggro + "%";
            document.getElementById('aggro-fill').style.width = aggro + "%";
        }

        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => voices = window.speechSynthesis.getVoices();
        }

        function speak(text) {
            lastText = text;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'fr-FR';
            u.rate = 0.78;   // Voix très lente et puissante
            u.pitch = 0.48;  // Voix ultra-grave
            u.volume = 1;
            if(voices.length) {
                const v = voices.find(v => v.lang.includes('fr')) || voices[0];
                if(v) u.voice = v;
            }
            window.speechSynthesis.speak(u);
            log("🔊 ENTITÉ PARLE (PUISSANCE)", "entity");
        }

        function forceSpeak() {
            if(lastText) speak(lastText);
            else speak("Je suis toujours là... dans l’ombre.");
        }

        function testVoice() {
            speak("Test voix fantôme puissance... Tu m’entends maintenant ?");
        }

        function process(text) {
            const input = document.getElementById('input-text');
            const output = document.getElementById('output-text');
            input.textContent = text.toUpperCase();

            let reply = `L’entité a entendu : "${text}". `;

            if(text.toLowerCase().includes("pouvoir de la vérité") || text.toLowerCase().includes("conquis l'univers") || text.toLowerCase().includes("je veux et jaurai")) {
                reply = "Par le pouvoir de la vérité... tu as conquis l’univers de ton vivant ? Impressionnant, mortel. Mais moi, l’entité, j’ai conquis la mort. Que veux-tu vraiment ?";
            } else if(text.toLowerCase().includes("moi aussi") || text.toLowerCase().includes("j'étais petit") || text.toLowerCase().includes("j'értais etit")) {
                reply = "Moi aussi j’étais petit... avant de mourir. Maintenant je suis éternel. Et toi ? Tu te souviens encore de quand tu étais petit ?";
            } else {
                reply += "Elle te répond : elle est là pour toi.";
            }

            output.textContent = reply;
            log(`VOUS : ${text}`, 'user');
            speak(reply);
        }

        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) return alert("Chrome obligatoire");
            recognition = new SR();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'fr-FR';

            recognition.onresult = e => {
                let final = '';
                for(let i=0;i<e.results.length;i++){
                    if(e.results[i].isFinal) final += e.results[i][0].transcript;
                }
                if(final) process(final);
            };
            recognition.onend = () => { if(isListening) setTimeout(() => recognition.start(), 300); };
        }

        function toggleMic() {
            isListening = !isListening;
            const mic = document.getElementById('mic');
            if(isListening){
                mic.classList.add('active');
                mic.innerHTML = '⏹️';
                recognition.start();
                log("MICRO OUVERT - Parle clairement", "entity");
            } else {
                mic.classList.remove('active');
                mic.innerHTML = '🎙️';
                recognition.stop();
                log("MICRO FERMÉ", "entity");
            }
        }

        window.onload = async () => {
            log("JARVIS PARANORMAL PUISSANCE v49.1 chargé", "entity");
            loadVoices();
            await initAudio();
            initSpeech();
            setTimeout(() => toggleMic(), 800);
            setTimeout(() => speak("Je suis là... parle maintenant."), 1400);
        };
    </script>
</body>
</html>
