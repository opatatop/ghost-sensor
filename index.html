<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPATATOP AI - Mode Sous-Marin</title>
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #ff0000;
            --bg: #0a1a2a;
            --panel: #1a3a5a;
            --text: #c0e0ff;
            --danger: #ff5555;
            --accent: #ffff00;
            --sonar: #00ffff;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #000;
            border-bottom: 3px solid var(--primary);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }
        h1 {
            font-size: 1.1rem;
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary);
            letter-spacing: 2px;
            margin: 0;
            font-weight: bold;
        }
        main {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: url('data:image/svg+xml;base64,PHN2ZyBzdHlsZT0ia WM09MS4yMDAwMDAiIHZpZXdCb3g9IjAgMCAxMDAgMTUwIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHhtbG5zOnhsaW5rPSJodHRwOi8vd3d3LnczLm9yZy8xOTk5L3hsaW5rIj4KPHBhdGggZD0iTTQwMDAwMDAwTDQwMDAwMDAxTDIwMDAwMDAyTDIwMDAwMDA2czIwMDAwMDA4czIwMDAwMDA5czIwMDAwMDAxMWMwMDAwMDAwMDAwIiBmaWxsPSIjMDAwZmZmZiI+PC9wYXRoPiA8Y2lyY2xlIGN4PSIwIiBjeT0iMTAwIiByPSIxMDAiIGZpbGw9IiNjYzQ0NDQzIiAvPgo8cGF0aCBkPSJNNjAwMDAwMDAwTDQwMDAwMDAyTDIwMDAwMDAyTDIwMDAwMDA2czIwMDAwMDA4czIwMDAwMDA5czIwMDAwMDAxMWMwMDAwMDAwMDAwIiBmaWxsPSIjMDAwMDAwMCI+PC9wYXRoPiA8Y2lyY2xlIGN4PSIwIiBjeT0iMTAwIiByPSIxMDAiIGZpbGw9IiNjYzQ0NDQzIiAvPgo8Y2lyY2xlIGN4PSIwIiBjeT0iMTAwIiByPSIxMDAiIGZpbGw9IiMwZmZmZmYiIG9wYWNpdHk9IjAuMzUiIC8+Cjwvc3ZnPg==') center/cover;
        }
        #visualizer {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at center, #000 0%, #0a1a2a 100%);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #sonarView {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.8) 70%);
        }
        #displayOverlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            width: 90%;
        }
        #mainText {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border: 2px solid var(--primary);
            border-radius: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 8px var(--primary);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        #subText {
            font-size: 0.8rem;
            color: var(--accent);
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 15px;
            border: 1px solid var(--accent);
            border-radius: 5px;
            text-shadow: 0 0 5px var(--accent);
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 14px;
            border: 1px solid var(--primary);
            border-radius: 5px;
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--primary);
            z-index: 25;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        #actionGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
            gap: 8px;
            padding: 12px;
            background: var(--panel);
            border-top: 1px solid #222;
        }
        .grid-btn {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #ccc;
            padding: 8px 3px;
            border-radius: 5px;
            text-align: center;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, #1a1a1a, #0a0a0a);
        }
        .grid-btn:active {
            transform: scale(0.95);
            background: linear-gradient(to bottom, #2a2a2a, #1a1a1a);
        }
        .grid-btn.active-state {
            background: var(--secondary);
            color: #000;
            border-color: #000;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.7);
            background: linear-gradient(to bottom, #ff3333, #cc0000);
        }
        .grid-icon {
            font-size: 1.1rem;
            margin-bottom: 2px;
        }
        #controls {
            background: var(--panel);
            padding: 12px;
            display: grid;
            gap: 8px;
        }
        button {
            background: #1a1a1a;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.15s;
            position: relative;
            overflow: hidden;
            background: linear-gradient(to bottom, #1a1a1a, #0a0a0a);
        }
        button:active {
            transform: scale(0.95);
            background: linear-gradient(to bottom, #2a2a2a, #1a1a1a);
        }
        button.active-mode {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 12px var(--primary);
            background: linear-gradient(to bottom, #00ff88, #00ccaa);
        }
        button.danger {
            border-color: var(--danger);
            color: var(--danger);
        }
        #terminal {
            height: 90px;
            background: #000;
            border-top: 1px solid #333;
            padding: 6px;
            font-size: 0.6rem;
            overflow-y: auto;
            color: #888;
            line-height: 1.3;
            font-family: monospace;
        }
        .log-line {
            margin-bottom: 4px;
            border-left: 2px solid #555;
            padding-left: 6px;
        }
        .log-sys { border-color: #666; color: #aaa; }
        .log-ai { border-color: var(--secondary); color: var(--secondary); }
        .log-det { border-color: var(--primary); color: var(--accent); }
        #settingsModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            width: 90%;
            max-width: 450px;
            background: #111;
            border: 2px solid var(--secondary);
            border-radius: 8px;
            padding: 18px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
        }
        label {
            font-size: 0.85rem;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 60%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--secondary);
            border-radius: 50%;
            cursor: pointer;
        }
        .color-mode-btn {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #ccc;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            margin: 4px;
            transition: all 0.2s;
            background: linear-gradient(to bottom, #1a1a1a, #0a0a0a);
        }
        .color-mode-btn:active {
            transform: scale(0.95);
            background: linear-gradient(to bottom, #2a2a2a, #1a1a1a);
        }
        .color-mode-btn.active {
            background: var(--secondary);
            color: #000;
            border-color: #000;
            background: linear-gradient(to bottom, #ff3333, #cc0000);
        }
        .color-mode-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 12px 0;
        }
        #translationOverlay {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            color: var(--text);
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 18px;
            border: 2px solid var(--primary);
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 0.9rem;
            font-weight: bold;
            text-shadow: 0 0 6px var(--primary);
        }
        #liveTranslation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            color: var(--sonar);
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border: 2px solid var(--sonar);
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 0 0 8px var(--sonar);
        }
        #sonarPing {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: var(--sonar);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
            box-shadow: 0 0 20px var(--sonar);
        }
    </style>
</head>
<body>
    <header>
        <h1>OPATATOP AI - SUBMARINE MODE</h1>
        <button onclick="App.toggleSettings()" style="background:none;border:1px solid var(--secondary);color:var(--secondary);width:36px;height:36px;border-radius:50%;font-size:1.1rem;">⚙️</button>
    </header>
    <main>
        <div id="visualizer">
            <div id="sonarView"></div>
            <canvas id="scopeCanvas"></canvas>
            <div id="sonarPing"></div>
            <div id="displayOverlay">
                <div id="mainText">SUBMARINE MODE ACTIVE</div>
                <div id="subText">SONAR | COMMUNICATION | DETECTION</div>
            </div>
            <div id="translationOverlay">TRANSLATION: --</div>
            <div id="liveTranslation">--</div>
            <div id="hud">DEPTH: 0m<br>SONAR: 0 Hz<br>POWER: 100%<br>TEMP: 15°C</div>
        </div>
    </main>
    <div id="actionGrid">
        <div class="grid-btn" onclick="App.toggleSettings()"><span class="grid-icon">⚙️</span><span>SETUP</span></div>
        <div class="grid-btn active-state" id="btnSound" onclick="FeatureEngine.toggleMute()"><span class="grid-icon">🔇</span><span>AUDIO</span></div>
        <div class="grid-btn active-state" id="btnPower" onclick="FeatureEngine.togglePower()"><span class="grid-icon">⚡</span><span>POWER</span></div>
        <div class="grid-btn active-state" id="btnDetect" onclick="FeatureEngine.toggleDetection()"><span class="grid-icon">🔍</span><span>SONAR</span></div>
        <div class="grid-btn" id="btnNoise" onclick="FeatureEngine.toggleWhiteNoise()"><span class="grid-icon">🔊</span><span>NOISE</span></div>
        <div class="grid-btn active-state" id="btnGhost" onclick="FeatureEngine.toggleGhostDetection()"><span class="grid-icon">👻</span><span>DETECT</span></div>
        <div class="grid-btn active-state" id="btnVAD" onclick="FeatureEngine.toggleVAD()"><span class="grid-icon">🎤</span><span>VAD</span></div>
        <div class="grid-btn" id="btnSensors" onclick="FeatureEngine.toggleSensors()"><span class="grid-icon">📡</span><span>SENSORS</span></div>
        <div class="grid-btn" id="btnRecord" onclick="FeatureEngine.toggleAutoRecord()"><span class="grid-icon">📼</span><span>RECORD</span></div>
        <div class="grid-btn" id="btnEMF" onclick="FeatureEngine.toggleEMF()"><span class="grid-icon">📏</span><span>EMF</span></div>
        <div class="grid-btn" id="btnTemp" onclick="FeatureEngine.toggleTemp()"><span class="grid-icon">🌡️</span><span>TEMP</span></div>
        <div class="grid-btn" id="btnEVP" onclick="FeatureEngine.toggleEVP()"><span class="grid-icon">📻</span><span>EVP</span></div>
    </div>
    <div id="terminal"></div>
    <div id="settingsModal">
        <div class="modal-content">
            <span onclick="App.toggleSettings()" style="float:right;font-size:1.5rem;color:var(--danger);cursor:pointer;">×</span>
            <h2 style="color:var(--primary);margin-bottom:12px;">SYSTEM CONFIGURATION</h2>
            <div class="setting-row">
                <label for="pitch">PITCH</label>
                <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">
            </div>
            <div class="setting-row">
                <label for="rate">RATE</label>
                <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
            </div>
            <div class="color-mode-container">
                <div class="color-mode-btn active" onclick="Config.setColorMode('submarine')">SUBMARINE</div>
                <div class="color-mode-btn" onclick="Config.setColorMode('dark')">DARK</div>
                <div class="color-mode-btn" onclick="Config.setColorMode('light')">LIGHT</div>
            </div>
            <button style="width:100%;margin-top:16px;padding:10px;" onclick="App.toggleSettings()">CLOSE</button>
        </div>
    </div>
    <script>
        // Configuration
        const Config = {
            data: {
                pitch: 1.0,
                rate: 1.0,
                colorMode: 'submarine'
            },
            colorModes: {
                submarine: {
                    primary: '#00ff88',
                    secondary: '#ff0000',
                    bg: '#0a1a2a',
                    panel: '#1a3a5a',
                    text: '#c0e0ff',
                    sonar: '#00ffff'
                },
                dark: {
                    primary: '#00ff88',
                    secondary: '#ff3333',
                    bg: '#000000',
                    panel: '#111111',
                    text: '#ffffff',
                    sonar: '#00ffff'
                },
                light: {
                    primary: '#0066ff',
                    secondary: '#ff0000',
                    bg: '#f0f0f0',
                    panel: '#e0e0e0',
                    text: '#000000',
                    sonar: '#0088ff'
                }
            },
            applyColorMode() {
                const mode = this.colorModes[this.data.colorMode];
                document.documentElement.style.setProperty('--primary', mode.primary);
                document.documentElement.style.setProperty('--secondary', mode.secondary);
                document.documentElement.style.setProperty('--bg', mode.bg);
                document.documentElement.style.setProperty('--panel', mode.panel);
                document.documentElement.style.setProperty('--text', mode.text);
                document.documentElement.style.setProperty('--sonar', mode.sonar);
            },
            setColorMode(mode) {
                this.data.colorMode = mode;
                this.applyColorMode();
            }
        };

        // Audio Engine
        const AudioEngine = {
            ctx: null,
            stream: null,
            analyser: null,
            isInit: false,
            async init() {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    this.stream = await navigator.mediaDevices.getUserMedia({audio: true});
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 256;
                    this.ctx.createMediaStreamSource(this.stream).connect(this.analyser);
                    this.isInit = true;
                    return true;
                } catch (e) {
                    console.error("Audio error:", e);
                    return false;
                }
            },
            getRMS() {
                if (!this.analyser) return 0;
                const data = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(data);
                let sum = 0;
                for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
                return Math.sqrt(sum / data.length) / 128;
            },
            destroy() {
                if (this.stream) this.stream.getTracks().forEach(t => t.stop());
                if (this.ctx) this.ctx.close();
                this.isInit = false;
            }
        };

        // Visual Engine
        const VisualEngine = {
            canvas: null,
            ctx: null,
            animId: null,
            isRunning: false,
            sonarAngle: 0,
            sonarPulse: 0,
            init() {
                this.canvas = document.getElementById('scopeCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
            },
            resize() {
                if (this.canvas) {
                    this.canvas.width = this.canvas.parentElement.clientWidth;
                    this.canvas.height = this.canvas.parentElement.clientHeight;
                }
            },
            start() {
                if (!this.isRunning) {
                    this.isRunning = true;
                    this.loop();
                    this.sonarPulseInterval = setInterval(() => {
                        this.sonarPulse = 1;
                        setTimeout(() => this.sonarPulse = 0, 500);
                    }, 3000);
                }
            },
            stop() {
                this.isRunning = false;
                if (this.animId) cancelAnimationFrame(this.animId);
                if (this.sonarPulseInterval) clearInterval(this.sonarPulseInterval);
            },
            loop() {
                if (!this.isRunning) return;
                const w = this.canvas.width, h = this.canvas.height;
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, w, h);

                // Draw sonar grid
                this.ctx.save();
                this.ctx.translate(w/2, h/2);
                this.ctx.strokeStyle = '#00ff8833';
                this.ctx.lineWidth = 1;
                for (let r = 30; r <= Math.min(w, h)/2; r += 30) {
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, r, 0, Math.PI * 2);
                    this.ctx.stroke();
                }
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 12) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, 0);
                    this.ctx.lineTo(Math.cos(a) * Math.min(w, h)/2, Math.sin(a) * Math.min(w, h)/2);
                    this.ctx.stroke();
                }
                this.ctx.restore();

                // Draw sonar sweep
                this.sonarAngle += 0.02;
                if (this.sonarAngle > Math.PI * 2) this.sonarAngle = 0;
                this.ctx.save();
                this.ctx.translate(w/2, h/2);
                this.ctx.strokeStyle = this.sonarPulse ? '#00ffff' : '#00ff88';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.moveTo(0, 0);
                this.ctx.lineTo(Math.cos(this.sonarAngle) * Math.min(w, h)/2, Math.sin(this.sonarAngle) * Math.min(w, h)/2);
                this.ctx.stroke();

                // Draw sonar ping if active
                if (this.sonarPulse) {
                    const ping = document.getElementById('sonarPing');
                    ping.style.opacity = 1;
                    setTimeout(() => ping.style.opacity = 0, 500);
                }
                this.ctx.restore();

                // Update HUD
                const rms = AudioEngine.isInit ? AudioEngine.getRMS() * 100 : 0;
                document.getElementById('hud').innerHTML =
                    `DEPTH: ${Math.floor(Math.random() * 100)}m<br>` +
                    `SONAR: ${Math.floor(Math.random() * 1000)} Hz<br>` +
                    `POWER: ${Math.floor(rms)}%<br>` +
                    `TEMP: ${(15 + Math.random() * 5).toFixed(1)}°C`;

                this.animId = requestAnimationFrame(() => this.loop());
            }
        };

        // Feature Engine
        const FeatureEngine = {
            mute: false,
            detection: true,
            ghostDetection: true,
            vad: true,
            sensorsActive: false,
            autoRecord: false,
            emfActive: false,
            tempActive: false,
            evpActive: false,
            toggleMute() {
                this.mute = !this.mute;
                document.getElementById('btnSound').classList.toggle('active-state');
                App.log(this.mute ? "Audio OFF" : "Audio ON");
            },
            togglePower() {
                document.getElementById('btnPower').classList.toggle('active-state');
                App.log("Power " + (document.getElementById('btnPower').classList.contains('active-state') ? "ON" : "OFF"));
            },
            toggleDetection() {
                this.detection = !this.detection;
                document.getElementById('btnDetect').classList.toggle('active-state');
                App.log("Sonar " + (this.detection ? "ACTIVE" : "INACTIVE"));
            },
            toggleGhostDetection() {
                this.ghostDetection = !this.ghostDetection;
                document.getElementById('btnGhost').classList.toggle('active-state');
                App.log("Detection " + (this.ghostDetection ? "ON" : "OFF"));
            },
            toggleVAD() {
                this.vad = !this.vad;
                document.getElementById('btnVAD').classList.toggle('active-state');
                App.log("VAD " + (this.vad ? "ON" : "OFF"));
            },
            toggleWhiteNoise() {
                document.getElementById('btnNoise').classList.toggle('active-state');
                App.log("Noise " + (document.getElementById('btnNoise').classList.contains('active-state') ? "ON" : "OFF"));
            },
            toggleSensors() {
                this.sensorsActive = !this.sensorsActive;
                document.getElementById('btnSensors').classList.toggle('active-state');
                App.log("Sensors " + (this.sensorsActive ? "ON" : "OFF"));
            },
            toggleAutoRecord() {
                this.autoRecord = !this.autoRecord;
                document.getElementById('btnRecord').classList.toggle('active-state');
                App.log("Recording " + (this.autoRecord ? "ON" : "OFF"));
            },
            toggleEMF() {
                this.emfActive = !this.emfActive;
                document.getElementById('btnEMF').classList.toggle('active-state');
                App.log("EMF " + (this.emfActive ? "ON" : "OFF"));
            },
            toggleTemp() {
                this.tempActive = !this.tempActive;
                document.getElementById('btnTemp').classList.toggle('active-state');
                App.log("Temp " + (this.tempActive ? "ON" : "OFF"));
            },
            toggleEVP() {
                this.evpActive = !this.evpActive;
                document.getElementById('btnEVP').classList.toggle('active-state');
                App.log("EVP " + (this.evpActive ? "ON" : "OFF"));
            }
        };

        // Main Application
        const App = {
            isRunning: false,
            async init() {
                Config.applyColorMode();
                VisualEngine.init();
                await AudioEngine.init();
                VisualEngine.start();
                this.isRunning = true;
                this.log("SYSTEM ONLINE - SUBMARINE MODE");
            },
            log(msg) {
                const t = document.getElementById('terminal');
                const d = document.createElement('div');
                d.className = 'log-line log-sys';
                d.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
                t.appendChild(d);
                t.scrollTop = t.scrollHeight;
            },
            toggleSettings() {
                const m = document.getElementById('settingsModal');
                m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
            }
        };

        // Initialize when loaded
        window.onload = () => App.init();
    </script>
</body>
</html>
