
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SUPRA JARVIS v30 OMEGA</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

:root{
--bg:#020202;
--panel:#0a0f12;
--cyan:#00f3ff;
--ghost:#bc13fe;
--demon:#ff003c;
--text:#dff;
--dim:#445;
}

body{
margin:0;
background:radial-gradient(circle at center,#071014,#000);
color:var(--text);
font-family:Consolas,monospace;
overflow:hidden;
}

header{
position:absolute;
top:0;
left:0;
right:0;
height:50px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
background:#000;
border-bottom:1px solid #222;
}

#brand{
color:var(--cyan);
font-weight:bold;
letter-spacing:2px;
}

#clock{
color:#999;
}

#layout{
position:absolute;
top:50px;
bottom:0;
left:0;
right:0;
display:flex;
}

aside{
width:260px;
background:var(--panel);
border-right:1px solid #222;
display:flex;
flex-direction:column;
}

aside.right{
border-right:none;
border-left:1px solid #222;
}

.panel{
padding:10px;
border-bottom:1px solid #222;
}

.panel-title{
color:#777;
font-size:12px;
margin-bottom:5px;
}

#logs{
flex:1;
overflow:auto;
font-size:11px;
}

.log{
padding:2px 0;
}

#stage{
flex:1;
position:relative;
}

canvas{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

#hud{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
pointer-events:none;
}

#maintext{
font-size:40px;
letter-spacing:4px;
color:var(--cyan);
}

#subtext{
color:#888;
}

.controls{
padding:10px;
display:flex;
flex-direction:column;
gap:5px;
}

button{
background:#111;
border:1px solid #444;
color:#ccc;
padding:8px;
cursor:pointer;
font-size:12px;
}

button.active{
border-color:var(--cyan);
color:var(--cyan);
}

input[type=range]{
width:100%;
}

.bar{
height:6px;
background:#111;
margin-top:2px;
}

.barfill{
height:6px;
background:var(--cyan);
width:0%;
}

</style>
</head>

<body>

<header>
<div id="brand">SUPRA JARVIS v30 OMEGA</div>
<div id="clock">00:00:00</div>
</header>

<div id="layout">

<aside>

<div class="panel">
<div class="panel-title">SYSTEM LOG</div>
<div id="logs"></div>
</div>

<div class="panel">
<div class="panel-title">POWER</div>
<div class="controls">
<button id="powerBtn">START JARVIS</button>
</div>
</div>

<div class="panel">
<div class="panel-title">MODES</div>
<div class="controls">
<button id="modeNormal" class="active">NORMAL</button>
<button id="modeGhost">GHOST</button>
<button id="modeDemon">DEMON</button>
</div>
</div>

</aside>

<div id="stage">

<canvas id="radar"></canvas>
<canvas id="spectrogram"></canvas>

<div id="hud">
<div id="maintext">STANDBY</div>
<div id="subtext">Activate system</div>
</div>

</div>

<aside class="right">

<div class="panel">
<div class="panel-title">AUDIO LEVEL</div>
<div class="bar"><div id="volbar" class="barfill"></div></div>
</div>

<div class="panel">
<div class="panel-title">BASS</div>
<div class="bar"><div id="bassbar" class="barfill"></div></div>
</div>

<div class="panel">
<div class="panel-title">TREBLE</div>
<div class="bar"><div id="treblebar" class="barfill"></div></div>
</div>

<div class="panel">
<div class="panel-title">SENSITIVITY</div>
<input type="range" id="sens" min="0" max="100" value="50">
</div>

<div class="panel">
<div class="panel-title">AI STATUS</div>
<div id="aiStatus">idle</div>
</div>

</aside>

</div>

<script>

const radarCanvas=document.getElementById("radar")
const radarCtx=radarCanvas.getContext("2d")

const specCanvas=document.getElementById("spectrogram")
const specCtx=specCanvas.getContext("2d")

function resize(){

radarCanvas.width=window.innerWidth-520
radarCanvas.height=window.innerHeight-50

specCanvas.width=window.innerWidth-520
specCanvas.height=200

specCanvas.style.top=(radarCanvas.height-200)+"px"

}

resize()
window.addEventListener("resize",resize)

let audioCtx
let analyser
let freq
let time

let active=false
let mode="normal"

function log(msg){

const d=document.createElement("div")
d.className="log"
d.textContent="["+new Date().toLocaleTimeString()+"] "+msg
document.getElementById("logs").prepend(d)

}

async function start(){

if(active) return

const stream=await navigator.mediaDevices.getUserMedia({audio:true})

audioCtx=new AudioContext()
const src=audioCtx.createMediaStreamSource(stream)

analyser=audioCtx.createAnalyser()
analyser.fftSize=4096

src.connect(analyser)

freq=new Uint8Array(analyser.frequencyBinCount)
time=new Uint8Array(analyser.frequencyBinCount)

active=true

document.getElementById("maintext").textContent="ACTIVE"
document.getElementById("subtext").textContent="Scanning audio"

log("Microphone connected")

loop()

}

document.getElementById("powerBtn").onclick=start

document.getElementById("modeNormal").onclick=()=>setMode("normal")
document.getElementById("modeGhost").onclick=()=>setMode("ghost")
document.getElementById("modeDemon").onclick=()=>setMode("demon")

function setMode(m){

mode=m

document.querySelectorAll(".controls button").forEach(b=>b.classList.remove("active"))

if(m==="normal")document.getElementById("modeNormal").classList.add("active")
if(m==="ghost")document.getElementById("modeGhost").classList.add("active")
if(m==="demon")document.getElementById("modeDemon").classList.add("active")

log("Mode "+m)

}

let specX=0

function drawSpectrogram(){

for(let i=0;i<freq.length;i++){

let v=freq[i]

specCtx.fillStyle="rgb("+v+",0,"+(255-v)+")"

specCtx.fillRect(specX,200-i/8,1,1)

}

specX++

if(specX>specCanvas.width){

specX=0
specCtx.clearRect(0,0,specCanvas.width,200)

}

}

function drawRadar(){

const w=radarCanvas.width
const h=radarCanvas.height

radarCtx.fillStyle="rgba(0,0,0,0.2)"
radarCtx.fillRect(0,0,w,h)

const cx=w/2
const cy=h/2

radarCtx.strokeStyle="#0ff"

radarCtx.beginPath()
radarCtx.arc(cx,cy,200,0,Math.PI*2)
radarCtx.stroke()

for(let i=0;i<360;i+=10){

let index=Math.floor(i/360*freq.length)

let val=freq[index]

let radius=200+val

let angle=i*Math.PI/180

let x=cx+Math.cos(angle)*radius
let y=cy+Math.sin(angle)*radius

radarCtx.beginPath()
radarCtx.moveTo(cx,cy)
radarCtx.lineTo(x,y)
radarCtx.stroke()

}

}

function ai(){

let volume=0

for(let i=0;i<time.length;i++){

let v=(time[i]-128)/128
volume+=v*v

}

volume=Math.sqrt(volume/time.length)

let bass=0
for(let i=0;i<30;i++)bass+=freq[i]
bass/=30

let treble=0
for(let i=200;i<500;i++)treble+=freq[i]
treble/=300

document.getElementById("volbar").style.width=(volume*100)+"%"
document.getElementById("bassbar").style.width=(bass/255*100)+"%"
document.getElementById("treblebar").style.width=(treble/255*100)+"%"

let result="noise"

if(volume>0.3)result="impact"
if(bass>120)result="low frequency"
if(treble>110)result="high frequency"

if(mode==="ghost" && treble>100)result="possible ghost band"
if(mode==="demon" && bass>120)result="deep low anomaly"

document.getElementById("aiStatus").textContent=result

}

function loop(){

if(!active)return

requestAnimationFrame(loop)

analyser.getByteFrequencyData(freq)
analyser.getByteTimeDomainData(time)

drawRadar()
drawSpectrogram()
ai()

}

setInterval(()=>{

document.getElementById("clock").textContent=new Date().toLocaleTimeString()

},1000)

</script>

</body>
</html>
