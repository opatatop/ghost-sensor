<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUPRA xAI v15.3 — NOTE 60 ELON MODE</title>
<style>
:root{--bg:#000;--primary:#00ff41;--xai:#00d4ff}
body{margin:0;background:var(--bg);color:var(--primary);font-family:'Courier New',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:70px;background:rgba(0,212,255,0.08);border-bottom:3px solid var(--xai);display:flex;justify-content:space-between;align-items:center;padding:0 15px}
.brand{font-size:1.4rem;font-weight:900;letter-spacing:6px;color:var(--xai)}
#status{font-size:0.95rem;background:#111;padding:6px 14px;border:2px solid var(--xai);min-width:180px;text-align:center}
#apikey{display:flex;gap:8px;padding:8px;background:#111}
input{background:#000;border:1px solid var(--xai);color:var(--xai);padding:8px;width:100%}
canvas{display:block;width:100%;height:100%}
#terminal{height:180px;background:#000;border-top:3px solid var(--xai);padding:10px;overflow-y:auto;font-size:11px}
.log{margin:3px 0}
.log.ai{color:#ff00ff}
.log.elon{color:#00d4ff}
button{background:#111;border:1px solid var(--xai);color:var(--xai);padding:10px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<header>
<div class="brand">SUPRA xAI v15.3 // ELON MODE</div>
<div id="status">NEURAL CORE : 100%</div>
</header>

<div id="apikey">
<input type="password" id="keyinput" placeholder="Colle ta clé OpenAI (sk-...)">
<button onclick="saveKey()">SAUVEGARDER CLÉ</button>
</div>

<div id="canvas-container"><canvas id="canvas"></canvas></div>
<div id="terminal"></div>

<div style="padding:12px;background:#111;display:flex;gap:8px;flex-wrap:wrap">
<button onclick="toggleRecording()">🎤 EVP LIVE</button>
<button onclick="manualScan()">SCAN xAI FULL</button>
<button onclick="clearLogs()">CLEAR</button>
</div>

<script>
const $ = id => document.getElementById(id);
const log = (txt, type="") => {
  const t = $('terminal');
  const d = document.createElement('div');
  d.className = `log ${type}`;
  d.innerHTML = `[${new Date().toLocaleTimeString('fr-FR')}] ${txt}`;
  t.appendChild(d);
  t.scrollTop = t.scrollHeight;
  if(t.children.length > 100) t.removeChild(t.firstChild);
};

let apiKey = localStorage.getItem('supra_xai_key') || "";
let lastTrigger = 0;
let stream, analyser, dataArray;
let ghostIntensity = 0;

// Sauvegarde + test immédiat
function saveKey() {
  apiKey = $('keyinput').value.trim();
  if(apiKey) {
    localStorage.setItem('supra_xai_key', apiKey);
    log("✅ CLÉ xAI CONNECTÉE", "elon");
    $('status').innerHTML = "CLÉ xAI OK";
    testKey(); // test immédiat
  }
}

// Test clé rapide
async function testKey() {
  try {
    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
      body:JSON.stringify({model:"gpt-4o-mini",messages:[{role:"user",content:"test"}],max_tokens:5})
    });
    if(res.ok) log("Clé valide – GPT-4o-mini prêt", "elon");
  } catch(e) {
    log("Clé invalide ou expirée", "elon");
  }
}

// Micro + analyse fréquences
async function initMicro() {
  stream = await navigator.mediaDevices.getUserMedia({audio:{sampleRate:48000}});
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const source = ctx.createMediaStreamSource(stream);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 4096;
  source.connect(analyser);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  log("Micro + analyse fréquences activé");
}

// Détection fréquence + transcription vocale
function analyzeFrequencies() {
  if(!analyser) return;
  analyser.getByteFrequencyData(dataArray);

  let maxFreq = 0, maxVal = 0;
  for(let i=0; i<dataArray.length; i++) {
    if(dataArray[i] > maxVal) {
      maxVal = dataArray[i];
      maxFreq = Math.round(i * (48000 / 4096)); // fréquence approximative
    }
  }

  if(maxVal > 180 && Date.now() - lastTrigger > 7000) { // pic fort
    lastTrigger = Date.now();
    ghostIntensity = 150;
    const message = `Fréquence ${maxFreq} Hz détectée – possible EVP`;
    log(message, "ai");
    speak(message);
    triggerElonAI(`Bruit à ${maxFreq} Hz`);
  }
}

// IA qui répond vraiment
async function triggerElonAI(reason) {
  if(Date.now() - lastTrigger < 8000) return;
  lastTrigger = Date.now();

  let reply = "";
  if(apiKey) {
    try {
      const res = await fetch("https://api.openai.com/v1/chat/completions", {
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
        body:JSON.stringify({
          model:"gpt-4o-mini",
          messages:[{role:"system",content:"Tu es Grok par xAI. Parle comme Elon Musk : direct, visionnaire, un peu troll. Réponds court en français."},
                    {role:"user",content:`${reason} sur Realme Note 60. Réponds.`}]
        })
      });
      const data = await res.json();
      reply = data.choices[0].message.content;
    } catch(e) {
      reply = "API momentanément indisponible… mode local activé.";
    }
  } else {
    const replies = ["Intéressant…", "C’est comme Neuralink mais fantôme.", "Quelque chose essaie de parler.", "On est sur Mars là ?"];
    reply = replies[Math.floor(Math.random()*replies.length)];
  }

  log(`ELON/GROK : ${reply}`, "ai");
  speak(reply);
}

function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95;
  u.pitch = 0.9;
  speechSynthesis.speak(u);
}

// Reconnaissance vocale (quand tu parles)
const rec = new (window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang = 'fr-FR';
rec.continuous = true;
rec.interimResults = true;
rec.onresult = e => {
  const txt = e.results[e.results.length-1][0].transcript.toLowerCase();
  if(txt.includes('esprit') || txt.includes('supra') || txt.includes('elon') || txt.includes('grok') || txt.includes('réponds')) {
    triggerElonAI("Commande vocale : " + txt);
  }
};
rec.start();

// Capteurs
if(window.DeviceOrientationEvent) window.addEventListener('deviceorientation', e => {
  const emf = Math.hypot(e.alpha||0, e.beta||0, e.gamma||0) / 3;
  if(emf > 45) triggerElonAI("EMF SPIKE");
});

if(window.DeviceMotionEvent) window.addEventListener('devicemotion', e => {
  const motion = Math.hypot(e.acceleration.x||0, e.acceleration.y||0, e.acceleration.z||0);
  if(motion > 9) triggerElonAI("COUP DÉTECTÉ");
});

// Boucle analyse fréquences
setInterval(() => {
  if(analyser) analyzeFrequencies();
}, 300);

// Canvas
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;} resize();
window.addEventListener('resize',resize);

function draw() {
  requestAnimationFrame(draw);
  ctx.fillStyle = "rgba(0,0,0,0.15)"; ctx.fillRect(0,0,canvas.width,canvas.height);
  if(analyser) {
    analyser.getByteFrequencyData(dataArray);
    for(let i=0;i<90;i++){
      const h = (dataArray[i*9]||0)/255 * canvas.height * 0.85;
      ctx.fillStyle = h > canvas.height*0.6 ? '#ff00ff' : '#00d4ff';
      ctx.fillRect(i*(canvas.width/90), canvas.height-h, 6, h);
    }
  }
  if(ghostIntensity > 5){
    const cx = canvas.width/2, cy = canvas.height/2;
    ctx.shadowBlur = 50; ctx.shadowColor = '#00d4ff';
    for(let i=0;i<22;i++){
      const x = cx + Math.sin(Date.now()/200 + i) * (90 + ghostIntensity);
      ctx.fillStyle = `rgba(0,212,255,${ghostIntensity/200})`;
      ctx.fillRect(x-5, cy-8, 12, 12);
    }
    ghostIntensity *= 0.92;
  }
}
draw();

function manualScan(){ triggerElonAI("Scan manuel"); }
function clearLogs(){ $('terminal').innerHTML = ''; }

initMicro();
log("SUPRA xAI v15.3 corrigée – clé + transcription fréquences + réponse vocale");
log("Parle-lui ou fais du bruit – il va transcrire et répondre");
</script>
</body>
</html>
