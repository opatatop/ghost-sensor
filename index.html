<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUPRA NEURAL AI v3.3 (MOBILE)</title>
<style>
    :root {
        --bg-color: #020205;
        --primary: #00f3ff; 
        --secondary: #ff00ff;
        --danger: #ff3333;
        --success: #33ff33;
        --warning: #ffcc00;
        --font-main: 'Courier New', monospace;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
        margin: 0;
        background-color: var(--bg-color);
        color: #e0e0e0;
        font-family: var(--font-main);
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* Fond Grid */
    body::before {
        content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background-image: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
        background-size: 30px 30px;
        z-index: 0; pointer-events: none;
    }

    header {
        position: relative; z-index: 10; height: 70px;
        background: rgba(0,0,0,0.95);
        border-bottom: 1px solid var(--primary);
        display: flex; justify-content: space-between; align-items: center; padding: 0 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .brand { 
        font-size: 1rem; font-weight: bold; color: var(--primary); 
        letter-spacing: 1px; text-transform: uppercase; 
        display: flex; align-items: center; gap: 8px; 
    }
    .brand span { color: var(--secondary); }
    .net-status { font-size: 0.7rem; color: #555; border: 1px solid #333; padding: 2px 5px; border-radius: 4px; }
    .net-ok { color: var(--success); border-color: var(--success); }

    .controls { display: flex; gap: 8px; }

    button {
        background: rgba(0,0,0,0.6); border: 1px solid var(--primary); color: var(--primary);
        padding: 8px 12px; font-family: var(--font-main); font-size: 0.75rem; font-weight: bold;
        cursor: pointer; transition: 0.2s; text-transform: uppercase; border-radius: 4px;
        flex: 1; /* Pour élargir les boutons sur mobile */
    }
    button:active { transform: scale(0.95); }
    button:hover:not(:disabled) { background: var(--primary); color: #000; }
    button.active { background: var(--danger); color: #fff; border-color: var(--danger); animation: pulse 2s infinite; }
    button:disabled { border-color: #444; color: #444; opacity: 0.5; }

    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(255, 51, 51, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); } }

    #canvas-container { flex-grow: 1; position: relative; z-index: 1; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }

    #terminal {
        height: 25vh; min-height: 150px; background: rgba(10, 10, 16, 0.95);
        border-top: 1px solid var(--secondary);
        padding: 10px; font-size: 12px; overflow-y: auto;
        z-index: 10; scrollbar-width: thin; scrollbar-color: var(--secondary) #000;
    }
    .log-line { margin-bottom: 4px; border-left: 2px solid transparent; padding-left: 8px; opacity: 0.9; animation: slideIn 0.2s; word-break: break-all; }
    .log-sys { color: #888; border-color: #888; }
    .log-user { color: var(--primary); border-color: var(--primary); }
    .log-ai { color: var(--secondary); border-color: var(--secondary); font-weight: bold; }
    .log-error { color: var(--danger); border-color: var(--danger); background: rgba(50,0,0,0.2); }
    .log-success { color: var(--success); border-color: var(--success); }

    @keyframes slideIn { from { opacity:0; transform:translateX(-10px); } to { opacity:0.9; transform:translateX(0); } }

    /* MODAL */
    #config-modal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9); z-index: 100;
        justify-content: center; align-items: center; padding: 20px;
    }
    .modal-box {
        background: #111; border: 1px solid var(--primary);
        padding: 20px; width: 100%; max-width: 400px;
        box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
    }
    .modal-box h3 { color: var(--primary); margin-top: 0; font-size: 1.1rem; }
    .modal-box input {
        width: 100%; background: #000; border: 1px solid #444;
        color: #fff; padding: 12px; margin: 10px 0; font-family: monospace; font-size: 1rem;
        box-sizing: border-box;
    }
    .modal-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    .btn-diag { background: #333; border-color: #888; color: #fff; width: 100%; }
    .btn-save { background: var(--primary); color: #000; font-weight: bold; width: 100%; }
    
    .diag-result { font-size: 0.8rem; margin-top: 10px; padding: 8px; background: #222; border-left: 3px solid #555; display: none;}

</style>
</head>
<body>

<header>
    <div class="brand">
        SUPRA <span>NEURAL</span>
        <div id="netBadge" class="net-status">NET ?</div>
    </div>
    <div class="controls" style="flex: 0 0 auto;">
        <button id="btnMic" style="flex:0 0 auto;">MIC</button>
        <button id="btnVoice" style="flex:0 0 auto;">ECOUTE</button>
        <button id="btnConfig" style="flex:0 0 auto;">⚙️</button>
    </div>
</header>

<div id="canvas-container">
    <canvas id="canvas"></canvas>
</div>

<div id="terminal"></div>

<!-- CONFIG MODAL -->
<div id="config-modal">
    <div class="modal-box">
        <h3>Configuration Mobile</h3>
        <label style="font-size:0.8rem; color:#aaa;">Clé API OpenAI (sk-...)</label>
        <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off">
        
        <div id="diagResult" class="diag-result"></div>

        <div class="modal-actions">
            <button class="btn-diag" id="btnDiag">🔍 DIAGNOSTIC RESEAU</button>
            <button class="btn-save" id="btnSave">SAUVEGARDER</button>
            <button onclick="toggleModal()" style="background:transparent; border-color:#555; color:#aaa; width:100%;">ANNULER</button>
        </div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);

const Logger = {
    log: (msg, type="sys") => {
        const d = document.createElement("div");
        d.className = `log-line log-${type}`;
        d.innerHTML = `[${new Date().toLocaleTimeString('fr-FR', {hour12:false})}] ${msg}`;
        $('terminal').appendChild(d);
        $('terminal').scrollTop = $('terminal').scrollHeight;
        if($('terminal').childElementCount > 50) $('terminal').removeChild($('terminal').firstChild);
    },
    error: (msg) => Logger.log(msg, "error"),
    success: (msg) => Logger.log(msg, "success")
};

class AudioEngine {
    constructor() { this.ready = false; this.analyser = null; this.dataArray = null; this.ctx = null; }
    async start() {
        if(this.ready) return;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            // Sur mobile, il faut parfois faire un resume() sur le contexte audio
            if (this.ctx.state === 'suspended') await this.ctx.resume();
            
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const src = this.ctx.createMediaStreamSource(stream);
            this.analyser = this.ctx.createAnalyser();
            this.analyser.fftSize = 256;
            this.analyser.smoothingTimeConstant = 0.8;
            src.connect(this.analyser);
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
            this.ready = true;
            Logger.log("Microphone connecté.", "sys");
            $('btnMic').classList.add('active');
        } catch(e) { 
            Logger.error("Micro refusé ou erreur: " + e.message); 
        }
    }
    getData() {
        if(!this.ready) return { vol:0, raw:null };
        this.analyser.getByteFrequencyData(this.dataArray);
        let sum=0;
        for(let i=0;i<this.dataArray.length;i++) sum+=this.dataArray[i];
        return { vol: sum/this.dataArray.length, raw: this.dataArray };
    }
}

class AIEngine {
    constructor() {
        this.apiKey = localStorage.getItem('supra_api_key') || "";
        this.synth = window.speechSynthesis;
        this.voices = [];
        // Précharger les voix (mobile est lent à ça)
        if(speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = () => this.voices = this.synth.getVoices();
    }

    setKey(key) { this.apiKey = key.trim(); localStorage.setItem('supra_api_key', this.apiKey); }
    hasKey() { return this.apiKey.length > 10; }

    async process(text) {
        if(text.length < 3) return;
        Logger.log(`Vous: "${text}"`, "user");

        let response = "";
        if (this.hasKey()) {
            Logger.log("Envoi vers l'IA...", "sys");
            try {
                response = await this.fetchGPT(text);
            } catch(e) {
                Logger.error("ERREUR: " + e.message);
                if(e.message.includes('Failed to fetch') || e.message.includes('NetworkError')) {
                    response = "Réseau bloqué. Vérifiez votre WiFi ou désactivez le 'Data Saver'.";
                } else {
                    response = "Erreur API: " + e.message;
                }
            }
        } else {
            text = text.toLowerCase();
            if(text.includes("bonjour")) response = "Bonjour. Configurez la clé API dans les paramètres.";
            else response = "Mode Offline. Pas de clé API.";
        }
        this.speak(response);
    }

    async fetchGPT(prompt) {
        const url = "https://api.openai.com/v1/chat/completions";
        
        // Timeout plus long pour mobile (10s)
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);

        try {
            const res = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${this.apiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-3.5-turbo",
                    messages: [{role: "system", content: "Tu es une IA mobile nommée Supra. Réponds très court."}, {role: "user", content: prompt}]
                }),
                signal: controller.signal
            });
            clearTimeout(timeoutId);

            const data = await res.json();
            if (!res.ok) {
                const errMsg = data.error ? data.error.message : `Erreur ${res.status}`;
                throw new Error(errMsg);
            }
            return data.choices[0].message.content;
        } catch(e) {
            clearTimeout(timeoutId);
            throw e;
        }
    }

    speak(text) {
        this.synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const fr = this.voices.find(v => v.lang.includes('fr'));
        if(fr) u.voice = fr;
        u.rate = 1.1;
        u.onstart = () => { Logger.log(`IA: "${text}"`, "ai"); app.pauseVoice(); };
        u.onend = () => { app.resumeVoice(); };
        this.synth.speak(u);
    }
}

class VoiceEngine {
    constructor(callback) {
        this.callback = callback;
        this.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        this.isActive = false;
        if(!this.SpeechRecognition) { 
            $('btnVoice').disabled = true; 
            Logger.error("Reconnaissance vocale non supportée sur ce navigateur.");
            return; 
        }
        
        this.rec = new this.SpeechRecognition();
        this.rec.lang = 'fr-FR';
        this.rec.continuous = true;
        this.rec.interimResults = false;
        
        this.rec.onstart = () => { 
            this.isActive = true; 
            $('btnVoice').classList.add('active');
            $('btnVoice').textContent = "ECOUTE ON";
        };
        this.rec.onend = () => {
            if(this.isActive) { try { this.rec.start(); } catch(e){} }
            else {
                $('btnVoice').classList.remove('active');
                $('btnVoice').textContent = "ECOUTE";
            }
        };
        this.rec.onerror = (e) => {
             if(e.error !== 'no-speech') Logger.error("Err Mic: " + e.error);
        };
        this.rec.onresult = (e) => {
            const txt = e.results[e.results.length-1][0].transcript;
            this.callback(txt);
        };
    }
    toggle() {
        if(this.isActive) { this.isActive = false; this.rec.stop(); }
        else { try { this.rec.start(); } catch(e){ Logger.error("Erreur démarrage micro"); } }
    }
    pause() { this.wasActive = this.isActive; this.isActive = false; try { this.rec.stop(); } catch(e){} }
    resume() { if(this.wasActive) { this.isActive = true; try { this.rec.start(); } catch(e){} } }
}

class Visuals {
    constructor() {
        this.c = $('canvas');
        this.ctx = this.c.getContext('2d');
        this.nodes = Array.from({length:40}, () => ({
            x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight,
            vx:(Math.random()-0.5), vy:(Math.random()-0.5), s:Math.random()*2+1
        }));
        const resize = () => {
            this.c.width=window.innerWidth; 
            this.c.height=window.innerHeight - $('header').offsetHeight - $('terminal').offsetHeight;
        };
        window.onresize = resize;
        resize();
    }
    draw(audio) {
        const { vol, raw } = audio;
        const w = this.c.width, h = this.c.height;
        this.ctx.fillStyle = "rgba(2,2,5,0.3)"; // Trainée plus légère
        this.ctx.fillRect(0,0,w,h);
        
        this.ctx.beginPath();
        this.ctx.arc(w/2, h/2, 20 + vol/2, 0, Math.PI*2);
        this.ctx.strokeStyle = `rgba(0,243,255, ${0.3 + vol/200})`;
        this.ctx.stroke();
        
        this.ctx.fillStyle = "#00f3ff";
        this.nodes.forEach(n => {
            n.x+=n.vx; n.y+=n.vy;
            if(n.x<0||n.x>w)n.vx*=-1; if(n.y<0||n.y>h)n.vy*=-1;
            this.ctx.beginPath();
            this.ctx.arc(n.x, n.y, n.s + vol/30, 0, Math.PI*2);
            this.ctx.fill();
        });
    }
}

class App {
    constructor() {
        this.audio = new AudioEngine();
        this.ai = new AIEngine();
        this.visuals = new Visuals();
        this.voice = new VoiceEngine(t => this.ai.process(t));
        
        $('btnMic').onclick = () => this.audio.start();
        $('btnVoice').onclick = () => this.voice.toggle();
        $('btnConfig').onclick = () => {
            $('apiKeyInput').value = this.ai.apiKey;
            $('diagResult').style.display = 'none';
            $('config-modal').style.display = 'flex';
        };

        $('btnSave').onclick = () => {
            this.ai.setKey($('apiKeyInput').value);
            toggleModal();
            Logger.success("Configuration sauvegardée.");
        };

        // Bouton Diagnostic Réseau
        $('btnDiag').onclick = async () => {
            const resDiv = $('diagResult');
            resDiv.style.display = 'block';
            resDiv.innerHTML = "Test en cours...";
            
            try {
                // Test 1: Google (Internet général)
                await fetch("https://www.google.com", { mode: 'no-cors' });
                resDiv.innerHTML += "<br>✅ Internet OK";
                
                // Test 2: OpenAI
                const key = $('apiKeyInput').value.trim();
                if(key.length > 5) {
                    try {
                        const apiRes = await fetch("https://api.openai.com/v1/models", { 
                            headers: { "Authorization": `Bearer ${key}` } 
                        });
                        if(apiRes.ok) {
                            resDiv.innerHTML += "<br>✅ OpenAI Accessible";
                            resDiv.style.borderColor = "var(--success)";
                        } else {
                            throw new Error("Clé API refusée (401)");
                        }
                    } catch(e) {
                        resDiv.innerHTML += `<br>❌ OpenAI Bloqué: ${e.message}`;
                        resDiv.style.borderColor = "var(--danger)";
                        Logger.error("Diagnostic OpenAI: " + e.message);
                    }
                } else {
                    resDiv.innerHTML += "<br>⚠️ Clé API manquante pour test OpenAI";
                }
            } catch(e) {
                resDiv.innerHTML = "<br>❌ Pas de connexion Internet !";
                resDiv.style.borderColor = "var(--danger)";
            }
        };

        this.loop();
        
        // Vérification initiale
        if(!this.ai.hasKey()) Logger.log("Bienvenue. Allez dans ⚙️ pour configurer l'IA.", "sys");
        else Logger.log("Prêt. Mode GPT activé.", "success");
    }
    pauseVoice() { this.voice.pause(); }
    resumeVoice() { this.voice.resume(); }
    loop() {
        requestAnimationFrame(() => this.loop());
        this.visuals.draw(this.audio.getData());
    }
}

window.toggleModal = () => $('config-modal').style.display = 'none';
const app = new App();
</script>
</body>
</html>
