<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS v30.0 - HUMAN</title>
    <!-- Polices -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        /* --- DESIGN SYSTEM --- */
        :root {
            --bg: #000000;
            --human: #00ff41;   /* Vert */
            --ghost: #d500f9;   /* Violet */
            --demon: #ff003c;   /* Rouge */
            --panel: rgba(20, 20, 20, 0.9);
            --font-head: 'Orbitron', sans-serif;
            --font-tech: 'Rajdhani', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: var(--font-tech); 
            height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- START BUTTON (Clean & Fast) --- */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #start-btn {
            padding: 20px 50px; font-size: 1.5rem; background: var(--human); color: #000; 
            border: none; font-family: var(--font-head); font-weight: 900; cursor: pointer; border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,255,65,0.4);
        }

        /* --- HEADER --- */
        header { height: 50px; background: #000; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 50; }
        .brand { font-family: var(--font-head); font-weight: 700; font-size: 1.1rem; color: var(--human); letter-spacing: 2px; }
        .clock { font-family: var(--font-mono); color: #666; font-size: 0.9rem; }

        /* --- MAIN STAGE --- */
        #stage { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.5; }

        #hud { 
            z-index: 10; text-align: center; width: 90%; padding: 20px; 
            background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 8px; backdrop-filter: blur(4px); 
        }

        #status-line { font-size: 0.8rem; color: #666; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; min-height: 15px; }
        #main-text { font-family: var(--font-head); font-size: 2.5rem; font-weight: 900; text-transform: uppercase; min-height: 50px; line-height: 1.1; text-shadow: 0 0 10px #000; transition: color 0.2s; }
        #response-text { font-size: 1.2rem; color: var(--human); border-top: 1px solid #222; padding-top: 15px; min-height: 30px; transition: color 0.2s; }

        /* --- CONTROLS --- */
        #controls { height: 90px; background: #050505; border-top: 1px solid #222; display: flex; justify-content: center; align-items: center; }
        
        #mic-btn {
            width: 70px; height: 70px; border-radius: 50%; background: #111; border: 2px solid #333; 
            color: #fff; font-size: 2rem; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: all 0.2s; position: relative;
        }
        
        /* Active States */
        #mic-btn.active { transform: scale(1.1); }
        #mic-btn.active.human { border-color: var(--human); color: var(--human); box-shadow: 0 0 25px rgba(0,255,65,0.4); }
        #mic-btn.active.ghost { border-color: var(--ghost); color: var(--ghost); box-shadow: 0 0 25px rgba(213,0,249,0.4); }
        #mic-btn.active.demon { border-color: var(--demon); color: var(--demon); box-shadow: 0 0 25px rgba(255,0,60,0.4); animation: pulse-demon 1s infinite; }

        @keyframes pulse-demon { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 0, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0); } }

        /* Helper for Mobile Keyboard avoiding overlap */
        @media (max-height: 500px) {
            #main-text { font-size: 1.8rem; }
            #hud { padding: 10px; }
        }
    </style>
</head>
<body>

    <!-- START SCREEN -->
    <div id="start-screen">
        <div style="font-family:var(--font-head); color:#fff; font-size:2rem; margin-bottom:20px;">JARVIS v30.0</div>
        <button id="start-btn">DÉMARRER</button>
    </div>

    <header>
        <div class="brand">JARVIS <span style="font-size:0.5em; color:#666;">HUMAN</span></div>
        <div class="clock" id="clock">00:00</div>
    </header>

    <div id="stage">
        <canvas id="visualizer"></canvas>
        
        <div id="hud">
            <div id="status-line">INITIALISATION...</div>
            <div id="main-text">EN ATTENTE</div>
            <div id="response-text">Système prêt.</div>
        </div>
    </div>

    <div id="controls">
        <div id="mic-btn" onclick="toggleMic()">🎙️</div>
    </div>

    <script>
        /* ==============================================================================
           JARVIS v30.0 - HUMAN EDITION (THE FINAL CODE)
           Optimized for Stability, Accuracy and Real-time Feedback.
           ============================================================================== */

        let recognition;
        let audioCtx, analyser, dataArray;
        let isListening = false;
        let currentMode = 'human'; // human, ghost, demon
        let modeDebounce = 0; // Prevent flickering between modes

        // --- AUDIO ENGINE ---
        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048; // High resolution for pitch detection
                const src = audioCtx.createMediaStreamSource(stream);
                src.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                drawLoop();
                return true;
            } catch(e) {
                alert("Erreur Micro : " + e.message + ". Vérifie les permissions Android.");
                return false;
            }
        }

        function drawLoop() {
            if(!audioCtx) return;
            requestAnimationFrame(drawLoop);
            analyser.getByteFrequencyData(dataArray);

            // --- AUTO MODE DETECTION (Pitch Analysis) ---
            let bass = 0, treble = 0;
            const len = dataArray.length;
            
            for(let i=0; i<len; i++) {
                const v = dataArray[i];
                if(i < len * 0.15) bass += v; // Low frequencies
                if(i > len * 0.6) treble += v; // High frequencies
            }

            // Thresholds
            if (bass > 8000 && treble < 5000) detectMode('demon');
            else if (treble > 6000 && bass < 5000) detectMode('ghost');
            else if (Math.abs(bass - treble) < 2000) detectMode('human');

            // --- VISUALIZER DRAWING ---
            const cvs = document.getElementById('visualizer');
            const ctx = cvs.getContext('2d');
            const w = cvs.width = window.innerWidth;
            const h = cvs.height = window.innerHeight;
            ctx.clearRect(0,0,w,h);

            let color = '#00ff41';
            if(currentMode === 'ghost') color = '#d500f9';
            if(currentMode === 'demon') color = '#ff003c';

            ctx.lineWidth = 2;
            ctx.strokeStyle = color;
            ctx.beginPath();
            
            const sliceW = w * 1.0 / len;
            let x = 0;
            for(let i = 0; i < len; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * h / 2;
                if(i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                x += sliceW;
            }
            ctx.stroke();
        }

        function detectMode(mode) {
            const now = Date.now();
            if(now - modeDebounce < 1000) return; // Wait 1s before switching to avoid flicker
            if(currentMode === mode) return;

            currentMode = mode;
            modeDebounce = now;
            updateVisualMode();
        }

        function updateVisualMode() {
            const btn = document.getElementById('mic-btn');
            btn.className = 'active'; // Reset
            if(currentMode !== 'human') btn.classList.add(currentMode);
            
            const status = document.getElementById('status-line');
            if(currentMode === 'demon') { status.innerText = "DÉTECTION: SIGNAUX GRAVES"; status.style.color = "var(--demon)"; }
            else if(currentMode === 'ghost') { status.innerText = "DÉTECTION: SIGNAUX AIGUS"; status.style.color = "var(--ghost)"; }
            else { status.innerText = "DÉTECTION: NORMAL"; status.style.color = "#666"; }
        }

        // --- SPEECH ENGINE (Stable Loop) ---
        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) return alert("Utilise Chrome.");

            recognition = new SR();
            recognition.continuous = false; // Android Fix
            recognition.interimResults = true;
            recognition.lang = 'fr-FR';

            recognition.onstart = () => {
                isListening = true;
                updateVisualMode(); // Sync color immediately
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('mic-btn').classList.remove('active');
                
                // Auto-restart loop
                if (document.getElementById('mic-btn').classList.contains('flag-active')) {
                    setTimeout(() => { try { recognition.start(); } catch(e){} }, 300);
                }
            };

            recognition.onresult = (e) => {
                let interim = '', final = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) final += e.results[i][0].transcript;
                    else interim += e.results[i][0].transcript;
                }

                if(interim) document.getElementById('main-text').innerText = interim;
                
                if(final) {
                    processCommand(final);
                }
            };
            
            recognition.onerror = (e) => {
                if(e.error === 'not-allowed') alert("Micro refusé.");
                else console.log(e);
            };
        }

        // --- CORE LOGIC (The Brain) ---
        function processCommand(text) {
            const t = text.toLowerCase();
            const mainEl = document.getElementById('main-text');
            const respEl = document.getElementById('response-text');
            
            // Colors
            let color = '#00ff41';
            if(currentMode === 'ghost') color = '#d500f9';
            if(currentMode === 'demon') color = '#ff003c';
            
            mainEl.style.color = color;
            respEl.style.color = color;

            // Logic
            let reply = "";

            // 1. MATH
            if (/(\d)\s*(plus|moins|fois|divisé)/.test(t)) {
                try {
                    let clean = t.replace("égal", "=").replace("fois", "*").replace("plus", "+").replace("moins", "-").replace("divisé", "/").replace("?", "");
                    if (/^[\d\+\-\*\/\(\)\.\s]+$/.test(clean)) {
                        reply = `Le résultat est ${eval(clean)}.`;
                    }
                } catch(e) {}
            }

            // 2. TIME
            else if (t.includes('heure')) reply = `Il est ${new Date().toLocaleTimeString('fr-FR')}.`;

            // 3. MODE RESPONSES
            else if (!reply) {
                if(currentMode === 'ghost') {
                    reply = `...${text}... l'esprit est ici...`;
                }
                else if(currentMode === 'demon') {
                    reply = `J'ENTENDS "${text.toUpperCase()}". NE ME DÉRANGE PAS !`;
                }
                else {
                    // Human Logic
                    if(t.includes('qui es-tu')) reply = "Je suis Jarvis v30.";
                    else if(t.includes('merci')) reply = "De rien.";
                    else reply = `Noté : "${text}".`;
                }
            }

            // Update UI
            mainEl.innerText = text.toUpperCase();
            respEl.innerText = reply;
            
            speak(reply, currentMode);
        }

        // --- SYNTHESIS ---
        function speak(txt, mode) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(txt);
            u.lang = 'fr-FR';
            
            // Voice Profile
            if(mode === 'ghost') { u.pitch = 1.6; u.rate = 0.7; }
            else if(mode === 'demon') { u.pitch = 0.4; u.rate = 1.4; }
            else { u.pitch = 1.0; u.rate = 1.0; }

            const voices = window.speechSynthesis.getVoices();
            const frVoice = voices.find(v => v.lang.includes('fr'));
            if(frVoice) u.voice = frVoice;

            window.speechSynthesis.speak(u);
        }

        // --- CONTROLS ---
        function toggleMic() {
            const btn = document.getElementById('mic-btn');
            if(!isListening) { 
                btn.classList.add('flag-active'); 
                try { recognition.start(); } catch(e){}
            } else { 
                btn.classList.remove('flag-active'); 
                recognition.stop(); 
            }
        }

        // --- INIT ---
        document.getElementById('start-btn').addEventListener('click', async () => {
            document.getElementById('start-screen').style.display = 'none';
            const ok = await initAudio();
            if(ok) {
                window.speechSynthesis.getVoices(); // Load voices
                initSpeech();
                speak("Jarvis v30 en ligne.", 'human');
            }
        });

        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR'), 1000);
    </script>
</body>
</html>
