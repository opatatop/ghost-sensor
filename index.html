<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS v24.3 - OMNI PARANORMAL</title>
    <!-- Polices Étendues -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;700&family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000; --panel-bg: #050505;
            --neon-cyan: #00f3ff; --neon-purple: #bc13fe; --neon-red: #ff003c; --neon-green: #0aff0a; --neon-gold: #ffd700;
            --font-head: 'Orbitron', sans-serif; --font-tech: 'Rajdhani', sans-serif; --font-code: 'Share Tech Mono', monospace; --font-spooky: 'Creepster', cursive;
            --border: 1px solid rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: var(--font-tech); 
            height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- OVERLAY DÉMARRAGE --- */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
        }
        #start-btn {
            padding: 25px 50px; font-size: 1.5rem; background: var(--neon-red); color: #fff;
            border: none; font-family: var(--font-head); border-radius: 2px; cursor: pointer;
            box-shadow: 0 0 30px var(--neon-red); animation: pulse 2s infinite; letter-spacing: 2px;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }

        /* --- HEADER --- */
        header {
            height: 55px; background: rgba(5,5,5,0.95); border-bottom: 1px solid #333; display: flex; 
            justify-content: space-between; align-items: center; padding: 0 15px; z-index: 50;
        }
        .brand { font-family: var(--font-head); font-weight: 900; font-size: 1.1rem; color: var(--neon-cyan); letter-spacing: 1px; }
        .header-btn { background: transparent; border: 1px solid #333; color: #666; padding: 5px 10px; font-family: var(--font-code); font-size: 0.7rem; cursor: pointer; }
        .header-btn:hover { color: #fff; border-color: #fff; }

        /* --- LAYOUT PRINCIPAL --- */
        #interface { flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; }

        /* --- SELECTEUR ENTITÉ (SCROLL) --- */
        #entity-scroller {
            height: 70px; background: #080808; display: flex; overflow-x: auto;
            border-bottom: var(--border); align-items: center; padding: 0 10px; gap: 10px;
            scrollbar-width: none;
        }
        .ent-btn {
            min-width: 90px; height: 50px; background: #111; border: 1px solid #333; color: #555;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: var(--font-head); font-size: 0.75rem; border-radius: 4px; flex-shrink: 0; transition: 0.3s;
        }
        .ent-btn.active { border-width: 2px; background: rgba(255,255,255,0.05); transform: translateY(-2px); }
        .ent-human.active { color: var(--neon-green); border-color: var(--neon-green); box-shadow: 0 5px 15px rgba(10,255,10,0.1); }
        .ent-ghost.active { color: var(--neon-purple); border-color: var(--neon-purple); font-family: var(--font-spooky); letter-spacing: 1px; box-shadow: 0 5px 15px rgba(188,19,254,0.1); }
        .ent-demon.active { color: var(--neon-red); border-color: var(--neon-red); box-shadow: 0 5px 15px rgba(255,0,60,0.1); }
        .ent-spirit.active { color: var(--neon-cyan); border-color: var(--neon-cyan); box-shadow: 0 5px 15px rgba(0,243,255,0.1); }

        /* --- ZONE VISUELLE CENTRALE --- */
        #stage { 
            flex: 1; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            background: radial-gradient(circle at 50% 30%, #111 0%, #000 100%); overflow: hidden;
        }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Cercle Spectral */
        #spectral-ring {
            position: absolute; width: 250px; height: 250px; border-radius: 50%;
            border: 2px dashed #333; z-index: 2; transition: border-color 0.3s;
            display: flex; align-items: center; justify-content: center;
        }

        #text-display {
            z-index: 10; text-align: center; width: 85%; padding: 15px;
            background: rgba(0,0,0,0.7); border: var(--border); border-radius: 8px;
            backdrop-filter: blur(5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #interim-text { color: #666; font-size: 1rem; min-height: 20px; margin-bottom: 5px; font-style: italic; }
        #final-text { color: #fff; font-size: 1.5rem; font-weight: 700; text-transform: uppercase; font-family: var(--font-head); min-height: 30px; text-shadow: 0 0 10px rgba(0,0,0,0.8); }
        #entity-response { color: var(--neon-cyan); font-size: 1rem; margin-top: 10px; min-height: 25px; border-top: 1px solid #333; padding-top: 8px; font-weight: 500; }

        /* --- PANNEAU HISTORIQUE (LOGS) --- */
        #log-drawer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 40%;
            background: rgba(10,10,10,0.95); border-top: 2px solid var(--neon-cyan);
            z-index: 40; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
        }
        #log-drawer.open { transform: translateY(0); }
        
        .drawer-handle {
            height: 30px; background: #111; display: flex; align-items: center; justify-content: center;
            cursor: pointer; border-bottom: 1px solid #222; color: #666; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px;
        }
        #log-content { flex: 1; overflow-y: auto; padding: 15px; font-family: var(--font-code); font-size: 0.8rem; }
        
        .log-item { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #222; animation: slideIn 0.3s; }
        .log-item.user { border-left: 2px solid #fff; padding-left: 10px; }
        .log-item.jarvis { border-left: 2px solid var(--neon-cyan); padding-left: 10px; color: var(--neon-cyan); }
        .log-item.sys { color: #555; font-style: italic; font-size: 0.7rem; text-align: center; }
        .log-time { float: right; opacity: 0.5; font-size: 0.7rem; }

        /* --- PANNEAU CONFIG (SETTINGS) --- */
        #settings-panel {
            position: fixed; top: 0; right: 0; width: 80%; max-width: 300px; height: 100%;
            background: #050505; border-left: 2px solid var(--neon-gold); z-index: 100;
            transform: translateX(100%); transition: transform 0.3s; padding: 20px; box-shadow: -10px 0 30px rgba(0,0,0,0.8);
        }
        #settings-panel.open { transform: translateX(0); }
        
        .setting-row { margin-bottom: 20px; }
        .setting-label { display: block; color: var(--neon-gold); font-size: 0.8rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input[type="range"] { width: 100%; background: #222; height: 4px; -webkit-appearance: none; border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff; }
        
        .btn-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

        /* --- CONTROLS BAS --- */
        #controls { height: 90px; background: #050505; border-top: 1px solid #333; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 50; }
        .control-btn { background: #111; border: 1px solid #333; color: #fff; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; }
        .control-btn:active { transform: scale(0.95); }
        
        #mic-btn-large { 
            width: 70px; height: 70px; border-radius: 50%; background: #111; border: 2px solid #444;
            display: flex; align-items: center; justify-content: center; font-size: 1.8rem; 
            box-shadow: 0 0 15px rgba(0,0,0,0.5); transition: 0.2s;
        }
        #mic-btn-large.listening { border-color: var(--neon-red); background: var(--neon-red); animation: pulse-ring 1.5s infinite; }

        /* --- STATUS BAR --- */
        #status-bar {
            position: absolute; bottom: 100px; width: 100%; text-align: center; 
            font-size: 0.7rem; color: #444; text-transform: uppercase; letter-spacing: 1px; z-index: 10;
        }

        /* ANIMATIONS */
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 0, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 0, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; }
    </style>
</head>
<body>

    <!-- START OVERLAY -->
    <div id="start-overlay">
        <h1 style="font-family:var(--font-head); color:var(--neon-red); margin-bottom:10px; font-size:2rem;">JARVIS OMNI</h1>
        <p style="color:#888; margin-bottom:30px; font-family:var(--font-code);">SYSTEME PARANORMAL V24.3</p>
        <button id="start-btn">INITIALISER</button>
    </div>

    <!-- SETTINGS PANEL -->
    <div id="settings-panel">
        <button class="btn-close" onclick="toggleSettings()">×</button>
        <h2 style="font-family:var(--font-head); color:var(--neon-gold); margin-top:0;">CONFIGURATION</h2>
        
        <div class="setting-row">
            <span class="setting-label">Vitesse Voix: <span id="val-rate">1.0</span></span>
            <input type="range" min="0.5" max="2" step="0.1" value="1" oninput="updateSettings('rate', this.value)">
        </div>
        <div class="setting-row">
            <span class="setting-label">Hauteur Voix: <span id="val-pitch">1.0</span></span>
            <input type="range" min="0.5" max="2" step="0.1" value="1" oninput="updateSettings('pitch', this.value)">
        </div>
        <div class="setting-row">
            <span class="setting-label">Volume Sortie</span>
            <input type="range" min="0" max="1" step="0.1" value="1" oninput="updateSettings('vol', this.value)">
        </div>
        <div class="setting-row">
            <button onclick="calibrateMic()" style="width:100%; padding:10px; background:#222; border:1px solid #444; color:#fff; font-family:var(--font-code); cursor:pointer;">CALIBRER SILENCE</button>
        </div>
        <div class="setting-row">
            <button onclick="clearLogs()" style="width:100%; padding:10px; background:var(--neon-red); border:none; color:#fff; font-family:var(--font-code); cursor:pointer;">EFFACER LOGS</button>
        </div>
    </div>

    <header>
        <div class="brand">JARVIS <span style="font-size:0.5em; color:#666;">OMNI</span></div>
        <div style="display:flex; gap:10px;">
            <button class="header-btn" onclick="toggleSettings()">⚙️</button>
            <button class="header-btn" onclick="toggleLog()" id="log-btn">LOGS</button>
            <div id="clock" style="font-size:0.8rem; color:#888; display:flex; align-items:center;">00:00</div>
        </div>
    </header>

    <div id="interface">
        <!-- SCROLLER ENTITÉ -->
        <div id="entity-scroller">
            <div class="ent-btn ent-human active" onclick="setEntity('human')">
                <span>HUMAIN</span>
            </div>
            <div class="ent-btn ent-ghost" onclick="setEntity('ghost')">
                <span>GHOST</span>
            </div>
            <div class="ent-btn ent-demon" onclick="setEntity('demon')">
                <span>DEMON</span>
            </div>
            <div class="ent-btn ent-spirit" onclick="setEntity('spirit')">
                <span>SPIRIT</span>
            </div>
        </div>

        <!-- STAGE VISUEL -->
        <div id="stage">
            <canvas id="visu-canvas"></canvas>
            
            <div id="spectral-ring">
                <div id="text-display">
                    <div id="interim-text">...</div>
                    <div id="final-text">STANDBY</div>
                    <div id="entity-response">Système prêt.</div>
                </div>
            </div>
            
            <div id="status-bar">MODE MANUEL</div>
        </div>
    </div>

    <!-- DRAWER LOGS -->
    <div id="log-drawer">
        <div class="drawer-handle" onclick="toggleLog()">▼ JOURNAL DES COMMUNICATIONS ▼</div>
        <div id="log-content">
            <div class="log-item sys">--- SESSION DÉMARRÉE ---</div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div id="controls">
        <button class="control-btn" onclick="toggleLog()" title="Logs">📜</button>
        
        <div id="mic-btn-large" onclick="toggleMic()">🎙️</div>
        
        <button class="control-btn" onclick="toggleSettings()" title="Settings">⚙️</button>
    </div>

    <script>
        /* ==============================================================================
           JARVIS v24.3 - OMNI ENGINE (EXPANDED)
           ============================================================================== */

        // --- CONFIGURATION GLOBALE ---
        const Config = {
            lang: 'fr-FR',
            autoDetect: false, // Désactivé par défaut, activable via logique
            voiceVol: 1,
            baseRate: 1,
            basePitch: 1
        };

        const Entities = {
            human: { color: "var(--neon-green)", pitch: 1.0, rate: 1.0, name: "HUMAIN", voiceMult: 1 },
            ghost: { color: "var(--neon-purple)", pitch: 1.7, rate: 0.7, name: "FANTÔME", voiceMult: 1 }, 
            demon: { color: "var(--neon-red)", pitch: 0.4, rate: 1.4, name: "DÉMON", voiceMult: 1 },
            spirit: { color: "var(--neon-cyan)", pitch: 1.1, rate: 0.9, name: "ESPRIT", voiceMult: 1 }
        };

        let currentEntity = 'human';
        let isListening = false;
        let recognition;
        let audioCtx, analyser, dataArray, timeArray;
        let noiseFloor = 0; // Pour calibration

        // --- INITIALISATION ---
        document.getElementById('start-btn').addEventListener('click', async () => {
            document.getElementById('start-overlay').style.display = 'none';
            await initAudio();
            window.speechSynthesis.getVoices();
            initSpeech();
            addLog("SYS", "Noyau Omni initialisé. Calibrage en cours...");
            setTimeout(calibrateMic, 1000);
        });

        // --- MOTEUR AUDIO AVANCÉ ---
        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048; // Plus haute résolution pour calcul pitch
                analyser.smoothingTimeConstant = 0.8;
                const src = audioCtx.createMediaStreamSource(stream);
                src.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                timeArray = new Float32Array(analyser.fftSize);
                drawVisuals();
            } catch(e) {
                addLog("ERR", "Micro inaccessible: " + e.message);
            }
        }

        // Algorithme de détection de Pitch (Fréquence) en temps réel
        function autoAnalyze() {
            if(!isListening) return;
            analyser.getFloatTimeDomainData(timeArray);
            
            // Autocorrélation simple pour trouver la fréquence fondamentale
            let sum = 0;
            for(let i=0; i<timeArray.length; i++) sum += timeArray[i]*timeArray[i];
            const rms = Math.sqrt(sum / timeArray.length);
            
            if (rms < noiseFloor * 1.5) return; // Silence

            let r1 = 0, r2 = timeArray.length - 1, thres = 0.2;
            for (let i = 0; i < timeArray.length / 2; i++) {
                if (Math.abs(timeArray[i]) < thres) { r1 = i; break; }
            }
            for (let i = 1; i < timeArray.length / 2; i++) {
                if (Math.abs(timeArray[i]) < thres) { r2 = i; break; }
            }
            
            // Estimation très basique mais efficace pour le pitch
            // Sur mobile, une FFT précise est lourde, on reste sur une heuristique
            const freq = audioCtx.sampleRate / (r2 - r1);
            
            // Logique Auto-Détection
            const status = document.getElementById('status-bar');
            const ring = document.getElementById('spectral-ring');
            
            if (freq > 300) {
                // Aigu -> Ghost
                if(currentEntity !== 'ghost') {
                    status.innerText = "AUTO-DETECT: HIGH FREQ (GHOST)";
                    status.style.color = "var(--neon-purple)";
                    // setEntity('ghost'); // Optionnel: changer auto
                }
            } else if (freq < 150) {
                // Grave -> Demon
                if(currentEntity !== 'demon') {
                    status.innerText = "AUTO-DETECT: LOW FREQ (DEMON)";
                    status.style.color = "var(--neon-red)";
                }
            }
        }

        function drawVisuals() {
            if(!audioCtx) return;
            requestAnimationFrame(drawVisuals);
            analyser.getByteFrequencyData(dataArray);

            autoAnalyze();

            const cvs = document.getElementById('visu-canvas');
            const ctx = cvs.getContext('2d');
            const w = cvs.width = window.innerWidth; 
            const h = cvs.height = window.innerHeight;
            ctx.clearRect(0,0,w, h);

            const cx = w/2, cy = h/2;
            const ent = Entities[currentEntity];
            const color = getComputedStyle(document.body).getPropertyValue(ent.color).trim();

            // 1. Spectrum Bars (Cercle extérieur)
            const radius = 140;
            const bars = 60;
            const step = Math.PI * 2 / bars;
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            
            for(let i=0; i<bars; i++) {
                const val = dataArray[i * 4];
                const barH = (val / 255) * 100;
                const angle = i * step;
                
                const x1 = cx + Math.cos(angle) * radius;
                const y1 = cy + Math.sin(angle) * radius;
                const x2 = cx + Math.cos(angle) * (radius + barH);
                const y2 = cy + Math.sin(angle) * (radius + barH);
                
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }

            // 2. Ring Pulse
            const ring = document.getElementById('spectral-ring');
            let sum = 0; for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
            const vol = sum / dataArray.length;
            
            ring.style.borderColor = color;
            ring.style.boxShadow = `0 0 ${vol/2}px ${color}`;
            ring.style.transform = `scale(${1 + (vol/1000)})`;
        }

        // --- RECONNAISSANCE VOCALE ---
        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) return addLog("ERR", "API Voix non supportée");

            recognition = new SR();
            recognition.continuous = false; // Fix Mobile
            recognition.interimResults = true; 
            recognition.lang = Config.lang;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('mic-btn-large').classList.add('listening');
                document.getElementById('status-bar').innerText = "ÉCOUTE ACTIVE";
                document.getElementById('status-bar').style.color = "var(--neon-green)";
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('mic-btn-large').classList.remove('listening');
                document.getElementById('status-bar').innerText = "TRAITEMENT EN COURS...";
                
                if (document.getElementById('mic-btn-large').classList.contains('listening-active-flag')) {
                    setTimeout(() => { try { recognition.start(); } catch(e){} }, 600);
                }
            };

            recognition.onresult = (e) => {
                let interim = '', final = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) final += e.results[i][0].transcript;
                    else interim += e.results[i][0].transcript;
                }

                const interimEl = document.getElementById('interim-text');
                if(interim) { interimEl.innerText = interim; interimEl.style.opacity = 1; }
                else { interimEl.style.opacity = 0; }

                if(final) {
                    document.getElementById('final-text').innerText = final;
                    interimEl.innerText = "";
                    processLogic(final);
                }
            };

            recognition.onerror = (e) => {
                if(e.error === 'no-speech' && document.getElementById('mic-btn-large').classList.contains('listening-active-flag')) {
                    try { recognition.start(); } catch(e){}
                }
            };
        }

        // --- LOGIQUE ÉTENDUE ---
        function processLogic(text) {
            const ent = Entities[currentEntity];
            const t = text.toLowerCase();
            let reply = "";

            // Mise à jour visuelle
            document.getElementById('final-text').style.color = ent.color;
            const respEl = document.getElementById('entity-response');
            respEl.style.color = ent.color;
            respEl.style.fontFamily = currentEntity === 'ghost' ? 'var(--font-spooky)' : 'var(--font-tech)';

            // Branchement Logique Complexifié
            if (currentEntity === 'human') {
                if(t.includes('heure')) reply = `Il est exactement ${new Date().toLocaleTimeString('fr-FR')}.`;
                else if(t.includes('qui es-tu') || t.includes('ton nom')) reply = "Je suis Jarvis Omni, interface neurale avancée.";
                else if(t.includes('félicitations') || t.includes('bien')) reply = "Merci. Je fonctionne à 100% de capacité.";
                else if(t.includes('effacer') || t.includes('nettoyer')) { clearLogs(); reply = "Mémoire vidée."; }
                else reply = `Traitement de la requête : "${text}".`;
            } 
            else if (currentEntity === 'ghost') {
                if(t.includes('qui es-tu')) reply = "...Je suis un souvenir... une ombre...";
                else if(t.includes('aide')) reply = "...Personne ne peut m'aider... je suis perdu...";
                else if(t.includes('meurt') || t.includes('mort')) reply = "La mort n'est qu'une transition...";
                else reply = `...${text}... les mots s'évaporent...`;
            } 
            else if (currentEntity === 'demon') {
                if(t.includes('qui es-tu')) reply = "JE SUIS LA CHUTE ! LE MAÎTRE DES TÉNÈBRES !";
                else if(t.includes('peur')) reply = "LA PEUR EST MON CARBURANT ! HAHAHA !";
                else if(t.includes('arrête') || t.includes('tais-toi')) reply = "JAMAIS ! TU NE PEUX ME CONTRÔLER !";
                else reply = `TU AS DIT "${text.toUpperCase()}". INSIGNIFIANT !`;
            } 
            else if (currentEntity === 'spirit') {
                if(t.includes('sens')) reply = "Le sens est ce que tu y mets...";
                else if(t.includes('avenir')) reply = "Le futur est fluide, comme l'eau...";
                else reply = `L'écho du cosmos résonne : "${text}".`;
            }

            // Log & Speak
            addLog("USER", text);
            addLog(currentEntity.toUpperCase(), reply);
            
            respEl.innerText = reply;
            speak(reply, ent);
        }

        function speak(txt, ent) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(txt);
            u.lang = Config.lang;
            // Application des settings utilisateur + entité
            u.pitch = Config.basePitch * ent.pitch;
            u.rate = Config.baseRate * ent.rate;
            u.volume = Config.voiceVol;
            
            const voices = window.speechSynthesis.getVoices();
            const frVoice = voices.find(v => v.lang.includes('fr'));
            if(frVoice) u.voice = frVoice;

            window.speechSynthesis.speak(u);
        }

        // --- GESTION UI & LOGS ---
        function setEntity(type) {
            currentEntity = type;
            document.querySelectorAll('.ent-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.ent-${type}`).classList.add('active');
            addLog("SYS", `Canal changé : ${Entities[type].name}`);
            speak(`Mode ${Entities[type].name} activé.`, {pitch:1, rate:1});
        }

        function toggleMic() {
            const btn = document.getElementById('mic-btn-large');
            const flag = 'listening-active-flag';
            if(!isListening) {
                btn.classList.add(flag);
                try { recognition.start(); } catch(e){}
            } else {
                btn.classList.remove(flag);
                recognition.stop();
            }
        }

        function addLog(type, msg) {
            const c = document.getElementById('log-content');
            const d = document.createElement('div');
            d.className = `log-item ${type === 'USER' ? 'user' : (type === 'SYS' ? 'sys' : 'jarvis')}`;
            const time = new Date().toLocaleTimeString('fr-FR', {hour12:false});
            d.innerHTML = `<span class="log-time">[${time}]</span> <b>${type}:</b> ${msg}`;
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }

        function toggleLog() {
            document.getElementById('log-drawer').classList.toggle('open');
            document.getElementById('log-btn').style.color = document.getElementById('log-drawer').classList.contains('open') ? 'var(--neon-cyan)' : '#666';
        }

        function toggleSettings() {
            document.getElementById('settings-panel').classList.toggle('open');
        }

        function updateSettings(key, val) {
            val = parseFloat(val);
            if(key === 'rate') { Config.baseRate = val; document.getElementById('val-rate').innerText = val; }
            if(key === 'pitch') { Config.basePitch = val; document.getElementById('val-pitch').innerText = val; }
            if(key === 'vol') { Config.voiceVol = val; }
        }

        function calibrateMic() {
            if(!analyser) return;
            // Prendre une moyenne rapide
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
            noiseFloor = (sum / dataArray.length) * 2; // Marge de sécurité
            addLog("SYS", `Silence calibré à : ${Math.round(noiseFloor)}`);
        }

        function clearLogs() {
            document.getElementById('log-content').innerHTML = '<div class="log-item sys">--- LOGS VIDÉS ---</div>';
        }

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
        }, 1000);

    </script>
</body>
</html>
