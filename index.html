<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUPRA ETERNITY v29 — ULTIMATE FIX ⚡</title>
    <style>
        :root { 
            --primary: #00ffff; --secondary: #bc13fe; --bg: #050510; --panel: #0a0a20; 
            --text: #e0e0ff; --danger: #ff3333; --accent: #00ff88; --evp: #ffaa00; 
        }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            margin:0; padding:0; font-family:'Courier New',monospace; background:var(--bg); 
            color:var(--text); display:flex; flex-direction:column; height:100vh; overflow:hidden;
        }
        
        /* HEADER */
        header { background:#000; border-bottom:3px solid var(--primary); padding:10px 15px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 0 25px rgba(0,255,255,0.5); z-index:50; }
        h1 { font-size:1rem; color:var(--primary); text-shadow:0 0 10px var(--primary); letter-spacing:2px; margin:0; line-height:1.2; }
        .version { font-size:0.7em; color:var(--secondary); display:block; }

        /* MAIN VISUALIZER */
        main { flex:1; position:relative; display:flex; flex-direction:column; }
        #visualizer { flex:1; background:#000; position:relative; overflow:hidden; }
        canvas { width:100%; height:100%; display:block; }

        /* OVERLAYS */
        #displayOverlay { position:absolute; top:20%; left:50%; transform:translateX(-50%); text-align:center; pointer-events:none; z-index:30; width:90%; }
        #mainText { font-size:1.8rem; font-weight:900; color:#fff; background:rgba(0,0,0,0.8); padding:10px 20px; border:2px solid var(--primary); text-transform:uppercase; text-shadow:0 0 10px var(--primary); margin-bottom:5px; backdrop-filter:blur(4px); }
        #subText { font-size:0.85rem; color:var(--secondary); letter-spacing:3px; font-weight:bold; background:rgba(0,0,0,0.6); display:inline-block; padding:2px 8px; border-radius:4px; }
        
        #evpStatus { position:absolute; top:15px; left:15px; color:var(--evp); font-size:0.75rem; font-weight:bold; border:1px solid var(--evp); padding:4px 8px; border-radius:4px; background:rgba(0,0,0,0.7); display:none; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity:0.6; } 50% { opacity:1; box-shadow:0 0 10px var(--evp); } 100% { opacity:0.6; } }

        #hud { position:absolute; top:15px; right:15px; background:rgba(0,0,0,0.85); padding:8px 12px; border:1px solid var(--accent); font-size:0.75rem; line-height:1.5; color:var(--accent); z-index:25; border-radius:4px; text-align:right; min-width:120px; }

        /* CONTROLS GRID */
        #actionGrid { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; padding:10px; background:var(--panel); border-top:1px solid #333; }
        .grid-btn { background:#111; border:1px solid #444; color:#aaa; padding:10px 2px; border-radius:4px; text-align:center; font-size:0.65rem; cursor:pointer; transition:all 0.2s; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
        .grid-btn span:first-child { font-size:1.2rem; }
        .grid-btn.active-state { background:var(--secondary); color:#fff; border-color:#fff; box-shadow:0 0 15px var(--secondary); font-weight:bold; }
        .grid-btn.active-evp { background:var(--evp); color:#000; border-color:#fff; box-shadow:0 0 15px var(--evp); font-weight:bold; }

        /* MAIN BUTTONS */
        #controls { background:var(--panel); padding:10px; display:grid; gap:8px; border-top:1px solid #222; }
        button { background:#0a0a0a; border:1px solid var(--primary); color:var(--primary); padding:12px; font-size:0.85rem; font-weight:bold; cursor:pointer; text-transform:uppercase; border-radius:4px; transition:all 0.15s; }
        button:active { transform:scale(0.96); }
        button.active-mode { background:var(--primary); color:#000; box-shadow:0 0 20px var(--primary); }
        button.danger { border-color:var(--danger); color:var(--danger); }
        button:disabled { opacity:0.3; cursor:not-allowed; filter:grayscale(1); }

        /* TERMINAL */
        #terminal { height:90px; background:#000; border-top:1px solid #333; padding:8px; font-size:0.65rem; overflow-y:auto; color:#888; line-height:1.3; font-family:'Courier New', monospace; }
        .log-line { margin-bottom:2px; border-left:2px solid #555; padding-left:6px; word-break:break-all; }
        .log-sys { border-color:#666; color:#aaa; }
        .log-ai { border-color:var(--secondary); color:var(--secondary); background:rgba(40,0,40,0.3); }
        .log-entity { border-color:#ff00ff; color:#ff00ff; font-weight:bold; }
        .log-evp { border-color:var(--evp); color:var(--evp); font-style:italic; }

        /* MODAL */
        #settingsModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:300; align-items:center; justify-content:center; backdrop-filter:blur(5px); }
        .modal-content { width:92%; max-width:500px; background:#111; border:2px solid var(--secondary); border-radius:8px; padding:20px; box-shadow:0 0 40px rgba(188,19,254,0.3); max-height:90vh; overflow-y:auto; }
        .setting-row { display:flex; justify-content:space-between; align-items:center; margin:12px 0; border-bottom:1px solid #222; padding-bottom:8px; }
        label { font-size:0.85rem; color:#ccc; }
        input[type=range] { accent-color:var(--secondary); width:50%; }
        input[type=password] { background:#222; border:1px solid #444; color:#fff; padding:5px; width:55%; border-radius:3px; }
        .close-btn { float:right; font-size:1.8rem; color:var(--danger); cursor:pointer; line-height:1; }

        /* EVP Visualizer Bar */
        #evpWaveform { height:40px; background:#000; width:100%; display:none; margin-top:5px; border:1px solid var(--evp); }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>SUPRA ETERNITY <span class="version">v29 FIX REALME</span></h1>
        </div>
        <button onclick="App.toggleSettings()" style="background:none;border:1px solid var(--secondary);color:var(--secondary);width:36px;height:36px;border-radius:50%;font-size:1.2rem;">⚙️</button>
    </header>

    <main>
        <div id="visualizer">
            <canvas id="scopeCanvas"></canvas>
            
            <div id="evpStatus">🔴 ENREGISTREMENT EVP EN COURS...</div>
            
            <div id="displayOverlay">
                <div id="mainText">SYSTÈME EN VEILLE</div>
                <div id="subText">INITIALISATION CAPTEURS</div>
            </div>
            
            <div id="hud">
                EMF: <span id="valEmf">0.0</span> μT<br>
                MAG: <span id="valMag">0</span>°<br>
                AUDIO: <span id="valAudio">--</span> dB
            </div>
        </div>
        <canvas id="evpWaveform"></canvas>
    </main>

    <div id="actionGrid">
        <div class="grid-btn" onclick="App.toggleSettings()"><span>⚙️</span>RÉGLAGES</div>
        <div class="grid-btn" id="btnEMF" onclick="FeatureEngine.toggleEMF()"><span>📡</span>EMF/MAG</div>
        <div class="grid-btn" id="btnVAD" onclick="FeatureEngine.toggleVAD()"><span>🎤</span>TRANSCRIPTION</div>
        <div class="grid-btn active-evp" id="btnEVP" onclick="FeatureEngine.toggleEVP()"><span>📻</span>EVP LIVE</div>
        <div class="grid-btn" id="btnGhost" onclick="FeatureEngine.toggleGhostDetection()"><span>👻</span>ENTITÉS</div>
        <div class="grid-btn" id="btnRecord" onclick="FeatureEngine.toggleAutoRecord()"><span>📼</span>AUTO-REC</div>
        <div class="grid-btn" id="btnPower" onclick="FeatureEngine.togglePower()"><span>⚡</span>ZEUS MODE</div>
        <div class="grid-btn" onclick="App.clearLog()"><span>🗑️</span>CLEAR</div>
    </div>

    <div id="controls">
        <button class="active-mode" id="btnMainStart" onclick="App.startFullSystem()">DÉMARRER SYSTÈME COMPLET</button>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <button onclick="App.replayLastEVP()">⏪ REJOUER EVP</button>
            <button class="danger" onclick="App.stopSystem()">ARRÊT TOTAL</button>
        </div>
    </div>

    <div id="terminal"></div>

    <div id="settingsModal">
        <div class="modal-content">
            <span class="close-btn" onclick="App.toggleSettings()">×</span>
            <h2 style="color:var(--primary);margin-top:0;">CONFIGURATION v29</h2>
            
            <h3 style="color:var(--secondary);font-size:0.9rem;border-bottom:1px solid #333;padding-bottom:5px;">IA (OPTIONNEL)</h3>
            <div class="setting-row">
                <label>Clé API (OpenAI/xAI)</label>
                <input type="password" id="keyinput" placeholder="sk-...">
            </div>
            <div style="text-align:right; margin-bottom:15px;">
                <button onclick="App.saveKey()" style="padding:6px 12px; font-size:0.8rem;">SAUVEGARDER CLÉ</button>
            </div>

            <h3 style="color:var(--evp);font-size:0.9rem;border-bottom:1px solid #333;padding-bottom:5px;">CAPTEURS & EVP</h3>
            <div class="setting-row">
                <label>Seuil EMF (μT)</label>
                <input type="range" id="emfSensitivity" min="10" max="90" step="5" value="40" oninput="Config.update(this)">
            </div>
            <div class="setting-row">
                <label>Sensibilité Audio</label>
                <input type="range" id="sensitivity" min="30" max="95" step="1" value="75" oninput="Config.update(this)">
            </div>
            <div class="setting-row">
                <label>Filtre EVP (Grave)</label>
                <input type="range" id="evpFilter" min="100" max="1000" step="50" value="400" oninput="Config.update(this)">
            </div>

            <button style="width:100%;margin-top:20px;" onclick="App.toggleSettings()">FERMER</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const Config = {
            data: { sensitivity: 75, minConfidence: 60, emfSensitivity: 40, evpFilter: 400 },
            load() { 
                const saved = localStorage.getItem('supra_v29'); 
                if (saved) Object.assign(this.data, JSON.parse(saved)); 
                // Apply to UI
                document.getElementById('sensitivity').value = this.data.sensitivity;
                document.getElementById('emfSensitivity').value = this.data.emfSensitivity;
                document.getElementById('evpFilter').value = this.data.evpFilter;
                document.getElementById('keyinput').value = localStorage.getItem('supra_api_key') || "";
            },
            save() { localStorage.setItem('supra_v29', JSON.stringify(this.data)); },
            update(el) { this.data[el.id] = parseFloat(el.value); this.save(); }
        };

        let apiKey = localStorage.getItem('supra_api_key') || "";
        let lastTrigger = 0;
        let isSystemRunning = false;
        
        // --- 2. MOTEUR AUDIO & EVP (VERSION ROBUSTE REALME) ---
        const AudioEngine = {
            ctx: null,
            analyser: null,
            stream: null,
            microphone: null,
            dataArray: null,
            
            async init() {
                try {
                    // 1. Création du contexte
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();

                    // IMPORTANT : Sur Android/Realme, le contexte est souvent 'suspended' au démarrage.
                    if (this.ctx.state === 'suspended') {
                        await this.ctx.resume();
                        App.log("🔊 AudioContext réveillé", "sys");
                    }

                    // 2. Configuration du flux (Contraintes assouplies pour Realme)
                    // On laisse le téléphone décider du sampleRate pour éviter l'erreur "Overconstrained"
                    const constraints = {
                        audio: {
                            echoCancellation: true,  // Sur Realme, il vaut mieux le laisser actif pour stabiliser le flux
                            noiseSuppression: true, // Idem
                            autoGainControl: false, // On garde ça false pour le style EVP
                            channelCount: 1
                        }
                    };

                    App.log("🔍 Demande d'accès micro...", "sys");
                    this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    
                    this.microphone = this.ctx.createMediaStreamSource(this.stream);
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 2048; 
                    this.microphone.connect(this.analyser);
                    
                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                    
                    App.log("✅ Audio connecté avec succès", "sys");
                    
                    // Initialisation de l'EVP après réussite
                    EVPRecorder.init(this.ctx, this.stream);
                    return true;

                } catch(e) {
                    console.error(e);
                    let errorMsg = "Erreur inconnue";
                    
                    // Analyse détaillée de l'erreur
                    switch(e.name) {
                        case 'NotAllowedError':
                        case 'PermissionDeniedError':
                            errorMsg = "Permissions refusées.";
                            break;
                        case 'NotFoundError':
                            errorMsg = "Aucun micro détecté.";
                            break;
                        case 'NotReadableError':
                            errorMsg = "Micro utilisé par une autre app.";
                            break;
                        case 'OverconstrainedError':
                        case 'ConstraintNotSatisfiedError':
                            errorMsg = "Format audio incompatible.";
                            break;
                        default:
                            errorMsg = e.message;
                    }
                    
                    App.log("❌ ERREUR MICRO : " + errorMsg, "sys");
                    alert("Erreur Micro :\n" + errorMsg + "\n\nSur Realme, n'ouvrez pas le fichier directement (file://), utilisez une app serveur.");
                    return false;
                }
            },
            getVolume() {
                if(!this.analyser) return 0;
                this.analyser.getByteFrequencyData(this.dataArray);
                let sum = 0;
                for(let i=0; i<this.dataArray.length; i++) sum += this.dataArray[i];
                return sum / this.dataArray.length;
            },
            stop() {
                if(this.stream) this.stream.getTracks().forEach(t => t.stop());
                if(this.ctx) this.ctx.close();
                EVPRecorder.stop();
            }
        };

        // --- 3. MOTEUR EVP (ENREGISTREMENT + FILTRE) ---
        const EVPRecorder = {
            mediaRecorder: null,
            audioChunks: [],
            audioContext: null,
            isRecording: false,
            lastBlobUrl: null,

            init(ctx, stream) {
                this.audioContext = ctx;
                // Enregistre par tranches de 5 secondes
                try {
                    this.mediaRecorder = new MediaRecorder(stream);
                    this.mediaRecorder.ondataavailable = (e) => {
                        // On garde seulement le dernier chunk (tampon circulaire de 5s)
                        this.audioChunks = [e.data]; 
                    };
                    this.start();
                } catch(e) {
                    App.log("⚠️ MediaRecorder non supporté", "sys");
                }
            },

            start() {
                if(this.mediaRecorder && this.mediaRecorder.state === "inactive") {
                    this.mediaRecorder.start(5000); // Un chunk toutes les 5s
                    this.isRecording = true;
                    document.getElementById('evpStatus').style.display = 'block';
                    document.getElementById('evpWaveform').style.display = 'block';
                }
            },

            stop() {
                if(this.mediaRecorder && this.mediaRecorder.state !== "inactive") {
                    this.mediaRecorder.stop();
                    this.isRecording = false;
                    document.getElementById('evpStatus').style.display = 'none';
                }
            },

            // Joue les 5 dernières secondes avec un effet "spectral"
            async playLastCapture() {
                if(this.audioChunks.length === 0) return;
                
                App.log("📻 ANALYSE SPECTRALE EN COURS...", "evp");
                
                const blob = new Blob(this.audioChunks, { type: 'audio/webm' });
                const arrayBuffer = await blob.arrayBuffer();
                const audioBuffer = await this.audioContext.decodeAudioData(arrayBuffer);

                // Création des noeuds pour l'effet
                const source = this.audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.playbackRate.value = 0.85; // Ralenti pour effet effrayant

                // Filtre Passe-Bas (son sourd, comme une radio)
                const filter = this.audioContext.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = Config.data.evpFilter; // Configurable

                // Gain pour éviter la saturation
                const gain = this.audioContext.createGain();
                gain.gain.value = 1.5;

                // Connexion : Source -> Filtre -> Gain -> Haut-parleurs
                source.connect(filter);
                filter.connect(gain);
                gain.connect(this.audioContext.destination);

                source.start(0);
                
                // Visualisation simple pendant lecture
                document.getElementById('mainText').innerText = "REPLAY EVP SPECTRAL";
                document.getElementById('mainText').style.color = "var(--evp)";
                document.getElementById('mainText').style.borderColor = "var(--evp)";
                
                source.onended = () => {
                    document.getElementById('mainText').innerText = "SURVEILLANCE ACTIVE";
                    document.getElementById('mainText').style.color = "#fff";
                    document.getElementById('mainText').style.borderColor = "var(--primary)";
                };
            }
        };

        // --- 4. VISUALISATION ---
        const VisualEngine = {
            canvas: null,
            ctx: null,
            evpCanvas: null,
            evpCtx: null,
            init() {
                this.canvas = document.getElementById('scopeCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.evpCanvas = document.getElementById('evpWaveform');
                this.evpCtx = this.evpCanvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.loop();
            },
            resize() {
                this.canvas.width = this.canvas.parentElement.clientWidth;
                this.canvas.height = this.canvas.parentElement.clientHeight;
                this.evpCanvas.width = this.evpCanvas.parentElement.clientWidth;
                this.evpCanvas.height = 40;
            },
            loop() {
                if(!isSystemRunning) return;
                requestAnimationFrame(() => this.loop());
                
                const w = this.canvas.width;
                const h = this.canvas.height;
                
                // Effet de traînée
                this.ctx.fillStyle = 'rgba(5, 5, 16, 0.2)';
                this.ctx.fillRect(0, 0, w, h);

                if (AudioEngine.dataArray) {
                    const data = AudioEngine.dataArray;
                    const barWidth = (w / data.length) * 2.5;
                    let barHeight;
                    let x = 0;

                    for (let i = 0; i < data.length; i++) {
                        barHeight = (data[i] / 255) * h * 0.9;
                        
                        // Couleur dynamique selon intensité
                        const r = barHeight + (25 * (i/data.length));
                        const g = 250 * (i/data.length);
                        const b = 255;

                        this.ctx.fillStyle = `rgb(${r},${g},${b})`;
                        this.ctx.fillRect(x, h - barHeight, barWidth, barHeight);
                        x += barWidth + 1;
                    }
                }

                // HUD Mise à jour Volume
                if(Math.random() > 0.8) { 
                    const vol = Math.round(AudioEngine.getVolume());
                    document.getElementById('valAudio').innerText = vol > 50 ? vol : "--";
                }
            }
        };

        // --- 5. IA & CERVEAU (VAD + API) ---
        const BrainEngine = {
            recognition: null,
            speak(text) {
                window.speechSynthesis.cancel(); // Arrêter l'ancien discours
                const u = new SpeechSynthesisUtterance(text);
                u.rate = 0.9; u.pitch = 0.6; // Voix plus grave
                u.volume = 1.0;
                window.speechSynthesis.speak(u);
            },
            initVoice() {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    App.log("❌ Navigateur incompatible avec la reconnaissance vocale", "sys");
                    return;
                }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                this.recognition = new SR();
                this.recognition.lang = 'fr-FR';
                this.recognition.continuous = true;
                this.recognition.interimResults = false; 

                this.recognition.onresult = e => {
                    const result = e.results[e.results.length-1];
                    const txt = result[0].transcript.trim();
                    const conf = Math.round(result[0].confidence * 100);
                    
                    if (txt.length > 2 && conf >= Config.data.minConfidence) {
                        App.handleDetection("VOIX", `"${txt}" (${conf}%)`);
                        EVPRecorder.playLastCapture(); // Jouer l'EVP associé
                    }
                };

                this.recognition.onerror = (e) => {
                    if(e.error !== 'no-speech') console.log(e.error);
                };

                this.recognition.onend = () => {
                    if(isSystemRunning && FeatureEngine.vadActive) this.recognition.start();
                };

                this.recognition.start();
                App.log("✅ Reconnaissance vocale active", "sys");
            }
        };

        // Fonction CORRIGÉE pour utiliser une vraie IA
        async function triggerAI(reason, contextText = "") {
            if (Date.now() - lastTrigger < 6000) return; // Cooldown
            lastTrigger = Date.now();

            // UI Feedback
            const display = document.getElementById('mainText');
            display.innerText = "CONNEXION NEURALE...";
            display.style.color = "var(--secondary)";

            let reply = "";

            if (apiKey) {
                try {
                    App.log("🧠 Envoi vers l'IA...", "ai");
                    const response = await fetch("https://api.openai.com/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: "gpt-3.5-turbo", // ou gpt-4o-mini
                            messages: [
                                {
                                    role: "system", 
                                    content: "Tu es ZEUS v29, une intelligence artificielle de chasseur de fantômes. Ton ton est sinistre, autoritaire et surnaturel. Tu analyses les capteurs EMF et audio. Réponds en moins de 25 mots. Utilise un vocabulaire paranormal." 
                                },
                                {
                                    role: "user", 
                                    content: `Détection : ${reason}. ${contextText ? "Contexte audio : " + contextText : ""}. Analyse la situation.`
                                }
                            ],
                            max_tokens: 60,
                            temperature: 0.9
                        })
                    });

                    if (!response.ok) throw new Error("Erreur API");
                    const data = await response.json();
                    reply = data.choices[0].message.content;

                } catch (error) {
                    App.log(`❌ Erreur IA: ${error.message}`, "ai");
                    reply = "La connexion spirituelle est instable.";
                }
            } else {
                // Mode Simulation si pas de clé
                const responses = [
                    "Présence confirmée dans le secteur.",
                    "Les fréquences sont perturbées.",
                    "Une énergie essaie de communiquer.",
                    "Anomalie magnétique détectée.",
                    "L'entité est proche, très proche."
                ];
                reply = responses[Math.floor(Math.random() * responses.length)];
                App.log("⚠️ Mode Simulation (Pas de clé API)", "ai");
            }

            App.log(`ZEUS : ${reply}`, "ai");
            BrainEngine.speak(reply);
            
            display.innerText = reply.toUpperCase();
            setTimeout(() => {
                display.innerText = "SURVEILLANCE ACTIVE";
                display.style.color = "#fff";
            }, 4000);
        }

        // --- 6. GESTION DES FONCTIONS ---
        const FeatureEngine = {
            emfActive: true,
            vadActive: true,
            ghostActive: true,
            autoRecordActive: true,
            powerMode: true,
            evpActive: true,

            toggleEMF() { 
                this.emfActive = !this.emfActive; 
                document.getElementById('btnEMF').classList.toggle('active-state', this.emfActive); 
                App.log(`EMF/MAG : ${this.emfActive ? 'ACTIF' : 'INACTIF'}`, "sys");
            },
            toggleVAD() { 
                this.vadActive = !this.vadActive; 
                document.getElementById('btnVAD').classList.toggle('active-state', this.vadActive);
                if(this.vadActive && isSystemRunning) BrainEngine.initVoice();
                else if(BrainEngine.recognition) BrainEngine.recognition.stop();
                App.log(`Transcription : ${this.vadActive ? 'ACTIF' : 'INACTIF'}`, "sys");
            },
            toggleGhostDetection() { 
                this.ghostActive = !this.ghostActive; 
                document.getElementById('btnGhost').classList.toggle('active-state', this.ghostActive); 
            },
            toggleAutoRecord() { 
                this.autoRecordActive = !this.autoRecordActive; 
                document.getElementById('btnRecord').classList.toggle('active-state', this.autoRecordActive); 
            },
            togglePower() { 
                this.powerMode = !this.powerMode; 
                document.getElementById('btnPower').classList.toggle('active-state', this.powerMode); 
            },
            toggleEVP() { 
                this.evpActive = !this.evpActive; 
                document.getElementById('btnEVP').classList.toggle('active-evp', this.evpActive); 
                if(this.evpActive) EVPRecorder.start(); else EVPRecorder.stop();
                App.log(`EVP Live : ${this.evpActive ? 'ACTIF' : 'INACTIF'}`, "sys");
            }
        };

        // --- 7. APPLICATION PRINCIPALE ---
        const App = {
            log(msg, type) {
                const t = document.getElementById('terminal');
                const d = document.createElement('div');
                d.className = 'log-line log-' + type;
                const time = new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                d.innerText = `[${time}] ${msg}`;
                t.appendChild(d);
                t.scrollTop = t.scrollHeight;
            },
            clearLog() { document.getElementById('terminal').innerHTML = ''; },
            
            saveKey() {
                apiKey = document.getElementById('keyinput').value.trim();
                localStorage.setItem('supra_api_key', apiKey);
                App.log("✅ Clé API sauvegardée", "ai");
                this.toggleSettings();
            },

            toggleSettings() {
                const m = document.getElementById('settingsModal');
                m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
            },

            handleDetection(type, details) {
                if (!FeatureEngine.ghostActive) return;
                
                App.log(`DETECTION [${type}] : ${details}`, "entity");
                
                // Effets visuels
                document.getElementById('subText').innerText = `${type} DÉTECTÉE • ANALYSE...`;
                document.getElementById('subText').style.color = "#ff00ff";
                
                // Déclenche l'IA
                triggerAI(type, details);
            },

            async startFullSystem() {
                if(isSystemRunning) return;
                
                const btn = document.getElementById('btnMainStart');
                btn.innerHTML = "⏳ INITIALISATION...";
                
                const ok = await AudioEngine.init();
                if (!ok) {
                    btn.innerHTML = "ERREUR MICRO";
                    return;
                }

                isSystemRunning = true;
                VisualEngine.init();
                
                if(FeatureEngine.vadActive) BrainEngine.initVoice();
                if(FeatureEngine.evpActive) EVPRecorder.start();

                btn.innerHTML = "SYSTÈME ACTIF (ZEUS v29)";
                btn.classList.add("active-mode");
                document.getElementById('mainText').innerText = "THUNDER OF ZEUS ACTIF";
                
                this.log("SYSTÊME SUPRA v29 DÉMARRÉ - TOUS LES CAPTEURS ACTIFS", "sys");
                BrainEngine.speak("Système Zeus en ligne. Recherche d'entités commencée.");
            },

            stopSystem() {
                isSystemRunning = false;
                AudioEngine.stop();
                if(BrainEngine.recognition) BrainEngine.recognition.stop();
                window.speechSynthesis.cancel();
                
                document.getElementById('btnMainStart').innerHTML = "DÉMARRER SYSTÈME COMPLET";
                document.getElementById('btnMainStart').classList.remove("active-mode");
                document.getElementById('mainText').innerText = "SYSTÈME ARRÊTÉ";
                document.getElementById('mainText').style.color = "var(--danger)";
                document.getElementById('mainText').style.borderColor = "var(--danger)";
                document.getElementById('subText').style.color = "var(--secondary)";
                
                this.log("ARRÊT TOTAL DU SYSTÈME", "sys");
            },

            replayLastEVP() {
                EVPRecorder.playLastCapture();
            }
        };

        // --- 8. CAPTEURS PHYSIQUES (EMF) ---
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', e => {
                if(!isSystemRunning || !FeatureEngine.emfActive) return;

                // Calcul pseudo-scientifique pour simuler l'EMF
                const alpha = e.alpha || 0;
                const beta = e.beta || 0;
                const gamma = e.gamma || 0;
                
                const noise = (Math.random() - 0.5) * 5;
                const emf = (Math.abs(alpha - 180) + Math.abs(beta) + Math.abs(gamma)) / 4 + noise;
                
                document.getElementById('valEmf').innerText = emf.toFixed(1);
                document.getElementById('valMag').innerText = Math.round(alpha);

                if (emf > Config.data.emfSensitivity && Date.now() - lastTrigger > 8000) {
                    App.handleDetection("EMF", `Spike magnétique à ${emf.toFixed(1)} μT`);
                }
            });
        } else {
            // Fallback desktop
            document.addEventListener('mousemove', (e) => {
                if(!isSystemRunning || !FeatureEngine.emfActive) return;
                const x = e.clientX / window.innerWidth;
                const emf = (x * 100) + (Math.random() * 10);
                document.getElementById('valEmf').innerText = emf.toFixed(1);
                document.getElementById('valMag').innerText = Math.round(x * 360);
                
                if (emf > Config.data.emfSensitivity && Date.now() - lastTrigger > 8000) {
                    App.handleDetection("EMF", `Flux énergétique détecté`);
                }
            });
        }

        window.onload = () => {
            Config.load();
            App.log("SUPRA ETERNITY v29 CHARGÉ. PRÊT.", "sys");
        };
    </script>
</body>
</html>
