<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPRA NEURAL AI v4.0 FINAL</title>
<style>
    :root { --bg:#020205; --primary:#00f3ff; --secondary:#ff00ff; --success:#33ff33; --danger:#ff3333; --panel:rgba(10,10,16,0.97); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:#e0e0e0; font-family:'Courier New',monospace; overflow:hidden; height:100vh; display:flex; flex-direction:column; }
    body::before { content:""; position:absolute; inset:0; background:linear-gradient(rgba(0,243,255,0.035)1px,transparent 1px),linear-gradient(90deg,rgba(0,243,255,0.035)1px,transparent 1px); background-size:28px 28px; z-index:0; pointer-events:none; }
    header { height:64px; background:rgba(0,0,0,0.93); border-bottom:2px solid var(--primary); display:flex; justify-content:space-between; align-items:center; padding:0 20px; z-index:10; }
    .brand { font-size:1.22rem; font-weight:bold; letter-spacing:3px; color:var(--primary); }
    .brand span { color:var(--secondary); }
    .env-badge { font-size:0.78rem; padding:5px 12px; border-radius:4px; font-weight:bold; }
    button { background:rgba(0,0,0,0.7); border:1px solid var(--primary); color:var(--primary); padding:8px 18px; margin:0 4px; cursor:pointer; transition:0.2s; text-transform:uppercase; }
    button:hover { background:var(--primary); color:#000; box-shadow:0 0 15px var(--primary); }
    button.active { background:var(--danger); color:#fff; }
    button.success { background:var(--success); color:#000; }
    #canvas-container { flex:1; position:relative; }
    canvas { display:block; width:100%; height:100%; }
    #terminal { height:210px; background:var(--panel); border-top:2px solid var(--secondary); padding:12px; font-size:13px; overflow-y:auto; }
    .log-line { margin:4px 0; padding-left:10px; border-left:3px solid; }
    .log-user { color:var(--primary); border-color:var(--primary); }
    .log-ai { color:var(--secondary); border-color:var(--secondary); font-weight:bold; }
    .log-error { color:var(--danger); border-color:var(--danger); }
    .log-success { color:var(--success); border-color:var(--success); }
</style>
</head>
<body>

<header>
    <div class="brand">SUPRA <span>NEURAL</span> AI <span style="font-size:0.8rem;opacity:0.6;">v4.0</span></div>
    <div id="envBadge" class="env-badge">READY</div>
    <div class="controls">
        <button id="btnMic">MICRO</button>
        <button id="btnVoice">ÉCOUTE</button>
        <button id="btnTest" class="success">TEST IA</button>
        <button id="btnAuto" class="success">🚀 FULL AUTO</button>
        <button id="btnClear">🗑️</button>
    </div>
</header>

<div id="canvas-container"><canvas id="canvas"></canvas></div>
<div id="terminal"></div>

<script>
const KEY = "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";
const $ = id => document.getElementById(id);

const Logger = {
    log: (msg, type="sys") => {
        const d = document.createElement("div");
        d.className = `log-line log-${type}`;
        d.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
        $('terminal').appendChild(d);
        $('terminal').scrollTop = $('terminal').scrollHeight;
    },
    success: m => Logger.log(m, "success"),
    error: m => Logger.log(m, "error")
};

class AIEngine {
    constructor() {
        this.key = KEY;
        this.synth = window.speechSynthesis;
        this.isSpeaking = false;
        this.voices = [];
        setTimeout(() => this.voices = this.synth.getVoices(), 500);
    }
    async process(text) {
        Logger.log(`VOIX: "${text}"`, "user");
        let resp = "SUPRA en ligne.";
        try {
            const res = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {"Content-Type":"application/json", "Authorization":`Bearer ${this.key}`},
                body: JSON.stringify({model:"gpt-4o-mini", messages:[{role:"system", content:"Réponds en français max 18 mots, style cyberpunk."}, {role:"user", content:text}], max_tokens:45})
            });
            const data = await res.json();
            resp = data.choices[0].message.content;
        } catch(e) {}
        this.speak(resp);
    }
    speak(text) {
        this.synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const fr = this.voices.find(v => v.lang.includes('fr'));
        if (fr) u.voice = fr;
        u.rate = 1.08; u.pitch = 1.05;
        u.onstart = () => { this.isSpeaking = true; Logger.log(`IA: "${text}"`, "ai"); };
        u.onend = () => { this.isSpeaking = false; };
        this.synth.speak(u);
    }
}

class AudioEngine {
    constructor() { this.ready = false; }
    async start() {
        if (this.ready) return;
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        const src = ctx.createMediaStreamSource(stream);
        this.analyser = ctx.createAnalyser();
        this.analyser.fftSize = 256;
        src.connect(this.analyser);
        this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
        this.ready = true;
        Logger.success("MICRO OK");
        $('btnMic').classList.add('active');
    }
    getData() {
        if (!this.ready) return {vol:0, raw:null};
        this.analyser.getByteFrequencyData(this.dataArray);
        let sum = 0; for (let v of this.dataArray) sum += v;
        return {vol: sum / this.dataArray.length, raw: this.dataArray};
    }
}

class Visuals {
    constructor() {
        this.c = $('canvas'); this.ctx = this.c.getContext('2d');
        this.nodes = Array.from({length:80}, () => ({x:Math.random()*innerWidth, y:Math.random()*innerHeight, vx:(Math.random()-0.5)*1.8, vy:(Math.random()-0.5)*1.8, s:Math.random()*3+1.5}));
        window.onresize = () => {this.c.width=innerWidth; this.c.height=innerHeight-274;};
        this.c.width=innerWidth; this.c.height=innerHeight-274;
    }
    draw(audio, speaking) {
        const {vol, raw} = audio; const w = this.c.width, h = this.c.height;
        this.ctx.fillStyle = "rgba(2,2,5,0.18)"; this.ctx.fillRect(0,0,w,h);
        const pulse = 45 + vol*0.9 + (speaking ? 28 : 0);
        this.ctx.shadowBlur = 45; this.ctx.shadowColor = "#00f3ff";
        this.ctx.beginPath(); this.ctx.arc(w/2, h/2, pulse, 0, Math.PI*2);
        this.ctx.strokeStyle = `rgba(0,243,255,${speaking?0.95:0.45})`; this.ctx.lineWidth = 6; this.ctx.stroke();
        this.ctx.shadowBlur = 0;
        for (let n of this.nodes) {
            n.x += n.vx; n.y += n.vy;
            if (n.x<0||n.x>w) n.vx*=-1; if (n.y<0||n.y>h) n.vy*=-1;
            this.ctx.fillStyle = "#00f3ff"; this.ctx.shadowBlur = 15; this.ctx.shadowColor = "#00f3ff";
            this.ctx.beginPath(); this.ctx.arc(n.x, n.y, n.s + vol/28, 0, Math.PI*2); this.ctx.fill();
        }
        this.ctx.shadowBlur = 0;
        this.ctx.lineWidth = 1.1;
        for (let i=0; i<this.nodes.length; i++) for (let j=i+1; j<this.nodes.length; j++) {
            const a = this.nodes[i], b = this.nodes[j];
            const d = Math.hypot(a.x-b.x, a.y-b.y);
            if (d < 165) {
                this.ctx.strokeStyle = `rgba(0,243,255,${(165-d)/165*0.6})`;
                this.ctx.beginPath(); this.ctx.moveTo(a.x,a.y); this.ctx.lineTo(b.x,b.y); this.ctx.stroke();
            }
        }
        if (raw) {
            const bw = w / raw.length;
            for (let i=0; i<raw.length; i++) {
                const height = (raw[i]/255) * h * 0.38;
                this.ctx.fillStyle = `rgba(255,0,255,0.35)`; this.ctx.fillRect(i*bw, h-height, bw-1, height);
            }
        }
    }
}

class VoiceEngine {
    constructor(cb) {
        this.cb = cb;
        this.rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        this.rec.lang = 'fr-FR'; this.rec.continuous = true;
        this.active = false;
        this.rec.onresult = e => this.cb(e.results[e.results.length-1][0].transcript);
        this.rec.onend = () => { if(this.active) this.rec.start(); };
    }
    toggle() {
        this.active = !this.active;
        this.active ? this.rec.start() : this.rec.stop();
        $('btnVoice').textContent = this.active ? "ÉCOUTE (ON)" : "ÉCOUTE";
        $('btnVoice').classList.toggle('active', this.active);
    }
}

class App {
    constructor() {
        this.audio = new AudioEngine();
        this.ai = new AIEngine();
        this.visuals = new Visuals();
        this.voice = new VoiceEngine(t => this.ai.process(t));

        setTimeout(async () => {
            await this.audio.start();
            this.voice.toggle();
            Logger.success("SUPRA LANCÉ");
        }, 600);

        $('btnMic').onclick = () => this.audio.start();
        $('btnVoice').onclick = () => this.voice.toggle();
        $('btnTest').onclick = () => this.ai.speak("Test vocal OK. Je suis SUPRA NEURAL AI v4.0.");
        $('btnAuto').onclick = () => { this.audio.start(); this.voice.toggle(); };
        $('btnClear').onclick = () => { $('terminal').innerHTML = ''; };

        document.addEventListener('keydown', e => { if(e.key === " ") this.voice.toggle(); });

        this.loop();
    }
    loop() {
        requestAnimationFrame(() => this.loop());
        this.visuals.draw(this.audio.getData(), this.ai.isSpeaking);
    }
}

const app = new App();
</script>
</body>
</html>
