<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS v22.0 - STANDALONE ULTIMATE</title>
    <!-- Polices Futuristes -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        /* --- DESIGN SYSTEM --- */
        :root {
            --bg: #050505; 
            --neon: #00ff41; 
            --alert: #ff003c; 
            --warn: #fcee0a; 
            --glass: rgba(10, 10, 10, 0.7);
            --border: 1px solid rgba(0, 255, 65, 0.2);
            --font-head: 'Orbitron', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }

        * { box-sizing: border-box; user-select: none; }
        
        body { 
            margin: 0; padding: 0; background: var(--bg); color: var(--neon); 
            font-family: var(--font-mono); height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
            background-image: 
                radial-gradient(circle at 50% 50%, #111 0%, #000 100%),
                linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        /* --- HEADER --- */
        header {
            height: 70px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; border-bottom: var(--border); background: var(--glass);
            backdrop-filter: blur(10px); z-index: 100;
        }
        .brand { 
            font-family: var(--font-head); font-weight: 900; letter-spacing: 4px; font-size: 1.4rem; 
            text-shadow: 0 0 15px rgba(0,255,65,0.4); display: flex; align-items: center; gap: 10px;
        }
        .brand::before { content:''; display:block; width:10px; height:10px; background:var(--neon); border-radius:50%; box-shadow:0 0 10px var(--neon); }
        
        .sys-info { text-align: right; font-size: 0.8rem; color: #666; }

        /* --- MAIN LAYOUT --- */
        #interface { flex: 1; display: grid; grid-template-columns: 300px 1fr 300px; gap: 1px; background: #222; position: relative; }
        
        /* SIDEBARS */
        aside { 
            background: rgba(0,0,0,0.8); padding: 25px; display: flex; flex-direction: column; 
            border-right: var(--border); position: relative; z-index: 10;
        }
        aside:last-child { border-right: none; border-left: var(--border); }

        .panel-header { 
            font-family: var(--font-head); font-size: 0.8rem; color: #666; letter-spacing: 2px; 
            border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; 
            display: flex; justify-content: space-between;
        }

        /* METRICS */
        .metric-card { background: #111; padding: 15px; border: 1px solid #333; margin-bottom: 15px; position: relative; overflow: hidden; }
        .metric-card::after { content:''; position: absolute; bottom:0; left:0; width:100%; height:2px; background:var(--neon); transform: scaleX(0); transition: transform 0.3s; }
        .metric-card:hover::after { transform: scaleX(1); }
        
        .m-label { font-size: 0.7rem; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .m-value { font-size: 1.8rem; font-family: var(--font-head); font-weight: 700; }
        .m-unit { font-size: 0.9rem; color: #666; }
        
        /* LOGS */
        #log-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 8px; font-size: 0.75rem; padding-right: 5px; }
        .log-line { border-left: 2px solid #333; padding-left: 8px; opacity: 0.8; }
        .log-line.jarvis { color: var(--neon); border-color: var(--neon); }
        .log-line.user { color: #fff; border-color: #fff; }
        .log-line.sys { color: #666; font-style: italic; }

        /* CENTER STAGE */
        #stage { 
            background: #000; position: relative; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; overflow: hidden;
        }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.4; }

        #hud-overlay { z-index: 10; text-align: center; width: 80%; }
        
        #verdict-label { 
            font-size: 1rem; color: #666; letter-spacing: 5px; margin-bottom: 15px; 
            text-transform: uppercase; font-weight: bold; 
        }
        
        #main-display { 
            font-family: var(--font-head); font-size: 3rem; font-weight: 900; text-transform: uppercase; 
            letter-spacing: 4px; line-height: 1; text-shadow: 0 0 30px rgba(0,0,0,0.8); 
            margin-bottom: 30px; min-height: 80px; transition: color 0.3s;
        }
        
        #response-box { 
            background: rgba(0,0,0,0.6); border: 1px solid #333; padding: 20px; 
            border-radius: 5px; min-height: 60px; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; backdrop-filter: blur(5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* FOOTER CONTROLS */
        footer { 
            height: 100px; background: #050505; border-top: var(--border); display: flex; 
            justify-content: center; align-items: center; z-index: 100; 
        }
        
        #btn-master { 
            width: 300px; height: 60px; background: transparent; border: 2px solid var(--neon); 
            color: var(--neon); font-family: var(--font-head); font-size: 1.1rem; letter-spacing: 3px; 
            cursor: pointer; text-transform: uppercase; position: relative; overflow: hidden; 
            transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        
        #btn-master:hover { background: var(--neon); color: #000; box-shadow: 0 0 40px var(--neon); }
        
        #btn-master.active { border-color: var(--alert); color: var(--alert); animation: pulse 1.5s infinite; }
        #btn-master.active:hover { background: var(--alert); box-shadow: 0 0 40px var(--alert); }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(255, 0, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0); } }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon); }

        @media (max-width: 900px) { 
            #interface { grid-template-columns: 1fr; grid-template-rows: 300px 1fr auto; } 
            aside { display: none; } 
            #main-display { font-size: 2rem; }
            header { padding: 0 15px; }
            .brand { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">JARVIS <span style="font-size:0.5em; opacity:0.6; margin-left:10px;">// STANDALONE CORE</span></div>
        <div class="sys-info">
            <div id="clock">00:00:00</div>
            <div style="font-size:0.7rem; color:#444;">SYSTEM READY</div>
        </div>
    </header>

    <div id="interface">
        <!-- LEFT: METRICS -->
        <aside>
            <div class="panel-header">
                <span>Signal Input</span>
                <span>REAL-TIME</span>
            </div>

            <div class="metric-card">
                <div class="m-label">Volume Input</div>
                <div class="m-value" id="val-vol">0</div>
                <div class="m-unit">DECIBELS (REL)</div>
            </div>

            <div class="metric-card">
                <div class="m-label">Speech Rate</div>
                <div class="m-value" id="val-wpm">0</div>
                <div class="m-unit">WORDS / MIN</div>
            </div>

            <div class="metric-card">
                <div class="m-label">Latency</div>
                <div class="m-value" id="val-ping">0</div>
                <div class="m-unit">MILLISECONDS</div>
            </div>
        </aside>

        <!-- CENTER: VISUALIZATION -->
        <main id="stage">
            <canvas id="scope"></canvas>
            <div id="hud-overlay">
                <div id="verdict-label">INITIAL STATUS</div>
                <div id="main-display">STANDBY</div>
                <div id="response-box">En attente d'initialisation vocale...</div>
            </div>
        </main>

        <!-- RIGHT: LOGS -->
        <aside>
            <div class="panel-header">
                <span>System Logs</span>
                <span>OUTPUT</span>
            </div>
            <div id="log-container">
                <div class="log-line sys">> Système chargé.</div>
                <div class="log-line sys">> En attente interaction utilisateur.</div>
            </div>
        </aside>
    </div>

    <footer>
        <button id="btn-master" onclick="App.toggle()">
            <span id="btn-icon">⚡</span>
            <span id="btn-text">INITIALISER SYSTÈME</span>
        </button>
    </footer>

    <script>
        /* ==============================================================================
           JARVIS v22.0 - STANDALONE ENGINE
           ============================================================================== */

        const State = { active: false, listening: false, processing: false };
        const Metrics = { vol: 0, wpm: 0, words: 0, startTime: 0 };
        let audioCtx, analyser, dataArray, canvasCtx;
        let recognition;

        // --- UI REFERENCES ---
        const UI = {
            main: document.getElementById('main-display'),
            resp: document.getElementById('response-box'),
            verdict: document.getElementById('verdict-label'),
            btn: document.getElementById('btn-master'),
            btnText: document.getElementById('btn-text'),
            logs: document.getElementById('log-container'),
            valVol: document.getElementById('val-vol'),
            valWpm: document.getElementById('val-wpm'),
            valPing: document.getElementById('val-ping')
        };

        // --- AUDIO SYSTEM (REAL) ---
        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                const src = audioCtx.createMediaStreamSource(stream);
                src.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                drawVisualizer();
                return true;
            } catch (e) {
                log("ERREUR MICRO: " + e.message, "err");
                return false;
            }
        }

        function drawVisualizer() {
            if (!State.active) return;
            requestAnimationFrame(drawVisualizer);
            analyser.getByteFrequencyData(dataArray);

            // Calcul Volume
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            Metrics.vol = Math.round((sum / dataArray.length) * 1.5);
            UI.valVol.innerText = Metrics.vol;

            // Dessin Canvas (Onde de style oscilloscope)
            const cvs = document.getElementById('scope');
            const ctx = cvs.getContext('2d');
            cvs.width = cvs.parentElement.clientWidth;
            cvs.height = cvs.parentElement.clientHeight;
            ctx.clearRect(0, 0, cvs.width, cvs.height);

            ctx.lineWidth = 2;
            ctx.strokeStyle = Metrics.vol > 80 ? 'var(--alert)' : 'var(--neon)';
            ctx.shadowBlur = 10;
            ctx.shadowColor = ctx.strokeStyle;

            ctx.beginPath();
            const sliceWidth = cvs.width * 1.0 / dataArray.length;
            let x = 0;
            for (let i = 0; i < dataArray.length; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * cvs.height / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                x += sliceWidth;
            }
            ctx.stroke();
            ctx.shadowBlur = 0; // Reset pour perf
        }

        // --- SPEECH RECOGNITION (REAL) ---
        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return log("Navigateur incompatible", "err");

            recognition = new SR();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'fr-FR';

            recognition.onstart = () => {
                State.listening = true;
                Metrics.startTime = Date.now();
                Metrics.words = 0;
                UI.verdict.innerText = "ACQUISITION AUDIO...";
                UI.verdict.style.color = "#888";
            };

            recognition.onend = () => {
                State.listening = false;
                if (State.active) recognition.start(); // Auto-restart critique
            };

            recognition.onresult = (e) => {
                const text = e.results[e.results.length - 1][0].transcript;
                if (!text.trim()) return;

                // Calcul Vitesse (WPM)
                const timeMin = (Date.now() - Metrics.startTime) / 60000;
                Metrics.words += text.split(' ').length;
                if (timeMin > 0.05) {
                    Metrics.wpm = Math.round(Metrics.words / timeMin);
                    UI.valWpm.innerText = Metrics.wpm;
                    Metrics.startTime = Date.now();
                    Metrics.words = 0;
                }

                log(`USER: ${text}`, "user");
                processBrain(text);
            };
        }

        // --- LE CERVEAU (LOGIQUE JS PURE) ---
        function processBrain(text) {
            const start = Date.now();
            UI.main.innerText = text.toUpperCase();
            UI.main.style.color = "#fff";

            // Algorithme de Verdict
            let verdict = "STABLE";
            let color = "var(--neon)";
            let reply = "Commande reçue.";

            const t = text.toLowerCase();

            // Analyse Biométrique
            if (Metrics.vol > 90 && Metrics.wpm > 160) {
                verdict = "VERDICT: STRESS / PANIQUE";
                color = "var(--alert)";
                reply = "Détecté niveau de stress critique. Respire.";
            } else if (Metrics.vol > 90) {
                verdict = "VERDICT: COLÈRE / HAUT VOLUME";
                color = "var(--alert)";
                reply = "Abaisse le volume vocal.";
            } else if (Metrics.wpm > 180) {
                verdict = "VERDICT: AGITATION RAPIDE";
                color = "var(--warn)";
                reply = "Tu parles trop vite, je perds des données.";
            } else {
                // Analyse Sémantique
                if (t.includes("heure")) {
                    reply = `Il est ${new Date().toLocaleTimeString('fr-FR')}.`;
                    verdict = "VERDICT: DEMANDE INFO";
                } else if (t.includes("qui es-tu")) {
                    reply = "Je suis Jarvis, interface autonome v22.0.";
                    verdict = "VERDICT: IDENTITÉ";
                } else if (t.includes("arrête") || t.includes("stop")) {
                    reply = "Arrêt de l'écoute.";
                    verdict = "VERDICT: COMMANDE ARRÊT";
                    setTimeout(() => App.toggle(), 2000);
                } else {
                    reply = `Analyse terminée pour : "${text}".`;
                    verdict = "VERDICT: OPÉRATIONNEL";
                }
            }

            // Mise à jour UI
            UI.verdict.innerText = verdict;
            UI.verdict.style.color = color;
            UI.resp.innerText = reply;
            UI.main.style.color = color;
            UI.valPing.innerText = Date.now() - start;

            log(`JARVIS: ${reply}`, "jarvis");
            speak(reply);
        }

        // --- SYNTHESE VOCALE ---
        function speak(txt) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(txt);
            u.lang = 'fr-FR';
            u.rate = 1.1;
            window.speechSynthesis.speak(u);
        }

        // --- CONTROLLER ---
        const App = {
            async toggle() {
                State.active = !State.active;
                
                if (State.active) {
                    UI.btn.classList.add('active');
                    UI.btnText.innerText = "SYSTÈME ACTIF";
                    UI.main.innerText = "INITIALISATION...";
                    UI.resp.innerText = "Calibration audio en cours...";
                    
                    const ok = await initAudio();
                    if (ok) {
                        initSpeech();
                        speak("Jarvis en ligne. Système autonome actif.");
                        log("Système initialisé avec succès.");
                    } else {
                        this.toggle(); // Stop if error
                    }
                } else {
                    UI.btn.classList.remove('active');
                    UI.btnText.innerText = "INITIALISER SYSTÈME";
                    if (recognition) recognition.stop();
                    UI.main.innerText = "VEILLE";
                    UI.main.style.color = "#666";
                    UI.resp.innerText = "Système hors ligne.";
                    log("Système arrêté.");
                }
            }
        };

        // --- UTILS ---
        function log(msg, type="sys") {
            const d = document.createElement('div');
            d.className = `log-line ${type}`;
            const time = new Date().toLocaleTimeString('fr-FR', {hour12:false});
            d.innerText = `[${time}] ${msg}`;
            UI.logs.prepend(d);
            if(UI.logs.children.length > 20) UI.logs.lastChild.remove();
        }

        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR'), 1000);
    </script>
</body>
</html>
