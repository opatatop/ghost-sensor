<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050905">
<title>SUPRA LAB v24.1</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#050905;--bg2:#020402;--panel:#081208;--fg:#00ff41;--dim:#007a20;--muted:#004d14;--red:#ff0044;--orange:#ffaa00;--blue:#00ccff;--font:'VT323',monospace;--glow:0 0 10px rgba(0,255,65,.35)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font)}
body{background-image:linear-gradient(rgba(0,255,65,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,65,.025) 1px,transparent 1px);background-size:32px 32px}
button,input,select,textarea{font-family:var(--font);touch-action:manipulation}
.scan,.vig{position:fixed;inset:0;pointer-events:none;z-index:9990}
.scan{background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px)}
.vig{background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.5) 100%)}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--panel);border:2px solid var(--fg);color:var(--fg);padding:7px 18px;font-size:14px;opacity:0;transform:translateY(-10px);transition:.3s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{border-color:var(--red);color:var(--red)}
.toast.warn{border-color:var(--orange);color:var(--orange)}
.toast.info{border-color:var(--blue);color:var(--blue)}
.btn{background:transparent;border:3px solid var(--fg);color:var(--fg);padding:10px 18px;font-size:17px;letter-spacing:1px;cursor:pointer;box-shadow:var(--glow);transition:.12s}
.btn:hover{background:rgba(0,255,65,.1)}
.btn:active{transform:scale(.96);background:var(--fg);color:var(--bg)}
.btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.blue{border-color:var(--blue);color:var(--blue)}
.btn.orange{border-color:var(--orange);color:var(--orange)}
.btn.on{background:var(--fg);color:var(--bg)}
.btn.sm{padding:6px 11px;font-size:14px;border-width:2px}
#app{position:fixed;inset:0;border:6px solid var(--fg);flex-direction:column;background:var(--bg);display:none}
#app.show{display:flex}
header{background:var(--panel);border-bottom:3px solid var(--fg);padding:11px 14px;text-align:center;font-size:17px;letter-spacing:2px;position:relative;overflow:hidden;flex-shrink:0}
header::after{content:'v24.1  •  TTS FIX  •  ANTI-COUPURE  •  VISION  •  STOP = RÉÉCOUTE ';position:absolute;top:1px;left:0;font-size:11px;color:var(--muted);white-space:nowrap;animation:marquee 24s linear infinite}
@keyframes marquee{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
main{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;align-content:start;padding-bottom:120px}
footer{position:absolute;bottom:0;left:0;right:0;background:var(--panel);border-top:3px solid var(--fg);padding:6px 12px;font-size:13px;display:flex;justify-content:space-between;flex-shrink:0}
.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;background:var(--panel);border:3px solid var(--fg)}
.bar .round{width:56px;height:56px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;padding:0;position:relative}
.bar .round.rec-on{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.1s ease-out infinite}
.bar .round .cnt{position:absolute;top:-5px;right:-5px;background:var(--orange);color:var(--bg);font-size:10px;width:18px;height:18px;border-radius:50%;display:none;align-items:center;justify-content:center}
.bar .round .cnt.show{display:flex}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,0,68,.5)}100%{box-shadow:0 0 0 14px rgba(255,0,68,0)}}
.timer{font-size:18px;min-width:80px;text-align:center}
.timer.on{color:var(--red);animation:blink 1s step-end infinite}
.sep{width:2px;height:28px;background:var(--muted)}
.live{grid-column:1/-1;background:var(--bg2);border:3px solid var(--fg);position:relative;min-height:80px}
.live .label{position:absolute;top:-10px;left:10px;background:var(--bg2);padding:0 7px;font-size:12px}
.live .badge{position:absolute;top:8px;right:10px;font-size:12px;padding:2px 7px;border:1px solid var(--muted);color:var(--muted)}
.live .badge.listen{color:var(--blue);border-color:var(--blue);animation:blink 1.2s step-end infinite}
.live .badge.rec{color:var(--red);border-color:var(--red);animation:blink .5s step-end infinite}
.live .badge.think{color:var(--orange);border-color:var(--orange)}
.live .badge.ok{color:var(--fg);border-color:var(--fg)}
.live .badge.speak{color:var(--orange);border-color:var(--orange);animation:blink .8s step-end infinite}
.live .txt{padding:24px 12px 10px;font-size:18px;line-height:1.35;min-height:60px;word-break:break-word}
.live .txt.dim{color:var(--muted);font-size:14px}
.live .txt.red{color:var(--red)}
.live .txt.orange{color:var(--orange);font-size:15px}
.input-row{grid-column:1/-1;display:flex;background:var(--bg2);border:2px solid var(--dim)}
.input-row .pre{display:flex;align-items:center;padding:0 10px;color:var(--dim);font-size:18px;border-right:2px solid var(--dim)}
.input-row input{flex:1;background:transparent;border:none;color:var(--fg);padding:11px;font-size:16px;outline:none}
.input-row input::placeholder{color:var(--muted)}
.input-row button{border:none;border-left:2px solid var(--dim);background:rgba(0,255,65,.06);color:var(--fg);padding:0 14px;font-size:15px;cursor:pointer}
.panel{background:var(--panel);border:3px solid var(--fg);padding:12px;position:relative;min-height:100px}
.panel .label{position:absolute;top:-10px;left:10px;background:var(--panel);padding:0 7px;font-size:12px}
.panel.full{grid-column:1/-1}
canvas{display:block;width:100%;height:90px;background:var(--bg2);image-rendering:pixelated}
.out{background:var(--bg2);border:2px dashed var(--dim);padding:12px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow-y:auto;min-height:70px;color:var(--dim)}
.log{max-height:120px;overflow-y:auto;font-size:12px;background:var(--bg2);border:2px dashed var(--orange);padding:6px}
.log div{padding:2px 3px;border-left:3px solid transparent;margin:1px 0}
.log .ok{color:var(--dim);border-color:var(--muted)}
.log .err{color:var(--red);border-color:var(--red)}
.log .info{color:var(--orange);border-color:var(--orange)}
.sys{font-size:13px;line-height:1.55}
.stats{font-size:12px;color:var(--muted);margin-top:4px}
#ptt{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);width:115px;height:115px;border-radius:50%;font-size:13px;text-align:center;line-height:1.2;z-index:200;border-width:5px;display:none;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(0,255,65,.4)}
#ptt.show{display:flex}
#ptt:active{transform:translateX(-50%) scale(.93)}
#ptt.rec{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1s ease-out infinite}
dialog{border:5px solid var(--fg);background:var(--bg);color:var(--fg);padding:0;max-width:520px;width:94vw;max-height:88vh;overflow-y:auto;box-shadow:0 0 30px rgba(0,255,65,.25)}
dialog::backdrop{background:rgba(0,0,0,.85)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:3px solid var(--fg);font-size:18px}
.db{padding:14px 16px}
.df{display:flex;gap:10px;justify-content:center;padding:12px;border-top:2px solid var(--muted);flex-wrap:wrap}
.fl{margin-bottom:12px}
.fl label{display:block;margin-bottom:4px;font-size:13px}
.fl input,.fl select,.fl textarea{width:100%;padding:9px;background:var(--bg2);color:var(--fg);border:2px solid var(--dim);font-size:15px;outline:none}
.fl textarea{min-height:70px;resize:vertical}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--fg)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.check input{width:16px;height:16px;accent-color:var(--fg)}
.sec{font-size:14px;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--muted)}
.range{display:flex;align-items:center;gap:8px}
.range input{flex:1;accent-color:var(--fg)}
.range span{min-width:36px;text-align:right;color:var(--orange)}
.cam-box{grid-column:1/-1;display:none;flex-direction:column;align-items:center;gap:8px;padding:8px;background:var(--bg2);border:3px solid var(--blue)}
.cam-box.show{display:flex}
video,.preview{max-width:100%;max-height:150px;border:2px solid var(--dim);background:#000;display:none}
.blink::after{content:'█';animation:blink .6s step-end infinite}
@keyframes blink{50%{opacity:0}}
@media(max-width:600px){.bar .round{width:48px;height:48px;font-size:11px}#ptt{width:100px;height:100px;font-size:12px;bottom:54px}main{padding-bottom:130px}}
</style>
</head>
<body>
<div class="scan"></div>
<div class="vig"></div>
<div id="toasts"></div>

<dialog id="dlg">
  <div class="dh"><span>PARAMÈTRES</span><button class="btn sm" id="x" type="button" style="border:none;box-shadow:none;font-size:22px">&times;</button></div>
  <div class="db">
    <div class="sec">Clé API Groq</div>
    <div class="fl"><label>Clé (gsk_...)</label><textarea id="key" placeholder="Colle ta clé Groq ici — gratuite sur groq.com" spellcheck="false"></textarea></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn blue" id="paste" type="button" style="flex:1.4">COLLER</button>
      <button class="btn blue" id="test" type="button" style="flex:1">TESTER</button>
    </div>
    <div class="fl"><label>Modèle</label>
      <select id="model">
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
        <option value="llama-3.1-8b-instant">Llama 3.1 8B Instant</option>
        <option value="meta-llama/llama-4-scout-17b-16e-instruct">Llama 4 Scout (vision)</option>
      </select>
    </div>
    <div class="fl"><label>Personnalité</label>
      <select id="persona">
        <option value="pro">Pro (recommandé)</option>
        <option value="default">Classique</option>
        <option value="chill">Détendu</option>
        <option value="strict">Direct & court</option>
      </select>
    </div>
    <div class="sec">Écoute</div>
    <div class="fl"><label>Sensibilité <span id="vsens">12</span></label><div class="range"><input type="range" id="sens" min="5" max="30" value="12"></div></div>
    <div class="fl"><label>Silence fin (ms) <span id="vsil">600</span></label><div class="range"><input type="range" id="sil" min="300" max="1200" step="25" value="600"></div></div>
    <div class="fl"><label class="check"><input type="checkbox" id="always" checked> Toujours répondre</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="tts" checked> Voix TTS</label></div>
    <div class="fl"><label>Langue</label>
      <select id="lang"><option value="fr">Français</option><option value="en">English</option><option value="es">Español</option></select>
    </div>
    <div class="fl"><label>Couleur</label>
      <select id="col"><option value="#00ff41">Vert</option><option value="#00ccff">Cyan</option><option value="#ff6600">Orange</option><option value="#ff00aa">Rose</option></select>
    </div>
  </div>
  <div class="df">
    <button class="btn" id="save" type="button">SAUVEGARDER</button>
    <button class="btn red" id="rst" type="button">RESET</button>
  </div>
</dialog>

<div id="app">
  <header>SUPRA LAB v24.1 — <span id="mode">PRÊT</span></header>
  <main>
    <div class="bar">
      <button class="btn round" id="rec" type="button">REC<span class="cnt" id="reccnt">0</span></button>
      <div class="timer" id="timer">00:00</div>
      <button class="btn round" id="stop" type="button" disabled>STOP</button>
      <button class="btn round" id="play" type="button">PLAY</button>
      <div class="sep"></div>
      <button class="btn round blue" id="auto" type="button">AUTO</button>
      <button class="btn round" id="comp" type="button">24/7</button>
      <div class="sep"></div>
      <button class="btn round orange" id="cfg" type="button">CFG</button>
      <button class="btn round" id="img" type="button">IMG</button>
      <button class="btn round" id="cam" type="button">CAM</button>
      <div class="sep"></div>
      <button class="btn round" id="sum" type="button">RÉSUMÉ</button>
      <button class="btn round red" id="clr" type="button">CLR</button>
      <button class="btn round red" id="mute" type="button">STOP</button>
    </div>

    <input type="file" id="file" accept="image/*" hidden>
    <img id="preview" class="preview" alt="">

    <div class="cam-box" id="cambox">
      <video id="video" autoplay playsinline muted></video>
      <div style="display:flex;gap:8px">
        <button class="btn sm blue" id="capture" type="button">CAPTURER</button>
        <button class="btn sm red" id="camstop" type="button">FERMER</button>
      </div>
    </div>

    <div class="panel"><div class="label">SPECTRO</div><canvas id="c1"></canvas></div>
    <div class="panel"><div class="label">OSCILLO</div><canvas id="c2"></canvas></div>
    <div class="panel"><div class="label">VOLUME</div><canvas id="c3"></canvas></div>

    <div class="live">
      <div class="label">ÉCOUTE</div>
      <div class="badge" id="badge">PRET</div>
      <div class="txt dim" id="live">Dis « stop » pour couper et réécouter</div>
    </div>

    <div class="input-row">
      <div class="pre">&gt;</div>
      <input id="txt" placeholder="Écris ou parle..." autocomplete="off">
      <button type="button" id="send">ENVOYER</button>
    </div>

    <div class="panel full"><div class="label">RÉPONSE</div><div class="out" id="out">En attente...</div></div>
    <div class="panel full"><div class="label">JOURNAL</div><div class="log" id="log"></div></div>
    <div class="panel"><div class="label">SYSTÈME</div><div class="sys" id="sys">—</div><div class="stats" id="stats">—</div></div>
  </main>
  <footer><span id="status">Démarrage...</span><span>v24.1 | <span id="clock">--:--:--</span></span></footer>
</div>

<button class="btn" id="ptt" type="button">MAINTENIR<br>POUR PARLER</button>
<audio id="audio" hidden></audio>

<script>
(() => {
  /* =============================================
     CONFIGURATION PAR DÉFAUT
     ============================================= */
  var DEFAULT = {
    key: '',
    model: 'llama-3.3-70b-versatile',
    lang: 'fr',
    tts: true,
    color: '#00ff41',
    sens: 12,
    silence: 600,
    always: true,
    persona: 'pro'
  };

  var PERSONA = {
    default: 'Tu es SUPRA, compagnon intelligent.\nRÈGLES STRICTES :\n- Réponds UNIQUEMENT en texte brut.\n- N\'utilise JAMAIS de markdown, d\'astérisques, de **, de *, de listes à puces, de titres #.\n- Pas de formatage. Texte simple et clair.\n- Tutoiement. Français.\n- Si on dit stop/arrête/tais-toi, tu t\'arrêtes.',
    pro: 'Tu es SUPRA en mode Pro.\nRÈGLES STRICTES :\n- Réponds UNIQUEMENT en texte brut, sans aucun formatage.\n- INTERDICTION totale : *, **, ***, markdown, listes, puces, #, liens formatés.\n- Phrases claires et utiles. Tutoiement.\n- Ne invente pas de mots bizarres.\n- Si on dit stop, arrête ou tais-toi, tu t\'arrêtes immédiatement.',
    chill: 'Tu es SUPRA détendu.\nTexte brut uniquement. Jamais d\'astérisques ni de markdown. Tutoiement. Si stop, tu te tais.',
    strict: 'Tu es SUPRA direct.\nRéponses très courtes. Texte brut uniquement. Aucun * ni markdown. Si stop, stop immédiat.'
  };

  var STOP_WORDS = ['stop', 'arrête', 'arrete', 'tais-toi', 'taistoi', 'silence', 'shut up', 'enough', 'basta'];

  /* =============================================
     ÉTAT GLOBAL
     ============================================= */
  var cfg = {};
  Object.assign(cfg, DEFAULT);

  var st = {
    ready: false,
    ctx: null,
    an: null,
    vol: null,
    stream: null,
    fdata: null,
    wdata: null,
    vdata: null,
    rec: false,
    mr: null,
    chunks: [],
    t0: 0,
    iv: null,
    ptt: false,
    pmr: null,
    pchunks: [],
    piv: null,
    psec: 0,
    auto: false,
    run: false,
    comp: false,
    abortFlag: false,
    hist: [],
    mem: '',
    img: null,
    imgBase64: null,
    cam: null,
    camOn: false,
    ctrl: null,
    reqs: 0,
    lat: 0,
    tokens: 0
  };

  var caps = [];
  var voices = [];
  var ttsKeepAlive = null;

  /* =============================================
     ROLLING BUFFER ANTI-COUPURE
     6 échantillons × 50ms = 300ms de fenêtre
     ============================================= */
  var VB_SIZE = 6;
  var VB_MS = 50;
  var vbIv = null;
  var vb = [];

  function startVB() {
    if (vbIv !== null) return;
    vb = [];
    vbIv = setInterval(function() {
      vb.push(rawVol());
      if (vb.length > VB_SIZE) vb.shift();
    }, VB_MS);
  }

  function stopVB() {
    if (vbIv !== null) {
      clearInterval(vbIv);
      vbIv = null;
    }
    vb = [];
  }

  function smoothVol() {
    if (!vb.length) return 0;
    var s = 0;
    for (var i = 0; i < vb.length; i++) s += vb[i];
    return s / vb.length;
  }

  /* =============================================
     UTILITAIRES
     ============================================= */
  var $ = function(s) { return document.querySelector(s); };
  var now = function() { return new Date().toLocaleTimeString('fr-FR'); };
  var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
  var fmt = function(s) { return pad(Math.floor(s / 60)) + ':' + pad(s % 60); };
  var clean = function(k) { return String(k || '').replace(/[\u200B-\u200D\uFEFF\u00A0\s]/g, '').trim(); };
  var valid = function(k) { return k && k.startsWith('gsk_') && k.length > 30; };
  var sleep = function(ms) { return new Promise(function(r) { setTimeout(r, ms); }); };
  var isVisionModel = function() {
    return cfg.model.indexOf('scout') !== -1 || cfg.model.indexOf('vision') !== -1 || cfg.model.indexOf('llama-4') !== -1;
  };

  function isStop(text) {
    var t = (text || '').toLowerCase().trim();
    for (var i = 0; i < STOP_WORDS.length; i++) {
      var w = STOP_WORDS[i];
      if (t === w || t.startsWith(w + ' ') || t.endsWith(' ' + w) || t.indexOf(' ' + w + ' ') !== -1) return true;
    }
    return false;
  }

  /* Toast non-bloquant */
  function toast(msg, type, dur) {
    type = type || 'info';
    dur = dur || 2500;
    var el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    $('#toasts').appendChild(el);
    requestAnimationFrame(function() {
      el.classList.add('show');
    });
    setTimeout(function() {
      el.classList.remove('show');
      setTimeout(function() { el.remove(); }, 300);
    }, dur);
  }

  /* Log dans le journal */
  function log(m, t) {
    t = t || 'ok';
    var el = $('#log');
    if (!el) return;
    var d = document.createElement('div');
    d.className = t;
    d.textContent = '[' + now() + '] ' + m;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
    while (el.children.length > 80) el.firstChild.remove();
  }

  function status(t) {
    var el = $('#status');
    if (el) el.textContent = t;
  }

  function sys() {
    var ok = function(v) { return '<span style="color:var(--fg)">' + v + '</span>'; };
    var ko = function(v) { return '<span style="color:var(--red)">' + v + '</span>'; };
    var wa = function(v) { return '<span style="color:var(--orange)">' + v + '</span>'; };
    var el = $('#sys');
    if (el) {
      el.innerHTML =
        'Micro ' + (st.stream ? ok('OK') : ko('OFF')) +
        ' · API ' + (valid(cfg.key) ? ok('OK') : ko('—')) +
        (st.imgBase64 ? ' · Img ' + wa('OUI') : '') +
        '<br>Mode ' + (st.comp ? wa('24/7') : st.auto ? wa('AUTO') : ok('PTT')) +
        ' · ' + cfg.persona +
        '<br>Mémoire ' + st.hist.length + ' msgs' + (st.mem ? ' +résumé' : '');
    }
    var el2 = $('#stats');
    if (el2) {
      el2.textContent = '\u2248' + st.tokens + ' tokens · ' + (st.lat || '—') + 'ms · ' + st.reqs + ' req';
    }
  }

  function updateRecBadge() {
    var el = $('#reccnt');
    if (!el) return;
    if (caps.length > 0) {
      el.textContent = caps.length;
      el.classList.add('show');
    } else {
      el.classList.remove('show');
    }
  }

  function live(txt, mode) {
    var t = $('#live');
    var b = $('#badge');
    if (!t || !b) return;
    t.className = 'txt';
    b.className = 'badge';
    if (mode === 'idle') {
      t.classList.add('dim');
      t.textContent = txt;
      b.textContent = 'PRET';
    } else if (mode === 'listen') {
      t.classList.add('dim');
      t.textContent = txt;
      b.textContent = 'ECOUTE';
      b.classList.add('listen');
    } else if (mode === 'rec') {
      t.classList.add('red');

    } else if (mode === 'think') {
      t.classList.add('orange');

      b.classList.add('think');
    } else if (mode === 'ok') {
      t.textContent = txt;
      b.textContent = 'OK';
      b.classList.add('ok');
    } else if (mode === 'speak') {
      t.textContent = txt;
      b.textContent = 'VOIX';
      b.classList.add('speak');
    }
  }

  /* =============================================
     AUDIO — INITIALISATION MICRO
     ============================================= */
  async function initAudio() {
    try {
      st.ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
      await st.ctx.resume();
      st.stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      var src = st.ctx.createMediaStreamSource(st.stream);

      /* Analyseur pour spectro/oscillo */
      st.an = st.ctx.createAnalyser();
      st.an.fftSize = 2048;
      st.an.smoothingTimeConstant = 0.75;
      src.connect(st.an);
      st.fdata = new Uint8Array(st.an.frequencyBinCount);
      st.wdata = new Uint8Array(st.an.frequencyBinCount);

      /* Analyseur séparé pour le volume */
      st.vol = st.ctx.createAnalyser();
      st.vol.fftSize = 256;
      src.connect(st.vol);
      st.vdata = new Uint8Array(st.vol.frequencyBinCount);

      st.ready = true;
      size();
      drawLoop();
      sys();
      log('Audio OK');
      return true;
    } catch (e) {
      log('Micro: ' + e.message, 'err');
      toast('Micro inaccessible', 'err', 3000);
      return false;
    }
  }

  /* Volume brut 0-255 */
  function rawVol() {
    if (!st.vol) return 0;
    st.vol.getByteFrequencyData(st.vdata);
    var s = 0;
    for (var i = 0; i < st.vdata.length; i++) s += st.vdata[i];
    return s / st.vdata.length;
  }

  /* =============================================
     CANVAS — VISUALISATIONS
     ============================================= */
  function drawLoop() {
    if (!st.ready) return;
    requestAnimationFrame(drawLoop);
    st.an.getByteFrequencyData(st.fdata);
    st.an.getByteTimeDomainData(st.wdata);
    st.vol.getByteFrequencyData(st.vdata);
    draw1();
    draw2();
    draw3();
  }

  function draw1() {
    var c = $('#c1');
    if (!c) return;
    var x = c.getContext('2d');
    var w = c.width;
    var h = c.height;
    x.fillStyle = '#020402';
    x.fillRect(0, 0, w, h);
    var n = st.fdata.length;
    var bw = Math.max(1, w / n);
    for (var i = 0; i < n; i++) {
      var v = st.fdata[i];
      if (v < 3) continue;
      var bh = Math.log10(v + 1) * 18;
      x.fillStyle = 'hsl(' + Math.max(0, 110 - v * 0.4) + ',100%,' + Math.max(15, v * 0.3) + '%)';
      x.fillRect(i * bw, h - bh, bw + 0.3, bh);
    }
  }

  function draw2() {
    var c = $('#c2');
    if (!c) return;
    var x = c.getContext('2d');
    var w = c.width;
    var h = c.height;
    x.fillStyle = '#020402';
    x.fillRect(0, 0, w, h);
    var col = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
    x.strokeStyle = col;
    x.lineWidth = 1.5;
    x.beginPath();
    var step = w / st.wdata.length;
    for (var i = 0; i < st.wdata.length; i++) {
      var y = (st.wdata[i] / 128 - 0.5) * h * 0.75 + h / 2;
      if (i) x.lineTo(i * step, y);
      else x.moveTo(0, y);
    }
    x.stroke();
  }

  function draw3() {
    var c = $('#c3');
    if (!c) return;
    var x = c.getContext('2d');
    var w = c.width;
    var h = c.height;
    x.fillStyle = '#020402';
    x.fillRect(0, 0, w, h);
    var s = 0;
    for (var i = 0; i < st.vdata.length; i++) s += st.vdata[i];
    var p = s / st.vdata.length / 255;
    var bw = w * 0.38;
    var bh = Math.max(2, p * h * 0.8);
    x.fillStyle = 'hsl(' + Math.max(0, 120 - p * 160) + ',100%,40%)';
    x.fillRect((w - bw) / 2, h - bh, bw, bh);
    x.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
    x.font = '16px VT323';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText(Math.round(p * 100) + '%', w / 2, h / 2);
  }

  function size() {
    document.querySelectorAll('canvas').forEach(function(c) {
      var r = c.parentElement.getBoundingClientRect();
      c.width = Math.max(60, r.width - 24);
      c.height = 90;
    });
  }

  /* Trouver le meilleur format audio supporté */
  function mime() {
    var formats = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
    for (var i = 0; i < formats.length; i++) {
      if (MediaRecorder.isTypeSupported(formats[i])) return formats[i];
    }
    return '';
  }

  /* =============================================
     DÉTECTION VOCALE — ANTI-COUPURE
     ============================================= */

  /* Attend que le volume lissé dépasse le seuil
     pendant 5 ticks consécutifs (250ms) */
  function waitSpeak() {
    return new Promise(function(resolve) {
      var aboveCount = 0;
      var THRESH = 5;

      function check() {
        if (!st.auto || st.abortFlag) return resolve(false);
        var sv = smoothVol();
        if (sv >= cfg.sens) {
          aboveCount++;
          if (aboveCount >= THRESH) return resolve(true);
        } else {
          /* Décroissance graduelle : un creux ne reset pas tout */
          aboveCount = Math.max(0, aboveCount - 2);
        }
        setTimeout(check, VB_MS);
      }
      setTimeout(check, VB_MS);
    });
  }

  /* Enregistre jusqu'à détection de silence stable
     avec buffer de queue de 200ms pour attraper la
     fin des mots */
  function recUntilSilent() {
    return new Promise(function(resolve) {
      var chunks = [];
      var rec;
      try {
        rec = new MediaRecorder(st.stream, { mimeType: mime() });
      } catch (e) {
        log('MediaRecorder: ' + e.message, 'err');
        return resolve(null);
      }

      var MIN_REC = 600;
      var MAX_REC = 30000;
      var TAIL_MS = 200;
      var t0 = Date.now();
      var hasSpoken = false;
      var silentMs = 0;
      var tailScheduled = false;

      rec.ondataavailable = function(e) {
        if (e.data && e.data.size) chunks.push(e.data);
      };

      rec.onstop = function() {
        var blob = new Blob(chunks, { type: rec.mimeType });
        resolve(blob.size >= 500 ? blob : null);
      };

      rec.onerror = function() {
        resolve(null);
      };

      var iv = setInterval(function() {
        if (!st.auto || st.abortFlag) {
          clearInterval(iv);
          if (rec.state === 'recording') rec.stop();
          return;
        }

        var sv = smoothVol();
        var elapsed = Date.now() - t0;

        if (sv >= cfg.sens * 0.4) {
          silentMs = 0;
          tailScheduled = false;
          if (sv >= cfg.sens) hasSpoken = true;
        } else if (hasSpoken) {
          silentMs += VB_MS;
        }

        /* Arrêt : parole détectée + durée min + silence suffisant */
        if (hasSpoken && elapsed >= MIN_REC && silentMs >= cfg.silence && !tailScheduled) {
          tailScheduled = true;
          setTimeout(function() {
            clearInterval(iv);
            if (rec.state === 'recording') rec.stop();
          }, TAIL_MS);
          return;
        }

        /* Sécurité durée max */
        if (elapsed >= MAX_REC) {
          clearInterval(iv);
          if (rec.state === 'recording') rec.stop();
        }
      }, VB_MS);

      rec.start(40);
    });
  }

  /* =============================================
     ENREGISTREMENT MANUEL
     ============================================= */
  function startRec() {
    if (st.rec || !st.stream) return;
    var m = mime();
    if (!m) { log('Format non supporté', 'err'); return; }
    st.rec = true;
    st.chunks = [];
    st.t0 = Date.now();
    try {
      st.mr = new MediaRecorder(st.stream, { mimeType: m });
    } catch (e) { st.rec = false; return; }

    st.mr.ondataavailable = function(e) {
      if (e.data && e.data.size) st.chunks.push(e.data);
    };

    st.mr.onstop = function() {
      var blob = new Blob(st.chunks, { type: st.mr.mimeType });
      /* Libérer l'ancien blob URL */
      if (caps.length > 0 && caps[0].url) URL.revokeObjectURL(caps[0].url);
      caps.unshift({
        url: URL.createObjectURL(blob),
        blob: blob,
        dur: Math.floor((Date.now() - st.t0) / 1000)
      });
      /* Limiter à 10 */
      while (caps.length > 10) URL.revokeObjectURL(caps.pop().url);
      updateRecBadge();
      status('Prêt');
    };

    st.mr.start(200);
    var el;
    el = $('#rec'); if (el) el.classList.add('rec-on');
    el = $('#stop'); if (el) el.disabled = false;
    el = $('#timer'); if (el) el.classList.add('on');
    status('REC...');
    var s = 0;
    el = $('#timer'); if (el) el.textContent = '00:00';
    st.iv = setInterval(function() {
      s++;
      var el2 = $('#timer');
      if (el2) el2.textContent = fmt(s);
    }, 1000);
  }

  function stopRec() {
    if (!st.rec) return;
    st.rec = false;
    if (st.mr && st.mr.state === 'recording') st.mr.stop();
    var el;
    el = $('#rec'); if (el) el.classList.remove('rec-on');
    el = $('#stop'); if (el) el.disabled = true;
    el = $('#timer'); if (el) el.classList.remove('on');
    clearInterval(st.iv);
    el = $('#timer'); if (el) el.textContent = '00:00';
  }

  /* =============================================
     PTT — PUSH TO TALK
     ============================================= */
  function pttDown(e) {
    e.preventDefault();
    if (!st.ready || st.auto || st.ptt) return;
    st.ptt = true;
    st.pchunks = [];
    st.psec = 0;
    try {
      st.pmr = new MediaRecorder(st.stream, { mimeType: mime() });
    } catch (e) { st.ptt = false; return; }

    st.pmr.ondataavailable = function(e) {
      if (e.data && e.data.size) st.pchunks.push(e.data);
    };
    st.pmr.onstop = pttDone;
    st.pmr.start(150);

    var el = $('#ptt');
    if (el) { el.classList.add('rec'); el.innerHTML = 'REC...<br><small>relâche</small>'; }
    live('Enregistrement 00:00', 'rec');
    st.piv = setInterval(function() {
      st.psec++;
      live('Enregistrement ' + fmt(st.psec), 'rec');
    }, 1000);
  }

  function pttUp(e) {
    e.preventDefault();
    if (!st.ptt) return;
    st.ptt = false;
    clearInterval(st.piv);
    var el = $('#ptt');
    if (el) { el.classList.remove('rec'); el.innerHTML = 'MAINTENIR<br>POUR PARLER'; }
    /* Buffer de queue 200ms pour attraper la fin du mot */
    setTimeout(function() {
      if (st.pmr && st.pmr.state === 'recording') st.pmr.stop();
    }, 200);
  }

  async function pttDone() {
    var blob = new Blob(st.pchunks, { type: (st.pmr && st.pmr.mimeType) || mime() });
    if (blob.size < 500) { live('Trop court', 'idle'); return; }
    live('Transcription...', 'think');
    var text = await whisper(blob);
    if (!text) { live('Rien compris', 'idle'); return; }
    if (isStop(text)) { stopAll(); live('Stop — en écoute', 'listen'); return; }
    live(text, 'ok');
    await chat(text);
  }

  /* =============================================
     MODE AUTO / 24-7
     ============================================= */
  async function autoStart(comp) {
    if (st.run) return;
    if (!valid(cfg.key)) {
      toast('Clé API requise — bouton CFG', 'err', 3500);
      return;
    }
    st.auto = true;
    st.run = true;
    st.comp = !!comp;
    st.abortFlag = false;

    var el;
    el = $('#auto'); if (el) el.classList.toggle('on', !comp);
    el = $('#comp'); if (el) el.classList.toggle('on', !!comp);
    el = $('#mode'); if (el) el.textContent = comp ? '24/7' : 'AUTO';

    live(comp ? 'Compagnon actif' : 'Écoute en cours...', 'listen');
    status(comp ? '24/7' : 'AUTO');
    sys();
    log(comp ? 'Mode 24/7' : 'Mode AUTO', 'info');
    startVB();

    while (st.auto) {
      st.abortFlag = false;
      try {
        /* Ne pas traiter si l'onglet est caché */
        if (document.hidden) { await sleep(300); continue; }

        /* 1. Attendre que quelqu'un parle */
        if (!await waitSpeak()) continue;
        if (!st.auto || st.abortFlag) break;

        /* 2. Enregistrer jusqu'au silence */
        live('Je t\'écoute...', 'rec');
        var blob = await recUntilSilent();
        if (!st.auto || st.abortFlag) break;

        if (!blob || blob.size < 500) {
          live(st.comp ? 'Compagnon en écoute...' : 'Écoute...', 'listen');
          continue;
        }

        /* 3. Transcrire */
        live('Transcription...', 'think');
        var text = await whisper(blob);
        if (!st.auto || st.abortFlag) break;
        if (!text) {
          live(st.comp ? 'Compagnon en écoute...' : 'Écoute...', 'listen');
          continue;
        }

        /* 4. Vérifier mot d'arrêt */
        if (isStop(text)) {
          stopAll();
          live('Stop reçu — je réécoute', 'listen');
          log('Stop vocal', 'info');
          await sleep(400);
          continue;
        }

        /* 5. Envoyer au LLM */
        live(text, 'ok');
        await chat(text, true);
        if (!st.auto || st.abortFlag) break;

        /* 6. Retour à l'écoute */
        live(st.comp ? 'Compagnon en écoute...' : 'Écoute...', 'listen');
        await sleep(150);
      } catch (e) {
        log('Auto: ' + e.message, 'err');
        await sleep(400);
      }
    }

    /* Nettoyage sortie de boucle */
    stopVB();
    st.run = false;
    st.comp = false;
    st.abortFlag = false;
    el = $('#auto'); if (el) el.classList.remove('on');
    el = $('#comp'); if (el) el.classList.remove('on');
    el = $('#mode'); if (el) el.textContent = 'PRÊT';
    live('Arrêté', 'idle');
    status('Prêt');
    sys();
  }

  function autoStop() {
    st.auto = false;
    st.abortFlag = true;
    st.comp = false;
    stopVB();
    var el;
    el = $('#auto'); if (el) el.classList.remove('on');
    el = $('#comp'); if (el) el.classList.remove('on');
    el = $('#mode'); if (el) el.textContent = 'PRÊT';
    live('Arrêté', 'idle');
    status('Prêt');
    sys();
  }

  /* =============================================
     WHISPER — TRANSCRIPTION AVEC RETRY
     ============================================= */
  async function whisper(blob, retry) {
    retry = retry || 1;
    if (!valid(cfg.key)) {
      log('Clé manquante', 'err');
      toast('Clé API manquante', 'err');
      return null;
    }

    var ext = 'webm';
    if (blob.type.indexOf('ogg') !== -1) ext = 'ogg';
    else if (blob.type.indexOf('mp4') !== -1) ext = 'm4a';

    for (var attempt = 0; attempt <= retry; attempt++) {
      var t0 = performance.now();
      try {
        var fd = new FormData();
        fd.append('file', blob, 'audio.' + ext);
        fd.append('model', 'whisper-large-v3-turbo');
        fd.append('language', cfg.lang);
        fd.append('response_format', 'json');

        var r = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + cfg.key },
          body: fd
        });

        if (!r.ok) {
          var errText = (await r.text()).slice(0, 100);
          if (r.status === 429 && attempt < retry) {
            log('Rate limit, retry ' + (attempt + 1) + '...', 'info');
            await sleep(1000 * (attempt + 1));
            continue;
          }
          throw new Error(errText);
        }

        var d = await r.json();
        st.lat = Math.round(performance.now() - t0);
        st.reqs++;
        sys();
        var text = (d.text || '').trim();
        if (text) log('\u2192 ' + text);
        return text || null;
      } catch (e) {
        if (attempt < retry) {
          log('Whisper retry ' + (attempt + 1) + '...', 'info');
          await sleep(800);
          continue;
        }
        log('Whisper: ' + e.message, 'err');
        return null;
      }
    }
    return null;
  }

  /* =============================================
     CHAT / STREAM AVEC VISION
     ============================================= */
  async function chat(text, fromAuto) {
    if (!valid(cfg.key)) {
      var outEl = $('#out');
      if (outEl) outEl.textContent = 'Clé API manquante — bouton CFG';
      toast('Clé API manquante', 'err', 3000);
      return;
    }

    /* En mode AUTO sans "toujours répondre", ignorer si pas appelé */
    if (fromAuto && !cfg.always && !st.comp) {
      var low = text.toLowerCase();
      var wakeWords = ['supra', 'lab', 'assistant', 'hey', 'hel'];
      var isForMe = false;
      for (var i = 0; i < wakeWords.length; i++) {
        if (low.indexOf(wakeWords[i]) !== -1) { isForMe = true; break; }
      }
      if (!isForMe) { live('Pas pour moi', 'listen'); return; }
    }

    /* Annuler un stream précédent */
    if (st.ctrl) {
      try { st.ctrl.abort(); } catch (e) { /* ignoré */ }
    }
    st.ctrl = new AbortController();

    live('Réflexion...', 'think');
    var outEl = $('#out');
    if (outEl) outEl.textContent = '';
    status('Stream...');

    /* Construire le prompt système */
    var systemPrompt = (PERSONA[cfg.persona] || PERSONA.pro)
      + (st.comp ? '\nMode compagnon permanent.' : '')
      + (st.mem ? '\n\nMémoire:\n' + st.mem : '');

    /* Construire le message utilisateur avec vision si nécessaire */
    var userMsg;
    if (st.imgBase64 && isVisionModel()) {
      userMsg = {
        role: 'user',
        content: [
          { type: 'text', text: text || 'Décris ce que tu vois.' },
          { type: 'image_url', image_url: { url: st.imgBase64 } }
        ]
      };
    } else if (st.imgBase64 && !isVisionModel()) {
      toast('Change de modèle pour la vision (Llama 4 Scout)', 'warn', 3500);
      userMsg = { role: 'user', content: text };
    } else {
      userMsg = { role: 'user', content: text };
    }

    st.hist.push(userMsg);
    if (st.hist.length > 18) await summarize();

    var messages = [{ role: 'system', content: systemPrompt }].concat(st.hist);
    var t0 = performance.now();

    try {
      var r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + cfg.key
        },
        body: JSON.stringify({
          model: cfg.model,
          messages: messages,
          temperature: 0.35,
          max_tokens: 1800,
          stream: true
        }),
        signal: st.ctrl.signal
      });

      if (!r.ok) {
        var errBody = (await r.text()).slice(0, 120);
        throw new Error(r.status + ' — ' + errBody);
      }

      var reader = r.body.getReader();
      var dec = new TextDecoder();
      var full = '';
      var buf = '';

      while (true) {
        var result = await reader.read();
        if (result.done) break;
        buf += dec.decode(result.value, { stream: true });
        var lines = buf.split('\n');
        buf = lines.pop() || '';

        for (var li = 0; li < lines.length; li++) {
          var line = lines[li];
          if (line.indexOf('data: ') !== 0) continue;
          var raw = line.slice(6);
          if (raw === '[DONE]') continue;
          try {
            var j = JSON.parse(raw);
            var delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
            if (delta) {
              full += delta;
              /* Nettoyage en temps réel des astérisques */
              if (outEl) {
                outEl.textContent = full.replace(/\*{1,3}/g, '');
                outEl.scrollTop = outEl.scrollHeight;
              }
            }
          } catch (parseErr) { /* ignoré */ }
        }
      }

      /* Nettoyage final complet */
      full = full.replace(/\*{1,3}/g, '').replace(/#{1,6}\s?/g, '').trim();
      if (!full) full = '...';

      st.hist.push({ role: 'assistant', content: full });
      st.tokens += Math.ceil((text.length + full.length) / 3.8);
      st.lat = Math.round(performance.now() - t0);
      st.reqs++;
      sys();

      if (outEl) {
        outEl.textContent = full + '\n\n' + now();
        outEl.scrollTop = outEl.scrollHeight;
      }
      log('OK ' + st.lat + 'ms');
      status(st.auto ? (st.comp ? '24/7' : 'AUTO') : 'Prêt');

      /* Effacer l'image après utilisation */
      st.imgBase64 = null;
      st.img = null;
      var prevEl = $('#preview');
      if (prevEl) prevEl.style.display = 'none';

      /* PARLER — appelé en dernier, après tout le reste */
      speak(full);

    } catch (e) {
      if (e.name === 'AbortError') {
        log('Interrompu', 'info');
        live('Stoppé', 'idle');
        return;
      }
      if (outEl) outEl.textContent = 'Erreur: ' + e.message;
      log(e.message, 'err');
      live('Erreur', 'idle');
      toast('Erreur: ' + e.message.slice(0, 50), 'err', 3000);
    } finally {
      st.ctrl = null;
    }
  }

  /* =============================================
     RÉSUMÉ MÉMOIRE
     ============================================= */
  async function summarize() {
    if (st.hist.length < 14) return;
    var old = st.hist.splice(0, st.hist.length - 5);
    var txtParts = [];
    for (var i = 0; i < old.length; i++) {
      var m = old[i];
      if (typeof m.content === 'string') {
        txtParts.push(m.role + ': ' + m.content);
      } else {
        /* Message vision : extraire le texte */
        var textParts = [];
        for (var j = 0; j < m.content.length; j++) {
          if (m.content[j].type === 'text') textParts.push(m.content[j].text);
        }
        txtParts.push(m.role + ': ' + textParts.join(' ') + ' [image]');
      }
    }
    var txt = txtParts.join('\n');

    try {
      var r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + cfg.key
        },
        body: JSON.stringify({
          model: 'llama-3.1-8b-instant',
          messages: [
            { role: 'system', content: 'Résume densément en texte brut uniquement. Pas d\'astérisques ni markdown.' },
            { role: 'user', content: (st.mem ? st.mem + '\n\n' : '') + txt }
          ],
          temperature: 0.2,
          max_tokens: 400
        })
      });
      if (r.ok) {
        var d = await r.json();
        var s = '';
        if (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) {
          s = d.choices[0].message.content;
        }
        s = s.replace(/\*{1,3}/g, '').trim();
        if (s) {
          st.mem = s;
          log('Mémoire résumée', 'info');
        }
      }
    } catch (e) { /* ignoré */ }
    sys();
  }

  /* =============================================
     TTS — SYNTHÈSE VOCALE (CORRIGÉ CHROME)
     
     Bug Chrome connu : speechSynthesis.cancel()
     suivi immédiatement de speechSynthesis.speak()
     fait que speak() ne déclenche aucune voix.
     
     Solution : délai de 100ms après cancel().
     
     Bug Chrome 2 : la voix se coupe après ~15s
     de parole continue.
     
     Solution : keep-alive toutes les 10s qui
     fait pause(0)/resume() imperceptible.
     ============================================= */
  function speak(text) {
    if (!cfg.tts) return;
    if (!window.speechSynthesis) return;
    if (!text || text.length < 1) return;

    /* Annuler la parole en cours */
    speechSynthesis.cancel();
    stopTTSKeepAlive();

    /* Délai OBLIGATOIRE après cancel() sur Chrome */
    setTimeout(function() {
      /* Re-vérifier que TTS est toujours activé
         (l'utilisateur a pu appuyer STOP entre-temps) */
      if (!cfg.tts || !window.speechSynthesis) return;

      var u = new SpeechSynthesisUtterance(text.slice(0, 2000));
      u.lang = cfg.lang === 'fr' ? 'fr-FR' : cfg.lang === 'es' ? 'es-ES' : 'en-US';
      u.rate = 0.94;
      u.volume = 1;

      /* Chercher une voix dans la bonne langue */
      var availableVoices = speechSynthesis.getVoices();
      for (var i = 0; i < availableVoices.length; i++) {
        if (availableVoices[i].lang.indexOf(cfg.lang) === 0) {
          u.voice = availableVoices[i];
          break;
        }
      }

      u.onstart = function() {
        live('Parle...', 'speak');
        /* Démarrer le keep-alive pour éviter la coupure Chrome */
        startTTSKeepAlive();
      };

      u.onend = function() {
        stopTTSKeepAlive();
        /* Revenir à l'état précédent */
        if (st.auto) {
          live(st.comp ? 'Compagnon en écoute...' : 'Écoute...', 'listen');
        } else {
          live('Prêt', 'idle');
        }
      };

      u.onerror = function(e) {
        stopTTSKeepAlive();
        log('TTS erreur: ' + (e.error || 'inconnu'), 'err');
        if (st.auto) {
          live(st.comp ? 'Compagnon en écoute...' : 'Écoute...', 'listen');
        } else {
          live('Prêt', 'idle');
        }
      };

      speechSynthesis.speak(u);
    }, 100);
  }

  /* Keep-alive TTS : pause(0)/resume() toutes les 10s
     pour contourner le bug Chrome qui coupe la voix
     après ~15 secondes de parole continue */
  function startTTSKeepAlive() {
    stopTTSKeepAlive();
    ttsKeepAlive = setInterval(function() {
      if (window.speechSynthesis && speechSynthesis.speaking) {
        speechSynthesis.pause();
        speechSynthesis.resume();
      }
    }, 10000);
  }

  function stopTTSKeepAlive() {
    if (ttsKeepAlive !== null) {
      clearInterval(ttsKeepAlive);
      ttsKeepAlive = null;
    }
  }

  /* Précharger les voices */
  function loadVoices() {
    voices = speechSynthesis.getVoices();
    if (voices.length === 0) {
      speechSynthesis.addEventListener('voiceschanged', function() {
        voices = speechSynthesis.getVoices();
      }, { once: true });
    }
  }

  /* =============================================
     STOP GLOBAL
     ============================================= */
  function stopAll() {
    /* Arrêter le TTS */
    if (window.speechSynthesis) {
      speechSynthesis.cancel();
    }
    stopTTSKeepAlive();

    /* Arrêter le stream en cours */
    if (st.ctrl) {
      try { st.ctrl.abort(); } catch (e) { /* ignoré */ }
    }

    /* Signaler l'arrêt à la boucle auto */
    st.abortFlag = true;

    if (st.auto) {
      live('Stop — réécoute...', 'listen');
    } else {
      live('Stoppé', 'idle');
    }
    log('Stop', 'info');
  }

  /* =============================================
     IMAGE / CAMÉRA
     ============================================= */
  function loadImg(f) {
    if (!f || !f.type || f.type.indexOf('image/') !== 0) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      st.img = e.target.result;
      st.imgBase64 = e.target.result;
      var prevEl = $('#preview');
      if (prevEl) { prevEl.src = st.img; prevEl.style.display = 'block'; }
      log('Image chargée (' + Math.round(f.size / 1024) + ' Ko)');
      if (isVisionModel()) {
        live('Image prête — envoie un message', 'ok');
      } else {
        live('Image prête — change de modèle pour vision', 'ok');
        toast('Sélectionne Llama 4 Scout pour l\'image', 'warn', 3500);
      }
      sys();
    };
    reader.readAsDataURL(f);
  }

  async function startCam() {
    try {
      st.cam = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' },
        audio: false
      });
      var vidEl = $('#video');
      if (vidEl) { vidEl.srcObject = st.cam; vidEl.style.display = 'block'; }
      var boxEl = $('#cambox');
      if (boxEl) boxEl.classList.add('show');
      st.camOn = true;
      sys();
      live('Cam active', 'ok');
    } catch (e) {
      log('Cam: ' + e.message, 'err');
      toast('Caméra inaccessible', 'err');
    }
  }

  function stopCam() {
    if (st.cam) {
      st.cam.getTracks().forEach(function(t) { t.stop(); });
      st.cam = null;
    }
    var vidEl = $('#video');
    if (vidEl) { vidEl.srcObject = null; vidEl.style.display = 'none'; }
    var boxEl = $('#cambox');
    if (boxEl) boxEl.classList.remove('show');
    st.camOn = false;
    sys();
  }

  /* =============================================
     BINDINGS — TOUS LES ÉVÉNEMENTS
     ============================================= */
  function bind() {
    /* Bouton CFG — ouvre les paramètres */
    var cfgBtn = $('#cfg');
    if (cfgBtn) cfgBtn.onclick = function() { $('#dlg').showModal(); };

    /* Fermer paramètres */
    var xBtn = $('#x');
    if (xBtn) xBtn.onclick = function() { $('#dlg').close(); };

    /* Sauvegarder */
    var saveBtn = $('#save');
    if (saveBtn) saveBtn.onclick = function() { save(); $('#dlg').close(); };

    /* Reset */
    var rstBtn = $('#rst');
    if (rstBtn) rstBtn.onclick = function() {
      cfg = {};
      Object.assign(cfg, DEFAULT);
      localStorage.removeItem('sl241');
      apply();
      log('Reset', 'err');
      toast('Reset effectué', 'warn');
    };

    /* Coller la clé */
    var pasteBtn = $('#paste');
    if (pasteBtn) pasteBtn.onclick = async function() {
      try {
        var t = await navigator.clipboard.readText();
        if (!t.trim()) return toast('Presse-papiers vide', 'warn');
        var keyEl = $('#key');
        if (keyEl) keyEl.value = clean(t);
        cfg.key = clean(t);
        log('Clé collée');
        toast('Clé collée', 'ok', 1500);
      } catch (e) {
        toast('Clique dans le champ puis Ctrl+V', 'warn');
        var keyEl2 = $('#key');
        if (keyEl2) keyEl2.focus();
      }
    };

    /* Tester la clé */
    var testBtn = $('#test');
    if (testBtn) testBtn.onclick = async function() {
      var k = clean(($('#key') || {}).value || cfg.key);
      if (!valid(k)) return toast('Clé invalide (gsk_...)', 'err');
      toast('Test en cours...', 'info', 2000);
      try {
        var r = await fetch('https://api.groq.com/openai/v1/models', {
          headers: { Authorization: 'Bearer ' + k }
        });
        if (r.status === 401) return toast('Clé refusée (401)', 'err');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        toast('Clé valide', 'ok');
        cfg.key = k;
        localStorage.setItem('sl241', JSON.stringify(cfg));
        apply();
      } catch (e) {
        toast('Erreur: ' + e.message, 'err');
      }
    };

    /* REC manuel */
    var recBtn = $('#rec');
    if (recBtn) recBtn.onclick = function() { if (st.ready) { if (st.rec) stopRec(); else startRec(); } };

    /* STOP manuel */
    var stopBtn = $('#stop');
    if (stopBtn) stopBtn.onclick = stopRec;

    /* PLAY dernier enregistrement */
    var playBtn = $('#play');
    if (playBtn) playBtn.onclick = function() {
      if (!caps.length) return toast('Aucun enregistrement', 'warn');
      var audioEl = $('#audio');
      if (audioEl) { audioEl.src = caps[0].url; audioEl.play(); }
      toast('Lecture ' + fmt(caps[0].dur), 'info', 1500);
    };

    /* AUTO */
    var autoBtn = $('#auto');
    if (autoBtn) autoBtn.onclick = function() { if (st.auto) autoStop(); else autoStart(false); };

    /* 24/7 */
    var compBtn = $('#comp');
    if (compBtn) compBtn.onclick = function() { if (st.auto) autoStop(); else autoStart(true); };

    /* CLR */
    var clrBtn = $('#clr');
    if (clrBtn) clrBtn.onclick = function() {
      st.hist = [];
      st.mem = '';
      st.tokens = 0;
      st.img = null;
      st.imgBase64 = null;
      var prevEl = $('#preview');
      if (prevEl) prevEl.style.display = 'none';
      var outEl = $('#out');
      if (outEl) outEl.textContent = 'Mémoire effacée.';
      log('Mémoire clear', 'info');
      sys();
      toast('Effacé', 'ok', 1500);
    };

    /* RÉSUMÉ */
    var sumBtn = $('#sum');
    if (sumBtn) sumBtn.onclick = function() {
      if (!st.hist.length && !st.mem) return toast('Rien à résumer', 'warn');
      chat('Fais un résumé clair et oral de notre conversation.');
    };

    /* STOP vocal */
    var muteBtn = $('#mute');
    if (muteBtn) muteBtn.onclick = function() {
      stopAll();
      if (st.auto) toast('Réécoute...', 'info', 1500);
    };

    /* Image fichier */
    var imgBtn = $('#img');
    if (imgBtn) imgBtn.onclick = function() { var f = $('#file'); if (f) f.click(); };
    var fileInput = $('#file');
    if (fileInput) fileInput.onchange = function(e) {
      if (e.target.files && e.target.files[0]) loadImg(e.target.files[0]);
      e.target.value = '';
    };

    /* Caméra */
    var camBtn = $('#cam');
    if (camBtn) camBtn.onclick = function() { if (st.camOn) stopCam(); else startCam(); };

    /* Capture caméra */
    var captureBtn = $('#capture');
    if (captureBtn) captureBtn.onclick = function() {
      var v = $('#video');
      if (!v || !st.camOn) return;
      var c = document.createElement('canvas');
      c.width = v.videoWidth || 640;
      c.height = v.videoHeight || 480;
      c.getContext('2d').drawImage(v, 0, 0);
      st.img = c.toDataURL('image/jpeg', 0.85);
      st.imgBase64 = st.img;
      log('Capture caméra');
      if (isVisionModel()) {
        chat('Décris ce que tu vois sur cette image.');
      } else {
        toast('Sélectionne Llama 4 Scout pour analyser', 'warn', 3500);
        live('Image capturée — change de modèle', 'ok');
      }
      sys();
    };

    /* Fermer caméra */
    var camstopBtn = $('#camstop');
    if (camstopBtn) camstopBtn.onclick = stopCam;

    /* Envoi texte */
    var sendBtn = $('#send');
    if (sendBtn) sendBtn.onclick = function() {
      var txtEl = $('#txt');
      if (!txtEl) return;
      var t = txtEl.value.trim();
      if (!t) return;
      txtEl.value = '';
      if (isStop(t)) { stopAll(); live('Stop — en écoute', 'listen'); return; }
      live(t, 'ok');
      chat(t);
    };

    /* Entrée texte */
    var txtInput = $('#txt');
    if (txtInput) txtInput.onkeydown = function(e) {
      if (e.key === 'Enter') { e.preventDefault(); var sendBtn2 = $('#send'); if (sendBtn2) sendBtn2.click(); }
    };

    /* Escape = stop global */
    document.onkeydown = function(e) { if (e.key === 'Escape') stopAll(); };

    /* PTT — tous les événements touch et mouse */
    var pttBtn = $('#ptt');
    if (pttBtn) {
      pttBtn.addEventListener('touchstart', pttDown, { passive: false });
      pttBtn.addEventListener('touchend', pttUp, { passive: false });
      pttBtn.addEventListener('touchcancel', pttUp, { passive: false });
      pttBtn.addEventListener('mousedown', pttDown);
      pttBtn.addEventListener('mouseup', pttUp);
      pttBtn.addEventListener('mouseleave', pttUp);
    }

    /* Sliders */
    var sensInput = $('#sens');
    var vsensEl = $('#vsens');
    if (sensInput) sensInput.oninput = function() { if (vsensEl) vsensEl.textContent = sensInput.value; };

    var silInput = $('#sil');
    var vsilEl = $('#vsil');
    if (silInput) silInput.oninput = function() { if (vsilEl) vsilEl.textContent = silInput.value; };

    /* Resize avec debounce */
    var resizeTimer = null;
    window.onresize = function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() { if (st.ready) size(); }, 100);
    };
  }

  /* =============================================
     AUTO-BOOT — LANCEMENT AUTOMATIQUE
     ============================================= */
  async function boot() {
    var appEl = $('#app');
    if (appEl) appEl.classList.add('show');

    /* Horloge */
    setInterval(function() {
      var clockEl = $('#clock');
      if (clockEl) clockEl.textContent = now();
    }, 1000);

    log('SUPRA LAB v24.1 — Auto-boot');

    /* Si pas de clé : afficher les paramètres et attendre */
    if (!valid(cfg.key)) {
      status('Clé requise');
      sys();
      toast('Clique CFG pour entrer ta clé Groq', 'warn', 5000);
      live('Clique CFG pour entrer ta clé API Groq — gratuite sur groq.com', 'idle');
      /* Initialiser l'audio quand même pour les visuels */
      await initAudio();
      return;
    }

    /* Clé présente → démarrage automatique complet */
    status('Démarrage auto...');
    log('Clé détectée, démarrage automatique');
    var ok = await initAudio();
    if (ok) {
      status('Prêt — PTT ou AUTO');
      toast('SUPRA LAB prêt', 'ok', 2000);
      live('Prêt — Maintiens le bouton pour parler, ou appuie AUTO', 'idle');
    } else {
      status('Micro requis');
      live('Autorise le micro puis rafraîchis', 'idle');
    }
  }

  /* =============================================
     NETTOYAGE À LA FERMETURE
     ============================================= */
  window.onbeforeunload = function() {
    stopCam();
    stopVB();
    stopTTSKeepAlive();
    if (st.stream) st.stream.getTracks().forEach(function(t) { t.stop(); });
    if (window.speechSynthesis) speechSynthesis.cancel();
    for (var i = 0; i < caps.length; i++) {
      if (caps[i].url) URL.revokeObjectURL(caps[i].url);
    }
  };

  /* =============================================
     POINT D'ENTRÉE
     ============================================= */
  document.addEventListener('DOMContentLoaded', function() {
    load();
    bind();
    loadVoices();
    boot();
  });

})();
</script>
