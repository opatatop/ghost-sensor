<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUPRA ETERNITY v31 — HARD REALITY ⚡</title>
    <style>
        :root { 
            --primary: #00ffff; --secondary: #bc13fe; --bg: #000000; --panel: #050505; 
            --text: #e0e0ff; --danger: #ff0000; --accent: #00ff88; --evp: #ffaa00; 
            --ghost: #ff3333;
        }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            margin:0; padding:0; font-family:'Courier New',monospace; background:var(--bg); 
            color:var(--text); display:flex; flex-direction:column; height:100vh; overflow:hidden;
        }
        
        /* HEADER */
        header { background:#000; border-bottom:2px solid var(--primary); padding:10px 15px; display:flex; justify-content:space-between; align-items:center; z-index:50; }
        h1 { font-size:1rem; color:var(--primary); text-shadow:0 0 10px var(--primary); letter-spacing:2px; margin:0; line-height:1.2; text-transform:uppercase; }
        .version { font-size:0.6em; color:var(--danger); display:block; letter-spacing:1px; }

        /* MAIN VISUALIZER */
        main { flex:1; position:relative; display:flex; flex-direction:column; background:#000; }
        #visualizer { flex:1; position:relative; overflow:hidden; border-bottom:1px solid #222; }
        canvas { width:100%; height:100%; display:block; }

        /* OVERLAYS */
        #displayOverlay { position:absolute; top:20%; left:50%; transform:translateX(-50%); text-align:center; pointer-events:none; z-index:30; width:95%; }
        #mainText { font-size:2rem; font-weight:900; color:#fff; background:rgba(0,0,0,0.9); padding:15px 20px; border:3px solid var(--primary); text-transform:uppercase; text-shadow:0 0 10px var(--primary); margin-bottom:10px; letter-spacing:2px; }
        #liveTranscript { font-size:1.1rem; color:var(--accent); font-weight:bold; background:rgba(0,0,0,0.7); padding:5px 10px; border:1px solid var(--accent); min-height:30px; margin-top:5px; text-transform:uppercase; letter-spacing:1px;}
        
        /* STATUS INDICATORS */
        #micStatus { position:absolute; top:10px; left:10px; font-size:0.7rem; font-weight:bold; padding:4px 8px; border-radius:3px; background:#111; border:1px solid #555; color:#555; display:none; }
        #micStatus.active { border-color:var(--accent); color:var(--accent); background:rgba(0,50,0,0.5); animation: blink 1s infinite; }
        #micStatus.error { border-color:var(--danger); color:var(--danger); background:rgba(50,0,0,0.5); }
        
        #spiritStatus { position:absolute; top:10px; right:10px; font-size:0.7rem; font-weight:bold; padding:4px 8px; border-radius:3px; background:var(--ghost); color:#fff; border:1px solid #fff; display:none; box-shadow:0 0 10px red; }

        #hud { position:absolute; bottom:10px; left:10px; background:rgba(0,0,0,0.8); padding:5px 10px; border:1px solid #333; font-size:0.7rem; color:#888; }
        
        @keyframes blink { 50% { opacity:0.5; } }

        /* CONTROLS GRID */
        #actionGrid { display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; padding:8px; background:var(--panel); border-top:1px solid #333; }
        .grid-btn { background:#0a0a0a; border:1px solid #333; color:#666; padding:12px 2px; border-radius:0; text-align:center; font-size:0.6rem; cursor:pointer; transition:all 0.1s; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
        .grid-btn span:first-child { font-size:1.4rem; }
        .grid-btn.active-state { background:var(--secondary); color:#fff; border-color:var(--secondary); }
        .grid-btn.active-evp { background:var(--evp); color:#000; border-color:var(--evp); }
        .grid-btn.active-ghost { background:var(--ghost); color:#fff; border-color:#fff; animation: blink 0.2s infinite; }

        /* MAIN BUTTONS */
        #controls { background:var(--panel); padding:10px; display:grid; gap:8px; border-top:1px solid #222; }
        button { background:#000; border:1px solid var(--primary); color:var(--primary); padding:15px; font-size:0.9rem; font-weight:bold; cursor:pointer; text-transform:uppercase; letter-spacing:1px; font-family:'Courier New'; }
        button:active { background:var(--primary); color:#000; }
        button.active-mode { background:var(--primary); color:#000; box-shadow:0 0 15px var(--primary); }
        button.danger { border-color:var(--danger); color:var(--danger); }
        button.danger:active { background:var(--danger); color:#fff; }

        /* TERMINAL */
        #terminal { height:100px; background:#000; border-top:1px solid #333; padding:8px; font-size:0.65rem; overflow-y:auto; color:#666; line-height:1.4; font-family:'Courier New', monospace; }
        .log-line { margin-bottom:2px; border-left:2px solid #333; padding-left:6px; }
        .log-sys { border-color:#555; color:#888; }
        .log-ai { border-color:var(--secondary); color:var(--secondary); background:rgba(40,0,40,0.2); }
        .log-entity { border-color:#ff00ff; color:#ff00ff; font-weight:bold; }
        .log-evp { border-color:var(--evp); color:var(--evp); font-style:italic; }
        .log-ghost { border-color:var(--ghost); color:var(--ghost); }
        .log-error { border-color:var(--danger); color:var(--danger); background:rgba(50,0,0,0.3); }

        /* MODAL */
        #settingsModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.98); z-index:300; align-items:center; justify-content:center; }
        .modal-content { width:95%; max-width:500px; background:#111; border:2px solid var(--secondary); padding:20px; box-shadow:0 0 30px rgba(188,19,254,0.2); }
        .setting-row { display:flex; justify-content:space-between; align-items:center; margin:15px 0; border-bottom:1px solid #333; padding-bottom:10px; }
        label { font-size:0.9rem; color:#ddd; }
        input[type=range] { accent-color:var(--secondary); width:50%; }
        input[type=password] { background:#222; border:1px solid #555; color:#fff; padding:8px; width:60%; font-family:'Courier New'; }
        .close-btn { float:right; font-size:2rem; color:var(--danger); cursor:pointer; line-height:1; }

        /* CANVAS LAYERS */
        #evpWaveform, #ghostWaveform { height:50px; background:#000; width:100%; display:none; border-top:1px solid #333; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>SUPRA ETERNITY <span class="version">v31 REALITY</span></h1>
        </div>
        <button onclick="App.toggleSettings()" style="background:none;border:1px solid var(--secondary);color:var(--secondary);width:32px;height:32px;border-radius:0;font-size:1.2rem;">⚙️</button>
    </header>

    <main>
        <div id="visualizer">
            <canvas id="scopeCanvas"></canvas>
            
            <div id="micStatus">MICRO OFF</div>
            <div id="spiritStatus">RADIO GHOST ON</div>
            
            <div id="displayOverlay">
                <div id="mainText">SYSTÈME ARRÊTÉ</div>
                <div id="liveTranscript">EN ATTENTE DE DONNÉES</div>
            </div>
            
            <div id="hud">
                EMF: <span id="valEmf">0.0</span> | MAG: <span id="valMag">0</span>°
            </div>
        </div>
        <canvas id="evpWaveform"></canvas>
        <canvas id="ghostWaveform"></canvas>
    </main>

    <div id="actionGrid">
        <div class="grid-btn" onclick="App.toggleSettings()"><span>⚙️</span>CONFIG</div>
        <div class="grid-btn active-state" id="btnEMF" onclick="FeatureEngine.toggleEMF()"><span>📡</span>EMF</div>
        <div class="grid-btn active-state" id="btnVAD" onclick="FeatureEngine.toggleVAD()"><span>🎤</span>IA VOIX</div>
        <div class="grid-btn" id="btnGhostBox" onclick="SpiritBox.toggle()"><span>📻</span>GHOST BOX</div>
        <div class="grid-btn active-evp" id="btnEVP" onclick="FeatureEngine.toggleEVP()"><span>📼</span>EVP REC</div>
        <div class="grid-btn" id="btnPower" onclick="FeatureEngine.togglePower()"><span>⚡</span>PWR</div>
        <div class="grid-btn" onclick="App.clearLog()"><span>🗑️</span>LOG</div>
    </div>

    <div id="controls">
        <button class="active-mode" id="btnMainStart" onclick="App.startFullSystem()">INITIALISER LE SYSTÈME</button>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;">
            <button onclick="App.replayLastEVP()">⏪ REJOUER EVP</button>
            <button class="danger" onclick="App.stopSystem()">ARRÊTER</button>
        </div>
    </div>

    <div id="terminal"></div>

    <div id="settingsModal">
        <div class="modal-content">
            <span class="close-btn" onclick="App.toggleSettings()">×</span>
            <h2 style="color:var(--primary);margin-top:0;border-bottom:1px solid #333;padding-bottom:10px;">CONNEXION NEURALE</h2>
            
            <p style="font-size:0.8rem;color:#888;margin-bottom:15px;">
                MODE RÉEL ACTIVÉ. Sans clé API valide, le système ne générera pas de réponse.
            </p>
            
            <div class="setting-row">
                <label>Clé API OpenAI</label>
                <input type="password" id="keyinput" placeholder="sk-proj-..." autocomplete="off">
            </div>
            <div style="text-align:right; margin-bottom:15px;">
                <button onclick="App.saveKey()" style="padding:8px 16px; font-size:0.8rem; background:var(--primary); color:#000; border:none;">ENREGISTRER</button>
            </div>

            <h3 style="color:var(--ghost);font-size:0.9rem;border-bottom:1px solid #333;padding-bottom:5px;">PARAMÈTRES CAPTEURS</h3>
            <div class="setting-row">
                <label>Vitesse Balayage (Ghost Box)</label>
                <input type="range" id="sweepSpeed" min="10" max="200" step="10" value="80" oninput="Config.update(this)">
            </div>
            <div class="setting-row">
                <label>Seuil EMF (μT)</label>
                <input type="range" id="emfSensitivity" min="10" max="90" step="5" value="45" oninput="Config.update(this)">
            </div>
            <div class="setting-row">
                <label>Filtre EVP (Hz)</label>
                <input type="range" id="evpFilter" min="100" max="2000" step="50" value="600" oninput="Config.update(this)">
            </div>

            <button style="width:100%;margin-top:20px;" onclick="App.toggleSettings()">FERMER</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const Config = {
            data: { sweepSpeed: 80, emfSensitivity: 45, evpFilter: 600 },
            load() { 
                const saved = localStorage.getItem('supra_v31'); 
                if (saved) Object.assign(this.data, JSON.parse(saved)); 
                // UI Sync
                ['sweepSpeed', 'emfSensitivity', 'evpFilter'].forEach(id => {
                    const el = document.getElementById(id);
                    if(el) el.value = this.data[id];
                });
                document.getElementById('keyinput').value = localStorage.getItem('supra_api_key') || "";
            },
            save() { localStorage.setItem('supra_v31', JSON.stringify(this.data)); },
            update(el) { this.data[el.id] = parseFloat(el.value); this.save(); }
        };

        let apiKey = localStorage.getItem('supra_api_key') || "";
        let lastTrigger = 0;
        let isSystemRunning = false;
        
        // --- 2. MOTEUR AUDIO (REALME FIX) ---
        const AudioEngine = {
            ctx: null,
            analyser: null,
            stream: null,
            microphone: null,
            dataArray: null,
            
            async init() {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    if (this.ctx.state === 'suspended') await this.ctx.resume();

                    const constraints = {
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false, channelCount: 1 }
                    };

                    this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.microphone = this.ctx.createMediaStreamSource(this.stream);
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 2048; 
                    this.microphone.connect(this.analyser);
                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                    
                    App.log("Audio hardware connecté.", "sys");
                    EVPRecorder.init(this.ctx, this.stream);
                    return true;
                } catch(e) {
                    App.log("ERR MICRO: " + e.name, "error");
                    return false;
                }
            },
            stop() {
                if(this.stream) this.stream.getTracks().forEach(t => t.stop());
                if(this.ctx) this.ctx.close();
                EVPRecorder.stop();
                SpiritBox.stop();
            }
        };

        // --- 3. GHOST BOX (REAL DIGITAL SWEEP) ---
        const SpiritBox = {
            node: null,
            gain: null,
            filter: null,
            isActive: false,
            currentFreq: 100,
            direction: 1,
            raf: null,

            init(ctx) {
                if(!ctx) return;
                // Création de bruit blanc statique
                const bufferSize = 2 * ctx.sampleRate;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    // Bruit blanc + quelques crêtes aléatoires pour simuler interférences
                    data[i] = (Math.random() * 2 - 1) * (Math.random() > 0.99 ? 2.0 : 0.8); 
                }

                this.node = ctx.createBufferSource();
                this.node.buffer = buffer;
                this.node.loop = true;

                this.filter = ctx.createBiquadFilter();
                this.filter.type = 'bandpass';
                this.filter.frequency.value = this.currentFreq;
                this.filter.Q.value = 5; // Bande étroite pour effet radio

                this.gain = ctx.createGain();
                this.gain.gain.value = 0.0; // Start muted

                this.node.connect(this.filter);
                this.filter.connect(this.gain);
            },

            toggle() {
                if (this.isActive) this.stop();
                else this.start();
            },

            start() {
                if (!AudioEngine.ctx) return;
                if (!this.node) this.init(AudioEngine.ctx);
                
                this.isActive = true;
                this.node.start(0);
                this.gain.connect(AudioEngine.ctx.destination);
                this.gain.gain.setTargetAtTime(0.5, AudioEngine.ctx.currentTime, 0.1); // Fade in
                
                document.getElementById('btnGhostBox').classList.add('active-ghost');
                document.getElementById('spiritStatus').style.display = 'block';
                document.getElementById('ghostWaveform').style.display = 'block';
                App.log("Ghost Box : Balayage spectral actif.", "ghost");
                this.sweep();
            },

            stop() {
                this.isActive = false;
                if (this.gain) {
                    this.gain.gain.setTargetAtTime(0, AudioEngine.ctx.currentTime, 0.1); // Fade out
                    setTimeout(() => {
                        if(this.node) { try { this.node.stop(); } catch(e){} this.gain.disconnect(); }
                    }, 200);
                }
                cancelAnimationFrame(this.raf);
                document.getElementById('btnGhostBox').classList.remove('active-ghost');
                document.getElementById('spiritStatus').style.display = 'none';
                document.getElementById('ghostWaveform').style.display = 'none';
            },

            sweep() {
                if (!this.isActive) return;
                
                // Balayage logarithmique plus naturel pour une radio
                const speed = Config.data.sweepSpeed;
                this.currentFreq *= (1 + (this.direction * (speed * 0.001)));

                if (this.currentFreq > 5000) { this.direction = -1; }
                if (this.currentFreq < 100) { this.direction = 1; }

                this.filter.frequency.setTargetAtTime(this.currentFreq, AudioEngine.ctx.currentTime, 0.05);
                
                this.raf = requestAnimationFrame(() => this.sweep());
            }
        };

        // --- 4. EVP RECORDER (REAL AUDIO BUFFER) ---
        const EVPRecorder = {
            mediaRecorder: null,
            audioChunks: [],
            audioContext: null,

            init(ctx, stream) {
                this.audioContext = ctx;
                try {
                    this.mediaRecorder = new MediaRecorder(stream);
                    this.mediaRecorder.ondataavailable = (e) => { this.audioChunks = [e.data]; };
                    this.start();
                } catch(e) { App.log("EVP Init Error", "error"); }
            },

            start() {
                if(this.mediaRecorder && this.mediaRecorder.state === "inactive") {
                    this.mediaRecorder.start(4000); // Buffer de 4 secondes
                    document.getElementById('evpWaveform').style.display = 'block';
                }
            },

            stop() {
                if(this.mediaRecorder && this.mediaRecorder.state !== "inactive") {
                    this.mediaRecorder.stop();
                    document.getElementById('evpWaveform').style.display = 'none';
                }
            },

            async playLastCapture() {
                if(this.audioChunks.length === 0) return;
                App.log("Analyse spectrale brute en cours...", "evp");
                
                const blob = new Blob(this.audioChunks, { type: 'audio/webm' });
                const arrayBuffer = await blob.arrayBuffer();
                const audioBuffer = await this.audioContext.decodeAudioData(arrayBuffer);
                const source = this.audioContext.createBufferSource();
                source.buffer = audioBuffer;
                
                // Effet de ralentissement pour analyse (Paranormal style)
                source.playbackRate.value = 0.85; 
                
                const filter = this.audioContext.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = Config.data.evpFilter;

                const gain = this.audioContext.createGain();
                gain.gain.value = 2.0; // Boost car l'audio est souvent faible

                source.connect(filter);
                filter.connect(gain);
                gain.connect(this.audioContext.destination);
                source.start(0);
            }
        };

        // --- 5. VISUALISATION ---
        const VisualEngine = {
            canvas: null,
            ctx: null,
            init() {
                this.canvas = document.getElementById('scopeCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.loop();
            },
            resize() {
                this.canvas.width = this.canvas.parentElement.clientWidth;
                this.canvas.height = this.canvas.parentElement.clientHeight;
            },
            loop() {
                if(!isSystemRunning) return;
                requestAnimationFrame(() => this.loop());
                const w = this.canvas.width;
                const h = this.canvas.height;
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, w, h);

                if (AudioEngine.dataArray) {
                    const data = AudioEngine.dataArray;
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, h);
                    for (let i = 0; i < data.length; i++) {
                        const v = data[i] / 255;
                        const y = h - (v * h);
                        this.ctx.lineTo(i * (w / data.length), y);
                    }
                    this.ctx.strokeStyle = '#00ffff';
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                }
            }
        };

        // --- 6. CERVEAU & IA (STRICT NO-SIMULATION) ---
        const BrainEngine = {
            recognition: null,
            
            speak(text) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.rate = 0.9; u.pitch = 0.6;
                window.speechSynthesis.speak(u);
            },

            initVoice() {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return;
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                this.recognition = new SR();
                this.recognition.lang = 'fr-FR';
                this.recognition.continuous = true;
                this.recognition.interimResults = true; 

                this.recognition.onstart = () => {
                    const status = document.getElementById('micStatus');
                    status.style.display = 'block';
                    status.className = 'active';
                    status.innerText = "MIKRO ACTIF";
                };

                this.recognition.onend = () => {
                    if(isSystemRunning && FeatureEngine.vadActive) {
                        setTimeout(() => { if(FeatureEngine.vadActive) this.recognition.start(); }, 1000);
                    } else {
                        document.getElementById('micStatus').style.display = 'none';
                    }
                };

                this.recognition.onerror = (e) => {
                     if(e.error === 'not-allowed') App.log("ERR: Permissions micro refusées.", "error");
                };

                this.recognition.onresult = (e) => {
                    const result = e.results[e.results.length-1];
                    const transcript = result[0].transcript;
                    document.getElementById('liveTranscript').innerText = transcript;

                    if (result.isFinal) {
                        // Détection vocale réelle
                        App.handleDetection("VOICE_INPUT", transcript);
                        EVPRecorder.playLastCapture();
                        setTimeout(() => document.getElementById('liveTranscript').innerText = "...", 4000);
                    }
                };

                try { this.recognition.start(); } catch(e){}
            }
        };

        // --- FONCTION IA STRICTE ---
        async function triggerAI(source, data) {
            if (Date.now() - lastTrigger < 4000) return;
            lastTrigger = Date.now();

            const display = document.getElementById('mainText');
            display.innerText = "TRAITMENT DONNÉES...";
            display.style.color = "var(--secondary)";

            // VÉRIFICATION CLÉ OBLIGATOIRE
            if (!apiKey) {
                App.log("ERREUR CRITIQUE: Aucune clé API OpenAI détectée. Analyse impossible.", "error");
                display.innerText = "ERR: NO API KEY";
                display.style.color = "var(--danger)";
                BrainEngine.speak("Erreur système. Clé API manquante.");
                setTimeout(() => { display.innerText = "ATTENTE"; display.style.color = "#fff"; }, 3000);
                return;
            }

            try {
                App.log(`Envoi données vers IA : ${source}`, "ai");
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo",
                        messages: [
                            { role: "system", content: "Tu es ZEUS, un système d'analyse paranormale froid et analytique. Tu réponds uniquement basé sur les données fournies. Pas de simulation." },
                            { role: "user", content: `Source: ${source}. Données: "${data}". Analyse scientifique et paranormale.` }
                        ],
                        max_tokens: 50, temperature: 0.7
                    })
                });

                if (!response.ok) throw new Error(`API Error ${response.status}`);
                const json = await response.json();
                const reply = json.choices[0].message.content;

                App.log(`RÉPONSE IA : ${reply}`, "ai");
                BrainEngine.speak(reply);
                display.innerText = reply.toUpperCase();
                setTimeout(() => { display.innerText = "SURVEILLANCE"; display.style.color = "#fff"; }, 4000);

            } catch (error) {
                App.log(`ÉCHEC CONNEXION IA : ${error.message}`, "error");
                display.innerText = "CONNEXION PERDUE";
                display.style.color = "var(--danger)";
            }
        }

        // --- 7. LOGIQUE APP ---
        const FeatureEngine = {
            emfActive: true, vadActive: true, evpActive: true, powerMode: true,
            toggleEMF() { this.emfActive = !this.emfActive; document.getElementById('btnEMF').classList.toggle('active-state'); },
            toggleVAD() { 
                this.vadActive = !this.vadActive; 
                document.getElementById('btnVAD').classList.toggle('active-state');
                if(this.vadActive && isSystemRunning) BrainEngine.initVoice();
            },
            toggleEVP() { 
                this.evpActive = !this.evpActive; 
                document.getElementById('btnEVP').classList.toggle('active-evp'); 
                if(this.evpActive) EVPRecorder.start(); else EVPRecorder.stop();
            },
            togglePower() { this.powerMode = !this.powerMode; document.getElementById('btnPower').classList.toggle('active-state'); }
        };

        const App = {
            log(msg, type) {
                const t = document.getElementById('terminal');
                const d = document.createElement('div');
                d.className = 'log-line log-' + type;
                d.innerText = `[${new Date().toLocaleTimeString('fr-FR')}] ${msg}`;
                t.appendChild(d);
                t.scrollTop = t.scrollHeight;
            },
            clearLog() { document.getElementById('terminal').innerHTML = ''; },
            
            saveKey() {
                apiKey = document.getElementById('keyinput').value.trim();
                localStorage.setItem('supra_api_key', apiKey);
                this.log("Clé API enregistrée.", "sys");
                this.toggleSettings();
            },
            toggleSettings() {
                const m = document.getElementById('settingsModal');
                m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
            },
            handleDetection(type, details) {
                App.log(`CAPTEUR [${type}] : ${details}`, "entity");
                triggerAI(type, details);
            },
            async startFullSystem() {
                if(isSystemRunning) return;
                const btn = document.getElementById('btnMainStart');
                btn.innerHTML = "INITIALISATION...";
                
                if (!await AudioEngine.init()) { 
                    btn.innerHTML = "ERREUR MATÉRIEL"; 
                    return; 
                }

                isSystemRunning = true;
                VisualEngine.init();
                if(FeatureEngine.vadActive) BrainEngine.initVoice();
                if(FeatureEngine.evpActive) EVPRecorder.start();

                btn.innerHTML = "SYSTÈME ACTIF";
                btn.classList.add("active-mode");
                document.getElementById('mainText').innerText = "SUPRA ACTIF";
                
                this.log("Système v31 initialisé. Mode Réel.", "sys");
                if(!apiKey) {
                    this.log("ATTENTION: Aucune clé API. L'IA ne fonctionnera pas.", "error");
                    BrainEngine.speak("Système en ligne. Attention, réseau neuronal déconnecté.");
                } else {
                    BrainEngine.speak("Système en ligne. Réseau neuronal connecté.");
                }
            },
            stopSystem() {
                isSystemRunning = false;
                AudioEngine.stop();
                if(BrainEngine.recognition) BrainEngine.recognition.stop();
                window.speechSynthesis.cancel();
                document.getElementById('btnMainStart').innerHTML = "INITIALISER LE SYSTÈME";
                document.getElementById('btnMainStart').classList.remove("active-mode");
                document.getElementById('mainText').innerText = "ARRÊTÉ";
                this.log("Arrêt système.", "sys");
            },
            replayLastEVP() { EVPRecorder.playLastCapture(); }
        };

        // --- 8. EMF SENSOR ---
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', e => {
                if(!isSystemRunning || !FeatureEngine.emfActive) return;
                const emf = (Math.abs(e.alpha-180) + Math.abs(e.beta) + Math.abs(e.gamma))/4 + (Math.random()*2);
                document.getElementById('valEmf').innerText = emf.toFixed(1);
                document.getElementById('valMag').innerText = Math.round(e.alpha||0);
                if (emf > Config.data.emfSensitivity && Date.now() - lastTrigger > 8000) {
                    App.handleDetection("EMF_SPIKE", `${emf.toFixed(1)} micro-Teslas`);
                }
            });
        }

        window.onload = () => { Config.load(); App.log("SUPRA v31 Ready.", "sys"); };
    </script>
</body>
</html>
