<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. PARANORMAL ULTIMATE v10.3</title>
    <style>
        :root {
            --primary: #00ff88; /* Vert Jarvis */
            --secondary: #00ccff; /* Cyan Sonar */
            --alert: #ff3333; /* Rouge Alerte */
            --bg: #050505;
            --panel: #0a0a0a;
            --text: #e0e0e0;
            --grid-line: rgba(0, 255, 136, 0.15);
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
        @keyframes pulseRed {
            0%, 100% { box-shadow: 0 0 20px var(--alert); border-color: var(--alert); }
            50% { box-shadow: 0 0 50px var(--alert); border-color: #ff8888; }
        }
        @keyframes pulseGreen {
            0%, 100% { text-shadow: 0 0 10px var(--primary); opacity: 1; }
            50% { text-shadow: 0 0 25px var(--primary); opacity: 0.7; }
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Effet de vieillissement/écran CRT */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* En-tête */
        header {
            background: rgba(0, 20, 10, 0.9);
            border-bottom: 2px solid var(--primary);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        h1 {
            font-size: 1.2rem;
            margin: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulseGreen 2s infinite;
        }
        .status-badge {
            font-size: 0.7rem;
            background: var(--primary);
            color: #000;
            padding: 2px 6px;
            border-radius: 2px;
            font-weight: bold;
        }

        /* Zone Principale */
        main {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Canvas Radar */
        #radarCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        /* Overlay Interface */
        .hud-overlay {
            position: absolute;
            z-index: 5;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        #centerText {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 80%;
        }
        
        #liveTranslation {
            font-size: 1.4rem;
            color: var(--secondary);
            text-shadow: 0 0 10px var(--secondary);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 1px solid var(--secondary);
            margin-bottom: 10px;
            min-height: 1.5em;
            font-weight: bold;
        }

        #subInfo {
            font-size: 0.9rem;
            color: #aaa;
            letter-spacing: 1px;
        }

        /* Panneaux latéraux */
        .side-panel {
            position: absolute;
            background: rgba(0, 10, 5, 0.85);
            border: 1px solid var(--primary);
            padding: 8px;
            font-size: 0.75rem;
            color: var(--primary);
            width: 140px;
            border-radius: 4px;
        }
        #statsPanel { top: 10px; right: 10px; text-align: right; }
        #logPanel { bottom: 180px; left: 10px; width: 200px; height: 100px; overflow: hidden; display: flex; flex-direction: column-reverse; opacity: 0.8; }
        .log-entry { margin-top: 2px; border-bottom: 1px solid #333; padding-bottom: 2px; }

        /* Alerte Entité */
        #entityAlert {
            position: absolute;
            top: 20%; left: 50%;
            transform: translateX(-50%) scale(0);
            background: rgba(50, 0, 0, 0.9);
            border: 2px solid var(--alert);
            color: var(--alert);
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            z-index: 20;
            transition: transform 0.2s;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
        }
        #entityAlert.active {
            transform: translateX(-50%) scale(1);
            animation: pulseRed 0.5s infinite;
        }

        /* Contrôles Bas */
        #controls {
            background: var(--panel);
            border-top: 2px solid #333;
            padding: 10px;
            z-index: 10;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn {
            background: #111;
            border: 1px solid #444;
            color: #888;
            padding: 12px 5px;
            font-family: inherit;
            font-size: 0.7rem;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn span.icon { font-size: 1.2rem; }
        
        .btn:active { transform: scale(0.95); }
        .btn.active {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }
        .btn.danger.active {
            background: rgba(255, 50, 50, 0.1);
            border-color: var(--alert);
            color: var(--alert);
            box-shadow: 0 0 10px rgba(255, 50, 50, 0.2);
        }

        /* Bibliothèque EVP */
        #evpLibrary {
            height: 0; /* Caché par défaut */
            background: #000;
            border-top: 1px solid #333;
            overflow-y: auto;
            transition: height 0.3s;
            z-index: 15;
            position: relative;
        }
        #evpLibrary.open { height: 100px; padding: 10px; }
        .evp-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            padding: 5px;
            border-bottom: 1px solid #222;
            color: var(--secondary);
            cursor: pointer;
        }
        .evp-item:hover { color: #fff; }

        /* Scanline animée */
        .scanner-bar {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 5px;
            background: var(--primary);
            opacity: 0.3;
            animation: scanline 3s linear infinite;
            pointer-events: none;
            z-index: 3;
        }

    </style>
</head>
<body>

<header>
    <h1>J.A.R.V.I.S. <span style="font-size:0.6em; color:#fff;">PARANORMAL</span></h1>
    <div class="status-badge" id="sysStatus">SYSTÈME ACTIF</div>
</header>

<main>
    <canvas id="radarCanvas"></canvas>
    <div class="scanner-bar"></div>
    
    <div id="statsPanel" class="side-panel">
        <div>EMF : <span id="emfVal">0.0</span> mG</div>
        <div>TEMP : <span id="tempVal">20.4</span> °C</div>
        <div>AUDIO : <span id="audioVal">-dB</span></div>
        <div style="margin-top:5px; border-top:1px solid #333; padding-top:2px;">
            ÉTAT: <span id="stateText" style="color:var(--secondary)">VEILLE</span>
        </div>
    </div>

    <div id="logPanel" class="side-panel">
        <!-- Les logs s'affichent ici -->
    </div>

    <div class="hud-overlay">
        <div id="centerText">
            <div id="liveTranslation">INITIALISATION...</div>
            <div id="subInfo">ATTENTE SIGNAUX VOCAUX OU ÉNERGÉTIQUES</div>
        </div>
    </div>

    <div id="entityAlert">
        DÉTECTION<br>ENTITÉ CONFIRMÉE
    </div>
</main>

<div id="controls">
    <button class="btn active" id="btnPower" onclick="togglePower()"><span class="icon">⚡</span>Power</button>
    <button class="btn active" id="btnRadar" onclick="toggleModule('radar')"><span class="icon">📡</span>Sonar</button>
    <button class="btn active" id="btnVAD" onclick="toggleModule('vad')"><span class="icon">🎙️</span>Voice AI</button>
    <button class="btn" id="btnSpirit" onclick="toggleModule('spirit')"><span class="icon">📻</span>Spirit Box</button>
    <button class="btn danger" id="btnRecord" onclick="toggleRecording()"><span class="icon">🔴</span>EVP REC</button>
    <button class="btn" id="btnClean" onclick="cleanAudio()"><span class="icon">🧹</span>Clean</button>
    <button class="btn" id="btnEvp" onclick="toggleEvpLib()"><span class="icon">📂</span>Biblio.</button>
    <button class="btn" onclick="speakSystem('Système diagnostic complet terminé. Aucune anomalie critique détectée dans la structure.')"><span class="icon">💬</span>Test</button>
</div>

<div id="evpLibrary">
    <div style="color:var(--primary); font-size:0.8rem; margin-bottom:5px;">ENREGISTREMENTS CAPTURÉS :</div>
    <div id="evpList"></div>
</div>

<script>
    // --- CONFIGURATION & VARIABLES GLOBALES ---
    const UI = {
        canvas: document.getElementById('radarCanvas'),
        ctx: document.getElementById('radarCanvas').getContext('2d'),
        liveText: document.getElementById('liveTranslation'),
        subInfo: document.getElementById('subInfo'),
        alertBox: document.getElementById('entityAlert'),
        logPanel: document.getElementById('logPanel'),
        emf: document.getElementById('emfVal'),
        temp: document.getElementById('tempVal'),
        audio: document.getElementById('audioVal'),
        state: document.getElementById('stateText'),
        status: document.getElementById('sysStatus')
    };

    let State = {
        power: true,
        radar: true,
        vad: true,
        spirit: false,
        recording: false
    };

    let AudioSys = {
        ctx: null,
        analyser: null,
        mic: null,
        stream: null,
        dataArray: null,
        isInit: false
    };

    let Recorder = {
        mediaRecorder: null,
        chunks: [],
        clips: []
    };

    // --- SYSTÈME AUDIO (Radar & Analyse) ---
    async function initAudio() {
        if (AudioSys.isInit) return;
        try {
            AudioSys.ctx = new (window.AudioContext || window.webkitAudioContext)();
            AudioSys.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            AudioSys.mic = AudioSys.ctx.createMediaStreamSource(AudioSys.stream);
            AudioSys.analyser = AudioSys.ctx.createAnalyser();
            AudioSys.analyser.fftSize = 256;
            AudioSys.mic.connect(AudioSys.analyser);
            
            const bufferLength = AudioSys.analyser.frequencyBinCount;
            AudioSys.dataArray = new Uint8Array(bufferLength);
            AudioSys.isInit = true;
            log("Audio connecté. Analyse spectrale active.");
        } catch (e) {
            log("ERREUR MICRO: Accès refusé.");
            UI.status.textContent = "ERREUR MATÉRIEL";
            UI.status.style.background = "red";
        }
    }

    // --- MOTEUR VISUEL (RADAR JARVIS) ---
    let radarAngle = 0;

    function resizeCanvas() {
        UI.canvas.width = UI.canvas.parentElement.clientWidth;
        UI.canvas.height = UI.canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawRadar() {
        if (!State.power) {
            UI.ctx.fillStyle = "#000";
            UI.ctx.fillRect(0, 0, UI.canvas.width, UI.canvas.height);
            return;
        }

        const w = UI.canvas.width;
        const h = UI.canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const maxRadius = Math.min(w, h) / 2.2;

        // Effet de traînée (fade out)
        UI.ctx.fillStyle = "rgba(5, 5, 5, 0.1)";
        UI.ctx.fillRect(0, 0, w, h);

        if (!State.radar) {
            requestAnimationFrame(drawRadar);
            return;
        }

        // Dessiner la grille
        UI.ctx.strokeStyle = "rgba(0, 255, 136, 0.3)";
        UI.ctx.lineWidth = 1;
        
        // Cercles concentriques
        [0.25, 0.5, 0.75, 1].forEach(scale => {
            UI.ctx.beginPath();
            UI.ctx.arc(cx, cy, maxRadius * scale, 0, Math.PI * 2);
            UI.ctx.stroke();
        });

        // Lignes croisées
        UI.ctx.beginPath();
        UI.ctx.moveTo(cx - maxRadius, cy); UI.ctx.lineTo(cx + maxRadius, cy);
        UI.ctx.moveTo(cx, cy - maxRadius); UI.ctx.lineTo(cx, cy + maxRadius);
        UI.ctx.stroke();

        // Balayage (Ligne scanner)
        radarAngle += 0.03;
        UI.ctx.save();
        UI.ctx.translate(cx, cy);
        UI.ctx.rotate(radarAngle);
        
        // Gradient pour le faisceau
        const gradient = UI.ctx.createLinearGradient(0, 0, maxRadius, 0);
        gradient.addColorStop(0, "rgba(0, 255, 136, 0)");
        gradient.addColorStop(1, "rgba(0, 255, 136, 0.5)");
        
        UI.ctx.fillStyle = gradient;
        UI.ctx.beginPath();
        UI.ctx.moveTo(0, 0);
        UI.ctx.arc(0, 0, maxRadius, -0.2, 0.2);
        UI.ctx.fill();
        
        UI.ctx.strokeStyle = "#fff";
        UI.ctx.beginPath();
        UI.ctx.moveTo(0,0);
        UI.ctx.lineTo(maxRadius, 0);
        UI.ctx.stroke();
        
        UI.ctx.restore();

        // Visualisation fréquentielle (Points sur le cercle)
        if (AudioSys.isInit) {
            AudioSys.analyser.getByteFrequencyData(AudioSys.dataArray);
            const bufferLength = AudioSys.analyser.frequencyBinCount;
            
            for(let i = 0; i < bufferLength; i+=4) {
                const v = AudioSys.dataArray[i] / 128.0; // 0..2
                const radius = maxRadius + (v * 20);
                const angle = (radarAngle - (Math.PI * 2 * (i/bufferLength))) % (Math.PI * 2);
                
                const x = cx + Math.cos(angle) * radius;
                const y = cy + Math.sin(angle) * radius;
                
                UI.ctx.fillStyle = `hsl(${120 + v * 50}, 100%, 50%)`;
                UI.ctx.beginPath();
                UI.ctx.arc(x, y, 2 + v, 0, Math.PI*2);
                UI.ctx.fill();
            }
        }

        // Simulation présence aléatoire (Ghost Blip)
        if (State.spirit && Math.random() > 0.98) {
            const gAngle = Math.random() * Math.PI * 2;
            const gRad = Math.random() * maxRadius * 0.8;
            const gx = cx + Math.cos(gAngle) * gRad;
            const gy = cy + Math.sin(gAngle) * gRad;
            
            UI.ctx.fillStyle = "#ff0000";
            UI.ctx.beginPath();
            UI.ctx.arc(gx, gy, 6, 0, Math.PI*2);
            UI.ctx.fill();
            // Cercle expansion
            UI.ctx.strokeStyle = "#ff0000";
            UI.ctx.beginPath();
            UI.ctx.arc(gx, gy, 15, 0, Math.PI*2);
            UI.ctx.stroke();
        }

        requestAnimationFrame(drawRadar);
    }

    // --- IA VOCAL & SYNTHÈSE ---
    
    function speakSystem(text) {
        window.speechSynthesis.cancel(); // Évite la file d'attente infinie
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'fr-FR';
        msg.pitch = 0.8; // Voix plus grave (Jarvis)
        msg.rate = 1.1;
        window.speechSynthesis.speak(msg);
    }

    function speakGhost(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'fr-FR';
        msg.pitch = 0.3; // Voix très grave/étrange
        msg.rate = 0.7;
        // Appliquer un filtre si possible (limité en vanilla JS simple, on joue sur le pitch/rate)
        window.speechSynthesis.speak(msg);
    }

    const GhostPhrases = [
        "Je suis... ici...",
        "Pourquoi tu m'as dérangé",
        "Sortez... maintenant...",
        "Il fait si froid...",
        "Aide-moi...",
        "Tu ne peux pas me voir",
        "Derrière toi",
        "Je meurs... encore..."
    ];

    // Reconnaissance Vocale (Web Speech API)
    let Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recog = null;

    function startSpeech() {
        if (!Recognition) return;
        recog = new Recognition();
        recog.continuous = true;
        recog.interimResults = true;
        recog.lang = 'fr-FR';

        recog.onresult = (event) => {
            if (!State.vad) return;
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            
            if (transcript.trim().length > 0) {
                UI.liveText.textContent = `UTILISATEUR: "${transcript.toUpperCase()}"`;
                UI.liveText.style.color = "var(--secondary)";
                
                // Détection simple de mots clés
                const lower = transcript.toLowerCase();
                if (lower.includes("qui est là") || lower.includes("présence") || lower.includes("fantôme")) {
                    triggerEntityResponse(true); // Réponse contextuelle
                }
            }
        };

        recog.onerror = (e) => {
            if(e.error !== 'no-speech') log("Erreur Vocale: " + e.error);
        };

        recog.start();
        log("Module Vocale Activé.");
    }

    // --- LOGIQUE MÉTIER ---

    function triggerEntityResponse(contextual = false) {
        if (!State.power) return;
        
        UI.alertBox.classList.add('active');
        UI.state.textContent = "MENACE DÉTECTÉE";
        UI.state.style.color = "var(--alert)";
        
        let phrase;
        if (contextual) {
            phrase = "Je suis l'esprit de cette machine";
        } else {
            phrase = GhostPhrases[Math.floor(Math.random() * GhostPhrases.length)];
        }

        UI.liveText.textContent = `ENTITÉ: "${phrase.toUpperCase()}"`;
        UI.liveText.style.color = "var(--alert)";
        
        speakGhost(phrase);
        log(`ALERT: Entité détectée. Message: ${phrase}`);

        if (State.recording) log("EVP: Capture en cours...");

        setTimeout(() => {
            UI.alertBox.classList.remove('active');
            UI.state.textContent = "VEILLE";
            UI.state.style.color = "var(--secondary)";
        }, 4000);
    }

    function updateHUD() {
        if (!State.power) return;

        // Simulation valeurs capteurs
        if (AudioSys.isInit) {
            AudioSys.analyser.getByteFrequencyData(AudioSys.dataArray);
            let sum = 0;
            for(let i=0; i<AudioSys.dataArray.length; i++) sum += AudioSys.dataArray[i];
            let average = sum / AudioSys.dataArray.length;
            
            UI.audio.textContent = (average - 100).toFixed(1) + " dB";
            
            // EMF basé sur le volume audio + bruit aléatoire
            let emf = (average / 10) + (Math.random() * 2);
            if (State.spirit) emf += Math.random() * 5; // Boost si spirit box
            UI.emf.textContent = emf.toFixed(1);

            // Détection automatique de bruit fort (Ghost Trigger)
            if (average > 50 && Math.random() > 0.95 && !UI.alertBox.classList.contains('active')) {
                triggerEntityResponse();
            }
        } else {
            // Mode démo sans micro
            UI.emf.textContent = (Math.random() * 3).toFixed(1);
            UI.audio.textContent = "- dB";
        }

        // Température (variation lente)
        let baseTemp = 20.0;
        if (State.spirit) baseTemp -= 2.0; // Froid quand fantôme
        UI.temp.textContent = (baseTemp + (Math.random() * 0.5)).toFixed(1);

        setTimeout(updateHUD, 200);
    }

    // --- GESTION DES BOUTONS ---

    function togglePower() {
        State.power = !State.power;
        const btn = document.getElementById('btnPower');
        btn.classList.toggle('active');
        UI.status.textContent = State.power ? "SYSTÈME ACTIF" : "HORS LIGNE";
        UI.status.style.background = State.power ? "var(--primary)" : "#333";
        UI.status.style.color = State.power ? "#000" : "#fff";
        
        if (State.power) {
            speakSystem("Système en ligne. Protocoles de détection activés.");
            initAudio();
        } else {
            window.speechSynthesis.cancel();
            UI.liveText.textContent = "SYSTÈME OFF";
        }
    }

    function toggleModule(mod) {
        if (!State.power) return;
        
        if (mod === 'radar') {
            State.radar = !State.radar;
            document.getElementById('btnRadar').classList.toggle('active');
            speakSystem(State.radar ? "Sonar activé" : "Sonar désactivé");
        }
        else if (mod === 'vad') {
            State.vad = !State.vad;
            document.getElementById('btnVAD').classList.toggle('active');
            if(State.vad) startSpeech();
            else if(recog) { recog.stop(); UI.liveText.textContent = "MIC OFF"; }
        }
        else if (mod === 'spirit') {
            State.spirit = !State.spirit;
            document.getElementById('btnSpirit').classList.toggle('active');
            if(State.spirit) {
                speakSystem("Spirit Box activée. Balayage des fréquences.");
                UI.subInfo.textContent = "BALAYAGE FRÉQUENCES SPECTRALES...";
                // Loop sons aléatoires
                spiritLoop = setInterval(() => {
                    if(Math.random() > 0.6) triggerEntityResponse();
                }, 8000);
            } else {
                speakSystem("Spirit Box désactivée.");
                UI.subInfo.textContent = "MODE STANDARD";
                clearInterval(spiritLoop);
            }
        }
    }

    let spiritLoop = null;

    function toggleRecording() {
        if (!State.power) return;
        State.recording = !State.recording;
        const btn = document.getElementById('btnRecord');
        btn.classList.toggle('active');

        if (State.recording) {
            if (!AudioSys.stream) { log("Pas de signal audio pour enregistrer."); State.recording=false; btn.classList.remove('active'); return; }
            
            Recorder.mediaRecorder = new MediaRecorder(AudioSys.stream);
            Recorder.chunks = [];
            Recorder.mediaRecorder.ondataavailable = e => Recorder.chunks.push(e.data);
            Recorder.mediaRecorder.onstop = saveRecording;
            Recorder.mediaRecorder.start();
            btn.querySelector('.icon').textContent = "⏹️"; // Symbole Stop
            log("Enregistrement EVP démarré.");
            speakSystem("Enregistrement activé.");
        } else {
            Recorder.mediaRecorder.stop();
            btn.querySelector('.icon').textContent = "🔴";
            log("Enregistrement terminé.");
        }
    }

    function saveRecording() {
        const blob = new Blob(Recorder.chunks, { 'type' : 'audio/ogg; codecs=opus' });
        const audioURL = window.URL.createObjectURL(blob);
        const clipName = `EVP_${new Date().toLocaleTimeString('fr-FR')}`;
        
        Recorder.clips.push({ name: clipName, url: audioURL });
        updateEvpList();
        speakSystem("Phénomène sauvegardé.");
    }

    function updateEvpList() {
        const list = document.getElementById('evpList');
        list.innerHTML = "";
        Recorder.clips.forEach((clip, index) => {
            const div = document.createElement('div');
            div.className = 'evp-item';
            div.innerHTML = `<span>${clip.name}</span> <span>▶ PLAY</span>`;
            div.onclick = () => { new Audio(clip.url).play(); };
            list.appendChild(div);
        });
    }

    function toggleEvpLib() {
        document.getElementById('evpLibrary').classList.toggle('open');
    }

    function cleanAudio() {
        // Simule un nettoyage de l'audio (stoppe la parole)
        window.speechSynthesis.cancel();
        UI.liveText.textContent = "AUDIO NETTOYÉ";
        log("Cache audio purgée.");
    }

    function log(msg) {
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.textContent = `> ${msg}`;
        UI.logPanel.prepend(div); // Ajoute au début (flex-direction reverse)
        if (UI.logPanel.children.length > 8) UI.logPanel.lastChild.remove();
    }

    // --- INITIALISATION ---
    window.onload = () => {
        log("Démarrage JARVIS Paranormal v10.3");
        resizeCanvas();
        drawRadar();
        updateHUD();
        
        // Message d'accueil après un court délai
        setTimeout(() => {
            speakSystem("Bonjour. Je suis prêt. Les capteurs sont en veille.");
        }, 1000);
    };

</script>
</body>
</html>
