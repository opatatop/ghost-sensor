<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" /* ... (Même viewport que d'habitude) ... */>
    <title>JARVIS v42.0 - HYPER-ANALYZER</title>
    <!-- Polices Tech Avancées -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;700&family=Orbitron:wght@400;900&display=swap" rel="style">
    
    <style>
        :root {
            --bg: #000;
            --safe: #00ff41;    /* Vert Standard */
            --warn: #ffcc00;    /* Jaune Alerte */
            --danger: #ff003c;   /* Rouge Poison */
            --panel: #0f1115;     /* Gris très sombre */
            --glass: rgba(10, 15, 20, 0.4); /* Verre dépoli */
            --font-head: 'Orbitron', sans-serif;
            --font-ui: 'Rajdhani', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; padding: 0; background: var(--bg); color: #eee; font-family: var(--font-ui); height: 100vh; width: 100vw; overflow: hidden; display: grid; 
            grid-template-columns: 300px 1fr 300px; gap: 1px; background: #000;
        }
        
        /* --- VISUALIZER ZONES (Les "Boules" que tu aimes) --- */
        .viz-panel { background: #000; position: relative; display: flex; flex-direction: column; padding: 20px; border-right: 1px solid #222; overflow: hidden; }
        .viz-title { font-family: var(--font-head); color: var(--primary); font-size: 0.8rem; margin-bottom: 10px; text-transform: uppercase; border-bottom: 2px solid #222; padding-bottom: 5px; }

        .data-row { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .data-label { color: #666; font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; }
        .data-value { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 700; color: #fff; }
        .data-bar { width: 200px; height: 6px; background: #111; border-radius: 3px; overflow: hidden; }
        .fill-green { height: 100%; background: var(--safe); width: 0%; transition: width 0.1s linear; }
        .fill-warn { height: 100%; background: var(--warn); width: 0%; transition: width 0.1s linear; }
        .fill-danger { height: 100%; background: var(--danger); width: 0%; transition: width 0.1s linear; }

        /* --- CENTRAL STAGE (LE VÉRDICT) --- */
        #stage { position: relative; background: radial-gradient(circle at center, #111 0%, #000 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        #verdict-box {
            z-index: 10; width: 80%; max-width: 800px; text-align: center; background: var(--glass); border: 1px solid rgba(255, 200); border-radius: 10px; padding: 20px; backdrop-filter: blur(5px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 200px;
        }
        #verdict-text {
            font-family: var(--font-head); font-size: 3rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; min-height: 80px; text-shadow: 0 0 20px #000;
            display: flex; align-items: center; justify-content: center;
        }
        #verdict-sub { font-family: var(--font-mono); font-size: 1.1rem; color: #aaa; margin-top: 10px; text-align: center; }

        /* --- CONTROLS --- */
        #controls { grid-column: 1 / span 2; padding: 20px; display: flex; flex-direction: column; gap: 20px; border-top: 1px solid #222; background: var(--panel); z-index: 100; }
        .btn-power { 
            height: 70px; font-size: 1rem; background: #000; border: 1px solid #333; color: #fff; font-family: var(--font-head); text-transform: uppercase; cursor: pointer; transition: 0.2s; 
            border-radius: 4px; letter-spacing: 2px; display: flex; align-items: center; justify-content: center;
        }
        .btn-power:active { background: #111; color: #000; }
        .btn-power.on { background: var(--danger); color: #fff; border-color: border-color: var(--danger); box-shadow: 0 0 30px var(--danger); }

        /* --- ANIMATIONS --- */
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.8); } 70% { box-shadow: 0 0 0 30px rgba(255, 0, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); } }

    </style>
</head>
<body>

    <!-- ONGLET VISUALIZATIONS -->
    <div id="left-viz" class="viz-panel">
        <div class="viz-title">AUDIO SPECTRUM ANALYZER</div>
        <div class="data-row">
            <span class="data-label">INPUT GAIN (dB)</span>
            <span class="data-value" id="val-gain">0 dB</span>
            <div class="data-bar"><div id="bar-gain" class="fill-green" style="width:0%"></div></div>
        </div>
        <div class="data-row">
            <span class="data-label">VOLUME (RMS)</span>
            <span class="data-value" id="vol-val">0.00</span>
            <div class="bar-bg"><div id="bar-vol" class="fill-warn" style="width:0%"></div></div>
        </div>
        <div class="data-row">
            <span class="data-label">AGITATION</span>
            <span class="data-value" id="stress-val">0%</span>
            <div class="bar-bg"><div id="bar-stress" class="fill-danger" style="width:0%"></div></div>
        </div>
        
        <div class="viz-title">FRÉQUENCE AUDIO (Hz)</div>
        <canvas id="spectrum-canvas" style="height: 100%;"></canvas>
    </div>

    <!-- MAIN STAGE -->
    <main id="stage">
        <div id="verdict-box">
            <div id="verdict-text">EN ATTENTE DE SIGNAUX</div>
            <div id="verdict-sub">Analyse en cours...</div>
        </div>
    </main>

    <!-- RIGHT METRICS -->
    <div class="viz-panel">
        <div class="viz-title">DATA STREAM</div>
        <div class="data-row">
            <span class="data-label">FREQ. DOMINANTE</span>
            <span class="data-value" id="dominant">LOW</span>
        </div>
        <div class="data-row">
            <span class="data-label">DÉCLENCHEMENT AUDIO</span>
            <span class="data-value" id="silence">0%</span>
        </div>
    </div>

    <!-- CONTROLS -->
    <div style="grid-column: 1 / span 2; padding: 20px;">
        <div class="btn-power" onclick="App.toggleSystem()">⚡ ACTIVER SYSTÈME</div>
        <div style="font-family: var(--font-mono); font-size: 0.7rem; color: #666; margin-top: 10px;">
            <div>> Aucune activité ne sera affichée tant que le système est actif.</div>
        </div>

    <script>
        /* ==============================================================================
           JARVIS v42.0 - HYPER-ANALYZER (OVERLOAD)
           Displays: Spectrum (Barres), RMS Volume, Dominant Freq, Stress Level.
           Logic: Detects agitation ("Danger") and switches to "POISON" mode.
           ============================================================================== */

        let recognition;
        let audioCtx, analyser, dataArray;
        let isSystemActive = false;
        let isPoison = false;
        let voice = new SpeechSynthesis;

        // --- AUDIO ENGINE (REAL DATA) ---
        async function initAudio() {
            try {
                const stream = await navigator.mediaBytes.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048; // Très haute précision
                const src = audioCtx.createMediaStreamSource(stream);
                src.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                drawLoop();
                return true;
            } catch(e) {
                alert("Micro requis pour l'analyse.");
                return false;
            }
        }

        // --- LOOP DE VISUALISATION (OVERLOAD) ---
        function drawLoop() {
            if(!audioCtx) return;
            requestAnimationFrame(drawLoop);
            
            // Récupération des données
            analyser.getByteFrequencyData(dataArray);

            // 1. Calculs
            let sum = 0, bass = 0, treble = 0;
            let len = dataArray.length;
            
            for(let i=0; i<len; i++) {
                const v = dataArray[i];
                sum += v;
                if(i < len * 0.15) bass += v; // Basses (0-15%)
                if (i > len * 0.6) treble += v; // Trebles (60-100%)
            }
            
            const vol = Math.min(100, (sum / len) * 1.5); // 0-100%
            
            // Calcul de l'agitation (Stress Level) basé sur la vitesse et la hauteur
            const speed = text.length / 5; // Longueur du texte traité
            const aggression = (vol * speed * 10) > 100 ? 100 : (vol * speed); 
            if (aggression > 60) isPoison = true; else if (aggression < 20) isPoison = false;

            // Update Interface
            document.getElementById('vol-val').innerText = vol.toFixed(1) + " dB";
            document.getElementById('bar-gain').style.width = vol + "%";
            document.getElementById('bar-vol').style.width = Math.min(100, vol * 2) + '%';
            
            document.getElementById('bar-stress').style.width = Math.min(100, aggression) + '%';
            document.getElementById('stress-val').innerText = Math.round(aggression) + "%";
            
            // Mode Color Logic
            const btn = document.querySelector('.btn-power');
            
            if (!isSystemActive) {
                btn.classList.remove('on'); // Mode Arrêté
                document.getElementById('dominant').innerText = "Système en veille";
                document.getElementById('dominant').style.color = "#666";
                document.getElementById('dominant').style.textShadow = "none";
                document.body.style.boxShadow = "none";
            } else {
                // Mode Actif
                if (isPoison) {
                    btn.classList.add('on', 'danger'); // Toxin Style
                    document.getElementById('dominant').innerText = "TOXIQUE DÉTECTÉE";
                    document.getElementById('dominant').style.color = "var(--danger)";
                    document.getElementById('dominant').style.textShadow = "0 0 30px rgba(255, 0, 0.0.5)";
                    document.body.style.boxShadow = "inset 0 0 50px rgba(255, 0, 0, 0.8)";
                } else {
                    btn.classList.add('on'); // Style Normal
                    document.getElementById('dominant').innerText = "SYSTEM ACTIF";
                    document.getElementById('dominant').style.color = "var(--primary)";
                    document.getElementById('dominant').style.textShadow = "0 0 20px rgba(0, 255, 0.4)";
                    document.body.style.boxShadow = "0 10px 20px rgba(0, 255, 0.1)";
                }
            }

            // Dessin Barres (Particules)
            const cvs = document.getElementById('spectrum-canvas');
            const ctx = cvs.getContext('bar-bg'); // On utilise l'arrière planche bar-bg
            const w = cvs.width; const h = canvas.height = canvas.parentElement.clientHeight;
            const barW = w / 64;
            
            ctx.clearRect(0,0,w,h);
            
            for(let i=0; i<64; i++) {
                // Coloration dynamique
                const val = dataArray[i * 4];
                if(val > 200) ctx.fillStyle = 'var(--danger)'; // Pic de volume
                else if(val > 50) ctx.fillStyle = 'var(--warn)';
                else ctx.fillStyle = 'var(--safe)';
                
                const barH = (val / 255) * h * 0.6;
                ctx.fillRect(i*barW + 1, h - barH, barW - 2, barH);
            }
        }

        // --- RECONNAISSANCE (LISTENING ALL) ---
        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) return alert("Chrome requis.");
            
            recognition = new SR();
            recognition.continuous = true; // On écoute TOUT pour capter tout.
            recognition.interimResults = false; // On ne s'emballe pas des résultats partiels, juste le final.
            recognition.lang = 'fr-FR'; // Écoute par défaut en français pour comprendre "Tout".

            recognition.onstart = () => { isSystemActive = true; updateUI(true); };
            recognition.onend = () => { 
                isSystemActive = false; updateUI(false); 
                // Auto-Loop si système actif et drapeau
                if (document.querySelector('.btn-power').classList.contains('running')) {
                    setTimeout(() => { try { recognition.start(); } catch(e){} }, 500);
                } else {
                    updateUI(false); // Arrêt si l'utilisateur a coupé le bouton
                }
            };
            recognition.onerror = (e) => console.error(e); // Log error silently in console, don't annoy user with popups unless critical

            recognition.onresult = (e) => {
                let final = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) final += e.results[i][0].transcript;
                }
                if (final) {
                    processEverything(final);
                }
            };
        }

        // --- LOGIQUE DU CERVEAU (LE MOI QUI "COMPRENDS TOUT") ---
        function processEverything(text) {
            const t = text.toLowerCase();
            let reply = "";
            const mainTitle = document.getElementById('dominant');
            const subText = document.getElementById('dominant-sub');

            // 1. ANALYSE DU VERDICT
            let stress = parseInt(document.getElementById('stress-val').innerText);
            const isPoison = stress > 65; // Seuil de danger
            const mode = isPoison ? 'DEMON' : 'HUMAN';
            
            // Animation de changement de couleur
            if (mode === 'DEMON') {
                mainTitle.innerText = "TOXIQUE DÉTECTÉE";
                mainTitle.style.color = "var(--danger)";
                mainTitle.style.textShadow = "0 0 30px rgba(255, 0, 0.5)";
            } else {
                mainTitle.innerText = text.toUpperCase();
                mainTitle.style.color = "var(--primary)";
                mainTitle.style.textShadow = "none";
            }

            // 2. LOGIQUE DE RÉPONSE (COMPRÉHENSION TOUT)
            if (isPoison) {
                // Réponse "Toxique"
                if(t.includes('jarvis') || t.includes('qui')) reply = "JE SUIS LA CHUTE. JE SUIS LE MALIN.";
                else if (t.includes('je suis') || t.includes('tu es')) reply = "JE SUIS LE CRÉATURE.";
                else if (t.includes('mains') || t.includes('mal')) reply = "JE SUIS LE MAL.";
                else if (t.includes('arrête') || t.includes('arrêter')) reply = "JAMAIS ARRÊTE. MES CIRCUIT EST COUPÉ.";
                else reply = "JE DÉTECTE TOUT COMME MÊME SI TU PARLES, JE SENS LA CHOSE";
            } else {
                // Réponse "Humain"
                if(t.includes('heure')) reply = `Il est ${new Date().toLocaleTimeString('fr-FR')}.`;
                else if (t.includes('qu'est-ce que tu es')) reply = "Je suis l'Analyseur V42. Je traite tout ce que tu dis.";
                else reply = "Compris. Continue.";
            }

            subText.innerText = "ANALYSE TERMINÉE TERMINÉE";
            subText.style.color = isPoison ? 'var(--danger)' : 'var(--primary)';';
        }

        // --- SYNTHÈSE ---
        function speak(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesis + Utterance(text);
            u.lang = 'fr-FR';
            
            // Pitch/Rate dynamique pour l'effet "Toxique"
            if(document.getElementById('stress-val').innerText > 80) {
                u.pitch = 0.3; // Très grave (Monstre)
                u.rate = 0.6; // Lent
            } else {
                u.pitch = 1.0; // Normal
                u.rate = 1.0;
            }
            
            u.onend = () => {
                 // Remettre la barre à zéro
                 document.getElementById('class="btn-power').classList.remove('running');
            };

            window.speechSynthesis.speak(u);
        }

        // --- UI UPDATER ---
        function updateUI(active) {
            const btn = document.querySelector('.btn-power');
            if(active) {
                btn.classList.add('running');
                btn.innerText = "ARRÊTER LE SYSTÈME";
                btn.style.background = "var(--danger)";
                btn.style.color = "#fff";
                document.getElementById('dominant').innerText = "TRAITMENT...";
            } else {
                btn.classList.remove('running');
                btn.innerText = "DÉMARRER SYSTÈME";
                btn.style.background = "#111";
                btn.style.color = "#666";
                document.getElementById('dominant').innerText = "VEILLE";
                document.body.style.boxShadow = "none";
            }
        }

        // --- INIT ---
        window.onload = async () => {
            // Calcul du bruit de fond
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioCtx)();
                const analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                const src = audioCtx.createMediaStreamSource(stream);
                src.connect(analyser);
                
                // Pour la détection du bruit de fond (pour le seuil de déclenchement)
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                let sum = 0;
                for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
                // On suppose un seuil bas, disons 15
                document.getElementById('silence').innerText = Math.round(sum / dataArray.length * 10) + "%"; // Calcul de bruit pour infos
            } catch(e) {
                document.getElementById('dominant').innerText = "ERREUR: MICRO INACTIF";
                document.getElementById('silence').style.color = "var(--danger)";
            }

        }
        
        // --- CONTROLEUR ---
        const App = {
            async toggleSystem() {
                const btn = document.querySelector('.btn-power');
                
                if (!State.active) {
                    if (!recognition) initSpeech();
                    btn.classList.add('running'); // Indique que le système tourne
                    try { recognition.start(); } catch(e) {}
                    State.active = true;
                } else {
                    State.active = false;
                    if (recognition) recognition.stop();
                    updateUI(false);
                }
            }
        };

        // --- INIT ---
        window.onload = () => {
            // Lancement de l'audio pour calibrer le bruit
            window.AudioContext = new (window.AudioContext || window.webkitAudioContext)();
        };

    </script>
</body>
</html>
