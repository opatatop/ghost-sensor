<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SUPRA LAB v11 — FULL SPECTRUM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root { --green: #00ff41; --red: #ff0044; --bg-dark: #001100; --bg-darker: #000; }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: var(--bg-darker);
            color: var(--green);
            font-family: 'VT323', monospace;
            font-size: 18px;
            line-height: 1.4;
            min-height: 100vh;
            overflow-y: auto;
            touch-action: manipulation;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(to bottom, rgba(0,255,65,0.04) 0px, rgba(0,255,65,0.04) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            z-index: 9999;
        }

        header {
            background: var(--bg-dark);
            border-bottom: 6px solid var(--green);
            padding: 15px;
            text-align: center;
            font-size: 26px;
            text-shadow: 0 0 15px var(--green);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        #main {
            display: none;
            padding: 12px;
            gap: 14px;
            flex-direction: column;
        }

        .panel {
            background: var(--bg-dark);
            border: 4px solid var(--green);
            box-shadow: 0 0 30px var(--green);
            padding: 12px;
            position: relative;
            min-height: 230px;
        }

        .panel-header {
            position: absolute;
            top: -14px;
            left: 18px;
            background: var(--bg-dark);
            padding: 0 14px;
            font-size: 18px;
            z-index: 10;
        }

        canvas {
            width: 100% !important;
            height: 200px !important;
            background: #000;
        }

        #log {
            min-height: 340px;
            max-height: 460px;
            overflow-y: auto !important;
            background: rgba(0,25,0,0.95);
            padding: 15px;
            font-size: 17px;
            border: 3px solid var(--green);
        }

        .log-line { white-space: pre-wrap; margin-bottom: 6px; }
        .log-line::before { content: "> "; color: #00cc33; }

        .btn {
            background: transparent;
            color: var(--green);
            border: 4px solid var(--green);
            padding: 12px 28px;
            font-size: 21px;
            cursor: pointer;
        }
        .btn:hover { background: var(--green); color: #000; }

        .floating-btn {
            position: fixed;
            right: 15px;
            z-index: 300;
            padding: 12px 18px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- SETTINGS -->
    <div id="settings-page" style="display:none;position:fixed;inset:0;background:var(--bg-darker);z-index:10001;padding:20px;overflow-y:auto;border:8px solid var(--green);">
        <button id="closeSettings" style="position:absolute;top:15px;right:15px;font-size:32px;background:none;border:none;color:var(--green);">✕</button>
        <div style="text-align:center;font-size:26px;margin-bottom:25px;">⚙️ PARAMÈTRES</div>
        
        <div>
            <h3>🔑 Clé API Groq</h3>
            <input type="text" id="groqApiKey" placeholder="gsk_xxxxxxxxxxxxxxxx" style="width:100%;padding:12px;font-size:17px;">
        </div>

        <div style="text-align:center;margin-top:40px;">
            <button class="btn" id="saveSettings">💾 Sauvegarder Clé</button>
        </div>
    </div>

    <!-- START -->
    <div id="start-screen">
        <div style="text-align:center;margin-bottom:50px;font-size:28px;">
            SUPRA LAB v11<br>
            FULL SPECTRUM + IA GROQ
        </div>
        <button id="btnStart" class="btn" style="padding:30px 90px;font-size:38px;">LANCER LE SYSTÈME</button>
        <button id="btnSettings" class="btn" style="margin-top:25px;">⚙️ PARAMÈTRES</button>
        <button id="btnStartIA" class="btn" style="margin-top:25px;">🎤 ACTIVER IA VOCALE</button>
    </div>

    <!-- MAIN -->
    <div id="main">
        <header>SUPRA LAB v11 — FULL SPECTRUM</header>

        <div class="panel">
            <div class="panel-header">SPECTROGRAMME</div>
            <canvas id="spectrogram"></canvas>
        </div>

        <div class="panel">
            <div class="panel-header">OSCILLOSCOPE</div>
            <canvas id="scope"></canvas>
        </div>

        <div class="panel">
            <div class="panel-header">LOG + IA GROQ</div>
            <div id="log"></div>
        </div>
    </div>

    <!-- Floating buttons -->
    <button class="floating-btn btn" id="btnNightVision">🌙 NIGHT VISION</button>
    <button class="floating-btn btn" id="btnAnalyzeNow">📡 ANALYSE IA</button>

    <script>
        let config = { groqApiKey: "" };
        let audioCtx, analyser, microphone;
        let frequencyArray = new Uint8Array(2048);
        let isRunning = false;
        let recognition = null;

        function log(text, important = false) {
            const logDiv = document.getElementById('log');
            const line = document.createElement('div');
            line.className = 'log-line' + (important ? ' alert-critical' : '');
            line.innerHTML = `<span style="color:#00cc33">[${new Date().toLocaleTimeString('fr-FR')}]</span> ${text}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true } 
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                await audioCtx.resume();

                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 4096;
                frequencyArray = new Uint8Array(analyser.frequencyBinCount);

                isRunning = true;
                requestAnimationFrame(loop);

                log("[AUDIO] Micro activé avec succès");
            } catch (err) {
                log("[ERREUR] Permission micro refusée ou problème technique", true);
                console.error(err);
            }
        }

        function loop() {
            if (!isRunning || !analyser) return;
            analyser.getByteFrequencyData(frequencyArray);
            requestAnimationFrame(loop);
        }

        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                log("[ERREUR] Reconnaissance vocale non supportée sur ce navigateur", true);
                return;
            }

            recognition = new SR();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'fr-FR';

            recognition.onresult = (e) => {
                const transcript = e.results[e.results.length-1][0].transcript.trim();
                log(`[VOIX] "${transcript}"`, true);

                if (transcript.toLowerCase().includes("supra")) {
                    log("[COMMANDE] Analyse Groq lancée...", true);
                    analyzeWithGroq();
                }
            };

            recognition.onerror = (e) => log(`[IA ERREUR] ${e.error}`, true);
            recognition.onend = () => setTimeout(() => recognition.start(), 800);

            recognition.start();
            log("[IA VOCALE] Écoute activée - Dis 'Supra' pour tester", true);
        }

        async function analyzeWithGroq() {
            if (!config.groqApiKey) {
                log("[GROQ] Aucune clé API configurée !", true);
                return;
            }

            log("[GROQ] Envoi de la requête...", true);

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${config.groqApiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: "Analyse ce signal SIGINT en mode militaire." }],
                        temperature: 0.7,
                        max_tokens: 300
                    })
                });

                const data = await res.json();
                const answer = data.choices?.[0]?.message?.content || "Pas de réponse";
                log(`[SUPRA IA] ${answer}`, true);
            } catch (e) {
                log(`[GROQ ERREUR] ${e.message}`, true);
            }
        }

        // ==================== DÉMARRAGE ====================
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnStart').addEventListener('click', async () => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main').style.display = 'flex';

                log("=== SUPRA LAB v11 DÉMARRÉ ===", true);
                await initAudio();
            });

            document.getElementById('btnStartIA').addEventListener('click', initSpeech);
            document.getElementById('btnNightVision').addEventListener('click', () => {
                document.body.classList.toggle('night-vision');
            });
            document.getElementById('btnAnalyzeNow').addEventListener('click', analyzeWithGroq);

            document.getElementById('btnSettings').addEventListener('click', () => {
                document.getElementById('settings-page').style.display = 'block';
            });
            document.getElementById('closeSettings').addEventListener('click', () => {
                document.getElementById('settings-page').style.display = 'none';
            });

            document.getElementById('saveSettings').addEventListener('click', () => {
                config.groqApiKey = document.getElementById('groqApiKey').value.trim();
                localStorage.setItem('supraLabConfig', JSON.stringify(config));
                log("[OK] Clé Groq sauvegardée", true);
                document.getElementById('settings-page').style.display = 'none';
            });
        });
    </script>
</body>
</html>
