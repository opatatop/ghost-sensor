<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPATATOP AI - Alertes Vocales Complètes</title>
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #ff00ff;
            --bg: #000;
            --panel: #111;
            --text: #fff;
            --danger: #ff5555;
            --accent: #ffff00;
            --sonar: #00ffff;
            --detect: #ff0000;
            --highlight: #00ccff;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: linear-gradient(to right, #000, #111);
            border-bottom: 3px solid var(--primary);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 1.3rem;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
            letter-spacing: 2px;
            margin: 0;
            font-weight: bold;
        }
        main {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #visualizer {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at center, #000 0%, #111 100%);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #displayOverlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            width: 90%;
        }
        #mainText {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--primary);
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border: 2px solid var(--primary);
            border-radius: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--primary);
            margin-bottom: 8px;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }
        #subText {
            font-size: 0.9rem;
            color: var(--accent);
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border: 1px solid var(--accent);
            border-radius: 5px;
            text-shadow: 0 0 5px var(--accent);
        }
        #hud {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 14px;
            border: 1px solid var(--primary);
            border-radius: 5px;
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--primary);
            z-index: 25;
        }
        #actionGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
            gap: 8px;
            padding: 12px;
            background: var(--panel);
            border-top: 1px solid #222;
        }
        .grid-btn {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #ccc;
            padding: 8px 3px;
            border-radius: 5px;
            text-align: center;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .grid-btn:active {
            transform: scale(0.95);
        }
        .grid-btn.active-state {
            background: var(--secondary);
            color: #000;
            border-color: #000;
            box-shadow: 0 0 12px rgba(255, 0, 255, 0.7);
            animation: pulseBtn 2s infinite;
        }
        #controls {
            background: var(--panel);
            padding: 12px;
            display: grid;
            gap: 8px;
        }
        #terminal {
            height: 90px;
            background: #000;
            border-top: 1px solid #333;
            padding: 6px;
            font-size: 0.6rem;
            overflow-y: auto;
            color: #aaa;
            line-height: 1.3;
            font-family: monospace;
        }
        .log-line {
            margin-bottom: 4px;
            border-left: 2px solid #555;
            padding-left: 6px;
        }
        #translationOverlay {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            color: var(--text);
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 18px;
            border: 2px solid var(--primary);
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 0.9rem;
            font-weight: bold;
        }
        #liveTranslation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            color: var(--sonar);
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border: 2px solid var(--sonar);
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 1.1rem;
            font-weight: bold;
        }
        #detectionAlert {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--detect);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border: 2px solid var(--detect);
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 1rem;
            font-weight: bold;
            display: none;
            animation: alertPulse 1s infinite, alertGlow 2s infinite alternate;
        }
    </style>
</head>
<body>
    <header>
        <h1>OPATATOP AI - ALERTES VOCALES</h1>
    </header>
    <main>
        <div id="visualizer">
            <canvas id="scopeCanvas"></canvas>
            <div id="detectionAlert">ALERTE PARANORMALE</div>
            <div id="displayOverlay">
                <div id="mainText">ALERTES VOCALES ACTIVÉES</div>
                <div id="subText">TOUTES FONCTIONS ACTIVÉES</div>
            </div>
            <div id="translationOverlay">TRADUCTION: --</div>
            <div id="liveTranslation">--</div>
            <div id="hud">NIVEAU: 0%<br>FRÉQ.: 0 Hz<br>DÉTECTION: 0<br>TEMP: 0°C</div>
        </div>
    </main>
    <div id="actionGrid">
        <div class="grid-btn active-state" id="btnPower" onclick="FeatureEngine.togglePower()"><span class="grid-icon">⚡</span><span>POWER</span></div>
        <div class="grid-btn active-state" id="btnDetect" onclick="FeatureEngine.toggleDetection()"><span class="grid-icon">🔍</span><span>SONAR</span></div>
        <div class="grid-btn active-state" id="btnGhost" onclick="FeatureEngine.toggleGhostDetection()"><span class="grid-icon">👻</span><span>DETECT</span></div>
        <div class="grid-btn active-state" id="btnVAD" onclick="FeatureEngine.toggleVAD()"><span class="grid-icon">🎤</span><span>VAD</span></div>
        <div class="grid-btn active-state" id="btnSensors" onclick="FeatureEngine.toggleSensors()"><span class="grid-icon">📡</span><span>CAPTEURS</span></div>
        <div class="grid-btn active-state" id="btnRecord" onclick="FeatureEngine.toggleAutoRecord()"><span class="grid-icon">📼</span><span>ENREG.</span></div>
        <div class="grid-btn active-state" id="btnEMF" onclick="FeatureEngine.toggleEMF()"><span class="grid-icon">📏</span><span>EMF</span></div>
        <div class="grid-btn active-state" id="btnTemp" onclick="FeatureEngine.toggleTemp()"><span class="grid-icon">🌡️</span><span>TEMP</span></div>
    </div>
    <div id="terminal"></div>
    <script>
        // Configuration
        const Config = {
            data: {
                colorMode: 'dark'
            },
            colorModes: {
                dark: {
                    primary: '#00ff88',
                    secondary: '#ff00ff',
                    bg: '#000',
                    panel: '#111',
                    text: '#fff',
                    sonar: '#00ffff',
                    detect: '#ff0000',
                    highlight: '#00ccff'
                }
            },
            applyColorMode() {
                const mode = this.colorModes[this.data.colorMode];
                document.documentElement.style.setProperty('--primary', mode.primary);
                document.documentElement.style.setProperty('--secondary', mode.secondary);
                document.documentElement.style.setProperty('--bg', mode.bg);
                document.documentElement.style.setProperty('--panel', mode.panel);
                document.documentElement.style.setProperty('--text', mode.text);
                document.documentElement.style.setProperty('--sonar', mode.sonar);
                document.documentElement.style.setProperty('--detect', mode.detect);
                document.documentElement.style.setProperty('--highlight', mode.highlight);
            }
        };

        // Audio Engine
        const AudioEngine = {
            ctx: null,
            stream: null,
            analyser: null,
            isInit: false,
            async init() {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    this.stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        }
                    });
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 2048;
                    this.ctx.createMediaStreamSource(this.stream).connect(this.analyser);
                    this.isInit = true;
                    return true;
                } catch (e) {
                    console.error("Erreur audio:", e);
                    return false;
                }
            },
            getRMS() {
                if (!this.analyser) return 0;
                const data = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(data);
                let sum = 0;
                for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
                return Math.sqrt(sum / data.length) / 128;
            },
            destroy() {
                if (this.stream) this.stream.getTracks().forEach(t => t.stop());
                if (this.ctx) this.ctx.close();
                this.isInit = false;
            }
        };

        // Speech Synthesis Engine
        const SpeechEngine = {
            synthesis: window.speechSynthesis,
            voice: null,
            init() {
                const voices = this.synthesis.getVoices();
                this.voice = voices.find(v => v.lang === 'fr-FR') || voices[0];
                window.speechSynthesis.onvoiceschanged = () => {
                    const voices = this.synthesis.getVoices();
                    this.voice = voices.find(v => v.lang === 'fr-FR') || voices[0];
                };
            },
            speak(text) {
                this.synthesis.cancel();
                if (!text) return;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.pitch = 1.0;
                utterance.rate = 1.0;
                if (this.voice) utterance.voice = this.voice;
                this.synthesis.speak(utterance);
            }
        };

        // Visual Engine
        const VisualEngine = {
            canvas: null,
            ctx: null,
            animId: null,
            isRunning: false,
            init() {
                this.canvas = document.getElementById('scopeCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
            },
            resize() {
                if (this.canvas) {
                    this.canvas.width = this.canvas.parentElement.clientWidth;
                    this.canvas.height = this.canvas.parentElement.clientHeight;
                }
            },
            start() {
                if (!this.isRunning) {
                    this.isRunning = true;
                    this.loop();
                }
            },
            stop() {
                this.isRunning = false;
                if (this.animId) cancelAnimationFrame(this.animId);
            },
            loop() {
                if (!this.isRunning) return;
                const w = this.canvas.width, h = this.canvas.height;
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, w, h);

                // Draw radar grid
                this.ctx.save();
                this.ctx.translate(w/2, h/2);
                this.ctx.strokeStyle = '#00ff8833';
                this.ctx.lineWidth = 1;
                for (let r = 30; r <= Math.min(w, h)/2; r += 30) {
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, r, 0, Math.PI * 2);
                    this.ctx.stroke();
                }
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 12) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, 0);
                    this.ctx.lineTo(Math.cos(a) * Math.min(w, h)/2, Math.sin(a) * Math.min(w, h)/2);
                    this.ctx.stroke();
                }
                this.ctx.restore();

                // Draw radar sweep
                const angle = Date.now() / 1000 * Math.PI / 4;
                this.ctx.save();
                this.ctx.translate(w/2, h/2);
                this.ctx.strokeStyle = '#00ff88';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.moveTo(0, 0);
                this.ctx.lineTo(Math.cos(angle) * Math.min(w, h)/2, Math.sin(angle) * Math.min(w, h)/2);
                this.ctx.stroke();
                this.ctx.restore();

                // Update HUD with real audio data
                const rms = AudioEngine.isInit ? AudioEngine.getRMS() * 100 : 0;
                document.getElementById('hud').innerHTML =
                    `NIVEAU: ${rms.toFixed(1)}%<br>` +
                    `FRÉQ.: ${Math.floor(Math.random() * 1000)} Hz<br>` +
                    `DÉTECTION: ${Math.floor(Math.random() * 100)}%<br>` +
                    `TEMP: ${(20 + Math.random() * 5).toFixed(1)}°C`;

                this.animId = requestAnimationFrame(() => this.loop());
            }
        };

        // Feature Engine with vocal alerts
        const FeatureEngine = {
            power: true,
            detection: true,
            ghostDetection: true,
            vad: true,
            sensorsActive: true,
            autoRecord: true,
            emfActive: true,
            tempActive: true,
            togglePower() {
                this.power = !this.power;
                document.getElementById('btnPower').classList.toggle('active-state');
                const msg = this.power ? "Système activé" : "Système désactivé";
                App.log(msg);
                SpeechEngine.speak(msg);
            },
            toggleDetection() {
                this.detection = !this.detection;
                document.getElementById('btnDetect').classList.toggle('active-state');
                const msg = this.detection ? "Détection sonar activée" : "Détection sonar désactivée";
                App.log(msg);
                SpeechEngine.speak(msg);
            },
            toggleGhostDetection() {
                this.ghostDetection = !this.ghostDetection;
                document.getElementById('btnGhost').classList.toggle('active-state');
                const msg = this.ghostDetection ? "Détection de fantômes activée" : "Détection de fantômes désactivée";
                App.log(msg);
                SpeechEngine.speak(msg);
            },
            toggleVAD() {
                this.vad = !this.vad;
                document.getElementById('btnVAD').classList.toggle('active-state');
                const msg = this.vad ? "Détection vocale activée" : "Détection vocale désactivée";
                App.log(msg);
                SpeechEngine.speak(msg);
            },
            toggleSensors() {
                this.sensorsActive = !this.sensorsActive;
                document.getElementById('btnSensors').classList.toggle('active-state');
                const msg = this.sensorsActive ? "Capteurs activés" : "Capteurs désactivés";
                App.log(msg);
                SpeechEngine.speak(msg);
            },
            toggleAutoRecord() {
                this.autoRecord = !this.autoRecord;
                document.getElementById('btnRecord').classList.toggle('active-state');
                const msg = this.autoRecord ? "Enregistrement automatique activé" : "Enregistrement automatique désactivé";
                App.log(msg);
                SpeechEngine.speak(msg);
            },
            toggleEMF() {
                this.emfActive = !this.emfActive;
                document.getElementById('btnEMF').classList.toggle('active-state');
                const msg = this.emfActive ? "Détection EMF activée" : "Détection EMF désactivée";
                App.log(msg);
                SpeechEngine.speak(msg);
            },
            toggleTemp() {
                this.tempActive = !this.tempActive;
                document.getElementById('btnTemp').classList.toggle('active-state');
                const msg = this.tempActive ? "Détection de température activée" : "Détection de température désactivée";
                App.log(msg);
                SpeechEngine.speak(msg);
            }
        };

        // Main Application
        const App = {
            isRunning: false,
            async init() {
                Config.applyColorMode();
                SpeechEngine.init();
                VisualEngine.init();
                await AudioEngine.init();
                VisualEngine.start();
                this.isRunning = true;
                this.log("Système démarré - Toutes fonctions activées");
                SpeechEngine.speak("Toutes fonctions activées. Système prêt.");
            },
            log(msg) {
                const t = document.getElementById('terminal');
                const d = document.createElement('div');
                d.className = 'log-line';
                d.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
                t.appendChild(d);
                t.scrollTop = t.scrollHeight;
            }
        };

        // Initialize when loaded
        window.onload = () => App.init();

        // Add event listeners for voice commands
        document.querySelectorAll('.grid-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Play a sound when button is clicked
                const audio = new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU...');
                audio.play();
            });
        });
    </script>
</body>
</html>
