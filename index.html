<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUPRA AI v10.0 // ULTIMATE</title>
<style>
    :root {
        /* THEME PAR DÉFAUT (CYBER) */
        --bg-color: #020205;
        --primary: #00f3ff;
        --secondary: #bc13fe;
        --danger: #ff2a2a;
        --success: #00ff41;
        --text-color: #e0e0e0;
        --panel-bg: rgba(10, 15, 20, 0.95);
        --font-main: 'Courier New', Courier, monospace;
    }

    /* THEMES */
    body.theme-matrix {
        --primary: #00ff41; --secondary: #008f11; --bg-color: #001100;
    }
    body.theme-inferno {
        --primary: #ffaa00; --secondary: #ff4400; --bg-color: #110500;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
    
    body {
        margin: 0; background-color: var(--bg-color); color: var(--text-color);
        font-family: var(--font-main); overflow: hidden; height: 100vh;
        display: flex; flex-direction: column; border-top: 2px solid var(--primary);
        transition: background-color 0.5s;
    }

    /* CRT EFFECT */
    body::after {
        content: " "; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 999; opacity: 0; transition: opacity 0.3s;
    }
    body.crt-on::after { opacity: 0.4; }

    /* HEADER */
    header {
        position: relative; z-index: 10; height: 70px;
        background: var(--panel-bg); border-bottom: 1px solid var(--primary);
        display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
    }

    .brand { font-size: 1.1rem; font-weight: 900; color: var(--primary); letter-spacing: 3px; text-transform: uppercase; display: flex; flex-direction: column; line-height: 1; }
    .brand span { font-size: 0.6rem; color: #666; letter-spacing: 1px; margin-top: 2px; }
    
    .status-indicator {
        font-size: 0.8rem; color: #fff; background: #111; padding: 5px 10px; border: 1px solid #333;
        text-transform: uppercase; letter-spacing: 1px; min-width: 120px; text-align: center; transition: 0.3s;
    }
    .status-indicator.active { border-color: var(--secondary); color: var(--secondary); box-shadow: 0 0 10px var(--secondary); }
    .status-indicator.listening { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 10px var(--primary); }

    .controls { display: flex; gap: 8px; align-items: center; }

    button {
        background: rgba(0,0,0,0.6); border: 1px solid #444; color: #ccc;
        padding: 8px 12px; font-family: var(--font-main); font-weight: bold; font-size: 0.7rem;
        cursor: pointer; transition: 0.2s; text-transform: uppercase;
    }
    button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    
    #btnPrivacy.privacy-on { border-color: var(--danger); color: var(--danger); background: rgba(255, 42, 42, 0.1); animation: blinkRed 1s infinite; }
    
    /* CANVAS */
    #canvas-container { flex-grow: 1; position: relative; z-index: 1; overflow: hidden; background: radial-gradient(circle at center, #08080c 0%, #000 100%); }
    canvas { display: block; width: 100%; height: 100%; }

    /* TERMINAL */
    #terminal {
        height: 130px; background: rgba(0, 0, 0, 0.95); border-top: 1px solid var(--primary);
        padding: 8px 15px; font-size: 11px; overflow-y: auto; z-index: 10;
        scrollbar-width: thin; scrollbar-color: var(--primary) #000; font-family: 'Consolas', monospace;
    }
    .log-line { margin-bottom: 2px; padding-left: 8px; opacity: 0; animation: slideIn 0.2s forwards; display: flex; gap: 8px;}
    .log-time { color: #444; min-width: 65px; }
    .log-msg { color: #aaa; }
    .log-sys { color: #555; }
    .log-wake { color: var(--secondary); font-weight: bold; text-shadow: 0 0 5px var(--secondary); }
    @keyframes slideIn { from { opacity:0; transform:translateX(-5px); } to { opacity:1; transform:translateX(0); } }

    /* --- SETTINGS MODAL (ADVANCED) --- */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
    .modal-box { background: #0f0f13; border: 1px solid var(--primary); padding: 0; width: 100%; max-width: 500px; box-shadow: 0 0 30px rgba(0, 243, 255, 0.15); display: flex; flex-direction: column; height: 80vh; }
    
    /* TABS */
    .tabs { display: flex; border-bottom: 1px solid #333; }
    .tab-btn { flex: 1; padding: 15px; background: #111; color: #666; border: none; cursor: pointer; font-family: var(--font-main); font-weight: bold; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: var(--primary); background: #0a0a0a; border-bottom: 2px solid var(--primary); }
    
    /* TAB CONTENT */
    .tab-content { padding: 20px; overflow-y: auto; flex-grow: 1; display: none; }
    .tab-content.active { display: block; }
    
    /* FORM ELEMENTS */
    .setting-group { margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 15px; }
    .setting-group:last-child { border-bottom: none; }
    .label { display: block; color: #888; font-size: 0.8rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    
    input[type="text"], select {
        width: 100%; background: #000; border: 1px solid #333; color: var(--primary);
        padding: 10px; font-family: monospace; margin-bottom: 10px;
    }
    input[type="range"] { width: 100%; accent-color: var(--primary); }
    
    .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    
    .save-bar { padding: 15px; border-top: 1px solid #333; display: flex; justify-content: flex-end; gap: 10px; background: #0a0a0a; }
    
    /* BOOT OVERLAY */
    #boot-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #000; z-index: 2000; display: flex; flex-direction: column;
        justify-content: center; align-items: center; color: var(--primary);
    }
    .start-btn {
        margin-top: 30px; padding: 15px 40px; background: var(--primary); color: #000;
        border: none; font-family: var(--font-main); font-weight: bold; font-size: 1.2rem;
        cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
        box-shadow: 0 0 20px var(--primary); transition: 0.3s;
    }
    .start-btn:hover { transform: scale(1.05); box-shadow: 0 0 40px var(--primary); }

    @keyframes blinkRed { 0% { box-shadow: 0 0 5px var(--danger); } 50% { box-shadow: 0 0 15px var(--danger); } 100% { box-shadow: 0 0 5px var(--danger); } }
</style>
</head>
<body class="crt-on">

<div id="boot-overlay">
    <h1 style="letter-spacing:5px; margin:0;">SUPRA ULTIMATE</h1>
    <div style="font-size:0.8rem; color:#666; margin-top:5px;">CHARGEMENT SYSTÈME v10.0</div>
    <button class="start-btn" onclick="app.manualBoot()">DÉMARRER</button>
</div>

<header>
    <div class="brand">SUPRA <span>ULTIMATE</span></div>
    <div id="statusDisplay" class="status-indicator">VEILLE</div>
    <div class="controls">
        <button id="btnPrivacy">🔒 PRIVACY</button>
        <button id="btnConfig">⚙️ OPTIONS</button>
    </div>
</header>

<div id="canvas-container">
    <canvas id="canvas"></canvas>
</div>

<div id="terminal"></div>

<!-- SETTINGS MODAL -->
<div id="config-modal" class="modal">
    <div class="modal-box">
        <div class="tabs">
            <button class="tab-btn active" onclick="ui.switchTab('tab-detect')">DÉTECTION</button>
            <button class="tab-btn" onclick="ui.switchTab('tab-voice')">VOIX</button>
            <button class="tab-btn" onclick="ui.switchTab('tab-visual')">VISUEL</button>
            <button class="tab-btn" onclick="ui.switchTab('tab-sys')">SYSTÈME</button>
        </div>

        <!-- TAB: DETECTION -->
        <div id="tab-detect" class="tab-content active">
            <div class="setting-group">
                <label class="label">Mots de Réveil (Séparés par virgule)</label>
                <input type="text" id="set-wakewords" placeholder="ex: supra, système, jarvis">
                <div style="font-size:0.7rem; color:#555;">L'IA réagira uniquement si l'une de ces phrases est détectée.</div>
            </div>
            <div class="setting-group">
                <label class="label">Sensibilité (Simulation)</label>
                <div class="toggle-row">
                    <span>Mode Strict (Début de phrase)</span>
                    <input type="checkbox" id="set-strict" checked>
                </div>
            </div>
        </div>

        <!-- TAB: VOICE -->
        <div id="tab-voice" class="tab-content">
            <div class="setting-group">
                <label class="label">Voix Synthétisée</label>
                <select id="set-voiceuri"><option value="">Chargement...</option></select>
            </div>
            <div class="setting-group">
                <label class="label">Vitesse: <span id="val-rate">1.1</span>x</label>
                <input type="range" id="set-rate" min="0.5" max="2" step="0.1" value="1.1" oninput="document.getElementById('val-rate').innerText=this.value">
            </div>
            <div class="setting-group">
                <label class="label">Ton (Grave/Aigu): <span id="val-pitch">1.0</span></label>
                <input type="range" id="set-pitch" min="0.5" max="2" step="0.1" value="1.0" oninput="document.getElementById('val-pitch').innerText=this.value">
            </div>
        </div>

        <!-- TAB: VISUAL -->
        <div id="tab-visual" class="tab-content">
            <div class="setting-group">
                <label class="label">Thème Couleur</label>
                <select id="set-theme">
                    <option value="cyber">Cyberpunk (Cyan/Violet)</option>
                    <option value="matrix">Matrix (Vert/Noir)</option>
                    <option value="inferno">Inferno (Orange/Rouge)</option>
                </select>
            </div>
            <div class="setting-group">
                <div class="toggle-row">
                    <span>Effet CRT (Lignes de balayage)</span>
                    <input type="checkbox" id="set-crt" checked>
                </div>
            </div>
            <div class="setting-group">
                <div class="toggle-row">
                    <span>Animation Arrière-Plan (Gourmand en CPU)</span>
                    <input type="checkbox" id="set-particles" checked>
                </div>
            </div>
        </div>

        <!-- TAB: SYSTEM -->
        <div id="tab-sys" class="tab-content">
            <div class="setting-group">
                <label class="label">API OpenAI (Optionnel)</label>
                <input type="password" id="set-apikey" placeholder="sk-...">
                <div style="font-size:0.7rem; color:#555;">Si vide, utilise le cerveau local.</div>
            </div>
            <div class="setting-group">
                <button onclick="app.clearLogs()" style="width:100%; border-color:#333; color:#888;">EFFACER LOGS TERMINAL</button>
            </div>
        </div>

        <div class="save-bar">
            <button onclick="toggleModal()" style="border-color:#333;">ANNULER</button>
            <button onclick="ui.saveSettings()" style="background:var(--primary); color:#000;">SAUVEGARDER</button>
        </div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
const now = () => new Date().toLocaleTimeString('fr-FR', {hour12:false});

/* --- CONFIGURATION MANAGER --- */
const Config = {
    defaults: {
        wakeWords: ["supra", "système", "assistant", "hey supra", "ordi"],
        voiceRate: 1.1,
        voicePitch: 1.0,
        voiceURI: "",
        theme: "cyber",
        crtEffect: true,
        particles: true,
        apiKey: "",
        strictMode: true
    },
    data: {},
    
    load() {
        const stored = localStorage.getItem('supra_v10_config');
        this.data = stored ? { ...this.defaults, ...JSON.parse(stored) } : { ...this.defaults };
        this.applyTheme();
    },
    
    save() {
        localStorage.setItem('supra_v10_config', JSON.stringify(this.data));
        this.applyTheme();
        Logger.log("Configuration sauvegardée.", "sys");
    },
    
    applyTheme() {
        document.body.className = this.data.crtEffect ? 'crt-on' : '';
        if(this.data.theme !== 'cyber') document.body.classList.add(`theme-${this.data.theme}`);
    }
};

const Logger = {
    log: (msg, type="sys") => {
        const t = $('terminal');
        if(!t) return;
        const d = document.createElement("div");
        d.className = `log-line log-${type}`;
        d.innerHTML = `<span class="log-time">[${now()}]</span> <span class="log-msg">${msg}</span>`;
        t.appendChild(d);
        t.scrollTop = t.scrollHeight;
        if(t.childElementCount > 40) t.removeChild(t.firstChild);
    },
    clear: () => { $('terminal').innerHTML = ''; }
};

/* --- AUDIO ENGINE --- */
class AudioEngine {
    constructor() {
        this.ready = false; this.analyser = null; this.dataArray = null; this.stream = null; this.ctx = null; this.isMuted = false;
    }
    async start() {
        if(this.ready || this.isMuted) return true;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (this.ctx.state === 'suspended') await this.ctx.resume();
            this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const src = this.ctx.createMediaStreamSource(this.stream);
            this.analyser = this.ctx.createAnalyser();
            this.analyser.fftSize = 512;
            src.connect(this.analyser);
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
            this.ready = true;
            return true;
        } catch(e) { 
            Logger.log("Erreur Micro: " + e.message, "err"); 
            return false;
        }
    }
    stop() {
        if(this.stream) { this.stream.getTracks().forEach(track => track.stop()); this.stream = null; }
        this.ready = false;
    }
    getData() {
        if(!this.ready || this.isMuted) return { vol:0, raw: new Uint8Array(0) };
        this.analyser.getByteFrequencyData(this.dataArray);
        let sum = 0;
        for(let i=0; i<this.dataArray.length; i++) sum += this.dataArray[i];
        return { vol: sum / this.dataArray.length, raw: this.dataArray };
    }
}

/* --- BRAIN & LOGIC --- */
class Brain {
    constructor() {
        this.synth = window.speechSynthesis;
        this.voices = [];
        this.loadVoices();
        if(speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = () => this.loadVoices();
    }
    loadVoices() { this.voices = this.synth.getVoices(); ui.populateVoices(); }

    async process(text) {
        const t = text.toLowerCase().trim();
        if(t.length < 2) return;

        // DÉTECTION WAKE WORD DYNAMIQUE
        const wakeList = Config.data.wakeWords.map(w => w.toLowerCase().trim());
        let triggered = false;
        let command = "";

        for(let word of wakeList) {
            if(Config.data.strictMode) {
                if(t.startsWith(word)) {
                    triggered = true;
                    command = t.replace(word, "").trim();
                    break;
                }
            } else {
                if(t.includes(word)) {
                    triggered = true;
                    command = t.replace(word, "").trim();
                    break;
                }
            }
        }

        if(!triggered) return; 

        app.setStatus("COMMANDE", true);
        Logger.log(`DÉTECTÉ: "${text}"`, "wake");
        sfx.play(800, 'sine', 0.1);

        if(!command) {
            this.speak("Oui ?");
            app.resetStatus();
            return;
        }

        let response = "";
        if (Config.data.apiKey && Config.data.apiKey.length > 10) {
            try { response = await this.fetchGPT(command); }
            catch(e) { response = this.localLogic(command); }
        } else {
            response = this.localLogic(command);
        }
        this.speak(response);
    }

    localLogic(cmd) {
        if(cmd.includes("heure")) return `Il est ${new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}.`;
        if(cmd.includes("date")) return `Nous sommes le ${new Date().toLocaleDateString('fr-FR')}.`;
        if(cmd.includes("qui es-tu")) return "Je suis Supra Ultimate, version 10.";
        if(cmd.includes("blague")) return "Pourquoi les plongeurs plongent-ils toujours en arrière ? Parce que sinon ils tomberaient dans le bateau.";
        if(cmd.includes("état")) return "Systèmes opérationnels. Configuration chargée.";
        return "Commande: " + cmd;
    }

    async fetchGPT(prompt) {
        try {
            const res = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${Config.data.apiKey}` },
                body: JSON.stringify({
                    model: "gpt-3.5-turbo",
                    messages: [{role: "system", content: "Réponds court."}, {role: "user", content: prompt}]
                })
            });
            const data = await res.json();
            return data.choices[0].message.content;
        } catch(e) { return "Erreur API."; }
    }

    speak(text) {
        if(!text) { app.resetStatus(); return; }
        this.synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        
        // Apply Settings
        u.rate = Config.data.voiceRate;
        u.pitch = Config.data.voicePitch;
        
        if(Config.data.voiceURI) {
            const v = this.voices.find(voice => voice.voiceURI === Config.data.voiceURI);
            if(v) u.voice = v;
        } else {
            const fr = this.voices.find(v => v.lang.includes('fr'));
            if(fr) u.voice = fr;
        }

        u.onstart = () => { app.setSpeaking(true); };
        u.onend = () => { app.resetStatus(); };
        this.synth.speak(u);
    }
}

/* --- VOICE RECOGNITION --- */
class VoiceEngine {
    constructor(callback) {
        this.callback = callback;
        this.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        this.isActive = false; this.keepAlive = true;
        if(!this.SpeechRecognition) return; 
        this.rec = new this.SpeechRecognition();
        this.rec.lang = 'fr-FR';
        this.rec.continuous = true;
        this.rec.interimResults = false;
        this.rec.onend = () => {
            if(this.keepAlive && !app.isMuted && !app.isSpeaking) setTimeout(() => { try { this.rec.start(); } catch(e){} }, 500);
            else { this.isActive = false; app.resetStatus(); }
        };
        this.rec.onresult = (e) => {
            const last = e.results[e.results.length - 1];
            if(last.isFinal) this.callback(last[0].transcript);
        };
        this.rec.onstart = () => { this.isActive = true; if(!app.isSpeaking) app.setStatus("SURVEILLANCE", false); };
    }
    start() { this.keepAlive = true; try { this.rec.start(); } catch(e){} }
    stop() { this.keepAlive = false; try { this.rec.stop(); } catch(e){} }
}

/* --- VISUALS --- */
class Visuals {
    constructor() {
        this.c = $('canvas'); this.ctx = this.c.getContext('2d'); this.resize();
        window.addEventListener('resize', () => this.resize()); this.angle = 0;
    }
    resize() { this.c.width = this.c.offsetWidth; this.c.height = this.c.offsetHeight; }
    draw(audioData, state) {
        const { vol, raw } = audioData;
        const w = this.c.width, h = this.c.height, cx = w/2, cy = h/2;
        
        this.ctx.fillStyle = "rgba(2, 2, 5, 0.2)"; this.ctx.fillRect(0,0,w,h);
        
        // Dynamic Colors from CSS Variables
        const style = getComputedStyle(document.body);
        let color = style.getPropertyValue('--primary').trim();
        let color2 = style.getPropertyValue('--secondary').trim();

        if(state === "SPEAKING") color = "#fff";

        const r = 50 + (vol * 0.5) + (Math.sin(this.angle)*5);
        this.ctx.beginPath(); this.ctx.arc(cx, cy, r, 0, Math.PI*2);
        this.ctx.strokeStyle = color; this.ctx.lineWidth = 2; this.ctx.stroke();

        if(Config.data.particles) {
            this.ctx.save(); this.ctx.translate(cx, cy); this.ctx.rotate(this.angle);
            this.ctx.beginPath(); this.ctx.moveTo(0,0); this.ctx.lineTo(0, -150);
            const grad = this.ctx.createLinearGradient(0,0,0,-150);
            grad.addColorStop(0, color); grad.addColorStop(1, 'transparent');
            this.ctx.strokeStyle = grad; this.ctx.lineWidth = 50; this.ctx.lineCap = 'round'; this.ctx.stroke();
            this.ctx.restore();
        }

        if(raw && raw.length > 0 && state !== "IDLE") {
            const step = Math.floor(raw.length / 40);
            for(let i=0; i<40; i++) {
                const val = raw[i*step]; const hBar = (val/255)*100;
                this.ctx.fillStyle = color;
                this.ctx.fillRect(cx - 100 + (i*5), cy + 60, 4, hBar);
            }
        }
        this.angle += 0.02;
    }
}

/* --- UI MANAGER --- */
const ui = {
    switchTab: (tabId) => {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        $(tabId).classList.add('active');
        event.target.classList.add('active');
    },
    
    populateVoices: () => {
        const sel = $('set-voiceuri');
        sel.innerHTML = '<option value="">Par défaut (Auto)</option>';
        app.brain.voices.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v.voiceURI;
            opt.textContent = `${v.name} (${v.lang})`;
            if(v.lang.includes('fr')) opt.style.backgroundColor = "#222"; // Highlight French
            sel.appendChild(opt);
        });
    },

    openSettings: () => {
        // Fill inputs with current config
        $('set-wakewords').value = Config.data.wakeWords.join(', ');
        $('set-rate').value = Config.data.voiceRate;
        $('val-rate').innerText = Config.data.voiceRate;
        $('set-pitch').value = Config.data.voicePitch;
        $('val-pitch').innerText = Config.data.voicePitch;
        $('set-theme').value = Config.data.theme;
        $('set-crt').checked = Config.data.crtEffect;
        $('set-particles').checked = Config.data.particles;
        $('set-apikey').value = Config.data.apiKey;
        $('set-strict').checked = Config.data.strictMode;
        
        ui.populateVoices();
        $('config-modal').style.display = 'flex';
    },

    saveSettings: () => {
        const wws = $('set-wakewords').value.split(',').map(s=>s.trim()).filter(s=>s!=='');
        Config.data.wakeWords = wws.length ? wws : Config.defaults.wakeWords;
        Config.data.voiceRate = parseFloat($('set-rate').value);
        Config.data.voicePitch = parseFloat($('set-pitch').value);
        Config.data.voiceURI = $('set-voiceuri').value;
        Config.data.theme = $('set-theme').value;
        Config.data.crtEffect = $('set-crt').checked;
        Config.data.particles = $('set-particles').checked;
        Config.data.apiKey = $('set-apikey').value;
        Config.data.strictMode = $('set-strict').checked;
        
        Config.save();
        toggleModal();
        sfx.play(1200, 'sine', 0.1);
    }
};

/* --- SOUND FX --- */
class SoundFX {
    constructor() { this.ctx = null; }
    init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    play(freq, type, dur) {
        this.init();
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type; osc.frequency.value = freq;
        g.gain.setValueAtTime(0.1, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + dur);
    }
}

/* --- APP CONTROLLER --- */
class App {
    constructor() {
        Config.load();
        this.audio = new AudioEngine();
        this.brain = new Brain();
        this.visuals = new Visuals();
        this.voice = new VoiceEngine(t => this.brain.process(t));
        this.sfx = new SoundFX();
        this.isMuted = false; this.isSpeaking = false; this.currentState = "IDLE";

        $('btnPrivacy').onclick = () => this.togglePrivacy();
        $('btnConfig').onclick = () => ui.openSettings();
        this.loop();
    }

    async manualBoot() {
        const audioSuccess = await this.audio.start();
        const overlay = $('boot-overlay');
        overlay.style.opacity = 0;
        setTimeout(() => overlay.remove(), 1000);

        if(audioSuccess) {
            Logger.log(`SUPRA v10.0 PRÊT. Mot clé: "${Config.data.wakeWords[0]}"`, "sys");
            this.setStatus("SURVEILLANCE", false);
            this.voice.start();
        } else {
            Logger.log("Erreur initialisation.", "err");
        }
    }

    togglePrivacy() {
        this.isMuted = !this.isMuted;
        const btn = $('btnPrivacy');
        if(this.isMuted) {
            this.audio.stop(); this.voice.stop();
            btn.classList.add('privacy-on'); btn.textContent = "🔓 MUET";
            Logger.log("PRIVACY ACTIVÉ", "err"); this.setStatus("OFF", false);
        } else {
            this.audio.start(); this.voice.start();
            btn.classList.remove('privacy-on'); btn.textContent = "🔒 PRIVACY";
            Logger.log("Micro ACTIF", "sys"); this.setStatus("SURVEILLANCE", false);
        }
    }

    setStatus(text, active) {
        this.currentState = text;
        const el = $('statusDisplay');
        el.textContent = text;
        el.className = "status-indicator " + (active ? "active" : "listening");
    }
    
    resetStatus() {
        this.isSpeaking = false;
        if(!this.isMuted) this.setStatus("SURVEILLANCE", false);
        else this.setStatus("OFF", false);
    }

    setSpeaking(val) { 
        this.isSpeaking = val; 
        if(val) this.setStatus("PAROLE", true);
    }

    clearLogs() { Logger.clear(); }

    loop() {
        requestAnimationFrame(() => this.loop());
        this.visuals.draw(this.audio.getData(), this.currentState);
    }
}

const sfx = new SoundFX();
let app;

window.onload = () => { app = new App(); };
window.toggleModal = () => $('config-modal').style.display = 'none';
</script>
