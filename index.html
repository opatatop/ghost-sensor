<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS FINAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050505;
            --primary: #00d2ff;
            --secondary: #1a1a2e;
            --text: #e0e6ed;
            --glass: rgba(26, 26, 46, 0.85);
            --border: rgba(0, 210, 255, 0.3);
            --accent: #ffd700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* BACKGROUND */
        #canvas-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; opacity: 0.4;
        }

        /* HEADER */
        header {
            height: 60px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 25px;
            background: rgba(5, 5, 5, 0.9);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .brand { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; color: var(--primary); letter-spacing: 3px; }
        .top-btn { background: none; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
        .top-btn:hover { color: var(--primary); }

        /* MAIN CONTENT */
        main {
            flex: 1; position: relative; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 5;
        }

        .core-visual {
            width: 280px; height: 280px; position: relative;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 40px;
        }

        .ring {
            position: absolute; border-radius: 50%; border: 1px solid var(--primary);
            box-shadow: 0 0 10px var(--primary); opacity: 0.3;
        }
        .r1 { width: 100%; height: 100%; animation: spin 10s linear infinite; border-top-color: transparent; }
        .r2 { width: 75%; height: 75%; border-color: var(--accent); animation: spin-rev 15s linear infinite; border-left-color: transparent; }
        
        #main-icon { font-size: 4rem; color: #fff; z-index: 2; text-shadow: 0 0 20px var(--primary); transition: 0.3s; }
        .listening #main-icon { color: var(--primary); animation: pulse 1.5s infinite; }

        #display-text {
            font-family: 'Orbitron', sans-serif; font-size: 1.5rem;
            text-align: center; min-height: 2rem; text-shadow: 0 0 10px rgba(255,255,255,0.3);
            max-width: 90%;
        }

        /* FOOTER / CONTROLS */
        .controls-area {
            padding: 25px;
            background: linear-gradient(0deg, #000 0%, transparent 100%);
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            z-index: 10;
        }

        .input-group {
            width: 100%; max-width: 500px; display: flex;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            border-radius: 30px; padding: 5px 15px; align-items: center;
        }
        #text-input {
            flex: 1; background: transparent; border: none; color: #fff;
            font-family: 'Rajdhani'; font-size: 1.1rem; outline: none; padding: 10px;
        }
        #btn-send { color: var(--primary); cursor: pointer; font-size: 1.2rem; }

        .action-buttons { display: flex; gap: 40px; align-items: center; }
        .btn-round {
            width: 65px; height: 65px; border-radius: 50%;
            background: rgba(255,255,255,0.05); border: 1px solid #333;
            color: #fff; font-size: 1.5rem; display: flex;
            justify-content: center; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .btn-round:active { transform: scale(0.9); background: var(--primary); color: #000; }
        #btn-mic { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 15px rgba(0, 210, 255, 0.2); }

        /* SETTINGS PANEL (MODAL) */
        #settings-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.98); backdrop-filter: blur(10px);
            z-index: 100; display: none; flex-direction: column;
            padding: 30px; overflow-y: auto; border-left: 1px solid var(--border);
        }
        #settings-panel.open { display: flex; }

        .panel-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .panel-label { color: var(--primary); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        
        input[type="range"] { width: 60%; accent-color: var(--primary); }
        input[type="text"], select { background: #111; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; width: 60%; }
        
        .btn-save {
            width: 100%; padding: 15px; background: var(--primary); color: #000;
            border: none; font-weight: bold; font-family: 'Orbitron'; cursor: pointer; margin-top: 20px;
        }

        /* ANIMATIONS */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-rev { 100% { transform: rotate(-360deg); } }
        @keyframes pulse { 0% { text-shadow: 0 0 10px var(--primary); } 50% { text-shadow: 0 0 30px var(--primary), 0 0 10px #fff; } 100% { text-shadow: 0 0 10px var(--primary); } }

    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<header>
    <div class="brand">NEXUS <span style="font-size:0.6rem; color:var(--accent)">FINAL</span></div>
    <button class="top-btn" id="btn-settings"><i class="fas fa-cog"></i></button>
</header>

<main>
    <div class="core-visual" id="core">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <i class="fas fa-brain" id="main-icon"></i>
    </div>
    <div id="display-text">Initialisation...</div>
</main>

<div class="controls-area">
    <div class="input-group">
        <input type="text" id="text-input" placeholder="Entrez commande..." autocomplete="off">
        <i class="fas fa-paper-plane" id="btn-send"></i>
    </div>
    <div class="action-buttons">
        <button class="btn-round" id="btn-reset"><i class="fas fa-undo"></i></button>
        <button class="btn-round" id="btn-mic"><i class="fas fa-microphone"></i></button>
        <button class="btn-round" id="btn-close-settings" style="display:none;"><i class="fas fa-times"></i></button>
    </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settings-panel">
    <h2 style="font-family:'Orbitron'; color:var(--primary); margin-bottom:30px; text-align:center;">PARAMÈTRES SYSTÈME</h2>
    
    <div class="panel-row">
        <span class="panel-label">Nom Utilisateur</span>
        <input type="text" id="set-name">
    </div>
    
    <div class="panel-row">
        <span class="panel-label">Vitesse Voix</span>
        <input type="range" id="set-rate" min="0.5" max="2" step="0.1" value="1">
    </div>

    <div class="panel-row">
        <span class="panel-label">Volume Voix</span>
        <input type="range" id="set-vol" min="0" max="1" step="0.1" value="1">
    </div>

    <div class="panel-row">
        <span class="panel-label">Thème Couleur</span>
        <select id="set-theme">
            <option value="#00d2ff">Cyber Blue</option>
            <option value="#ffd700">Gold</option>
            <option value="#ff2a2a">Red Alert</option>
            <option value="#00ff7f">Matrix Green</option>
        </select>
    </div>

    <button class="btn-save" id="btn-save">SAUVEGARDER & FERMER</button>
</div>

<script>
    /* 
       ================================================================
       NEXUS FINAL - LE CODE COMPLET ET FONCTIONNEL
       ================================================================
    */

    // ÉTAT GLOBAL
    const SYS = {
        user: "Invité",
        theme: "#00d2ff",
        rate: 1.0,
        vol: 1.0,
        listening: false,
        audioCtx: null,
        analyser: null,
        recognition: null,
        synth: window.speechSynthesis,
        voices: []
    };

    // ÉLÉMENTS UI (Récupérés au chargement)
    let UI = {};

    // INITIALISATION
    document.addEventListener('DOMContentLoaded', () => {
        // 1. Cibler les éléments
        UI = {
            core: document.getElementById('core'),
            icon: document.getElementById('main-icon'),
            display: document.getElementById('display-text'),
            input: document.getElementById('text-input'),
            panel: document.getElementById('settings-panel'),
            
            // Boutons
            btnMic: document.getElementById('btn-mic'),
            btnSend: document.getElementById('btn-send'),
            btnReset: document.getElementById('btn-reset'),
            btnSettings: document.getElementById('btn-settings'),
            btnCloseSettings: document.getElementById('btn-close-settings'),
            btnSave: document.getElementById('btn-save'),
            
            // Inputs Settings
            sName: document.getElementById('set-name'),
            sRate: document.getElementById('set-rate'),
            sVol: document.getElementById('set-vol'),
            sTheme: document.getElementById('set-theme')
        };

        // 2. Charger la config
        loadConfig();

        // 3. Attacher les événements (IMPORTANT POUR QUE ÇA MARCHE)
        UI.btnMic.addEventListener('click', toggleMic);
        UI.btnSend.addEventListener('click', sendText);
        UI.btnReset.addEventListener('click', () => { process("reset mémoire"); });
        UI.btnSettings.addEventListener('click', toggleSettings);
        UI.btnCloseSettings.addEventListener('click', toggleSettings);
        UI.btnSave.addEventListener('click', saveAndClose);
        
        UI.input.addEventListener("keypress", (e) => {
            if(e.key === "Enter") sendText();
        });

        // 4. Démarrer les systèmes
        initAudio();
        initVisuals();
        initSpeech();

        // Message de bienvenue
        setTimeout(() => speak(`Système en ligne. Bonjour ${SYS.user}.`), 1000);
    });

    // LOGIQUE
    function loadConfig() {
        const saved = localStorage.getItem('nexus_final_config');
        if(saved) {
            const c = JSON.parse(saved);
            SYS.user = c.user || "Invité";
            SYS.theme = c.theme || "#00d2ff";
            SYS.rate = c.rate || 1.0;
            SYS.vol = c.vol || 1.0;
        } else {
            // Demander le nom si première fois
            const name = prompt("Initialisation. Quel est votre nom ?");
            if(name) SYS.user = name;
        }

        // Appliquer config UI
        applyTheme();
        UI.sName.value = SYS.user;
        UI.sRate.value = SYS.rate;
        UI.sVol.value = SYS.vol;
        UI.sTheme.value = SYS.theme;
    }

    function saveAndClose() {
        SYS.user = UI.sName.value;
        SYS.rate = parseFloat(UI.sRate.value);
        SYS.vol = parseFloat(UI.sVol.value);
        SYS.theme = UI.sTheme.value;
        
        localStorage.setItem('nexus_final_config', JSON.stringify({
            user: SYS.user, theme: SYS.theme, rate: SYS.rate, vol: SYS.vol
        }));
        
        applyTheme();
        toggleSettings();
        speak("Paramètres sauvegardés.");
    }

    function applyTheme() {
        document.documentElement.style.setProperty('--primary', SYS.theme);
    }

    function toggleSettings() {
        UI.panel.classList.toggle('open');
        if(UI.panel.classList.contains('open')) {
            UI.btnCloseSettings.style.display = 'flex';
        } else {
            UI.btnCloseSettings.style.display = 'none';
        }
    }

    // COMMUNICATION
    function toggleMic() {
        if(!window.recognition) {
            speak("Erreur: Micro non disponible sur ce navigateur.");
            return;
        }
        try {
            window.recognition.start();
        } catch(e) {
            // Déjà actif
        }
    }

    function sendText() {
        const txt = UI.input.value;
        if(txt) {
            process(txt);
            UI.input.value = "";
        }
    }

    function process(input) {
        const text = input.toLowerCase();
        let reply = "";

        // Commandes Système
        if(text.includes("reset mémoire")) {
            localStorage.removeItem('nexus_final_config');
            reply = "Mémoire effacée. Redémarrage...";
            setTimeout(() => location.reload(), 2000);
        }
        else if(text.includes("couleur rouge")) { SYS.theme = "#ff2a2a"; applyTheme(); saveAndClose(); reply = "Thème Rouge activé."; }
        else if(text.includes("couleur bleu")) { SYS.theme = "#00d2ff"; applyTheme(); saveAndClose(); reply = "Thème Bleu activé."; }
        else if(text.includes("qui es-tu")) reply = "Je suis Nexus. Ton assistant neuronal final.";
        else if(text.includes("heure")) reply = "Il est " + new Date().toLocaleTimeString();
        else if(text.includes("merci")) reply = "De rien.";
        else if(text.includes("aide")) reply = "Commandes: 'Couleur rouge/bleu', 'Reset mémoire', 'Qui es-tu'.";
        else reply = "J'ai bien compris : " + input;

        speak(reply);
        typeWriter(reply, UI.display);
    }

    function typeWriter(text, element) {
        element.innerHTML = "";
        let i = 0;
        const interval = setInterval(() => {
            element.innerHTML += text.charAt(i);
            i++;
            if(i >= text.length) clearInterval(interval);
        }, 30);
    }

    function speak(text) {
        SYS.synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'fr-FR';
        u.rate = SYS.rate;
        u.volume = SYS.vol;
        
        const v = SYS.voices.find(voice => voice.lang.includes('fr')) || SYS.voices[0];
        if(v) u.voice = v;

        SYS.synth.speak(u);
    }

    // AUDIO & VISUELS
    function initAudio() {
        try {
            SYS.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                SYS.analyser = SYS.audioCtx.createAnalyser();
                SYS.analyser.fftSize = 256;
                SYS.audioCtx.createMediaStreamSource(stream).connect(SYS.analyser);
            }).catch(e => console.log("Audio fallback"));
        } catch(e) {}
        
        SYS.voices = SYS.synth.getVoices();
        SYS.synth.onvoiceschanged = () => SYS.voices = SYS.synth.getVoices();
    }

    function initSpeech() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(SpeechRecognition) {
            window.recognition = new SpeechRecognition();
            window.recognition.lang = 'fr-FR';
            window.recognition.continuous = false;
            
            window.recognition.onstart = () => {
                SYS.listening = true;
                UI.core.classList.add('listening');
                UI.display.innerText = "Écoute...";
            };
            
            window.recognition.onend = () => {
                SYS.listening = false;
                UI.core.classList.remove('listening');
            };
            
            window.recognition.onresult = (e) => {
                const t = e.results[0][0].transcript;
                process(t);
            };
        }
    }

    function initVisuals() {
        const cvs = document.getElementById('canvas-bg');
        const ctx = cvs.getContext('2d');
        const resize = () => { cvs.width = window.innerWidth; cvs.height = window.innerHeight; };
        window.addEventListener('resize', resize); resize();

        let pts = [];
        for(let i=0; i<60; i++) pts.push({x:Math.random()*cvs.width, y:Math.random()*cvs.height, vx:(Math.random()-0.5), vy:(Math.random()-0.5)});

        function draw() {
            requestAnimationFrame(draw);
            ctx.clearRect(0,0,cvs.width,cvs.height);
            ctx.fillStyle = SYS.theme;

            let boost = 1;
            if(SYS.analyser && SYS.listening) {
                const d = new Uint8Array(SYS.analyser.frequencyBinCount);
                SYS.analyser.getByteFrequencyData(d);
                boost = 1 + (d[10]/50); // Boost si micro actif
            }

            pts.forEach((p, i) => {
                p.x += p.vx * boost; p.y += p.vy * boost;
                if(p.x<0||p.x>cvs.width) p.vx*=-1;
                if(p.y<0||p.y>cvs.height) p.vy*=-1;
                
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
                
                for(let j=i+1; j<pts.length; j++) {
                    const p2 = pts[j];
                    const dist = Math.hypot(p.x-p2.x, p.y-p2.y);
                    if(dist < 120) {
                        ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p2.x,p2.y);
                        ctx.strokeStyle = SYS.theme; ctx.globalAlpha = 1 - dist/120; ctx.stroke(); ctx.globalAlpha = 1;
                    }
                }
            });
        }
        draw();
    }
</script>
</body>
</html>
