<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPRA NEURAL AI v3.1 (DEBUG)</title>
<style>
    :root {
        --bg-color: #020205;
        --primary: #00f3ff; 
        --secondary: #ff00ff;
        --danger: #ff3333;
        --success: #33ff33;
        --panel-bg: rgba(10, 10, 16, 0.95);
        --font-main: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; outline: none; }
    
    body {
        margin: 0;
        background-color: var(--bg-color);
        color: #e0e0e0;
        font-family: var(--font-main);
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    body::before {
        content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background-image: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
        background-size: 30px 30px;
        z-index: 0; pointer-events: none;
    }

    header {
        position: relative; z-index: 10; height: 60px;
        background: rgba(0,0,0,0.9);
        border-bottom: 1px solid var(--primary);
        display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
    }

    .brand { font-size: 1.2rem; font-weight: bold; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; }
    .brand span { color: var(--secondary); }

    .controls { display: flex; gap: 10px; }

    button {
        background: rgba(0,0,0,0.6); border: 1px solid var(--primary); color: var(--primary);
        padding: 6px 15px; font-family: var(--font-main); font-size: 0.8rem;
        cursor: pointer; transition: 0.2s; text-transform: uppercase;
    }
    button:hover:not(:disabled) { background: var(--primary); color: #000; }
    button.active { background: var(--danger); color: #fff; border-color: var(--danger); }
    button:disabled { border-color: #444; color: #444; cursor: not-allowed; }

    #canvas-container { flex-grow: 1; position: relative; z-index: 1; overflow: hidden; }
    canvas { display: block; }

    #terminal {
        height: 220px; background: var(--panel-bg);
        border-top: 1px solid var(--secondary);
        padding: 10px; font-size: 13px; overflow-y: auto;
        z-index: 10; scrollbar-width: thin; scrollbar-color: var(--secondary) #000;
    }
    .log-line { margin-bottom: 4px; border-left: 2px solid transparent; padding-left: 8px; opacity: 0.9; animation: fadeIn 0.3s; }
    .log-sys { color: #888; border-color: #888; }
    .log-user { color: var(--primary); border-color: var(--primary); }
    .log-ai { color: var(--secondary); border-color: var(--secondary); font-weight: bold; }
    .log-error { color: var(--danger); border-color: var(--danger); background: rgba(50,0,0,0.2); }
    .log-success { color: var(--success); border-color: var(--success); }

    @keyframes fadeIn { from { opacity:0; transform:translateX(-5px); } to { opacity:0.9; transform:translateX(0); } }

    /* MODAL */
    #config-modal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9); z-index: 100;
        justify-content: center; align-items: center;
    }
    .modal-box {
        background: #111; border: 1px solid var(--primary);
        padding: 25px; width: 450px; max-width: 90%;
        box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
    }
    .modal-box h3 { color: var(--primary); margin-top: 0; }
    .modal-box input {
        width: 100%; background: #000; border: 1px solid #444;
        color: #fff; padding: 10px; margin: 10px 0; font-family: monospace;
    }
    .modal-actions { display: flex; justify-content: space-between; margin-top: 15px; }
    .btn-test { background: #333; border-color: #666; color: #fff; }
    .btn-test:hover { background: #444; color: #fff; }

</style>
</head>
<body>

<header>
    <div class="brand">SUPRA <span>NEURAL</span> AI</div>
    <div class="controls">
        <button id="btnMic">1. Micro</button>
        <button id="btnVoice">2. Écoute (OFF)</button>
        <button id="btnConfig">⚙️ CONFIG & DEBUG</button>
    </div>
</header>

<div id="canvas-container">
    <canvas id="canvas"></canvas>
</div>

<div id="terminal"></div>

<div id="config-modal">
    <div class="modal-box">
        <h3>Configuration API OpenAI</h3>
        <label style="font-size:0.8rem; color:#aaa;">Collez votre clé (sk-...). N'ajoutez pas d'espace.</label>
        <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off">
        
        <div class="modal-actions">
            <button class="btn-test" id="btnTestKey">🔧 TESTER LA CONNEXION</button>
            <div>
                <button onclick="toggleModal()" style="border-color:#555; color:#aaa;">Fermer</button>
                <button onclick="saveConfig()" style="background:var(--primary); color:#000; font-weight:bold;">Sauvegarder</button>
            </div>
        </div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);

const Logger = {
    log: (msg, type="sys") => {
        const d = document.createElement("div");
        d.className = `log-line log-${type}`;
        d.innerHTML = `[${new Date().toLocaleTimeString().split(' ')[0]}] ${msg}`;
        $('terminal').appendChild(d);
        $('terminal').scrollTop = $('terminal').scrollHeight;
    },
    error: (msg) => Logger.log(msg, "error"),
    success: (msg) => Logger.log(msg, "success")
};

class AudioEngine {
    constructor() { this.ready = false; this.analyser = null; this.dataArray = null; this.ctx = null; }
    async start() {
        if(this.ready) return;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const src = this.ctx.createMediaStreamSource(stream);
            this.analyser = this.ctx.createAnalyser();
            this.analyser.fftSize = 256;
            this.analyser.smoothingTimeConstant = 0.8;
            src.connect(this.analyser);
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
            this.ready = true;
            Logger.log("Audio initialisé.", "sys");
            $('btnMic').classList.add('active');
        } catch(e) { Logger.error("Micro refusé."); }
    }
    getData() {
        if(!this.ready) return { vol:0, raw:null };
        this.analyser.getByteFrequencyData(this.dataArray);
        let sum=0;
        for(let i=0;i<this.dataArray.length;i++) sum+=this.dataArray[i];
        return { vol: sum/this.dataArray.length, raw: this.dataArray };
    }
}

class AIEngine {
    constructor() {
        this.apiKey = localStorage.getItem('supra_api_key') || "";
        this.synth = window.speechSynthesis;
        this.voices = [];
        if(speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = () => this.voices = this.synth.getVoices();
    }

    setKey(key) { this.apiKey = key.trim(); localStorage.setItem('supra_api_key', this.apiKey); }
    hasKey() { return this.apiKey.length > 10; }

    async process(text) {
        if(text.length < 3) return;
        Logger.log(`VOIX: "${text}"`, "user");

        let response = "";
        if (this.hasKey()) {
            Logger.log("Interrogation de l'API OpenAI...", "sys");
            try {
                response = await this.fetchGPT(text);
            } catch(e) {
                Logger.error("ÉCHEC API: " + e.message);
                response = "Erreur de connexion à l'IA. Vérifiez la clé ou les logs.";
            }
        } else {
            text = text.toLowerCase();
            if(text.includes("bonjour")) response = "Bonjour. Configurez une clé API pour plus d'intelligence.";
            else if(text.includes("test")) response = "Système en ligne.";
            else response = "Mode Offline. Clé API manquante.";
        }
        this.speak(response);
    }

    async fetchGPT(prompt) {
        const url = "https://api.openai.com/v1/chat/completions";
        const body = JSON.stringify({
            model: "gpt-3.5-turbo",
            messages: [{role: "system", content: "Tu es Supra Neural. Réponds court (max 20 mots)."}, {role: "user", content: prompt}]
        });

        const res = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${this.apiKey}`
            },
            body: body
        });

        const data = await res.json();
        
        // Gestion détaillée des erreurs HTTP
        if (!res.ok) {
            const errMsg = data.error ? data.error.message : `Erreur HTTP ${res.status}`;
            throw new Error(errMsg);
        }
        
        return data.choices[0].message.content;
    }

    speak(text) {
        this.synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const fr = this.voices.find(v => v.lang.includes('fr'));
        if(fr) u.voice = fr;
        u.rate = 1.1;
        u.onstart = () => { 
            Logger.log(`IA: "${text}"`, "ai"); 
            app.pauseVoice(); 
        };
        u.onend = () => { app.resumeVoice(); };
        this.synth.speak(u);
    }
}

class VoiceEngine {
    constructor(callback) {
        this.callback = callback;
        this.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        this.isActive = false;
        if(!this.SpeechRecognition) { $('btnVoice').disabled = true; return; }
        
        this.rec = new this.SpeechRecognition();
        this.rec.lang = 'fr-FR';
        this.rec.continuous = true;
        this.rec.interimResults = false;
        
        this.rec.onstart = () => { 
            this.isActive = true; 
            $('btnVoice').textContent = "2. Écoute (ON)";
            $('btnVoice').classList.add('active');
        };
        this.rec.onend = () => {
            if(this.isActive) { try { this.rec.start(); } catch(e){} }
            else {
                $('btnVoice').textContent = "2. Écoute (OFF)";
                $('btnVoice').classList.remove('active');
            }
        };
        this.rec.onresult = (e) => {
            const txt = e.results[e.results.length-1][0].transcript;
            this.callback(txt);
        };
    }
    toggle() {
        if(this.isActive) { this.isActive = false; this.rec.stop(); }
        else { try { this.rec.start(); } catch(e){} }
    }
    pause() { this.wasActive = this.isActive; this.isActive = false; try { this.rec.stop(); } catch(e){} }
    resume() { if(this.wasActive) { this.isActive = true; try { this.rec.start(); } catch(e){} } }
}

class Visuals {
    constructor() {
        this.c = $('canvas');
        this.ctx = this.c.getContext('2d');
        this.nodes = Array.from({length:50}, () => ({
            x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight,
            vx:(Math.random()-0.5), vy:(Math.random()-0.5), s:Math.random()*2+1
        }));
        window.onresize = () => { this.c.width=window.innerWidth; this.c.height=window.innerHeight-280; };
        this.c.width=window.innerWidth; this.c.height=window.innerHeight-280;
    }
    draw(audio) {
        const { vol, raw } = audio;
        const w = this.c.width, h = this.c.height;
        this.ctx.fillStyle = "rgba(2,2,5,0.2)";
        this.ctx.fillRect(0,0,w,h);
        this.ctx.beginPath();
        this.ctx.arc(w/2, h/2, 30 + vol/2, 0, Math.PI*2);
        this.ctx.strokeStyle = `rgba(0,243,255, ${0.2 + vol/200})`;
        this.ctx.stroke();
        this.ctx.fillStyle = "#00f3ff";
        this.nodes.forEach(n => {
            n.x+=n.vx; n.y+=n.vy;
            if(n.x<0||n.x>w)n.vx*=-1; if(n.y<0||n.y>h)n.vy*=-1;
            this.ctx.beginPath();
            this.ctx.arc(n.x, n.y, n.s + vol/40, 0, Math.PI*2);
            this.ctx.fill();
        });
        if(raw) {
            const bw = w/raw.length*2.5;
            for(let i=0; i<raw.length; i++) {
                this.ctx.fillStyle = `rgba(0,243,255, 0.2)`;
                this.ctx.fillRect(i*bw, h - (raw[i]/255)*(h/3), bw, (raw[i]/255)*(h/3));
            }
        }
    }
}

class App {
    constructor() {
        this.audio = new AudioEngine();
        this.ai = new AIEngine();
        this.visuals = new Visuals();
        this.voice = new VoiceEngine(t => this.ai.process(t));
        
        $('btnMic').onclick = () => this.audio.start();
        $('btnVoice').onclick = () => this.voice.toggle();
        $('btnConfig').onclick = () => {
            $('apiKeyInput').value = this.ai.apiKey;
            $('config-modal').style.display = 'flex';
        };

        // Bouton de test
        $('btnTestKey').onclick = async () => {
            const key = $('apiKeyInput').value.trim();
            if(!key) { Logger.error("Veuillez entrer une clé."); return; }
            
            Logger.log("Test de connexion à OpenAI...", "sys");
            try {
                // Test simple avec une requete minimaliste
                const res = await fetch("https://api.openai.com/v1/models", {
                    headers: { "Authorization": `Bearer ${key}` }
                });
                
                if (res.ok) {
                    Logger.success("SUCCÈS : La clé est valide et la connexion fonctionne !");
                } else {
                    const data = await res.json();
                    Logger.error("Erreur Clé API : " + (data.error?.message || "Inconnue"));
                }
            } catch (e) {
                Logger.error("Erreur Réseau (CORS/Offline) : " + e.message);
                Logger.log("Astuce : Si vous voyez 'Failed to fetch', essayez d'utiliser 'Live Server' sur VS Code.", "warn");
            }
        };

        if(this.ai.hasKey()) Logger.success("Clé API chargée. Mode GPT activé.");
        else Logger.log("Mode Démo. Aucune clé trouvée.", "sys");

        this.loop();
    }
    pauseVoice() { this.voice.pause(); }
    resumeVoice() { this.voice.resume(); }
    loop() {
        requestAnimationFrame(() => this.loop());
        this.visuals.draw(this.audio.getData());
    }
}

window.toggleModal = () => $('config-modal').style.display = 'none';
window.saveConfig = () => {
    app.ai.setKey($('apiKeyInput').value);
    toggleModal();
    Logger.success("Configuration sauvegardée.");
    if(app.ai.hasKey()) Logger.success("Mode GPT ACTIVÉ."); else Logger.log("Mode Offline activé.");
};

const app = new App();
</script>
</body>
</html>
