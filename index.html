<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUPRA v13 — REALME NOTE 60</title>
<style>
:root{--bg:#000;--primary:#00ff41;--danger:#ff0000}
body{margin:0;background:var(--bg);color:var(--primary);font-family:'Courier New',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:65px;background:rgba(0,255,65,0.1);border-bottom:3px solid var(--primary);display:flex;justify-content:space-between;align-items:center;padding:0 15px}
.brand{font-size:1.35rem;font-weight:900;letter-spacing:5px}
#status{font-size:0.95rem;background:#111;padding:6px 14px;border:2px solid var(--primary);min-width:150px;text-align:center}
canvas{display:block;width:100%;height:100%}
#terminal{height:170px;background:#000;border-top:3px solid var(--primary);padding:10px;overflow-y:auto;font-size:11px}
.log{margin:3px 0}
.log.emf{color:#ffff00}
.log.motion{color:#ff00ff}
button{background:#111;border:1px solid #0f0;color:#0f0;padding:10px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<header>
<div class="brand">SUPRA v13 — NOTE 60</div>
<div id="status">EMF : 0.0 μT</div>
</header>

<div id="canvas-container"><canvas id="canvas"></canvas></div>
<div id="terminal"></div>

<div style="padding:12px;background:#111;display:flex;gap:8px;flex-wrap:wrap">
<button onclick="toggleRecording()">🎤 ENREGISTRER EVP</button>
<button onclick="startScan()">SCAN PARANORMAL</button>
<button onclick="clearLogs()">EFFACER</button>
</div>

<script>
const $ = id => document.getElementById(id);
const log = (txt, type="") => {
  const t = $('terminal');
  const d = document.createElement('div');
  d.className = `log ${type}`;
  d.innerHTML = `[${new Date().toLocaleTimeString('fr-FR')}] ${txt}`;
  t.appendChild(d);
  t.scrollTop = t.scrollHeight;
  if(t.children.length > 70) t.removeChild(t.firstChild);
};

let stream, mediaRecorder, audioChunks = [], isRecording = false;
let analyser, dataArray;
let emfValue = 0, motionValue = 0, lightValue = 50;
let ghostIntensity = 0;

// === MICRO + SPECTRE 48kHz ===
async function initMicro() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:{sampleRate:48000,echoCancellation:false,noiseSuppression:false}});
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const source = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 4096;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    log("Micro 48kHz + spectre réel → ACTIVÉ (Note 60)");
  } catch(e){ log("Micro refusé", "danger"); }
}

// === MAGNÉTOMÈTRE (EMF RÉEL) + ACCÉLÉRO ===
if(window.DeviceOrientationEvent) {
  window.addEventListener('deviceorientation', e => {
    emfValue = Math.hypot(e.alpha||0, e.beta||0, e.gamma||0) / 3;
    $('status').textContent = `EMF : ${emfValue.toFixed(1)} μT`;
    if(emfValue > 45) {
      log("SPIKE EMF → PRÉSENCE !", "emf");
      ghostIntensity = 90;
      navigator.vibrate([100,50,100]);
    }
  });
}

if(window.DeviceMotionEvent) {
  window.addEventListener('devicemotion', e => {
    motionValue = Math.hypot(e.acceleration.x||0, e.acceleration.y||0, e.acceleration.z||0);
    if(motionValue > 8) {
      log(`COUP DÉTECTÉ (${motionValue.toFixed(1)}g)`, "motion");
      ghostIntensity = 120;
      navigator.vibrate(300);
    }
  });
}

// === CAPTEUR LUMIÈRE (AmbientLightSensor) ===
if('AmbientLightSensor' in window) {
  try {
    const sensor = new AmbientLightSensor();
    sensor.onreading = () => {
      lightValue = sensor.illuminance;
      if(lightValue < 8) log("CHUTE LUMIÈRE → ENTITÉ FROIDE", "danger");
    };
    sensor.start();
  } catch(e){}
}

// === VISUEL ===
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

function draw() {
  requestAnimationFrame(draw);
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Spectre micro
  if(analyser) {
    analyser.getByteFrequencyData(dataArray);
    for(let i=0;i<80;i++){
      const h = (dataArray[i*10]||0) / 255 * canvas.height * 0.75;
      ctx.fillStyle = h > canvas.height*0.55 ? '#ff00ff' : '#00ff41';
      ctx.fillRect(i*(canvas.width/80), canvas.height-h, 7, h);
    }
  }

  // Orbes + EMF ring
  if(ghostIntensity > 5) {
    const cx = canvas.width/2, cy = canvas.height/2;
    ctx.shadowBlur = 35;
    ctx.shadowColor = '#ff00ff';
    for(let i=0;i<12;i++){
      const x = cx + Math.sin(Date.now()/300 + i)* (70 + ghostIntensity);
      ctx.fillStyle = `rgba(255,0,255,${ghostIntensity/150})`;
      ctx.fillRect(x, cy-15, 9, 9);
    }
    ghostIntensity *= 0.92;
  }
}
draw();

// === ENREGISTREMENT EVP ===
function toggleRecording() {
  if(!isRecording){
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, {type:'audio/webm'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `EVP_Note60_${Date.now()}.webm`; a.click();
      log("✅ EVP sauvegardé (fichier webm)");
    };
    mediaRecorder.start();
    isRecording = true;
    log("🎤 ENREGISTREMENT EVP EN COURS...");
  } else {
    mediaRecorder.stop();
    isRecording = false;
  }
}

function startScan() {
  log("SCAN PARANORMAL LANCÉ (EMF + MOTION + LUMIÈRE)", "danger");
  ghostIntensity = 80;
}

function clearLogs(){ $('terminal').innerHTML = ''; }

initMicro();
log("SUPRA v13 optimisé pour Realme Note 60");
log("Magnétomètre + Accéléro + Lumière + Micro 48kHz → tout actif");
</script>
</body>
</html>
