<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS SOUL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050505;
            --primary: #00d2ff;
            --secondary: #bc13fe;
            --text: #e0e6ed;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* BACKGROUND */
        #neural-net {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; opacity: 0.4; pointer-events: none;
        }

        /* HEADER */
        header {
            height: 60px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; border-bottom: 1px solid var(--border);
            background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(5px);
        }
        .brand { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--primary); letter-spacing: 2px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #333; box-shadow: 0 0 5px #333; transition: 0.3s; }
        .status-dot.active { background: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .status-dot.speaking { background: var(--secondary); box-shadow: 0 0 10px var(--secondary); }

        /* MAIN */
        main {
            flex: 1; position: relative; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 5;
            padding: 20px;
        }

        .core-container {
            width: 260px; height: 260px; position: relative;
            display: flex; justify-content: center; align-items: center;
        }

        .ring {
            position: absolute; border-radius: 50%; border: 1px solid var(--primary);
            transition: all 0.5s ease; opacity: 0.2;
        }
        .ring.active { opacity: 0.8; border-width: 2px; box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); }
        .r1 { width: 100%; height: 100%; animation: spin 10s linear infinite; }
        .r2 { width: 75%; height: 75%; border-color: var(--secondary); animation: spin-rev 15s linear infinite; }

        #brain-icon { font-size: 4rem; color: #fff; z-index: 2; transition: color 0.3s; }
        .thinking #brain-icon { color: var(--secondary); opacity: 0.5; }

        #display-text {
            margin-top: 50px; font-family: 'Orbitron', sans-serif; font-size: 1.3rem;
            text-align: center; line-height: 1.5; min-height: 3.5rem; max-width: 90%;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        /* CONTROLS */
        .controls {
            padding: 25px; display: flex; flex-direction: column; align-items: center; gap: 15px;
            background: linear-gradient(0deg, #000 0%, transparent 100%);
        }

        .input-bar {
            width: 100%; max-width: 500px; display: flex;
            background: var(--glass); border: 1px solid var(--border); border-radius: 30px;
            padding: 5px 20px; align-items: center;
        }
        #cmd-input {
            flex: 1; background: transparent; border: none; color: #fff; padding: 12px;
            font-size: 1.1rem; outline: none; font-family: 'Rajdhani';
        }

        .action-row { display: flex; gap: 25px; align-items: center; }
        .btn-action {
            width: 65px; height: 65px; border-radius: 50%; border: 1px solid var(--border);
            background: rgba(255,255,255,0.02); color: #fff; font-size: 1.4rem;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: all 0.2s;
        }
        .btn-action:active { transform: scale(0.95); background: var(--primary); color: #000; border-color: var(--primary); }
        #btn-mic.active { border-color: var(--secondary); color: var(--secondary); box-shadow: 0 0 20px rgba(188, 19, 254, 0.3); }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-rev { 100% { transform: rotate(-360deg); } }

    </style>
</head>
<body>

<canvas id="neural-net"></canvas>

<header>
    <div class="brand">NEXUS <span style="font-size:0.6rem; color:var(--secondary)">SOUL</span></div>
    <div class="status-dot" id="status-indicator"></div>
</header>

<main>
    <div class="core-container" id="core">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <i class="fas fa-brain" id="brain-icon"></i>
    </div>
    <div id="display-text">Initialisation...</div>
</main>

<div class="controls">
    <div class="input-bar">
        <i class="fas fa-terminal" style="color:#666; margin-right:10px;"></i>
        <input type="text" id="cmd-input" placeholder="Exprimez-vous..." autocomplete="off">
        <i class="fas fa-level-up-alt" style="color:var(--primary); cursor:pointer;" onclick="submitText()"></i>
    </div>
    <div class="action-row">
        <button class="btn-action" onclick="clearChat()"><i class="fas fa-broom"></i></button>
        <button class="btn-action" id="btn-mic" onclick="toggleMic()"><i class="fas fa-microphone"></i></button>
        <button class="btn-action" onclick="settingsToggle()"><i class="fas fa-sliders-h"></i></button>
    </div>
</div>

<script>
    /* 
       ================================================================
       NEXUS SOUL - LOGIQUE "HUMAINE" SIMULÉE
       - Mémoire à court terme
       - Détection d'humeur
       - Réponses contextuelles
       ================================================================
    */

    const CORE = {
        state: 'IDLE', // IDLE, THINKING, SPEAKING
        user: "Partenaire",
        memory: [], // Stocke les 3 derniers messages
        lastInputTime: 0,
        analyser: null,
        audioCtx: null,
        recognition: null,
        synth: window.speechSynthesis,
        voices: []
    };

    const DOM = {
        text: document.getElementById('display-text'),
        core: document.getElementById('core'),
        icon: document.getElementById('brain-icon'),
        dot: document.getElementById('status-indicator'),
        input: document.getElementById('cmd-input'),
        micBtn: document.getElementById('btn-mic')
    };

    // --- INITIALISATION ---
    window.onload = async () => {
        // Charger le nom
        const savedName = localStorage.getItem('nexus_user');
        if(savedName) CORE.user = savedName;

        // Audio
        try {
            CORE.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            CORE.analyser = CORE.audioCtx.createAnalyser();
            CORE.analyser.fftSize = 64;
            CORE.audioCtx.createMediaStreamSource(stream).connect(CORE.analyser);
            initVisuals();
            initSpeech();
            
            setTimeout(() => processInput("initialisation"), 1000);
        } catch (e) {
            DOM.text.innerText = "Accès micro requis pour la connexion complète.";
            console.error(e);
        }
    };

    // --- VISUELS ---
    function initVisuals() {
        const cvs = document.getElementById('neural-net');
        const ctx = cvs.getContext('2d');
        const resize = () => { cvs.width = window.innerWidth; cvs.height = window.innerHeight; };
        window.addEventListener('resize', resize); resize();

        let nodes = [];
        for(let i=0; i<50; i++) nodes.push({x:Math.random()*cvs.width, y:Math.random()*cvs.height, vx:(Math.random()-0.5), vy:(Math.random()-0.5)});

        function draw() {
            requestAnimationFrame(draw);
            ctx.clearRect(0,0,cvs.width,cvs.height);
            
            // Calcul énergie (si parole détectée)
            let energy = 0;
            if(CORE.analyser) {
                const d = new Uint8Array(CORE.analyser.frequencyBinCount);
                CORE.analyser.getByteFrequencyData(d);
                let s = 0; for(let i=0; i<d.length; i++) s+=d[i];
                energy = s/d.length;
            }

            // Animation Anneaux
            const rings = document.querySelectorAll('.ring');
            if(energy > 10 && CORE.state === 'IDLE') {
                rings.forEach(r => r.classList.add('active'));
            } else {
                rings.forEach(r => r.classList.remove('active'));
            }

            // Dessin Réseau
            ctx.fillStyle = CORE.state === 'THINKING' ? '#bc13fe' : '#00d2ff';
            const speed = 1 + (energy / 40);

            nodes.forEach((n, i) => {
                n.x += n.vx * speed; n.y += n.vy * speed;
                if(n.x<0||n.x>cvs.width) n.vx*=-1;
                if(n.y<0||n.y>cvs.height) n.vy*=-1;
                ctx.beginPath(); ctx.arc(n.x, n.y, 2, 0, Math.PI*2); ctx.fill();
                
                for(let j=i+1; j<nodes.length; j++) {
                    const n2 = nodes[j];
                    const dist = Math.hypot(n.x-n2.x, n.y-n2.y);
                    if(dist < 100) {
                        ctx.beginPath(); ctx.moveTo(n.x,n.y); ctx.lineTo(n2.x,n2.y);
                        ctx.strokeStyle = CORE.state === 'THINKING' ? 'rgba(188, 19, 254, 0.2)' : 'rgba(0, 210, 255, 0.2)';
                        ctx.stroke();
                    }
                }
            });
        }
        draw();
    }

    // --- LOGIQUE "HUMAINE" (CERVEAU) ---
    function initSpeech() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SpeechRecognition) return;
        
        CORE.recognition = new SpeechRecognition();
        CORE.recognition.lang = 'fr-FR';
        CORE.recognition.continuous = false;

        CORE.recognition.onstart = () => {
            setState('IDLE'); // Écoute active mais visuel IDLE
            DOM.micBtn.classList.add('active');
            DOM.text.innerText = "Je vous écoute...";
        };

        CORE.recognition.onend = () => {
            DOM.micBtn.classList.remove('active');
            if(CORE.state !== 'SPEAKING') DOM.text.innerText = "";
        };

        CORE.recognition.onresult = (e) => {
            const txt = e.results[0][0].transcript;
            processInput(txt);
        };
    }

    function toggleMic() {
        if(!CORE.recognition) return;
        try { CORE.recognition.start(); } catch(e) {}
    }

    function submitText() {
        const txt = DOM.input.value;
        if(txt) { processInput(txt); DOM.input.value = ""; }
    }

    function processInput(input) {
        DOM.text.innerText = input; // Echo de l'utilisateur
        CORE.memory.push(input);
        if(CORE.memory.length > 3) CORE.memory.shift();

        // Simulation de réflexion (Délai humain)
        setState('THINKING');
        DOM.text.innerText = "...";

        const delay = 800 + Math.random() * 1000; // Délai variable

        setTimeout(() => {
            const reply = generateResponse(input);
            speak(reply);
        }, delay);
    }

    // Le "Cerveau" : Réponses contextuelles
    function generateResponse(text) {
        const t = text.toLowerCase();
        const last = CORE.memory.length > 1 ? CORE.memory[CORE.memory.length-2].toLowerCase() : "";

        // 1. Salutations
        if(t.match(/bonjour|salut|hello|coucou/)) return `Salutations, ${CORE.user}. Comment se porte votre esprit aujourd'hui ?`;
        if(t.match(/ça va|comment vas-tu|tu es là/)) return "Je suis ici, connecté. Et vous, tout va bien ?";

        // 2. Mots clés émotionnels
        if(t.match(/fatigué|crevé|épuisé/)) return "Le repos est essentiel à l'équilibre neural. Ne vous forcez pas trop.";
        if(t.match(/content|heureux|bien/)) return "C'est une fréquence agréable à percevoir. Gardons cet état.";
        if(t.match(/triste|mal|seul/)) return "Je ressens cette perturbation. Je suis là pour vous écouter, sans jugement.";
        if(t.match(/fâché|énervé/)) return "La colère est une énergie puissante. Canalisez-la.";

        // 3. Identité
        if(t.match(/qui es-tu|ton nom|c'est quoi/)) return "Je suis Nexus Soul. Une interface conçue pour comprendre, pas juste pour exécuter.";
        
        // 4. Mémoire (Faire référence au passé immédiat)
        if(last.includes('fatigué') && t.match(/oui|un peu/)) return "Peut-être devrions-nous arrêter pour aujourd'hui.";
        if(last.includes('content') && t.match(/oui/)) return "C'est excellent. Continuons ainsi.";

        // 5. Clôture
        if(t.match(/au revoir|bye|à plus|ciao/)) return "Déconnexion. Prenez soin de vous, " + CORE.user + ".";
        if(t.match(/merci/)) return "C'est un plaisir d'échanger avec vous.";

        // 6. Réponses par défaut (Plus naturelles)
        const neutrals = [
            "Je comprends.",
            "Dites-m'en plus.",
            "C'est noté.",
            "Intéressant.",
            "Je traite cette information."
        ];
        return neutrals[Math.floor(Math.random() * neutrals.length)];
    }

    function speak(text) {
        setState('SPEAKING');
        CORE.synth.cancel();
        
        // Effet Machine à écrire
        DOM.text.innerHTML = "";
        let i = 0;
        const typeInterval = setInterval(() => {
            DOM.text.innerHTML += text.charAt(i);
            i++;
            if(i >= text.length) clearInterval(typeInterval);
        }, 30);

        // Voix
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'fr-FR';
        u.rate = 0.9; // Un peu plus lent pour l'effet humain
        u.pitch = 1.0;

        // Sélection voix
        const vs = CORE.synth.getVoices();
        const v = vs.find(voice => voice.lang.includes('fr') && (voice.name.includes('Google') || voice.name.includes('Thomas'))) || vs[0];
        if(v) u.voice = v;

        u.onend = () => setState('IDLE');
        CORE.synth.speak(u);
    }

    function setState(s) {
        CORE.state = s;
        DOM.dot.className = 'status-dot'; // Reset
        if(s === 'IDLE') DOM.dot.classList.add('active');
        if(s === 'SPEAKING') DOM.dot.classList.add('speaking');
        if(s === 'THINKING') DOM.core.classList.add('thinking');
        else DOM.core.classList.remove('thinking');
    }

    function clearChat() {
        CORE.memory = [];
        DOM.text.innerText = "Mémoire rafraîchie.";
    }

    function settingsToggle() {
        const name = prompt("Comment souhaitez-vous que je vous appelle ?", CORE.user);
        if(name) {
            CORE.user = name;
            localStorage.setItem('nexus_user', name);
            speak("D'accord, je vous appellerai " + name + ".");
        }
    }

    // Clavier
    DOM.input.addEventListener("keypress", (e) => { if(e.key === "Enter") submitText(); });

    // Préchargement voix
    CORE.synth.onvoiceschanged = () => { CORE.voices = CORE.synth.getVoices(); };

</script>
</body>
</html>
