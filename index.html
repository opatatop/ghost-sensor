<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. AUDIO-ANALYTICS v12.0</title>
    <style>
        :root {
            --primary: #00ffcc; /* Cyan Tech */
            --secondary: #0088ff; /* Bleu Profond */
            --alert: #ff3366;
            --bg: #020204;
            --glass: rgba(0, 20, 20, 0.85);
            --font: 'Segoe UI', 'Roboto', 'Helvetica', monospace;
        }

        body {
            margin: 0; background: var(--bg); color: #fff;
            font-family: var(--font); height: 100vh;
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* Background Animé */
        .bg-grid {
            position: absolute; width: 200vw; height: 200vh;
            background-image: linear-gradient(var(--bg) 1px, transparent 1px),
            linear-gradient(90deg, var(--bg) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            opacity: 0.2; z-index: 0; pointer-events: none;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { 0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); } 100% { transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px); } }

        /* Interface Principale */
        #interface {
            position: relative; z-index: 10;
            flex: 1; display: flex; flex-direction: column;
            padding: 20px; pointer-events: none; /* Laisse passer les clics si besoin */
        }

        header {
            display: flex; justify-content: space-between; align-items: flex-start;
            border-bottom: 1px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px;
            pointer-events: auto;
        }
        h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 3px; color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        .status-badge { font-size: 0.7rem; background: var(--primary); color: #000; padding: 4px 8px; font-weight: bold; border-radius: 2px; }

        /* Zone Visuelle Centrale */
        .visualizer-container {
            flex: 1; display: flex; justify-content: center; align-items: center; position: relative;
            flex-direction: column;
        }
        
        #waveCanvas {
            width: 100%; height: 200px; border-bottom: 1px solid #333; border-top: 1px solid #333;
            background: rgba(0,0,0,0.5); box-shadow: 0 0 20px rgba(0,255,204,0.1);
        }

        #mainResponse {
            margin-top: 20px; text-align: center;
            font-size: 1.4rem; font-weight: 300; letter-spacing: 1px;
            color: #fff; min-height: 3.5rem; text-shadow: 0 0 5px rgba(255,255,255,0.5);
            transition: color 0.3s;
        }
        .response-ghost { color: var(--alert) !important; text-shadow: 0 0 15px var(--alert) !important; }
        .response-jarvis { color: var(--primary) !important; text-shadow: 0 0 15px var(--primary) !important; }
        .response-action { color: #ffff00 !important; text-shadow: 0 0 15px #ffff00 !important; }

        /* Panneau de Contrôle Bas */
        #controls {
            background: var(--glass); backdrop-filter: blur(10px);
            border-top: 1px solid #333; padding: 15px; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px;
            pointer-events: auto;
        }

        .btn {
            background: rgba(255,255,255,0.05); border: 1px solid #444; color: #aaa;
            padding: 12px; font-family: inherit; text-transform: uppercase; font-size: 0.7rem;
            cursor: pointer; transition: all 0.2s; border-radius: 4px;
        }
        .btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .btn.active { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 10px rgba(0,255,204,0.2); background: rgba(0,255,204,0.05); }
        .btn.danger.active { border-color: var(--alert); color: var(--alert); box-shadow: 0 0 10px rgba(255,50,100,0.2); }

        /* Indicateurs Techniques */
        .tech-hud {
            position: absolute; top: 80px; right: 20px; width: 180px;
            font-family: monospace; font-size: 0.7rem; color: var(--secondary);
            text-align: right; line-height: 1.6; pointer-events: none;
        }
        .bar-container { width: 100%; height: 4px; background: #222; margin-bottom: 5px; display: inline-block; }
        .bar-fill { height: 100%; background: var(--secondary); width: 0%; transition: width 0.1s; }

        /* Console Log */
        #console {
            height: 80px; overflow-y: auto; font-family: monospace; font-size: 0.7rem;
            color: #666; padding: 10px; background: #000; border-top: 1px solid #222;
            pointer-events: auto; display: flex; flex-direction: column-reverse;
        }
        .log-line { margin-bottom: 2px; border-left: 2px solid #333; padding-left: 5px; }
        .log-sys { border-color: var(--primary); color: var(--primary); }
        .log-audio { border-color: #ffff00; color: #ffff00; }
        .log-ghost { border-color: var(--alert); color: var(--alert); }

        /* Animation activée */
        .pulse { animation: pulseAnim 1s infinite; }
        @keyframes pulseAnim { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div id="interface">
        <header>
            <div>
                <h1>J.A.R.V.I.S. <span style="font-size:0.6em; color:#fff;">DEEP LISTEN</span></h1>
                <div style="font-size:0.7rem; color:#666;">ANALYSE SPECTRALE & IA CONTEXTELLE</div>
            </div>
            <div class="status-badge" id="sysStatus">EN ATTENTE MICRO</div>
        </header>

        <div class="tech-hud">
            <div>GAIN INPUT: <span id="valVol">0</span>%</div>
            <div class="bar-container"><div id="barVol" class="bar-fill"></div></div>
            
            <div>FRÉQUENCE PIC: <span id="valFreq">0</span> Hz</div>
            <div class="bar-container"><div id="barFreq" class="bar-fill" style="background:#ff00ff"></div></div>

            <>DÉTECTION BRUIT: <span id="valType">SILENCE</span></div>
            <div id="debugInfo" style="color:#444; font-size:0.6rem; margin-top:5px;">Z-Crossing: 0</div>
        </div>

        <div class="visualizer-container">
            <canvas id="waveCanvas"></canvas>
            <div id="mainResponse">Initialisation des capteurs bio-acoustiques...</div>
        </div>
    </div>

    <div id="controls">
        <button class="btn" id="btnStart" onclick="System.init()">▶ DÉMARRER</button>
        <button class="btn active" id="btnEar" onclick="System.toggleModule('ear')">👂 OREILLE ULTIME</button>
        <button class="btn active" id="btnGhost" onclick="System.toggleModule('ghost')">👻 MODE GHOST</button>
        <button class="btn" id="btnSnark" onclick="System.toggleModule('snark')">💬 HUMOUR ACTIF</button>
        <button class="btn" onclick="Brain.triggerTest('COUGH')">🧪 TEST TOUX</button>
        <button class="btn" onclick="Brain.triggerTest('CLAP')">🧪 TEST CLAP</button>
    </div>

    <div id="console"></div>

    <script>
        // --- CONFIGURATION & UTILITAIRES ---
        const $ = id => document.getElementById(id);
        const log = (msg, type='sys') => {
            const div = document.createElement('div');
            div.className = `log-line log-${type}`;
            div.innerText = `> ${msg}`;
            $('console').prepend(div);
            if($('console').children.length > 20) $('console').lastChild.remove();
        };

        const Speech = {
            synth: window.speechSynthesis,
            voice: null,
            init() {
                const setVoice = () => {
                    const voices = this.synth.getVoices();
                    // Cherche une voix française précise (Google ou Microsoft)
                    this.voice = voices.find(v => v.lang === 'fr-FR' && v.name.includes('Google')) || 
                                 voices.find(v => v.lang === 'fr-FR') || voices[0];
                };
                setVoice();
                this.synth.onvoiceschanged = setVoice;
            },
            say(text, pitch = 1, rate = 1) {
                if (this.synth.speaking) this.synth.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'fr-FR';
                u.pitch = pitch;
                u.rate = rate;
                if (this.voice) u.voice = this.voice;
                this.synth.say = () => this.synth.speak(u);
                this.synth.say();
                
                UI.updateText(text, 'jarvis');
            },
            sayGhost(text) {
                if (this.synth.speaking) this.synth.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'fr-FR';
                u.pitch = 0.4; // Voix grave
                u.rate = 0.8;  // Lente
                if (this.voice) u.voice = this.voice;
                this.synth.speak(u);
                UI.updateText(text, 'ghost');
            }
        };

        // --- MOTEUR AUDIO AVANCÉ (Le "Cerveau Sonore") ---
        const AudioEngine = {
            ctx: null,
            analyser: null,
            mic: null,
            buffer: null,
            isReady: false,
            dataArray: null,
            
            async init() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.mic = this.ctx.createMediaStreamSource(stream);
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 2048; // Haute résolution
                    this.analyser.smoothingTimeConstant = 0.85;
                    
                    this.mic.connect(this.analyser);
                    this.bufferLength = this.analyser.frequencyBinCount;
                    this.dataArray = new Uint8Array(this.bufferLength);
                    this.timeData = new Uint8Array(this.bufferLength);
                    
                    this.isReady = true;
                    $('sysStatus').textContent = "ANALYSE ACTIVE";
                    $('sysStatus').style.background = "var(--primary)";
                    log("Flux audio connecté. FFT Size: 2048.", "sys");
                    Visuals.start();
                    Brain.startLoop();
                    
                    // Start Speech Recognition
                    VoiceRec.init();
                } catch (e) {
                    log("ERREUR: Accès micro refusé.", "ghost");
                    $('sysStatus').textContent = "ERREUR MICRO";
                    $('sysStatus').style.background = "red";
                }
            },
            
            getAnalysis() {
                if (!this.isReady) return null;
                this.analyser.getByteFrequencyData(this.dataArray);
                this.analyser.getByteTimeDomainData(this.timeData);
                
                // Calculs mathématiques pour l'analyse de forme d'onde
                let sum = 0;
                let zcr = 0; // Zero Crossing Rate (détecte le bruit vs la voix)
                let lastZero = 0;
                
                for (let i = 0; i < this.bufferLength; i++) {
                    const x = (this.timeData[i] / 128.0) - 1;
                    sum += x * x;
                    if ((x > 0 && lastZero < 0) || (x < 0 && lastZero > 0)) zcr++;
                    lastZero = x;
                }
                
                const rms = Math.sqrt(sum / this.bufferLength); // Volume RMS
                const volume = Math.min(100, rms * 100 * 3); // Amplification pour l'UI
                
                // Fréquence dominante
                let maxVal = -Infinity;
                let maxIndex = -1;
                for (let i = 0; i < this.bufferLength; i++) {
                    if (this.dataArray[i] > maxVal) {
                        maxVal = this.dataArray[i];
                        maxIndex = i;
                    }
                }
                const freq = maxIndex * (this.ctx.sampleRate / 2) / this.bufferLength;
                
                // Analyse spectrale (Basses, Médiums, Aigus)
                const bass = this.getAvgFreq(0, 10);
                const mid = this.getAvgFreq(10, 100);
                const high = this.getAvgFreq(100, 400);
                const veryHigh = this.getAvgFreq(400, 800);

                return { volume, freq, zcr, bass, mid, high, veryHigh, raw: this.dataArray };
            },

            getAvgFreq(start, end) {
                let sum = 0;
                for(let i=start; i<end; i++) sum += this.dataArray[i];
                return sum / (end - start);
            }
        };

        // --- LE CERVEAU DE JARVIS (Logique de détection) ---
        const Brain = {
            lastEventTime: 0,
            silenceStart: 0,
            state: {
                snark: true,
                ghost: true
            },

            startLoop() {
                const loop = () => {
                    if (!AudioEngine.isReady) return;
                    const data = AudioEngine.getAnalysis();
                    const now = Date.now();

                    // Mise à jour UI Rapide
                    UI.updateHUD(data);
                    Visuals.draw(data);

                    // --- LOGIQUE DE DÉTECTION "PROFONDE" ---
                    
                    // 1. Détection Silence / Ennui
                    if (data.volume < 5) {
                        if (this.silenceStart === 0) this.silenceStart = now;
                        if (now - this.silenceStart > 10000 && now - this.lastEventTime > 15000 && this.state.snark) {
                            Speech.say("Dites quelque chose. Le silence m'ennuie.", 1.1, 1.1);
                            this.lastEventTime = now;
                            this.silenceStart = 0;
                        }
                    } else {
                        this.silenceStart = 0;
                    }

                    // 2. Détection Transiente (Claquement de mains / Coup sec)
                    // Caractéristique: Montée très brutale du volume + High freq
                    if (data.volume > 45 && data.bass > 100 && now - this.lastEventTime > 1000) {
                        // On vérifie si c'est vraiment un "pic" soudain en comparant avec le frame précédent serait idéal, 
                        // mais ici on utilise la signature spectrale (beaucoup de basses/médiums soudains)
                        this.trigger('CLAP');
                        this.lastEventTime = now;
                    }

                    // 3. Détection "Toux / Raclement de gorge"
                    // Caractéristique: Volume moyen-élevé + Très fort ZCR (Zero Crossing Rate = bruit blanc/chaotique) + High Freq energy
                    // Une voix chantée a un ZCR bas. Une toux a un ZCR très haut.
                    if (data.volume > 20 && data.zcr > 150 && data.veryHigh > 30 && now - this.lastEventTime > 2000) {
                        this.trigger('COUGH');
                        this.lastEventTime = now;
                    }

                    // 4. Détection Sifflement
                    if (data.veryHigh > 80 && data.mid < 40 && data.volume > 15 && now - this.lastEventTime > 3000) {
                        Speech.say("J'entends ce sifflement. C'est vous ou les esprits ?", 1.0, 1.0);
                        this.lastEventTime = now;
                    }

                    requestAnimationFrame(loop);
                };
                loop();
            },

            trigger(type) {
                log(`SIGNAL DÉTECTÉ: ${type} (ZCR: ${AudioEngine.getAnalysis().zcr})`, "audio");
                
                if (type === 'CLAP') {
                    const responses = [
                        "Vous avez frappé dans vos mains. Applaudissements ou appel de détresse ?",
                        "Clap détecté. Je suis là, pas besoin de crier.",
                        "Signal transitoire reçu. Vous avez mesuré mon temps de réaction ?"
                    ];
                    const r = responses[Math.floor(Math.random() * responses.length)];
                    Speech.say(r, 1.0, 1.1);
                    UI.updateText("CLAP DÉTECTÉ", "action");
                } 
                else if (type === 'COUGH') {
                    // La fonctionnalité demandée spécifiquement
                    if (this.state.snark) {
                        const r = Math.random();
                        if (r > 0.5) {
                            Speech.say("Tiens, tu t'es raclé la gorge. Veux-tu un Ricolà ?", 1.05, 1.05);
                        } else {
                            Speech.say("Cette toux semble inquiétante. Voulez-vous que j'appelle les urgences ou un exorciste ?", 0.9, 1.0);
                        }
                    } else {
                         Speech.say("Toux détectée.", 1.0, 1.0);
                    }
                    UI.updateText("TOUX / GORGE IRRITÉE", "action");
                    
                    // Si mode Ghost actif, petite chance de réponse fantôme
                    if (this.state.ghost && Math.random() > 0.7) {
                        setTimeout(() => {
                            const ghosts = ["...c'est froid ici...", "arrête de faire ce bruit...", "je suis aussi malade..."];
                            Speech.sayGhost(ghosts[Math.floor(Math.random() * ghosts.length)]);
                        }, 2000);
                    }
                }
            },

            triggerTest(type) {
                this.trigger(type);
            }
        };

        // --- RECONNAISSANCE VOCALE (Mots) ---
        const VoiceRec = {
            rec: null,
            init() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) return log("Reconnaissance vocale non supportée.", "ghost");
                
                this.rec = new SR();
                this.rec.continuous = true;
                this.rec.interimResults = false; // On veut des résultats finis
                this.rec.lang = 'fr-FR';

                this.rec.onresult = (e) => {
                    const txt = e.results[e.results.length - 1][0].transcript.trim().toLowerCase();
                    log(`PAROLE: "${txt}"`, "audio");
                    Brain.lastEventTime = Date.now(); // Reset le timer d'ennui
                    
                    UI.updateText(`TOI: "${txt.toUpperCase()}"`, "jarvis");

                    // Logique de réponse simple
                    if (txt.includes("jarvis")) {
                        Speech.say("Oui, je vous écoute. Analyse en cours.");
                    } else if (txt.includes("merci")) {
                        Speech.say("Je suis là pour servir.");
                    } else if (txt.includes("fantôme") || txt.includes("esprit")) {
                        if (Brain.state.ghost) {
                            Speech.say("Les capteurs paranormaux sont actifs. Soyez prudent.");
                            setTimeout(() => Speech.sayGhost("Je vois ton âme..."), 3000);
                        } else {
                            Speech.say("Mode fantôme désactivé. Tout est rationnel.");
                        }
                    }
                };

                this.rec.onerror = (e) => { if(e.error !== 'no-speech') console.error(e); };
                this.rec.onend = () => { this.rec.start(); }; // Redémarrage auto
                this.rec.start();
                log("Reconnaissance vocale activée.", "sys");
            }
        };

        // --- VISUELS & UI ---
        const UI = {
            updateText(text, type) {
                const el = $('mainResponse');
                el.innerText = text;
                el.className = ''; // Reset classes
                if (type === 'ghost') el.classList.add('response-ghost');
                else if (type === 'action') el.classList.add('response-action');
                else el.classList.add('response-jarvis');
                
                // Reset couleur après un moment
                setTimeout(() => { if(el.innerText === text) el.className = ''; }, 4000);
            },
            updateHUD(data) {
                if(!data) return;
                $('valVol').innerText = Math.round(data.volume);
                $('barVol').style.width = Math.min(100, data.volume * 2) + '%';
                
                $('valFreq').innerText = Math.round(data.freq);
                // Fréquence log (20Hz-2000Hz -> 0-100%)
                let freqPct = Math.min(100, Math.max(0, (Math.log10(data.freq + 1) / Math.log10(2000)) * 100));
                $('barFreq').style.width = freqPct + '%';
                
                $('debugInfo').innerText = `Z-Crossing: ${Math.round(data.zcr)} | Noise: ${Math.round(data.veryHigh)}`;

                let typeTxt = "SILENCE";
                if (data.volume > 5) typeTxt = "PAROLE/SON";
                if (data.zcr > 100 && data.volume > 15) typeTxt = "BRUIT/TOUX";
                if (data.veryHigh > 60 && data.volume < 20) typeTxt = "SIFFLEMENT";
                
                $('valType').innerText = typeTxt;
            }
        };

        const Visuals = {
            canvas: $('waveCanvas'),
            ctx: $('waveCanvas').getContext('2d'),
            animId: null,
            start() {
                this.canvas.width = this.canvas.clientWidth;
                this.canvas.height = this.canvas.clientHeight;
            },
            draw(data) {
                const w = this.canvas.width;
                const h = this.canvas.height;
                const ctx = this.ctx;

                ctx.clearRect(0, 0, w, h);
                if(!data) return;

                // Dessin spectral (Barres)
                const barWidth = (w / data.raw.length) * 2.5;
                let x = 0;
                
                for(let i = 0; i < data.raw.length; i++) {
                    const barHeight = (data.raw[i] / 255) * h;
                    
                    // Couleur dynamique basée sur la hauteur
                    let r = 0, g = 255, b = 204;
                    if (data.veryHigh > 40 && i > 400) { r = 255; g = 50; b = 50; } // Rouge si bruit aigu

                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(x, h - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }

                // Ligne de forme d'onde
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#fff';
                ctx.beginPath();
                const sliceWidth = w * 1.0 / AudioEngine.bufferLength;
                let waveX = 0;
                
                // On utilise timeData pour la forme d'onde
                for(let i = 0; i < AudioEngine.bufferLength; i++) {
                    const v = AudioEngine.timeData[i] / 128.0;
                    const y = v * h / 2;
                    if(i === 0) ctx.moveTo(waveX, y);
                    else ctx.lineTo(waveX, y);
                    waveX += sliceWidth;
                }
                ctx.stroke();
            }
        };

        const System = {
            modules: { ear: true, ghost: true, snark: true },
            async init() {
                if (AudioEngine.isReady) return;
                Speech.init();
                $('btnStart').classList.add('active');
                $('btnStart').innerText = "ACTIF";
                await AudioEngine.init();
                Speech.say("Système en ligne. J'écoute vos moindres sons.", 1.0, 1.0);
            },
            toggleModule(mod) {
                this.modules[mod] = !this.modules[mod];
                if(mod === 'ghost') {
                    Brain.state.ghost = this.modules[mod];
                    $(`btn${mod.charAt(0).toUpperCase() + mod.slice(1)}`).classList.toggle('active');
                    Speech.say(`Mode Paranormal: ${this.modules[mod] ? 'ACTIVÉ' : 'DÉSACTIVÉ'}.`);
                }
                if(mod === 'snark') {
                    Brain.state.snark = this.modules[mod];
                    $(`btn${mod.charAt(0).toUpperCase() + mod.slice(1)}`).classList.toggle('active');
                    Speech.say(`Humour IA: ${this.modules[mod] ? 'ACTIVÉ' : 'DÉSACTIVÉ'}.`);
                }
                if(mod === 'ear') {
                    // Pas vraiment désactivable pour la démo, mais on peut simuler
                    Speech.say("Mes oreilles sont toujours ouvertes. Je ne peux pas m'éteindre.");
                }
            }
        };

        // Init au chargement (mais attend le clic pour l'audio)
        log("JARVIS v12.0 Prêt. Cliquez sur DÉMARRER.", "sys");

    </script>
</body>
</html>
