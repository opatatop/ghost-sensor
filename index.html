<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050905">
<title>SUPRA LAB v29 — Stop Fix</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#050905;--bg2:#020402;--panel:#081208;--fg:#00ff41;--dim:#007a20;--muted:#004d14;--red:#ff0044;--orange:#ffaa00;--blue:#00ccff;--font:'VT323',monospace;--glow:0 0 10px rgba(0,255,65,.35)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font)}
body{background-image:linear-gradient(rgba(0,255,65,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,65,.025) 1px,transparent 1px);background-size:32px 32px}
button,input,select,textarea{font-family:var(--font);touch-action:manipulation}
.scan,.vig{position:fixed;inset:0;pointer-events:none;z-index:9990}
.scan{background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px)}
.vig{background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.6) 100%)}
.btn{background:transparent;border:3px solid var(--fg);color:var(--fg);padding:10px 18px;font-size:17px;cursor:pointer;box-shadow:var(--glow);transition:.12s}
.btn:hover{background:rgba(0,255,65,.1)}
.btn:active{transform:scale(.96);background:var(--fg);color:var(--bg)}
.btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.blue{border-color:var(--blue);color:var(--blue)}
.btn.on{background:var(--fg)!important;color:var(--bg)!important}
.btn.sm{padding:6px 11px;font-size:14px;border-width:2px}
#boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;border:6px solid var(--fg);background:var(--bg);text-align:center;padding:20px}
#boot h1{font-size:28px;letter-spacing:3px;text-shadow:0 0 15px rgba(0,255,65,.5);min-height:40px}
#boot p{color:var(--orange);margin-top:12px;font-size:15px;opacity:0;transition:.5s;line-height:1.4}
#boot p.show{opacity:1}
#boot .acts{margin-top:26px;display:flex;gap:12px;opacity:0;transition:.5s;flex-wrap:wrap;justify-content:center}
#boot .acts.show{opacity:1}
.blink::after{content:'█';animation:blink .6s step-end infinite}
@keyframes blink{50%{opacity:0}}
#app{display:none;position:fixed;inset:0;border:6px solid var(--fg);flex-direction:column;background:var(--bg)}
#app.show{display:flex}
header{background:var(--panel);border-bottom:3px solid var(--fg);padding:10px 14px;text-align:center;font-size:15px;letter-spacing:2px;position:relative;overflow:hidden}
header::after{content:'v29 STOP FIX  •  STOP = COUPE + RÉÉCOUTE  •  QUE DU RÉEL  •  RIEN D INVENTÉ ';position:absolute;top:1px;left:0;font-size:11px;color:var(--muted);white-space:nowrap;animation:marquee 26s linear infinite}
@keyframes marquee{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
main{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;align-content:start;padding-bottom:105px}
footer{position:absolute;bottom:0;left:0;right:0;background:var(--panel);border-top:3px solid var(--fg);padding:6px 12px;font-size:13px;display:flex;justify-content:space-between}
.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;background:var(--panel);border:3px solid var(--fg)}
.bar .round{width:56px;height:56px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;padding:0}
.bar .round.rec-on{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.1s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,0,68,.5)}100%{box-shadow:0 0 0 14px rgba(255,0,68,0)}}
.timer{font-size:18px;min-width:80px;text-align:center}
.timer.on{color:var(--red);animation:blink 1s step-end infinite}
.sep{width:2px;height:28px;background:var(--muted)}
.live{grid-column:1/-1;background:var(--bg2);border:3px solid var(--fg);position:relative;min-height:80px}
.live .label{position:absolute;top:-10px;left:10px;background:var(--bg2);padding:0 7px;font-size:12px}
.live .badge{position:absolute;top:8px;right:10px;font-size:12px;padding:2px 7px;border:1px solid var(--muted);color:var(--muted)}
.live .badge.listen{color:var(--blue);border-color:var(--blue);animation:blink 1.2s step-end infinite}
.live .badge.rec{color:var(--red);border-color:var(--red);animation:blink .5s step-end infinite}
.live .badge.think{color:var(--orange);border-color:var(--orange)}
.live .badge.ok{color:var(--fg);border-color:var(--fg)}
.live .txt{padding:24px 12px 10px;font-size:18px;line-height:1.35;min-height:60px;word-break:break-word}
.live .txt.dim{color:var(--muted);font-size:14px}
.live .txt.red{color:var(--red)}
.live .txt.orange{color:var(--orange);font-size:15px}
.input-row{grid-column:1/-1;display:flex;background:var(--bg2);border:2px solid var(--dim)}
.input-row .pre{display:flex;align-items:center;padding:0 10px;color:var(--dim);font-size:18px;border-right:2px solid var(--dim)}
.input-row input{flex:1;background:transparent;border:none;color:var(--fg);padding:11px;font-size:16px;outline:none}
.input-row input::placeholder{color:var(--muted)}
.input-row button{border:none;border-left:2px solid var(--dim);background:rgba(0,255,65,.06);color:var(--fg);padding:0 14px;font-size:15px;cursor:pointer}
.panel{background:var(--panel);border:3px solid var(--fg);padding:12px;position:relative;min-height:100px}
.panel .label{position:absolute;top:-10px;left:10px;background:var(--panel);padding:0 7px;font-size:12px}
.panel.full{grid-column:1/-1}
canvas{display:block;width:100%;height:90px;background:var(--bg2);image-rendering:pixelated}
.out{background:var(--bg2);border:2px dashed var(--dim);padding:12px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow-y:auto;min-height:70px;color:var(--dim)}
.log{max-height:130px;overflow-y:auto;font-size:12px;background:var(--bg2);border:2px dashed var(--orange);padding:6px}
.log div{padding:2px 3px;border-left:3px solid transparent;margin:1px 0}
.log .ok{color:var(--dim);border-color:var(--muted)}
.log .err{color:var(--red);border-color:var(--red)}
.log .info{color:var(--orange);border-color:var(--orange)}
.sys{font-size:13px;line-height:1.55}
.stats{font-size:12px;color:var(--muted);margin-top:4px}
#ptt{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);width:115px;height:115px;border-radius:50%;font-size:13px;text-align:center;line-height:1.2;z-index:200;border-width:5px;display:none;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(0,255,65,.4)}
#ptt.show{display:flex}
#ptt:active{transform:translateX(-50%) scale(.93)}
#ptt.rec{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1s ease-out infinite}
dialog{border:5px solid var(--fg);background:var(--bg);color:var(--fg);padding:0;max-width:560px;width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 0 30px rgba(0,255,65,.25)}
dialog::backdrop{background:rgba(0,0,0,.88)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:3px solid var(--fg);font-size:18px}
.db{padding:14px 16px}
.df{display:flex;gap:10px;justify-content:center;padding:12px;border-top:2px solid var(--muted);flex-wrap:wrap}
.fl{margin-bottom:13px}
.fl label{display:block;margin-bottom:5px;font-size:13px}
.fl input[type=text],.fl select,.fl textarea{width:100%;padding:9px;background:var(--bg2);color:var(--fg);border:2px solid var(--dim);font-size:15px;outline:none}
.fl textarea{min-height:70px;resize:vertical}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--fg)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.check input{width:17px;height:17px;accent-color:var(--fg)}
.sec{font-size:15px;margin:16px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--muted)}
.range{display:flex;align-items:center;gap:8px}
.range input{flex:1;accent-color:var(--fg)}
.range span{min-width:42px;text-align:right;color:var(--orange)}
.cam-box{grid-column:1/-1;display:none;flex-direction:column;align-items:center;gap:8px;padding:8px;background:var(--bg2);border:3px solid var(--blue)}
.cam-box.show{display:flex}
video,.preview{max-width:100%;max-height:150px;border:2px solid var(--dim);background:#000;display:none}
.keys-list{max-height:100px;overflow-y:auto;font-size:13px;margin-top:6px}
.key-item{display:flex;justify-content:space-between;align-items:center;padding:7px;border:1px solid var(--muted);margin-bottom:5px;gap:8px}
@media(max-width:600px){#boot h1{font-size:22px}.bar .round{width:50px;height:50px;font-size:11px}#ptt{width:100px;height:100px;font-size:12px;bottom:48px}}
</style>
</head>
<body>
<div class="scan"></div><div class="vig"></div>

<dialog id="dlg">
  <div class="dh"><span>STOP FIX — PARAMÈTRES</span><button class="btn sm" id="x" type="button" style="border:none;box-shadow:none;font-size:22px">&times;</button></div>
  <div class="db">
    <div class="sec">1. Clé API Groq</div>
    <div class="fl"><label>Clé (gsk_...)</label><textarea id="key" placeholder="Colle ta clé" spellcheck="false"></textarea></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn blue" id="paste" type="button" style="flex:1.5">COLLER</button>
      <button class="btn blue" id="test" type="button" style="flex:1">TESTER</button>
      <button class="btn" id="savekey" type="button" style="flex:1">SAUVER</button>
    </div>
    <div class="fl"><label>Clés sauvées</label><div class="keys-list" id="keys-list"></div></div>

    <div class="sec">2. Modèle</div>
    <div class="fl"><label>Modèle</label>
      <select id="model">
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
        <option value="llama-3.1-8b-instant">Llama 3.1 8B Instant</option>
        <option value="meta-llama/llama-4-scout-17b-16e-instruct">Llama 4 Scout</option>
      </select>
    </div>
    <div class="fl"><label>Température <span id="vtemp">0.25</span></label><div class="range"><input type="range" id="temp" min="0.1" max="0.6" step="0.05" value="0.25"></div></div>
    <div class="fl"><label>Max tokens <span id="vtokens">1600</span></label><div class="range"><input type="range" id="tokens" min="400" max="3000" step="100" value="1600"></div></div>

    <div class="sec">3. Écoute</div>
    <div class="fl"><label>Sensibilité <span id="vsens">8</span></label><div class="range"><input type="range" id="sens" min="3" max="22" value="8"></div></div>
    <div class="fl"><label>Silence fin (ms) <span id="vsil">700</span></label><div class="range"><input type="range" id="sil" min="400" max="1500" step="25" value="700"></div></div>
    <div class="fl"><label>Durée mini (ms) <span id="vmin">250</span></label><div class="range"><input type="range" id="min" min="150" max="600" step="20" value="250"></div></div>
    <div class="fl"><label>Durée max (s) <span id="vmax">45</span></label><div class="range"><input type="range" id="max" min="12" max="90" value="45"></div></div>
    <div class="fl"><label class="check"><input type="checkbox" id="always" checked> Toujours répondre</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="noise" checked> Analyser les bruits</label></div>
    <div class="fl"><label>Mots d'appel</label><input type="text" id="wake" value="supra,lab,assistant"></div>

    <div class="sec">4. Voix & Système</div>
    <div class="fl"><label class="check"><input type="checkbox" id="tts" checked> Voix</label></div>
    <div class="fl"><label>Vitesse <span id="vrate">0.93</span></label><div class="range"><input type="range" id="rate" min="0.7" max="1.15" step="0.02" value="0.93"></div></div>
    <div class="fl"><label>Langue</label>
      <select id="lang"><option value="fr">Français</option><option value="en">English</option><option value="es">Español</option></select>
    </div>
    <div class="fl"><label>Couleur</label>
      <select id="col">
        <option value="#00ff41">Vert</option>
        <option value="#00ccff">Cyan</option>
        <option value="#ff6600">Orange</option>
        <option value="#aa00ff">Violet</option>
      </select>
    </div>
    <div class="fl"><label class="check"><input type="checkbox" id="wakelock" checked> Écran allumé</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="debug"> Debug</label></div>
  </div>
  <div class="df">
    <button class="btn" id="save" type="button">SAUVEGARDER</button>
    <button class="btn blue" id="exportcfg" type="button">EXPORT</button>
    <button class="btn red" id="rst" type="button">RESET</button>
  </div>
</dialog>

<section id="boot">
  <h1 class="blink" id="title"></h1>
  <p id="sub"></p>
  <div class="acts" id="acts">
    <button class="btn" id="go" type="button" style="font-size:20px;padding:12px 28px;border-width:4px">LANCER</button>
    <button class="btn" id="cfg" type="button">PARAMÈTRES</button>
  </div>
</section>

<div id="app">
  <header>SUPRA LAB v29 — <span id="mode">STOP FIX</span></header>
  <main>
    <div class="bar">
      <button class="btn round" id="rec" type="button">REC</button>
      <div class="timer" id="timer">00:00</div>
      <button class="btn round" id="stop" type="button" disabled>STOP</button>
      <button class="btn round" id="play" type="button">PLAY</button>
      <div class="sep"></div>
      <button class="btn round blue" id="auto" type="button">AUTO</button>
      <button class="btn round" id="comp" type="button">24/7</button>
      <button class="btn round" id="img" type="button">IMG</button>
      <button class="btn round" id="cam" type="button">CAM</button>
      <button class="btn round" id="sum" type="button">RÉSUMÉ</button>
      <button class="btn round" id="export" type="button">EXPORT</button>
      <button class="btn round red" id="clr" type="button">CLR</button>
      <button class="btn round red" id="mute" type="button">STOP</button>
    </div>

    <input type="file" id="file" accept="image/*" hidden>
    <img id="preview" class="preview" alt="">

    <div class="cam-box" id="cambox">
      <video id="video" autoplay playsinline muted></video>
      <div style="display:flex;gap:8px">
        <button class="btn sm blue" id="capture" type="button">CAPTURER</button>
        <button class="btn sm red" id="camstop" type="button">FERMER</button>
      </div>
    </div>

    <div class="panel"><div class="label">SPECTRO</div><canvas id="c1"></canvas></div>
    <div class="panel"><div class="label">OSCILLO</div><canvas id="c2"></canvas></div>
    <div class="panel"><div class="label">VOLUME</div><canvas id="c3"></canvas></div>

    <div class="live">
      <div class="label">ÉCOUTE</div>
      <div class="badge" id="badge">PRET</div>
      <div class="txt dim" id="live">Dis « stop » → il coupe et réécoute tout de suite</div>
    </div>

    <div class="input-row">
      <div class="pre">&gt;</div>
      <input id="txt" placeholder="Parle ou dis stop..." autocomplete="off">
      <button type="button" id="send">ENVOYER</button>
    </div>

    <div class="panel full"><div class="label">RÉPONSE</div><div class="out" id="out">En attente...</div></div>
    <div class="panel full"><div class="label">JOURNAL</div><div class="log" id="log"></div></div>
    <div class="panel"><div class="label">SYSTÈME</div><div class="sys" id="sys">—</div><div class="stats" id="stats">—</div></div>
  </main>
  <footer><span id="status">En attente...</span><span>v29 Stop Fix | <span id="clock">--:--:--</span></span></footer>
</div>

<button class="btn" id="ptt" type="button">MAINTENIR<br>POUR PARLER</button>
<audio id="audio" hidden></audio>

<script>
(() => {
  const DEFAULT = {
    key:'', model:'llama-3.3-70b-versatile', lang:'fr', tts:true, color:'#00ff41',
    sens:8, silence:700, minSpeech:250, maxRecord:45, always:true, noise:true,
    wakeWords:'supra,lab,assistant', temp:0.25, maxTokens:1600, rate:0.93, wakelock:true, debug:false
  };

  const SYSTEM_PROMPT = `Tu es SUPRA. Tu fais uniquement des interprétations réelles et factuelles.

RÈGLES ABSOLUES :
- Réponds uniquement en texte brut. Aucun * ni markdown.
- Ne commence jamais par "Je vais", "Voici", "D'accord" ou phrase d'introduction.
- Commence directement par les faits.
- Tu n'inventes RIEN.
- Tutoiement. Français. Concis.
- Si on dit stop / arrête / tais-toi → tu t'arrêtes immédiatement.`;

  const STOP_WORDS = ['stop','arrête','arrete','tais-toi','taistoi','silence','shut up','enough','basta','stoppe','arrêtes'];

  let cfg = {...DEFAULT};
  let st = {
    ready:false, ctx:null, an:null, volNode:null, stream:null,
    fdata:null, wdata:null, vdata:null,
    rec:false, mr:null, chunks:[], t0:0, iv:null,
    ptt:false, pmr:null, pchunks:[], piv:null, psec:0,
    auto:false, run:false, comp:false,
    hist:[], mem:'', img:null, cam:null, camOn:false,
    ctrl:null, reqs:0, lat:0, tokens:0, savedKeys:[], summarizing:false,
    lastVol:0, noiseCount:0, stopping:false
  };
  let caps = [];

  const $ = s => document.querySelector(s);
  const now = () => new Date().toLocaleTimeString('fr-FR');
  const pad = n => n<10?'0'+n:n;
  const fmt = s => pad(Math.floor(s/60))+':'+pad(s%60);
  const clean = k => String(k||'').replace(/[\u200B-\u200D\uFEFF\u00A0\s]/g,'').trim();
  const valid = k => typeof k==='string' && k.startsWith('gsk_') && k.length>30;
  const sleep = ms => new Promise(r => setTimeout(r,ms));

  function isStop(text){
    if(!text) return false;
    const t = text.toLowerCase().trim();
    // Détection plus large et fiable
    return STOP_WORDS.some(w => 
      t === w || 
      t.startsWith(w + ' ') || 
      t.endsWith(' ' + w) || 
      t.includes(' ' + w + ' ') ||
      t.includes(w)
    );
  }

  function log(m,t='ok'){
    const el=$('#log'); if(!el)return;
    const d=document.createElement('div');
    d.className=t; d.textContent=`[${now()}] ${m}`;
    el.appendChild(d); el.scrollTop=el.scrollHeight;
    while(el.children.length>100) el.firstChild.remove();
    if(cfg.debug) console.log('[SUPRA]',m);
  }
  function status(t){$('#status').textContent=t;}
  function sys(){
    const ok=v=>`<span style="color:var(--fg)">${v}</span>`;
    const ko=v=>`<span style="color:var(--red)">${v}</span>`;
    const wa=v=>`<span style="color:var(--orange)">${v}</span>`;
    $('#sys').innerHTML=`Micro ${st.stream?ok('OK'):ko('OFF')} · API ${valid(cfg.key)?ok('OK'):ko('—')}<br>Mode ${st.comp?wa('24/7'):st.auto?wa('AUTO'):ok('PTT')}<br>Bruit ${cfg.noise?'ON':'off'}`;
    $('#stats').textContent=`≈${st.tokens} tok · ${st.lat||'—'}ms · ${st.reqs} req`;
  }
  function live(txt,mode){
    const t=$('#live'),b=$('#badge');
    t.className='txt'; b.className='badge';
    if(mode==='idle'){t.classList.add('dim');t.textContent=txt;b.textContent='PRET';}
    else if(mode==='listen'){t.classList.add('dim');t.textContent=txt;b.textContent='ECOUTE';b.classList.add('listen');}
    else if(mode==='rec'){t.classList.add('red');t.textContent=txt;b.textContent='REC';b.classList.add('rec');}
    else if(mode==='think'){t.classList.add('orange');t.textContent=txt;b.textContent='...';b.classList.add('think');}
    else if(mode==='ok'){t.textContent=txt;b.textContent='OK';b.classList.add('ok');}
  }
  function type(el,str,speed=24){
    return new Promise(res=>{
      let i=0; el.textContent=''; el.classList.add('blink');
      const iv=setInterval(()=>{
        el.textContent+=str[i++];
        if(i>=str.length){clearInterval(iv);el.classList.remove('blink');res();}
      },speed);
    });
  }

  function loadKeys(){
    try{st.savedKeys=JSON.parse(localStorage.getItem('sl29_keys')||'[]');}catch{st.savedKeys=[];}
    renderKeys();
  }
  function saveKeys(){localStorage.setItem('sl29_keys',JSON.stringify(st.savedKeys));renderKeys();}
  function renderKeys(){
    const list=$('#keys-list'); if(!list)return;
    if(!st.savedKeys.length){list.innerHTML='<div style="padding:8px;color:var(--muted)">Aucune</div>';return;}
    list.innerHTML='';
    st.savedKeys.forEach((k,i)=>{
      const div=document.createElement('div');
      div.className='key-item';
      div.innerHTML=`<div style="flex:1;min-width:0"><div>${k.name||'Clé'}</div><div style="font-size:11px;color:var(--muted)">${k.key.slice(0,16)}...</div></div>
        <button class="btn sm blue" data-i="${i}" data-a="use">USE</button>
        <button class="btn sm red" data-i="${i}" data-a="del">DEL</button>`;
      div.querySelectorAll('button').forEach(btn=>{
        btn.onclick=()=>{
          const idx=+btn.dataset.i;
          if(btn.dataset.a==='use'){cfg.key=st.savedKeys[idx].key;$('#key').value=cfg.key;localStorage.setItem('sl29',JSON.stringify(cfg));apply();log('Clé OK');}
          else if(confirm('Supprimer ?')){st.savedKeys.splice(idx,1);saveKeys();}
        };
      });

  async function initAudio(){
    try{
      st.ctx=new(AudioContext||webkitAudioContext)({sampleRate:48000});
      await st.ctx.resume();
      st.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      const src=st.ctx.createMediaStreamSource(st.stream);
      st.an=st.ctx.createAnalyser();st.an.fftSize=2048;st.an.smoothingTimeConstant=.78;
      src.connect(st.an);
      st.fdata=new Uint8Array(st.an.frequencyBinCount);
      st.wdata=new Uint8Array(st.an.frequencyBinCount);
      st.volNode=st.ctx.createAnalyser();st.volNode.fftSize=256;
      src.connect(st.volNode);
      st.vdata=new Uint8Array(st.volNode.frequencyBinCount);
      st.ready=true;size();loop();sys();log('Audio OK');return true;
    }catch(e){log('Micro: '+e.message,'err');return false;}
  }
  function vol(){
    if(!st.volNode)return 0;
    st.volNode.getByteFrequencyData(st.vdata);
    let s=0;for(let i=0;i<st.vdata.length;i++)s+=st.vdata[i];
    return s/st.vdata.length;
  }
  function loop(){
    if(!st.ready)return;
    requestAnimationFrame(loop);
    st.an.getByteFrequencyData(st.fdata);
    st.an.getByteTimeDomainData(st.wdata);
    st.volNode.getByteFrequencyData(st.vdata);
    draw1();draw2();draw3();
  }
  function draw1(){const c=$('#c1');if(!c)return;const x=c.getContext('2d'),w=c.width,h=c.height;x.fillStyle='#020402';x.fillRect(0,0,w,h);const n=st.fdata.length,bw=Math.max(1,w/n);for(let i=0;i<n;i++){const v=st.fdata[i];if(v<3)continue;const bh=Math.log10(v+1)*18;x.fillStyle=`hsl(${Math.max(0,110-v*.4)},100%,${Math.max(15,v*.3)}%)`;x.fillRect(i*bw,h-bh,bw+.3,bh);}}
  function draw2(){const c=$('#c2');if(!c)return;const x=c.getContext('2d'),w=c.width,h=c.height;x.fillStyle='#020402';x.fillRect(0,0,w,h);const col=getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();x.strokeStyle=col;x.lineWidth=1.5;x.beginPath();const step=w/st.wdata.length;for(let i=0;i<st.wdata.length;i++){const y=(st.wdata[i]/128-.5)*h*.75+h/2;i?x.lineTo(i*step,y):x.moveTo(0,y);}x.stroke();}
  function draw3(){const c=$('#c3');if(!c)return;const x=c.getContext('2d'),w=c.width,h=c.height;x.fillStyle='#020402';x.fillRect(0,0,w,h);let s=0;for(let i=0;i<st.vdata.length;i++)s+=st.vdata[i];const p=s/st.vdata.length/255;const bw=w*.38,bh=Math.max(2,p*h*.8);x.fillStyle=`hsl(${Math.max(0,120-p*160)},100%,40%)`;x.fillRect((w-bw)/2,h-bh,bw,bh);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();x.font='16px VT323';x.textAlign='center';x.textBaseline='middle';x.fillText(Math.round(p*100)+'%',w/2,h/2);}
  function size(){document.querySelectorAll('canvas').forEach(c=>{const r=c.parentElement.getBoundingClientRect();c.width=Math.max(60,r.width-24);c.height=90;});}
  function mime(){for(const m of['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'])if(MediaRecorder.isTypeSupported(m))return m;return '';}

  function waitSpeak(){
    return new Promise(res=>{
      let t=null;
      const tick=()=>{
        if(!st.auto)return res(false);
        if(vol()>=cfg.sens){if(!t)t=Date.now();if(Date.now()-t>=cfg.minSpeech)return res(true);}
        else t=null;
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }
  function recUntilSilent(){
    return new Promise(res=>{
      const chunks=[];let rec;
      try{rec=new MediaRecorder(st.stream,{mimeType:mime()});}catch{return res(null);}
      rec.ondataavailable=e=>e.data?.size&&chunks.push(e.data);
      rec.onstop=()=>res(new Blob(chunks,{type:rec.mimeType}));
      const start=Date.now();let last=Date.now();let spoken=false;const max=cfg.maxRecord*1000;
      const iv=setInterval(()=>{
        if(!st.auto){clearInterval(iv);rec.state==='recording'&&rec.stop();return;}
        const v=vol();
        if(v>=cfg.sens*0.38){last=Date.now();spoken=true;st.lastVol=v;}
        if(spoken&&(Date.now()-last>=cfg.silence||Date.now()-start>=max)){clearInterval(iv);rec.state==='recording'&&rec.stop();}
      },28);
      rec.start(35);
      setTimeout(()=>rec.state==='recording'&&rec.stop(),max+250);
    });
  }

  // ===== STOP AMÉLIORÉ =====
  function forceStop(){
    st.stopping = true;
    speechSynthesis?.cancel();
    if(st.ctrl){
      try{ st.ctrl.abort(); }catch(e){}
      st.ctrl = null;
    }
    live('Stop — j\'écoute', 'listen');
    log('STOP reçu → réécoute', 'info');
    status(st.auto ? (st.comp ? '24/7' : 'AUTO') : 'Prêt');
    setTimeout(()=>{ st.stopping = false; }, 600);
  }

  function startRec(){
    if(st.rec||!st.stream)return;
    const m=mime();if(!m)return log('Format non supporté','err');
    st.rec=true;st.chunks=[];st.t0=Date.now();
    try{st.mr=new MediaRecorder(st.stream,{mimeType:m});}catch{st.rec=false;return;}
    st.mr.ondataavailable=e=>e.data?.size&&st.chunks.push(e.data);
    st.mr.onstop=()=>{const blob=new Blob(st.chunks,{type:st.mr.mimeType});const url=URL.createObjectURL(blob);caps.unshift({url,blob,dur:Math.floor((Date.now()-st.t0)/1000)});status('Prêt');};
    st.mr.start(200);
    $('#rec').classList.add('rec-on');$('#stop').disabled=false;$('#timer').classList.add('on');
    status('REC...');let s=0;$('#timer').textContent='00:00';
    st.iv=setInterval(()=>{s++;$('#timer').textContent=fmt(s);},1000);
  }
  function stopRec(){
    if(!st.rec)return;st.rec=false;
    if(st.mr?.state==='recording')st.mr.stop();
    $('#rec').classList.remove('rec-on');$('#stop').disabled=true;$('#timer').classList.remove('on');
    clearInterval(st.iv);$('#timer').textContent='00:00';
  }

  function pttDown(e){
    e.preventDefault();
    if(!st.ready||st.auto||st.ptt)return;
    st.ptt=true;st.pchunks=[];st.psec=0;
    try{st.pmr=new MediaRecorder(st.stream,{mimeType:mime()});}catch{st.ptt=false;return;}
    st.pmr.ondataavailable=e=>e.data?.size&&st.pchunks.push(e.data);
    st.pmr.onstop=pttDone;st.pmr.start(150);
    $('#ptt').classList.add('rec');$('#ptt').innerHTML='REC...<br><small>relâche</small>';
    st.piv=setInterval(()=>{st.psec++;live('Enregistrement '+fmt(st.psec),'rec');},1000);
    live('Enregistrement 00:00','rec');
  }
  function pttUp(e){
    e.preventDefault();if(!st.ptt)return;
    st.ptt=false;clearInterval(st.piv);
    $('#ptt').classList.remove('rec');$('#ptt').innerHTML='MAINTENIR<br>POUR PARLER';
    setTimeout(()=>st.pmr?.state==='recording'&&st.pmr.stop(),220);

  async function pttDone(){
    const blob=new Blob(st.pchunks,{type:st.pmr?.mimeType||mime()});
    if(blob.size<500){live('Trop court','idle');return;}
    live('Transcription...','think');
    const text=await whisper(blob);
    if(!text){live('Rien compris','idle');return;}

  async function autoStart(comp){
    if(st.run)return;
    st.auto=true;st.run=true;st.comp=!!comp;
    $('#auto').classList.toggle('on',!comp);
    $('#comp').classList.toggle('on',!!comp);
    $('#mode').textContent=comp?'24/7':'AUTO';
    live(comp?'24/7 actif — dis stop pour couper':'Écoute... (dis stop)','listen');
    status(comp?'24/7':'AUTO');sys();log(comp?'24/7':'AUTO','info');

    while(st.auto){
      try{
        if(document.hidden){await sleep(250);continue;}
        if(st.stopping){await sleep(300);continue;}
        if(!await waitSpeak())continue;
        if(!st.auto)break;
        live('Écoute...','rec');
        const blob=await recUntilSilent();
        if(!st.auto)break;
        if(!blob||blob.size<500){
          live(st.comp?'En écoute...':'Écoute...','listen');continue;
        }

        const volLevel = Math.round(st.lastVol);
        live('...','think');
        const text=await whisper(blob);
        if(!st.auto)break;

        // ★★★ STOP PRIORITAIRE ★★★
        if(text && isStop(text)){
          forceStop();
          await sleep(500);

        }

        if(!text){
          if(cfg.noise && volLevel > 5){
            st.noiseCount++;
            const prompt = `Bruit détecté. Volume ${volLevel}. Aucune parole claire. Décris uniquement ce que ce son est probablement d'un point de vue réel et physique. N'invente rien.`;
            live('Bruit détecté...','think');
            await chat(prompt,true);
          }else{
            live(st.comp?'En écoute...':'Écoute...','listen');
          }
          continue;
        }

        live(text,'ok');
        await chat(text,true);
        live(st.comp?'En écoute...':'Écoute...','listen');
        await sleep(120);
      }catch(e){log('Auto: '+e.message,'err');await sleep(350);}
    }
    st.run=false;st.comp=false;

  async function whisper(blob){
    if(!valid(cfg.key)){log('Clé manquante','err');return null;}
    let ext='webm';if(blob.type.includes('ogg'))ext='ogg';else if(blob.type.includes('mp4'))ext='m4a';
    const t0=performance.now();
    try{
      const fd=new FormData();
      fd.append('file',blob,'a.'+ext);
      fd.append('model','whisper-large-v3-turbo');
      fd.append('language',cfg.lang);
      fd.append('response_format','json');
      const r=await fetch('https://api.groq.com/openai/v1/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+cfg.key},body:fd});
      if(!r.ok)throw new Error((await r.text()).slice(0,80));
      const d=await r.json();
      st.lat=Math.round(performance.now()-t0);st.reqs++;sys();
      const text=(d.text||'').trim();
      if(text)log('→ '+text);
      return text||null;
    }catch(e){log('Whisper: '+e.message,'err');return null;}
  }

  async function chat(text,fromAuto=false){
    if(!valid(cfg.key)){$('#out').textContent='Clé API manquante';return;}
    if(fromAuto&&!cfg.always&&!st.comp){
      const low=text.toLowerCase();
      const words=(cfg.wakeWords||'').toLowerCase().split(',');
      if(!words.some(w=>w.trim()&&low.includes(w.trim())) && !text.startsWith('Bruit détecté')){
        live('Pas pour moi','listen');return;
      }
    }
    if(st.ctrl)try{st.ctrl.abort();}catch{}
    st.ctrl=new AbortController();
    live('...','think');
    $('#out').textContent='';status('Stream...');

    let system = SYSTEM_PROMPT;
    if(st.comp) system += `\nMode compagnon permanent.`;
    if(st.mem) system += `\n\nMémoire:\n${st.mem}`;

    st.hist.push({role:'user',content:text});
    if(st.hist.length>16)await summarize();

    const messages=[{role:'system',content:system},...st.hist];
    const t0=performance.now();

    try{
      const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:'Bearer '+cfg.key},
        body:JSON.stringify({model:cfg.model,messages,temperature:cfg.temp,max_tokens:cfg.maxTokens,stream:true}),
        signal:st.ctrl.signal
      });
      if(!r.ok)throw new Error((await r.text()).slice(0,100));

      const reader=r.body.getReader();
      const dec=new TextDecoder();
      let full='',buf='';
      $('#out').textContent='';

      while(true){
        if(st.stopping) break;
        const{done,value}=await reader.read();
        if(done)break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n');
        buf=lines.pop()||'';
        for(const line of lines){
          if(!line.startsWith('data: '))continue;
          const raw=line.slice(6);
          if(raw==='[DONE]')continue;
          try{
            const j=JSON.parse(raw);
            const d=j.choices?.[0]?.delta?.content;
            if(d){full+=d;$('#out').textContent=full;$('#out').scrollTop=$('#out').scrollHeight;}
          }catch{}
        }
      }

      if(st.stopping){
        forceStop();
        return;
      }

      full=full.replace(/\*{1,5}/g,'').trim()||'...';
      st.hist.push({role:'assistant',content:full});
      st.tokens+=Math.ceil((text.length+full.length)/3.8);
      st.lat=Math.round(performance.now()-t0);st.reqs++;sys();
      $('#out').textContent=full+'\n\n'+now();
      log(`OK ${st.lat}ms`);
      status(st.auto?(st.comp?'24/7':'AUTO'):'Prêt');
      speak(full);
    }catch(e){
      if(e.name==='AbortError' || st.stopping){
        forceStop();
        return;
      }
      $('#out').textContent='Erreur: '+e.message;
      log(e.message,'err');live('Erreur','idle');
    }finally{st.ctrl=null;}
  }

  async function summarize(){
    if(st.summarizing||st.hist.length<12)return;
    st.summarizing=true;
    const old=st.hist.splice(0,st.hist.length-4);
    const txt=old.map(m=>m.role+': '+m.content).join('\n');
    try{
      const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:'Bearer '+cfg.key},
        body:JSON.stringify({
          model:'llama-3.1-8b-instant',
          messages:[{role:'system',content:'Résume densément en texte brut. Aucun astérisque. Que des faits.'},{role:'user',content:(st.mem?st.mem+'\n\n':'')+txt}],
          temperature:0.15,max_tokens:400
        })
      });
      if(r.ok){
        const d=await r.json();
        const s=(d.choices?.[0]?.message?.content||'').replace(/\*{1,5}/g,'').trim();
        if(s){st.mem=s;log('Mémoire résumée','info');}
      }

    st.summarizing=false;sys();
  }

  function speak(t){
    if(!cfg.tts||!window.speechSynthesis||!t||st.stopping)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t.slice(0,800));
    u.lang=cfg.lang==='fr'?'fr-FR':cfg.lang==='es'?'es-ES':'en-US';
    u.rate=cfg.rate;
    const vs=speechSynthesis.getVoices();
    for(const v of vs)if(v.lang.startsWith(cfg.lang)){u.voice=v;break;}
    speechSynthesis.speak(u);
  }

      live(t,'ok');chat(t);
    };
    $('#txt').onkeydown=e=>e.key==='Enter'&&$('#send').click();
    document.onkeydown=e=>{
      if(e.key==='Escape') forceStop();
    };

    const p=$('#ptt');
    p.addEventListener('touchstart',pttDown,{passive:false});
    p.addEventListener('touchend',pttUp,{passive:false});
    p.addEventListener('mousedown',pttDown);
    p.addEventListener('mouseup',pttUp);
    p.addEventListener('mouseleave',pttUp);

    ['sens','sil','min','max','temp','tokens','rate'].forEach(id=>{
      const el=$('#'+id);if(el)el.oninput=()=>$('#v'+id).textContent=el.value;
    });
    window.onresize=()=>st.ready&&size();
  }

  window.onbeforeunload=()=>{stopCam();st.stream?.getTracks().forEach(t=>t.stop());speechSynthesis?.cancel();};

  document.addEventListener('DOMContentLoaded',async()=>{
    load();bind();
    setInterval(()=>$('#clock').textContent=now(),1000);
    await type($('#title'),'SUPRA LAB v29',24);
    $('#sub').innerHTML='STOP FIX — dis « stop » et il coupe + réécoute tout de suite<br><span style="color:var(--blue)">Que du réel, rien d\'inventé</span>';
    $('#sub').classList.add('show');$('#acts').classList.add('show');
  });
})();
</script>
</body>
</html>
