<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🛡️ SUPRA LAB v11 - TOUT FONCTIONNEL</title>
    <style>
        :root {
            --primary: #00ff41;
            --secondary: #00cc33;
            --danger: #ff0044;
            --warning: #ffaa00;
            --bg-dark: #001100;
            --bg-darker: #000000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
        body {
            background: var(--bg-darker);
            color: var(--primary);
            min-height: 100vh;
            padding: 10px;
        }
        #start-screen, #main {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: var(--bg-darker);
        }
        #main { display: none; padding: 10px; gap: 10px; overflow-y: auto; }
        .boot-text {
            font-size: 24px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px var(--primary);
            text-align: center;
        }
        button {
            background: var(--bg-dark);
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 12px 24px;
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: var(--primary); color: var(--bg-darker); }
        #btnStart { padding: 15px 30px; font-size: 18px; }
        .panel {
            background: var(--bg-dark);
            border: 1px solid var(--primary);
            padding: 15px;
            margin: 10px 0;
            width: 100%;
        }
        .panel-header {
            margin-bottom: 10px;
            font-size: 16px;
            color: var(--secondary);
        }
        #log {
            height: 200px;
            overflow-y: auto;
            font-size: 14px;
            white-space: pre-wrap;
        }
        .log-line { margin-bottom: 5px; }
        .log-line::before { content: "> "; color: var(--secondary); }
        .log-line.important { color: var(--danger) !important; }
        #ai-report {
            min-height: 150px;
            font-size: 14px;
            white-space: pre-wrap;
            background: var(--bg-dark);
            border: 1px dashed var(--primary);
            padding: 15px;
        }
        #settings-page {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            padding: 20px;
            z-index: 101;
            overflow-y: auto;
        }
        #settings-page.active { display: block; }
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-dark);
            border-top: 1px solid var(--primary);
            padding: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        #voiceToggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: var(--bg-darker);
            font-size: 20px;
            cursor: pointer;
        }
        #micIndicator {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--bg-dark);
            border: 2px solid var(--secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        #micIndicator.listening {
            background: var(--primary);
            border-color: var(--primary);
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .alert {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-dark);
            border: 2px solid var(--danger);
            padding: 15px;
            font-size: 16px;
            text-align: center;
            z-index: 20000;
            display: none;
        }
        .alert.active { display: block; }
    </style>
</head>
<body>
    <!-- ÉCRAN DE DÉMARRAGE -->
    <div id="start-screen">
        <div class="boot-text">🛡️ SUPRA LAB v11<br><span style="color: var(--warning);">TOUT FONCTIONNEL</span></div>
        <button id="btnStart">🚀 LANCER LE SYSTÈME</button>
        <button id="btnSettings">⚙️ PARAMÈTRES</button>
    </div>

    <!-- INTERFACE PRINCIPALE -->
    <div id="main">
        <div class="panel">
            <div class="panel-header">🤖 ANALYSE IA</div>
            <div id="ai-report">[EN ATTENTE...]</div>
            <div style="margin-top: 10px; text-align: center;">
                <button id="sendToGroqBtn">📤 ENVOYER À GROQ</button>
                <button id="readReportBtn">🔊 LIRE RAPPORT</button>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header">📜 LOG SYSTÈME</div>
            <div id="log"></div>
        </div>
    </div>

    <!-- PAGE DE PARAMÈTRES -->
    <div id="settings-page">
        <div style="text-align: center; margin-bottom: 20px; color: var(--primary);">
            ⚙️ PARAMÈTRES
            <button id="closeSettings" style="position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--primary); font-size: 24px; cursor: pointer;">✕</button>
        </div>
        <div style="background: var(--bg-dark); border: 1px solid var(--primary); padding: 15px; margin-bottom: 15px;">
            <div style="margin-bottom: 10px;">
                <label for="groqApiKey" style="display: block; margin-bottom: 5px;">Clé API Groq:</label>
                <input type="text" id="groqApiKey" placeholder="Tapez votre clé API ici" style="width: 100%; padding: 8px; background: #000; color: var(--primary); border: 1px solid var(--primary);">
                <button id="testApiKeyBtn" style="margin-top: 10px; width: 100%;">🧪 Tester la clé</button>
                <div id="apiTestResult" style="margin-top: 10px; font-size: 14px;"></div>
            </div>
        </div>
        <div style="background: var(--bg-dark); border: 1px solid var(--primary); padding: 15px; margin-bottom: 15px;">
            <div style="margin-bottom: 10px;">
                <label><input type="checkbox" id="voiceFeedback" checked style="margin-right: 8px;"> L'IA PARLE</label>
            </div>
            <div style="margin-bottom: 10px;">
                <label><input type="checkbox" id="voiceAlerts" checked style="margin-right: 8px;"> ALERTES VOCALES</label>
            </div>
            <div style="margin-bottom: 10px;">
                <label for="voiceLanguage" style="display: block; margin-bottom: 5px;">Langue:</label>
                <select id="voiceLanguage" style="width: 100%; padding: 8px; background: #000; color: var(--primary); border: 1px solid var(--primary);">
                    <option value="fr-FR">Français</option>
                    <option value="en-US">Anglais</option>
                </select>
            </div>
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <button id="saveSettings" style="padding: 10px 20px; margin: 0 10px;">💾 Sauvegarder</button>
            <button id="closeSettings2" style="padding: 10px 20px; margin: 0 10px;">Fermer</button>
        </div>
    </div>

    <!-- BOUTONS VOIX -->
    <button id="voiceToggle" title="Activer/Désactiver la voix">🎤</button>
    <div id="micIndicator" title="État du micro">🎤</div>

    <!-- BARRE DE STATUS -->
    <div class="status-bar">
        <span id="status-text">En attente...</span>
        <span>v11 - Tout fonctionnel</span>
    </div>

    <!-- ALERTE -->
    <div class="alert" id="criticalAlert">⚠️ ALERTE: <span id="alert-message"></span></div>

    <script>
        // ========== CONFIGURATION ==========
        let config = {
            groqApiKey: localStorage.getItem('groqApiKey') || '',
            voiceFeedback: true,
            voiceAlerts: true,
            voiceLanguage: 'fr-FR'
        };
        let finalTranscript = '';
        let recognition = null;
        let isListening = false;
        let isVoiceEnabled = false;
        let synthesis = window.speechSynthesis;
        let isSpeaking = false;

        // ========== INITIALISATION ==========
        document.addEventListener('DOMContentLoaded', () => {
            setupUI();
            loadVoices();
            checkPermissions();
            if (config.groqApiKey) document.getElementById('groqApiKey').value = config.groqApiKey;
        });

        // ========== FONCTIONS DE BASE ==========
        function log(text, important = false) {
            const logDiv = document.getElementById('log');
            if (!logDiv) return;
            const line = document.createElement('div');
            line.className = 'log-line' + (important ? ' important' : '');
            line.innerHTML = `<span style="color: #00ff00;">[${new Date().toLocaleTimeString('fr-FR')}]</span> ${text}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(txt) {
            document.getElementById('status-text').textContent = txt;
        }

        function showAlert(message, speak = true) {
            const alertBox = document.getElementById('criticalAlert');
            const alertMsg = document.getElementById('alert-message');
            if (alertMsg) alertMsg.textContent = message;
            if (alertBox) {
                alertBox.classList.add('active');
                if (speak && config.voiceAlerts && isVoiceEnabled) speakText(`Alerte: ${message}`);
                setTimeout(() => alertBox.classList.remove('active'), 5000);
            }
        }

        function loadVoices() {
            if ('speechSynthesis' in window) {
                synthesis.getVoices();
                if (synthesis.onvoiceschanged) synthesis.onvoiceschanged = loadVoices;
            }
        }

        function getVoice(lang) {
            const voices = synthesis.getVoices();
            return voices.find(v => v.lang.startsWith(lang)) || voices[0];
        }

        function speakText(text, interrupt = true) {
            if (!config.voiceFeedback || !isVoiceEnabled || !synthesis) return;
            if (isSpeaking) {
                if (interrupt) {
                    synthesis.cancel();
                    isSpeaking = false;
                } else {
                    setTimeout(() => speakText(text, false), 500);
                    return;
                }
            }
            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = config.voiceLanguage;
                utterance.voice = getVoice(config.voiceLanguage);
                utterance.onstart = () => isSpeaking = true;
                utterance.onend = () => isSpeaking = false;
                utterance.onerror = () => isSpeaking = false;
                synthesis.speak(utterance);
                log(`[VOIX] "${text}"`);
            } catch (e) {
                log(`[VOIX ERREUR] ${e.message}`, true);
            }
        }

        function stopSpeaking() {
            if (synthesis && isSpeaking) {
                synthesis.cancel();
                isSpeaking = false;
            }
        }

        // ========== VÉRIFIE LES PERMISSIONS ==========
        function checkPermissions() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                log("[ERREUR] Reconnaissance vocale non supportée ! Utilisez Chrome.", true);
                document.getElementById('micIndicator').classList.add('error');
            }
        }

        async function checkMicrophonePermission() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                log("[PERMISSION] ✅ Micro autorisé !", true);
                return true;
            } catch (err) {
                log(`[PERMISSION ERREUR] ${err.message}`, true);
                if (err.name === 'NotAllowedError') {
                    showAlert("Activez la permission MICROPHONE dans les paramètres !");
                    document.getElementById('micIndicator').classList.add('error');
                }
                return false;
            }
        }

        // ========== TEST DE CLÉ API GROQ ==========
        async function testGroqApiKey() {
            const apiKey = document.getElementById('groqApiKey').value.trim();
            if (!apiKey) {
                document.getElementById('apiTestResult').textContent = "⚠️ Aucune clé API saisie";
                document.getElementById('apiTestResult').style.color = "#ffaa00";
                return;
            }

            log("[GROQ] Test de la clé API en cours...", true);
            updateStatus("Test API Groq...");

            try {
                const response = await fetch('https://api.groq.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "mixtral-8x7b-32768",
                        messages: [{ role: "user", content: "Réponds 'OK' si tu reçois ce message." }],
                        temperature: 0.3,
                        max_tokens: 10
                    })
                });

                if (!response.ok) throw new Error(`Erreur ${response.status}`);

                const data = await response.json();
                const result = data.choices[0].message.content.trim();

                if (result === "OK" || result.includes("OK")) {
                    log("[GROQ] ✅ Clé API VALIDE !", true);
                    document.getElementById('apiTestResult').textContent = "✅ Clé API valide";
                    document.getElementById('apiTestResult').style.color = "#00ff41";
                    config.groqApiKey = apiKey;
                    localStorage.setItem('groqApiKey', apiKey);
                } else {
                    document.getElementById('apiTestResult').textContent = "⚠️ Réponse inattendue";
                    document.getElementById('apiTestResult').style.color = "#ffaa00";
                }
                updateStatus("Prêt");
            } catch (error) {
                log(`[GROQ ERREUR] ${error.message}`, true);
                document.getElementById('apiTestResult').textContent = `❌ Erreur: ${error.message}`;
                document.getElementById('apiTestResult').style.color = "#ff0044";
                updateStatus("Erreur API Groq");
            }
        }

        // ========== RECONNAISSANCE VOCALE ==========
        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                log("[ERREUR] Reconnaissance vocale non supportée ! Utilisez Chrome.", true);
                document.getElementById('micIndicator').classList.add('error');
                showAlert("Utilisez Chrome et activez le micro.");
                return;
            }

            try {
                if (recognition) {
                    recognition.stop();
                    recognition = null;
                }

                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'fr-FR';
                recognition.maxAlternatives = 1;

                finalTranscript = '';

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    let finalTranscriptPart = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscriptPart += transcript;
                        } else {
                            interimTranscript += transcript;
                        }
                    }
                    if (interimTranscript) log(`[IA] "${interimTranscript}"`);
                    if (finalTranscriptPart) {
                        finalTranscript = finalTranscriptPart;
                        log(`[IA] ✅ "${finalTranscript}"`);
                        processFinalTranscript(finalTranscript);
                    }
                };

                recognition.onerror = (event) => {
                    log(`[IA ERREUR] ${event.error}`, true);
                    if (event.error === 'not-allowed') {
                        document.getElementById('micIndicator').classList.add('error');
                        showAlert("Activez la permission MICROPHONE !");
                    }
                    if (isVoiceEnabled) setTimeout(initSpeech, 1000);
                };

                recognition.onstart = () => {
                    isListening = true;
                    log("[IA] Écoute active. Parlez !", true);
                    updateStatus("IA: Écoute en cours...");
                    document.getElementById('micIndicator').classList.add('listening');
                    document.getElementById('voiceToggle').classList.add('active');
                };

                recognition.onend = () => {
                    isListening = false;
                    updateStatus("IA: En attente");
                    document.getElementById('micIndicator').classList.remove('listening');
                    document.getElementById('voiceToggle').classList.remove('active');
                    if (isVoiceEnabled) setTimeout(() => { try { recognition.start(); } catch (e) {} }, 100);
                };

                recognition.start();
                isVoiceEnabled = true;
                log("[IA] Transmission vocale active.", true);
            } catch (e) {
                log(`[IA ERREUR] ${e.message}`, true);
                document.getElementById('micIndicator').classList.add('error');
            }
        }

        function stopSpeechRecognition() {
            if (recognition) {
                recognition.stop();
                isVoiceEnabled = false;
                isListening = false;
                document.getElementById('micIndicator').classList.remove('listening');
                document.getElementById('voiceToggle').classList.remove('active');
                updateStatus("IA: Désactivée");
            }
        }

        function processFinalTranscript(transcript) {
            if (!transcript) return;

            const report = `
// ======================
// RAPPORT RÉEL
// Généré le: ${new Date().toLocaleString('fr-FR')}
// ======================
[TRANSMISSION]
> "${transcript}"

[ANOMALIES]
> ${['drone','avion','esprit','EVP','fantôme','SOS','alerte','clic','son','urgence'].some(k => transcript.toLowerCase().includes(k)) ? "Mot-clé détecté" : "Aucun mot-clé"}

[ANALYSE]
> ${['drone','avion','esprit','EVP','fantôme','SOS','alerte','clic','son','urgence'].some(k => transcript.toLowerCase().includes(k)) ? "RECOMMANDATION: Investiguer !" : "Aucune menace détectée."}
// ======================
            `;

            document.getElementById('ai-report').textContent = report;
            if (config.voiceFeedback && isVoiceEnabled) speakText(`Analyse terminée pour: ${transcript}`);
            if (config.groqApiKey) sendToGroq(transcript, report);
            else log("[IA] Clé API Groq manquante. Mode local.", true);
        }

        // ========== ENVOI À GROQ ==========
        async function sendToGroq(transcript, localReport) {
            if (!config.groqApiKey) {
                log("[GROQ] Clé API manquante.", true);
                return;
            }

            try {
                log("[GROQ] Envoi à Groq API...", true);
                updateStatus("Envoi à Groq...");

                const response = await fetch('https://api.groq.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.groqApiKey}`
                    },
                    body: JSON.stringify({
                        model: "mixtral-8x7b-32768",
                        messages: [{
                            role: "user",
                            content: `Analyse cette transmission en français: "${transcript}". Instructions: 1. Classifie la menace. 2. Analyse en 2-3 phrases. 3. Recommande une action si nécessaire.`
                        }],
                        temperature: 0.3,
                        max_tokens: 256
                    })
                });

                if (!response.ok) throw new Error(`Erreur ${response.status}`);

                const data = await response.json();
                const groqResponse = data.choices[0].message.content;
                document.getElementById('ai-report').textContent = localReport + `\n\n// RÉPONSE GROQ\n${groqResponse}\n// ======================`;
                if (config.voiceFeedback && isVoiceEnabled) {
                    const firstLine = groqResponse.split('\n')[0].trim();
                    speakText(`Groq répond: ${firstLine}`);
                }
                log("[GROQ] Réponse reçue.", true);
                updateStatus("Prêt");
            } catch (error) {
                log(`[GROQ ERREUR] ${error.message}`, true);
                updateStatus("Erreur API Groq");
                document.getElementById('ai-report').textContent = localReport + `\n\n// ERREUR GROQ: ${error.message}\n// ======================`;
            }
        }

        // ========== GESTION DE L'INTERFACE ==========
        function setupUI() {
            // Bouton de démarrage
            document.getElementById('btnStart').addEventListener('click', async () => {
                const startScreen = document.getElementById('start-screen');
                const main = document.getElementById('main');
                if (!startScreen || !main) return;

                const microAllowed = await checkMicrophonePermission();
                if (!microAllowed) return;

                startScreen.style.display = 'none';
                main.style.display = 'block';
                log("=== SUPRA LAB v11 LANCÉ ===");
                updateStatus("Système prêt");
            });

            // Bouton paramètres
            document.getElementById('btnSettings').addEventListener('click', () => {
                document.getElementById('settings-page').classList.add('active');
            });

            // Bouton fermer paramètres
            ['closeSettings', 'closeSettings2'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.addEventListener('click', () => {
                    document.getElementById('settings-page').classList.remove('active');
                });
            });

            // Bouton IA vocale
            const btnStartIA = document.createElement('button');
            btnStartIA.id = 'btnStartIA';
            btnStartIA.textContent = '🎤 ACTIVER IA VOCALE';
            btnStartIA.style.cssText = 'margin: 10px;';
            document.querySelector('#main .panel:first-child').appendChild(btnStartIA);

            btnStartIA.addEventListener('click', () => {
                isVoiceEnabled ? stopSpeechRecognition() : initSpeech();
            });

            // Bouton tester voix
            document.getElementById('testVoiceBtn').addEventListener('click', () => {
                speakText("Test voix: si vous m'entendez, la synthèse vocale fonctionne.");
            });

            // Bouton tester clé API
            document.getElementById('testApiKeyBtn').addEventListener('click', testGroqApiKey);

            // Bouton sauvegarder
            document.getElementById('saveSettings').addEventListener('click', () => {
                config.groqApiKey = document.getElementById('groqApiKey').value;
                config.voiceFeedback = document.getElementById('voiceFeedback').checked;
                config.voiceAlerts = document.getElementById('voiceAlerts').checked;
                config.voiceLanguage = document.getElementById('voiceLanguage').value;
                localStorage.setItem('groqApiKey', config.groqApiKey);
                localStorage.setItem('supraLabConfig', JSON.stringify(config));
                log("[PARAM] Configuration sauvegardée.");
                document.getElementById('settings-page').classList.remove('active');
            });

            // Bouton voiceToggle
            document.getElementById('voiceToggle').addEventListener('click', () => {
                isVoiceEnabled = !isVoiceEnabled;
                if (isVoiceEnabled && !isListening) initSpeech();
                else if (!isVoiceEnabled) stopSpeechRecognition();
            });

            // Bouton envoyer à Groq
            document.getElementById('sendToGroqBtn').addEventListener('click', () => {
                if (!config.groqApiKey) {
                    log("[GROQ] Clé API manquante.", true);
                    return;
                }
                if (!finalTranscript) {
                    log("[ERREUR] Aucune transmission disponible.", true);
                    return;
                }
                processFinalTranscript(finalTranscript);
            });

            // Bouton lire rapport
            document.getElementById('readReportBtn').addEventListener('click', () => {
                const report = document.getElementById('ai-report').textContent;
                if (report && report !== "[EN ATTENTE...]") {
                    speakText(report);
                } else {
                    log("[VOIX] Aucun rapport à lire.", true);
                }
            });
        }

        // ========== NETTOYAGE ==========
        window.addEventListener('beforeunload', () => {
            stopSpeechRecognition();
            stopSpeaking();
            if (recognition) recognition.stop();
        });
    </script>
</body>
</html>
