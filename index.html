<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS OCULAR SYSTEM - ENTITY SCANNER</title>
    <style>
        :root {
            --bg: #050505;
            --eye-blue: #00f2ff;
            --eye-orange: #ff9d00;
            --eye-red: #ff003c;
            --demon-purple: #bc13fe;
            --text: #e0f7fa;
            --panel: rgba(10, 15, 20, 0.95);
        }

        * { box-sizing: border-box; user-select: none; font-family: 'Courier New', monospace; }
        
        body {
            margin: 0; background: var(--bg); color: var(--text);
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- CONTENEUR PRINCIPAL (L'ŒIL) --- */
        #eye-container {
            flex: 1; position: relative; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle, #111 0%, #000 100%);
            overflow: hidden;
        }

        /* Effet Vignette (Vision humaine) */
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, #000 95%);
            pointer-events: none; z-index: 10;
        }

        /* Scanlines rétiniens */
        #scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none; z-index: 11; opacity: 0.6;
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }

        /* --- TEXTES & HUD --- */
        .hud-layer { position: absolute; z-index: 20; width: 100%; pointer-events: none; text-align: center; }
        
        #center-readout {
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; text-shadow: 0 0 10px #000;
        }

        #main-status {
            font-size: 1.8rem; font-weight: bold; letter-spacing: 2px;
            margin-bottom: 10px; transition: color 0.3s;
        }
        
        #sub-readout {
            font-size: 0.9rem; color: #aaa; background: rgba(0,0,0,0.6);
            padding: 5px 10px; border-radius: 4px; display: inline-block;
        }

        /* Indicateurs autour de l'œil */
        .reticle {
            position: absolute; border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
            pointer-events: none; z-index: 6;
        }
        #reticle-outer { width: 60vh; height: 60vh; border-color: var(--eye-blue); border-style: dashed; animation: spin 60s linear infinite; }
        #reticle-inner { width: 40vh; height: 40vh; border-color: var(--eye-blue); opacity: 0.5; }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- PANNEAU DE CONTRÔLE (Bas) --- */
        #control-panel {
            height: 160px; background: var(--panel); border-top: 2px solid #333;
            z-index: 30; padding: 15px; display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 15px;
        }

        .panel-section { border-right: 1px solid #333; padding-right: 10px; display: flex; flex-direction: column; justify-content: space-around; }
        .panel-section:last-child { border: none; }

        h3 { margin: 0 0 5px 0; font-size: 0.7rem; color: #666; text-transform: uppercase; }

        .btn {
            background: #111; border: 1px solid #444; color: #888;
            padding: 8px; margin-bottom: 5px; cursor: pointer; font-size: 0.7rem;
            text-transform: uppercase; transition: 0.2s; border-radius: 2px;
        }
        .btn:hover { background: #222; color: #fff; }
        .btn.active { border-color: var(--eye-blue); color: var(--eye-blue); box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }
        .btn.danger.active { border-color: var(--eye-red); color: var(--eye-red); box-shadow: 0 0 10px rgba(255, 0, 60, 0.3); }

        .data-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; color: var(--eye-blue); }
        .bar-bg { width: 100px; height: 6px; background: #222; position: relative; top: 6px; }
        .bar-fill { height: 100%; background: var(--eye-blue); width: 0%; transition: width 0.1s; }

        /* Mobile */
        @media (max-width: 768px) {
            #control-panel { grid-template-columns: 1fr; height: auto; overflow-y: auto; }
            .panel-section { border-right: none; border-bottom: 1px solid #333; padding-bottom: 10px; }
            #main-status { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div id="eye-container">
    <canvas id="mainCanvas"></canvas>
    <div id="vignette"></div>
    <div id="scanlines"></div>
    
    <div id="reticle-outer" class="reticle"></div>
    <div id="reticle-inner" class="reticle"></div>

    <div class="hud-layer" id="center-readout">
        <div id="main-status">INITIALISATION</div>
        <div id="sub-readout">SYSTÈME OCULAIRE HORS LIGNE</div>
    </div>
</div>

<div id="control-panel">
    <!-- SECTION 1: ÉTAT -->
    <div class="panel-section">
        <h3>Diagnostic Biologique</h3>
        <div class="data-row"><span>NIVEAU MENACE</span> <span id="threatVal">0%</span></div>
        <div class="bar-bg"><div id="threatBar" class="bar-fill" style="background:var(--eye-red)"></div></div>
        
        <div class="data-row"><span>ACTIVITÉ NEURALE</span> <span id="activityVal">0%</span></div>
        <div class="bar-bg"><div id="activityBar" class="bar-fill"></div></div>

        <button id="btnPower" class="btn active" onclick="togglePower()">⚡ ALIMENTER</button>
    </div>

    <!-- SECTION 2: CONTRÔLES -->
    <div class="panel-section">
        <h3>Protocoles Surnaturels</h3>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
            <button id="btnGhost" class="btn active" onclick="toggleMode('ghost')">👻 ESPRITS</button>
            <button id="btnDemon" class="btn danger" onclick="toggleMode('demon')">😈 DÉMONS</button>
            <button id="btnHumor" class="btn active" onclick="toggleMode('humor')">🗣️ HUMOUR</button>
            <button id="btnAuto" class="btn active" onclick="toggleMode('auto')">👁️ SCAN AUTO</button>
        </div>
        <div style="margin-top:10px; display:flex; gap:5px;">
             <button class="btn" style="flex:1" onclick="simulate('COUGH')">TEST TOUX</button>
             <button class="btn" style="flex:1" onclick="simulate('SPIRIT')">TEST ESPRIT</button>
        </div>
    </div>

    <!-- SECTION 3: LOGS -->
    <div class="panel-section">
        <h3>Journal d'Activité</h3>
        <div id="log-container" style="font-size:0.65rem; color:#888; height: 80px; overflow-y:auto; display:flex; flex-direction:column-reverse;">
            <div>> En attente...</div>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const UI = {
        canvas: document.getElementById('mainCanvas'),
        ctx: document.getElementById('mainCanvas').getContext('2d'),
        status: document.getElementById('main-status'),
        sub: document.getElementById('sub-readout'),
        threatBar: document.getElementById('threatBar'),
        threatVal: document.getElementById('threatVal'),
        actBar: document.getElementById('activityBar'),
        actVal: document.getElementById('activityVal'),
        logs: document.getElementById('log-container'),
        reticleOuter: document.getElementById('reticle-outer'),
        reticleInner: document.getElementById('reticle-inner')
    };

    const State = {
        active: false,
        ghost: true,
        demon: false,
        humor: true,
        autoScan: true,
        lastEvent: 0,
        threatLevel: 0
    };

    let AudioSys = { ctx: null, analyser: null, source: null, buffer: null, timeData: null, freqData: null };

    // --- INITIALISATION ---
    function resize() {
        UI.canvas.width = UI.canvas.parentElement.clientWidth;
        UI.canvas.height = UI.canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    async function togglePower() {
        State.active = !State.active;
        const btn = document.getElementById('btnPower');
        
        if (State.active) {
            btn.classList.add('active');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
                AudioSys.ctx = new (window.AudioContext || window.webkitAudioContext)();
                AudioSys.analyser = AudioSys.ctx.createAnalyser();
                AudioSys.analyser.fftSize = 2048;
                AudioSys.source = AudioSys.ctx.createMediaStreamSource(stream);
                AudioSys.source.connect(AudioSys.analyser);
                
                AudioSys.freqData = new Uint8Array(AudioSys.analyser.frequencyBinCount);
                AudioSys.timeData = new Uint8Array(AudioSys.analyser.fftSize);
                
                UI.status.innerText = "OCULAIRE ACTIF";
                UI.status.style.color = "var(--eye-blue)";
                UI.sub.innerText = "ANALYSE ENVIRONNEMENTALE EN COURS...";
                
                log("Système visuel connecté.", "sys");
                speak("L'œil est ouvert. Je vois tout.");
                
                animate();
                detectLoop();
                initVoice();

            } catch (e) {
                log("Erreur Micro: " + e.message, "err");
                State.active = false;
                btn.classList.remove('active');
            }
        } else {
            btn.classList.remove('active');
            UI.status.innerText = "STANDBY";
            UI.status.style.color = "#555";
            UI.sub.innerText = "SYSTÈME ENDORMI";
            log("Système mis en veille.", "sys");
        }
    }

    // --- MOTEUR GRAPHIQUE (L'ŒIL) ---
    let eyeAngle = 0;
    let pupilSize = 0;
    let eyeColor = { r:0, g:242, b:255 }; // Default Blue
    
    function animate() {
        if (!State.active) return;
        
        const w = UI.canvas.width;
        const h = UI.canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const ctx = UI.ctx;

        ctx.clearRect(0, 0, w, h);

        // Analyse Audio pour la taille de la pupille
        let avgVol = 0;
        if(AudioSys.analyser) {
            AudioSys.analyser.getByteFrequencyData(AudioSys.freqData);
            for(let i=0; i<100; i++) avgVol += AudioSys.freqData[i];
            avgVol /= 100;
        }
        
        // Lissage de la pupille
        const targetPupil = 20 + (avgVol / 255) * 60; // 20% à 80% de taille
        pupilSize += (targetPupil - pupilSize) * 0.1;

        // Couleur dynamique selon menace
        const threatRatio = State.threatLevel / 100;
        if (State.demon || threatRatio > 0.6) {
            // Transition vers Rouge/Violet
            eyeColor.r = 255; eyeColor.g = 0; eyeColor.b = 60; 
            UI.reticleOuter.style.borderColor = "var(--eye-red)";
            UI.reticleInner.style.borderColor = "var(--demon-purple)";
        } else if (threatRatio > 0.3) {
            eyeColor.r = 255; eyeColor.g = 157; eyeColor.b = 0; // Orange
            UI.reticleOuter.style.borderColor = "var(--eye-orange)";
            UI.reticleInner.style.borderColor = "var(--eye-orange)";
        } else {
            eyeColor.r = 0; eyeColor.g = 242; eyeColor.b = 255; // Bleu
            UI.reticleOuter.style.borderColor = "var(--eye-blue)";
            UI.reticleInner.style.borderColor = "var(--eye-blue)";
        }

        const colorStr = `rgb(${eyeColor.r},${eyeColor.g},${eyeColor.b})`;

        // DESSIN DE L'ŒIL
        ctx.save();
        ctx.translate(cx, cy);

        // Sclère (Blanc de l'œil - assombri)
        ctx.beginPath();
        ctx.arc(0, 0, 150, 0, Math.PI * 2);
        ctx.fillStyle = "#1a1a1a";
        ctx.fill();
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Iris (Partie colorée avec texture)
        eyeAngle += 0.005 + (avgVol/10000);
        ctx.save();
        ctx.rotate(eyeAngle);
        
        // Cercles de l'iris
        for(let i=0; i<5; i++) {
            ctx.beginPath();
            ctx.arc(0, 0, 100 - (i*10), 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(${eyeColor.r},${eyeColor.g},${eyeColor.b}, ${0.3 + (i*0.1)})`;
            ctx.lineWidth = 2;
            ctx.setLineDash([10 + i*5, 5]);
            ctx.stroke();
        }
        ctx.restore();

        // Pupille (Noir, change de taille)
        ctx.beginPath();
        ctx.arc(0, 0, pupilSize, 0, Math.PI * 2);
        ctx.fillStyle = "#000";
        ctx.shadowBlur = 20;
        ctx.shadowColor = colorStr;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Reflet (Lumière dans l'œil)
        ctx.beginPath();
        ctx.arc(-pupilSize/3, -pupilSize/3, pupilSize/4, 0, Math.PI*2);
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.fill();

        ctx.restore();

        // ECG / Waveform en bas de l'œil
        drawECG(ctx, w, h, colorStr);

        requestAnimationFrame(animate);
    }

    function drawECG(ctx, w, h, color) {
        if(!AudioSys.analyser) return;
        AudioSys.analyser.getByteTimeDomainData(AudioSys.timeData);
        
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        
        const sliceWidth = w / AudioSys.timeData.length;
        let x = 0;
        const yBase = h - 50;

        for(let i = 0; i < AudioSys.timeData.length; i++) {
            const v = AudioSys.timeData[i] / 128.0;
            const y = yBase + (v * 30); // Amplitude réduite
            if(i===0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
            x += sliceWidth;
        }
        ctx.stroke();
    }

    // --- CERVEAU DE DÉTECTION (Fantômes, Démons, Sons) ---
    function detectLoop() {
        if(!State.active) return;

        AudioSys.analyser.getByteTimeDomainData(AudioSys.timeData);
        
        // Calcul Volume (RMS)
        let sum = 0;
        for(let i=0; i<AudioSys.timeData.length; i++) {
            const x = (AudioSys.timeData[i]/128.0)-1;
            sum += x*x;
        }
        const rms = Math.sqrt(sum / AudioSys.timeData.length);
        const volume = rms * 100;

        // Calcul ZCR (Pour le bruit / toux)
        let zcr = 0;
        for(let i=1; i<AudioSys.timeData.length; i++) {
            if((AudioSys.timeData[i]>=128 && AudioSys.timeData[i-1]<128) || 
               (AudioSys.timeData[i]<128 && AudioSys.timeData[i-1]>=128)) zcr++;
        }

        // UI Updates
        UI.actBar.style.width = Math.min(100, volume * 2) + "%";
        UI.actVal.innerText = Math.round(volume) + "%";

        // Gestion de la menace (décroissance lente)
        if(State.threatLevel > 0) State.threatLevel -= 0.1;
        UI.threatBar.style.width = State.threatLevel + "%";
        UI.threatVal.innerText = Math.round(State.threatLevel) + "%";

        const now = Date.now();

        // 1. DÉTECTION TOUX / RACLEMENT (ZCR élevé)
        if (volume > 15 && zcr > 200 && (now - State.lastEvent > 2000)) {
            handleDetection("TOUX", "Irritation biologique détectée.");
            if(State.humor) speak("Tiens, tu t'es raclé la gorge. Veux-tu un Ricolà ?");
            State.lastEvent = now;
        }

        // 2. DÉTECTION CLAP / BRUIT SEC
        if (volume > 50 && (now - State.lastEvent > 1000)) {
            handleDetection("CHOC SONORE", "Impact physique analysé.");
            speak("J'ai entendu ce bruit.");
            State.lastEvent = now;
        }

        // 3. MODE DÉMON / FANTÔME (Simulations aléatoires si silence)
        if (State.autoScan && (now - State.lastEvent > 5000)) {
            // Chance de détection surnaturelle
            let chance = State.demon ? 0.02 : 0.005; // Plus fréquent si mode démons
            
            if (Math.random() < chance) {
                triggerEntity();
                State.lastEvent = now;
            }
        }

        setTimeout(detectLoop, 50);
    }

    function handleDetection(type, subtext) {
        UI.status.innerText = `DÉTECTION : ${type}`;
        UI.status.style.color = State.demon ? "var(--eye-red)" : "var(--eye-blue)";
        UI.sub.innerText = subtext;
        log(`Détecté: ${type}`);
        
        // Flash visuel
        UI.canvas.style.filter = "brightness(1.5)";
        setTimeout(() => UI.canvas.style.filter = "brightness(1)", 100);
    }

    function triggerEntity() {
        const isDemon = State.demon || Math.random() > 0.7;
        State.threatLevel = isDemon ? 100 : 60;
        
        let entityMsg = isDemon 
            ? ["PRÉSENCE DÉMONIAQUE", "ÉNERGIE NOIRE", "ENTITÉ MALVEILLANTE"][Math.floor(Math.random()*3)]
            : ["ESPRIT DÉTECTÉ", "ÂME EN DETRESSE", "PHÉNOMÈNE PARANORMAL"][Math.floor(Math.random()*3)];
            
        let speakMsg = isDemon
            ? ["Je sens une présence maléfique... ne bougez pas.", "Un démon nous observe.", "L'obscurité grandit."][Math.floor(Math.random()*3)]
            : ["Une âme erre près de nous.", "Je vois un esprit.", "Une entité cherche à communiquer."][Math.floor(Math.random()*3)];

        UI.status.innerText = "ALERTE : " + entityMsg;
        UI.status.style.color = isDemon ? "var(--eye-red)" : "var(--demon-purple)";
        UI.sub.innerText = "COORDONNÉES SPIRITUELLES ACQUISES";
        
        log("ALERT: " + entityMsg, "err");
        
        // Voix modifiée pour démon
        if(isDemon) speakDemon(speakMsg);
        else speak(speakMsg);
    }

    // --- SYNTHÈSE VOCALE ---
    function speak(text) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'fr-FR'; u.rate = 1.0; u.pitch = 1.0;
        window.speechSynthesis.speak(u);
    }

    function speakDemon(text) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'fr-FR'; u.rate = 0.6; u.pitch = 0.3; // Voix grave et lente
        window.speechSynthesis.speak(u);
    }

    // --- RECONNAISSANCE VOCALE (Mots) ---
    function initVoice() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR) return;
        const rec = new SR();
        rec.continuous = true; rec.interimResults = false; rec.lang = 'fr-FR';
        
        rec.onresult = (e) => {
            const txt = e.results[e.results.length-1][0].transcript.trim().toLowerCase();
            if(txt) {
                UI.sub.innerText = `VOIX HUMAINE : "${txt.toUpperCase()}"`;
                log("Voix: " + txt);
                
                if(txt.includes('démon') || txt.includes('peur')) {
                    speak("Ne craignez rien, je vous protège.");
                } else if(txt.includes('jarvis')) {
                    speak("Je vous écoute.");
                }
            }
        };
        rec.start();
    }

    // --- UTILITAIRES ---
    function toggleMode(mode) {
        State[mode] = !State[mode];
        document.getElementById('btn' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.toggle('active');
        speak(`Mode ${mode} ${State[mode] ? 'activé' : 'désactivé'}.`);
    }

    function simulate(type) {
        if(type === 'COUGH') {
            UI.status.innerText = "TEST : TOUX";
            UI.status.style.color = "var(--eye-orange)";
            if(State.humor) speak("Simulation : Veux-tu un Ricolà ?");
        } else if (type === 'SPIRIT') {
            triggerEntity();
        }
    }

    function log(msg, type="sys") {
        const div = document.createElement('div');
        div.style.color = type === 'err' ? 'var(--eye-red)' : '#888';
        div.innerText = `> ${msg}`;
        UI.logs.prepend(div);
    }
</script>
</body>
</html>
