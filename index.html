<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPATATOP AI - Alertes Vocales Complètes</title>
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #ff00ff;
            --bg: #000;
            --panel: #111;
            --text: #fff;
            --danger: #ff5555;
            --accent: #ffff00;
            --sonar: #00ffff;
            --detect: #ff0000;
            --highlight: #00ccff;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; text-shadow: 0 0 10px var(--primary); }
            50% { opacity: 0.65; text-shadow: 0 0 25px var(--primary); }
        }

        @keyframes pulseBtn {
            0%, 100% { box-shadow: 0 0 12px rgba(255, 0, 255, 0.7); }
            50% { box-shadow: 0 0 25px rgba(255, 0, 255, 1); }
        }

        @keyframes alertPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        @keyframes alertGlow {
            0% { box-shadow: 0 0 15px var(--detect); }
            100% { box-shadow: 0 0 40px var(--detect), 0 0 70px var(--detect); }
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: linear-gradient(to right, #000, #111);
            border-bottom: 3px solid var(--primary);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.3rem;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
            letter-spacing: 2px;
            margin: 0;
            font-weight: bold;
        }

        main {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #visualizer {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at center, #000 0%, #111 100%);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #displayOverlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            width: 90%;
        }

        #mainText {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--primary);
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 20px;
            border: 2px solid var(--primary);
            border-radius: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--primary);
            margin-bottom: 8px;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        #subText {
            font-size: 0.9rem;
            color: var(--accent);
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 15px;
            border: 1px solid var(--accent);
            border-radius: 5px;
            text-shadow: 0 0 5px var(--accent);
        }

        #hud {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 14px;
            border: 1px solid var(--primary);
            border-radius: 5px;
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--primary);
            z-index: 25;
            min-width: 160px;
        }

        #actionGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
            gap: 8px;
            padding: 12px;
            background: var(--panel);
            border-top: 1px solid #222;
        }

        .grid-btn {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #ccc;
            padding: 8px 3px;
            border-radius: 5px;
            text-align: center;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .grid-icon {
            font-size: 1.35rem;
            margin-bottom: 3px;
            display: block;
        }

        .grid-btn:active {
            transform: scale(0.95);
        }

        .grid-btn.active-state {
            background: var(--secondary);
            color: #000;
            border-color: #000;
            box-shadow: 0 0 12px rgba(255, 0, 255, 0.7);
            animation: pulseBtn 2s infinite;
        }

        #terminal {
            height: 92px;
            background: #000;
            border-top: 1px solid #333;
            padding: 6px;
            font-size: 0.62rem;
            overflow-y: auto;
            color: #aaa;
            line-height: 1.3;
            font-family: monospace;
        }

        .log-line {
            margin-bottom: 4px;
            border-left: 2px solid #555;
            padding-left: 6px;
        }

        #translationOverlay {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            color: var(--text);
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 18px;
            border: 2px solid var(--primary);
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 0.9rem;
            font-weight: bold;
        }

        #liveTranslation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            color: var(--sonar);
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 20px;
            border: 2px solid var(--sonar);
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 1.1rem;
            font-weight: bold;
            opacity: 0.95;
        }

        #detectionAlert {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--detect);
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 15px;
            border: 2px solid var(--detect);
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 1rem;
            font-weight: bold;
            display: none;
            animation: alertPulse 1s infinite, alertGlow 2s infinite alternate;
        }
    </style>
</head>
<body>
    <header>
        <h1>OPATATOP AI - ALERTES VOCALES</h1>
    </header>
    <main>
        <div id="visualizer">
            <canvas id="scopeCanvas"></canvas>
            <div id="detectionAlert">ALERTE PARANORMALE</div>
            <div id="displayOverlay">
                <div id="mainText">ALERTES VOCALES ACTIVÉES</div>
                <div id="subText">TOUTES FONCTIONS ACTIVÉES</div>
            </div>
            <div id="translationOverlay">TRADUCTION LIVE</div>
            <div id="liveTranslation">--</div>
            <div id="hud">NIVEAU: 0%<br>FRÉQ.: 0 Hz<br>DÉTECTION: 0%<br>TEMP: 0°C</div>
        </div>
    </main>
    <div id="actionGrid">
        <div class="grid-btn active-state" id="btnPower"><span class="grid-icon">⚡</span><span>POWER</span></div>
        <div class="grid-btn active-state" id="btnDetect"><span class="grid-icon">🔍</span><span>SONAR</span></div>
        <div class="grid-btn active-state" id="btnGhost"><span class="grid-icon">👻</span><span>DETECT</span></div>
        <div class="grid-btn active-state" id="btnVAD"><span class="grid-icon">🎤</span><span>VAD</span></div>
        <div class="grid-btn active-state" id="btnSensors"><span class="grid-icon">📡</span><span>CAPTEURS</span></div>
        <div class="grid-btn active-state" id="btnRecord"><span class="grid-icon">📼</span><span>ENREG.</span></div>
        <div class="grid-btn active-state" id="btnEMF"><span class="grid-icon">📏</span><span>EMF</span></div>
        <div class="grid-btn active-state" id="btnTemp"><span class="grid-icon">🌡️</span><span>TEMP</span></div>
    </div>
    <div id="terminal"></div>

    <script>
        // ==================== CONFIG ====================
        const Config = {
            colorModes: {
                dark: {
                    primary: '#00ff88',
                    secondary: '#ff00ff',
                    bg: '#000',
                    panel: '#111',
                    text: '#fff',
                    sonar: '#00ffff',
                    detect: '#ff0000',
                    accent: '#ffff00',
                    danger: '#ff5555',
                    highlight: '#00ccff'
                }
            },
            applyColorMode() {
                const mode = this.colorModes.dark;
                Object.keys(mode).forEach(key => {
                    document.documentElement.style.setProperty(`--${key}`, mode[key]);
                });
            }
        };

        // ==================== AUDIO ENGINE ====================
        const AudioEngine = {
            ctx: null,
            stream: null,
            analyser: null,
            isInit: false,

            async init() {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    this.stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false,
                            sampleRate: 44100
                        }
                    });
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 2048;
                    this.ctx.createMediaStreamSource(this.stream).connect(this.analyser);
                    this.isInit = true;
                    return true;
                } catch (e) {
                    console.error("Erreur audio:", e);
                    return false;
                }
            },

            getRMS() {
                if (!this.analyser) return 0;
                const data = new Uint8Array(this.analyser.fftSize);
                this.analyser.getByteTimeDomainData(data);
                let sum = 0;
                for (let i = 0; i < data.length; i++) {
                    const val = (data[i] / 128) - 1;
                    sum += val * val;
                }
                return Math.sqrt(sum / data.length);
            },

            getPeakFrequency() {
                if (!this.analyser) return 0;
                const data = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(data);
                let maxIdx = 0, maxVal = 0;
                for (let i = 2; i < data.length; i++) {
                    if (data[i] > maxVal) {
                        maxVal = data[i];
                        maxIdx = i;
                    }
                }
                const nyquist = this.ctx.sampleRate / 2;
                return Math.round((maxIdx / data.length) * nyquist);
            },

            playClick() {
                if (!this.ctx || !this.isInit) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 1100;
                gain.gain.value = 0.08;
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                setTimeout(() => osc.stop(), 45);
            },

            destroy() {
                if (this.stream) this.stream.getTracks().forEach(t => t.stop());
                if (this.ctx) this.ctx.close();
                this.isInit = false;
            }
        };

        // ==================== SPEECH ENGINE ====================
        const SpeechEngine = {
            synthesis: window.speechSynthesis,
            voice: null,

            init() {
                const loadVoices = () => {
                    const voices = this.synthesis.getVoices();
                    this.voice = voices.find(v => v.lang.startsWith('fr')) || voices[0];
                };
                loadVoices();
                this.synthesis.onvoiceschanged = loadVoices;
            },

            speak(text) {
                if (!text) return;
                this.synthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.pitch = 1.05;
                utterance.rate = 0.98;
                if (this.voice) utterance.voice = this.voice;
                this.synthesis.speak(utterance);
            }
        };

        // ==================== VISUAL ENGINE ====================
        const VisualEngine = {
            canvas: null,
            ctx: null,
            animId: null,
            isRunning: false,
            lastHudUpdate: 0,

            init() {
                this.canvas = document.getElementById('scopeCanvas');
                this.ctx = this.canvas.getContext('2d', { alpha: true });
                this.resize();
                window.addEventListener('resize', () => this.resize());
            },

            resize() {
                if (this.canvas) {
                    this.canvas.width = this.canvas.parentElement.clientWidth;
                    this.canvas.height = this.canvas.parentElement.clientHeight;
                }
            },

            start() {
                if (!this.isRunning) {
                    this.isRunning = true;
                    this.lastHudUpdate = Date.now();
                    this.loop();
                }
            },

            stop() {
                this.isRunning = false;
                if (this.animId) cancelAnimationFrame(this.animId);
            },

            updateHUD() {
                const rms = AudioEngine.isInit ? AudioEngine.getRMS() * 100 : 0;
                const freq = AudioEngine.isInit ? AudioEngine.getPeakFrequency() : 0;
                const detect = Math.min(100, Math.floor(rms * 0.75 + (FeatureEngine.ghostDetection ? 35 : 0)));

                document.getElementById('hud').innerHTML = `
                    NIVEAU: ${rms.toFixed(1)}%<br>
                    FRÉQ.: ${freq} Hz<br>
                    DÉTECTION: ${detect}%<br>
                    TEMP: ${(20.5 + Math.random() * 4.5).toFixed(1)}°C
                `;
            },

            loop() {
                if (!this.isRunning) return;

                const w = this.canvas.width;
                const h = this.canvas.height;
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
                this.ctx.fillRect(0, 0, w, h);

                // === RADAR GRID ===
                this.ctx.save();
                this.ctx.translate(w / 2, h / 2);
                this.ctx.strokeStyle = '#00ff8833';
                this.ctx.lineWidth = 1.5;
                const maxR = Math.min(w, h) / 2.2;
                for (let r = 25; r <= maxR; r += 28) {
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, r, 0, Math.PI * 2);
                    this.ctx.stroke();
                }
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 12) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, 0);
                    this.ctx.lineTo(Math.cos(a) * maxR, Math.sin(a) * maxR);
                    this.ctx.stroke();
                }
                this.ctx.restore();

                // === RADAR SWEEP ===
                const angle = (Date.now() / 800) % (Math.PI * 2);
                this.ctx.save();
                this.ctx.translate(w / 2, h / 2);
                this.ctx.strokeStyle = '#00ff88';
                this.ctx.lineWidth = 3.5;
                this.ctx.shadowBlur = 20;
                this.ctx.shadowColor = '#00ff88';
                this.ctx.beginPath();
                this.ctx.moveTo(0, 0);
                this.ctx.lineTo(Math.cos(angle) * maxR, Math.sin(angle) * maxR);
                this.ctx.stroke();
                this.ctx.restore();

                // === WAVEFORM (oscilloscope) ===
                if (AudioEngine.isInit) {
                    const timeData = new Uint8Array(AudioEngine.analyser.fftSize);
                    AudioEngine.analyser.getByteTimeDomainData(timeData);
                    this.ctx.save();
                    this.ctx.strokeStyle = '#00ffff';
                    this.ctx.lineWidth = 2.5;
                    this.ctx.shadowBlur = 15;
                    this.ctx.shadowColor = '#00ffff';
                    this.ctx.beginPath();
                    const sliceWidth = w / timeData.length * 1.8;
                    let x = 30;
                    for (let i = 0; i < timeData.length; i += 2) {
                        const v = timeData[i] / 128;
                        const y = h * 0.82 + (v - 0.5) * 55;
                        if (i === 0) this.ctx.moveTo(x, y);
                        else this.ctx.lineTo(x, y);
                        x += sliceWidth;
                    }
                    this.ctx.stroke();
                    this.ctx.restore();
                }

                // HUD throttle
                const now = Date.now();
                if (now - this.lastHudUpdate > 165) {
                    this.updateHUD();
                    this.lastHudUpdate = now;
                }

                this.animId = requestAnimationFrame(() => this.loop());
            }
        };

        // ==================== FEATURE ENGINE ====================
        const FeatureEngine = {
            power: true,
            detection: true,
            ghostDetection: true,
            vad: true,
            sensorsActive: true,
            autoRecord: true,
            emfActive: true,
            tempActive: true,

            togglePower() {
                AudioEngine.playClick();
                this.power = !this.power;
                const btn = document.getElementById('btnPower');
                btn.classList.toggle('active-state');

                const mainText = document.getElementById('mainText');
                const msg = this.power ? "Système activé" : "Système désactivé";
                App.log(msg);
                SpeechEngine.speak(msg);

                if (!this.power) {
                    mainText.textContent = "SYSTÈME DÉSACTIVÉ";
                    mainText.style.color = 'var(--danger)';
                } else {
                    mainText.textContent = "ALERTES VOCALES ACTIVÉES";
                    mainText.style.color = 'var(--primary)';
                }
            },

            toggleDetection() {
                AudioEngine.playClick();
                this.detection = !this.detection;
                document.getElementById('btnDetect').classList.toggle('active-state');
                const msg = this.detection ? "Détection sonar activée" : "Détection sonar désactivée";
                App.log(msg);
                SpeechEngine.speak(msg);
            },

            toggleGhostDetection() {
                AudioEngine.playClick();
                this.ghostDetection = !this.ghostDetection;
                document.getElementById('btnGhost').classList.toggle('active-state');
                const msg = this.ghostDetection ? "Détection de fantômes activée" : "Détection de fantômes désactivée";
                App.log(msg);
                SpeechEngine.speak(msg);
            },

            toggleVAD() {
                AudioEngine.playClick();
                this.vad = !this.vad;
                document.getElementById('btnVAD').classList.toggle('active-state');
                const msg = this.vad ? "Détection vocale activée" : "Détection vocale désactivée";
                App.log(msg);
                SpeechEngine.speak(msg);
            },

            toggleSensors() {
                AudioEngine.playClick();
                this.sensorsActive = !this.sensorsActive;
                document.getElementById('btnSensors').classList.toggle('active-state');
                const msg = this.sensorsActive ? "Capteurs activés" : "Capteurs désactivés";
                App.log(msg);
                SpeechEngine.speak(msg);
            },

            toggleAutoRecord() {
                AudioEngine.playClick();
                this.autoRecord = !this.autoRecord;
                document.getElementById('btnRecord').classList.toggle('active-state');
                const msg = this.autoRecord ? "Enregistrement automatique activé" : "Enregistrement automatique désactivé";
                App.log(msg);
                SpeechEngine.speak(msg);
            },

            toggleEMF() {
                AudioEngine.playClick();
                this.emfActive = !this.emfActive;
                document.getElementById('btnEMF').classList.toggle('active-state');
                const msg = this.emfActive ? "Détection EMF activée" : "Détection EMF désactivée";
                App.log(msg);
                SpeechEngine.speak(msg);
            },

            toggleTemp() {
                AudioEngine.playClick();
                this.tempActive = !this.tempActive;
                document.getElementById('btnTemp').classList.toggle('active-state');
                const msg = this.tempActive ? "Détection de température activée" : "Détection de température désactivée";
                App.log(msg);
                SpeechEngine.speak(msg);
            }
        };

        // ==================== MAIN APP ====================
        const App = {
            isRunning: false,
            simulateInterval: null,

            log(msg) {
                const t = document.getElementById('terminal');
                const d = document.createElement('div');
                d.className = 'log-line';
                d.innerText = `[${new Date().toLocaleTimeString('fr-FR')}] ${msg}`;
                t.appendChild(d);
                if (t.children.length > 16) t.removeChild(t.firstChild);
                t.scrollTop = t.scrollHeight;
            },

            triggerVAD() {
                const messages = [
                    "Activité vocale détectée !",
                    "Voix humaine captée",
                    "Signal vocal fort"
                ];
                const msg = messages[Math.floor(Math.random() * messages.length)];
                App.log(`VAD → ${msg}`);
                SpeechEngine.speak(msg);

                const lt = document.getElementById('liveTranslation');
                lt.textContent = msg.toUpperCase();
                setTimeout(() => {
                    if (lt.textContent === msg.toUpperCase()) lt.textContent = '--';
                }, 3800);
            },

            triggerGhost() {
                const messages = [
                    "ALERTE PARANORMALE !",
                    "Entité détectée à proximité",
                    "Voix EVP captée",
                    "Présence paranormale confirmée",
                    "Champ EMF anormal détecté"
                ];
                const msg = messages[Math.floor(Math.random() * messages.length)];

                const alertEl = document.getElementById('detectionAlert');
                alertEl.textContent = msg;
                alertEl.style.display = 'block';

                App.log(`GHOST → ${msg}`);
                SpeechEngine.speak(msg);

                const lt = document.getElementById('liveTranslation');
                lt.textContent = "ENTITÉ: " + msg.substring(0, 18);
                setTimeout(() => {
                    alertEl.style.display = 'none';
                    if (lt.textContent.includes("ENTITÉ")) lt.textContent = '--';
                }, 5200);
            },

            simulateEvents() {
                if (!this.isRunning || !FeatureEngine.power || !AudioEngine.isInit) return;

                const rms = AudioEngine.getRMS();

                // VAD simulation
                if (FeatureEngine.vad && rms > 0.23 && Math.random() < 0.13) {
                    this.triggerVAD();
                }

                // Ghost detection (rare & spooky)
                if (FeatureEngine.ghostDetection && Math.random() < 0.065) {
                    this.triggerGhost();
                }
            },

            async init() {
                Config.applyColorMode();
                SpeechEngine.init();

                VisualEngine.init();

                const audioSuccess = await AudioEngine.init();
                if (!audioSuccess) {
                    this.log("⚠️ ACCÈS MICRO REFUSÉ - Mode démo uniquement");
                }

                VisualEngine.start();
                this.isRunning = true;

                this.log("OPATATOP AI INITIALISÉ");
                this.log("Toutes fonctions activées - Prêt pour les alertes");

                SpeechEngine.speak("Toutes fonctions activées. Système prêt pour les alertes paranormales.");

                // Simulation loop (événements aléatoires réalistes)
                this.simulateInterval = setInterval(() => this.simulateEvents(), 2400);

                // Attach button listeners (clean code)
                const buttons = [
                    { id: 'btnPower', fn: () => FeatureEngine.togglePower() },
                    { id: 'btnDetect', fn: () => FeatureEngine.toggleDetection() },
                    { id: 'btnGhost', fn: () => FeatureEngine.toggleGhostDetection() },
                    { id: 'btnVAD', fn: () => FeatureEngine.toggleVAD() },
                    { id: 'btnSensors', fn: () => FeatureEngine.toggleSensors() },
                    { id: 'btnRecord', fn: () => FeatureEngine.toggleAutoRecord() },
                    { id: 'btnEMF', fn: () => FeatureEngine.toggleEMF() },
                    { id: 'btnTemp', fn: () => FeatureEngine.toggleTemp() }
                ];

                buttons.forEach(b => {
                    const el = document.getElementById(b.id);
                    if (el) el.addEventListener('click', b.fn);
                });
            }
        };

        // Lancement
        window.onload = () => App.init();
    </script>
</body>
</html>
