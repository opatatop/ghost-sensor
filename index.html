<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>JARVIS PARANORMAL v50.0 - REAL SENSORS</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --pri: #00ff41;
            --sec: #008F11;
            --bg: #050505;
            --alert: #ff3333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        
        body {
            background-color: var(--bg);
            color: var(--pri);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Scanline Overlay */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Header */
        header {
            padding: 10px 15px;
            border-bottom: 1px solid var(--sec);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        /* Main Display */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
        }

        /* Real-time Spectrum */
        #scope-container {
            flex: 1;
            border: 1px solid var(--sec);
            position: relative;
            background: #001100;
            margin-bottom: 10px;
            overflow: hidden;
        }
        
        canvas { display: block; width: 100%; height: 100%; }

        .data-overlay {
            position: absolute; top: 5px; left: 5px;
            font-size: 0.7rem; color: var(--pri);
            text-shadow: 0 0 5px black;
            pointer-events: none;
        }

        /* Sensor Grid */
        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            height: 120px;
        }

        .sensor-card {
            border: 1px solid var(--sec);
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sensor-label { font-size: 0.7rem; color: #aaa; display: flex; justify-content: space-between; }
        .sensor-value { font-size: 1.5rem; font-weight: bold; }
        .sensor-unit { font-size: 0.8rem; }
        
        .bar-bg { height: 4px; background: #112200; margin-top: 5px; }
        .bar-fill { height: 100%; background: var(--pri); width: 0%; transition: width 0.1s linear; }

        .alert-state { color: var(--alert); border-color: var(--alert); }
        .alert-state .bar-fill { background: var(--alert); }

        /* Controls */
        footer {
            height: 140px;
            border-top: 1px solid var(--sec);
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: #000;
            z-index: 50;
        }

        #mic-btn {
            width: 70px; height: 70px;
            border-radius: 50%;
            border: 2px solid var(--pri);
            background: transparent;
            color: var(--pri);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 10px var(--sec);
        }
        
        #mic-btn.listening { background: var(--pri); color: #000; animation: pulse 1s infinite; }
        #mic-btn.calibrating { border-color: var(--alert); color: var(--alert); }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 65, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(0, 255, 65, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 255, 65, 0); } }

        .log-area {
            width: 100%; height: 30px;
            font-size: 0.7rem; color: #888;
            border-top: 1px solid #222;
            padding-top: 5px;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .calibration-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 200;
        }
    </style>
</head>
<body>

<div class="scanlines"></div>

<header>
    <div>JARVIS <span style="color:#fff">v50.0</span></div>
    <div id="status-text">INITIALISATION...</div>
</header>

<main>
    <div id="scope-container">
        <canvas id="scope"></canvas>
        <div class="data-overlay">
            FREQ: <span id="freq-val">0</span> Hz<br>
            PEAK: <span id="peak-val">-inf</span> dB
        </div>
    </div>

    <div class="sensor-grid">
        <!-- AUDIO SENSOR -->
        <div class="sensor-card" id="card-audio">
            <div class="sensor-label"><span>ENTRÉE AUDIO (MIC)</span> <i class="fas fa-microphone"></i></div>
            <div>
                <div class="sensor-value"><span id="val-db">0</span> <span class="sensor-unit">dB</span></div>
                <div class="bar-bg"><div id="bar-db" class="bar-fill"></div></div>
            </div>
        </div>

        <!-- KINETIC SENSOR (ACCEL) -->
        <div class="sensor-card" id="card-motion">
            <div class="sensor-label"><span>CINÉTIQUE (MOVE)</span> <i class="fas fa-wave-square"></i></div>
            <div>
                <div class="sensor-value"><span id="val-g">0.00</span> <span class="sensor-unit">G</span></div>
                <div class="bar-bg"><div id="bar-g" class="bar-fill"></div></div>
            </div>
        </div>

        <!-- BATTERY SENSOR -->
        <div class="sensor-card">
            <div class="sensor-label"><span>ÉNERGIE (BAT)</span> <i class="fas fa-battery-three-quarters"></i></div>
            <div>
                <div class="sensor-value"><span id="val-bat">--</span> <span class="sensor-unit">%</span></div>
                <div class="bar-bg"><div id="bar-bat" class="bar-fill" style="background:#00ffff"></div></div>
            </div>
        </div>

        <!-- MAGNETIC SENSOR (EMF) -->
        <div class="sensor-card" id="card-emf">
            <div class="sensor-label"><span>CHAMP (EMF)</span> <i class="fas fa-magnet"></i></div>
            <div>
                <div class="sensor-value"><span id="val-emf">--</span> <span class="sensor-unit">µT</span></div>
                <div class="bar-bg"><div id="bar-emf" class="bar-fill" style="background:#ff00ff"></div></div>
            </div>
        </div>
    </div>
</main>

<footer>
    <div class="log-area" id="system-log">En attente d'initialisation...</div>
    <div style="display:flex; gap:15px; align-items:center;">
        <button onclick="recalibrate()" style="background:none; border:1px solid #555; color:#888; padding:5px 10px; font-family:'Share Tech Mono'">CALIBRER</button>
        <button id="mic-btn"><i class="fas fa-microphone"></i></button>
        <button onclick="speakLast()" style="background:none; border:1px solid #555; color:#888; padding:5px 10px; font-family:'Share Tech Mono'">LIRE</button>
    </div>
</footer>

<!-- Calibration Screen -->
<div id="calib-screen" class="calibration-overlay">
    <h2 style="color:var(--pri); margin-bottom:20px;">CALIBRATION DES CAPTEURS</h2>
    <p style="color:#fff; margin-bottom:20px; text-align:center; max-width:80%;">
        Placez l'appareil sur une surface plane.<br>
        Faites le silence absolu.<br>
        Ne touchez pas à l'appareil.
    </p>
    <div id="calib-timer" style="font-size:2rem; color:var(--pri)">3</div>
</div>

<script>
    /* 
       ================================================================
       JARVIS PARANORMAL v50.0 - REAL SENSOR ONLY
       - No Math.random() for sensors.
       - Uses AudioContext (Real Freq/Volume)
       - Uses DeviceMotion (Real Acceleration)
       - Uses Magnetometer (Real Magnetic Field) or fallback
       ================================================================
    */

    const state = {
        baselineNoise: 0,
        baselineMotion: 0,
        isListening: false,
        lastAudioPeak: 0,
        lastMotionPeak: 0,
        magnetometer: null,
        battery: null,
        audioCtx: null,
        analyser: null,
        microphone: null,
        recognition: null,
        voices: []
    };

    // --- UTILS ---
    const log = (msg) => document.getElementById('system-log').innerText = `>> ${msg}`;
    const setAlert = (id, active) => {
        const el = document.getElementById(id);
        if(active) el.classList.add('alert-state');
        else el.classList.remove('alert-state');
    };

    // --- 1. AUDIO SYSTEM (REAL) ---
    async function initAudio() {
        try {
            state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            state.analyser = state.audioCtx.createAnalyser();
            state.analyser.fftSize = 2048;
            state.analyser.smoothingTimeConstant = 0.5;
            
            state.microphone = state.audioCtx.createMediaStreamSource(stream);
            state.microphone.connect(state.analyser);
            
            drawSpectrum();
            analyzeAudioLoop();
            return true;
        } catch (e) {
            log("ERREUR: Accès micro refusé");
            return false;
        }
    }

    function drawSpectrum() {
        const canvas = document.getElementById('scope');
        const ctx = canvas.getContext('2d');
        
        const resize = () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        };
        window.addEventListener('resize', resize);
        resize();

        const bufferLength = state.analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function draw() {
            requestAnimationFrame(draw);
            state.analyser.getByteFrequencyData(dataArray);

            ctx.fillStyle = '#001100';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / bufferLength) * 2.5;
            let x = 0;

            for(let i = 0; i < bufferLength; i++) {
                const barHeight = dataArray[i] / 2;
                
                // Color based on frequency intensity
                const r = barHeight + (25 * (i/bufferLength));
                const g = 250 * (i/bufferLength);
                const b = 50;

                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

                x += barWidth + 1;
            }
        }
        draw();
    }

    function analyzeAudioLoop() {
        if(!state.analyser) return;

        const array = new Uint8Array(state.analyser.frequencyBinCount);
        state.analyser.getByteFrequencyData(array);

        // Calcul RMS (Volume réel)
        let sum = 0;
        for(let i = 0; i < array.length; i++) sum += array[i] * array[i];
        const rms = Math.sqrt(sum / array.length);
        
        // Conversion relative en dB (approximation pour affichage)
        const db = 20 * Math.log10(rms) || -100;
        const displayDb = Math.max(-100, Math.round(db)); // Clamp

        // Trouver la fréquence dominante (Pitch)
        let maxVal = -1;
        let maxIndex = -1;
        for(let i = 0; i < array.length; i++) {
            if(array[i] > maxVal) { maxVal = array[i]; maxIndex = i; }
        }
        const frequency = maxIndex * state.audioCtx.sampleRate / state.analyser.fftSize;

        // Update UI
        document.getElementById('val-db').innerText = displayDb;
        document.getElementById('peak-val').innerText = displayDb;
        document.getElementById('freq-val').innerText = frequency;

        // Barre de volume (normalisée 0-100)
        const volPercent = Math.min(100, Math.max(0, (displayDb + 100) / 1.5)); 
        document.getElementById('bar-db').style.width = volPercent + "%";

        // Détection d'anomalie (si volume > baseline + marge)
        const threshold = state.baselineNoise + 15; // Seuil strict
        if (displayDb > threshold) {
            setAlert('card-audio', true);
            log(`ANOMALIE AUDIO: ${displayDb} dB @ ${frequency}Hz`);
            // Trigger vibe if loud
            if(navigator.vibrate && displayDb > -10) navigator.vibrate(50);
        } else {
            setAlert('card-audio', false);
        }

        requestAnimationFrame(analyzeAudioLoop);
    }

    // --- 2. MOTION SENSOR (REAL) ---
    function initMotion() {
        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', (event) => {
                const acc = event.accelerationIncludingGravity;
                if (!acc) return;

                // Calcul de la magnitude du vecteur d'accélération
                const x = acc.x || 0;
                const y = acc.y || 0;
                const z = acc.z || 0;
                const magnitude = Math.sqrt(x*x + y*y + z*z);

                // Enlever la gravité (~9.8) pour avoir le mouvement pur
                const motion = Math.abs(magnitude - 9.8);

                // Update UI
                const gVal = motion.toFixed(2);
                document.getElementById('val-g').innerText = gVal;
                document.getElementById('bar-g').style.width = Math.min(100, motion * 10) + "%";

                // Détection de seuil
                if (motion > (state.baselineMotion + 0.5)) {
                    setAlert('card-motion', true);
                    log(`DÉTECTION MOUVEMENT: ${gVal} G`);
                    if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
                } else {
                    setAlert('card-motion', false);
                }
            });
        } else {
            document.getElementById('val-g').innerText = "N/A";
            log("ACCÉLÉROMÈTRE INDISPONIBLE");
        }
    }

    // --- 3. MAGNETIC SENSOR (REAL HARDWARE) ---
    function initMagnetometer() {
        try {
            if ('Magnetometer' in window) {
                state.magnetometer = new Magnetometer({ frequency: 10 });
                state.magnetometer.addEventListener('reading', () => {
                    const x = state.magnetometer.x;
                    const y = state.magnetometer.y;
                    const z = state.magnetometer.z;
                    
                    // Calcul champ total (en micro-Tesla µT)
                    const totalField = Math.sqrt(x*x + y*y + z*z);
                    
                    document.getElementById('val-emf').innerText = totalField.toFixed(1);
                    document.getElementById('bar-emf').style.width = Math.min(100, (totalField / 100) * 100) + "%";

                    // Seuil EMF arbitraire (typique 50-60µT est calme, >100µT est étrange)
                    if (totalField > 80) {
                        setAlert('card-emf', true);
                        log(`CHAMP MAGNÉTIQUE ÉLEVÉ: ${totalField.toFixed(1)} µT`);
                    } else {
                        setAlert('card-emf', false);
                    }
                });
                state.magnetometer.start();
            } else {
                throw new Error("API non supportée");
            }
        } catch (error) {
            document.getElementById('val-emf').innerText = "N/A";
            log("CAPTEUR MAGNÉTIQUE INDISPONIBLE");
        }
    }

    // --- 4. BATTERY SENSOR (REAL) ---
    async function initBattery() {
        if ('getBattery' in navigator) {
            state.battery = await navigator.getBattery();
            updateBatteryUI();

            state.battery.addEventListener('levelchange', updateBatteryUI);
            state.battery.addEventListener('chargingchange', updateBatteryUI);
        }
    }

    function updateBatteryUI() {
        if(!state.battery) return;
        const level = Math.round(state.battery.level * 100);
        document.getElementById('val-bat').innerText = level;
        document.getElementById('bar-bat').style.width = level + "%";
        
        if (level < 20 && !state.battery.charging) {
            log("ATTENTION: BATTERIE FAIBLE");
        }
    }

    // --- CALIBRATION PROCESS ---
    function calibrate() {
        const screen = document.getElementById('calib-screen');
        const timer = document.getElementById('calib-timer');
        screen.style.display = 'flex';
        
        // Audio Calibration
        if(state.analyser) {
            const array = new Uint8Array(state.analyser.frequencyBinCount);
            let samples = 0;
            let totalNoise = 0;
            
            const sampleInterval = setInterval(() => {
                state.analyser.getByteFrequencyData(array);
                let sum = 0;
                for(let i=0; i<array.length; i++) sum += array[i] * array[i];
                const rms = Math.sqrt(sum / array.length);
                const db = 20 * Math.log10(rms) || -100;
                
                totalNoise += db;
                samples++;
            }, 100);

            // 3 second countdown
            let count = 3;
            const countInterval = setInterval(() => {
                count--;
                timer.innerText = count;
                if(count <= 0) {
                    clearInterval(countInterval);
                    clearInterval(sampleInterval);
                    
                    // Set Baselines
                    state.baselineNoise = (totalNoise / samples) + 5; // +5 marge de sécurité
                    state.baselineMotion = 0.2; // Marge mouvement standard

                    screen.style.display = 'none';
                    log(`CALIBRATION TERMINÉE. SEUIL BRUIT: ${state.baselineNoise.toFixed(1)} dB`);
                    
                    // Start Speech Reco
                    initSpeech();
                }
            }, 1000);
        }
    }

    function recalibrate() {
        if(confirm("Voulez-vous recalibrer les capteurs ? (Silence requis)")) {
            calibrate();
        }
    }

    // --- SPEECH (STT) ---
    function initSpeech() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        state.recognition = new SpeechRecognition();
        state.recognition.lang = 'fr-FR';
        state.recognition.continuous = false;
        state.recognition.interimResults = false;

        state.recognition.onstart = () => {
            state.isListening = true;
            document.getElementById('mic-btn').classList.add('listening');
            log("RECONNAISSANCE VOCALE ACTIVE");
        };

        state.recognition.onend = () => {
            state.isListening = false;
            document.getElementById('mic-btn').classList.remove('listening');
        };

        state.recognition.onresult = (e) => {
            const txt = e.results[0][0].transcript;
            log(`DÉTECTION VOCALE: "${txt}"`);
            // Ici on pourrait faire répondre une IA, mais l'utilisateur veut du réel.
            // On enregistre l'événement.
        };

        document.getElementById('mic-btn').addEventListener('click', () => {
            try { state.recognition.start(); } catch(e){}
        });
    }

    function speakLast() {
        // Simulation lecture log (optionnel)
        log("FONCTION LECTURE NON ACTIVÉE EN MODE RÉEL");
    }

    // --- INIT ---
    window.onload = async () => {
        log("CHARGEMENT PILOTES MATÉRIELS...");
        
        await initAudio();
        initMotion();
        initMagnetometer();
        await initBattery();

        // Auto calibrate after short delay
        setTimeout(calibrate, 1000);
    };

</script>
</body>
</html>
