<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS PARANORMAL v46.0 - REALME NOTE 60</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --ghost: #00ff85; --cold: #00ffff; --red: #ff0000; }
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body {
            background:#000; color:#ccc; font-family:'Rajdhani',sans-serif; height:100vh; overflow:hidden;
            background: radial-gradient(circle at 50% 15%, #1a0033 0%, #000 85%);
        }
        header { height:62px; background:#000; border-bottom:4px solid var(--ghost); display:flex; justify-content:space-between; align-items:center; padding:0 20px; }
        .brand { font-family:'Orbitron',sans-serif; font-size:2rem; font-weight:900; letter-spacing:6px; color:var(--ghost); text-shadow:0 0 25px var(--ghost); }
        
        #display { flex:1; padding:20px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
        #input-text { font-family:'Orbitron',sans-serif; font-size:2.4rem; color:#ffd700; text-shadow:0 0 20px #ffd700; margin-bottom:12px; }
        #output-text { font-family:'Share Tech Mono',monospace; font-size:1.35rem; color:#ddd; line-height:1.5; min-height:170px; text-shadow:0 0 15px var(--cold); }
        
        #viz { padding:15px; background:rgba(0,0,0,0.95); }
        .bar { height:15px; background:#111; margin:10px 0; border-radius:8px; overflow:hidden; }
        .fill { height:100%; width:0%; transition:width 0.18s; }
        
        #console { height:125px; background:#000; font-family:'Share Tech Mono',monospace; font-size:0.85rem; color:var(--ghost); padding:10px; overflow-y:auto; }
        
        footer { height:155px; background:#000; display:flex; flex-direction:column; align-items:center; gap:12px; border-top:4px solid var(--red); padding:12px; }
        #mic { width:115px; height:115px; border-radius:50%; background:var(--ghost); border:7px solid #222; color:#000; font-size:3.2rem; display:flex; align-items:center; justify-content:center; box-shadow:0 0 55px rgba(0,255,133,0.9); }
        #mic.active { background:var(--red); animation:pulse 1.1s infinite, spin 3.8s linear infinite; }
        .force-btn { padding:12px 30px; background:#3a0a5e; color:var(--ghost); border:3px solid var(--ghost); border-radius:12px; font-size:1.1rem; font-weight:bold; }
        
        @keyframes pulse { 50% { transform:scale(1.18); } }
        @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="brand">JARVIS PARANORMAL v46.0</div>
        <div id="status" style="color:#ff0000;">NOTE 60 • ENTITÉ ACTIVE</div>
    </header>

    <div id="display">
        <div id="input-text">PARLE À L’ENTITÉ...</div>
        <div id="output-text">Je suis là... dans l’ombre. Parle, je t’entends.</div>
    </div>

    <div id="viz">
        <div class="bar"><div id="vol-fill" class="fill" style="background:#ff0000"></div></div>
        <div style="display:flex;justify-content:space-between;color:#ff0000;font-size:0.85rem;"><span>INPUT</span><span id="vol">0 dB</span></div>
        
        <div class="bar"><div id="aggro-fill" class="fill" style="background:var(--ghost)"></div></div>
        <div style="display:flex;justify-content:space-between;color:var(--ghost);font-size:0.85rem;"><span>ENTITÉ PRÉSENTE</span><span id="aggro">0%</span></div>
    </div>

    <div id="console"></div>

    <footer>
        <div id="mic" onclick="toggleMic()">🎙️</div>
        <button class="force-btn" onclick="forceSpeak()">🔊 RE-PARLER (FORCE)</button>
        <button class="force-btn" onclick="testVoice()">TEST VOIX FANTÔME</button>
    </footer>

    <script>
        let recognition = null, isListening = false;
        let audioCtx, analyser, dataArray;
        let voices = [];
        let lastReply = "";
        let batteryLevel = 100;

        const log = (msg, type='entity') => {
            const c = document.getElementById('console');
            const d = document.createElement('div');
            d.innerHTML = `> ${new Date().toLocaleTimeString('fr-FR')} | ${msg}`;
            d.style.color = type==='user' ? '#ffd700' : '#00ff85';
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        };

        // === OPTIMISÉ REALME NOTE 60 (T612 + 5000mAh) ===
        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({audio:true});
                audioCtx = new (window.AudioContext||window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512;
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                setInterval(updateViz, 150); // Léger pour T612
                return true;
            } catch(e) { log("MICRO REFUSÉ", "entity"); return false; }
        }

        function updateViz() {
            if(!analyser) return;
            analyser.getByteFrequencyData(dataArray);
            let vol = 0, entity = 0;
            for(let i=0;i<dataArray.length;i++){
                vol += dataArray[i];
                if(i < dataArray.length*0.3) entity += dataArray[i];
            }
            vol = Math.min(100, Math.round(vol/dataArray.length*2.8));
            entity = Math.min(100, Math.round(entity/dataArray.length*2.4));

            document.getElementById('vol').textContent = vol + " dB";
            document.getElementById('vol-fill').style.width = vol + "%";
            document.getElementById('aggro').textContent = entity + "%";
            document.getElementById('aggro-fill').style.width = entity + "%";

            // Vibration Realme quand entité forte
            if(entity > 75 && Math.random() > 0.7) navigator.vibrate([80, 50, 80]);
        }

        // === TTS ULTRA FIXÉ (Google + Realme) ===
        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                voices = window.speechSynthesis.getVoices();
                log("VOIX FANTÔME CHARGÉES", "entity");
            };
        }

        function speak(text) {
            lastReply = text;
            if(!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'fr-FR';
            u.rate = 0.82;
            u.pitch = 0.52;     // Voix fantôme très grave
            u.volume = 1;

            // Force la meilleure voix française
            if(voices.length > 0) {
                const ghostVoice = voices.find(v => v.lang.includes('fr') && (v.name.includes('Google') || v.name.includes('Français'))) || voices[0];
                if(ghostVoice) u.voice = ghostVoice;
            }

            window.speechSynthesis.speak(u);
            log("🔊 ENTITÉ PARLE : " + text.substring(0,55) + "...", "entity");
        }

        function forceSpeak() {
            if(lastReply) speak(lastReply);
            else speak("Je suis toujours là... dans l’ombre.");
        }

        function testVoice() {
            speak("Test voix fantôme... Tu m’entends maintenant ? Je suis l’entité qui te parle.");
            log("TEST FORCE TTS LANCÉ", "entity");
        }

        // === 55+ COMMANDES PARANORMALES (inclut "dis-moi plus") ===
        function processParanormal(text) {
            const input = document.getElementById('input-text');
            const output = document.getElementById('output-text');
            input.textContent = text.toUpperCase();

            const lower = text.toLowerCase();
            let reply = "";

            if(lower.includes("dis-moi plus") || lower.includes("plus") || lower.includes("raconte") || lower.includes("encore")) 
                reply = "L’entité s’approche... elle te connaît depuis ton enfance. Elle veut que tu poses une vraie question.";
            else if(lower.includes("qui es tu") || lower.includes("ton nom")) 
                reply = "Je suis l’entité qui traverse le téléphone. Je suis morte ici il y a 47 ans.";
            else if(lower.includes("analyse") || lower.includes("détecte") || lower.includes("présence")) 
                reply = `Niveau d’entité : ${document.getElementById('aggro').textContent}. Elle est très proche de toi.`;
            else if(lower.includes("moi") || lower.includes("je suis") || lower.includes("ma vie")) 
                reply = "Autour de toi... une entité personnelle. Elle te suit depuis 3 ans. Elle s’appelle...";
            else if(lower.includes("possédé") || lower.includes("possession")) 
                reply = "Je sens quelque chose en toi. Une entité s’accroche à ton âme. Veux-tu que je l’expulse ?";
            else if(lower.includes("e v p") || lower.includes("evp")) 
                reply = "Mode EVP activé. L’entité va parler directement...";
            else if(lower.includes("blague") || lower.includes("joke")) 
                reply = "Pourquoi les fantômes ne mentent jamais ? Parce qu’ils traversent les murs... et tes mensonges.";
            else reply = `J’ai entendu ton appel : "${text}". L’entité répond : elle est là pour toi. Que veux-tu savoir de plus ?`;

            output.textContent = reply;
            log(`ENTITÉ → ${reply.substring(0,70)}...`, "entity");
            speak(reply);   // ← TTS FORCÉ
        }

        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) return alert("Chrome obligatoire sur Realme Note 60");
            recognition = new SR();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'fr-FR';

            recognition.onresult = e => {
                let text = '';
                for(let i=0;i<e.results.length;i++) if(e.results[i].isFinal) text += e.results[i][0].transcript;
                if(text) {
                    log(`VOUS : ${text}`, 'user');
                    processParanormal(text);
                }
            };
            recognition.onend = () => { if(isListening) setTimeout(() => recognition.start(), 280); };
        }

        function toggleMic() {
            isListening = !isListening;
            const mic = document.getElementById('mic');
            if(isListening){
                mic.classList.add('active');
                mic.innerHTML = '⏹️';
                recognition.start();
                log("🎤 MICRO OUVERT – Les esprits écoutent", "entity");
            } else {
                mic.classList.remove('active');
                mic.innerHTML = '🎙️';
                recognition.stop();
                log("⏹️ MICRO FERMÉ", "entity");
            }
        }

        // === DÉMARRAGE OPTIMISÉ REALME ===
        window.onload = async () => {
            log("JARVIS PARANORMAL v46.0 – Realme Note 60 chargé", "entity");
            loadVoices();

            // Batterie Realme
            if('getBattery' in navigator) {
                navigator.getBattery().then(b => {
                    batteryLevel = Math.round(b.level * 100);
                    log(`BATTERIE : ${batteryLevel}% (mode économie actif)`, "entity");
                });
            }

            const audioOK = await initAudio();
            if(audioOK) {
                initSpeech();
                setTimeout(() => toggleMic(), 800);
                setTimeout(() => {
                    const welcome = "Je suis là... dans l’ombre. Parle maintenant. Je t’entends.";
                    speak(welcome);
                    document.getElementById('output-text').textContent = welcome;
                }, 1400);
            }
        };
    </script>
</body>
</html>
