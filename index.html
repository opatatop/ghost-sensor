<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUPRA ETERNITY v32 — NET DIAG ⚡</title>
    <style>
        :root { 
            --primary: #00ffff; --secondary: #bc13fe; --bg: #000000; --panel: #050505; 
            --text: #e0e0ff; --danger: #ff0000; --accent: #00ff88; --evp: #ffaa00; 
            --ghost: #ff3333; --warn: #ffaa00;
        }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            margin:0; padding:0; font-family:'Courier New',monospace; background:var(--bg); 
            color:var(--text); display:flex; flex-direction:column; height:100vh; overflow:hidden;
        }
        
        /* HEADER */
        header { background:#000; border-bottom:2px solid var(--primary); padding:10px 15px; display:flex; justify-content:space-between; align-items:center; z-index:50; }
        h1 { font-size:0.9rem; color:var(--primary); text-shadow:0 0 10px var(--primary); letter-spacing:1px; margin:0; line-height:1.2; text-transform:uppercase; }
        .version { font-size:0.6em; color:var(--warn); display:block; letter-spacing:1px; }
        #netStatus { font-size:0.6rem; padding:2px 5px; background:#222; color:#555; border-radius:3px; margin-left:10px; }
        #netStatus.online { color:var(--accent); border:1px solid var(--accent); }
        #netStatus.offline { color:var(--danger); border:1px solid var(--danger); }

        /* MAIN VISUALIZER */
        main { flex:1; position:relative; display:flex; flex-direction:column; background:#000; }
        #visualizer { flex:1; position:relative; overflow:hidden; border-bottom:1px solid #222; }
        canvas { width:100%; height:100%; display:block; }

        /* OVERLAYS */
        #displayOverlay { position:absolute; top:20%; left:50%; transform:translateX(-50%); text-align:center; pointer-events:none; z-index:30; width:95%; }
        #mainText { font-size:1.8rem; font-weight:900; color:#fff; background:rgba(0,0,0,0.9); padding:10px 20px; border:2px solid var(--primary); text-transform:uppercase; margin-bottom:5px; letter-spacing:2px; }
        #liveTranscript { font-size:1.2rem; color:var(--accent); font-weight:bold; background:rgba(0,0,0,0.8); padding:5px 10px; border:1px solid var(--accent); min-height:30px; text-transform:uppercase; letter-spacing:1px;}
        
        /* STATUS */
        #micStatus { position:absolute; top:10px; left:10px; font-size:0.7rem; font-weight:bold; padding:4px 8px; border-radius:3px; background:#111; border:1px solid #555; color:#555; display:none; }
        #micStatus.active { border-color:var(--accent); color:var(--accent); background:rgba(0,50,0,0.5); animation: blink 1s infinite; }
        #volumeBar { position:absolute; bottom:0; left:0; height:4px; background:var(--accent); width:0%; transition:width 0.1s; z-index:40; }
        #hud { position:absolute; bottom:10px; left:10px; background:rgba(0,0,0,0.8); padding:5px 10px; border:1px solid #333; font-size:0.7rem; color:#888; z-index:41; }
        
        @keyframes blink { 50% { opacity:0.5; } }

        /* CONTROLS GRID */
        #actionGrid { display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; padding:8px; background:var(--panel); border-top:1px solid #333; }
        .grid-btn { background:#0a0a0a; border:1px solid #333; color:#666; padding:12px 2px; border-radius:0; text-align:center; font-size:0.6rem; cursor:pointer; transition:all 0.1s; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
        .grid-btn span:first-child { font-size:1.4rem; }
        .grid-btn.active-state { background:var(--secondary); color:#fff; border-color:var(--secondary); }
        .grid-btn.active-evp { background:var(--evp); color:#000; border-color:var(--evp); }

        /* MAIN BUTTONS */
        #controls { background:var(--panel); padding:10px; display:grid; gap:8px; border-top:1px solid #222; }
        button { background:#000; border:1px solid var(--primary); color:var(--primary); padding:15px; font-size:0.9rem; font-weight:bold; cursor:pointer; text-transform:uppercase; letter-spacing:1px; font-family:'Courier New'; }
        button:active { background:var(--primary); color:#000; }
        button.active-mode { background:var(--primary); color:#000; box-shadow:0 0 15px var(--primary); }
        button.danger { border-color:var(--danger); color:var(--danger); }
        button.warning { border-color:var(--warn); color:var(--warn); }

        /* TERMINAL */
        #terminal { height:110px; background:#000; border-top:1px solid #333; padding:8px; font-size:0.65rem; overflow-y:auto; color:#666; line-height:1.4; font-family:'Courier New', monospace; }
        .log-line { margin-bottom:2px; border-left:2px solid #333; padding-left:6px; word-break:break-all; }
        .log-sys { border-color:#555; color:#888; }
        .log-raw { border-color:#444; color:#aaa; font-style:italic; font-size:0.6rem; }
        .log-ai { border-color:var(--secondary); color:var(--secondary); background:rgba(40,0,40,0.2); }
        .log-entity { border-color:#ff00ff; color:#ff00ff; font-weight:bold; }
        .log-error { border-color:var(--danger); color:var(--danger); background:rgba(50,0,0,0.3); font-weight:bold; }
        .log-warn { border-color:var(--warn); color:var(--warn); }

        /* MODAL */
        #settingsModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.98); z-index:300; align-items:center; justify-content:center; }
        .modal-content { width:95%; max-width:500px; background:#111; border:2px solid var(--secondary); padding:20px; box-shadow:0 0 30px rgba(188,19,254,0.2); }
        .setting-row { display:flex; justify-content:space-between; align-items:center; margin:15px 0; border-bottom:1px solid #333; padding-bottom:10px; }
        label { font-size:0.9rem; color:#ddd; }
        input[type=range] { accent-color:var(--secondary); width:50%; }
        input[type=password] { background:#222; border:1px solid #555; color:#fff; padding:8px; width:60%; font-family:'Courier New'; }
        .close-btn { float:right; font-size:2rem; color:var(--danger); cursor:pointer; line-height:1; }

        #evpWaveform { height:50px; background:#000; width:100%; display:none; border-top:1px solid #333; }
    </style>
</head>
<body>

    <header>
        <div style="display:flex;align-items:center;">
            <div>
                <h1>SUPRA ETERNITY <span class="version">v32 NET DIAG</span></h1>
            </div>
            <div id="netStatus">OFFLINE</div>
        </div>
        <button onclick="App.toggleSettings()" style="background:none;border:1px solid var(--secondary);color:var(--secondary);width:32px;height:32px;border-radius:0;font-size:1.2rem;">⚙️</button>
    </header>

    <main>
        <div id="visualizer">
            <canvas id="scopeCanvas"></canvas>
            <div id="micStatus">MICRO OFF</div>
            <div id="volumeBar"></div>
            
            <div id="displayOverlay">
                <div id="mainText">SYSTÈME ARRÊTÉ</div>
                <div id="liveTranscript">EN ATTENTE DONNÉES</div>
            </div>
            
            <div id="hud">EMF: <span id="valEmf">0.0</span> | MAG: <span id="valMag">0</span>°</div>
        </div>
        <canvas id="evpWaveform"></canvas>
    </main>

    <div id="actionGrid">
        <div class="grid-btn" onclick="App.toggleSettings()"><span>⚙️</span>CONFIG</div>
        <div class="grid-btn active-state" id="btnEMF" onclick="FeatureEngine.toggleEMF()"><span>📡</span>EMF</div>
        <div class="grid-btn active-state" id="btnVAD" onclick="FeatureEngine.toggleVAD()"><span>🎤</span>IA VOIX</div>
        <div class="grid-btn" id="btnGhostBox" onclick="SpiritBox.toggle()"><span>📻</span>GHOST BOX</div>
        <div class="grid-btn active-evp" id="btnEVP" onclick="FeatureEngine.toggleEVP()"><span>📼</span>EVP REC</div>
        <div class="grid-btn" onclick="FeatureEngine.togglePower()"><span>⚡</span>PWR</div>
        <div class="grid-btn" onclick="App.clearLog()"><span>🗑️</span>LOG</div>
        <div class="grid-btn" onclick="App.forceMicRestart()"><span>🔧</span>RST MIC</div>
    </div>

    <div id="controls">
        <button class="active-mode" id="btnMainStart" onclick="App.startFullSystem()">INITIALISER SYSTÈME</button>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;">
            <button onclick="App.replayLastEVP()">⏪ REJOUER EVP</button>
            <button class="danger" onclick="App.stopSystem()">ARRÊTER</button>
        </div>
    </div>

    <div id="terminal"></div>

    <div id="settingsModal">
        <div class="modal-content">
            <span class="close-btn" onclick="App.toggleSettings()">×</span>
            <h2 style="color:var(--primary);margin-top:0;border-bottom:1px solid #333;padding-bottom:10px;">DIAGNOSTIC RÉSEAU</h2>
            
            <p style="font-size:0.8rem;color:#aaa;margin-bottom:15px;">
                Si l'IA ne répond pas, c'est souvent un problème de Clé ou de Crédits.
            </p>
            
            <div class="setting-row">
                <label>Clé API OpenAI</label>
                <input type="password" id="keyinput" placeholder="sk-proj-..." autocomplete="off">
            </div>
            <div style="text-align:right; margin-bottom:15px;">
                <button onclick="App.saveKey()" style="padding:8px 16px; font-size:0.8rem; background:var(--primary); color:#000; border:none;">SAUVEGARDER</button>
                <button onclick="App.testConnection()" class="warning" style="padding:8px 16px; font-size:0.8rem; border:1px solid var(--warn); color:var(--warn);">TESTER CONNEXION</button>
            </div>

            <h3 style="color:var(--secondary);font-size:0.9rem;border-bottom:1px solid #333;padding-bottom:5px;">PARAMÈTRES</h3>
            <div class="setting-row">
                <label>Vitesse Balayage</label>
                <input type="range" id="sweepSpeed" min="10" max="200" step="10" value="80" oninput="Config.update(this)">
            </div>
            <div class="setting-row">
                <label>Seuil EMF (μT)</label>
                <input type="range" id="emfSensitivity" min="10" max="90" step="5" value="45" oninput="Config.update(this)">
            </div>

            <button style="width:100%;margin-top:20px;" onclick="App.toggleSettings()">FERMER</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION & NET STATUS ---
        const Config = {
            data: { sweepSpeed: 80, emfSensitivity: 45 },
            load() { 
                const saved = localStorage.getItem('supra_v32'); 
                if (saved) Object.assign(this.data, JSON.parse(saved)); 
                ['sweepSpeed', 'emfSensitivity'].forEach(id => {
                    const el = document.getElementById(id);
                    if(el) el.value = this.data[id];
                });
                document.getElementById('keyinput').value = localStorage.getItem('supra_api_key') || "";
            },
            save() { localStorage.setItem('supra_v32', JSON.stringify(this.data)); },
            update(el) { this.data[el.id] = parseFloat(el.value); this.save(); }
        };

        function updateNetStatus() {
            const el = document.getElementById('netStatus');
            if(navigator.onLine) {
                el.innerText = "ONLINE";
                el.className = "online";
            } else {
                el.innerText = "OFFLINE";
                el.className = "offline";
            }
        }
        window.addEventListener('online', updateNetStatus);
        window.addEventListener('offline', updateNetStatus);

        let apiKey = localStorage.getItem('supra_api_key') || "";
        let lastTrigger = 0;
        let isSystemRunning = false;
        
        // --- 2. MOTEUR AUDIO ---
        const AudioEngine = {
            ctx: null, analyser: null, stream: null, microphone: null, dataArray: null,
            async init() {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    if (this.ctx.state === 'suspended') await this.ctx.resume();
                    const constraints = { audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false, channelCount: 1 } };
                    this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.microphone = this.ctx.createMediaStreamSource(this.stream);
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 2048; 
                    this.microphone.connect(this.analyser);
                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                    App.log("Audio OK.", "sys");
                    EVPRecorder.init(this.ctx, this.stream);
                    return true;
                } catch(e) {
                    App.log("ERR MICRO: " + e.name, "error");
                    return false;
                }
            },
            stop() {
                if(this.stream) this.stream.getTracks().forEach(t => t.stop());
                if(this.ctx) this.ctx.close();
                EVPRecorder.stop();
                SpiritBox.stop();
            }
        };

        // --- 3. GHOST BOX & EVP (Same as before) ---
        const SpiritBox = {
            node: null, gain: null, filter: null, isActive: false, currentFreq: 100, direction: 1, raf: null,
            init(ctx) {
                if(!ctx) return;
                const bufferSize = 2 * ctx.sampleRate;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (Math.random() > 0.99 ? 2.0 : 0.8);
                this.node = ctx.createBufferSource();
                this.node.buffer = buffer;
                this.node.loop = true;
                this.filter = ctx.createBiquadFilter();
                this.filter.type = 'bandpass';
                this.filter.frequency.value = this.currentFreq;
                this.filter.Q.value = 5;
                this.gain = ctx.createGain();
                this.gain.gain.value = 0.0;
                this.node.connect(this.filter);
                this.filter.connect(this.gain);
            },
            toggle() { if (this.isActive) this.stop(); else this.start(); },
            start() {
                if (!AudioEngine.ctx) return;
                if (!this.node) this.init(AudioEngine.ctx);
                this.isActive = true;
                this.node.start(0);
                this.gain.connect(AudioEngine.ctx.destination);
                this.gain.gain.setTargetAtTime(0.5, AudioEngine.ctx.currentTime, 0.1);
                document.getElementById('btnGhostBox').classList.add('active-state');
                App.log("Ghost Box ON.", "sys");
                this.sweep();
            },
            stop() {
                this.isActive = false;
                if (this.gain) {
                    this.gain.gain.setTargetAtTime(0, AudioEngine.ctx.currentTime, 0.1);
                    setTimeout(() => {
                        if(this.node) { try { this.node.stop(); } catch(e){} this.gain.disconnect(); }
                    }, 200);
                }
                cancelAnimationFrame(this.raf);
                document.getElementById('btnGhostBox').classList.remove('active-state');
            },
            sweep() {
                if (!this.isActive) return;
                const speed = Config.data.sweepSpeed;
                this.currentFreq *= (1 + (this.direction * (speed * 0.001)));
                if (this.currentFreq > 5000) { this.direction = -1; }
                if (this.currentFreq < 100) { this.direction = 1; }
                this.filter.frequency.setTargetAtTime(this.currentFreq, AudioEngine.ctx.currentTime, 0.05);
                this.raf = requestAnimationFrame(() => this.sweep());
            }
        };

        const EVPRecorder = {
            mediaRecorder: null, audioChunks: [], audioContext: null,
            init(ctx, stream) {
                this.audioContext = ctx;
                try {
                    this.mediaRecorder = new MediaRecorder(stream);
                    this.mediaRecorder.ondataavailable = (e) => { this.audioChunks = [e.data]; };
                    this.start();
                } catch(e) { App.log("EVP Error", "error"); }
            },
            start() { if(this.mediaRecorder && this.mediaRecorder.state === "inactive") { this.mediaRecorder.start(4000); document.getElementById('evpWaveform').style.display = 'block'; } },
            stop() { if(this.mediaRecorder && this.mediaRecorder.state !== "inactive") { this.mediaRecorder.stop(); document.getElementById('evpWaveform').style.display = 'none'; } },
            async playLastCapture() {
                if(this.audioChunks.length === 0) return;
                const blob = new Blob(this.audioChunks, { type: 'audio/webm' });
                const arrayBuffer = await blob.arrayBuffer();
                const audioBuffer = await this.audioContext.decodeAudioData(arrayBuffer);
                const source = this.audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.playbackRate.value = 0.85;
                const filter = this.audioContext.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 600;
                const gain = this.audioContext.createGain();
                gain.gain.value = 2.0;
                source.connect(filter);
                filter.connect(gain);
                gain.connect(this.audioContext.destination);
                source.start(0);
            }
        };

        const VisualEngine = {
            canvas: null, ctx: null,
            init() {
                this.canvas = document.getElementById('scopeCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.loop();
            },
            resize() { this.canvas.width = this.canvas.parentElement.clientWidth; this.canvas.height = this.canvas.parentElement.clientHeight; },
            loop() {
                if(!isSystemRunning) return;
                requestAnimationFrame(() => this.loop());
                const w = this.canvas.width, h = this.canvas.height;
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, w, h);
                if (AudioEngine.dataArray) {
                    const data = AudioEngine.dataArray;
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, h);
                    for (let i = 0; i < data.length; i++) {
                        const v = data[i] / 255;
                        const y = h - (v * h);
                        this.ctx.lineTo(i * (w / data.length), y);
                    }
                    this.ctx.strokeStyle = '#00ffff';
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                    let sum = 0;
                    for(let i=0; i<data.length; i++) sum += data[i];
                    document.getElementById('volumeBar').style.width = Math.min(100, (sum / data.length) * 2) + "%";
                }
            }
        };

        // --- 4. CERVEAU & IA (PRECISE ERROR LOGGING) ---
        const BrainEngine = {
            recognition: null,
            speak(text) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.rate = 0.9; u.pitch = 0.6;
                window.speechSynthesis.speak(u);
            },
            initVoice() {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return;
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if(this.recognition) try { this.recognition.stop(); } catch(e){}
                this.recognition = new SR();
                this.recognition.lang = 'fr-FR';
                this.recognition.continuous = true;
                this.recognition.interimResults = true;
                this.recognition.onstart = () => {
                    const s = document.getElementById('micStatus'); s.style.display = 'block'; s.className = 'active'; s.innerText = "MICRO ACTIF";
                };
                this.recognition.onend = () => {
                    const s = document.getElementById('micStatus'); s.className = ''; s.innerText = "RESTARTING...";
                    if(isSystemRunning && FeatureEngine.vadActive) setTimeout(() => { if(FeatureEngine.vadActive && isSystemRunning) try { this.initVoice(); } catch(e){} }, 500);
                    else s.style.display = 'none';
                };
                this.recognition.onerror = (e) => { if(e.error === 'not-allowed') App.log("ERR: Permissions refusées.", "error"); };
                this.recognition.onresult = (e) => {
                    const r = e.results[e.results.length-1];
                    const t = r[0].transcript;
                    const isFinal = r.isFinal;
                    document.getElementById('liveTranscript').innerText = t;
                    if(t.length > 0) App.log(`RAW: "${t}" [${isFinal?'FINAL':'INT'}]`, "raw");
                    if (isFinal || (t.length > 5 && (Date.now() - lastTrigger > 3000))) {
                        App.handleDetection("VOICE", t);
                        EVPRecorder.playLastCapture();
                        setTimeout(() => { if(document.getElementById('liveTranscript').innerText === t) document.getElementById('liveTranscript').innerText = "..."; }, 4000);
                    }
                };
                try { this.recognition.start(); } catch(e){}
            }
        };

        async function triggerAI(source, data) {
            if (Date.now() - lastTrigger < 3000) return;
            lastTrigger = Date.now();
            const display = document.getElementById('mainText');
            display.innerText = "ANALYSE RÉSEAU...";
            display.style.color = "var(--secondary)";

            if (!apiKey) {
                App.log("ERR: Clé API manquante.", "error");
                display.innerText = "ERR: NO KEY";
                display.style.color = "var(--danger)";
                BrainEngine.speak("Clé API manquante.");
                return;
            }

            try {
                App.log(`Requête IA : ${data}`, "ai");
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo",
                        messages: [
                            { role: "system", content: "Tu es ZEUS, analyse paranormale." },
                            { role: "user", content: `Source: ${source}. Données: "${data}".` }
                        ],
                        max_tokens: 50, temperature: 0.7
                    })
                });

                // --- DIANOGSTIC PRECIS DES ERREURS ---
                if (!response.ok) {
                    let msg = `Erreur HTTP ${response.status}`;
                    if (response.status === 401) msg = "CLÉ API INVALIDE (401)";
                    else if (response.status === 429) msg = "CRÉDITS ÉPUISÉS / LIMITÉ (429)";
                    else if (response.status === 500) msg = "SERVEUR OPENAI HS (500)";
                    else if (response.status === 404) msg = "MODÈLE NON TROUVÉ (404)";
                    throw new Error(msg);
                }

                const json = await response.json();
                const reply = json.choices[0].message.content;
                App.log(`SUCCÈS IA : ${reply}`, "ai");
                BrainEngine.speak(reply);
                display.innerText = reply.toUpperCase();
                display.style.color = "#fff";

            } catch (error) {
                // Erreur réseau ou HTTP
                App.log(`ÉCHEC IA : ${error.message}`, "error");
                display.innerText = error.message; // Affiche "CLÉ INVALIDE" ou "ECHEC CONNEXION"
                display.style.color = "var(--danger)";
                BrainEngine.speak("Erreur de connexion.");
            }
        }

        // --- 5. APP & LOGIC ---
        const FeatureEngine = {
            emfActive: true, vadActive: true, evpActive: true,
            toggleEMF() { this.emfActive = !this.emfActive; document.getElementById('btnEMF').classList.toggle('active-state'); },
            toggleVAD() { 
                this.vadActive = !this.vadActive; 
                document.getElementById('btnVAD').classList.toggle('active-state');
                if(this.vadActive && isSystemRunning) BrainEngine.initVoice();
                else if(BrainEngine.recognition) { BrainEngine.recognition.stop(); document.getElementById('micStatus').style.display='none'; }
            },
            toggleEVP() { 
                this.evpActive = !this.evpActive; 
                document.getElementById('btnEVP').classList.toggle('active-evp'); 
                if(this.evpActive) EVPRecorder.start(); else EVPRecorder.stop();
            },
            togglePower() { }
        };

        const App = {
            log(msg, type) {
                const t = document.getElementById('terminal');
                const d = document.createElement('div');
                d.className = 'log-line log-' + type;
                d.innerText = `[${new Date().toLocaleTimeString('fr-FR')}] ${msg}`;
                t.appendChild(d);
                t.scrollTop = t.scrollHeight;
            },
            clearLog() { document.getElementById('terminal').innerHTML = ''; },
            saveKey() { apiKey = document.getElementById('keyinput').value.trim(); localStorage.setItem('supra_api_key', apiKey); this.log("Clé sauvegardée.", "sys"); this.toggleSettings(); },
            toggleSettings() { const m = document.getElementById('settingsModal'); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; },
            async testConnection() {
                const k = document.getElementById('keyinput').value.trim();
                if(!k) { alert("Entrez une clé d'abord."); return; }
                this.log("Test de connexion en cours...", "warn");
                try {
                    const r = await fetch("https://api.openai.com/v1/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${k}` },
                        body: JSON.stringify({ model: "gpt-3.5-turbo", messages: [{role:"user", content:"Hi"}], max_tokens: 5 })
                    });
                    if(r.ok) { alert("SUCCÈS ! La clé fonctionne."); this.log("Test Clé : SUCCÈS", "ai"); }
                    else {
                        let e = `Erreur ${r.status}`;
                        if(r.status===401) e = "Clé Invalide";
                        if(r.status===429) e = "Crédits épuisés";
                        alert("ÉCHEC : " + e);
                        this.log("Test Clé : " + e, "error");
                    }
                } catch(err) { alert("ÉCHEC RÉSEAU : " + err.message); this.log("Test Clé : Erreur Réseau", "error"); }
            },
            handleDetection(type, details) { App.log(`CAPTEUR [${type}] : ${details}`, "entity"); triggerAI(type, details); },
            forceMicRestart() { if(BrainEngine.recognition) { try { BrainEngine.recognition.stop(); } catch(e){} App.log("Redémarrage micro...", "sys"); } },
            async startFullSystem() {
                if(isSystemRunning) return;
                const btn = document.getElementById('btnMainStart'); btn.innerHTML = "INITIALISATION...";
                if (!await AudioEngine.init()) { btn.innerHTML = "ERREUR MATÉRIEL"; return; }
                isSystemRunning = true;
                VisualEngine.init();
                if(FeatureEngine.vadActive) BrainEngine.initVoice();
                if(FeatureEngine.evpActive) EVPRecorder.start();
                btn.innerHTML = "SYSTÈME ACTIF";
                btn.classList.add("active-mode");
                document.getElementById('mainText').innerText = "SUPRA ACTIF";
                this.log("v32 NET DIAG démaré.", "sys");
                BrainEngine.speak("Système en ligne.");
            },
            stopSystem() {
                isSystemRunning = false;
                AudioEngine.stop();
                if(BrainEngine.recognition) BrainEngine.recognition.stop();
                window.speechSynthesis.cancel();
                document.getElementById('btnMainStart').innerHTML = "INITIALISER SYSTÈME";
                document.getElementById('btnMainStart').classList.remove("active-mode");
                document.getElementById('mainText').innerText = "ARRÊTÉ";
                this.log("Arrêt.", "sys");
            },
            replayLastEVP() { EVPRecorder.playLastCapture(); }
        };

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', e => {
                if(!isSystemRunning || !FeatureEngine.emfActive) return;
                const emf = (Math.abs(e.alpha-180) + Math.abs(e.beta) + Math.abs(e.gamma))/4 + (Math.random()*2);
                document.getElementById('valEmf').innerText = emf.toFixed(1);
                document.getElementById('valMag').innerText = Math.round(e.alpha||0);
                if (emf > Config.data.emfSensitivity && Date.now() - lastTrigger > 8000) App.handleDetection("EMF", `${emf.toFixed(1)} μT`);
            });
        }

        window.onload = () => { Config.load(); updateNetStatus(); App.log("v32 NET DIAG Ready.", "sys"); };
    </script>
</body>
</html>
