<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUPRA LAB v35 — HARDWARE INTERFACE</title>
    <style>
        :root { 
            --primary: #00ff41; /* Vert Labo */
            --secondary: #008f11; 
            --bg: #050505; --panel: #0a0a0a; 
            --text: #cccccc; --danger: #ff3333; --warn: #ffcc00; 
            --grid: #1a1a1a;
        }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin:0; padding:0; font-family:'Consolas','Monaco',monospace; background:var(--bg); 
            color:var(--text); display:flex; flex-direction:column; height:100vh; overflow: hidden;
        }
        
        /* HEADER LABO */
        header { background:#000; border-bottom:2px solid var(--primary); padding:8px 10px; display:flex; justify-content:space-between; align-items:center; z-index:50; flex-shrink: 0; }
        h1 { font-size:0.9rem; color:var(--primary); letter-spacing:1px; margin:0; text-transform:uppercase; font-weight:bold; }
        .version { font-size:0.6em; color:var(--warn); display:block; letter-spacing:1px; }
        
        #netStatus { font-size:0.65rem; padding:2px 6px; background:#111; border:1px solid #333; color:#555; font-family:monospace; }
        #netStatus.ok { border-color:var(--primary); color:var(--primary); }
        #netStatus.fail { border-color:var(--danger); color:var(--danger); animation: blink 1s infinite; }

        /* MAIN SCOPE AREA */
        main { flex:1; position:relative; display:flex; flex-direction:column; background:var(--bg); overflow:hidden; }
        
        /* OSCILOSCOPE VIEW (NOUVEAU) */
        #scopeContainer { flex:1; position:relative; border-bottom:1px solid #333; background: repeating-linear-gradient(0deg, transparent, transparent 19px, #111 20px), repeating-linear-gradient(90deg, transparent, transparent 19px, #111 20px); }
        canvas { width:100%; height:100%; display:block; }

        /* TECHNICAL OVERLAYS */
        #techOverlay { position:absolute; top:5px; left:5px; right:5px; display:flex; justify-content:space-between; pointer-events:none; font-size:0.6rem; color:var(--primary); opacity:0.7; font-family:monospace; }
        .data-block { background:rgba(0,0,0,0.5); padding:2px 4px; border:1px solid var(--primary); }

        #mainText { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); text-align:center; pointer-events:none; z-index:30; width:90%; }
        #statusLine { font-size:1.5rem; color:var(--primary); text-shadow:0 0 5px var(--primary); background:rgba(0,0,0,0.8); padding:5px 10px; border:1px solid var(--primary); display:inline-block; }
        #subLine { font-size:0.8rem; color:var(--warn); margin-top:5px; background:rgba(0,0,0,0.8); padding:2px 5px; display:inline-block; letter-spacing:1px; }

        /* CONTROLS - TECH STYLE */
        #controlDeck { background:var(--panel); border-top:2px solid #333; padding:8px; flex-shrink: 0; display:flex; flex-direction:column; gap:5px; }
        
        .dial-row { display:flex; gap:5px; justify-content:space-between; }
        
        button { 
            background:#111; border:1px solid #333; color:#666; padding:12px; 
            font-family:'Consolas',monospace; font-size:0.75rem; font-weight:bold; cursor:pointer; 
            text-transform:uppercase; letter-spacing:1px; position:relative; overflow:hidden;
            flex:1;
        }
        button::before { content:''; position:absolute; top:0; left:0; width:2px; height:100%; background:#333; }
        button:active { background:#222; }
        
        button.active-state { background:var(--primary); color:#000; border-color:var(--primary); box-shadow:0 0 10px rgba(0,255,65,0.2); }
        button.active-state::before { background:#000; }
        
        button.danger { color:var(--danger); border-color:#522; }
        button.danger:active { background:var(--danger); color:#000; }

        /* TERMINAL - HEX DUMP STYLE */
        #terminal { 
            height: 120px; background:#000; border-top:1px solid #333; 
            padding:5px; font-size:0.65rem; color:#555; 
            overflow-y: auto; font-family:'Consolas',monospace; line-height:1.2;
            flex-shrink: 0; -webkit-overflow-scrolling: touch;
        }
        .log-line { margin-bottom:2px; display:flex; }
        .ts { color:#444; margin-right:8px; min-width:60px; }
        .msg { word-break:break-all; }
        .log-sys .msg { color:#888; }
        .log-data .msg { color:var(--primary); }
        .log-warn .msg { color:var(--warn); }
        .log-err .msg { color:var(--danger); font-weight:bold; }
        .log-ai .msg { color:var(--secondary); font-style:italic; }

        /* MODAL */
        #settingsModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:300; align-items:center; justify-content:center; }
        .modal-content { width:95%; max-width:500px; background:#0f0f0f; border:1px solid var(--primary); padding:20px; max-height:90vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
        .setting-row { display:flex; justify-content:space-between; align-items:center; margin:15px 0; border-bottom:1px solid #333; padding-bottom:10px; }
        label { font-size:0.85rem; color:#ccc; font-family:'Consolas',monospace; text-transform:uppercase; }
        input[type=range] { accent-color:var(--primary); width:50%; }
        input[type=password] { background:#222; border:1px solid #555; color:var(--primary); padding:8px; width:60%; font-family:'Consolas',monospace; }
        .close-btn { float:right; font-size:1.5rem; color:var(--danger); cursor:pointer; line-height:1; }

        .test-btn { width:100%; background:var(--warn); color:#000; border:none; padding:10px; margin-top:10px; font-weight:bold; cursor:pointer; }

        @keyframes blink { 50% { opacity:0.4; } }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>SUPRA LAB <span class="version">v35 HARDWARE</span></h1>
        </div>
        <div id="netStatus">NET: UNK</div>
    </header>

    <main>
        <div id="scopeContainer">
            <canvas id="mainCanvas"></canvas>
            
            <div id="techOverlay">
                <div class="data-block">FFT: 2048</div>
                <div class="data-block">SR: 48kHz</div>
            </div>

            <div id="mainText">
                <div id="statusLine">STANDBY</div>
                <div id="subLine">WAITING FOR INPUT...</div>
            </div>
        </div>
    </main>

    <div id="controlDeck">
        <!-- Rangée 1: Capteurs -->
        <div class="dial-row">
            <button id="btnMic" onclick="Lab.toggleMic()">MIC INPUT</button>
            <button id="btnBox" onclick="SpiritBox.toggle()">LINEAR SWEEP</button>
            <button id="btnEVP" onclick="Lab.toggleEVP()">AUDIO BUFFER</button>
            <button onclick="Lab.clearLog()">CLR LOG</button>
        </div>
        <!-- Rangée 2: Système -->
        <div class="dial-row">
            <button class="active-mode" id="btnStart" onclick="Lab.startSystem()">INIT SYSTEM</button>
            <button class="danger" onclick="Lab.stopSystem()">HALT</button>
            <button onclick="Lab.toggleSettings()">CONFIG</button>
            <button onclick="Lab.runDiagnostics()" style="color:var(--warn)">NET DIAG</button>
        </div>
    </div>

    <div id="terminal">
        <!-- Logs will appear here -->
    </div>

    <div id="settingsModal">
        <div class="modal-content">
            <span class="close-btn" onclick="Lab.toggleSettings()">×</span>
            <h2 style="color:var(--primary);margin-top:0;text-transform:uppercase;font-size:1.1rem;">System Configuration</h2>
            
            <p style="font-size:0.75rem;color:#888;margin-bottom:15px;">
                HARDWARE INTERFACE MODE. No simulation. Raw sensor data only.
            </p>
            
            <div class="setting-row">
                <label>OpenAI API Key</label>
                <input type="password" id="apiKeyInput" placeholder="sk-proj-...">
            </div>
            <div style="text-align:right; margin-bottom:15px;">
                <button onclick="Lab.saveKey()" style="padding:5px 10px; font-size:0.7rem; background:var(--primary); color:#000; border:none;">SAVE CONFIG</button>
            </div>

            <h3 style="color:var(--primary);font-size:0.8rem;border-bottom:1px solid #333;padding-bottom:5px;margin-bottom:10px;">Signal Processing</h3>
            <div class="setting-row">
                <label>Sweep Rate (Hz/s)</label>
                <input type="range" id="sweepRate" min="50" max="500" step="10" value="200" oninput="Lab.updateConfig(this)">
            </div>
            <div class="setting-row">
                <label>Buffer Size (ms)</label>
                <input type="range" id="bufferSize" min="1000" max="10000" step="500" value="4000" oninput="Lab.updateConfig(this)">
            </div>

            <button class="test-btn" onclick="Lab.runDiagnostics()">RUN FULL NETWORK DIAGNOSTIC</button>
            <div id="diagResult" style="margin-top:10px; font-size:0.75rem; color:#aaa;"></div>

            <button style="width:100%;margin-top:20px;" onclick="Lab.toggleSettings()">CLOSE PANEL</button>
        </div>
    </div>

    <script>
        // --- CONFIG & STATE ---
        const State = {
            active: false,
            mic: false,
            box: false,
            evp: false,
            apiKey: localStorage.getItem('supra_v35_key') || "",
            config: { sweepRate: 200, bufferSize: 4000 },
            lastTrigger: 0
        };

        // --- AUDIO CORE (REAL) ---
        const AudioCore = {
            ctx: null,
            analyser: null,
            micStream: null,
            micNode: null,
            buffer: [], // Audio buffer for EVP
            isRecording: false,
            
            async init() {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    if (this.ctx.state === 'suspended') await this.ctx.resume();

                    // Get Microphone
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } 
                    });
                    this.micStream = stream;
                    this.micNode = this.ctx.createMediaStreamSource(stream);
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 2048;
                    this.analyser.smoothingTimeConstant = 0.5;
                    this.micNode.connect(this.analyser);
                    
                    Lab.log("AUDIO HW: INITIALIZED (RAW)", "sys");
                    this.startBufferCapture(stream);
                    return true;
                } catch (e) {
                    Lab.log("AUDIO HW: FAILED - " + e.name, "err");
                    return false;
                }
            },
            
            startBufferCapture(stream) {
                // Simple circular buffer logic using MediaRecorder
                if (this.recorder) this.recorder.stop();
                try {
                    this.recorder = new MediaRecorder(stream);
                    this.chunks = [];
                    this.recorder.ondataavailable = e => { this.chunks = [e.data]; }; // Keep only last chunk
                    this.recorder.start(State.config.bufferSize);
                    this.isRecording = true;
                } catch(e) { Lab.log("BUFFER CAPTURE: NOT SUPPORTED", "warn"); }
            },

            getWaveformData() {
                if(!this.analyser) return new Uint8Array(0);
                const data = new Uint8Array(this.analyser.fftSize);
                this.analyser.getByteTimeDomainData(data); // Oscilloscope data
                return data;
            },

            getFFTData() {
                if(!this.analyser) return new Uint8Array(0);
                const data = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(data); // Bar data
                return data;
            },

            stop() {
                if(this.micStream) this.micStream.getTracks().forEach(t => t.stop());
                if(this.ctx) this.ctx.close();
                if(this.recorder) this.recorder.stop();
                this.isRecording = false;
            }
        };

        // --- GHOST BOX (LINEAR SWEEP) ---
        const SpiritBox = {
            node: null, filter: null, gain: null,
            active: false, currentFreq: 100, direction: 1, raf: null,

            start() {
                if(!AudioCore.ctx) return;
                this.init();
                this.node.start(0);
                this.gain.connect(AudioCore.ctx.destination);
                this.active = true;
                document.getElementById('btnBox').classList.add('active-state');
                Lab.log("GHOST BOX: LINEAR SWEEP START", "sys");
                this.sweep();
            },

            stop() {
                this.active = false;
                if(this.gain) this.gain.disconnect();
                cancelAnimationFrame(this.raf);
                document.getElementById('btnBox').classList.remove('active-state');
            },

            init() {
                // Create White Noise
                const bufferSize = 2 * AudioCore.ctx.sampleRate;
                const buffer = AudioCore.ctx.createBuffer(1, bufferSize, AudioCore.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1); // Pure White Noise
                }
                this.node = AudioCore.ctx.createBufferSource();
                this.node.buffer = buffer;
                this.node.loop = true;

                // Bandpass Filter
                this.filter = AudioCore.ctx.createBiquadFilter();
                this.filter.type = 'bandpass';
                this.filter.Q.value = 1.0; // Wide band for "Radio" feel

                this.gain = AudioCore.ctx.createGain();
                this.gain.gain.value = 0.3;

                this.node.connect(this.filter);
                this.filter.connect(this.gain);
            },

            toggle() { this.active ? this.stop() : this.start(); },

            sweep() {
                if(!this.active) return;
                // Linear sweep logic
                const speed = State.config.sweepRate; 
                this.currentFreq += (this.direction * speed);
                
                if(this.currentFreq > 5000) this.direction = -1;
                if(this.currentFreq < 100) this.direction = 1;

                this.filter.frequency.setValueAtTime(this.currentFreq, AudioCore.ctx.currentTime);
                this.raf = requestAnimationFrame(() => this.sweep());
            }
        };

        // --- VISUALIZER ENGINE (OSCILLOSCOPE + FFT) ---
        const Scope = {
            canvas: null, ctx: null,
            init() {
                this.canvas = document.getElementById('mainCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.loop();
            },
            resize() {
                this.canvas.width = this.canvas.parentElement.clientWidth;
                this.canvas.height = this.canvas.parentElement.clientHeight;
            },
            loop() {
                if(!State.active) return;
                requestAnimationFrame(() => this.loop());

                const w = this.canvas.width;
                const h = this.canvas.height;
                
                // Clear with fade
                this.ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
                this.ctx.fillRect(0, 0, w, h);

                // 1. Draw Oscilloscope (Waveform)
                const waveData = AudioCore.getWaveformData();
                this.ctx.lineWidth = 2;
                this.ctx.strokeStyle = '#00ff41';
                this.ctx.beginPath();
                const sliceWidth = w * 1.0 / waveData.length;
                let x = 0;
                for(let i = 0; i < waveData.length; i++) {
                    const v = waveData[i] / 128.0; // 128 is zero
                    const y = v * h / 2;
                    if(i === 0) this.ctx.moveTo(x, y);
                    else this.ctx.lineTo(x, y);
                    x += sliceWidth;
                }
                this.ctx.stroke();

                // 2. Draw Frequency Bars (Background overlay)
                const fftData = AudioCore.getFFTData();
                this.ctx.fillStyle = 'rgba(0, 143, 17, 0.3)';
                const barWidth = (w / fftData.length) * 2.5;
                let bx = 0;
                for(let i = 0; i < fftData.length; i++) {
                    const barHeight = (fftData[i] / 255) * h;
                    this.ctx.fillRect(bx, h - barHeight, barWidth, barHeight);
                    bx += barWidth + 1;
                }
            }
        };

        // --- MAIN LOGIC ---
        const Lab = {
            recognition: null,

            log(msg, type="sys") {
                const t = document.getElementById('terminal');
                const d = document.createElement('div');
                d.className = 'log-line log-' + type;
                const ts = new Date().toLocaleTimeString('fr-FR', {hour12:false, hour:"2-digit", minute:"2-digit", second:"2-digit"});
                d.innerHTML = `<span class="ts">[${ts}]</span><span class="msg">${msg}</span>`;
                t.appendChild(d);
                t.scrollTop = t.scrollHeight;
            },

            clearLog() { document.getElementById('terminal').innerHTML = ''; },

            updateConfig(el) {
                State.config[el.id] = parseFloat(el.value);
            },

            saveKey() {
                State.apiKey = document.getElementById('apiKeyInput').value.trim();
                localStorage.setItem('supra_v35_key', State.apiKey);
                this.log("CONFIG: KEY SAVED TO LOCAL STORAGE", "sys");
                this.toggleSettings();
            },

            toggleSettings() {
                const m = document.getElementById('settingsModal');
                m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
                if(m.style.display === 'flex') {
                    document.getElementById('apiKeyInput').value = State.apiKey;
                    document.getElementById('diagResult').innerText = "";
                }
            },

            async startSystem() {
                if(State.active) return;
                
                this.log("SYS: INITIALIZING SEQUENCE...", "sys");
                const ok = await AudioCore.init();
                if(!ok) {
                    this.log("SYS: CRITICAL HARDWARE FAILURE", "err");
                    document.getElementById('statusLine').innerText = "HW ERROR";
                    document.getElementById('statusLine').style.color = "var(--danger)";
                    return;
                }

                State.active = true;
                Scope.init();
                this.initVoice();
                
                document.getElementById('btnStart').classList.add('active-mode');
                document.getElementById('statusLine').innerText = "SYSTEM ACTIVE";
                document.getElementById('statusLine').style.color = "var(--primary)";
                
                this.speak("System Online. Monitoring.");
            },

            stopSystem() {
                State.active = false;
                AudioCore.stop();
                if(this.recognition) this.recognition.stop();
                SpiritBox.stop();
                window.speechSynthesis.cancel();

                document.getElementById('btnStart').classList.remove('active-mode');
                document.getElementById('statusLine').innerText = "HALTED";
                document.getElementById('statusLine').style.color = "var(--danger)";
                this.log("SYS: SHUTDOWN COMPLETE", "sys");
            },

            toggleMic() { State.mic = !State.mic; document.getElementById('btnMic').classList.toggle('active-state'); },
            toggleEVP() { State.evp = !State.evp; document.getElementById('btnEVP').classList.toggle('active-state'); },

            // --- VOICE RECOGNITION (RAW) ---
            initVoice() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if(!SR) { this.log("VOICE: MODULE NOT FOUND", "warn"); return; }
                
                this.recognition = new SR();
                this.recognition.lang = 'fr-FR';
                this.recognition.continuous = true;
                this.recognition.interimResults = true;

                this.recognition.onresult = (e) => {
                    const result = e.results[e.results.length-1];
                    const txt = result[0].transcript.trim();
                    if(txt.length > 0) {
                        document.getElementById('subLine').innerText = "RX: " + txt.toUpperCase();
                        if(result.isFinal) {
                            this.log(`VOICE DATA: "${txt}"`, "data");
                            this.triggerAI(txt);
                        }
                    }
                };

                this.recognition.onend = () => { if(State.active) this.recognition.start(); };
                try { this.recognition.start(); } catch(e){}
            },

            speak(text) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.rate = 0.9; u.pitch = 0.5;
                window.speechSynthesis.speak(u);
            },

            // --- AI CONNECTION (REAL) ---
            async triggerAI(data) {
                if(Date.now() - State.lastTrigger < 3000) return;
                State.lastTrigger = Date.now();
                
                if(!State.apiKey) {
                    this.log("AI: NO KEY PROVIDED - SKIPPING", "warn");
                    return;
                }

                document.getElementById('statusLine').innerText = "PROCESSING...";
                
                try {
                    const res = await fetch("https://api.openai.com/v1/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${State.apiKey}` },
                        body: JSON.stringify({
                            model: "gpt-3.5-turbo",
                            messages: [{role:"system", content:"You are a cold paranormal data analyst. Reply in under 20 words."}, {role:"user", content:`Analyze input: ${data}`}],
                            max_tokens: 40
                        })
                    });

                    if(!res.ok) throw new Error(`HTTP ${res.status}`);
                    const json = await res.json();
                    const reply = json.choices[0].message.content;
                    
                    this.log(`AI RESPONSE: ${reply}`, "ai");
                    this.speak(reply);
                    document.getElementById('statusLine').innerText = reply.toUpperCase();
                } catch(e) {
                    this.log(`AI ERROR: ${e.message}`, "err");
                    document.getElementById('statusLine').innerText = "NET ERROR";
                    // NO FALLBACK SIMULATION. STRICT MODE.
                }
            },

            // --- NETWORK DIAGNOSTIC ---
            async runDiagnostics() {
                const out = document.getElementById('diagResult');
                out.innerHTML = "RUNNING DIAGNOSTICS...<br>";
                
                // Test 1: Google (General Internet)
                out.innerHTML += "1. PINGING GOOGLE.COM...";
                try {
                    await fetch("https://www.google.com", {mode: 'no-cors', cache: 'no-store'});
                    out.innerHTML += " <span style='color:var(--primary)'>OK</span><br>";
                } catch(e) {
                    out.innerHTML += ` <span style='color:var(--danger)'>FAIL (${e.name})</span><br>`;
                    out.innerHTML += "DIAGNOSIS: TOTAL INTERNET LOSS. CHECK DATA CONNECTION.";
                    return;
                }

                // Test 2: OpenAI (Target)
                out.innerHTML += "2. PINGING API.OPENAI.COM...";
                try {
                    const controller = new AbortController();
                    const id = setTimeout(() => controller.abort(), 5000); // 5s timeout
                    await fetch("https://api.openai.com/v1/models", { 
                        method: "GET", 
                        signal: controller.signal,
                        headers: { "Authorization": `Bearer ${State.apiKey || 'test'}` }
                    });
                    clearTimeout(id);
                    out.innerHTML += " <span style='color:var(--primary)'>OK</span><br>";
                    out.innerHTML += "CONCLUSION: NETWORK IS STABLE. ISSUE IS LIKELY AUTH OR FIREWALL.";
                } catch(e) {
                    clearTimeout(id);
                    out.innerHTML += ` <span style='color:var(--danger)'>FAIL</span><br>`;
                    if(e.name === 'AbortError') out.innerHTML += "DIAGNOSIS: TIMEOUT. CARRIER FIREWALL BLOCKING API.<br>";
                    else if(e.message.includes('401')) out.innerHTML += "DIAGNOSIS: INVALID API KEY.<br>";
                    else out.innerHTML += `DIAGNOSIS: ${e.message}<br>`;
                    out.innerHTML += "<strong>RECOMMENDATION: USE VPN OR CONTACT CARRIER.</strong>";
                }
            }
        };

        // Boot
        window.onload = () => {
            Lab.log("SUPRA LAB v35. BOOT SEQUENCE COMPLETE.", "sys");
        };

    </script>
</body>
</html>
