<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS v28.0 - LEGACY</title>
    <!-- Polices Premium -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #00f0ff; /* Cyan Néon */
            --gold: #ffd700;    /* Or Luxe */
            --success: #00ff9d;
            --danger: #ff4757;
            --text: #f1f2f6;
            --text-dim: #747d8c;
            --font-ui: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-head: 'Rajdhani', sans-serif;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; background: var(--bg-deep); color: var(--text); font-family: var(--font-ui); 
            height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- SPLASH SCREEN (ANIMATION) --- */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease-out;
        }
        .logo-anim { font-family: var(--font-head); font-size: 3rem; color: var(--primary); letter-spacing: 5px; animation: pulseLogo 2s infinite; }
        .loading-bar { width: 150px; height: 2px; background: #333; margin-top: 20px; position: relative; overflow: hidden; }
        .loading-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--gold); width: 0%; animation: load 2s ease-in-out forwards; }

        @keyframes pulseLogo { 0% { text-shadow: 0 0 10px var(--primary); opacity: 0.8; } 50% { text-shadow: 0 0 25px var(--primary); opacity: 1; } 100% { text-shadow: 0 0 10px var(--primary); opacity: 0.8; } }
        @keyframes load { 0% { width: 0%; } 100% { width: 100%; } }

        /* --- HEADER --- */
        header { 
            height: 70px; background: rgba(10, 10, 15, 0.8); backdrop-filter: blur(10px); 
            border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; 
            padding: 0 20px; z-index: 50; 
        }
        .brand { font-family: var(--font-head); font-weight: 700; font-size: 1.4rem; color: #fff; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; }
        .brand span { color: var(--primary); }
        .user-info { text-align: right; }
        .greeting { font-size: 0.8rem; color: var(--text); font-weight: 600; }
        .clock { font-size: 0.7rem; color: var(--text-dim); font-family: var(--font-mono); }

        /* --- MAIN APP --- */
        #app { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }

        /* --- TABS CONTENT --- */
        .view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
                background: radial-gradient(circle at 50% 0%, #1a1f2e 0%, #000 100%); 
                opacity: 0; pointer-events: none; transform: scale(0.95); transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; flex-direction: column; }
        .view.active { opacity: 1; pointer-events: all; transform: scale(1); z-index: 10; }

        /* VIEW 1: ASSISTANT (HOME) */
        #view-assistant { align-items: center; justify-content: center; position: relative; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.4; }
        
        .chat-interface { z-index: 10; width: 90%; max-width: 600px; text-align: center; }
        #status-text { font-size: 1rem; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; min-height: 20px; margin-bottom: 10px; }
        #transcript { font-family: var(--font-head); font-size: 2rem; font-weight: 700; color: #fff; text-shadow: 0 0 20px rgba(0,0,0,0.5); min-height: 60px; line-height: 1.2; margin-bottom: 20px; }
        #jarvis-reply { 
            background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); 
            padding: 20px; border-radius: 16px; color: var(--primary); font-size: 1.2rem; font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); min-height: 60px; display: flex; align-items: center; justify-content: center;
        }

        /* VIEW 2: TASKS */
        #view-tasks { padding: 20px; overflow-y: auto; }
        .task-card { background: var(--glass); border: 1px solid var(--glass-border); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); color: #fff; padding: 12px; border-radius: 8px; outline: none; font-family: var(--font-ui); }
        input:focus { border-color: var(--primary); }
        
        .task-list { display: flex; flex-direction: column; gap: 10px; }
        .task-item { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); 
            padding: 15px; border-radius: 8px; display: flex; align-items: center; gap: 15px; 
            transition: all 0.2s; cursor: pointer;
        }
        .task-item:active { transform: scale(0.98); }
        .task-checkbox { width: 20px; height: 20px; border: 2px solid var(--text-dim); border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .task-item.done .task-checkbox { background: var(--success); border-color: var(--success); }
        .task-item.done .task-checkbox::after { content: '✓'; color: #000; font-size: 12px; font-weight: bold; }
        .task-text { flex: 1; font-size: 1rem; transition: color 0.2s; }
        .task-item.done .task-text { text-decoration: line-through; color: var(--text-dim); }
        .task-delete { color: var(--danger); background: none; border: none; font-size: 1.2rem; opacity: 0.5; padding: 5px; }
        .task-delete:active { opacity: 1; transform: scale(1.2); }

        /* --- BOTTOM NAV (FLOATING) --- */
        nav { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
            background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            padding: 10px; border-radius: 50px; display: flex; gap: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); z-index: 100;
        }
        
        .nav-btn { 
            width: 50px; height: 50px; border-radius: 50%; background: transparent; border: none; 
            color: var(--text-dim); font-size: 1.4rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .nav-btn.active { color: #fff; background: var(--glass); transform: translateY(-10px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .nav-btn.main { width: 60px; height: 60px; background: var(--primary); color: #000; font-size: 1.5rem; box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
        .nav-btn.main.listening { background: var(--danger); color: #fff; animation: pulse-btn 1.5s infinite; }

        @keyframes pulse-btn { 0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); } }

        /* --- SETTINGS MODAL --- */
        #settings-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 350px;
            background: #0f1218; border: 1px solid var(--gold); padding: 25px; border-radius: 16px; z-index: 200;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); display: none; flex-direction: column; gap: 15px;
        }
        #settings-modal.open { display: flex; animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes modalPop { from { transform: translate(-50%, -40%) scale(0.9); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

        .setting-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        .setting-label { color: var(--text-dim); font-size: 0.9rem; }
        input[type="range"] { accent-color: var(--primary); }

    </style>
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div id="splash">
        <div class="logo-anim">JARVIS</div>
        <div style="color:var(--gold); letter-spacing:3px; margin-top:5px;">LEGACY</div>
        <div class="loading-bar"><div class="loading-fill"></div></div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0; color:var(--gold); font-family:var(--font-head);">PARAMÈTRES</h3>
            <button onclick="toggleSettings()" style="background:none; border:none; color:#fff; font-size:1.5rem;">&times;</button>
        </div>
        <div class="setting-row">
            <span class="setting-label">Ton Prénom</span>
            <input type="text" id="user-name-input" placeholder="Ex: Thomas" style="width:50%; background:#222; border:1px solid #444; color:#fff; padding:5px;">
        </div>
        <div class="setting-row">
            <span class="setting-label">Langue</span>
            <select id="lang-select" style="background:#222; border:1px solid #444; color:#fff; padding:5px;">
                <option value="fr-FR">Français</option>
                <option value="en-US">English</option>
            </select>
        </div>
        <div class="setting-row">
            <span class="setting-label">Vibrations (Haptique)</span>
            <input type="checkbox" id="haptic-check" checked style="width:20px; height:20px;">
        </div>
        <button onclick="saveSettings()" style="background:var(--primary); border:none; color:#000; padding:10px; border-radius:8px; font-weight:bold; cursor:pointer;">SAUVEGARDER</button>
    </div>

    <header>
        <div class="brand">JARVIS <span>LEGACY</span></div>
        <div class="user-info">
            <div class="greeting" id="greeting-text">Bonjour</div>
            <div class="clock" id="clock">00:00</div>
        </div>
    </header>

    <div id="app">
        <!-- TAB 1: ASSISTANT -->
        <div id="view-assistant" class="view active">
            <canvas id="bg-canvas"></canvas>
            <div class="chat-interface">
                <div id="status-text">SYSTÊME ACTIF</div>
                <div id="transcript">Prêt à l'écoute</div>
                <div id="jarvis-reply">Clique sur le micro pour commencer.</div>
            </div>
        </div>

        <!-- TAB 2: TASKS -->
        <div id="view-tasks" class="view">
            <div class="task-card">
                <h3 style="margin-top:0; color:var(--gold); font-family:var(--font-head);">NOUVELLE TÂCHE</h3>
                <div class="input-group">
                    <input type="text" id="new-task" placeholder="Que dois-tu faire ?">
                    <button onclick="addTaskUI()" style="background:var(--primary); border:none; width:50px; border-radius:8px; color:#000; font-size:1.5rem; cursor:pointer;">+</button>
                </div>
            </div>
            <div id="task-list" class="task-list">
                <!-- JS will populate -->
            </div>
        </div>
    </div>

    <!-- NAV BAR -->
    <nav>
        <button class="nav-btn" onclick="switchView('tasks')">✅</button>
        <button class="nav-btn main" id="mic-btn" onclick="toggleMic()">🎙️</button>
        <button class="nav-btn" onclick="toggleSettings()">⚙️</button>
    </nav>

    <script>
        /* ==============================================================================
           JARVIS v28.0 - LEGACY FAMILY EDITION
           ============================================================================== */

        const Config = {
            name: localStorage.getItem('jarvis_name') || "Famille",
            lang: localStorage.getItem('jarvis_lang') || 'fr-FR',
            haptic: localStorage.getItem('jarvis_haptic') !== 'false',
            tasks: JSON.parse(localStorage.getItem('jarvis_tasks') || '[]')
        };

        let isListening = false;
        let recognition;
        let audioCtx, analyser, dataArray;

        // --- INITIALISATION ---
        window.onload = () => {
            // Splash Screen
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => document.getElementById('splash').remove(), 800);
                
                initSystem();
            }, 2500); // 2.5s de boot
        };

        async function initSystem() {
            // Greeting Time-based
            updateGreeting();
            setInterval(updateGreeting, 60000); // Update every minute

            // Load Settings in Modal
            document.getElementById('user-name-input').value = Config.name;
            document.getElementById('lang-select').value = Config.lang;
            document.getElementById('haptic-check').checked = Config.haptic;

            // Audio & Speech
            await initAudio();
            initSpeech();
            
            // Render Tasks
            renderTasks();
        }

        function updateGreeting() {
            const hour = new Date().getHours();
            let greeting = "Bonsoir";
            if (hour >= 5 && hour < 12) greeting = "Bonjour";
            else if (hour >= 12 && hour < 18) greeting = "Bon après-midi";
            
            document.getElementById('greeting-text').innerText = `${greeting}, ${Config.name}`;
        }

        function vibrate() {
            if (Config.haptic && navigator.vibrate) navigator.vibrate(30);
        }

        // --- AUDIO & VISUALS (SMOOTH WAVES) ---
        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512; // Haute résolution pour les vagues
                const src = audioCtx.createMediaStreamSource(stream);
                src.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                drawSmoothVisuals();
            } catch(e) { console.log("Audio error", e); }
        }

        function drawSmoothVisuals() {
            if(!audioCtx) return;
            requestAnimationFrame(drawSmoothVisuals);
            analyser.getByteFrequencyData(dataArray);

            const cvs = document.getElementById('bg-canvas');
            const ctx = cvs.getContext('2d');
            const w = cvs.width = window.innerWidth;
            const h = cvs.height = window.innerHeight;
            ctx.clearRect(0,0,w,h);

            // Dessin de vagues douces au lieu de barres
            ctx.beginPath();
            ctx.moveTo(0, h/2);
            const slice = w / dataArray.length;
            let x = 0;
            
            for(let i=0; i<dataArray.length; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * h/2 + (h/2 - h/4); // Centered wave
                ctx.lineTo(x, y);
                x += slice;
            }
            ctx.lineTo(w, h/2);
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.1)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // --- SPEECH ENGINE (ROBUST) ---
        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) return alert("Désolé, ton navigateur ne supporte pas la voix.");

            recognition = new SR();
            recognition.continuous = false; // Android fix
            recognition.interimResults = true;
            recognition.lang = Config.lang;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('mic-btn').classList.add('listening');
                document.getElementById('status-text').innerText = "J'ÉCOUTE...";
                document.getElementById('status-text').style.color = "var(--primary)";
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('mic-btn').classList.remove('listening');
                document.getElementById('status-text').innerText = "EN ATTENTE";
                document.getElementById('status-text').style.color = "var(--text-dim)";
                
                if (document.getElementById('mic-btn').classList.contains('active-flag')) {
                    setTimeout(() => { try { recognition.start(); } catch(e){} }, 500);
                }
            };

            recognition.onresult = (e) => {
                let interim = '', final = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) final += e.results[i][0].transcript;
                    else interim += e.results[i][0].transcript;
                }

                const iEl = document.getElementById('status-text');
                const tEl = document.getElementById('transcript');

                if(interim) { tEl.innerText = interim; iEl.innerText = "TRAITMENT..."; }
                else { iEl.innerText = "EN ATTENTE"; }

                if(final) {
                    tEl.innerText = final;
                    processIntent(final);
                }
            };
            recognition.onerror = (e) => {
                if(e.error === 'no-speech' && document.getElementById('mic-btn').classList.contains('active-flag')) {
                    try { recognition.start(); } catch(e){}
                }
            };
        }

        // --- CORE LOGIC (FRIENDLY & SMART) ---
        function processIntent(text) {
            const t = text.toLowerCase();
            let reply = "";
            const rEl = document.getElementById('jarvis-reply');

            // 1. PERSONAL RESPONSES
            if (t.includes('comment ça va') || t.includes('ça va')) {
                reply = "Je fonctionne parfaitement, merci. Et toi, la forme ?";
            }
            else if (t.includes('merci') || t.includes('cool')) {
                const thanks = ["Je t'en prie.", "Avec plaisir.", "C'est normal, on est famille."];
                reply = thanks[Math.floor(Math.random() * thanks.length)];
            }
            // 2. TASKS INTEGRATED
            else if (t.includes('note') || t.includes('rappel')) {
                const task = t.split(/note :|rappel :|tâche :/)[1]?.trim();
                if(task) {
                    addTask(task);
                    reply = `C'est noté : "${task}".`;
                } else { reply = "Qu'est-ce que je dois noter ?"; }
            }
            else if (t.includes('quelles sont mes tâches') || t.includes('ma liste')) {
                if(Config.tasks.length === 0) reply = "Ta liste est vide. Profite !";
                else {
                    const list = Config.tasks.filter(t => !t.done).map(t => t.text).join(", ");
                    reply = `Tu as à faire : ${list}`;
                }
            }
            // 3. UTILITY
            else if (t.includes('heure')) reply = `Il est exactement ${new Date().toLocaleTimeString(Config.lang)}.`;
            else if (t.includes('date')) reply = `Nous sommes le ${new Date().toLocaleDateString(Config.lang)}.`;
            // 4. CALCULATOR
            else if (/(\d)\s*(plus|moins|fois|divisé)/.test(t)) {
                try {
                    let clean = t.replace("égal", "=").replace("fois", "*").replace("plus", "+").replace("moins", "-").replace("divisé", "/").replace("?", "");
                    if (/^[\d\+\-\*\/\(\)\.\s]+$/.test(clean)) reply = `Ça fait ${eval(clean)}.`;
                    else reply = "Calcul impossible.";
                } catch(e) { reply = "Erreur de calcul."; }
            }
            // 5. SEARCH
            else if (t.includes('cherche')) {
                const q = t.replace("cherche", "").trim();
                window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank');
                reply = `J'ouvre Google pour "${q}".`;
            }
            // 6. DEFAULT
            else {
                if(t.length > 20) reply = "C'est noté. Dis-moi si tu as besoin d'aide.";
                else reply = `D'accord, "${text}".`;
            }

            rEl.innerText = reply;
            speak(reply);
            log(text, reply);
        }

        // --- TASKS SYSTEM ---
        function addTask(text) {
            Config.tasks.unshift({ text: text, done: false });
            saveTasks();
            renderTasks();
            vibrate();
        }

        function addTaskUI() {
            const input = document.getElementById('new-task');
            if(input.value.trim()) {
                addTask(input.value);
                input.value = "";
            }
        }

        function toggleTask(index) {
            Config.tasks[index].done = !Config.tasks[index].done;
            saveTasks();
            renderTasks();
            vibrate();
        }

        function removeTask(index) {
            Config.tasks.splice(index, 1);
            saveTasks();
            renderTasks();
            vibrate();
        }

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = "";
            Config.tasks.forEach((task, i) => {
                const div = document.createElement('div');
                div.className = `task-item ${task.done ? 'done' : ''}`;
                div.innerHTML = `
                    <div class="task-checkbox" onclick="toggleTask(${i})"></div>
                    <span class="task-text">${task.text}</span>
                    <button class="task-delete" onclick="removeTask(${i})">×</button>
                `;
                list.appendChild(div);
            });
        }

        function saveTasks() {
            localStorage.setItem('jarvis_tasks', JSON.stringify(Config.tasks));
        }

        // --- UTILS ---
        function toggleMic() {
            vibrate();
            const btn = document.getElementById('mic-btn');
            if(!isListening) { 
                btn.classList.add('active-flag'); 
                recognition.start(); 
            } else { 
                btn.classList.remove('active-flag'); 
                recognition.stop(); 
            }
        }

        function switchView(viewName) {
            vibrate();
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-'+viewName).classList.add('active');
        }

        function toggleSettings() {
            vibrate();
            document.getElementById('settings-modal').classList.toggle('open');
        }

        function saveSettings() {
            Config.name = document.getElementById('user-name-input').value || "Famille";
            Config.lang = document.getElementById('lang-select').value;
            Config.haptic = document.getElementById('haptic-check').checked;
            
            localStorage.setItem('jarvis_name', Config.name);
            localStorage.setItem('jarvis_lang', Config.lang);
            localStorage.setItem('jarvis_haptic', Config.haptic);
            
            if(recognition) recognition.lang = Config.lang;
            updateGreeting();
            toggleSettings();
            speak(`Paramètres enregistrés. Bonjour ${Config.name}.`);
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = Config.lang;
            // Voice selection
            const voices = window.speechSynthesis.getVoices();
            const frVoice = voices.find(v => v.lang.includes('fr'));
            if(frVoice) u.voice = frVoice;
            
            window.speechSynthesis.speak(u);
        }

        function log(input, output) {
            console.log(`[JARVIS] User: ${input} | AI: ${output}`);
        }

        // Clock
        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);

    </script>
</body>
</html>
