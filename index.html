<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPATATOP AI - Mode Écoute Totale</title>
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #ff0000;
            --bg: #0a0a1a;
            --panel: #1a1a2a;
            --text: #e0e0ff;
            --danger: #ff5555;
            --accent: #ffff00;
            --sonar: #00ffff;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #000;
            border-bottom: 3px solid var(--primary);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }
        h1 {
            font-size: 1.1rem;
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary);
            letter-spacing: 2px;
            margin: 0;
            font-weight: bold;
        }
        main {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, #000 0%, #0a0a1a 100%);
        }
        #visualizer {
            width: 100%;
            height: 100%;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #displayOverlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            width: 90%;
        }
        #mainText {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border: 2px solid var(--primary);
            border-radius: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 8px var(--primary);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        #subText {
            font-size: 0.8rem;
            color: var(--accent);
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 15px;
            border: 1px solid var(--accent);
            border-radius: 5px;
            text-shadow: 0 0 5px var(--accent);
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 14px;
            border: 1px solid var(--primary);
            border-radius: 5px;
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--primary);
            z-index: 25;
        }
        #actionGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
            gap: 8px;
            padding: 12px;
            background: var(--panel);
            border-top: 1px solid #222;
        }
        .grid-btn {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #ccc;
            padding: 8px 3px;
            border-radius: 5px;
            text-align: center;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, #1a1a1a, #0a0a0a);
        }
        .grid-btn:active {
            transform: scale(0.95);
        }
        .grid-btn.active-state {
            background: var(--secondary);
            color: #000;
            border-color: #000;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.7);
            background: linear-gradient(to bottom, #ff3333, #cc0000);
        }
        .grid-icon {
            font-size: 1.1rem;
            margin-bottom: 2px;
        }
        #controls {
            background: var(--panel);
            padding: 12px;
            display: grid;
            gap: 8px;
        }
        button {
            background: #1a1a1a;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.15s;
            position: relative;
            overflow: hidden;
            background: linear-gradient(to bottom, #1a1a1a, #0a0a0a);
        }
        button:active {
            transform: scale(0.95);
        }
        button.active-mode {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 12px var(--primary);
            background: linear-gradient(to bottom, #00ff88, #00ccaa);
        }
        #terminal {
            height: 90px;
            background: #000;
            border-top: 1px solid #333;
            padding: 6px;
            font-size: 0.6rem;
            overflow-y: auto;
            color: #aaa;
            line-height: 1.3;
            font-family: monospace;
        }
        .log-line {
            margin-bottom: 4px;
            border-left: 2px solid #555;
            padding-left: 6px;
        }
        #settingsModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            width: 90%;
            max-width: 450px;
            background: #111;
            border: 2px solid var(--secondary);
            border-radius: 8px;
            padding: 18px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 60%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            outline: none;
        }
        #translationOverlay {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            color: var(--text);
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 18px;
            border: 2px solid var(--primary);
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 0.9rem;
            font-weight: bold;
        }
        #liveTranslation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            color: var(--sonar);
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border: 2px solid var(--sonar);
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>OPATATOP AI - MODE ÉCOUTE TOTALE</h1>
    </header>
    <main>
        <div id="visualizer">
            <canvas id="scopeCanvas"></canvas>
            <div id="displayOverlay">
                <div id="mainText">ÉCOUTE ACTIVE</div>
                <div id="subText">TOUTES FONCTIONS DÉTECTION ACTIVÉES</div>
            </div>
            <div id="translationOverlay">TRADUCTION: --</div>
            <div id="liveTranslation">--</div>
            <div id="hud">NIVEAU: 0%<br>FRÉQ.: 0 Hz<br>DETECTION: 0<br>TEMP: 0°C</div>
        </div>
    </main>
    <div id="actionGrid">
        <div class="grid-btn active-state" id="btnPower" onclick="FeatureEngine.togglePower()"><span class="grid-icon">⚡</span><span>POWER</span></div>
        <div class="grid-btn active-state" id="btnDetect" onclick="FeatureEngine.toggleDetection()"><span class="grid-icon">🔍</span><span>SONAR</span></div>
        <div class="grid-btn active-state" id="btnGhost" onclick="FeatureEngine.toggleGhostDetection()"><span class="grid-icon">👻</span><span>DETECT</span></div>
        <div class="grid-btn active-state" id="btnVAD" onclick="FeatureEngine.toggleVAD()"><span class="grid-icon">🎤</span><span>VAD</span></div>
        <div class="grid-btn active-state" id="btnSensors" onclick="FeatureEngine.toggleSensors()"><span class="grid-icon">📡</span><span>CAPTEURS</span></div>
        <div class="grid-btn active-state" id="btnRecord" onclick="FeatureEngine.toggleAutoRecord()"><span class="grid-icon">📼</span><span>ENREG.</span></div>
        <div class="grid-btn active-state" id="btnEMF" onclick="FeatureEngine.toggleEMF()"><span class="grid-icon">📏</span><span>EMF</span></div>
        <div class="grid-btn active-state" id="btnTemp" onclick="FeatureEngine.toggleTemp()"><span class="grid-icon">🌡️</span><span>TEMP</span></div>
    </div>
    <div id="terminal"></div>
    <script>
        // Configuration
        const Config = {
            data: {
                pitch: 1.0,
                rate: 1.0,
                colorMode: 'dark'
            },
            colorModes: {
                dark: {
                    primary: '#00ff88',
                    secondary: '#ff3333',
                    bg: '#0a0a1a',
                    panel: '#1a1a2a',
                    text: '#e0e0ff',
                    sonar: '#00ffff'
                }
            },
            applyColorMode() {
                const mode = this.colorModes[this.data.colorMode];
                document.documentElement.style.setProperty('--primary', mode.primary);
                document.documentElement.style.setProperty('--secondary', mode.secondary);
                document.documentElement.style.setProperty('--bg', mode.bg);
                document.documentElement.style.setProperty('--panel', mode.panel);
                document.documentElement.style.setProperty('--text', mode.text);
                document.documentElement.style.setProperty('--sonar', mode.sonar);
            }
        };

        // Audio Engine
        const AudioEngine = {
            ctx: null,
            stream: null,
            analyser: null,
            isInit: false,
            async init() {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    this.stream = await navigator.mediaDevices.getUserMedia({audio: true});
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 256;
                    this.ctx.createMediaStreamSource(this.stream).connect(this.analyser);
                    this.isInit = true;
                    return true;
                } catch (e) {
                    console.error("Audio error:", e);
                    return false;
                }
            },
            getRMS() {
                if (!this.analyser) return 0;
                const data = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(data);
                let sum = 0;
                for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
                return Math.sqrt(sum / data.length) / 128;
            },
            getDominantFrequency() {
                if (!this.analyser) return 0;
                const data = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(data);
                let max = 0, maxIdx = 0;
                for (let i = 0; i < data.length; i++) {
                    if (data[i] > max) {
                        max = data[i];
                        maxIdx = i;
                    }
                }
                return maxIdx * this.ctx.sampleRate / this.analyser.fftSize;
            },
            destroy() {
                if (this.stream) this.stream.getTracks().forEach(t => t.stop());
                if (this.ctx) this.ctx.close();
                this.isInit = false;
            }
        };

        // Visual Engine
        const VisualEngine = {
            canvas: null,
            ctx: null,
            animId: null,
            isRunning: false,
            blips: [],
            init() {
                this.canvas = document.getElementById('scopeCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
            },
            resize() {
                if (this.canvas) {
                    this.canvas.width = this.canvas.parentElement.clientWidth;
                    this.canvas.height = this.canvas.parentElement.clientHeight;
                }
            },
            start() {
                if (!this.isRunning) {
                    this.isRunning = true;
                    this.loop();

                    // Simulate random detection events
                    setInterval(() => {
                        if (Math.random() > 0.8) {
                            this.blips.push({
                                x: Math.random() * this.canvas.width,
                                y: Math.random() * this.canvas.height,
                                size: Math.random() * 10 + 5,
                                alpha: 1.0,
                                color: Math.random() > 0.5 ? '#ff0000' : '#ffff00'
                            });
                        }
                    }, 800);
                }
            },
            stop() {
                this.isRunning = false;
                if (this.animId) cancelAnimationFrame(this.animId);
            },
            loop() {
                if (!this.isRunning) return;
                const w = this.canvas.width, h = this.canvas.height;
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, w, h);

                // Draw radar grid
                this.ctx.save();
                this.ctx.translate(w/2, h/2);
                this.ctx.strokeStyle = '#00ff8833';
                this.ctx.lineWidth = 1;
                for (let r = 30; r <= Math.min(w, h)/2; r += 30) {
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, r, 0, Math.PI * 2);
                    this.ctx.stroke();
                }
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 12) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, 0);
                    this.ctx.lineTo(Math.cos(a) * Math.min(w, h)/2, Math.sin(a) * Math.min(w, h)/2);
                    this.ctx.stroke();
                }
                this.ctx.restore();

                // Draw detection blips
                this.blips = this.blips.filter(b => (b.alpha -= 0.02) > 0.03);
                this.blips.forEach(b => {
                    this.ctx.save();
                    this.ctx.globalAlpha = b.alpha;
                    this.ctx.fillStyle = b.color;
                    this.ctx.beginPath();
                    this.ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                });

                // Update HUD with real audio data
                const rms = AudioEngine.isInit ? AudioEngine.getRMS() * 100 : 0;
                const freq = AudioEngine.isInit ? AudioEngine.getDominantFrequency() : 0;
                document.getElementById('hud').innerHTML =
                    `NIVEAU: ${rms.toFixed(1)}%<br>` +
                    `FRÉQ.: ${freq.toFixed(0)} Hz<br>` +
                    `DETECTION: ${Math.floor(Math.random() * 100)}%<br>` +
                    `TEMP: ${(20 + Math.random() * 5).toFixed(1)}°C`;

                this.animId = requestAnimationFrame(() => this.loop());
            }
        };

        // Feature Engine
        const FeatureEngine = {
            power: true,
            detection: true,
            ghostDetection: true,
            vad: true,
            sensorsActive: true,
            autoRecord: true,
            emfActive: true,
            tempActive: true,
            togglePower() {
                this.power = !this.power;
                document.getElementById('btnPower').classList.toggle('active-state');
                App.log(this.power ? "POWER ON" : "POWER OFF");
            },
            toggleDetection() {
                this.detection = !this.detection;
                document.getElementById('btnDetect').classList.toggle('active-state');
                App.log(this.detection ? "SONAR ACTIVE" : "SONAR OFF");
            },
            toggleGhostDetection() {
                this.ghostDetection = !this.ghostDetection;
                document.getElementById('btnGhost').classList.toggle('active-state');
                App.log(this.ghostDetection ? "GHOST DETECTION ON" : "GHOST DETECTION OFF");
            },
            toggleVAD() {
                this.vad = !this.vad;
                document.getElementById('btnVAD').classList.toggle('active-state');
                App.log(this.vad ? "VAD ACTIVE" : "VAD OFF");
            },
            toggleSensors() {
                this.sensorsActive = !this.sensorsActive;
                document.getElementById('btnSensors').classList.toggle('active-state');
                App.log(this.sensorsActive ? "SENSORS ACTIVE" : "SENSORS OFF");
            },
            toggleAutoRecord() {
                this.autoRecord = !this.autoRecord;
                document.getElementById('btnRecord').classList.toggle('active-state');
                App.log(this.autoRecord ? "RECORDING ACTIVE" : "RECORDING OFF");
            },
            toggleEMF() {
                this.emfActive = !this.emfActive;
                document.getElementById('btnEMF').classList.toggle('active-state');
                App.log(this.emfActive ? "EMF ACTIVE" : "EMF OFF");
            },
            toggleTemp() {
                this.tempActive = !this.tempActive;
                document.getElementById('btnTemp').classList.toggle('active-state');
                App.log(this.tempActive ? "TEMPERATURE ACTIVE" : "TEMPERATURE OFF");
            }
        };

        // Brain Engine for audio processing
        const BrainEngine = {
            recognition: null,
            isListening: true,
            init() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) return false;
                this.recognition = new SR();
                this.recognition.lang = 'fr-FR';
                this.recognition.interimResults = true;
                this.recognition.continuous = true;
                this.recognition.onresult = (e) => {
                    let text = '';
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        text += e.results[i][0].transcript;
                    }
                    document.getElementById('translationOverlay').innerText = `TRADUCTION: ${text}`;
                    document.getElementById('liveTranslation').innerText = text;
                    App.log(`VOICE INPUT: ${text}`);
                };
                return true;
            },
            start() {
                if (!this.recognition) return;
                this.isListening = true;
                try { this.recognition.start(); } catch (e) {}
            },
            stop() {
                this.isListening = false;
                if (this.recognition) this.recognition.stop();
            }
        };

        // Main Application
        const App = {
            isRunning: false,
            async init() {
                Config.applyColorMode();
                VisualEngine.init();
                await AudioEngine.init();
                BrainEngine.init();
                VisualEngine.start();
                BrainEngine.start();
                this.isRunning = true;
                this.log("SYSTEM ONLINE - ALL FUNCTIONS ACTIVE");
                this.log("AUDIO MONITORING ACTIVE");
                this.log("GHOST DETECTION ACTIVE");
                this.log("SONAR DETECTION ACTIVE");
                this.log("VAD SYSTEM ACTIVE");
                this.log("SENSORS ACTIVE");
            },
            log(msg) {
                const t = document.getElementById('terminal');
                const d = document.createElement('div');
                d.className = 'log-line';
                d.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
                t.appendChild(d);
                t.scrollTop = t.scrollHeight;
            }
        };

        // Initialize when loaded
        window.onload = () => App.init();
    </script>
</body>
</html>
