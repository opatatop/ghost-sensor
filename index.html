<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPRA NEURAL AI v4.0 FINAL</title>
<style>
    :root { 
        --bg:#020205; 
        --primary:#00f3ff; 
        --secondary:#ff00ff; 
        --success:#33ff33; 
        --danger:#ff3333; 
        --panel:rgba(10,10,16,0.97); 
    }
    * { box-sizing:border-box; }
    body { 
        margin:0; 
        background:var(--bg); 
        color:#e0e0e0; 
        font-family:'Courier New',monospace; 
        overflow:hidden; 
        height:100vh; 
        display:flex; 
        flex-direction:column; 
    }
    body::before { 
        content:""; 
        position:absolute; 
        inset:0; 
        background:linear-gradient(rgba(0,243,255,0.035)1px,transparent 1px),
                    linear-gradient(90deg,rgba(0,243,255,0.035)1px,transparent 1px); 
        background-size:28px 28px; 
        z-index:0; 
        pointer-events:none; 
    }
    header { 
        height:64px; 
        background:rgba(0,0,0,0.93); 
        border-bottom:2px solid var(--primary); 
        display:flex; 
        justify-content:space-between; 
        align-items:center; 
        padding:0 20px; 
        z-index:10; 
    }
    .brand { 
        font-size:1.25rem; 
        font-weight:bold; 
        letter-spacing:4px; 
        color:var(--primary); 
    }
    .brand span { color:var(--secondary); }
    .env-badge { 
        font-size:0.78rem; 
        padding:5px 14px; 
        border-radius:4px; 
        font-weight:bold; 
        background:rgba(0,0,0,0.6); 
        transition:0.3s; 
    }
    #input-bar {
        background:var(--panel);
        padding:10px 20px;
        display:flex;
        align-items:center;
        gap:12px;
        border-bottom:2px solid var(--secondary);
        z-index:9;
    }
    #userInput {
        flex:1;
        background:rgba(0,0,0,0.85);
        border:2px solid var(--primary);
        color:#e0e0e0;
        padding:12px 16px;
        font-family:inherit;
        font-size:15px;
        border-radius:4px;
        transition:0.2s;
    }
    #userInput:focus {
        outline:none;
        box-shadow:0 0 18px var(--primary);
        border-color:var(--secondary);
    }
    button { 
        background:rgba(0,0,0,0.7); 
        border:1px solid var(--primary); 
        color:var(--primary); 
        padding:9px 18px; 
        margin:0 4px; 
        cursor:pointer; 
        transition:0.2s; 
        text-transform:uppercase; 
        font-size:0.85rem;
    }
    button:hover { 
        background:var(--primary); 
        color:#000; 
        box-shadow:0 0 18px var(--primary); 
    }
    button.active { 
        background:var(--danger); 
        color:#fff; 
        box-shadow:0 0 12px var(--danger);
    }
    button.success { 
        background:var(--success); 
        color:#000; 
    }
    #canvas-container { 
        flex:1; 
        position:relative; 
        background:rgba(2,2,5,0.4);
    }
    canvas { 
        display:block; 
        width:100%; 
        height:100%; 
    }
    #terminal { 
        height:210px; 
        background:var(--panel); 
        border-top:2px solid var(--secondary); 
        padding:12px; 
        font-size:13px; 
        overflow-y:auto; 
        scrollbar-width:thin;
    }
    .log-line { 
        margin:4px 0; 
        padding-left:12px; 
        border-left:3px solid; 
    }
    .log-user { color:var(--primary); border-color:var(--primary); }
    .log-ai { color:var(--secondary); border-color:var(--secondary); font-weight:bold; }
    .log-error { color:var(--danger); border-color:var(--danger); }
    .log-success { color:var(--success); border-color:var(--success); }
    .log-sys { color:#888; border-color:#666; font-style:italic; }
</style>
</head>
<body>

<header>
    <div class="brand">SUPRA <span>NEURAL</span> AI <span style="font-size:0.82rem;opacity:0.65;">v4.0 FINAL</span></div>
    <div id="envBadge" class="env-badge">READY</div>
    <div class="controls">
        <button id="btnMic">MICRO</button>
        <button id="btnVoice">ÉCOUTE</button>
        <button id="btnTest" class="success">TEST IA</button>
        <button id="btnAuto" class="success">🚀 FULL AUTO</button>
        <button id="btnClear">🗑️ CLEAR</button>
    </div>
</header>

<div id="input-bar">
    <input id="userInput" type="text" placeholder="Tapez votre question ici... (ou utilisez le micro)">
    <button id="btnSend">ENVOYER →</button>
</div>

<div id="canvas-container"><canvas id="canvas"></canvas></div>
<div id="terminal"></div>

<script>
const KEY = "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"; 
// ⚠️ REMPLACEZ PAR VOTRE CLÉ OPENAI (sk-...) — jamais en production côté client !

const $ = id => document.getElementById(id);

const Logger = {
    log: (msg, type="sys") => {
        const d = document.createElement("div");
        d.className = `log-line log-${type}`;
        d.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
        $('terminal').appendChild(d);
        $('terminal').scrollTop = $('terminal').scrollHeight;
    },
    success: m => Logger.log(m, "success"),
    error: m => Logger.log(m, "error"),
    sys: m => Logger.log(m, "sys")
};

class AIEngine {
    constructor() {
        this.key = KEY;
        this.synth = window.speechSynthesis;
        this.isSpeaking = false;
        this.voices = [];
        
        // Meilleure gestion des voix
        this.synth.onvoiceschanged = () => {
            this.voices = this.synth.getVoices();
            Logger.sys("Voix françaises chargées");
        };
        setTimeout(() => this.voices = this.synth.getVoices(), 300);
    }
    
    async process(text) {
        const trimmed = text.trim();
        if (!trimmed) return;
        
        Logger.log(`QUERY: "${trimmed}"`, "user");
        $('envBadge').textContent = "THINKING";
        Logger.sys("NEURAL CORE EN TRAITEMENT...");
        
        let resp = "SUPRA en ligne.";
        try {
            const res = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${this.key}`
                },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    messages: [
                        {role: "system", content: "Tu es SUPRA NEURAL AI v4.0, une IA cyberpunk ultra-futuriste. Réponds en français, style hacker/neon, max 16 mots, très concis, jamais de politesse inutile."},
                        {role: "user", content: trimmed}
                    ],
                    max_tokens: 50,
                    temperature: 0.85
                })
            });
            
            if (!res.ok) throw new Error("API HTTP " + res.status);
            
            const data = await res.json();
            if (!data.choices || !data.choices[0]) throw new Error("Réponse invalide");
            
            resp = data.choices[0].message.content.trim();
        } catch(e) {
            Logger.error("ÉCHEC OPENAI — vérifiez votre clé ou connexion");
            resp = "Erreur réseau. Clé API ou connexion défaillante.";
        }
        
        this.speak(resp);
    }
    
    speak(text) {
        this.synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        
        const frVoice = this.voices.find(v => v.lang.includes('fr') || v.name.toLowerCase().includes('fr'));
        if (frVoice) u.voice = frVoice;
        
        u.rate = 1.09;
        u.pitch = 1.04;
        u.volume = 1;
        
        u.onstart = () => {
            this.isSpeaking = true;
            Logger.log(`IA: "${text}"`, "ai");
            $('envBadge').textContent = "SPEAKING";
        };
        
        u.onend = () => {
            this.isSpeaking = false;
            $('envBadge').textContent = "READY";
        };
        
        this.synth.speak(u);
    }
}

class AudioEngine {
    constructor() { this.ready = false; }
    async start() {
        if (this.ready) return;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({audio:true});
            const src = ctx.createMediaStreamSource(stream);
            this.analyser = ctx.createAnalyser();
            this.analyser.fftSize = 256;
            src.connect(this.analyser);
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
            this.ready = true;
            Logger.success("MICRO ACTIVÉ");
            $('btnMic').classList.add('active');
        } catch(e) {
            Logger.error("Accès micro refusé ou non disponible");
        }
    }
    getData() {
        if (!this.ready) return {vol:0, raw:null};
        this.analyser.getByteFrequencyData(this.dataArray);
        let sum = 0;
        for (let v of this.dataArray) sum += v;
        return {vol: sum / this.dataArray.length, raw: this.dataArray};
    }
}

class Visuals {
    constructor() {
        this.c = $('canvas');
        this.ctx = this.c.getContext('2d', {alpha:true});
        this.nodes = Array.from({length:85}, () => ({
            x: Math.random()*innerWidth,
            y: Math.random()*innerHeight,
            vx: (Math.random()-0.5)*2.2,
            vy: (Math.random()-0.5)*2.2,
            s: Math.random()*3.5 + 1.8
        }));
        
        this.resizeCanvas = () => {
            const container = this.c.parentElement;
            this.c.width = container.clientWidth;
            this.c.height = container.clientHeight;
        };
        
        window.addEventListener('resize', this.resizeCanvas);
        setTimeout(this.resizeCanvas, 80); // temps pour flex
        this.resizeCanvas();
    }
    
    draw(audio, speaking) {
        const {vol, raw} = audio;
        const w = this.c.width, h = this.c.height;
        
        // Fade background
        this.ctx.fillStyle = "rgba(2,2,5,0.22)";
        this.ctx.fillRect(0,0,w,h);
        
        // Pulse central NEURAL CORE
        const pulse = 48 + vol * 1.1 + (speaking ? 32 : 0);
        this.ctx.shadowBlur = 52;
        this.ctx.shadowColor = speaking ? "#ff00ff" : "#00f3ff";
        this.ctx.beginPath();
        this.ctx.arc(w/2, h/2, pulse, 0, Math.PI*2);
        this.ctx.strokeStyle = `rgba(0,243,255,${speaking?0.98:0.48})`;
        this.ctx.lineWidth = 7.5;
        this.ctx.stroke();
        this.ctx.shadowBlur = 0;
        
        // Texte cyberpunk central (glitch quand parle)
        this.ctx.save();
        this.ctx.font = "900 26px 'Courier New'";
        this.ctx.textAlign = "center";
        this.ctx.textBaseline = "middle";
        this.ctx.shadowBlur = speaking ? 38 : 14;
        this.ctx.shadowColor = speaking ? "#ff00ff" : "#00f3ff";
        this.ctx.fillStyle = "#00f3ff";
        
        let coreText = "SUPRA NEURAL";
        if (speaking && Math.random() > 0.68) {
            coreText = "S U P R A   N E U R A L";
        }
        this.ctx.fillText(coreText, w/2, h/2 - pulse - 38);
        this.ctx.restore();
        
        // Particules nodes
        for (let n of this.nodes) {
            n.x += n.vx;
            n.y += n.vy;
            if (n.x < 0 || n.x > w) n.vx *= -1;
            if (n.y < 0 || n.y > h) n.vy *= -1;
            
            this.ctx.shadowBlur = 18;
            this.ctx.shadowColor = "#00f3ff";
            this.ctx.fillStyle = "#00f3ff";
            this.ctx.beginPath();
            this.ctx.arc(n.x, n.y, n.s + vol/32, 0, Math.PI*2);
            this.ctx.fill();
        }
        this.ctx.shadowBlur = 0;
        
        // Liens entre nodes
        this.ctx.lineWidth = 1.15;
        for (let i = 0; i < this.nodes.length; i++) {
            for (let j = i + 1; j < this.nodes.length; j++) {
                const a = this.nodes[i], b = this.nodes[j];
                const d = Math.hypot(a.x - b.x, a.y - b.y);
                if (d < 168) {
                    this.ctx.strokeStyle = `rgba(0,243,255,${(168-d)/168*0.65})`;
                    this.ctx.beginPath();
                    this.ctx.moveTo(a.x, a.y);
                    this.ctx.lineTo(b.x, b.y);
                    this.ctx.stroke();
                }
            }
        }
        
        // Barre de fréquence (neon magenta)
        if (raw) {
            const bw = w / raw.length;
            for (let i = 0; i < raw.length; i++) {
                const height = (raw[i] / 255) * h * 0.42;
                this.ctx.fillStyle = `rgba(255,0,255,${0.45 + vol/800})`;
                this.ctx.fillRect(i * bw, h - height, bw - 1.5, height);
            }
        }
    }
}

class VoiceEngine {
    constructor(cb) {
        this.cb = cb;
        this.rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        this.rec.lang = 'fr-FR';
        this.rec.continuous = true;
        this.rec.interimResults = false;
        this.active = false;
        
        this.rec.onresult = e => {
            const transcript = e.results[e.results.length-1][0].transcript;
            this.cb(transcript);
        };
        
        this.rec.onerror = e => Logger.error("Erreur reconnaissance : " + e.error);
        this.rec.onend = () => { if(this.active) this.rec.start(); };
    }
    
    toggle() {
        this.active = !this.active;
        if (this.active) {
            this.rec.start();
            $('btnVoice').textContent = "ÉCOUTE (ON)";
            $('btnVoice').classList.add('active');
            $('envBadge').textContent = "LISTENING";
        } else {
            this.rec.stop();
            $('btnVoice').textContent = "ÉCOUTE";
            $('btnVoice').classList.remove('active');
            $('envBadge').textContent = "READY";
        }
    }
}

class App {
    constructor() {
        this.audio = new AudioEngine();
        this.ai = new AIEngine();
        this.visuals = new Visuals();
        this.voice = new VoiceEngine(t => this.ai.process(t));
        
        // Initialisation
        setTimeout(async () => {
            await this.audio.start();
            this.voice.toggle();
            Logger.success("SUPRA NEURAL AI v4.0 LANCÉ");
            $('envBadge').textContent = "READY";
        }, 420);
        
        // Boutons
        $('btnMic').onclick = () => this.audio.start();
        $('btnVoice').onclick = () => this.voice.toggle();
        $('btnTest').onclick = () => this.ai.speak("Test vocal OK. SUPRA NEURAL AI v4.0 en ligne.");
        $('btnAuto').onclick = () => {
            this.audio.start();
            if (!this.voice.active) this.voice.toggle();
        };
        $('btnClear').onclick = () => { $('terminal').innerHTML = ''; };
        
        // Input texte (nouveau !)
        this.userInput = $('userInput');
        $('btnSend').onclick = () => this.sendText();
        this.userInput.addEventListener('keypress', e => {
            if (e.key === "Enter") this.sendText();
        });
        
        // Raccourci clavier
        document.addEventListener('keydown', e => {
            if (e.key === " ") {
                e.preventDefault();
                this.voice.toggle();
            }
            if (e.key.toLowerCase() === "t") {
                this.ai.speak("Test vocal OK.");
            }
        });
        
        this.loop();
    }
    
    sendText() {
        const txt = this.userInput.value.trim();
        if (txt) {
            this.ai.process(txt);
            this.userInput.value = "";
        }
    }
    
    loop() {
        requestAnimationFrame(() => this.loop());
        this.visuals.draw(this.audio.getData(), this.ai.isSpeaking);
    }
}

const app = new App();
</script>
</body>
</html>
