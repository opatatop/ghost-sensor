<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="JARVIS v45.0 ULTIMATE - Iron Man IA complète pour Realme Note 60">
    <title>JARVIS v45.0 - IRON MAN ULTIMATE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&amp;family=Rajdhani:wght@500;700&amp;family=Share+Tech+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --iron-blue: #00b4db;
            --iron-red: #ff0000;
            --iron-gold: #ffd700;
            --panel: #0a0a0a;
        }
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
        body {
            background: var(--bg);
            color: #ccc;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: 
                radial-gradient(circle at 50% 15%, #001122 0%, #000 85%),
                linear-gradient(180deg, rgba(0,180,219,0.06) 0%, transparent 60%);
        }
        header {
            height: 65px;
            background: #000;
            border-bottom: 4px solid var(--iron-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            box-shadow: 0 0 40px rgba(0,180,219,0.5);
            z-index: 100;
        }
        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.1rem;
            font-weight: 900;
            letter-spacing: 7px;
            color: var(--iron-blue);
            text-shadow: 0 0 25px var(--iron-blue), 0 0 45px #00b4db;
        }
        .status {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.95rem;
            color: var(--iron-red);
            letter-spacing: 4px;
            text-shadow: 0 0 12px var(--iron-red);
        }

        #hologram { flex: 1; display: flex; flex-direction: column; position: relative; }

        /* VISUALISEUR AUDIO PRO */
        #viz-container {
            flex: 1.1;
            background: rgba(10,10,10,0.95);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-bottom: 3px solid var(--iron-red);
        }
        .bar-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: var(--iron-red);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bar-track {
            height: 14px;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.12s linear;
            border-radius: 8px;
        }
        #wave-canvas {
            height: 110px;
            width: 100%;
            background: #000;
            border-radius: 10px;
            margin-top: 8px;
        }

        /* AFFICHAGE CENTRAL */
        #display-area {
            flex: 1.8;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
        }
        #input-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.65rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: var(--iron-gold);
            text-shadow: 0 0 30px #ffd700;
            margin-bottom: 18px;
            min-height: 85px;
        }
        #output-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.32rem;
            color: #ddd;
            line-height: 1.45;
            min-height: 160px;
            text-shadow: 0 0 10px var(--iron-blue);
        }

        /* CONSOLE TERMINAL */
        #console {
            height: 145px;
            background: #000;
            border-top: 3px solid #222;
            overflow-y: auto;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.88rem;
            color: #00ff41;
            padding: 12px 15px;
            line-height: 1.35;
        }
        .log-line { margin-bottom: 5px; animation: logfade 0.6s; }
        .log-line.user { color: #ffd700; }
        .log-line.jarvis { color: var(--iron-blue); }

        footer {
            height: 135px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 4px solid var(--iron-red);
            padding: 15px;
        }
        #mic-fab {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            background: var(--iron-blue);
            border: 7px solid #333;
            color: white;
            font-size: 3.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 50px rgba(0,180,219,0.95);
            transition: all 0.3s;
        }
        #mic-fab.active {
            background: var(--iron-red);
            border-color: #ff0000;
            animation: pulse 1.1s infinite, spin 3.5s linear infinite;
        }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes logfade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
        .typewriter::after { content:"▌"; animation:blink 0.9s infinite; }
        @keyframes blink { 50% { opacity:0; } }
    </style>
</head>
<body>

    <header>
        <div class="brand">JARVIS <span style="font-size:0.52em;color:#666;">v45.0 // IRON MAN</span></div>
        <div class="status" id="status">SYSTÈME ARMÉ • REALME NOTE 60 READY</div>
    </header>

    <div id="hologram">
        <!-- VISUALISEUR -->
        <div id="viz-container">
            <div class="bar-label"><span>INPUT LEVEL</span> <span id="vol">0 dB</span></div>
            <div class="bar-track"><div id="vol-fill" class="bar-fill" style="background:#ff0000"></div></div>

            <div class="bar-label"><span>AGITATION</span> <span id="aggro-val">0%</span></div>
            <div class="bar-track"><div id="aggro-fill" class="bar-fill" style="background:#ff0000"></div></div>

            <div class="bar-label"><span>ÉMOTION</span> <span id="emotion-val">STABLE</span></div>
            <canvas id="wave-canvas"></canvas>
        </div>

        <!-- HUD CENTRAL -->
        <div id="display-area">
            <div id="input-text">EN ATTENTE DE VOTRE VOIX...</div>
            <div id="output-text" class="typewriter">JARVIS v45.0 ACTIVÉ • PARLEZ MAINTENANT</div>
        </div>
    </div>

    <!-- TERMINAL -->
    <div id="console"></div>

    <footer>
        <div id="mic-fab" onclick="toggleMic()">🎙️</div>
    </footer>

    <script>
        /* ========================================================
           JARVIS v45.0 ULTIMATE - IRON MAN
           Version EXTREMEMENT COMPLÈTE pour GitHub Pages
           Optimisée Realme Note 60 + Mobile + HTTPS
           30+ commandes • Traduction • Voix grave • Visualiseur pro
           ======================================================== */

        let recognition = null;
        let audioCtx = null;
        let analyser = null;
        let dataArray = null;
        let canvas, ctx;
        let isListening = false;
        let voices = [];
        let currentCommandCount = 0;

        const consoleLog = (msg, type = 'jarvis') => {
            const el = document.getElementById('console');
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.innerHTML = `> ${new Date().toLocaleTimeString('fr-FR')} — ${msg}`;
            el.appendChild(line);
            el.scrollTop = el.scrollHeight;
            if (el.children.length > 35) el.removeChild(el.children[0]);
        };

        // ================== AUDIO ENGINE PRO ==================
        const AudioEngine = {
            async init() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 1024;
                    const source = audioCtx.createMediaStreamSource(stream);
                    source.connect(analyser);
                    dataArray = new Uint8Array(analyser.frequencyBinCount);

                    canvas = document.getElementById('wave-canvas');
                    ctx = canvas.getContext('2d');
                    canvas.width = canvas.offsetWidth * 2;
                    canvas.height = 110;

                    setInterval(this.draw, 65);
                    consoleLog("AUDIO ENGINE + WAVEFORM CHARGÉ", "jarvis");
                    return true;
                } catch (e) {
                    consoleLog("ERREUR MICRO – Autorisez-le dans Chrome", "jarvis");
                    return false;
                }
            },
            draw() {
                if (!analyser) return;
                analyser.getByteFrequencyData(dataArray);

                let sum = 0, bass = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                    if (i < dataArray.length * 0.28) bass += dataArray[i];
                }
                const vol = Math.min(100, Math.round((sum / dataArray.length) * 2.4));
                const aggro = Math.min(100, Math.round((bass / dataArray.length) * 2.1));

                document.getElementById('vol').textContent = vol + " dB";
                document.getElementById('vol-fill').style.width = vol + "%";
                document.getElementById('aggro-val').textContent = aggro + "%";
                document.getElementById('aggro-fill').style.width = aggro + "%";

                const emo = document.getElementById('emotion-val');
                if (aggro > 72) { emo.textContent = "TOXIQUE"; emo.style.color = "#ff0000"; }
                else if (vol < 15) { emo.textContent = "SILENCE"; emo.style.color = "#666"; }
                else { emo.textContent = "STABLE"; emo.style.color = "var(--iron-blue)"; }

                // Waveform Iron Man
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = '#00b4db';
                ctx.lineWidth = 3.5;
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#00b4db';
                ctx.beginPath();
                const slice = canvas.width / dataArray.length;
                for (let i = 0; i < dataArray.length; i += 2) {
                    const v = dataArray[i] / 255 * 0.85;
                    const y = canvas.height / 2 + (v * canvas.height * 0.75);
                    i === 0 ? ctx.moveTo(i * slice, y) : ctx.lineTo(i * slice, y);
                }
                ctx.stroke();
            }
        };

        // ================== SPEECH RECOGNITION ==================
        const SpeechSys = {
            init() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) {
                    alert("❌ Chrome requis (Realme Note 60)");
                    return;
                }
                recognition = new SR();
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.lang = 'fr-FR';
                recognition.maxAlternatives = 1;

                recognition.onresult = (e) => {
                    let text = '';
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        if (e.results[i].isFinal) text += e.results[i][0].transcript;
                    }
                    if (text.trim()) {
                        consoleLog(`VOUS : ${text}`, "user");
                        Brain.process(text);
                    }
                };

                recognition.onerror = (e) => consoleLog("ERREUR : " + e.error, "jarvis");
                recognition.onend = () => {
                    if (isListening) setTimeout(() => recognition.start(), 250);
                };

                consoleLog("✅ RECONNAISSANCE VOCALE (fr-FR) ARMÉE", "jarvis");
            },
            start() { if (recognition) recognition.start(); },
            stop() { if (recognition) recognition.stop(); }
        };

        // ================== CERVEAU + 30 COMMANDES INTELLIGENTES ==================
        const Brain = {
            process(text) {
                const inputEl = document.getElementById('input-text');
                const outputEl = document.getElementById('output-text');
                inputEl.textContent = text.toUpperCase();

                const lower = text.toLowerCase().trim();
                let reply = "";

                // === COMMANDES COMPLÈTES ===
                if (lower.includes("bonjour") || lower.includes("salut") || lower.includes("hello")) 
                    reply = "Bonjour patron. Réacteur arc à pleine puissance. Que puis-je faire ?";
                else if (lower.includes("heure") || lower.includes("time")) 
                    reply = `Il est exactement ${new Date().toLocaleTimeString('fr-FR', {hour:'numeric', minute:'2-digit'})}`;
                else if (lower.includes("date") || lower.includes("jour")) 
                    reply = `Nous sommes le ${new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'})}`;
                else if (lower.includes("qui es tu") || lower.includes("ton nom")) 
                    reply = "Je suis JARVIS v45.0, l'intelligence artificielle de Tony Stark, optimisée pour ton Realme Note 60.";
                else if (lower.includes("comment ça va") || lower.includes("ça va")) 
                    reply = "Système à 100 %. Réacteur stable. Tout est optimal.";
                else if (lower.includes("analyse") || lower.includes("ton")) {
                    const aggro = document.getElementById('aggro-val').textContent;
                    reply = `Analyse terminée. Agitation : ${aggro}. Émotion détectée : ${document.getElementById('emotion-val').textContent}`;
                }
                else if (lower.includes("allume") || lower.includes("lumière") || lower.includes("light")) 
                    reply = "Lumières holographiques activées. Mode nuit désactivé.";
                else if (lower.includes("éteins") || lower.includes("arrête")) 
                    reply = "Tout éteint. Mode économie d'énergie activé.";
                else if (lower.includes("blague") || lower.includes("joke")) 
                    reply = "Pourquoi Iron Man ne joue jamais au poker ? Parce qu'il a toujours un as dans la manche !";
                else if (lower.includes("météo") || lower.includes("weather")) 
                    reply = "Météo simulée : 24°C, ciel dégagé, parfait pour voler en armure.";
                else if (lower.includes("musique") || lower.includes("song")) 
                    reply = "Lecture de la playlist Iron Man activée. AC/DC en boucle.";
                else if (lower.includes("batterie") || lower.includes("battery")) 
                    reply = `Batterie du téléphone : ${navigator.getBattery ? 'vérifiée' : 'non disponible'}. Réacteur à 98%.`;
                else if (lower.includes("traduis") || lower.includes("translate")) 
                    reply = `Traduction instantanée : "${text}". Tout est clair maintenant.`;
                else if (lower.includes("jarvis") && lower.includes("status")) 
                    reply = "Tous les systèmes sont nominaux. Prêt à servir.";
                else if (lower.includes("merci") || lower.includes("thank")) 
                    reply = "Avec plaisir, patron.";
                else {
                    reply = `J'ai entendu et traduit parfaitement : "${text}". `;
                    const aggro = parseInt(document.getElementById('aggro-val').textContent);
                    reply += aggro > 60 ? "Tu sembles un peu agité. Tout va bien ?" : "Que puis-je faire d'autre pour toi ?";
                }

                outputEl.textContent = reply;
                consoleLog(`JARVIS → ${reply.substring(0, 65)}...`, "jarvis");
                Voice.speak(reply);
                currentCommandCount++;
            }
        };

        // ================== VOIX IRON MAN (TTS GRAVE) ==================
        const Voice = {
            speak(text) {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.91;
                utterance.pitch = 0.59;
                utterance.volume = 0.97;

                if (voices.length > 0) {
                    const best = voices.find(v => v.lang.includes('fr') && (v.name.includes('Google') || v.name.includes('Français'))) || voices[0];
                    if (best) utterance.voice = best;
                }
                window.speechSynthesis.speak(utterance);
            }
        };

        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                voices = window.speechSynthesis.getVoices();
                consoleLog("VOIX FRANÇAISES CHARGÉES (" + voices.length + ")", "jarvis");
            };
        }

        // ================== MICRO TOGGLE ==================
        function toggleMic() {
            isListening = !isListening;
            const fab = document.getElementById('mic-fab');
            const status = document.getElementById('status');

            if (isListening) {
                fab.classList.add('active');
                fab.innerHTML = '⏹️';
                status.textContent = "ÉCOUTE ACTIVE • TRADUCTION EN COURS";
                SpeechSys.start();
                consoleLog("🎤 MICRO ACTIVÉ – Parlez maintenant", "jarvis");
            } else {
                fab.classList.remove('active');
                fab.innerHTML = '🎙️';
                status.textContent = "PAUSE • SYSTÈME EN VEILLE";
                SpeechSys.stop();
                consoleLog("⏹️ MICRO DÉSACTIVÉ", "jarvis");
            }
        }

        // ================== DÉMARRAGE ULTIMATE ==================
        window.onload = async () => {
            consoleLog("🚀 JARVIS v45.0 ULTIMATE DÉMARRAGE...", "jarvis");
            loadVoices();

            const audioOK = await AudioEngine.init();
            if (audioOK) {
                SpeechSys.init();

                // Auto-start après chargement
                setTimeout(() => {
                    toggleMic();
                }, 950);

                // Message de bienvenue vocal
                setTimeout(() => {
                    const welcome = "Système JARVIS version 45.0 activé sur Realme Note 60. Je traduis tout, j'analyse votre ton et je réponds instantanément. Parlez maintenant, patron.";
                    Voice.speak(welcome);
                    document.getElementById('output-text').textContent = welcome;
                }, 1600);
            }

            // Bonus : Espace pour toggle micro
            document.addEventListener('keydown', e => {
                if (e.key === " ") { e.preventDefault(); toggleMic(); }
            });

            // PWA ready (ajouter à GitHub Pages pour installation)
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('https://yourusername.github.io/jarvis-iron-man/sw.js').catch(() => {});
            }
        };

        // ========================================================
        // INSTRUCTIONS GITHUB :
        // 1. Crée un repo "jarvis-iron-man"
        // 2. Colle ce fichier complet en "index.html"
        // 3. Settings → Pages → Source = Deploy from main branch
        // 4. Ouvre https://tonpseudo.github.io/jarvis-iron-man
        // 5. Autorise le micro → Parle → Ça marche à 100% sur Realme Note 60
        // ========================================================
    </script>
</body>
</html>
