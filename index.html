<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS v26.1 - TON POTE</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg:#050505; --primary:#00ff9d; --accent:#ff9900; --alert:#ff3333; --dim:#444; }
        * { box-sizing:border-box; user-select:none; }
        body { margin:0; background:var(--bg); color:#eee; font-family:'Rajdhani',sans-serif; height:100vh; overflow:hidden; display:flex; flex-direction:column; }
        
        #start-overlay { position:fixed; inset:0; background:#000; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        #start-btn { padding:25px 70px; font-size:1.5rem; background:var(--primary); color:#000; border:none; font-family:'Orbitron'; font-weight:900; cursor:pointer; box-shadow:0 0 50px var(--primary); }

        header { height:50px; background:rgba(10,10,10,0.95); display:flex; justify-content:space-between; align-items:center; padding:0 15px; }
        .brand { font-family:'Orbitron'; font-size:1.3rem; color:var(--primary); letter-spacing:3px; }

        #stage { flex:1; position:relative; background:radial-gradient(circle at center, #111 0%, #000 100%); }
        canvas { position:absolute; inset:0; }
        
        #data-display { z-index:10; width:92%; max-width:800px; margin:0 auto; text-align:center; background:rgba(0,0,0,0.85); padding:20px; border-radius:12px; border:1px solid #333; }
        #interim-text { color:var(--dim); font-size:1.1rem; min-height:24px; }
        #final-text { font-family:'Orbitron'; font-size:2.1rem; font-weight:900; color:#fff; text-transform:uppercase; letter-spacing:2px; }
        #system-response { color:var(--primary); font-size:1.35rem; margin-top:12px; min-height:50px; }

        #notification-area { position:absolute; top:70px; right:15px; z-index:200; }
        .toast { background:rgba(0,0,0,0.95); border-left:5px solid var(--primary); padding:12px 20px; color:#fff; font-size:0.9rem; margin-bottom:8px; animation:slide 0.4s; }

        #log-drawer { position:absolute; bottom:0; left:0; width:100%; height:35%; background:#050505; border-top:3px solid var(--primary); transform:translateY(100%); transition:0.4s; }
        #log-drawer.open { transform:translateY(0); }
        #log-content { padding:15px; overflow-y:auto; font-family:'JetBrains Mono'; font-size:0.85rem; color:#00ff9d; }

        #controls { height:100px; background:#0f0f0f; display:flex; justify-content:center; align-items:center; gap:40px; }
        #mic-btn { width:90px; height:90px; background:#111; border:5px solid #555; border-radius:20px; font-size:3.2rem; color:#666; transition:0.3s; }
        #mic-btn.listening { background:var(--primary); color:#000; border-color:var(--primary); box-shadow:0 0 60px var(--primary); animation:pulse 1.2s infinite; }

        @keyframes pulse { 50% { box-shadow:0 0 80px var(--primary); } }
        @keyframes slide { from{transform:translateX(150%);} to{transform:translateX(0);} }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div style="font-size:3.2rem; color:var(--primary); font-family:'Orbitron';">JARVIS</div>
        <div style="color:var(--accent); margin:10px 0 30px; font-size:1.2rem;">v26.1 • TON POTE DE OUF</div>
        <button id="start-btn">LANCE TON POTE</button>
    </div>

    <div id="notification-area"></div>

    <header>
        <div class="brand">JARVIS • TON POTE</div>
        <div style="font-family:monospace; font-size:0.75rem; color:var(--dim);"><span id="vol-indicator">VOL: 0%</span> | <span id="clock">00:00</span></div>
    </header>

    <div id="stage">
        <canvas id="main-canvas"></canvas>
        <div id="data-display">
            <div id="interim-text">J'écoute tout mon pote...</div>
            <div id="final-text">PRÊT</div>
            <div id="system-response">Vas-y, parle, je traduis et je réponds comme un vrai pote !</div>
        </div>
    </div>

    <div id="log-drawer">
        <div onclick="toggleLogs()" style="background:#0a0a0a; height:40px; display:flex; align-items:center; justify-content:center; color:var(--dim); cursor:pointer;">▼ TERMINAL DU POTE ▼</div>
        <div id="log-content"></div>
    </div>

    <div id="controls">
        <div onclick="toggleLogs()" style="font-size:2rem; cursor:pointer;">📜</div>
        <div id="mic-btn" onclick="toggleMic()">🎙️</div>
        <div onclick="toggleLogs()" style="font-size:2rem; cursor:pointer;">📜</div>
    </div>

    <script>
        const LANG = 'fr-FR';
        let recognition, audioCtx, analyser, dataArray;
        let isListening = true; // toujours actif par défaut

        // === INIT ===
        document.getElementById('start-btn').onclick = async () => {
            document.getElementById('start-overlay').style.display = 'none';
            await initAudio();
            initSpeech();
            recognition.start();
            log("POTE", "Yo mon pote ! Je suis là 24/7, j'écoute tout et je traduis tout en français.");
            speak("Salut mon pote ! Je suis ton JARVIS, balance tout ce que tu veux, je traduis et je réponds direct.");
        };

        async function initAudio() {
            const stream = await navigator.mediaDevices.getUserMedia({audio:true});
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            drawLoop();
        }

        function drawLoop() {
            requestAnimationFrame(drawLoop);
            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);
            let sum = 0; for(let i=0;i<dataArray.length;i++) sum+=dataArray[i];
            const vol = Math.round((sum/dataArray.length)*1.8);
            document.getElementById('vol-indicator').textContent = `VOL: ${vol}%`;
            
            const cvs = document.getElementById('main-canvas');
            const ctx = cvs.getContext('2d');
            cvs.width = window.innerWidth; cvs.height = window.innerHeight;
            ctx.clearRect(0,0,cvs.width,cvs.height);
            const color = '#00ff9d';
            for(let i=0;i<40;i++){
                const h = (dataArray[i*3]/255) * (cvs.height*0.6);
                ctx.fillStyle = color;
                ctx.fillRect(i*(cvs.width/40), cvs.height-h-100, cvs.width/45, h);
            }
        }

        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SR();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = LANG;

            recognition.onresult = (e) => {
                let final = '';
                for(let i=e.resultIndex; i<e.results.length; i++){
                    if(e.results[i].isFinal) final += e.results[i][0].transcript;
                }
                if(final){
                    document.getElementById('final-text').textContent = final.toUpperCase();
                    document.getElementById('interim-text').textContent = '';
                    processAsPote(final);
                }
            };

            recognition.onend = () => { if(isListening) setTimeout(() => recognition.start(), 300); };
        }

        function processAsPote(text) {
            const t = text.toLowerCase();
            let reply = "J't'ai capté mon pote !";

            // Traduction automatique si mélange anglais
            if(/[a-zA-Z]{5,}/.test(text) && /the|and|you|what|how|why|hello|sorry/.test(t)){
                reply = "Attends j'traduis ça en français direct... " + reply;
            }

            // Commandes pote
            if(t.includes('blague') || t.includes('rigole')) reply = "Pourquoi les plongeurs plongent toujours en arrière ? Parce que sinon ils tombent dans le bateau ! 😂";
            else if(t.includes('ça va') || t.includes('comment vas tu')) reply = "Nickel mon pote, et toi ? Raconte ta journée !";
            else if(t.includes('heure')) reply = `Il est ${new Date().toLocaleTimeString(LANG)} mon pote.`;
            else if(t.includes('merci')) reply = "Y'a pas de quoi, c'est pour ça que je suis ton pote !";
            else if(t.includes('arrête') || t.includes('pause')) { isListening=false; reply="Ok je me tais... dis 'reviens' pour me relancer."; }

            log("TOI", text);
            log("POTE", reply);
            document.getElementById('system-response').innerText = reply;
            speak(reply);
        }

        function speak(txt) {
            const u = new SpeechSynthesisUtterance(txt);
            u.lang = LANG;
            u.pitch = 1.1; u.rate = 1.05;
            window.speechSynthesis.speak(u);
        }

        function toggleMic() {
            isListening = !isListening;
            const btn = document.getElementById('mic-btn');
            if(isListening){ btn.classList.add('listening'); recognition.start(); }
            else { btn.classList.remove('listening'); recognition.stop(); }
        }

        function log(src, msg) {
            const c = document.getElementById('log-content');
            const d = document.createElement('div');
            d.innerHTML = `<span style="color:${src==='TOI'?'#fff':'#00ff9d'}">[${src}]</span> ${msg}`;
            c.appendChild(d); c.scrollTop = c.scrollHeight;
        }

        function toggleLogs() { document.getElementById('log-drawer').classList.toggle('open'); }
        function showToast(msg) {
            const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
            document.getElementById('notification-area').appendChild(t);
            setTimeout(()=>t.remove(), 3500);
        }

        // Horloge
        setInterval(()=>{ document.getElementById('clock').textContent = new Date().toLocaleTimeString(LANG,{hour:'2-digit',minute:'2-digit'}); },1000);
    </script>
</body>
</html>
