<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUPRA xAI v15.2 — NOTE 60 ELON MODE</title>
<style>
:root{--bg:#000;--primary:#00ff41;--secondary:#ff00ff;--xai:#00d4ff}
body{margin:0;background:var(--bg);color:var(--primary);font-family:'Courier New',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:70px;background:rgba(0,212,255,0.08);border-bottom:3px solid var(--xai);display:flex;justify-content:space-between;align-items:center;padding:0 15px}
.brand{font-size:1.4rem;font-weight:900;letter-spacing:6px;color:var(--xai);text-shadow:0 0 12px var(--xai)}
#status{font-size:0.95rem;background:#111;padding:6px 14px;border:2px solid var(--xai);min-width:170px;text-align:center}
#apikey{display:flex;gap:8px;padding:8px;background:#111}
input{background:#000;border:1px solid var(--xai);color:var(--xai);padding:8px;width:100%}
canvas{display:block;width:100%;height:100%}
#terminal{height:170px;background:#000;border-top:3px solid var(--xai);padding:10px;overflow-y:auto;font-size:11px}
.log{margin:3px 0}
.log.ai{color:#ff00ff;text-shadow:0 0 10px #ff00ff}
.log.elon{color:#00d4ff}
button{background:#111;border:1px solid var(--xai);color:var(--xai);padding:10px;font-weight:bold;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.96);z-index:9999;justify-content:center;align-items:center}
.modal-box{background:#111;border:3px solid var(--xai);width:94%;max-width:540px;padding:20px;max-height:88vh;overflow:auto}
</style>
</head>
<body>

<header>
<div class="brand">SUPRA xAI v15.2 // ELON MODE</div>
<div id="status">NEURAL CORE : 100%</div>
</header>

<div id="apikey">
<input type="password" id="keyinput" placeholder="Colle ta clé OpenAI (sk-...)">
<button onclick="saveKey()">SAUVEGARDER CLÉ</button>
<button onclick="openOptions()">⚙️ OPTIONS</button>
</div>

<div id="canvas-container"><canvas id="canvas"></canvas></div>
<div id="terminal"></div>

<div style="padding:12px;background:#111;display:flex;gap:8px;flex-wrap:wrap">
<button onclick="toggleRecording()">🎤 EVP</button>
<button onclick="manualScan()">SCAN xAI FULL</button>
<button onclick="clearLogs()">CLEAR</button>
</div>

<!-- MODAL OPTIONS (même que avant) -->
<div id="options-modal" class="modal">
<div class="modal-box">
<h2 style="color:#00d4ff">OPTIONS xAI ELON MODE</h2>
<!-- ... mêmes sliders que v15 ... -->
<button onclick="closeOptions()" style="width:100%;padding:14px;background:#00d4ff;color:#000;font-weight:900">SAUVEGARDER</button>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const log = (txt, type="") => {
  const t = $('terminal');
  const d = document.createElement('div');
  d.className = `log ${type}`;
  d.innerHTML = `[${new Date().toLocaleTimeString('fr-FR')}] ${txt}`;
  t.appendChild(d);
  t.scrollTop = t.scrollHeight;
  if(t.children.length > 100) t.removeChild(t.firstChild);
};

let apiKey = localStorage.getItem('supra_xai_key') || "";
let lastTriggerTime = 0;
let stream, analyser, dataArray;
let ghostIntensity = 0;
let sensEMF = 45, sensMotion = 9, voiceRate = 0.95, voicePitch = 0.85;

// Sauvegarde clé + confirmation
function saveKey() {
  apiKey = $('keyinput').value.trim();
  if(apiKey.startsWith('sk-') && apiKey.length > 20) {
    localStorage.setItem('supra_xai_key', apiKey);
    log("✅ CLÉ xAI VALIDÉE ET ACTIVÉE", "elon");
    $('status').innerHTML = "CLÉ xAI CONNECTÉE";
  } else {
    log("❌ Clé invalide (doit commencer par sk-)", "elon");
  }
}

// Micro
async function initMicro() {
  stream = await navigator.mediaDevices.getUserMedia({audio:{sampleRate:48000}});
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const source = ctx.createMediaStreamSource(stream);
  analyser = ctx.createAnalyser(); analyser.fftSize = 4096;
  source.connect(analyser);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
}

// COOLDOWN pour éviter les boucles
function canTrigger() {
  const now = Date.now();
  if(now - lastTriggerTime < 8000) return false; // 8 secondes cooldown
  lastTriggerTime = now;
  return true;
}

// Trigger IA (corrigé)
async function triggerElonAI(reason) {
  if(!canTrigger()) return;
  ghostIntensity = 140;

  log(`⚡ ${reason}`, "elon");

  let reply = "";

  if(apiKey) {
    // Avec clé → vrai GPT
    try {
      const res = await fetch("https://api.openai.com/v1/chat/completions", {
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
        body:JSON.stringify({
          model:"gpt-4o-mini",
          messages:[{role:"system",content:"Tu es Grok créé par xAI. Parle comme Elon Musk : direct, visionnaire, un peu troll. Réponds court en français."},
                    {role:"user",content:`Détection sur Realme Note 60 : ${reason}. Réponds.`}]
        })
      });
      const data = await res.json();
      reply = data.choices[0].message.content;
    } catch(e) { reply = "Erreur API... reviens plus tard."; }
  } else {
    // Sans clé → réponses Elon locales (plus jamais de boucle)
    const localReplies = [
      "Interesting... très intéressant.",
      "C'est comme Neuralink, mais en version fantôme.",
      "On est sur Mars ou quoi ?",
      "Quelque chose essaie de communiquer.",
      "Je sens une présence... ou c'est juste le WiFi ?",
      "Fascinant. Continue."
    ];
    reply = localReplies[Math.floor(Math.random()*localReplies.length)];
  }

  log(`ELON/GROK : ${reply}`, "ai");
  speak(reply);
}

function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.rate = voiceRate;
  u.pitch = voicePitch;
  speechSynthesis.speak(u);
}

// Capteurs + voice
if(window.DeviceOrientationEvent) window.addEventListener('deviceorientation', e => {
  const emf = Math.hypot(e.alpha||0, e.beta||0, e.gamma||0) / 3;
  if(emf > sensEMF) triggerElonAI("EMF SPIKE");
});

if(window.DeviceMotionEvent) window.addEventListener('devicemotion', e => {
  const motion = Math.hypot(e.acceleration.x||0, e.acceleration.y||0, e.acceleration.z||0);
  if(motion > sensMotion) triggerElonAI("COUP DÉTECTÉ");
});

const rec = new (window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang = 'fr-FR'; rec.continuous = true;
rec.onresult = e => {
  const txt = e.results[e.results.length-1][0].transcript.toLowerCase();
  if(txt.includes('esprit')||txt.includes('supra')||txt.includes('elon')||txt.includes('grok')||txt.includes('réponds'))
    triggerElonAI("Commande vocale");
};
rec.start();

// Canvas + fonctions boutons (même que avant)
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;} resize();
window.addEventListener('resize',resize);

function draw() {
  requestAnimationFrame(draw);
  ctx.fillStyle = "rgba(0,0,0,0.12)"; ctx.fillRect(0,0,canvas.width,canvas.height);
  if(analyser) {
    analyser.getByteFrequencyData(dataArray);
    for(let i=0;i<90;i++){
      const h = (dataArray[i*9]||0)/255 * canvas.height * 0.85;
      ctx.fillStyle = h > canvas.height*0.65 ? '#ff00ff' : '#00d4ff';
      ctx.fillRect(i*(canvas.width/90), canvas.height-h, 6, h);
    }
  }
  if(ghostIntensity > 5){
    const cx = canvas.width/2, cy = canvas.height/2;
    ctx.shadowBlur = 50; ctx.shadowColor = '#00d4ff';
    for(let i=0;i<22;i++){
      const x = cx + Math.sin(Date.now()/200 + i*0.3) * (90 + ghostIntensity*0.8);
      ctx.fillStyle = `rgba(0,212,255,${ghostIntensity/220})`;
      ctx.fillRect(x-6, cy-6, 13, 13);
    }
    ghostIntensity *= 0.91;
  }
}
draw();

function toggleRecording(){ /* ton code d'enregistrement */ }
function manualScan(){ triggerElonAI("Scan manuel lancé"); }
function clearLogs(){ $('terminal').innerHTML = ''; }
function openOptions(){ $('options-modal').style.display = 'flex'; }
function closeOptions(){
  sensEMF = parseFloat(document.getElementById('sens-emf').value);
  sensMotion = parseFloat(document.getElementById('sens-motion').value);
  voiceRate = parseFloat(document.getElementById('voice-rate').value);
  voicePitch = parseFloat(document.getElementById('voice-pitch').value);
  $('options-modal').style.display = 'none';
}

initMicro();
log("SUPRA xAI v15.2 corrigée");
log("Boucle supprimée + clé fonctionne + cooldown 8s");
</script>
</body>
</html>
