<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPATATOP AI - Mode Réel Ultime</title>
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #ff0000;
            --bg: #000;
            --panel: #111;
            --text: #fff;
            --danger: #ff5555;
            --accent: #ffff00;
            --sonar: #00ffff;
            --detect: #ff00ff;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #000;
            border-bottom: 3px solid var(--primary);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 1.2rem;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
            letter-spacing: 2px;
            margin: 0;
            font-weight: bold;
        }
        main {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #visualizer {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at center, #000 0%, #111 100%);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #displayOverlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            width: 90%;
        }
        #mainText {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--primary);
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 20px;
            border: 2px solid var(--primary);
            border-radius: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--primary);
            margin-bottom: 8px;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { text-shadow: 0 0 10px var(--primary); }
            50% { text-shadow: 0 0 15px var(--primary), 0 0 20px var(--primary); }
            100% { text-shadow: 0 0 10px var(--primary); }
        }
        #subText {
            font-size: 0.9rem;
            color: var(--accent);
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 15px;
            border: 1px solid var(--accent);
            border-radius: 5px;
            text-shadow: 0 0 5px var(--accent);
        }
        #hud {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 14px;
            border: 1px solid var(--primary);
            border-radius: 5px;
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--primary);
            z-index: 25;
        }
        #actionGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
            gap: 8px;
            padding: 12px;
            background: var(--panel);
            border-top: 1px solid #222;
        }
        .grid-btn {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #ccc;
            padding: 8px 3px;
            border-radius: 5px;
            text-align: center;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .grid-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(188, 19, 254, 0.5);
        }
        .grid-btn.active-state {
            background: var(--secondary);
            color: #000;
            border-color: #000;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.7);
            animation: pulseBtn 2s infinite;
        }
        @keyframes pulseBtn {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }
        .grid-icon {
            font-size: 1.1rem;
            margin-bottom: 2px;
        }
        #controls {
            background: var(--panel);
            padding: 12px;
            display: grid;
            gap: 8px;
        }
        button {
            background: #1a1a1a;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.15s;
            position: relative;
            overflow: hidden;
        }
        button:active {
            transform: scale(0.95);
        }
        button.active-mode {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 12px var(--primary);
        }
        #terminal {
            height: 90px;
            background: #000;
            border-top: 1px solid #333;
            padding: 6px;
            font-size: 0.6rem;
            overflow-y: auto;
            color: #aaa;
            line-height: 1.3;
            font-family: monospace;
        }
        .log-line {
            margin-bottom: 4px;
            border-left: 2px solid #555;
            padding-left: 6px;
        }
        .log-detect { border-color: var(--detect); color: var(--detect); }
        .log-voice { border-color: var(--sonar); color: var(--sonar); }
        .log-alert { border-color: var(--secondary); color: var(--secondary); }
        #translationOverlay {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            color: var(--text);
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 18px;
            border: 2px solid var(--primary);
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 0.9rem;
            font-weight: bold;
            text-shadow: 0 0 6px var(--primary);
        }
        #liveTranslation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            color: var(--sonar);
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 20px;
            border: 2px solid var(--sonar);
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 0 0 8px var(--sonar);
            animation: pulseText 2s infinite;
        }
        #detectionAlert {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--detect);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border: 2px solid var(--detect);
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 1rem;
            font-weight: bold;
            text-shadow: 0 0 8px var(--detect);
            display: none;
            animation: alertPulse 1s infinite;
        }
        @keyframes alertPulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }
        #soundWave {
            position: absolute;
            bottom: 10px;
            left: 0;
            height: 40px;
            width: 100%;
            background: linear-gradient(to right, transparent, rgba(0, 255, 136, 0.3), transparent);
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>
    <header>
        <h1>OPATATOP AI - RÉEL ULTIME</h1>
    </header>
    <main>
        <div id="visualizer">
            <canvas id="scopeCanvas"></canvas>
            <div id="detectionAlert">DÉTECTION PARANORMALE</div>
            <div id="soundWave"></div>
            <div id="displayOverlay">
                <div id="mainText">MODE RÉEL ACTIF</div>
                <div id="subText">TOUTES FONCTIONS ACTIVÉES</div>
            </div>
            <div id="translationOverlay">TRADUCTION: --</div>
            <div id="liveTranslation">--</div>
            <div id="hud">NIVEAU: 0%<br>FRÉQ.: 0 Hz<br>DÉTECTION: 0<br>TEMP: 0°C</div>
        </div>
    </main>
    <div id="actionGrid">
        <div class="grid-btn active-state" id="btnPower" onclick="FeatureEngine.togglePower()"><span class="grid-icon">⚡</span><span>POWER</span></div>
        <div class="grid-btn active-state" id="btnDetect" onclick="FeatureEngine.toggleDetection()"><span class="grid-icon">🔍</span><span>SONAR</span></div>
        <div class="grid-btn active-state" id="btnGhost" onclick="FeatureEngine.toggleGhostDetection()"><span class="grid-icon">👻</span><span>DETECT</span></div>
        <div class="grid-btn active-state" id="btnVAD" onclick="FeatureEngine.toggleVAD()"><span class="grid-icon">🎤</span><span>VAD</span></div>
        <div class="grid-btn active-state" id="btnSensors" onclick="FeatureEngine.toggleSensors()"><span class="grid-icon">📡</span><span>CAPTEURS</span></div>
        <div class="grid-btn active-state" id="btnRecord" onclick="FeatureEngine.toggleAutoRecord()"><span class="grid-icon">📼</span><span>ENREG.</span></div>
        <div class="grid-btn active-state" id="btnEMF" onclick="FeatureEngine.toggleEMF()"><span class="grid-icon">📏</span><span>EMF</span></div>
        <div class="grid-btn active-state" id="btnTemp" onclick="FeatureEngine.toggleTemp()"><span class="grid-icon">🌡️</span><span>TEMP</span></div>
    </div>
    <div id="terminal"></div>
    <script>
        // Configuration
        const Config = {
            data: {
                colorMode: 'dark'
            },
            colorModes: {
                dark: {
                    primary: '#00ff88',
                    secondary: '#ff3333',
                    bg: '#000',
                    panel: '#111',
                    text: '#fff',
                    sonar: '#00ffff',
                    detect: '#ff00ff'
                }
            },
            applyColorMode() {
                const mode = this.colorModes[this.data.colorMode];
                document.documentElement.style.setProperty('--primary', mode.primary);
                document.documentElement.style.setProperty('--secondary', mode.secondary);
                document.documentElement.style.setProperty('--bg', mode.bg);
                document.documentElement.style.setProperty('--panel', mode.panel);
                document.documentElement.style.setProperty('--text', mode.text);
                document.documentElement.style.setProperty('--sonar', mode.sonar);
                document.documentElement.style.setProperty('--detect', mode.detect);
            }
        };

        // Audio Engine with enhanced processing
        const AudioEngine = {
            ctx: null,
            stream: null,
            analyser: null,
            isInit: false,
            noiseBuffer: null,
            noiseNode: null,
            noiseGain: null,
            async init() {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    this.stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        }
                    });
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 1024;
                    this.analyser.smoothingTimeConstant = 0.8;
                    this.ctx.createMediaStreamSource(this.stream).connect(this.analyser);

                    // Create white noise buffer
                    this.createNoiseBuffer();
                    this.isInit = true;
                    return true;
                } catch (e) {
                    console.error("Audio error:", e);
                    return false;
                }
            },
            createNoiseBuffer() {
                const bufferSize = 2 * this.ctx.sampleRate;
                this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = this.noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
            },
            toggleWhiteNoise(active) {
                if (active) {
                    this.noiseNode = this.ctx.createBufferSource();
                    this.noiseNode.buffer = this.noiseBuffer;
                    this.noiseNode.loop = true;
                    this.noiseGain = this.ctx.createGain();
                    this.noiseGain.gain.value = 0.1;
                    this.noiseNode.connect(this.noiseGain);
                    this.noiseGain.connect(this.ctx.destination);
                    this.noiseNode.start(0);
                } else if (this.noiseNode) {
                    this.noiseNode.stop();
                    this.noiseNode = null;
                }
            },
            getRMS() {
                if (!this.analyser) return 0;
                const data = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(data);
                let sum = 0;
                for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
                return Math.sqrt(sum / data.length) / 128;
            },
            getDominantFrequency() {
                if (!this.analyser) return 0;
                const data = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(data);
                let max = 0, maxIdx = 0;
                for (let i = 0; i < data.length; i++) {
                    if (data[i] > max) {
                        max = data[i];
                        maxIdx = i;
                    }
                }
                return maxIdx * this.ctx.sampleRate / this.analyser.fftSize;
            },
            getGhostActivity() {
                if (!this.analyser) return 0;
                const data = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(data);
                let ghost = 0;
                // Analyze low frequencies (20-100Hz) typical for paranormal activity
                for (let i = 0; i < 40; i++) {
                    ghost += data[i];
                }
                return ghost;
            },
            getNoiseLevel() {
                if (!this.analyser) return 0;
                const data = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(data);
                let noise = 0;
                // Analyze high frequencies (1000Hz+) for noise
                for (let i = 200; i < data.length; i++) {
                    noise += data[i];
                }
                return noise;
            },
            destroy() {
                if (this.stream) this.stream.getTracks().forEach(t => t.stop());
                if (this.ctx) this.ctx.close();
                if (this.noiseNode) this.noiseNode.stop();
                this.isInit = false;
            }
        };

        // Visual Engine with enhanced graphics
        const VisualEngine = {
            canvas: null,
            ctx: null,
            animId: null,
            isRunning: false,
            blips: [],
            ghosts: [],
            soundWaveData: [],
            init() {
                this.canvas = document.getElementById('scopeCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
            },
            resize() {
                if (this.canvas) {
                    this.canvas.width = this.canvas.parentElement.clientWidth;
                    this.canvas.height = this.canvas.parentElement.clientHeight;
                }
            },
            start() {
                if (!this.isRunning) {
                    this.isRunning = true;
                    this.loop();

                    // Simulate more detection events
                    setInterval(() => {
                        if (Math.random() > 0.5) {
                            this.blips.push({
                                x: Math.random() * this.canvas.width,
                                y: Math.random() * this.canvas.height,
                                size: Math.random() * 15 + 5,
                                alpha: 1.0,
                                color: Math.random() > 0.5 ? '#ff0000' : '#ffff00'
                            });
                        }
                        if (Math.random() > 0.8) {
                            this.ghosts.push({
                                x: Math.random() * this.canvas.width,
                                y: Math.random() * this.canvas.height,
                                size: Math.random() * 20 + 10,
                                alpha: 1.0,
                                color: '#ff00ff',
                                pulse: Math.random() > 0.5
                            });
                            document.getElementById('detectionAlert').style.display = 'block';
                            setTimeout(() => {
                                document.getElementById('detectionAlert').style.display = 'none';
                            }, 3000);
                        }
                    }, 300);
                }
            },
            stop() {
                this.isRunning = false;
                if (this.animId) cancelAnimationFrame(this.animId);
            },
            loop() {
                if (!this.isRunning) return;
                const w = this.canvas.width, h = this.canvas.height;
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, w, h);

                // Draw radar grid
                this.ctx.save();
                this.ctx.translate(w/2, h/2);
                this.ctx.strokeStyle = '#00ff8833';
                this.ctx.lineWidth = 1;
                for (let r = 30; r <= Math.min(w, h)/2; r += 30) {
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, r, 0, Math.PI * 2);
                    this.ctx.stroke();
                }
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 12) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, 0);
                    this.ctx.lineTo(Math.cos(a) * Math.min(w, h)/2, Math.sin(a) * Math.min(w, h)/2);
                    this.ctx.stroke();
                }
                this.ctx.restore();

                // Draw radar sweep
                const angle = Date.now() / 1000 * Math.PI / 4;
                this.ctx.save();
                this.ctx.translate(w/2, h/2);
                this.ctx.strokeStyle = '#00ff88';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.moveTo(0, 0);
                this.ctx.lineTo(Math.cos(angle) * Math.min(w, h)/2, Math.sin(angle) * Math.min(w, h)/2);
                this.ctx.stroke();
                this.ctx.restore();

                // Draw detection blips
                this.blips = this.blips.filter(b => (b.alpha -= 0.02) > 0.03);
                this.blips.forEach(b => {
                    this.ctx.save();
                    this.ctx.globalAlpha = b.alpha;
                    this.ctx.fillStyle = b.color;
                    this.ctx.beginPath();
                    this.ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                });

                // Draw ghost anomalies with pulse effect
                this.ghosts = this.ghosts.filter(g => (g.alpha -= 0.01) > 0.03);
                this.ghosts.forEach(g => {
                    this.ctx.save();
                    this.ctx.globalAlpha = g.alpha;
                    if (g.pulse) {
                        this.ctx.shadowBlur = 10;
                        this.ctx.shadowColor = g.color;
                    }
                    this.ctx.fillStyle = g.color;
                    this.ctx.beginPath();
                    this.ctx.arc(g.x, g.y, g.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                });

                // Update sound wave visualization
                this.updateSoundWave();

                // Update HUD with real audio data
                const rms = AudioEngine.isInit ? AudioEngine.getRMS() * 100 : 0;
                const freq = AudioEngine.isInit ? AudioEngine.getDominantFrequency() : 0;
                const ghost = AudioEngine.isInit ? AudioEngine.getGhostActivity() : 0;
                const noise = AudioEngine.isInit ? AudioEngine.getNoiseLevel() : 0;
                document.getElementById('hud').innerHTML =
                    `NIVEAU: ${rms.toFixed(1)}%<br>` +
                    `FRÉQ.: ${freq.toFixed(0)} Hz<br>` +
                    `DÉTECTION: ${Math.min(100, ghost * 0.5).toFixed(0)}%<br>` +
                    `BRUIT: ${Math.min(100, noise * 0.1).toFixed(0)}%`;

                this.animId = requestAnimationFrame(() => this.loop());
            },
            updateSoundWave() {
                if (!AudioEngine.isInit) return;
                const data = new Uint8Array(AudioEngine.analyser.frequencyBinCount);
                AudioEngine.analyser.getByteFrequencyData(data);
                this.soundWaveData = [];
                for (let i = 0; i < data.length; i++) {
                    this.soundWaveData.push(data[i] / 128);
                }

                const wave = document.getElementById('soundWave');
                const waveWidth = wave.clientWidth;
                const waveHeight = wave.clientHeight;
                const canvas = document.createElement('canvas');
                canvas.width = waveWidth;
                canvas.height = waveHeight;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, waveWidth, waveHeight);

                // Draw sound wave
                ctx.beginPath();
                ctx.moveTo(0, waveHeight/2);
                for (let i = 0; i < waveWidth; i++) {
                    const x = i;
                    const y = waveHeight/2 - this.soundWaveData[Math.floor(i * this.soundWaveData.length / waveWidth)] * waveHeight/2;
                    ctx.lineTo(x, y);
                }
                ctx.strokeStyle = '#00ff88';
                ctx.lineWidth = 2;
                ctx.stroke();

                wave.style.backgroundImage = `url(${canvas.toDataURL()})`;
            }
        };

        // Feature Engine with all functions
        const FeatureEngine = {
            power: true,
            detection: true,
            ghostDetection: true,
            vad: true,
            sensorsActive: true,
            autoRecord: true,
            emfActive: true,
            tempActive: true,
            noiseActive: false,
            togglePower() {
                this.power = !this.power;
                document.getElementById('btnPower').classList.toggle('active-state');
                App.log(this.power ? "POWER ON" : "POWER OFF", this.power ? 'sys' : 'alert');
                if (!this.power) {
                    VisualEngine.stop();
                    AudioEngine.destroy();
                } else {
                    AudioEngine.init().then(() => {
                        VisualEngine.start();
                        if (this.noiseActive) AudioEngine.toggleWhiteNoise(true);
                    });
                }
            },
            toggleDetection() {
                this.detection = !this.detection;
                document.getElementById('btnDetect').classList.toggle('active-state');
                App.log(this.detection ? "SONAR ACTIVE" : "SONAR OFF", 'detect');
            },
            toggleGhostDetection() {
                this.ghostDetection = !this.ghostDetection;
                document.getElementById('btnGhost').classList.toggle('active-state');
                App.log(this.ghostDetection ? "GHOST DETECTION ON" : "GHOST DETECTION OFF", 'detect');
            },
            toggleVAD() {
                this.vad = !this.vad;
                document.getElementById('btnVAD').classList.toggle('active-state');
                App.log(this.vad ? "VAD ACTIVE" : "VAD OFF", 'detect');
            },
            toggleSensors() {
                this.sensorsActive = !this.sensorsActive;
                document.getElementById('btnSensors').classList.toggle('active-state');
                App.log(this.sensorsActive ? "SENSORS ACTIVE" : "SENSORS OFF", 'detect');
            },
            toggleAutoRecord() {
                this.autoRecord = !this.autoRecord;
                document.getElementById('btnRecord').classList.toggle('active-state');
                App.log(this.autoRecord ? "RECORDING ACTIVE" : "RECORDING OFF", 'detect');
            },
            toggleEMF() {
                this.emfActive = !this.emfActive;
                document.getElementById('btnEMF').classList.toggle('active-state');
                App.log(this.emfActive ? "EMF ACTIVE" : "EMF OFF", 'detect');
            },
            toggleTemp() {
                this.tempActive = !this.tempActive;
                document.getElementById('btnTemp').classList.toggle('active-state');
                App.log(this.tempActive ? "TEMPERATURE ACTIVE" : "TEMPERATURE OFF", 'detect');
            },
            toggleNoise() {
                this.noiseActive = !this.noiseActive;
                document.getElementById('btnNoise').classList.toggle('active-state');
                AudioEngine.toggleWhiteNoise(this.noiseActive);
                App.log(this.noiseActive ? "WHITE NOISE ON" : "WHITE NOISE OFF", 'detect');
            }
        };

        // Brain Engine for advanced audio processing
        const BrainEngine = {
            recognition: null,
            isListening: true,
            keywords: [
                { word: 'fantôme', response: "PRÉSENCE PARANORMALE DÉTECTÉE", type: 'ghost' },
                { word: 'esprit', response: "ENTITÉ SPIRITUELLE IDENTIFIÉE", type: 'ghost' },
                { word: 'anomalie', response: "ANOMALIE PARANORMALE DÉTECTÉE", type: 'ghost' },
                { word: 'présence', response: "PRÉSENCE SURNATURELLE DÉTECTÉE", type: 'ghost' },
                { word: 'entité', response: "ENTITÉ PARANORMALE DÉTECTÉE", type: 'ghost' },
                { word: 'surnaturel', response: "ACTIVITÉ SURNATURELLE DÉTECTÉE", type: 'ghost' },
                { word: 'hanté', response: "ZONE HANTÉE IDENTIFIÉE", type: 'ghost' },
                { word: 'bruit', response: "SOURCES DE BRUIT DÉTECTÉES", type: 'noise' },
                { word: 'son', response: "ACTIVITÉ SONORE ANALYSÉE", type: 'sound' },
                { word: 'voix', response: "VOIX HUMAINE DÉTECTÉE", type: 'voice' }
            ],
            init() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) return false;
                this.recognition = new SR();
                this.recognition.lang = 'fr-FR';
                this.recognition.interimResults = true;
                this.recognition.continuous = true;
                this.recognition.onresult = (e) => {
                    let text = '';
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        text += e.results[i][0].transcript;
                    }
                    document.getElementById('translationOverlay').innerText = `TRADUCTION: ${text}`;
                    document.getElementById('liveTranslation').innerText = this.processText(text);
                    App.log(`VOICE INPUT: ${text}`, 'voice');
                };
                this.recognition.onerror = (e) => {
                    if (e.error === 'not-allowed') {
                        App.log("MICROPHONE ACCESS DENIED", 'alert');
                    }
                };
                return true;
            },
            processText(text) {
                // Check for keywords and return appropriate response
                const lower = text.toLowerCase();
                for (const kw of this.keywords) {
                    if (lower.includes(kw.word)) {
                        App.log(`KEYWORD DETECTED: ${kw.word.toUpperCase()}`, kw.type);
                        return kw.response;
                    }
                }

                // Default responses based on audio level
                const rms = AudioEngine.isInit ? AudioEngine.getRMS() * 100 : 0;
                if (rms > 70) return "NIVEAU SONORE ÉLEVÉ DÉTECTÉ";
                if (rms > 40) return "ACTIVITÉ SONORE MODÉRÉE";
                if (rms > 10) return "BRUIT DE FOND DÉTECTÉ";
                return "SILENCE";
            },
            start() {
                if (!this.recognition) return;
                this.isListening = true;
                try { this.recognition.start(); } catch (e) {}
            },
            stop() {
                this.isListening = false;
                if (this.recognition) this.recognition.stop();
            }
        };

        // Main Application
        const App = {
            isRunning: false,
            async init() {
                Config.applyColorMode();
                VisualEngine.init();
                await AudioEngine.init();
                BrainEngine.init();
                VisualEngine.start();
                BrainEngine.start();
                this.isRunning = true;
                this.log("SYSTEM ONLINE - ALL FUNCTIONS ACTIVE", 'sys');
                this.log("AUDIO MONITORING ACTIVE", 'detect');
                this.log("GHOST DETECTION ACTIVE", 'detect');
                this.log("SONAR DETECTION ACTIVE", 'detect');
                this.log("VAD SYSTEM ACTIVE", 'detect');
                this.log("SENSORS ACTIVE", 'detect');
                this.log("AUTO RECORDING ACTIVE", 'detect');
                this.log("NOISE DETECTION ACTIVE", 'detect');

                // Add noise button to grid
                const noiseBtn = document.createElement('div');
                noiseBtn.className = 'grid-btn';
                noiseBtn.id = 'btnNoise';
                noiseBtn.innerHTML = '<span class="grid-icon">🔊</span><span>NOISE</span>';
                noiseBtn.onclick = () => FeatureEngine.toggleNoise();
                document.getElementById('actionGrid').appendChild(noiseBtn);
            },
            log(msg, type = 'sys') {
                const t = document.getElementById('terminal');
                const d = document.createElement('div');
                d.className = type === 'detect' ? 'log-line log-detect' :
                             type === 'voice' ? 'log-line log-voice' :
                             type === 'alert' ? 'log-line log-alert' : 'log-line';
                d.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
                t.appendChild(d);
                t.scrollTop = t.scrollHeight;
            }
        };

        // Initialize when loaded
        window.onload = () => App.init();
    </script>
</body>
</html>
