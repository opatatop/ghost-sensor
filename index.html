<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS v26.0 - ULTIMATE PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505; --panel: #0a0a0a;
            --primary: #00d2ff; --accent: #ff9900; --success: #00ff9d; --alert: #ff3333;
            --text: #e0e0e0; --dim: #444;
            --font-mono: 'JetBrains Mono', monospace;
            --font-tech: 'Rajdhani', sans-serif;
            --font-head: 'Orbitron', sans-serif;
            --border: 1px solid #2a2a2a;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-tech); height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }

        /* --- OVERLAY --- */
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #start-btn { padding: 20px 50px; font-size: 1.2rem; background: var(--primary); color: #000; border: none; font-family: var(--font-head); font-weight: 900; cursor: pointer; letter-spacing: 2px; }

        /* --- HEADER --- */
        header { height: 50px; background: rgba(10,10,10,0.95); border-bottom: var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 50; }
        .brand { font-family: var(--font-head); font-weight: 700; font-size: 1.1rem; color: var(--primary); letter-spacing: 2px; }
        .sys-stats { display: flex; gap: 10px; font-family: var(--font-mono); font-size: 0.7rem; color: var(--dim); }

        /* --- MAIN --- */
        #interface { flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; }

        /* --- TOOLBAR --- */
        #toolbar { height: 50px; background: #0f0f0f; border-bottom: var(--border); display: flex; align-items: center; padding: 0 10px; gap: 10px; overflow-x: auto; }
        select, button { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 5px 10px; font-family: var(--font-mono); font-size: 0.8rem; border-radius: 4px; outline: none; cursor: pointer; }

        /* --- STAGE --- */
        #stage { flex: 1; position: relative; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        #data-display { z-index: 10; width: 90%; max-width: 800px; text-align: center; background: rgba(0,0,0,0.8); border: 1px solid #333; padding: 20px; border-radius: 8px; backdrop-filter: blur(5px); }
        #interim-text { color: var(--dim); font-size: 1rem; min-height: 20px; margin-bottom: 5px; font-style: italic; }
        #final-text { color: #fff; font-family: var(--font-head); font-size: 1.8rem; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        #system-response { color: var(--primary); font-size: 1.2rem; border-top: 1px solid #333; padding-top: 10px; min-height: 30px; }

        /* --- NOTIFICATIONS --- */
        #notification-area { position: absolute; top: 60px; right: 10px; z-index: 100; display: flex; flex-direction: column; gap: 10px; width: 220px; pointer-events: none; }
        .toast { background: rgba(0,0,0,0.9); border-left: 3px solid var(--primary); color: #fff; padding: 12px; font-size: 0.85rem; font-family: var(--font-mono); animation: slideIn 0.3s forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* --- LOGS --- */
        #log-drawer { position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; background: #050505; border-top: 2px solid var(--primary); z-index: 40; transform: translateY(100%); transition: transform 0.3s ease; display: flex; flex-direction: column; font-family: var(--font-mono); }
        #log-drawer.open { transform: translateY(0); }
        .drawer-header { height: 35px; background: #0a0a0a; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #222; color: var(--dim); font-size: 0.75rem; cursor: pointer; }
        #log-content { flex: 1; overflow-y: auto; padding: 12px; font-size: 0.82rem; color: var(--success); }
        .log-entry { margin-bottom: 8px; border-left: 3px solid #444; padding-left: 10px; }

        /* --- CONTROLS --- */
        #controls { height: 90px; background: #0f0f0f; border-top: var(--border); display: flex; justify-content: center; align-items: center; gap: 25px; z-index: 50; padding-bottom: env(safe-area-inset-bottom); }
        .ctrl-btn { width: 55px; height: 55px; background: #1a1a1a; border: 1px solid #333; border-radius: 50%; color: #888; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        #mic-btn { width: 78px; height: 78px; background: #111; border: 3px solid #444; border-radius: 12px; color: #666; font-size: 2.4rem; transition: all 0.3s; }
        #mic-btn.listening { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: 0 0 30px var(--primary); }

        /* --- SETTINGS MODAL --- */
        #settings-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 320px;
            background: #0f0f0f; border: 2px solid var(--accent); padding: 20px; z-index: 200;
            box-shadow: 0 0 40px rgba(0,0,0,0.9); display: none; flex-direction: column; gap: 15px; border-radius: 8px;
        }
        #settings-modal.open { display: flex; }
        .setting-row label { display: block; color: var(--dim); font-size: 0.8rem; margin-bottom: 6px; }
        .close-btn { align-self: flex-end; background: none; border: none; color: #fff; font-size: 1.8rem; cursor: pointer; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #444; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div style="font-family:var(--font-head); color:var(--primary); font-size:2.4rem;">JARVIS ULTIMATE</div>
        <div style="color:var(--dim); margin:20px 0 30px;">AI CORE v26.0 • Français</div>
        <button id="start-btn">DÉMARRER LE SYSTÈME</button>
    </div>

    <div id="notification-area"></div>

    <!-- SETTINGS MODAL (langue supprimée = verrouillée en français) -->
    <div id="settings-modal">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0; color:#fff;">CONFIGURATION</h3>
            <button class="close-btn" onclick="toggleSettings()">×</button>
        </div>
        <div class="setting-row">
            <label>Visualiseur audio</label>
            <select id="opt-visu" style="width:100%" onchange="changeVisu(this.value)">
                <option value="bars">Barres (Bars)</option>
                <option value="wave">Onde (Waveform)</option>
            </select>
        </div>
        <div class="setting-row">
            <label>Seuil d'alerte volume (%)</label>
            <input type="range" id="opt-threshold" min="50" max="100" value="80" style="width:100%" oninput="updateThreshold(this.value)">
        </div>
        <button onclick="clearLogs()" style="background:#222; color:#fff; border:1px solid #444; padding:12px; cursor:pointer; margin-top:10px;">PURGER LES LOGS</button>
    </div>

    <header>
        <div class="brand">JARVIS <span style="font-size:0.6em; color:var(--dim)">ULTIMATE</span></div>
        <div class="sys-stats">
            <span id="vol-indicator">VOL: 0%</span> | <span id="clock">00:00</span>
        </div>
    </header>

    <div id="interface">
        <div id="toolbar">
            <select id="profile-select" onchange="setProfile(this.value)">
                <option value="assistant">MODE : ASSISTANT</option>
                <option value="security">MODE : SÉCURITÉ</option>
                <option value="dev">MODE : DÉVELOPPEUR</option>
                <option value="stealth">MODE : FURTIF</option>
            </select>
            <button class="ctrl-btn" style="width:auto; padding:0 20px; border-radius:6px;" onclick="toggleSettings()">⚙️ PARAMÈTRES</button>
        </div>

        <div id="stage">
            <canvas id="main-canvas"></canvas>
            <div id="data-display">
                <div id="interim-text">...</div>
                <div id="final-text">INITIALISATION</div>
                <div id="system-response">En attente de vos ordres...</div>
            </div>
        </div>

        <div id="log-drawer">
            <div class="drawer-header" onclick="toggleLogs()">▼ TERMINAL ▼</div>
            <div id="log-content">
                <div class="log-entry" style="color:var(--primary)">[SYSTEM] Jarvis Ultimate v26.0 chargé avec succès.</div>
            </div>
        </div>
    </div>

    <div id="controls">
        <div class="ctrl-btn" onclick="toggleLogs()">📜</div>
        <div id="mic-btn" onclick="toggleMic()">🎙️</div>
        <div class="ctrl-btn" onclick="toggleSettings()">⚙️</div>
    </div>

    <script>
        /* ================================================
           JARVIS v26.0 ULTIMATE - 100% FRANÇAIS
           ================================================ */

        const LANG = 'fr-FR';                    // Langue VERROUILLÉE
        const Config = {
            visuMode: 'bars',
            volumeThreshold: 80,
            profiles: {
                assistant: { pitch: 1.0,  rate: 1.0,  color: "var(--primary)" },
                security:  { pitch: 0.6,  rate: 1.25, color: "var(--alert)" },
                dev:       { pitch: 1.15, rate: 1.0,  color: "var(--success)" },
                stealth:   { pitch: 1.5,  rate: 0.75, color: "var(--accent)" }
            }
        };

        let currentProfile = 'assistant';
        let isListening = false;
        let recognition;
        let audioCtx, analyser, dataArray, waveArray;
        let silenceTimer = null;
        let lastActivityTime = Date.now();
        let voices = [];

        // Chargement des voix françaises
        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;

        // === INIT ===
        document.getElementById('start-btn').addEventListener('click', async () => {
            document.getElementById('start-overlay').style.display = 'none';
            await initAudio();
            loadVoices();
            initSpeech();
            log("SYSTEM", "Jarvis Ultimate v26.0 prêt à vous servir.");
            speak("Système initialisé. Bonjour Maître. Je suis à vos ordres.");
            startSilenceDetector();
            resizeCanvas();
        });

        // === AUDIO & VISUALISATION ===
        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                waveArray = new Uint8Array(analyser.fftSize);
                drawLoop();
            } catch (e) {
                log("ERREUR", "Impossible d'accéder au microphone.");
            }
        }

        function resizeCanvas() {
            const cvs = document.getElementById('main-canvas');
            cvs.width = window.innerWidth;
            cvs.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function drawLoop() {
            requestAnimationFrame(drawLoop);
            if (!analyser) return;

            analyser.getByteFrequencyData(dataArray);
            analyser.getByteTimeDomainData(waveArray);

            // Volume
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            const avgVol = Math.round((sum / dataArray.length) * 1.6);
            document.getElementById('vol-indicator').innerText = `VOL: ${avgVol}%`;

            if (avgVol > Config.volumeThreshold && isListening) {
                document.getElementById('vol-indicator').style.color = "var(--alert)";
                if (Math.random() > 0.85) showToast("ALERTE : Volume très élevé !");
            } else {
                document.getElementById('vol-indicator').style.color = "var(--dim)";
            }

            // Dessin
            const cvs = document.getElementById('main-canvas');
            const ctx = cvs.getContext('2d');
            const w = cvs.width;
            const h = cvs.height;
            ctx.clearRect(0, 0, w, h);

            const p = Config.profiles[currentProfile];
            const color = getComputedStyle(document.documentElement).getPropertyValue(p.color).trim();

            if (Config.visuMode === 'bars') {
                const bars = 42;
                const step = w / bars;
                for (let i = 0; i < bars; i++) {
                    const val = dataArray[Math.floor(i * 3)];
                    const barH = (val / 255) * (h * 0.65);
                    ctx.fillStyle = color;
                    ctx.fillRect(i * step, h - barH - 80, step - 3, barH);
                }
            } else {
                ctx.lineWidth = 3;
                ctx.strokeStyle = color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
                ctx.beginPath();
                const slice = w / waveArray.length;
                let x = 0;
                for (let i = 0; i < waveArray.length; i++) {
                    const v = waveArray[i] / 128;
                    const y = v * h / 2;
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                    x += slice;
                }
                ctx.stroke();
            }
        }

        // === DÉTECTION D'INACTIVITÉ ===
        function startSilenceDetector() {
            setInterval(() => {
                if (Date.now() - lastActivityTime > 18000 && isListening) {
                    log("SYSTEM", "Inactivité détectée.");
                    speak("Êtes-vous toujours là, Maître ?");
                    lastActivityTime = Date.now();
                }
            }, 6000);
        }

        // === RECONNAISSANCE VOCALE ===
        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return log("ERREUR", "API de reconnaissance vocale non disponible.");

            recognition = new SR();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = LANG;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('mic-btn').classList.add('listening');
                lastActivityTime = Date.now();
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('mic-btn').classList.remove('listening');
                // Redémarrage automatique si l'utilisateur veut rester en écoute
                if (document.getElementById('mic-btn').classList.contains('flag-active')) {
                    setTimeout(() => recognition.start(), 400);
                }
            };

            recognition.onresult = (e) => {
                let interim = '', final = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    if (e.results[i].isFinal) final += e.results[i][0].transcript;
                    else interim += e.results[i][0].transcript;
                }

                document.getElementById('interim-text').innerText = interim || '';
                if (final) {
                    document.getElementById('final-text').innerText = final.toUpperCase();
                    document.getElementById('interim-text').innerText = '';
                    lastActivityTime = Date.now();
                    processCommand(final);
                }
            };

            recognition.onerror = (e) => {
                if (e.error === 'no-speech') log("INFO", "Aucune parole détectée.");
            };
        }

        // === TRAITEMENT DES COMMANDES (tout en français) ===
        function processCommand(text) {
            const t = text.toLowerCase().trim();
            const p = Config.profiles[currentProfile];
            let reply = "";

            const fEl = document.getElementById('final-text');
            const rEl = document.getElementById('system-response');
            fEl.style.color = p.color;
            rEl.style.color = p.color;

            // Commandes prioritaires
            if (t.includes('bonjour') || t.includes('salut') || t.includes('coucou')) {
                reply = "Bonjour Maître ! Je suis prêt à vous assister.";
            }
            else if (t.includes('merci')) {
                reply = "Avec plaisir, Maître.";
            }
            else if (t.includes('arrête') || t.includes('stop')) {
                toggleMic();
                reply = "Écoute vocale arrêtée.";
            }
            // Mathématiques
            else if (t.includes('combien') || t.includes('calcul') || /[\d+\-*/]/.test(t)) {
                let expr = t.replace(/combien font|calcule|égal|égale/g, '')
                           .replace(/fois/g, '*')
                           .replace(/plus/g, '+')
                           .replace(/moins/g, '-')
                           .replace(/divisé par/g, '/')
                           .replace(/multiplié par/g, '*')
                           .replace(/[^0-9+\-*/().\s]/g, '');
                try {
                    const res = eval(expr);
                    reply = `Le résultat est ${res}.`;
                } catch (e) {
                    reply = "Je n'ai pas compris l'expression mathématique.";
                }
            }
            // Recherche
            else if (t.includes('cherche') || t.includes('trouve') || t.includes('google')) {
                const query = t.replace(/cherche|trouve|sur google/g, '').trim();
                window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
                reply = `Recherche lancée pour : ${query}.`;
            }
            // Heure & Date
            else if (t.includes('heure')) reply = `Il est ${new Date().toLocaleTimeString(LANG, {hour:'2-digit', minute:'2-digit'})}.`;
            else if (t.includes('date') || t.includes('jour')) reply = `Nous sommes le ${new Date().toLocaleDateString(LANG)}.`;
            // Profils
            else if (t.includes('sécurité')) { setProfile('security'); reply = "Mode Sécurité activé."; }
            else if (t.includes('développeur') || t.includes('dev')) { setProfile('dev'); reply = "Mode Développeur activé."; }
            else if (t.includes('assistant')) { setProfile('assistant'); reply = "Mode Assistant activé."; }
            else if (t.includes('furtif')) { setProfile('stealth'); reply = "Mode Furtif activé."; }
            // Réponses par défaut selon le profil
            else {
                if (currentProfile === 'security') reply = `Instruction "${text}" enregistrée dans le journal de sécurité.`;
                else if (currentProfile === 'dev') reply = `Entrée reçue : "${text}". Aucun problème détecté.`;
                else if (currentProfile === 'stealth') reply = `Transmission silencieuse de "${text}" confirmée.`;
                else reply = `J'ai bien noté : "${text}". Que puis-je faire d'autre pour vous ?`;
            }

            log("UTILISATEUR", text);
            log("JARVIS", reply);
            rEl.innerText = reply;
            speak(reply, p);
        }

        // === SYNTHÈSE VOCALE (français uniquement) ===
        function speak(txt, profile) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(txt);
            utterance.lang = LANG;
            utterance.pitch = profile.pitch;
            utterance.rate = profile.rate;

            // Priorité voix française
            const frenchVoice = voices.find(v => v.lang.startsWith('fr')) || voices[0];
            if (frenchVoice) utterance.voice = frenchVoice;

            window.speechSynthesis.speak(utterance);
        }

        // === FONCTIONS UI ===
        function setProfile(id) {
            currentProfile = id;
            document.getElementById('profile-select').value = id;
            log("SYSTEM", `Mode ${id.toUpperCase()} activé.`);
        }

        function toggleMic() {
            const btn = document.getElementById('mic-btn');
            if (!isListening) {
                btn.classList.add('flag-active');
                recognition.start();
            } else {
                btn.classList.remove('flag-active');
                recognition.stop();
            }
        }

        function log(src, msg) {
            const container = document.getElementById('log-content');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span style="color:${src==='UTILISATEUR'?'#fff':'var(--primary)'}">[${src}]</span> ${msg}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        function toggleLogs() { document.getElementById('log-drawer').classList.toggle('open'); }
        function toggleSettings() { document.getElementById('settings-modal').classList.toggle('open'); }
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.getElementById('notification-area').appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        function clearLogs() {
            document.getElementById('log-content').innerHTML = '<div class="log-entry" style="color:var(--primary)">[SYSTEM] Logs purgés.</div>';
        }
        function changeVisu(val) { Config.visuMode = val; }
        function updateThreshold(val) { Config.volumeThreshold = parseInt(val); }

        // Horloge française
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString(LANG, {hour:'2-digit', minute:'2-digit'});
        }, 1000);
    </script>
</body>
</html>
