<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SUPRA LAB v12 — TOUS LES SONS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Courier New', monospace;
        }

        body {
            background: #000;
            color: #00ff41;
            font-size: 14px;
            overflow: hidden;
            min-height: 100vh;
        }

        #start-screen, #main {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #001100;
            border: 3px solid #00ff41;
            box-shadow: 0 0 20px #00ff41;
            z-index: 1000;
        }
        #main { display: none; padding: 8px; }

        #start-screen {
            text-align: center;
            padding: 20px;
        }
        h1 { color: #00ff41; text-shadow: 0 0 10px #00ff41; margin-bottom: 10px; }
        p { color: #00cc33; margin-bottom: 20px; }

        button {
            background: transparent;
            color: #00ff41;
            border: 2px solid #00ff41;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 8px;
            width: 80%;
            max-width: 300px;
        }
        button:hover { background: #00ff41; color: #000; }
        button:active { background: #00cc33; }

        #log {
            position: fixed;
            bottom: 100px;
            left: 10px;
            right: 10px;
            max-height: 150px;
            overflow-y: auto;
            background: #001100;
            border: 1px solid #00ff41;
            padding: 8px;
            font-size: 12px;
            line-height: 1.2;
        }
        .log-line { margin: 2px 0; word-break: break-word; }
        .log-line::before { content: "> "; color: #00cc33; }
        .log-line.important { color: #ff0044 !important; }

        #status {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: #001100;
            border-top: 1px solid #00ff41;
            padding: 5px;
            font-size: 12px;
            text-align: center;
            display: flex;
            justify-content: space-between;
        }

        .panel {
            background: #001100;
            border: 2px solid #00ff41;
            padding: 8px;
            margin: 5px;
            position: relative;
            min-height: 150px;
        }
        .panel-header {
            position: absolute;
            top: -12px;
            left: 10px;
            background: #001100;
            padding: 0 8px;
            font-size: 12px;
        }
        canvas {
            background: #000;
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        #rms-value, #noise-value {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 12px;
            background: rgba(0, 17, 0, 0.8);
            padding: 3px 6px;
            border: 1px solid #00ff41;
        }
        #noise-value { top: 40px; }

        #voiceToggle {
            position: fixed;
            bottom: 60px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #00ff41;
            border: none;
            color: #000;
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
        }
        #voiceToggle.active { background: #ff0044; animation: pulse 1s infinite; }
        #voiceToggle.error { background: #ff0000; }

        #micIndicator {
            position: fixed;
            bottom: 60px;
            left: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #001100;
            border: 2px solid #00cc33;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 1000;
        }
        #micIndicator.listening { background: #00ff41; border-color: #00ff41; animation: pulse 1s infinite; }
        #micIndicator.error { background: #ff0000; border-color: #ff0000; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #ai-report {
            background: #000;
            border: 1px dashed #00ff41;
            padding: 8px;
            margin: 5px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            white-space: pre-wrap;
        }

        #settings-page {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 2000;
            padding: 15px;
            border: 2px solid #00ff41;
            overflow-y: auto;
        }
        .settings-section {
            background: #001100;
            border: 1px solid #00ff41;
            padding: 10px;
            margin: 10px 0;
        }
        .settings-section h3 {
            color: #00ff41;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group {
            margin: 8px 0;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 6px;
            background: #000;
            color: #00ff41;
            border: 1px solid #00ff41;
            font-size: 12px;
        }
        .btn-close {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            background: none;
            border: none;
            color: #00ff41;
            cursor: pointer;
        }
        .alert {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #001100;
            border: 2px solid #ff0044;
            padding: 15px;
            font-size: 14px;
            text-align: center;
            z-index: 3000;
            display: none;
        }
        .alert.active { display: block; }
    </style>
</head>
<body>
    <!-- ÉCRAN DE DÉMARRAGE -->
    <div id="start-screen">
        <h1>SUPRA LAB v12</h1>
        <p>Détection de TOUS les sons (parole + bruits)</p>
        <button id="btnStart">🚀 LANCER</button>
        <button id="btnSettings">⚙️ PARAMÈTRES</button>
    </div>

    <!-- INTERFACE PRINCIPALE -->
    <div id="main">
        <div class="panel">
            <div class="panel-header">SPECTROGRAMME</div>
            <canvas id="spectrogram"></canvas>
            <div id="rms-value">RMS: -- dB</div>
            <div id="noise-value">Bruit: --</div>
        </div>

        <div class="panel">
            <div class="panel-header">OSCILLOSCOPE</div>
            <canvas id="scope"></canvas>
        </div>

        <div class="panel">
            <div class="panel-header">RAPPORT IA</div>
            <div id="ai-report">[En attente...]</div>
            <button id="readReportBtn" style="margin-top: 5px; width: auto;">🔊 Lire</button>
        </div>

        <div id="log"></div>
        <div id="status">
            <span id="status-text">En attente...</span>
            <span id="device-info">v12 | Realme Note 60</span>
        </div>
    </div>

    <!-- ALERTE -->
    <div class="alert" id="criticalAlert">
        ⚠️ ALERTE ⚠️<br>
        <span id="alert-message">--</span>
    </div>

    <!-- BOUTONS FLOTTANTS -->
    <button id="voiceToggle" title="Voix ON/OFF">🎤</button>
    <div id="micIndicator" title="Micro">🎙️</div>

    <!-- PARAMÈTRES -->
    <div id="settings-page">
        <button class="btn-close" id="closeSettings">✕</button>
        <div class="settings-section">
            <h3>🎤 Micro & Voix</h3>
            <div class="form-group">
                <label><input type="checkbox" id="autoStartVoice" checked> Démarrer l'IA vocale automatiquement</label>
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="voiceFeedback" checked> Activer la voix pour les rapports</label>
            </div>
            <div class="form-group">
                <label>Seuil de bruit (dB): <input type="range" id="noiseThreshold" min="0.1" max="1.0" step="0.1" value="0.4">
                <span id="noiseThresholdValue">0.4</span></label>
            </div>
        </div>
        <div class="settings-section">
            <h3>🔑 Clé API Groq</h3>
            <div class="form-group">
                <label>Clé API: <input type="text" id="groqApiKey" placeholder="Ton clé Groq..."></label>
            </div>
        </div>
        <button id="saveSettings" style="margin-top: 10px; width: 100%;">💾 Sauvegarder</button>
    </div>

    <script>
        // ========== CONFIG ==========
        let config = {
            autoStartVoice: true,
            voiceFeedback: true,
            groqApiKey: '',
            noiseThreshold: 0.4
        };

        // ========== GLOBALS ==========
        let audioCtx, analyser, microphone, gainNode, mediaRecorder;
        let audioStream = null;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let isRunning = false;
        let isVoiceEnabled = false;
        let isListening = false;
        let frequencyArray, timeArray, spectroHistory = [];
        let noiseDetected = false;
        let lastNoiseTime = 0;
        let noiseCooldown = 1000; // 1 seconde entre chaque détection de bruit

        // ========== FREQUENCY DB ==========
        const FREQUENCY_DB = {
            'AVIATION_EMERGENCY': { min: 121.4, max: 121.6, label: 'Aviation Emergency', critical: true },
            'DRONE_2_4': { min: 2400, max: 2483.5, label: 'Drone 2.4GHz', critical: true },
            'FM_RADIO': { min: 87.5, max: 108, label: 'FM Radio', critical: false },
            'HUMAN_VOICE': { min: 85, max: 255, label: 'Voix humaine', critical: false }
        };
        const KEYWORDS = ['avion', 'drone', 'urgence', 'sos', 'alerte', 'danger', 'bruit', 'son', 'clac', 'siffle', 'coup'];

        // ========== UTILS ==========
        function log(text, important = false) {
            const logDiv = document.getElementById('log');
            if (!logDiv) return;
            const line = document.createElement('div');
            line.className = 'log-line' + (important ? ' important' : '');
            line.innerHTML = `<span style="color: #00cc33;">[${new Date().toLocaleTimeString('fr-FR')}]</span> ${text}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
            if (logDiv.children.length > 50) logDiv.removeChild(logDiv.children[0]);
        }

        function updateStatus(text) {
            const statusDiv = document.getElementById('status-text');
            if (statusDiv) statusDiv.textContent = text;
        }

        function showAlert(message) {
            const alertBox = document.getElementById('criticalAlert');
            const alertMsg = document.getElementById('alert-message');
            if (alertMsg) alertMsg.textContent = message;
            if (alertBox) {
                alertBox.classList.add('active');
                setTimeout(() => alertBox.classList.remove('active'), 3000);
            }
        }

        function speak(text) {
            if (!config.voiceFeedback || !isVoiceEnabled || !synthesis) return;
            try {
                synthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 1.0;
                synthesis.speak(utterance);
            } catch (e) {
                log(`[VOIX] Erreur: ${e.message}`);
            }
        }

        // ========== AUDIO INIT ==========
        async function initAudio() {
            if (audioStream && !audioStream.getAudioTracks().some(t => t.readyState === 'ended')) {
                log("[AUDIO] Stream déjà actif");
                return true;
            }

            try {
                if (audioCtx) await audioCtx.close().catch(() => {});
                if (audioStream) audioStream.getTracks().forEach(t => t.stop());

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                await audioCtx.resume();

                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false, // Désactivé pour capturer TOUS les sons
                        noiseSuppression: false, // Désactivé pour capturer TOUS les sons
                        autoGainControl: false
                    }
                });

                microphone = audioCtx.createMediaStreamSource(audioStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048; // Taille optimisée pour mobile
                analyser.smoothingTimeConstant = 0.1;

                gainNode = audioCtx.createGain();
                gainNode.gain.value = 1.0; // Gain maximal pour capturer les bruits

                microphone.connect(analyser);
                analyser.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                frequencyArray = new Uint8Array(analyser.frequencyBinCount);
                timeArray = new Uint8Array(analyser.frequencyBinCount);

                mediaRecorder = new MediaRecorder(audioStream);
                recordedChunks = [];
                mediaRecorder.ondataavailable = (e) => {
                    const blob = new Blob([e.data], { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `rec-${Date.now()}.webm`;
                    a.click();
                    recordedChunks = [];
                };

                isRunning = true;
                updateStatus("✅ Micro prêt");
                log("[AUDIO] Système audio activé (TOUS les sons captés)");

                requestAnimationFrame(loop);
                if (config.autoStartVoice) {
                    setTimeout(initSpeech, 500);
                }

                return true;
            } catch (err) {
                updateStatus(`❌ Erreur micro: ${err.message}`);
                log(`[ERREUR] ${err.message}`, true);
                document.getElementById('micIndicator').classList.add('error');
                return false;
            }
        }

        // ========== SPEECH RECOGNITION (TOUS LES MOTS) ==========
        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                log("[IA] ❌ Reconnaissance vocale non supportée (Chrome requis)", true);
                return;
            }

            try {
                if (recognition) recognition.stop();

                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'fr-FR';
                recognition.maxAlternatives = 1;

                let finalTranscript = '';
                let interimTranscript = '';

                recognition.onresult = (event) => {
                    interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript + ' ';
                            processFinalTranscript(finalTranscript.trim());
                        } else {
                            interimTranscript += transcript;
                        }
                    }
                    // AFFICHER LES FRAGMENTS EN TEMPS RÉEL
                    if (interimTranscript) {
                        log(`[SON] 🎤 "${interimTranscript}"`);
                    }
                };

                recognition.onerror = (event) => {
                    log(`[IA ERREUR] ${event.error}`, true);
                    if (event.error === 'not-allowed') {
                        updateStatus("❌ Permission micro refusée");
                        document.getElementById('micIndicator').classList.add('error');
                    }
                };

                recognition.onstart = () => {
                    isListening = true;
                    isVoiceEnabled = true;
                    document.getElementById('micIndicator').classList.add('listening');
                    document.getElementById('micIndicator').textContent = '🎤';
                    updateStatus("🎤 Écoute TOUS les sons...");
                    log("[IA] ✅ Détection de TOUS les sons activée");
                };

                recognition.onend = () => {
                    isListening = false;
                    document.getElementById('micIndicator').classList.remove('listening');
                    document.getElementById('micIndicator').textContent = '🎙️';
                    if (isVoiceEnabled) {
                        setTimeout(() => {
                            try { if (recognition) recognition.start(); }
                            catch (e) { log(`[IA] Erreur redémarrage: ${e.message}`); }
                        }, 100);
                    }
                };

                recognition.start();
                isVoiceEnabled = true;
            } catch (e) {
                log(`[IA ERREUR] ${e.message}`, true);
            }
        }

        function stopSpeechRecognition() {
            if (recognition) {
                recognition.stop();
                isVoiceEnabled = false;
                isListening = false;
                document.getElementById('micIndicator').classList.remove('listening');
                document.getElementById('micIndicator').textContent = '🎙️';
                updateStatus("IA: Désactivée");
            }
        }

        function processFinalTranscript(transcript) {
            if (!transcript) return;
            log(`[IA] 🎤 "${transcript}"`);

            const transcriptLower = transcript.toLowerCase();
            const hasKeyword = KEYWORDS.some(kw => transcriptLower.includes(kw));
            if (hasKeyword) {
                log(`[IA] ⚡ Mot-clé détecté ! Analyse IA déclenchée`, true);
                triggerAIAnalysis(transcript);
            }
        }

        // ========== DÉTECTION DE BRUITS NON VERBAUX ==========
        function detectNoise(rms) {
            const now = Date.now();
            if (rms > config.noiseThreshold && now - lastNoiseTime > noiseCooldown) {
                lastNoiseTime = now;
                log(`[BRUIT] 🔊 Niveau sonore élevé détecté: ${rms.toFixed(2)} dB`, true);
                document.getElementById('noise-value').textContent = `Bruit: 🔴 ${rms.toFixed(2)} dB`;
                if (config.voiceFeedback && isVoiceEnabled) {
                    speak(`Bruit détecté: ${rms.toFixed(1)} décibels`);
                }
                return true;
            } else {
                document.getElementById('noise-value').textContent = `Bruit: ${rms.toFixed(2)} dB`;
                return false;
            }
        }

        // ========== BAND DETECTION ==========
        function detectFrequencyBand(freq) {
            if (freq <= 0) return null;
            const freqHz = freq;
            for (const [name, data] of Object.entries(FREQUENCY_DB)) {
                if (freqHz >= data.min * 1e6 && freqHz <= data.max * 1e6) return data;
            }
            return null;
        }

        function findDominantFrequency() {
            if (!analyser) return 0;
            analyser.getByteFrequencyData(frequencyArray);
            let maxIndex = 0;
            let maxValue = 0;
            for (let i = 0; i < frequencyArray.length; i++) {
                if (frequencyArray[i] > maxValue) {
                    maxValue = frequencyArray[i];
                    maxIndex = i;
                }
            }
            return maxIndex * (audioCtx.sampleRate / analyser.fftSize);
        }

        function updateBandDetection() {
            const dominantFreq = findDominantFrequency();
            const band = detectFrequencyBand(dominantFreq);
            const freqEl = document.getElementById('rms-value');
            if (freqEl) {
                freqEl.textContent = `RMS: ${(dominantFreq/1e6).toFixed(3)} MHz${band ? ` (${band.label})` : ''}`;
                if (band && band.critical) freqEl.style.color = '#ff0044';
                else freqEl.style.color = '#00ff41';
            }
        }

        // ========== DRAWING FUNCTIONS ==========
        function drawSpectrogram() {
            const canvas = document.getElementById('spectrogram');
            if (!canvas || !analyser) return;
            const ctx = canvas.getContext('2d');
            analyser.getByteFrequencyData(frequencyArray);
            spectroHistory.unshift([...frequencyArray]);
            if (spectroHistory.length > 80) spectroHistory.pop();
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width / frequencyArray.length;
            for (let y = 0; y < spectroHistory.length; y++) {
                for (let x = 0; x < spectroHistory[y].length; x++) {
                    const val = spectroHistory[y][x];
                    ctx.fillStyle = `hsl(${90 + val/2.5}, 100%, ${val/2.8}%)`;
                    ctx.fillRect(x * w, y * 2, w + 1, 2);
                }
            }
        }

        function drawScope() {
            const canvas = document.getElementById('scope');
            if (!canvas || !analyser) return;
            const ctx = canvas.getContext('2d');
            analyser.getByteTimeDomainData(timeArray);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#00ff41';
            ctx.lineWidth = 2;
            ctx.beginPath();
            const slice = canvas.width / timeArray.length;
            for (let i = 0; i < timeArray.length; i++) {
                const y = (timeArray[i] / 128) * canvas.height / 2;
                i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * slice, y);
            }
            ctx.stroke();
        }

        // ========== MAIN LOOP ==========
        function loop() {
            if (!isRunning || !analyser) return;

            analyser.getByteFrequencyData(frequencyArray);
            const rms = Math.sqrt(frequencyArray.reduce((a, b) => a + b * b, 0) / frequencyArray.length) / 128;

            // Détecter les bruits non verbaux
            detectNoise(rms);

            // Mettre à jour l'affichage RMS
            const rmsEl = document.getElementById('rms-value');
            if (rmsEl) {
                rmsEl.textContent = `RMS: ${rms.toFixed(2)} dB`;
                rmsEl.style.color = rms > config.noiseThreshold ? '#ff0044' : '#00ff41';
            }

            updateBandDetection();
            drawSpectrogram();
            drawScope();
            requestAnimationFrame(loop);
        }

        // ========== AI ANALYSIS ==========
        function generateReport(rms, freq, band, transcript) {
            return `
[RAPPORT - ${new Date().toLocaleTimeString('fr-FR')}]
Niveau sonore: ${rms.toFixed(2)} dB
Fréquence dominante: ${(freq/1e6).toFixed(3)} MHz
Bande: ${band ? band.label : 'Inconnue'}
Transcription: "${transcript || 'Aucune'}"
Statut: ${band && band.critical ? '🚨 CRITIQUE' : rms > config.noiseThreshold ? '⚠️ BRUIT FORT' : '✅ Normal'}
            `.trim();
        }

        function triggerAIAnalysis(transcript = "") {
            if (!isRunning) return;

            analyser.getByteFrequencyData(frequencyArray);
            const rms = Math.sqrt(frequencyArray.reduce((a, b) => a + b * b, 0) / frequencyArray.length) / 128;
            const freq = findDominantFrequency();
            const band = detectFrequencyBand(freq);

            const report = generateReport(rms, freq, band, transcript);
            const reportDiv = document.getElementById('ai-report');
            if (reportDiv) reportDiv.textContent = report;

            if (config.voiceFeedback && isVoiceEnabled) {
                speak(report);
            }

            if (config.groqApiKey) {
                sendToGroq(report);
            }
        }

        async function sendToGroq(report) {
            try {
                const response = await fetch('https://api.groq.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.groqApiKey}`
                    },
                    body: JSON.stringify({
                        model: "mixtral-8x7b-32768",
                        messages: [{
                            role: "user",
                            content: `Analyse ce rapport de détection sonore:\n${report}\nClassifie le type de son (parole, bruit, etc.) et donne des recommandations. Réponds en français.`
                        }],
                        temperature: 0.3,
                        max_tokens: 512
                    })
                });
                if (!response.ok) throw new Error("Erreur Groq API");
                const data = await response.json();
                const aiReportDiv = document.getElementById('ai-report');
                if (aiReportDiv) {
                    aiReportDiv.textContent += `\n\n[RÉPONSE GROQ]\n${data.choices[0].message.content}`;
                }
            } catch (e) {
                log(`[GROQ] Erreur: ${e.message}`);
            }
        }

        // ========== SETUP UI ==========
        function setupUI() {
            // Bouton Lancer
            document.getElementById('btnStart').addEventListener('click', async () => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main').style.display = 'block';

                await initAudio();
                resizeCanvases();
                window.addEventListener('resize', resizeCanvases);

                // Bouton Voice Toggle
                document.getElementById('voiceToggle').addEventListener('click', () => {
                    isVoiceEnabled = !isVoiceEnabled;
                    if (isVoiceEnabled) {
                        initSpeech();
                        document.getElementById('voiceToggle').classList.add('active');
                    } else {
                        stopSpeechRecognition();
                        document.getElementById('voiceToggle').classList.remove('active');
                    }
                });

                // Bouton Lire le rapport
                document.getElementById('readReportBtn').addEventListener('click', () => {
                    const report = document.getElementById('ai-report').textContent;
                    if (report && report !== '[En attente...]') {
                        speak(report);
                    }
                });
            });

            // Bouton Paramètres
            document.getElementById('btnSettings').addEventListener('click', () => {
                document.getElementById('settings-page').style.display = 'block';
            });

            // Bouton Fermer les paramètres
            document.getElementById('closeSettings').addEventListener('click', () => {
                document.getElementById('settings-page').style.display = 'none';
            });

            // Bouton Sauvegarder
            document.getElementById('saveSettings').addEventListener('click', () => {
                config.autoStartVoice = document.getElementById('autoStartVoice').checked;
                config.voiceFeedback = document.getElementById('voiceFeedback').checked;
                config.groqApiKey = document.getElementById('groqApiKey').value;
                config.noiseThreshold = parseFloat(document.getElementById('noiseThreshold').value);
                localStorage.setItem('supraLabConfig', JSON.stringify(config));
                document.getElementById('settings-page').style.display = 'none';
                log("[PARAM] Configuration sauvegardée");
            });

            // Charger la config
            const savedConfig = localStorage.getItem('supraLabConfig');
            if (savedConfig) {
                try {
                    const loadedConfig = JSON.parse(savedConfig);
                    config = { ...config, ...loadedConfig };
                    document.getElementById('autoStartVoice').checked = config.autoStartVoice;
                    document.getElementById('voiceFeedback').checked = config.voiceFeedback;
                    document.getElementById('groqApiKey').value = config.groqApiKey;
                    document.getElementById('noiseThreshold').value = config.noiseThreshold;
                    document.getElementById('noiseThresholdValue').textContent = config.noiseThreshold;
                } catch (e) {
                    console.error("Erreur chargement config:", e);
                }
            }

            // Mettre à jour le seuil de bruit en temps réel
            document.getElementById('noiseThreshold').addEventListener('input', (e) => {
                config.noiseThreshold = parseFloat(e.target.value);
                document.getElementById('noiseThresholdValue').textContent = e.target.value;
            });
        }

        function resizeCanvases() {
            document.querySelectorAll('canvas').forEach(canvas => {
                const container = canvas.parentElement;
                if (container) {
                    const rect = container.getBoundingClientRect();
                    canvas.width = rect.width - 16;
                    canvas.height = rect.height - 30;
                }
            });
        }

        // ========== INIT ==========
        window.addEventListener('DOMContentLoaded', () => {
            setupUI();
            log("=== SUPRA LAB v12 PRÊT ===");
            log("Optimisé pour Realme Note 60 (Android 15)");
            log("Cliquez sur 'LANCER' pour commencer");
        });

        window.addEventListener('beforeunload', () => {
            stopSpeechRecognition();
            if (audioStream) audioStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close().catch(() => {});
        });
    </script>
</body>
</html>
