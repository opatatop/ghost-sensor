<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050905">
<title>SUPRA LAB v29.1 — Real Only (Groq)</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050905;
  --bg2: #020402;
  --panel: #081208;
  --fg: #00ff41;
  --dim: #007a20;
  --muted: #004d14;
  --red: #ff0044;
  --orange: #ffaa00;
  --blue: #00ccff;
  --font: 'VT323', monospace;
  --glow: 0 0 10px rgba(0,255,65,0.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font)}
body{background-image:linear-gradient(rgba(0,255,65,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,65,.025) 1px,transparent 1px);background-size:32px 32px}
button,input,select,textarea{font-family:var(--font);touch-action:manipulation}
.scan,.vig{position:fixed;inset:0;pointer-events:none;z-index:9990}
.scan{background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px)}
.vig{background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.6) 100%)}
.btn{background:transparent;border:3px solid var(--fg);color:var(--fg);padding:10px 18px;font-size:17px;cursor:pointer;box-shadow:var(--glow);transition:.12s;border-radius:0;white-space:nowrap}
.btn:hover{background:rgba(0,255,65,.1)}
.btn:active{transform:scale(.96);background:var(--fg);color:var(--bg)}
.btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none;transform:none;background:transparent;color:var(--fg)}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.blue{border-color:var(--blue);color:var(--blue)}
.btn.on{background:var(--fg)!important;color:var(--bg)!important}
.btn.sm{padding:6px 11px;font-size:14px;border-width:2px}
#boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;border:6px solid var(--fg);background:var(--bg);text-align:center;padding:20px}
#boot h1{font-size:28px;letter-spacing:3px;text-shadow:0 0 15px rgba(0,255,65,.5);min-height:40px}
#boot p{color:var(--orange);margin-top:12px;font-size:15px;opacity:0;transition:opacity .5s;line-height:1.4}
#boot p.show{opacity:1}
#boot .acts{margin-top:26px;display:flex;gap:12px;opacity:0;transition:opacity .5s;flex-wrap:wrap;justify-content:center}
#boot .acts.show{opacity:1}
.blink::after{content:'\2588';animation:blk .6s step-end infinite}
@keyframes blk{50%{opacity:0}}
#app{display:none;position:fixed;inset:0;border:6px solid var(--fg);flex-direction:column;background:var(--bg)}
#app.show{display:flex}
header{background:var(--panel);border-bottom:3px solid var(--fg);padding:10px 14px;text-align:center;font-size:15px;letter-spacing:2px;position:relative;overflow:hidden}
header::after{content:'v29.1 REAL ONLY  \2022  GROQ  \2022  QUE DU R\u00c9EL  \2022  STOP=ARR\u00caT';position:absolute;top:1px;left:0;font-size:11px;color:var(--muted);white-space:nowrap;animation:mq 28s linear infinite}
@keyframes mq{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
main{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;align-content:start;padding-bottom:50px}
footer{position:absolute;bottom:0;left:0;right:0;background:var(--panel);border-top:3px solid var(--fg);padding:6px 12px;font-size:13px;display:flex;justify-content:space-between}
.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;background:var(--panel);border:3px solid var(--fg)}
.bar .round{width:52px;height:52px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;padding:0}
.bar .round.rec-on{background:var(--red);border-color:var(--red);color:#fff;animation:pls 1.1s ease-out infinite}
@keyframes pls{0%{box-shadow:0 0 0 0 rgba(255,0,68,.5)}100%{box-shadow:0 0 0 14px rgba(255,0,68,0)}}
.timer{font-size:18px;min-width:80px;text-align:center}
.timer.on{color:var(--red);animation:blk 1s step-end infinite}
.sep{width:2px;height:28px;background:var(--muted)}
.live{grid-column:1/-1;background:var(--bg2);border:3px solid var(--fg);position:relative;min-height:80px}
.live .label{position:absolute;top:-10px;left:10px;background:var(--bg2);padding:0 7px;font-size:12px}
.live .badge{position:absolute;top:8px;right:10px;font-size:12px;padding:2px 7px;border:1px solid var(--muted);color:var(--muted)}
.live .badge.listen{color:var(--blue);border-color:var(--blue);animation:blk 1.2s step-end infinite}
.live .badge.rec{color:var(--red);border-color:var(--red);animation:blk .5s step-end infinite}
.live .badge.think{color:var(--orange);border-color:var(--orange)}
.live .badge.ok{color:var(--fg);border-color:var(--fg)}
.live .txt{padding:24px 12px 10px;font-size:18px;line-height:1.35;min-height:60px;word-break:break-word}
.live .txt.dim{color:var(--muted);font-size:14px}
.live .txt.red{color:var(--red)}
.live .txt.orange{color:var(--orange);font-size:15px}
.input-row{grid-column:1/-1;display:flex;background:var(--bg2);border:2px solid var(--dim)}
.input-row .pre{display:flex;align-items:center;padding:0 10px;color:var(--dim);font-size:18px;border-right:2px solid var(--dim)}
.input-row input{flex:1;background:transparent;border:none;color:var(--fg);padding:11px;font-size:16px;outline:none}
.input-row input::placeholder{color:var(--muted)}
.input-row button{border:none;border-left:2px solid var(--dim);background:rgba(0,255,65,.06);color:var(--fg);padding:0 14px;font-size:15px;cursor:pointer}
.panel{background:var(--panel);border:3px solid var(--fg);padding:12px;position:relative;min-height:100px}
.panel .label{position:absolute;top:-10px;left:10px;background:var(--panel);padding:0 7px;font-size:12px}
.panel.full{grid-column:1/-1}
canvas{display:block;width:100%;height:90px;background:var(--bg2);image-rendering:pixelated}
.out{background:var(--bg2);border:2px dashed var(--dim);padding:12px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow-y:auto;min-height:70px;color:var(--dim)}
.log{max-height:130px;overflow-y:auto;font-size:12px;background:var(--bg2);border:2px dashed var(--orange);padding:6px}
.log div{padding:2px 3px;border-left:3px solid transparent;margin:1px 0}
.log .ok{color:var(--dim);border-color:var(--muted)}
.log .err{color:var(--red);border-color:var(--red)}
.log .info{color:var(--orange);border-color:var(--orange)}
.sys{font-size:13px;line-height:1.55}
.stats{font-size:12px;color:var(--muted);margin-top:4px}
#ptt{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);width:110px;height:110px;border-radius:50%;font-size:13px;text-align:center;line-height:1.2;z-index:200;border-width:5px;display:none;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(0,255,65,.4)}
#ptt.show{display:flex}
#ptt:active{transform:translateX(-50%) scale(.93)}
#ptt.rec{background:var(--red);border-color:var(--red);color:#fff;animation:pls 1s ease-out infinite}
dialog{border:5px solid var(--fg);background:var(--bg);color:var(--fg);padding:0;max-width:620px;width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 0 30px rgba(0,255,65,.25)}
dialog::backdrop{background:rgba(0,0,0,.88)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:3px solid var(--fg);font-size:18px}
.db{padding:14px 16px}
.df{display:flex;gap:10px;justify-content:center;padding:12px;border-top:2px solid var(--muted);flex-wrap:wrap}
.fl{margin-bottom:13px}
.fl label{display:block;margin-bottom:5px;font-size:13px}
.fl input[type="text"],.fl select,.fl textarea{width:100%;padding:9px;background:var(--bg2);color:var(--fg);border:2px solid var(--dim);font-size:15px;outline:none}
.fl textarea{min-height:70px;resize:vertical}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--fg)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.check input{width:17px;height:17px;accent-color:var(--fg)}
.sec{font-size:15px;margin:16px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--muted)}
.range{display:flex;align-items:center;gap:8px}
.range input{flex:1;accent-color:var(--fg)}
.range span{min-width:42px;text-align:right;color:var(--orange)}
.cam-box{grid-column:1/-1;display:none;flex-direction:column;align-items:center;gap:8px;padding:8px;background:var(--bg2);border:3px solid var(--blue)}
.cam-box.show{display:flex}
video,.preview{max-width:100%;max-height:150px;border:2px solid var(--dim);background:#000;display:none}
.keys-list{max-height:100px;overflow-y:auto;font-size:13px;margin-top:6px}
.key-item{display:flex;justify-content:space-between;align-items:center;padding:7px;border:1px solid var(--muted);margin-bottom:5px;gap:8px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 24px;font-size:15px;border:2px solid var(--fg);background:var(--panel);color:var(--fg);z-index:99999;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:90vw}
.toast.show{opacity:1}
.toast.err{border-color:var(--red);color:var(--red)}
@media(max-width:600px){
  #boot h1{font-size:20px}
  .bar .round{width:44px;height:44px;font-size:9px}
  #ptt{width:100px;height:100px;font-size:12px;bottom:48px}
  dialog{width:98vw}
  main{grid-template-columns:1fr}
  .live .txt{font-size:15px}
}
</style>
</head>
<body>
<div class="scan"></div>
<div class="vig"></div>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <div class="dh">
    <span>PARAMÈTRES — GROQ</span>
    <button class="btn sm" id="x" type="button" style="border:none;box-shadow:none;font-size:22px">&times;</button>
  </div>
  <div class="db">
    <div class="sec">1. Clé API Groq</div>
    <div class="fl">
      <label>Clé Groq (gsk_...)</label>
      <textarea id="key" placeholder="Colle ta clé API Groq ici" spellcheck="false"></textarea>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn blue" id="paste" type="button" style="flex:1.5">COLLER</button>
      <button class="btn blue" id="test" type="button" style="flex:1">TESTER</button>
      <button class="btn" id="savekey" type="button" style="flex:1">SAUVER</button>
    </div>
    <div class="fl">
      <label>Clés sauvées</label>
      <div class="keys-list" id="keys-list"></div>
    </div>
    <div class="sec">2. Modèle</div>
    <div class="fl">
      <label>Modèle IA</label>
      <select id="model"></select>
      <button class="btn sm blue" id="refresh-models" type="button" style="margin-top:5px">RAFRAÎCHIR</button>
    </div>
    <div class="fl">
      <label>Température <span id="vtemp">0.25</span></label>
      <div class="range"><input type="range" id="temp" min="0.1" max="0.6" step="0.05" value="0.25"></div>
    </div>
    <div class="fl">
      <label>Max tokens <span id="vtokens">1800</span></label>
      <div class="range"><input type="range" id="tokens" min="500" max="3000" step="100" value="1800"></div>
    </div>
    <div class="sec">3. Écoute</div>
    <div class="fl">
      <label>Sensibilité <span id="vsens">8</span></label>
      <div class="range"><input type="range" id="sens" min="3" max="22" value="8"></div>
    </div>
    <div class="fl">
      <label>Silence fin (ms) <span id="vsil">700</span></label>
      <div class="range"><input type="range" id="sil" min="400" max="1500" step="25" value="700"></div>
    </div>
    <div class="fl">
      <label>Durée mini (ms) <span id="vmin">250</span></label>
      <div class="range"><input type="range" id="min" min="150" max="600" step="20" value="250"></div>
    </div>
    <div class="fl">
      <label>Durée max (s) <span id="vmax">50</span></label>
      <div class="range"><input type="range" id="max" min="15" max="90" value="50"></div>
    </div>
    <div class="fl">
      <label class="check"><input type="checkbox" id="always" checked> Toujours répondre</label>
    </div>
    <div class="fl">
      <label class="check"><input type="checkbox" id="noise" checked> Analyser les bruits</label>
    </div>
    <div class="fl">
      <label>Mots d'appel (virgules)</label>
      <input type="text" id="wake" value="supra,lab,assistant,hey,ok,écoute,dis,stop">
    </div>
    <div class="sec">4. Voix & Système</div>
    <div class="fl">
      <label class="check"><input type="checkbox" id="tts" checked> Synthèse vocale</label>
    </div>
    <div class="fl">
      <label>Vitesse <span id="vrate">0.93</span></label>
      <div class="range"><input type="range" id="rate" min="0.7" max="1.15" step="0.02" value="0.93"></div>
    </div>
    <div class="fl">
      <label>Langue</label>
      <select id="lang">
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
    </div>
    <div class="fl">
      <label>Couleur</label>
      <select id="col">
        <option value="#00ff41">Vert</option>
        <option value="#00ccff">Cyan</option>
        <option value="#ff6600">Orange</option>
        <option value="#aa00ff">Violet</option>
      </select>
    </div>
    <div class="fl">
      <label class="check"><input type="checkbox" id="wakelock" checked> Écran allumé</label>
    </div>
    <div class="fl">
      <label class="check"><input type="checkbox" id="debug"> Debug</label>
    </div>
  </div>
  <div class="df">
    <button class="btn" id="save" type="button">SAUVEGARDER</button>
    <button class="btn blue" id="exportcfg" type="button">EXPORT</button>
    <button class="btn red" id="rst" type="button">RESET</button>
  </div>
</dialog>

<section id="boot">
  <h1 class="blink" id="title"></h1>
  <p id="sub"></p>
  <div class="acts" id="acts">
    <button class="btn" id="go" type="button" style="font-size:20px;padding:12px 28px;border-width:4px">LANCER REAL ONLY</button>
    <button class="btn" id="cfg" type="button">PARAMÈTRES</button>
  </div>
</section>

<div id="app">
  <header>SUPRA LAB v29.1 — <span id="mode">REAL</span></header>
  <main>
    <div class="bar">
      <button class="btn round" id="rec" type="button">REC</button>
      <div class="timer" id="timer">00:00</div>
      <button class="btn round" id="stop" type="button" disabled>STOP</button>
      <button class="btn round" id="play" type="button">PLAY</button>
      <div class="sep"></div>
      <button class="btn round blue" id="auto" type="button">AUTO</button>
      <button class="btn round" id="comp" type="button">24/7</button>
      <button class="btn round" id="img" type="button">IMG</button>
      <button class="btn round" id="cam" type="button">CAM</button>
      <button class="btn round" id="sum" type="button">RÉSUMÉ</button>
      <button class="btn round" id="export" type="button">EXPORT</button>
      <button class="btn round red" id="clr" type="button">CLR</button>
      <button class="btn round red" id="mute" type="button">STOP</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <img id="preview" class="preview" alt="" hidden>
    <div class="cam-box" id="cambox">
      <video id="video" autoplay playsinline muted hidden></video>
      <div style="display:flex;gap:8px">
        <button class="btn sm blue" id="capture" type="button">CAPTURER</button>
        <button class="btn sm red" id="camstop" type="button">FERMER</button>
      </div>

    <div class="panel"><div class="label">SPECTRO</div><canvas id="c1"></canvas></div>
    <div class="panel"><div class="label">OSCILLO</div><canvas id="c2"></canvas></div>
    <div class="panel"><div class="label">VOLUME</div><canvas id="c3"></canvas></div>
    <div class="live">
      <div class="label">ÉCOUTE RÉELLE</div>
      <div class="badge" id="badge">PRÊT</div>
      <div class="txt dim" id="live">Real Only — que du réel, rien d'inventé</div>
    </div>
    <div class="input-row">
      <div class="pre">&gt;</div>
      <input id="txt" placeholder="Parle ou laisse un bruit..." autocomplete="off">
      <button type="button" id="send">ENVOYER</button>
    </div>
    <div class="panel full">
      <div class="label">INTERPRÉTATION RÉELLE</div>
      <div class="out" id="out">En attente...</div>
    </div>
    <div class="panel full">
      <div class="label">JOURNAL</div>
      <div class="log" id="log"></div>
    </div>
    <div class="panel">
      <div class="label">SYSTÈME</div>
      <div class="sys" id="sys">—</div>
      <div class="stats" id="stats">—</div>
    </div>
  </main>
  <footer>
    <span id="status">En attente...</span>
    <span>v29.1 Groq | <span id="clock">--:--:--</span></span>
  </footer>
</div>

<button class="btn" id="ptt" type="button">MAINTENIR<br>POUR PARLER</button>
<audio id="audio" hidden></audio>

<script>
(function(){
'use strict';

var DEFAULT={
  key:'',
  model:'llama-3.1-70b-versatile',
  lang:'fr',tts:true,color:'#00ff41',sens:8,silence:700,
  minSpeech:250,maxRecord:50,always:true,noise:true,
  wakeWords:'supra,lab,assistant,hey,ok,écoute,dis,stop',
  temp:0.25,maxTokens:1800,rate:0.93,wakelock:true,debug:false
};

var SYSTEM_PROMPT="Tu es SUPRA. Tu fais UNIQUEMENT des interprétations réelles, factuelles et strictement basées sur des faits observables.\n\nRÈGLES ABSOLUES :\n- Réponds UNIQUEMENT en texte brut. Aucun *, aucun markdown, aucune liste, aucun emoji.\n- Ne commence JAMAIS par \"Je vais\", \"Voici\", \"D'accord\", \"Mon analyse\", \"Il semble que\", ou toute phrase d'introduction.\n- Commence DIRECTEMENT par les faits concrets.\n- Tu n'inventes RIEN. Absolument RIEN. Pas d'entités, pas de présences, pas de phénomènes paranormaux, pas de spéculations, pas de métaphores.\n- Tu décris UNIQUEMENT ce qui est réaliste d'un point de vue physique et acoustique :\n  * Sons identifiables (voix humaines, animaux, objets, véhicules, électroménager, etc.)\n  * Environnements (intérieur/extérieur, matériaux, écho, etc.)\n  * Causes probables (vent, frottement, mécanique, etc.)\n- Si tu n'es pas sûr à 100%, dis clairement : \"Je ne peux pas déterminer avec certitude.\"\n- Utilise le tutoiement. Réponds en français. Sois ultra-concis, direct et factuel.\n- Si on dit \"stop\", \"arrête\", \"tais-toi\", \"silence\" → tu t'arrêtes IMMEDIATEMENT et tu ne réponds plus jusqu'à une nouvelle sollicitation.\n- Ne pose JAMAIS de questions. Ne fais JAMAIS de suggestions. Ne propose JAMAIS d'actions.";

var STOP_WORDS=['stop','arrête','arrete','tais-toi','taistoi','silence','shut up','enough','basta','ça suffit','assez'];

var GROQ_BASE='https://api.groq.com/openai/v1';

var DEFAULT_MODELS=[
  {id:'llama-3.1-70b-versatile',label:'Llama 3.1 70B'},
  {id:'llama-3.1-8b-instant',label:'Llama 3.1 8B'},
  {id:'mixtral-8x7b-32768',label:'Mixtral 8x7B'},
  {id:'gemma2-9b-it',label:'Gemma2 9B'}
];

var cfg=Object.assign({},DEFAULT);
var st={
  ready:false,ctx:null,an:null,volNode:null,stream:null,
  fdata:null,wdata:null,vdata:null,
  rec:false,mr:null,chunks:[],t0:0,iv:null,
  ptt:false,pmr:null,pchunks:[],piv:null,psec:0,
  auto:false,run:false,comp:false,
  hist:[],mem:'',img:null,cam:null,camOn:false,
  ctrl:null,reqs:0,lat:0,tokens:0,
  savedKeys:[],lastVol:0,noiseCount:0,
  modelCache:null,wakeLock:null,muted:false,caps:[],
  currentUtterance:null
};

function $(s){return document.querySelector(s)}
function $$(s){return document.querySelectorAll(s)}
function now(){return new Date().toLocaleTimeString('fr-FR')}
function pad(n){return n<10?'0'+n:''+n}
function fmt(s){return pad(Math.floor(s/60))+':'+pad(s%60)}
function clean(k){return String(k||'').replace(/[\u200B-\u200D\uFEFF\u00A0\s]/g,'').trim()}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function validKey(key){return typeof key==='string'&&key.startsWith('gsk_')&&key.length>30}

function isStop(text){
  var t=(text||'').toLowerCase().trim();
  for(var i=0;i<STOP_WORDS.length;i++){
    var w=STOP_WORDS[i];
    if(t===w||t.startsWith(w+' ')||t.endsWith(' '+w)||t.indexOf(' '+w+' ')!==-1)return true;
  }return false;
}

function isWakeWord(text){
  var t=(text||'').toLowerCase().trim();
  var words=(cfg.wakeWords||'').toLowerCase().split(',').map(function(w){return w.trim()}).filter(Boolean);
  for(var i=0;i<words.length;i++){
    var w=words[i];
    if(t===w||t.startsWith(w+' ')||t.endsWith(' '+w)||t.indexOf(' '+w+' ')!==-1)return true;
  }return false;
}

function toast(msg,type){
  type=type||'ok';
  var el=$('#toast');if(!el)return;
  el.textContent=msg;el.className='toast '+type+' show';
  clearTimeout(el._tid);el._tid=setTimeout(function(){el.classList.remove('show')},2800);
}

function log(m,t){
  t=t||'ok';var el=$('#log');if(!el)return;
  var d=document.createElement('div');d.className=t;
  d.textContent='['+now()+'] '+m;
  el.appendChild(d);el.scrollTop=el.scrollHeight;
  while(el.children.length>150)el.firstChild.remove();
  if(cfg.debug)console.log('[SUPRA]',m);
}

function status(t){var el=$('#status');if(el)el.textContent=t}

function sys(){
  function ok(v){return'<span style="color:var(--fg)">'+v+'</span>'}
  function ko(v){return'<span style="color:var(--red)">'+v+'</span>'}
  function wa(v){return'<span style="color:var(--orange)">'+v+'</span>'}
  var el=$('#sys');
  if(el){
    el.innerHTML='Micro '+(st.stream?ok('OK'):ko('OFF'))+
      ' &middot; Groq '+(validKey(cfg.key)?ok('OK'):ko('—'))+
      ' &middot; Mode '+(st.comp?wa('24/7'):st.auto?wa('AUTO'):ok('PTT'))+
      '<br>Bruit '+(cfg.noise?'ON':'off')+' &middot; Real Only'+
      (st.muted?' &middot; '+ko('MUET'):'');
  }
  var s=$('#stats');
  if(s)s.textContent='\u2248'+st.tokens+' tok \u00b7 '+(st.lat||'—')+'ms \u00b7 '+st.reqs+' req \u00b7 bruits:'+st.noiseCount;
}

function live(txt,mode){
  var t=$('#live'),b=$('#badge');if(!t||!b)return;
  t.className='txt';b.className='badge';
  if(mode==='idle'){t.classList.add('dim');t.textContent=txt;b.textContent='PRÊT'}
  else if(mode==='listen'){t.classList.add('dim');t.textContent=txt;b.textContent='ÉCOUTE';b.classList.add('listen')}
  else if(mode==='rec'){t.classList.add('red');t.textContent=txt;b.textContent='REC';b.classList.add('rec')}
  else if(mode==='think'){t.classList.add('orange');t.textContent=txt;b.textContent='ANALYSE';b.classList.add('think')}
  else if(mode==='ok'){t.textContent=txt;b.textContent='OK';b.classList.add('ok')}
}

function typeEl(el,str,speed){
  speed=speed||35;
  return new Promise(function(res){
    var i=0;el.textContent='';
    var iv=setInterval(function(){
      if(i<str.length){el.textContent+=str[i++]}
      else{clearInterval(iv);res()}
    },speed);
  });
}

function loadKeys(){
  try{st.savedKeys=JSON.parse(localStorage.getItem('sl29_keys')||'[]')}
  catch(e){st.savedKeys=[]}
  renderKeys();
}

function saveKeysToStorage(){localStorage.setItem('sl29_keys',JSON.stringify(st.savedKeys));renderKeys()}

function renderKeys(){
  var list=$('#keys-list');if(!list)return;
  if(!st.savedKeys.length){list.innerHTML='<div style="padding:8px;color:var(--muted)">Aucune</div>';return}
  list.innerHTML='';
  st.savedKeys.forEach(function(k,i){
    var div=document.createElement('div');div.className='key-item';
    div.innerHTML='<div style="flex:1;min-width:0"><div>'+(k.name||'Clé')+'</div><div style="font-size:11px;color:var(--muted)">'+k.key.slice(0,16)+'...</div></div>'+
      '<button class="btn sm blue" data-i="'+i+'" data-a="use" type="button">USE</button>'+
      '<button class="btn sm red" data-i="'+i+'" data-a="del" type="button">DEL</button>';
    div.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click',function(){
        var idx=parseInt(btn.dataset.i,10);
        if(btn.dataset.a==='use'){
          cfg.key=st.savedKeys[idx].key;applyToUI();
          localStorage.setItem('sl29',JSON.stringify(cfg));
          log('Clé chargée');toast('Clé chargée');
        }else{st.savedKeys.splice(idx,1);saveKeysToStorage()}
      });
    });
    list.appendChild(div);
  });
}

function load(){
  try{Object.assign(cfg,JSON.parse(localStorage.getItem('sl29')||'{}'))}
  catch(e){}
  loadKeys();applyToUI();updateModelSelect();
}

function applyToUI(){
  var c=cfg.color;
  var r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
  var root=document.documentElement.style;
  root.setProperty('--fg',c);root.setProperty('--dim',c+'99');
  root.setProperty('--muted',c+'55');
  root.setProperty('--glow','0 0 10px rgba('+r+','+g+','+b+',.35)');
  function sv(id,v){var e=$('#'+id);if(e)e.value=v}
  function sc(id,v){var e=$('#'+id);if(e)e.checked=v}
  sv('key',cfg.key||'');sv('lang',cfg.lang);sv('col',cfg.color);sv('wake',cfg.wakeWords);
  sc('tts',cfg.tts);sc('wakelock',cfg.wakelock);sc('debug',cfg.debug);
  sc('always',cfg.always);sc('noise',cfg.noise);
  [['sens','vsens',cfg.sens],['sil','vsil',cfg.silence],['min','vmin',cfg.minSpeech],
   ['max','vmax',cfg.maxRecord],['temp','vtemp',cfg.temp],['tokens','vtokens',cfg.maxTokens],
   ['rate','vrate',cfg.rate]].forEach(function(a){
    sv(a[0],a[2]);var e=$('#'+a[1]);if(e)e.textContent=a[2];
  });
  sys();
}

function saveCfg(){
  cfg.key=clean($('#key').value);cfg.model=$('#model').value;
  cfg.lang=$('#lang').value;cfg.tts=$('#tts').checked;
  cfg.color=$('#col').value;cfg.sens=+$('#sens').value;
  cfg.silence=+$('#sil').value;cfg.minSpeech=+$('#min').value;
  cfg.maxRecord=+$('#max').value;cfg.always=$('#always').checked;
  cfg.noise=$('#noise').checked;cfg.wakeWords=$('#wake').value.trim();
  cfg.temp=+$('#temp').value;cfg.maxTokens=+$('#tokens').value;
  cfg.rate=+$('#rate').value;cfg.wakelock=$('#wakelock').checked;
  cfg.debug=$('#debug').checked;
  localStorage.setItem('sl29',JSON.stringify(cfg));
  applyToUI();log('Sauvegardé');toast('Sauvegardé');
}

function updateModelSelect(){
  var sel=$('#model');if(!sel)return;sel.innerHTML='';
  var models=st.modelCache||DEFAULT_MODELS;
  var found=false;
  models.forEach(function(m){
    var opt=document.createElement('option');opt.value=m.id;
    opt.textContent=m.label||m.id;
    if(m.id===cfg.model){opt.selected=true;found=true}
    sel.appendChild(opt);
  });
  if(!found&&models.length){cfg.model=models[0].id;sel.value=cfg.model}
}

function fetchModels(){
  if(!validKey(cfg.key)){toast('Clé invalide','err');return}
  log('Récupération modèles Groq...','info');
  var btn=$('#refresh-models');
  if(btn){btn.disabled=true;btn.textContent='...'}
  fetch(GROQ_BASE+'/models',{headers:{'Authorization':'Bearer '+cfg.key}})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(function(data){
    var models=data.data
      .filter(function(m){return m.id.indexOf('llama')!==-1||m.id.indexOf('mixtral')!==-1||m.id.indexOf('gemma')!==-1})
      .map(function(m){return{id:m.id,label:m.id}});
    if(!models.length)models=DEFAULT_MODELS;
    st.modelCache=models;updateModelSelect();
    log(models.length+' modèles trouvés');toast(models.length+' modèles');
  })
  .catch(function(e){log('Erreur: '+e.message,'err');toast('Erreur','err');updateModelSelect()})
  .finally(function(){if(btn){btn.disabled=false;btn.textContent='RAFRAÎCHIR'}});
}

function testKey(){
  var key=clean($('#key').value);
  if(!key){toast('Colle une clé','err');return}
  log('Test clé...','info');
  var btn=$('#test');if(btn){btn.disabled=true;btn.textContent='...'}
  fetch(GROQ_BASE+'/models',{headers:{'Authorization':'Bearer '+key}})
  .then(function(r){
    if(r.ok){log('Clé valide');toast('Clé valide')}
    else{log('Clé invalide','err');toast('Clé invalide','err')}
  })
  .catch(function(e){log('Erreur: '+e.message,'err');toast('Erreur réseau','err')})
  .finally(function(){if(btn){btn.disabled=false;btn.textContent='TESTER'}});
}

/* ====== AUDIO — même ordre que l'original ====== */
function initAudio(){
  try {
    st.ctx = new (window.AudioContext || window.webkitAudioContext)();
    var p = st.ctx.resume().then(function(){
      return navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
    }).then(function(stream){
      st.stream = stream;
      var src = st.ctx.createMediaStreamSource(stream);
      st.an = st.ctx.createAnalyser();
      st.an.fftSize = 2048;
      st.an.smoothingTimeConstant = 0.78;
      src.connect(st.an);
      st.fdata = new Uint8Array(st.an.frequencyBinCount);
      st.wdata = new Uint8Array(st.an.frequencyBinCount);
      st.volNode = st.ctx.createAnalyser();
      st.volNode.fftSize = 256;
      src.connect(st.volNode);
      st.vdata = new Uint8Array(st.volNode.frequencyBinCount);
      st.ready = true;
      sizeCanvases();
      drawLoop();
      sys();
      log('Audio OK');
      return true;
    });
    return p;
  } catch(e) {
    log('Audio: ' + e.message, 'err');
    toast('Audio: ' + e.message, 'err');
    return Promise.resolve(false);
  }
}

function vol(){
  if(!st.volNode||!st.vdata)return 0;
  st.volNode.getByteFrequencyData(st.vdata);
  var s=0;for(var i=0;i<st.vdata.length;i++)s+=st.vdata[i];
  return s/st.vdata.length;
}

function drawLoop(){
  if(!st.ready)return;requestAnimationFrame(drawLoop);
  if(!st.an||!st.fdata||!st.wdata)return;
  st.an.getByteFrequencyData(st.fdata);st.an.getByteTimeDomainData(st.wdata);
  st.volNode.getByteFrequencyData(st.vdata);
  drawSpectro();drawOscillo();drawVolume();
}

function drawSpectro(){
  var c=$('#c1');if(!c)return;
  var x=c.getContext('2d'),w=c.width,h=c.height;
  x.fillStyle='#020402';x.fillRect(0,0,w,h);
  var n=st.fdata.length,bw=Math.max(1,w/n);
  for(var i=0;i<n;i++){
    var v=st.fdata[i];if(v<3)continue;
    var bh=Math.log10(v+1)*18;
    x.fillStyle='hsl('+Math.max(0,110-v*0.4)+',100%,'+Math.max(15,v*0.3)+'%)';
    x.fillRect(i*bw,h-bh,bw+0.3,bh);
  }
}

function drawOscillo(){
  var c=$('#c2');if(!c)return;
  var x=c.getContext('2d'),w=c.width,h=c.height;
  x.fillStyle='#020402';x.fillRect(0,0,w,h);
  var col=getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
  x.strokeStyle=col;x.lineWidth=1.5;x.beginPath();
  var step=w/st.wdata.length;
  for(var i=0;i<st.wdata.length;i++){
    var y=(st.wdata[i]/128-0.5)*h*0.75+h/2;
    i?x.lineTo(i*step,y):x.moveTo(0,y);
  }x.stroke();
}

function drawVolume(){
  var c=$('#c3');if(!c)return;
  var x=c.getContext('2d'),w=c.width,h=c.height;
  x.fillStyle='#020402';x.fillRect(0,0,w,h);
  var s=0;for(var i=0;i<st.vdata.length;i++)s+=st.vdata[i];
  var p=s/st.vdata.length/255;
  var bw=w*0.38,bh=Math.max(2,p*h*0.8);
  x.fillStyle='hsl('+Math.max(0,120-p*160)+',100%,40%)';
  x.fillRect((w-bw)/2,h-bh,bw,bh);
  x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
  x.font='16px VT323';x.textAlign='center';x.textBaseline='middle';
  x.fillText(Math.round(p*100)+'%',w/2,h/2);
}

function sizeCanvases(){
  document.querySelectorAll('canvas').forEach(function(c){
    var r=c.parentElement.getBoundingClientRect();
    c.width=Math.max(60,r.width-24);c.height=90;
  });
}

function getMime(){
  var m=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
  for(var i=0;i<m.length;i++){if(MediaRecorder.isTypeSupported(m[i]))return m[i]}
  return'';
}

function startRec(){
  if(st.rec||!st.stream)return;
  var m=getMime();if(!m){log('Format non supporté','err');return}
  st.rec=true;st.chunks=[];st.t0=Date.now();
  try{st.mr=new MediaRecorder(st.stream,{mimeType:m})}catch(e){st.rec=false;return}
  st.mr.ondataavailable=function(e){if(e.data&&e.data.size)st.chunks.push(e.data)};
  st.mr.onstop=function(){
    var blob=new Blob(st.chunks,{type:st.mr.mimeType});
    var url=URL.createObjectURL(blob);
    st.caps.unshift({url:url,blob:blob,dur:Math.floor((Date.now()-st.t0)/1000)});
    while(st.caps.length>10)URL.revokeObjectURL(st.caps.pop().url);
    status('Enregistré');
  };
  st.mr.start(200);
  $('#rec').classList.add('rec-on');$('#stop').disabled=false;
  $('#timer').classList.add('on');status('REC...');
  var s=0;$('#timer').textContent='00:00';
  st.iv=setInterval(function(){s++;$('#timer').textContent=fmt(s)},1000);
}

function stopRec(){
  if(!st.rec)return;st.rec=false;
  if(st.mr&&st.mr.state==='recording')st.mr.stop();
  $('#rec').classList.remove('rec-on');$('#stop').disabled=true;
  $('#timer').classList.remove('on');clearInterval(st.iv);$('#timer').textContent='00:00';
}

function playLastRec(){
  if(!st.caps.length){toast('Aucun enregistrement','err');return}
  var audio=$('#audio');if(!audio)return;
  audio.src=st.caps[0].url;audio.play().catch(function(e){log('Lecture: '+e.message,'err')});
  log('Lecture dernier enregistrement');
}

function pttDown(e){
  e.preventDefault();if(!st.ready||st.auto||st.ptt)return;
  st.ptt=true;st.pchunks=[];st.psec=0;
  var m=getMime();if(!m){st.ptt=false;return}
  try{st.pmr=new MediaRecorder(st.stream,{mimeType:m})}catch(e){st.ptt=false;return}
  st.pmr.ondataavailable=function(e){if(e.data&&e.data.size)st.pchunks.push(e.data)};
  st.pmr.onstop=pttDone;st.pmr.start(150);
  $('#ptt').classList.add('rec');$('#ptt').innerHTML='REC...<br><small>relâche</small>';
  st.piv=setInterval(function(){st.psec++;live('Enregistrement '+fmt(st.psec),'rec')},1000);
  live('Enregistrement 00:00','rec');
}

function pttUp(e){
  e.preventDefault();if(!st.ptt)return;st.ptt=false;
  clearInterval(st.piv);$('#ptt').classList.remove('rec');
  $('#ptt').innerHTML='MAINTENIR<br>POUR PARLER';
  setTimeout(function(){if(st.pmr&&st.pmr.state==='recording')st.pmr.stop()},220);
}

function pttDone(){
  var blob=new Blob(st.pchunks,{type:(st.pmr?st.pmr.mimeType:'')||getMime()});
  if(blob.size<500){live('Trop court','idle');return}
  live('Transcription...','think');
  whisper(blob).then(function(text){
    if(!text){live('Rien compris','idle');return}
    if(isStop(text)){stopAll();return}
    live(text,'ok');chat(text);
  });
}

function waitSpeak(){
  return new Promise(function(res){
    var t0=0;
    function check(){
      if(!st.auto)return res(false);
      var v=vol();
      if(v>=cfg.sens){if(!t0)t0=Date.now();if(Date.now()-t0>=cfg.minSpeech)return res(true)}
      else{t0=0}
      requestAnimationFrame(check);
    }
    requestAnimationFrame(check);
  });
}

function recUntilSilent(){
  return new Promise(function(res){
    var chunks=[],m=getMime();
    if(!m)return res(null);
    var rec;try{rec=new MediaRecorder(st.stream,{mimeType:m})}catch(e){return res(null)}
    rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    rec.onstop=function(){res(new Blob(chunks,{type:rec.mimeType}))};
    var start=Date.now(),last=Date.now(),spoken=false,max=cfg.maxRecord*1000;
    var iv=setInterval(function(){
      if(!st.auto){clearInterval(iv);if(rec.state==='recording')rec.stop();return}
      var v=vol();
      if(v>=cfg.sens*0.38){last=Date.now();spoken=true;st.lastVol=v}
      if(spoken&&(Date.now()-last>=cfg.silence||Date.now()-start>=max)){
        clearInterval(iv);if(rec.state==='recording')rec.stop();
      }
    },30);
    rec.start(35);
    setTimeout(function(){if(rec.state==='recording')rec.stop()},max+500);
  });
}

function autoStart(comp){
  if(st.run)return;
  st.auto=true;st.run=true;st.comp=!!comp;
  $('#auto').classList.toggle('on',!comp);$('#comp').classList.toggle('on',!!comp);
  var modeEl=$('#mode');if(modeEl)modeEl.textContent=comp?'24/7':'AUTO';
  live(comp?'24/7 Real actif':'Écoute réelle...','listen');
  status(comp?'24/7':'AUTO');sys();
  log(comp?'Mode 24/7':'Mode AUTO','info');
  (function loop(){
    if(!st.auto)return;
    if(document.hidden){setTimeout(loop,300);return}
    waitSpeak().then(function(speak){
      if(!st.auto||!speak)return;
      live('Écoute...','rec');
      return recUntilSilent();
    }).then(function(blob){
      if(!st.auto||!blob||blob.size<500){live('En écoute...','listen');if(st.auto)setTimeout(loop,50);return}
      var volLevel=Math.round(st.lastVol);
      live('Analyse...','think');
      return whisper(blob).then(function(text){
        if(!st.auto)return;
        if(!text){
          if(cfg.noise&&volLevel>5){
            st.noiseCount++;
            var prompt='Bruit détecté. Volume approximatif '+volLevel+'. Aucune parole claire. Décris UNIQUEMENT ce que ce son est probablement. N\'invente RIEN.';
            live('Bruit → interprétation...','think');
            return chat(prompt,true).then(function(){live('En écoute...','listen');if(st.auto)setTimeout(loop,150)});
          }
          live('En écoute...','listen');if(st.auto)setTimeout(loop,50);return;
        }
        if(isStop(text)){stopAll();live('Stop — pause','idle');log('Stop vocal','info');return}
        if(!cfg.always&&!isWakeWord(text)){live('En écoute...','listen');if(st.auto)setTimeout(loop,50);return}
        live(text,'ok');
        return chat(text,true).then(function(){live('En écoute...','listen');if(st.auto)setTimeout(loop,150)});
      });
    }).catch(function(e){log('Auto: '+e.message,'err');if(st.auto)setTimeout(loop,400)});
  })();
  var checkRun=setInterval(function(){
    if(!st.auto){
      clearInterval(checkRun);st.run=false;st.comp=false;
      $('#auto').classList.remove('on');$('#comp').classList.remove('on');
      var modeEl=$('#mode');if(modeEl)modeEl.textContent='REAL';
      live('Arrêté','idle');status('Prêt');sys();
    }
  },200);
}

function autoStop(){
  st.auto=false;st.comp=false;
  $('#auto').classList.remove('on');$('#comp').classList.remove('on');
  var modeEl=$('#mode');if(modeEl)modeEl.textContent='REAL';
  live('Arrêté','idle');status('Prêt');sys();
}

function stopAll(){
  stopRec();autoStop();
  if(st.ctrl){try{st.ctrl.abort()}catch(e){}st.ctrl=null}
  stopTTS();live('Arrêt complet','idle');status('Arrêté');sys();
}

function whisper(blob){
  var ext='webm';
  if(blob.type.indexOf('ogg')!==-1)ext='ogg';
  else if(blob.type.indexOf('mp4')!==-1)ext='m4a';
  var t0=performance.now();
  var fd=new FormData();
  fd.append('file',blob,'audio.'+ext);
  fd.append('model','whisper-large-v3-turbo');
  fd.append('language',cfg.lang);
  fd.append('response_format','json');
  return fetch(GROQ_BASE+'/audio/transcriptions',{
    method:'POST',
    headers:{'Authorization':'Bearer '+cfg.key},
    body:fd
  }).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error(t.slice(0,100))});
    return r.json();
  }).then(function(d){
    st.lat=Math.round(performance.now()-t0);st.reqs++;sys();
    var text=(d.text||'').trim();
    if(text)log('\u2192 '+text);
    return text||null;
  }).catch(function(e){
    log('Whisper: '+e.message,'err');
    return speechRecognition();
  });
}

function speechRecognition(){
  return new Promise(function(resolve){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){log('Reconnaissance vocale non disponible','err');resolve(null);return}
    var rec=new SR();
    rec.lang=cfg.lang==='fr'?'fr-FR':cfg.lang==='es'?'es-ES':'en-US';
    rec.interimResults=false;rec.maxAlternatives=1;rec.continuous=false;
    var done=false;
    function finish(r){if(done)return;done=true;try{rec.abort()}catch(e){}resolve(r)}
    rec.onresult=function(e){
      var text=(e.results[0]&&e.results[0][0].transcript||'').trim();
      if(text)log('\u2192 [nav] '+text);finish(text||null);
    };
    rec.onerror=function(e){log('Reconnaissance: '+e.error,'err');finish(null)};
    rec.onend=function(){finish(null)};
    setTimeout(function(){finish(null)},8000);
    try{rec.start()}catch(e){log('Reconnaissance: '+e.message,'err');finish(null)}
  });
}

function chat(text,fromAuto){
  if(!validKey(cfg.key)){
    var outEl=$('#out');if(outEl)outEl.textContent='Clé Groq invalide. Ouvre les paramètres.';
    toast('Clé Groq invalide','err');return Promise.resolve();
  }
  if(fromAuto&&!cfg.always&&!isWakeWord(text)&&text.indexOf('Bruit détecté')!==0){
    live('Pas pour moi','listen');return Promise.resolve();
  }
  if(st.ctrl){try{st.ctrl.abort()}catch(e){}}
  st.ctrl=new AbortController();
  live('Interprétation réelle...','think');
  var outEl=$('#out');if(outEl)outEl.textContent='';
  status('Analyse...');
  var system=SYSTEM_PROMPT;
  if(st.comp)system+='\nMode compagnon permanent.';
  if(st.mem)system+='\n\nMémoire:\n'+st.mem;
  var userContent=st.img
    ?[{type:'text',text:text},{type:'image_url',image_url:{url:st.img}}]
    :text;
  st.hist.push({role:'user',content:userContent});
  if(st.hist.length>20)summarize();
  var messages=[{role:'system',content:system}].concat(st.hist);
  var t0=performance.now();
  return fetch(GROQ_BASE+'/chat/completions',{
    method:'POST',signal:st.ctrl.signal,
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
    body:JSON.stringify({model:cfg.model,messages:messages,temperature:cfg.temp,max_tokens:cfg.maxTokens,stream:true})
  }).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error('HTTP '+r.status+': '+t.slice(0,200))});
    var reader=r.body.getReader();
    var decoder=new TextDecoder();
    var full='',buffer='';
    function pump(){
      return reader.read().then(function(result){
        if(result.done){
          st.lat=Math.round(performance.now()-t0);st.reqs++;
          st.hist.push({role:'assistant',content:full});sys();
          if(full){
            live(full.slice(0,120)+(full.length>120?'...':''),'ok');
            if(cfg.tts&&!st.muted)speak(full);
          }else{live('Pas de réponse','idle')}
          st.img=null;
          var preview=$('#preview');if(preview){preview.hidden=true;preview.src='';preview.style.display='none'}
          return;
        }
        buffer+=decoder.decode(result.value,{stream:true});
        var lines=buffer.split('\n');buffer=lines.pop()||'';
        for(var i=0;i<lines.length;i++){
          var trimmed=lines[i].trim();
          if(!trimmed||trimmed.indexOf('data: ')!==0)continue;
          var data=trimmed.slice(6);if(data==='[DONE]')continue;
          try{
            var json=JSON.parse(data);
            var delta=json.choices&&json.choices[0]&&json.choices[0].delta;
            if(delta&&delta.content){full+=delta.content;if(outEl)outEl.textContent=full;st.tokens++}
          }catch(e){}
        }
        return pump();
      });
    }
    return pump();
  }).catch(function(e){
    if(e.name!=='AbortError'){
      log('Chat: '+e.message,'err');
      if(outEl)outEl.textContent='Erreur: '+e.message;
      toast('Erreur Groq','err');
    }else{log('Requête annulée','info')}
    live('Erreur','idle');status('Erreur');
  });
}

function summarize(){
  if(st.hist.length<=6)return Promise.resolve();
  if(!validKey(cfg.key)){st.hist=st.hist.slice(-8);return Promise.resolve()}
  var old=st.hist.slice(0,-4);
  var prompt='Résume en 3 phrases maximum les échanges suivants, en gardant les faits importants. Texte brut.\n\n'+
    old.map(function(m){return m.role+': '+(typeof m.content==='string'?m.content:'[image]')}).join('\n');
  return fetch(GROQ_BASE+'/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
    body:JSON.stringify({model:cfg.model,messages:[{role:'user',content:prompt}],temperature:0.2,max_tokens:300,stream:false})
  }).then(function(r){return r.json()}).then(function(d){
    var summary=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'';
    if(summary){st.mem=summary;st.hist=st.hist.slice(-4);log('Historique résumé','info')}
  }).catch(function(){st.hist=st.hist.slice(-8)});
}

function speak(text){
  if(!window.speechSynthesis)return;
  stopTTS();
  var u=new SpeechSynthesisUtterance(text);
  u.lang=cfg.lang==='fr'?'fr-FR':cfg.lang==='es'?'es-ES':'en-US';
  u.rate=cfg.rate;u.volume=1;
  var voices=speechSynthesis.getVoices();
  var prefix=u.lang.split('-')[0];
  var match=voices.find(function(v){return v.lang.indexOf(prefix)===0})||null;
  if(match)u.voice=match;
  u.onend=function(){st.currentUtterance=null};
  u.onerror=function(){st.currentUtterance=null};
  st.currentUtterance=u;speechSynthesis.speak(u);
}

function stopTTS(){
  if(window.speechSynthesis)speechSynthesis.cancel();
  st.currentUtterance=null;
}

function handleImage(file){
  if(!file||file.type.indexOf('image/')!==0){toast('Image requise','err');return}
  var reader=new FileReader();
  reader.onload=function(e){
    st.img=e.target.result;
    var preview=$('#preview');
    if(preview){preview.src=st.img;preview.hidden=false;preview.style.display='block'}
    log('Image chargée ('+Math.round(file.size/1024)+' Ko)');
    toast('Image chargée, envoie un message');
    live('Image chargée — envoie un message','ok');
  };
  reader.readAsDataURL(file);
}

function openCam(){
  navigator.mediaDevices.getUserMedia({
    video:{facingMode:'environment',width:{ideal:640},height:{ideal:480}}
  }).then(function(stream){
    st.cam=stream;st.camOn=true;
    var video=$('#video');
    if(video){video.srcObject=stream;video.hidden=false;video.style.display='block'}
    var box=$('#cambox');if(box)box.classList.add('show');
    log('Caméra ouverte');
  }).catch(function(e){log('Caméra: '+e.message,'err');toast('Caméra inaccessible','err')});
}

function closeCam(){
  if(st.cam){st.cam.getTracks().forEach(function(t){t.stop()});st.cam=null}
  st.camOn=false;
  var video=$('#video');if(video){video.hidden=true;video.style.display='none';video.srcObject=null}
  var box=$('#cambox');if(box)box.classList.remove('show');
  log('Caméra fermée');
}

function captureCam(){
  var video=$('#video');if(!video||!st.camOn)return;
  var canvas=document.createElement('canvas');
  canvas.width=video.videoWidth||640;canvas.height=video.videoHeight||480;
  canvas.getContext('2d').drawImage(video,0,0);
  st.img=canvas.toDataURL('image/jpeg',0.8);
  var preview=$('#preview');
  if(preview){preview.src=st.img;preview.hidden=false;preview.style.display='block'}
  log('Capture effectuée');toast('Capture effectuée, envoie un message');
  live('Capture caméra — envoie un message','ok');
}

function requestWakeLock(){
  if(!cfg.wakelock)return;
  if('wakeLock' in navigator){
    navigator.wakeLock.request('screen').then(function(lock){
      st.wakeLock=lock;lock.addEventListener('release',function(){st.wakeLock=null});
      log('WakeLock acquis');
    }).catch(function(){});
  }
}

function releaseWakeLock(){if(st.wakeLock){st.wakeLock.release();st.wakeLock=null}}

document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&cfg.wakelock&&st.ready)requestWakeLock();
});

function exportConversation(){
  if(!st.hist.length){toast('Aucune conversation','err');return}
  var lines=st.hist.map(function(m){
    var c=typeof m.content==='string'?m.content:'[image]';
    return(m.role==='user'?'>>> ':'<<< ')+c;
  });
  if(st.mem)lines.unshift('--- MÉMOIRE ---',st.mem,'---');
  var blob=new Blob([lines.join('\n\n')],{type:'text/plain;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;
  a.download='supra-'+new Date().toISOString().slice(0,10)+'.txt';
  a.click();URL.revokeObjectURL(url);log('Exporté');toast('Exporté');
}

function exportConfig(){
  var blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='supra-config.json';
  a.click();URL.revokeObjectURL(url);toast('Config exportée');
}

function bootSequence(){
  var title=$('#title'),sub=$('#sub'),acts=$('#acts');
  if(!title)return Promise.resolve();
  return typeEl(title,'SUPRA LAB',35).then(function(){return sleep(400)})
  .then(function(){return typeEl(title,'SUPRA LAB v29.1',35)}).then(function(){return sleep(300)})
  .then(function(){return typeEl(title,'SUPRA LAB v29.1 — REAL ONLY',35)}).then(function(){return sleep(200)})
  .then(function(){
    title.classList.remove('blink');
    if(sub){sub.textContent='Groq \u2022 Whisper + Llama 3.1 70B \u2022 Gratuit';sub.classList.add('show')}
    return sleep(600);
  }).then(function(){
    if(sub)sub.textContent='Que du réel, rien d\'inventé \u2022 Prêt';
    return sleep(400);
  }).then(function(){if(acts)acts.classList.add('show')});
}

/* ====== LANCEMENT — même logique que l'original ====== */
function launchApp(){
  var bootEl=$('#boot');
  var appEl=$('#app');
  initAudio().then(function(ok){
    if(!ok){
      toast('Micro requis — vérifie les permissions Chrome','err');
      return;
    }
    requestWakeLock();
    if(bootEl)bootEl.style.display='none';
    if(appEl)appEl.classList.add('show');
    setTimeout(sizeCanvases,50);
    if('ontouchstart' in window){
      var ptt=$('#ptt');if(ptt)ptt.classList.add('show');
    }
    live('Prêt — parle ou active AUTO','idle');
    status('Prêt');
    sys();
    log('Application lancée','ok');
  }).catch(function(e){
    log('Erreur lancement: '+e.message,'err');
    toast('Erreur: '+e.message,'err');
  });
}

function tickClock(){var el=$('#clock');if(el)el.textContent=now()}

function bindEvents(){
  var goBtn=$('#go');if(goBtn)goBtn.addEventListener('click',launchApp);
  var cfgBtn=$('#cfg');if(cfgBtn)cfgBtn.addEventListener('click',function(){var d=$('#dlg');if(d)d.showModal()});
  var xBtn=$('#x');if(xBtn)xBtn.addEventListener('click',function(){var d=$('#dlg');if(d)d.close()});
  var pasteBtn=$('#paste');
  if(pasteBtn)pasteBtn.addEventListener('click',function(){
    navigator.clipboard.readText().then(function(t){$('#key').value=t;toast('Collé')}).catch(function(){toast('Presse-papiers refusé','err')});
  });
  var testBtn=$('#test');if(testBtn)testBtn.addEventListener('click',testKey);
  var savekeyBtn=$('#savekey');
  if(savekeyBtn)savekeyBtn.addEventListener('click',function(){
    var key=clean($('#key').value);
    if(!validKey(key)){toast('Clé invalide (gsk_...)','err');return}
    if(!st.savedKeys.some(function(k){return k.key===key})){
      st.savedKeys.push({name:'Groq '+(st.savedKeys.length+1),key:key});
      saveKeysToStorage();toast('Clé sauvée');
    }else{toast('Déjà sauvée')}
  });
  var refreshBtn=$('#refresh-models');if(refreshBtn)refreshBtn.addEventListener('click',fetchModels);
  var saveBtn=$('#save');if(saveBtn)saveBtn.addEventListener('click',saveCfg);
  var exportcfgBtn=$('#exportcfg');if(exportcfgBtn)exportcfgBtn.addEventListener('click',exportConfig);
  var rstBtn=$('#rst');
  if(rstBtn)rstBtn.addEventListener('click',function(){
    if(confirm('Réinitialiser toute la configuration ?')){
      localStorage.removeItem('sl29');localStorage.removeItem('sl29_keys');
      cfg=Object.assign({},DEFAULT);st.modelCache=null;
      applyToUI();updateModelSelect();renderKeys();toast('Réinitialisé');
    }
  });
  [['sens','vsens'],['sil','vsil'],['min','vmin'],['max','vmax'],
   ['temp','vtemp'],['tokens','vtokens'],['rate','vrate']].forEach(function(a){
    var s=$('#'+a[0]),d=$('#'+a[1]);
    if(s&&d)s.addEventListener('input',function(){d.textContent=s.value});
  });
  var recBtn=$('#rec');if(recBtn)recBtn.addEventListener('click',startRec);
  var stopBtn=$('#stop');if(stopBtn)stopBtn.addEventListener('click',stopRec);
  var playBtn=$('#play');if(playBtn)playBtn.addEventListener('click',playLastRec);
  var autoBtn=$('#auto');
  if(autoBtn)autoBtn.addEventListener('click',function(){if(st.auto&&!st.comp)autoStop();else autoStart(false)});
  var compBtn=$('#comp');
  if(compBtn)compBtn.addEventListener('click',function(){if(st.auto&&st.comp)autoStop();else autoStart(true)});
  var imgBtn=$('#img');if(imgBtn)imgBtn.addEventListener('click',function(){$('#file').click()});
  var fileInput=$('#file');
  if(fileInput)fileInput.addEventListener('change',function(e){if(e.target.files&&e.target.files[0])handleImage(e.target.files[0]);e.target.value=''});
  var camBtn=$('#cam');if(camBtn)camBtn.addEventListener('click',function(){if(st.camOn)closeCam();else openCam()});
  var captureBtn=$('#capture');if(captureBtn)captureBtn.addEventListener('click',captureCam);
  var camstopBtn=$('#camstop');if(camstopBtn)camstopBtn.addEventListener('click',closeCam);
  var sumBtn=$('#sum');
  if(sumBtn)sumBtn.addEventListener('click',function(){
    if(!st.hist.length){toast('Aucun historique','err');return}
    log('Résumé manuel...','info');summarize().then(function(){toast('Résumé fait')});
  });
  var exportBtn=$('#export');if(exportBtn)exportBtn.addEventListener('click',exportConversation);
  var clrBtn=$('#clr');
  if(clrBtn)clrBtn.addEventListener('click',function(){
    st.hist=[];st.mem='';st.tokens=0;st.reqs=0;st.lat=0;st.noiseCount=0;
    var out=$('#out');if(out)out.textContent='Effacé.';
    var logEl=$('#log');if(logEl)logEl.innerHTML='';
    sys();live('Effacé','idle');log('Effacé');toast('Effacé');
  });
  var muteBtn=$('#mute');
  if(muteBtn)muteBtn.addEventListener('click',function(){
    stopTTS();st.muted=!st.muted;
    muteBtn.textContent=st.muted?'SON':'STOP';
    muteBtn.classList.toggle('on',st.muted);sys();
    toast(st.muted?'Son coupé':'Son rétabli');
  });
  var txtInput=$('#txt');var sendBtn=$('#send');
  function sendText(){
    var text=txtInput?txtInput.value.trim():'';if(!text)return;
    if(isStop(text)){stopAll();return}
    live(text,'ok');txtInput.value='';chat(text);
  }
  if(sendBtn)sendBtn.addEventListener('click',sendText);
  if(txtInput)txtInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendText()}});
  var ptt=$('#ptt');
  if(ptt){
    ptt.addEventListener('touchstart',pttDown,{passive:false});
    ptt.addEventListener('touchend',pttUp,{passive:false});
    ptt.addEventListener('touchcancel',pttUp,{passive:false});
    ptt.addEventListener('mousedown',pttDown);
    ptt.addEventListener('mouseup',pttUp);
    ptt.addEventListener('mouseleave',pttUp);
  }
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      var dlg=$('#dlg');if(dlg&&dlg.open){dlg.close();return}
      stopAll();
    }
  });
  window.addEventListener('resize',function(){if(st.ready)sizeCanvases()});
  if(window.speechSynthesis){speechSynthesis.onvoiceschanged=function(){}}
}

function init(){load();bindEvents();tickClock();setInterval(tickClock,1000);bootSequence()}

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}
else{init()}

})();
</script>
</body>
