<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050905">
<title>SUPRA LAB v23.2</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#050905;--bg2:#020402;--panel:#081208;--fg:#00ff41;--dim:#007a20;--muted:#004d14;--red:#ff0044;--orange:#ffaa00;--blue:#00ccff;--font:'VT323',monospace;--glow:0 0 10px rgba(0,255,65,.35)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font)}
body{background-image:linear-gradient(rgba(0,255,65,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,65,.025) 1px,transparent 1px);background-size:32px 32px}
button,input,select,textarea{font-family:var(--font);touch-action:manipulation}
.scan,.vig{position:fixed;inset:0;pointer-events:none;z-index:9990}
.scan{background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px)}
.vig{background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.5) 100%)}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--panel);border:2px solid var(--fg);color:var(--fg);padding:7px 18px;font-size:14px;opacity:0;transform:translateY(-10px);transition:.3s;white-space:nowrap}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{border-color:var(--red);color:var(--red)}
.toast.warn{border-color:var(--orange);color:var(--orange)}
.toast.info{border-color:var(--blue);color:var(--blue)}
.btn{background:transparent;border:3px solid var(--fg);color:var(--fg);padding:10px 18px;font-size:17px;letter-spacing:1px;cursor:pointer;box-shadow:var(--glow);transition:.12s}
.btn:hover{background:rgba(0,255,65,.1)}
.btn:active{transform:scale(.96);background:var(--fg);color:var(--bg)}
.btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.blue{border-color:var(--blue);color:var(--blue)}
.btn.on{background:var(--fg);color:var(--bg)}
.btn.sm{padding:6px 11px;font-size:14px;border-width:2px}
#boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;border:6px solid var(--fg);background:var(--bg);text-align:center;padding:20px}
#boot h1{font-size:34px;letter-spacing:3px;text-shadow:0 0 15px rgba(0,255,65,.5);min-height:42px}
#boot p{color:var(--orange);margin-top:12px;font-size:15px;opacity:0;transition:.5s;line-height:1.4}
#boot p.show{opacity:1}
#boot .acts{margin-top:28px;display:flex;gap:12px;opacity:0;transition:.5s}
#boot .acts.show{opacity:1}
.blink::after{content:'█';animation:blink .6s step-end infinite}
@keyframes blink{50%{opacity:0}}
#app{display:none;position:fixed;inset:0;border:6px solid var(--fg);flex-direction:column;background:var(--bg)}
#app.show{display:flex}
header{background:var(--panel);border-bottom:3px solid var(--fg);padding:11px 14px;text-align:center;font-size:17px;letter-spacing:2px;position:relative;overflow:hidden;flex-shrink:0}
header::after{content:'v23.2  •  DETECTION ANTI-COUPURE  •  VISION  •  STOP = RÉÉCOUTE ';position:absolute;top:1px;left:0;font-size:11px;color:var(--muted);white-space:nowrap;animation:marquee 24s linear infinite}
@keyframes marquee{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
main{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;align-content:start;padding-bottom:115px}
footer{position:absolute;bottom:0;left:0;right:0;background:var(--panel);border-top:3px solid var(--fg);padding:6px 12px;font-size:13px;display:flex;justify-content:space-between;flex-shrink:0}
.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;background:var(--panel);border:3px solid var(--fg)}
.bar .round{width:56px;height:56px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;padding:0;position:relative}
.bar .round.rec-on{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.1s ease-out infinite}
.bar .round .cnt{position:absolute;top:-5px;right:-5px;background:var(--orange);color:var(--bg);font-size:10px;width:18px;height:18px;border-radius:50%;display:none;align-items:center;justify-content:center}
.bar .round .cnt.show{display:flex}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,0,68,.5)}100%{box-shadow:0 0 0 14px rgba(255,0,68,0)}}
.timer{font-size:18px;min-width:80px;text-align:center}
.timer.on{color:var(--red);animation:blink 1s step-end infinite}
.sep{width:2px;height:28px;background:var(--muted)}
.live{grid-column:1/-1;background:var(--bg2);border:3px solid var(--fg);position:relative;min-height:80px}
.live .label{position:absolute;top:-10px;left:10px;background:var(--bg2);padding:0 7px;font-size:12px}
.live .badge{position:absolute;top:8px;right:10px;font-size:12px;padding:2px 7px;border:1px solid var(--muted);color:var(--muted)}
.live .badge.listen{color:var(--blue);border-color:var(--blue);animation:blink 1.2s step-end infinite}
.live .badge.rec{color:var(--red);border-color:var(--red);animation:blink .5s step-end infinite}
.live .badge.think{color:var(--orange);border-color:var(--orange)}
.live .badge.ok{color:var(--fg);border-color:var(--fg)}
.live .txt{padding:24px 12px 10px;font-size:18px;line-height:1.35;min-height:60px;word-break:break-word}
.live .txt.dim{color:var(--muted);font-size:14px}
.live .txt.red{color:var(--red)}
.live .txt.orange{color:var(--orange);font-size:15px}
.input-row{grid-column:1/-1;display:flex;background:var(--bg2);border:2px solid var(--dim)}
.input-row .pre{display:flex;align-items:center;padding:0 10px;color:var(--dim);font-size:18px;border-right:2px solid var(--dim)}
.input-row input{flex:1;background:transparent;border:none;color:var(--fg);padding:11px;font-size:16px;outline:none}
.input-row input::placeholder{color:var(--muted)}
.input-row button{border:none;border-left:2px solid var(--dim);background:rgba(0,255,65,.06);color:var(--fg);padding:0 14px;font-size:15px;cursor:pointer}
.panel{background:var(--panel);border:3px solid var(--fg);padding:12px;position:relative;min-height:100px}
.panel .label{position:absolute;top:-10px;left:10px;background:var(--panel);padding:0 7px;font-size:12px}
.panel.full{grid-column:1/-1}
canvas{display:block;width:100%;height:90px;background:var(--bg2);image-rendering:pixelated}
.out{background:var(--bg2);border:2px dashed var(--dim);padding:12px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow-y:auto;min-height:70px;color:var(--dim)}
.log{max-height:120px;overflow-y:auto;font-size:12px;background:var(--bg2);border:2px dashed var(--orange);padding:6px}
.log div{padding:2px 3px;border-left:3px solid transparent;margin:1px 0}
.log .ok{color:var(--dim);border-color:var(--muted)}
.log .err{color:var(--red);border-color:var(--red)}
.log .info{color:var(--orange);border-color:var(--orange)}
.sys{font-size:13px;line-height:1.55}
.stats{font-size:12px;color:var(--muted);margin-top:4px}
#ptt{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);width:115px;height:115px;border-radius:50%;font-size:13px;text-align:center;line-height:1.2;z-index:200;border-width:5px;display:none;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(0,255,65,.4)}
#ptt.show{display:flex}
#ptt:active{transform:translateX(-50%) scale(.93)}
#ptt.rec{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1s ease-out infinite}
dialog{border:5px solid var(--fg);background:var(--bg);color:var(--fg);padding:0;max-width:520px;width:94vw;max-height:88vh;overflow-y:auto;box-shadow:0 0 30px rgba(0,255,65,.25)}
dialog::backdrop{background:rgba(0,0,0,.85)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:3px solid var(--fg);font-size:18px}
.db{padding:14px 16px}
.df{display:flex;gap:10px;justify-content:center;padding:12px;border-top:2px solid var(--muted);flex-wrap:wrap}
.fl{margin-bottom:12px}
.fl label{display:block;margin-bottom:4px;font-size:13px}
.fl input,.fl select,.fl textarea{width:100%;padding:9px;background:var(--bg2);color:var(--fg);border:2px solid var(--dim);font-size:15px;outline:none}
.fl textarea{min-height:70px;resize:vertical}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--fg)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.check input{width:16px;height:16px;accent-color:var(--fg)}
.sec{font-size:14px;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--muted)}
.range{display:flex;align-items:center;gap:8px}
.range input{flex:1;accent-color:var(--fg)}
.range span{min-width:36px;text-align:right;color:var(--orange)}
.cam-box{grid-column:1/-1;display:none;flex-direction:column;align-items:center;gap:8px;padding:8px;background:var(--bg2);border:3px solid var(--blue)}
.cam-box.show{display:flex}
video,.preview{max-width:100%;max-height:150px;border:2px solid var(--dim);background:#000;display:none}
@media(max-width:600px){#boot h1{font-size:26px}.bar .round{width:48px;height:48px;font-size:11px}#ptt{width:100px;height:100px;font-size:12px;bottom:54px}main{padding-bottom:125px}}
</style>
</head>
<body>
<div class="scan"></div><div class="vig"></div><div id="toasts"></div>

<dialog id="dlg">
  <div class="dh"><span>PARAMÈTRES</span><button class="btn sm" id="x" type="button" style="border:none;box-shadow:none;font-size:22px">&times;</button></div>
  <div class="db">
    <div class="sec">Clé API Groq</div>
    <div class="fl"><label>Clé (gsk_...)</label><textarea id="key" placeholder="Colle ta clé ici" spellcheck="false"></textarea></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn blue" id="paste" type="button" style="flex:1.4">COLLER</button>
      <button class="btn blue" id="test" type="button" style="flex:1">TESTER</button>
    </div>
    <div class="fl"><label>Modèle</label>
      <select id="model">
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
        <option value="llama-3.1-8b-instant">Llama 3.1 8B Instant</option>
        <option value="meta-llama/llama-4-scout-17b-16e-instruct">Llama 4 Scout (vision)</option>
      </select>
    </div>
    <div class="fl"><label>Personnalité</label>
      <select id="persona">
        <option value="pro">Pro (recommandé)</option>
        <option value="default">Classique</option>
        <option value="chill">Détendu</option>
        <option value="strict">Direct & court</option>
      </select>
    </div>
    <div class="sec">Écoute (important)</div>
    <div class="fl"><label>Sensibilité <span id="vsens">12</span></label><div class="range"><input type="range" id="sens" min="5" max="30" value="12"></div></div>
    <div class="fl"><label>Silence fin (ms) <span id="vsil">600</span></label><div class="range"><input type="range" id="sil" min="300" max="1200" step="25" value="600"></div></div>
    <div class="fl"><label class="check"><input type="checkbox" id="always" checked> Toujours répondre</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="tts" checked> Voix</label></div>
    <div class="fl"><label>Langue</label>
      <select id="lang"><option value="fr">Français</option><option value="en">English</option><option value="es">Español</option></select>
    </div>
    <div class="fl"><label>Couleur</label>
      <select id="col"><option value="#00ff41">Vert</option><option value="#00ccff">Cyan</option><option value="#ff6600">Orange</option><option value="#ff00aa">Rose</option></select>
    </div>
  </div>
  <div class="df">
    <button class="btn" id="save" type="button">SAUVEGARDER</button>
    <button class="btn red" id="rst" type="button">RESET</button>
  </div>
</dialog>

<section id="boot">
  <h1 class="blink" id="title"></h1>
  <p id="sub"></p>
  <div class="acts" id="acts">
    <button class="btn" id="go" type="button" style="font-size:24px;padding:12px 36px;border-width:4px">LANCER</button>
    <button class="btn" id="cfg" type="button">PARAMÈTRES</button>
  </div>
</section>

<div id="app">
  <header>SUPRA LAB v23.2 — <span id="mode">FIX</span></header>
  <main>
    <div class="bar">
      <button class="btn round" id="rec" type="button">REC<span class="cnt" id="reccnt">0</span></button>
      <div class="timer" id="timer">00:00</div>
      <button class="btn round" id="stop" type="button" disabled>STOP</button>
      <button class="btn round" id="play" type="button">PLAY</button>
      <div class="sep"></div>
      <button class="btn round blue" id="auto" type="button">AUTO</button>
      <button class="btn round" id="comp" type="button">24/7</button>
      <button class="btn round" id="img" type="button">IMG</button>
      <button class="btn round" id="cam" type="button">CAM</button>
      <button class="btn round" id="sum" type="button">RÉSUMÉ</button>
      <button class="btn round red" id="clr" type="button">CLR</button>
      <button class="btn round red" id="mute" type="button">STOP</button>
    </div>

    <input type="file" id="file" accept="image/*" hidden>
    <img id="preview" class="preview" alt="">

    <div class="cam-box" id="cambox">
      <video id="video" autoplay playsinline muted></video>
      <div style="display:flex;gap:8px">
        <button class="btn sm blue" id="capture" type="button">CAPTURER</button>
        <button class="btn sm red" id="camstop" type="button">FERMER</button>
      </div>
    </div>

    <div class="panel"><div class="label">SPECTRO</div><canvas id="c1"></canvas></div>
    <div class="panel"><div class="label">OSCILLO</div><canvas id="c2"></canvas></div>
    <div class="panel"><div class="label">VOLUME</div><canvas id="c3"></canvas></div>

    <div class="live">
      <div class="label">ÉCOUTE</div>
      <div class="badge" id="badge">PRET</div>
      <div class="txt dim" id="live">Dis « stop » pour couper et réécouter</div>
    </div>

    <div class="input-row">
      <div class="pre">&gt;</div>
      <input id="txt" placeholder="Écris ou parle..." autocomplete="off">
      <button type="button" id="send">ENVOYER</button>
    </div>

    <div class="panel full"><div class="label">RÉPONSE</div><div class="out" id="out">En attente...</div></div>
    <div class="panel full"><div class="label">JOURNAL</div><div class="log" id="log"></div></div>
    <div class="panel"><div class="label">SYSTÈME</div><div class="sys" id="sys">—</div><div class="stats" id="stats">—</div></div>
  </main>
  <footer><span id="status">En attente...</span><span>v23.2 | <span id="clock">--:--:--</span></span></footer>
</div>

<button class="btn" id="ptt" type="button">MAINTENIR<br>POUR PARLER</button>
<audio id="audio" hidden></audio>

<script>
(() => {
  /* ===== CONFIG ===== */
  const DEFAULT = {
    key: '', model: 'llama-3.3-70b-versatile', lang: 'fr', tts: true,
    color: '#00ff41', sens: 12, silence: 600, always: true, persona: 'pro'
  };

  const PERSONA = {
    default: `Tu es SUPRA, compagnon intelligent.
RÈGLES STRICTES :
- Réponds UNIQUEMENT en texte brut.
- N'utilise JAMAIS de markdown, d'astérisques, de **, de *, de listes à puces, de titres #.
- Pas de formatage. Texte simple et clair.
- Tutoiement. Français.
- Si on dit stop/arrête/tais-toi, tu t'arrêtes.`,
    pro: `Tu es SUPRA en mode Pro.
RÈGLES STRICTES :
- Réponds UNIQUEMENT en texte brut, sans aucun formatage.
- INTERDICTION totale : *, **, ***, markdown, listes, puces, #, liens formatés.
- Phrases claires et utiles. Tutoiement.
- Ne invente pas de mots bizarres.
- Si on dit stop, arrête ou tais-toi, tu t'arrêtes immédiatement.`,
    chill: `Tu es SUPRA détendu.
Texte brut uniquement. Jamais d'astérisques ni de markdown. Tutoiement. Si stop, tu te tais.`,
    strict: `Tu es SUPRA direct.
Réponses très courtes. Texte brut uniquement. Aucun * ni markdown. Si stop, stop immédiat.`
  };

  const STOP_WORDS = ['stop', 'arrête', 'arrete', 'tais-toi', 'taistoi', 'silence', 'shut up', 'enough', 'basta'];

  /* ===== ÉTAT ===== */
  let cfg = { ...DEFAULT };
  let st = {
    ready: false, ctx: null, an: null, vol: null, stream: null,
    fdata: null, wdata: null, vdata: null,
    rec: false, mr: null, chunks: [], t0: 0, iv: null,
    ptt: false, pmr: null, pchunks: [], piv: null, psec: 0,
    auto: false, run: false, comp: false, abortFlag: false,
    hist: [], mem: '', img: null, imgBase64: null, cam: null, camOn: false,
    ctrl: null, reqs: 0, lat: 0, tokens: 0
  };
  let caps = [];
  let voices = [];

  /* ===== ROLLING VOLUME BUFFER (anti-coupure) ===== */
  const VB_SIZE = 6;   // 6 échantillons × 50ms = 300ms de fenêtre
  const VB_MS = 50;
  let vbIv = null;
  let vb = [];

  function startVB() {
    if (vbIv !== null) return;
    vb = [];
    vbIv = setInterval(() => {
      vb.push(rawVol());
      if (vb.length > VB_SIZE) vb.shift();
    }, VB_MS);
  }

  function stopVB() {
    if (vbIv !== null) { clearInterval(vbIv); vbIv = null; }
    vb = [];
  }

  /* Volume lissé sur la fenêtre glissante */
  function smoothVol() {
    if (!vb.length) return 0;
    let s = 0;
    for (let i = 0; i < vb.length; i++) s += vb[i];
    return s / vb.length;
  }

  /* ===== UTILITAIRES ===== */
  const $ = s => document.querySelector(s);
  const now = () => new Date().toLocaleTimeString('fr-FR');
  const pad = n => n < 10 ? '0' + n : n;
  const fmt = s => pad(Math.floor(s / 60)) + ':' + pad(s % 60);
  const clean = k => String(k || '').replace(/[\u200B-\u200D\uFEFF\u00A0\s]/g, '').trim();
  const valid = k => k && k.startsWith('gsk_') && k.length > 30;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const isVisionModel = () => cfg.model.includes('scout') || cfg.model.includes('vision') || cfg.model.includes('llama-4');

  function isStop(text) {
    const t = (text || '').toLowerCase().trim();
    return STOP_WORDS.some(w => t === w || t.startsWith(w + ' ') || t.endsWith(' ' + w) || t.includes(' ' + w + ' '));
  }

  /* Toast au lieu d'alert */
  function toast(msg, type = 'info', dur = 2500) {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    const c = $('#toasts');
    c.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 300);
    }, dur);
  }

  function log(m, t = 'ok') {
    const el = $('#log');
    if (!el) return;
    const d = document.createElement('div');
    d.className = t;
    d.textContent = '[' + now() + '] ' + m;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
    while (el.children.length > 80) el.firstChild.remove();
  }

  function status(t) { $('#status').textContent = t; }

  function sys() {
    const ok = v => '<span style="color:var(--fg)">' + v + '</span>';
    const ko = v => '<span style="color:var(--red)">' + v + '</span>';
    const wa = v => '<span style="color:var(--orange)">' + v + '</span>';
    $('#sys').innerHTML =
      'Micro ' + (st.stream ? ok('OK') : ko('OFF')) +
      ' · API ' + (valid(cfg.key) ? ok('OK') : ko('—')) +
      (st.img ? ' · Img ' + wa('OUI') : '') +
      '<br>Mode ' + (st.comp ? wa('24/7') : st.auto ? wa('AUTO') : ok('PTT')) +
      ' · ' + cfg.persona +
      '<br>Mémoire ' + st.hist.length + ' msgs' + (st.mem ? ' +résumé' : '');
    $('#stats').textContent = '≈' + st.tokens + ' tokens · ' + (st.lat || '—') + 'ms · ' + st.reqs + ' req';
  }

  function updateRecBadge() {
    const el = $('#reccnt');
    if (caps.length > 0) { el.textContent = caps.length; el.classList.add('show'); }
    else { el.classList.remove('show'); }
  }

  function live(txt, mode) {
    const t = $('#live'), b = $('#badge');
    t.className = 'txt';
    b.className = 'badge';
    if (mode === 'idle') { t.classList.add('dim'); t.textContent = txt; b.textContent = 'PRET'; }
    else if (mode === 'listen') { t.classList.add('dim'); t.textContent = txt; b.textContent = 'ECOUTE'; b.classList.add('listen'); }
    else if (mode === 'rec') { t.classList.add('red'); t.textContent = txt; b.textContent = 'REC'; b.classList.add('rec'); }
    else if (mode === 'think') { t.classList.add('orange'); t.textContent = txt; b.textContent = 'SUPRA'; b.classList.add('think'); }
    else if (mode === 'ok') { t.textContent = txt; b.textContent = 'OK'; b.classList.add('ok'); }
  }

  function type(el, str, speed = 25) {
    return new Promise(res => {
      let i = 0;
      el.textContent = '';
      el.classList.add('blink');
      const iv = setInterval(() => {
        el.textContent += str[i++];
        if (i >= str.length) { clearInterval(iv); el.classList.remove('blink'); res(); }
      }, speed);
    });
  }

  /* ===== CONFIG PERSISTENCE ===== */
  function load() {
    try { Object.assign(cfg, JSON.parse(localStorage.getItem('sl231') || '{}')); } catch {}
    /* Réparation si anciens paramètres manquants */
    if (cfg.silence === undefined) cfg.silence = 600;
    apply();
  }

  function apply() {
    const c = cfg.color;
    const r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
    const root = document.documentElement.style;
    root.setProperty('--fg', c);
    root.setProperty('--dim', c + '99');
    root.setProperty('--muted', c + '55');
    root.setProperty('--glow', '0 0 10px rgba(' + r + ',' + g + ',' + b + ',.35)');
    $('#key').value = cfg.key || '';
    $('#model').value = cfg.model;
    $('#lang').value = cfg.lang;
    $('#tts').checked = cfg.tts;
    $('#col').value = cfg.color;
    $('#sens').value = cfg.sens; $('#vsens').textContent = cfg.sens;
    $('#sil').value = cfg.silence; $('#vsil').textContent = cfg.silence;
    $('#always').checked = cfg.always;
    $('#persona').value = cfg.persona;
    sys();
  }

  function save() {
    cfg.key = clean($('#key').value);
    cfg.model = $('#model').value;
    cfg.lang = $('#lang').value;
    cfg.tts = $('#tts').checked;
    cfg.color = $('#col').value;
    cfg.sens = +$('#sens').value;
    cfg.silence = +$('#sil').value;
    cfg.always = $('#always').checked;
    cfg.persona = $('#persona').value;
    localStorage.setItem('sl231', JSON.stringify(cfg));
    apply();
    log('Config sauvée');
    toast('Sauvegardé', 'ok');
  }

  /* ===== AUDIO ===== */
  async function initAudio() {
    try {
      st.ctx = new (AudioContext || webkitAudioContext)({ sampleRate: 48000 });
      await st.ctx.resume();
      st.stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      const src = st.ctx.createMediaStreamSource(st.stream);
      st.an = st.ctx.createAnalyser();
      st.an.fftSize = 2048;
      st.an.smoothingTimeConstant = 0.75;
      src.connect(st.an);
      st.fdata = new Uint8Array(st.an.frequencyBinCount);
      st.wdata = new Uint8Array(st.an.frequencyBinCount);
      st.vol = st.ctx.createAnalyser();
      st.vol.fftSize = 256;
      src.connect(st.vol);
      st.vdata = new Uint8Array(st.vol.frequencyBinCount);
      st.ready = true;
      size();
      drawLoop();
      sys();
      log('Audio OK');
      return true;
    } catch (e) {
      log('Micro: ' + e.message, 'err');
      toast('Micro inaccessible', 'err');
      return false;
    }
  }

  /* Volume brut (0-255) */
  function rawVol() {
    if (!st.vol) return 0;
    st.vol.getByteFrequencyData(st.vdata);
    let s = 0;
    for (let i = 0; i < st.vdata.length; i++) s += st.vdata[i];
    return s / st.vdata.length;
  }

  /* ===== CANVAS (boucle visuelle séparée) ===== */
  function drawLoop() {
    if (!st.ready) return;
    requestAnimationFrame(drawLoop);
    st.an.getByteFrequencyData(st.fdata);
    st.an.getByteTimeDomainData(st.wdata);
    st.vol.getByteFrequencyData(st.vdata);
    draw1(); draw2(); draw3();
  }

  function draw1() {
    const c = $('#c1');
    if (!c) return;
    const x = c.getContext('2d'), w = c.width, h = c.height;
    x.fillStyle = '#020402';
    x.fillRect(0, 0, w, h);
    const n = st.fdata.length, bw = Math.max(1, w / n);
    for (let i = 0; i < n; i++) {
      const v = st.fdata[i];
      if (v < 3) continue;
      const bh = Math.log10(v + 1) * 18;
      x.fillStyle = 'hsl(' + Math.max(0, 110 - v * 0.4) + ',100%,' + Math.max(15, v * 0.3) + '%)';
      x.fillRect(i * bw, h - bh, bw + 0.3, bh);
    }
  }

  function draw2() {
    const c = $('#c2');
    if (!c) return;
    const x = c.getContext('2d'), w = c.width, h = c.height;
    x.fillStyle = '#020402';
    x.fillRect(0, 0, w, h);
    const col = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
    x.strokeStyle = col;
    x.lineWidth = 1.5;
    x.beginPath();
    const step = w / st.wdata.length;
    for (let i = 0; i < st.wdata.length; i++) {
      const y = (st.wdata[i] / 128 - 0.5) * h * 0.75 + h / 2;
      i ? x.lineTo(i * step, y) : x.moveTo(0, y);
    }
    x.stroke();
  }

  function draw3() {
    const c = $('#c3');
    if (!c) return;
    const x = c.getContext('2d'), w = c.width, h = c.height;
    x.fillStyle = '#020402';
    x.fillRect(0, 0, w, h);
    let s = 0;
    for (let i = 0; i < st.vdata.length; i++) s += st.vdata[i];
    const p = s / st.vdata.length / 255;
    const bw = w * 0.38, bh = Math.max(2, p * h * 0.8);
    x.fillStyle = 'hsl(' + Math.max(0, 120 - p * 160) + ',100%,40%)';
    x.fillRect((w - bw) / 2, h - bh, bw, bh);
    x.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
    x.font = '16px VT323';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText(Math.round(p * 100) + '%', w / 2, h / 2);
  }

  function size() {
    document.querySelectorAll('canvas').forEach(c => {
      const r = c.parentElement.getBoundingClientRect();
      c.width = Math.max(60, r.width - 24);
      c.height = 90;
    });
  }

  function mime() {
    for (const m of ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'])
      if (MediaRecorder.isTypeSupported(m)) return m;
    return '';
  }

  /* ===== DÉTECTION VOCALE AMÉLIORÉE ===== */

  /* Attend que le volume lissé dépasse le seuil pendant ~300ms */
  function waitSpeak() {
    return new Promise(res => {
      let aboveCount = 0;
      const THRESHOLD_TICKS = 5; // 5 × 50ms = 250ms au-dessus

      const check = () => {
        if (!st.auto || st.abortFlag) return res(false);
        const sv = smoothVol();
        if (sv >= cfg.sens) {
          aboveCount++;
          if (aboveCount >= THRESHOLD_TICKS) return res(true);
        } else {
          /* Décroissance graduelle : un bref creux ne reset pas tout */
          aboveCount = Math.max(0, aboveCount - 2);
        }
        setTimeout(check, VB_MS);
      };
      setTimeout(check, VB_MS);
    });
  }

  /* Enregistre jusqu'à détection de silence stable */
  function recUntilSilent() {
    return new Promise(res => {
      const chunks = [];
      let rec;
      try { rec = new MediaRecorder(st.stream, { mimeType: mime() }); }
      catch (e) { log('MediaRecorder: ' + e.message, 'err'); return res(null); }

      const MIN_REC = 600;       // Durée min avant d'autoriser l'arrêt (ms)
      const MAX_REC = 30000;     // Durée max absolue (ms)
      const TAIL_MS = 200;       // Buffer de queue pour attraper la fin des mots
      const t0 = Date.now();
      let hasSpoken = false;
      let silentMs = 0;
      let tailScheduled = false;

      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        stopVB();
        const blob = new Blob(chunks, { type: rec.mimeType });
        res(blob.size >= 500 ? blob : null);
      };
      rec.onerror = () => { stopVB(); res(null); };

      const iv = setInterval(() => {
        if (!st.auto || st.abortFlag) {
          clearInterval(iv);
          if (rec.state === 'recording') rec.stop();
          return;
        }

        const sv = smoothVol();
        const elapsed = Date.now() - t0;

        /* Détection de parole : seuil plus bas (40% du seuil de déclenchement)
           pour ne pas couper sur des syllabes douces */
        if (sv >= cfg.sens * 0.4) {
          silentMs = 0;
          tailScheduled = false;
          if (sv >= cfg.sens) hasSpoken = true;
        } else if (hasSpoken) {
          silentMs += VB_MS;
        }

        /* Arrêt conditionnel : parole détectée + durée min atteinte + silence suffisant */
        if (hasSpoken && elapsed >= MIN_REC && silentMs >= cfg.silence && !tailScheduled) {
          tailScheduled = true;
          /* On attend TAIL_MS de plus avant de couper, pour attraper la fin du mot */
          setTimeout(() => {
            clearInterval(iv);
            if (rec.state === 'recording') rec.stop();
          }, TAIL_MS);
          return;
        }

        /* Sécurité : durée max */
        if (elapsed >= MAX_REC) {
          clearInterval(iv);
          if (rec.state === 'recording') rec.stop();
        }
      }, VB_MS);

      rec.start(40);
    });
  }

  /* ===== ENREGISTREMENT MANUEL ===== */
  function startRec() {
    if (st.rec || !st.stream) return;
    const m = mime();
    if (!m) return log('Format non supporté', 'err');
    st.rec = true;
    st.chunks = [];
    st.t0 = Date.now();
    try { st.mr = new MediaRecorder(st.stream, { mimeType: m }); }
    catch { st.rec = false; return; }
    st.mr.ondataavailable = e => { if (e.data && e.data.size) st.chunks.push(e.data); };
    st.mr.onstop = () => {
      const blob = new Blob(st.chunks, { type: st.mr.mimeType });
      /* Libérer l'ancien URL pour éviter la fuite mémoire */
      if (caps.length > 0 && caps[0].url) URL.revokeObjectURL(caps[0].url);
      caps.unshift({ url: URL.createObjectURL(blob), blob, dur: Math.floor((Date.now() - st.t0) / 1000) });
      /* Limiter à 10 enregistrements */
      while (caps.length > 10) { URL.revokeObjectURL(caps.pop().url); }
      updateRecBadge();
      status('Prêt');
    };
    st.mr.start(200);
    $('#rec').classList.add('rec-on');
    $('#stop').disabled = false;
    $('#timer').classList.add('on');
    status('REC...');
    let s = 0;
    $('#timer').textContent = '00:00';
    st.iv = setInterval(() => { s++; $('#timer').textContent = fmt(s); }, 1000);
  }

  function stopRec() {
    if (!st.rec) return;
    st.rec = false;
    if (st.mr && st.mr.state === 'recording') st.mr.stop();
    $('#rec').classList.remove('rec-on');
    $('#stop').disabled = true;
    $('#timer').classList.remove('on');
    clearInterval(st.iv);
    $('#timer').textContent = '00:00';
  }

  /* ===== PTT (Push-To-Talk) ===== */
  function pttDown(e) {
    e.preventDefault();
    if (!st.ready || st.auto || st.ptt) return;
    st.ptt = true;
    st.pchunks = [];
    st.psec = 0;
    try { st.pmr = new MediaRecorder(st.stream, { mimeType: mime() }); }
    catch { st.ptt = false; return; }
    st.pmr.ondataavailable = e => { if (e.data && e.data.size) st.pchunks.push(e.data); };
    st.pmr.onstop = pttDone;
    st.pmr.start(150);
    $('#ptt').classList.add('rec');
    $('#ptt').innerHTML = 'REC...<br><small>relâche</small>';
    st.piv = setInterval(() => {
      st.psec++;
      live('Enregistrement ' + fmt(st.psec), 'rec');
    }, 1000);
    live('Enregistrement 00:00', 'rec');
  }

  function pttUp(e) {
    e.preventDefault();
    if (!st.ptt) return;
    st.ptt = false;
    clearInterval(st.piv);
    $('#ptt').classList.remove('rec');
    $('#ptt').innerHTML = 'MAINTENIR<br>POUR PARLER';
    /* Petit délai pour attraper la fin du mot */
    setTimeout(() => {
      if (st.pmr && st.pmr.state === 'recording') st.pmr.stop();
    }, 200);
  }

  async function pttDone() {
    const blob = new Blob(st.pchunks, { type: (st.pmr && st.pmr.mimeType) || mime() });
    if (blob.size < 500) { live('Trop court', 'idle'); return; }
    live('Transcription...', 'think');
    const text = await whisper(blob);
    if (!text) { live('Rien compris', 'idle'); return; }
    if (isStop(text)) { stopAll(); live('Stop — en écoute', 'listen'); return; }
    live(text, 'ok');
    await chat(text);
  }

  /* ===== MODE AUTO / 24-7 ===== */
  async function autoStart(comp) {
    if (st.run) return;
    st.auto = true;
    st.run = true;
    st.comp = !!comp;
    st.abortFlag = false;
    $('#auto').classList.toggle('on', !comp);
    $('#comp').classList.toggle('on', !!comp);
    $('#mode').textContent = comp ? '24/7' : 'AUTO';
    live(comp ? 'Compagnon actif' : 'Écoute en cours...', 'listen');
    status(comp ? '24/7' : 'AUTO');
    sys();
    log(comp ? 'Mode 24/7' : 'Mode AUTO', 'info');

    /* Démarrer le buffer de volume pour la détection */
    startVB();

    while (st.auto) {
      st.abortFlag = false;
      try {
        /* Ne pas traiter si l'onglet est caché (économie CPU) */
        if (document.hidden) { await sleep(300); continue; }

        /* 1. Attendre que quelqu'un parle */
        if (!await waitSpeak()) continue;
        if (!st.auto || st.abortFlag) break;

        /* 2. Enregistrer jusqu'au silence */
        live('Je t\'écoute...', 'rec');
        const blob = await recUntilSilent();
        if (!st.auto || st.abortFlag) break;

        if (!blob || blob.size < 500) {
          live(st.comp ? 'Compagnon en écoute...' : 'Écoute...', 'listen');
          continue;
        }

        /* 3. Transcrire */
        live('Transcription...', 'think');
        const text = await whisper(blob);
        if (!st.auto || st.abortFlag) break;

        if (!text) {
          live(st.comp ? 'Compagnon en écoute...' : 'Écoute...', 'listen');
          continue;
        }

        /* 4. Vérifier si c'est un mot d'arrêt */
        if (isStop(text)) {
          stopAll();
          live('Stop reçu — je réécoute', 'listen');
          log('Stop vocal → réécoute', 'info');
          await sleep(400);
          continue;
        }

        /* 5. Envoyer au LLM */
        live(text, 'ok');
        await chat(text, true);

        if (!st.auto || st.abortFlag) break;

        /* 6. Retour à l'écoute */
        live(st.comp ? 'Compagnon en écoute...' : 'Écoute...', 'listen');
        await sleep(150);
      } catch (e) {
        log('Auto: ' + e.message, 'err');
        await sleep(400);
      }
    }

    /* Nettoyage à la sortie de la boucle */
    stopVB();
    st.run = false;
    st.comp = false;
    st.abortFlag = false;
    $('#auto').classList.remove('on');
    $('#comp').classList.remove('on');
    $('#mode').textContent = 'FIX';
    live('Arrêté', 'idle');
    status('Prêt');
    sys();
  }

  function autoStop() {
    st.auto = false;
    st.abortFlag = true;
    st.comp = false;
    stopVB();
    $('#auto').classList.remove('on');
    $('#comp').classList.remove('on');
    $('#mode').textContent = 'FIX';
    live('Arrêté', 'idle');
    status('Prêt');
    sys();
  }

  /* ===== WHISPER (avec retry) ===== */
  async function whisper(blob, retry = 1) {
    if (!valid(cfg.key)) { log('Clé manquante', 'err'); toast('Clé API manquante', 'err'); return null; }

    let ext = 'webm';
    if (blob.type.includes('ogg')) ext = 'ogg';
    else if (blob.type.includes('mp4')) ext = 'm4a';

    for (let attempt = 0; attempt <= retry; attempt++) {
      const t0 = performance.now();
      try {
        const fd = new FormData();
        fd.append('file', blob, 'audio.' + ext);
        fd.append('model', 'whisper-large-v3-turbo');
        fd.append('language', cfg.lang);
        fd.append('response_format', 'json');

        const r = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + cfg.key },
          body: fd
        });

        if (!r.ok) {
          const errText = (await r.text()).slice(0, 100);
          if (r.status === 429 && attempt < retry) {
            log('Rate limit, retry ' + (attempt + 1) + '...', 'info');
            await sleep(1000 * (attempt + 1));
            continue;
          }
          throw new Error(errText);
        }

        const d = await r.json();
        st.lat = Math.round(performance.now() - t0);
        st.reqs++;
        sys();
        const text = (d.text || '').trim();
        if (text) log('→ ' + text);
        return text || null;
      } catch (e) {
        if (attempt < retry) {
          log('Whisper retry ' + (attempt + 1) + '...', 'info');
          await sleep(800);
          continue;
        }
        log('Whisper: ' + e.message, 'err');
        return null;
      }
    }
    return null;
  }

  /* ===== CHAT / STREAM (avec support vision) ===== */
  async function chat(text, fromAuto = false) {
    if (!valid(cfg.key)) {
      $('#out').textContent = 'Clé API manquante — ouvre les Paramètres';
      toast('Clé API manquante', 'err');
      return;
    }

    /* En mode AUTO sans "toujours répondre", ignorer si pas appelé */
    if (fromAuto && !cfg.always && !st.comp) {
      const low = text.toLowerCase();
      if (!['supra', 'lab', 'assistant', 'hey', 'hel'].some(w => low.includes(w))) {
        live('Pas pour moi', 'listen');
        return;
      }
    }

    /* Annuler un stream précédent si nécessaire */
    if (st.ctrl) try { st.ctrl.abort(); } catch {}
    st.ctrl = new AbortController();

    live('Réflexion...', 'think');
    $('#out').textContent = '';
    status('Stream...');

    /* Construire le prompt système */
    const system = (PERSONA[cfg.persona] || PERSONA.pro)
      + (st.comp ? '\nMode compagnon permanent.' : '')
      + (st.mem ? '\n\nMémoire:\n' + st.mem : '');

    /* Construire le message utilisateur (avec image si vision) */
    let userMsg;
    if (st.imgBase64 && isVisionModel()) {
      userMsg = {
        role: 'user',
        content: [
          { type: 'text', text: text || 'Décris ce que tu vois.' },
          { type: 'image_url', image_url: { url: st.imgBase64 } }
        ]
      };
    } else if (st.imgBase64 && !isVisionModel()) {
      toast('Change de modèle pour utiliser la vision (Llama 4 Scout)', 'warn', 3500);
      userMsg = { role: 'user', content: text };
    } else {
      userMsg = { role: 'user', content: text };
    }

    st.hist.push(userMsg);
    if (st.hist.length > 18) await summarize();

    const messages = [{ role: 'system', content: system }, ...st.hist];
    const t0 = performance.now();

    try {
      const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + cfg.key },
        body: JSON.stringify({
          model: cfg.model,
          messages,
          temperature: 0.35,
          max_tokens: 1800,
          stream: true
        }),
        signal: st.ctrl.signal
      });

      if (!r.ok) {
        const errBody = (await r.text()).slice(0, 120);
        throw new Error(r.status + ' — ' + errBody);
      }

      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let full = '', buf = '';
      $('#out').textContent = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() || '';
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6);
          if (raw === '[DONE]') continue;
          try {
            const j = JSON.parse(raw);
            const d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
            if (d) {
              full += d;
              /* Nettoyage en temps réel des astérisques */
              const clean_full = full.replace(/\*{1,3}/g, '');
              $('#out').textContent = clean_full;
              $('#out').scrollTop = $('#out').scrollHeight;
            }
          } catch {}
        }
      }

      /* Nettoyage final */
      full = full.replace(/\*{1,3}/g, '').replace(/#{1,6}\s?/g, '').trim() || '...';

      st.hist.push({ role: 'assistant', content: full });
      st.tokens += Math.ceil((text.length + full.length) / 3.8);
      st.lat = Math.round(performance.now() - t0);
      st.reqs++;
      sys();

      $('#out').textContent = full + '\n\n' + now();
      log('OK ' + st.lat + 'ms');
      status(st.auto ? (st.comp ? '24/7' : 'AUTO') : 'Prêt');

      /* Effacer l'image après utilisation */
      st.imgBase64 = null;
      st.img = null;
      $('#preview').style.display = 'none';

      speak(full);
    } catch (e) {
      if (e.name === 'AbortError') {
        log('Interrompu', 'info');
        live('Stoppé', 'idle');
        return;
      }
      $('#out').textContent = 'Erreur: ' + e.message;
      log(e.message, 'err');
      live('Erreur', 'idle');
      toast('Erreur API: ' + e.message.slice(0, 50), 'err', 3000);
    } finally {
      st.ctrl = null;
    }
  }

  /* ===== RÉSUMÉ MÉMOIRE ===== */
  async function summarize() {
    if (st.hist.length < 14) return;
    const old = st.hist.splice(0, st.hist.length - 5);
    const txt = old.map(m => {
      if (typeof m.content === 'string') return m.role + ': ' + m.content;
      /* Messages vision : extraire juste le texte */
      const parts = m.content.filter(p => p.type === 'text');
      return m.role + ': ' + parts.map(p => p.text).join(' ') + ' [image]';
    }).join('\n');

    try {
      const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + cfg.key },
        body: JSON.stringify({
          model: 'llama-3.1-8b-instant',
          messages: [
            { role: 'system', content: 'Résume densément en texte brut uniquement. Pas d\'astérisques ni markdown.' },
            { role: 'user', content: (st.mem ? st.mem + '\n\n' : '') + txt }
          ],
          temperature: 0.2,
          max_tokens: 400
        })
      });
      if (r.ok) {
        const d = await r.json();
        const s = ((d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || '')
          .replace(/\*{1,3}/g, '').trim();
        if (s) { st.mem = s; log('Mémoire résumée', 'info'); }
      }
    } catch {}
    sys();
  }

  /* ===== TTS ===== */
  function speak(t) {
    if (!cfg.tts || !window.speechSynthesis || !t) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.slice(0, 700));
    u.lang = cfg.lang === 'fr' ? 'fr-FR' : cfg.lang === 'es' ? 'es-ES' : 'en-US';
    u.rate = 0.94;
    /* Choisir une voix appropriée parmi celles chargées */
    for (const v of voices) {
      if (v.lang.startsWith(cfg.lang)) { u.voice = v; break; }
    }
    speechSynthesis.speak(u);
  }

  function loadVoices() {
    voices = speechSynthesis.getVoices();
    if (!voices.length) {
      speechSynthesis.addEventListener('voiceschanged', () => {
        voices = speechSynthesis.getVoices();
      }, { once: true });
    }
  }

  /* ===== STOP GLOBAL ===== */
  function stopAll() {
    speechSynthesis && speechSynthesis.cancel();
    if (st.ctrl) try { st.ctrl.abort(); } catch {}
    st.abortFlag = true;
    if (st.auto) {
      live('Stop — réécoute...', 'listen');
    } else {
      live('Stoppé', 'idle');
    }
    log('Stop', 'info');
  }

  /* ===== IMAGE / CAMÉRA ===== */
  function loadImg(f) {
    if (!f || !f.type.startsWith('image/')) return;
    const r = new FileReader();
    r.onload = e => {
      st.img = e.target.result;
      st.imgBase64 = e.target.result;
      $('#preview').src = st.img;
      $('#preview').style.display = 'block';
      log('Image chargée (' + Math.round(f.size / 1024) + ' Ko)');
      live('Image prête — ' + (isVisionModel() ? 'envoie avec vision' : 'change de modèle pour vision'), 'ok');
      if (!isVisionModel()) toast('Sélectionne Llama 4 Scout pour analyser l\'image', 'warn', 3500);
      sys();
    };
    r.readAsDataURL(f);
  }

  async function startCam() {
    try {
      st.cam = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      $('#video').srcObject = st.cam;
      $('#video').style.display = 'block';
      $('#cambox').classList.add('show');
      st.camOn = true;
      sys();
      live('Cam active', 'ok');
    } catch (e) {
      log('Cam: ' + e.message, 'err');
      toast('Caméra inaccessible', 'err');
    }
  }

  function stopCam() {
    if (st.cam) { st.cam.getTracks().forEach(t => t.stop()); st.cam = null; }
    $('#video').srcObject = null;
    $('#video').style.display = 'none';
    $('#cambox').classList.remove('show');
    st.camOn = false;
    sys();
  }

  /* ===== BINDINGS ===== */
  function bind() {
    $('#go').onclick = async () => {
      $('#boot').style.display = 'none';
      $('#app').classList.add('show');
      $('#ptt').classList.add('show');
      log('SUPRA LAB v23.2');
      if (!valid(cfg.key)) {
        log('Mets ta clé dans Paramètres', 'err');
        toast('Ouvre Paramètres pour entrer ta clé API', 'warn', 4000);
      }
      const ok = await initAudio();
      if (ok) {
        status('Prêt — PTT ou AUTO');
        toast('Prêt', 'ok', 1500);
      } else {
        status('Micro requis');
      }
    };

    $('#cfg').onclick = () => $('#dlg').showModal();
    $('#x').onclick = () => $('#dlg').close();
    $('#save').onclick = () => { save(); $('#dlg').close(); };
    $('#rst').onclick = () => {
      cfg = { ...DEFAULT };
      localStorage.removeItem('sl231');
      apply();
      log('Reset', 'err');
      toast('Reset effectué', 'warn');
    };

    $('#paste').onclick = async () => {
      try {
        const t = await navigator.clipboard.readText();
        if (!t.trim()) return toast('Presse-papiers vide', 'warn');
        $('#key').value = clean(t);
        cfg.key = clean(t);
        log('Clé collée');
        toast('Clé collée', 'ok', 1500);
      } catch {
        toast('Clique dans le champ puis Ctrl+V', 'warn');
        $('#key').focus();
      }
    };

    $('#test').onclick = async () => {
      const k = clean($('#key').value || cfg.key);
      if (!valid(k)) return toast('Clé invalide (doit commencer par gsk_)', 'err');
      toast('Test en cours...', 'info', 2000);
      try {
        const r = await fetch('https://api.groq.com/openai/v1/models', { headers: { Authorization: 'Bearer ' + k } });
        if (r.status === 401) return toast('Clé refusée (401)', 'err');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        toast('Clé valide', 'ok');
        cfg.key = k;
        localStorage.setItem('sl231', JSON.stringify(cfg));
        apply();
      } catch (e) {
        toast('Erreur: ' + e.message, 'err');
      }
    };

    /* Barre d'outils */
    $('#rec').onclick = () => st.ready && (st.rec ? stopRec() : startRec());
    $('#stop').onclick = stopRec;
    $('#play').onclick = () => {
      if (!caps.length) return toast('Aucun enregistrement', 'warn');
      const c = caps[0];
      $('#audio').src = c.url;
      $('#audio').play();
      toast('Lecture ' + fmt(c.dur), 'info', 1500);
    };
    $('#auto').onclick = () => st.auto ? autoStop() : autoStart(false);
    $('#comp').onclick = () => st.auto ? autoStop() : autoStart(true);
    $('#clr').onclick = () => {
      st.hist = [];
      st.mem = '';
      st.tokens = 0;
      st.img = null;
      st.imgBase64 = null;
      $('#preview').style.display = 'none';
      $('#out').textContent = 'Mémoire effacée.';
      log('Mémoire clear', 'info');
      sys();
      toast('Mémoire effacée', 'ok', 1500);
    };
    $('#sum').onclick = () => {
      if (!st.hist.length && !st.mem) return toast('Rien à résumer', 'warn');
      chat('Fais un résumé clair et oral de notre conversation.');
    };
    $('#mute').onclick = () => {
      stopAll();
      if (st.auto) toast('Réécoute en cours', 'info', 1500);
    };

    /* Image */
    $('#img').onclick = () => $('#file').click();
    $('#file').onchange = e => { if (e.target.files[0]) loadImg(e.target.files[0]); e.target.value = ''; };

    /* Caméra */
    $('#cam').onclick = () => st.camOn ? stopCam() : startCam();
    $('#capture').onclick = () => {
      const v = $('#video');
      if (!v || !st.camOn) return;
      const c = document.createElement('canvas');
      c.width = v.videoWidth || 640;
      c.height = v.videoHeight || 480;
      c.getContext('2d').drawImage(v, 0, 0);
      st.img = c.toDataURL('image/jpeg', 0.85);
      st.imgBase64 = st.img;
      log('Capture caméra');
      if (isVisionModel()) {
        chat('Décris ce que tu vois sur cette image.');
      } else {
        toast('Sélectionne Llama 4 Scout pour analyser', 'warn', 3500);
        live('Image capturée — change de modèle', 'ok');
      }
      sys();
    };
    $('#camstop').onclick = stopCam;

    /* Texte */
    $('#send').onclick = () => {
      const t = $('#txt').value.trim();
      if (!t) return;
      $('#txt').value = '';
      if (isStop(t)) { stopAll(); live('Stop — en écoute', 'listen'); return; }
      live(t, 'ok');
      chat(t);
    };
    $('#txt').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#send').click(); } };
    document.onkeydown = e => { if (e.key === 'Escape') stopAll(); };

    /* PTT */
    const p = $('#ptt');
    p.addEventListener('touchstart', pttDown, { passive: false });
    p.addEventListener('touchend', pttUp, { passive: false });
    p.addEventListener('touchcancel', pttUp, { passive: false });
    p.addEventListener('mousedown', pttDown);
    p.addEventListener('mouseup', pttUp);
    p.addEventListener('mouseleave', pttUp);

    /* Sliders */
    $('#sens').oninput = () => $('#vsens').textContent = $('#sens').value;
    $('#sil').oninput = () => $('#vsil').textContent = $('#sil').value;

    /* Resize */
    let resizeTimer;
    window.onresize = () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (st.ready) size(); }, 100);
    };
  }

  /* ===== NETTOYAGE ===== */
  window.onbeforeunload = () => {
    stopCam();
    stopVB();
    if (st.stream) st.stream.getTracks().forEach(t => t.stop());
    if (window.speechSynthesis) speechSynthesis.cancel();
    /* Libérer les blob URLs */
    caps.forEach(c => { if (c.url) URL.revokeObjectURL(c.url); });
  };

  /* ===== BOOT ===== */
  document.addEventListener('DOMContentLoaded', async () => {
    load();
    bind();
    loadVoices();
    setInterval(() => { $('#clock').textContent = now(); }, 1000);

    await type($('#title'), 'SUPRA LAB v23.2', 28);
    $('#sub').innerHTML =
      'Anti-coupure · Rolling buffer · Vision · Buffer de queue<br>' +
      '<span style="color:var(--blue)">Sensibilité ' + cfg.sens + ' · Silence ' + cfg.silence + 'ms</span>';
    $('#sub').classList.add('show');
    await sleep(300);
    $('#acts').classList.add('show');
  });
})();
</script>
</body>
</html>
