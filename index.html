<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>JARVIS ULTRA</title>

<style>

body{
margin:0;
background:#000;
color:#00f3ff;
font-family:Consolas,monospace;
overflow:hidden;
}

#hud{
position:absolute;
top:10px;
left:10px;
z-index:5;
}

button{
background:#111;
border:1px solid #00f3ff;
color:#00f3ff;
padding:8px 15px;
margin:4px;
cursor:pointer;
}

button:hover{
background:#00f3ff;
color:#000;
}

#log{
position:absolute;
bottom:0;
width:100%;
height:160px;
overflow:auto;
background:#000;
border-top:1px solid #333;
font-size:12px;
padding:6px;
}

canvas{
position:absolute;
top:0;
left:0;
}

</style>
</head>

<body>

<div id="hud">

<h2>JARVIS ULTRA</h2>

<button onclick="startJarvis()">START</button>
<button onclick="toggleTranslate()">TRANSLATE</button>

</div>

<canvas id="screen"></canvas>

<div id="log"></div>

<script>

let translate=false

function log(t){

let d=document.createElement("div")
d.innerText=new Date().toLocaleTimeString()+" : "+t

document.getElementById("log").prepend(d)

}

function toggleTranslate(){

translate=!translate
log("translate mode "+translate)

}

const AI={

endpoint:"http://localhost:11434/api/generate",
model:"llama3",

async ask(prompt){

try{

let r=await fetch(this.endpoint,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
model:this.model,
prompt:prompt,
stream:false
})
})

let j=await r.json()

return j.response

}catch(e){

log("AI offline")
return "AI error"

}

}

}

async function translateFR(text){

let p=`
Translate French to English:

${text}
`

return await AI.ask(p)

}

async function askJarvis(text){

let p=`
You are Jarvis AI assistant.
Respond briefly.

User:
${text}

Jarvis:
`

return await AI.ask(p)

}

const voice=window.speechSynthesis

function speak(t){

let u=new SpeechSynthesisUtterance(t)

u.lang="en-US"

voice.speak(u)

}

async function process(text){

log("YOU: "+text)

if(translate){

let r=await translateFR(text)

log("EN: "+r)

speak(r)

}else{

let r=await askJarvis(text)

log("JARVIS: "+r)

speak(r)

}

}

function startJarvis(){

startSpeech()
startAudio()

}

function startSpeech(){

const SR=window.SpeechRecognition||window.webkitSpeechRecognition

if(!SR){
log("speech recognition unsupported")
return
}

let rec=new SR()

rec.lang="fr-FR"
rec.continuous=true

rec.onresult=(e)=>{

let txt=e.results[e.results.length-1][0].transcript

process(txt)

}

rec.start()

}

let analyser
let data
let ctx
let canvas

async function startAudio(){

const stream=await navigator.mediaDevices.getUserMedia({audio:true})

const audioCtx=new AudioContext()

const src=audioCtx.createMediaStreamSource(stream)

analyser=audioCtx.createAnalyser()

src.connect(analyser)

data=new Uint8Array(analyser.frequencyBinCount)

canvas=document.getElementById("screen")

ctx=canvas.getContext("2d")

resize()

loop()

}

function resize(){

canvas.width=window.innerWidth
canvas.height=window.innerHeight

}

window.onresize=resize

function loop(){

requestAnimationFrame(loop)

if(!analyser)return

analyser.getByteFrequencyData(data)

ctx.fillStyle="rgba(0,0,0,0.25)"
ctx.fillRect(0,0,canvas.width,canvas.height)

let cx=canvas.width/2
let cy=canvas.height/2

ctx.strokeStyle="#00f3ff"

ctx.beginPath()
ctx.arc(cx,cy,140,0,Math.PI*2)
ctx.stroke()

for(let i=0;i<data.length;i+=6){

let v=data[i]

let angle=i*0.02

let r=140+v

let x=cx+Math.cos(angle)*r
let y=cy+Math.sin(angle)*r

ctx.fillStyle="rgb(0,"+v+",255)"

ctx.fillRect(x,y,3,3)

}

}

</script>

</body>
</html>
