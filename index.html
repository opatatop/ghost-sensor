<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPRA NEURAL AI v3.6 ULTIME MAX</title>
<style>
    :root {
        --bg: #020205;
        --primary: #00f3ff;
        --secondary: #ff00ff;
        --success: #33ff33;
        --danger: #ff3333;
        --panel: rgba(10,10,16,0.97);
        --font: 'Courier New', Courier, monospace;
    }
    * { box-sizing: border-box; }
    body {
        margin:0; background:var(--bg); color:#e0e0e0; font-family:var(--font);
        overflow:hidden; height:100vh; display:flex; flex-direction:column;
    }
    body::before {
        content:""; position:absolute; inset:0;
        background: linear-gradient(rgba(0,243,255,0.035) 1px,transparent 1px),
                    linear-gradient(90deg,rgba(0,243,255,0.035) 1px,transparent 1px);
        background-size: 28px 28px; z-index:0; pointer-events:none;
    }
    header {
        height:62px; background:rgba(0,0,0,0.92); border-bottom:2px solid var(--primary);
        display:flex; justify-content:space-between; align-items:center; padding:0 22px; z-index:10;
    }
    .brand { font-size:1.2rem; font-weight:bold; letter-spacing:3px; color:var(--primary); }
    .brand span { color:var(--secondary); }
    .env-badge { font-size:0.75rem; padding:4px 10px; border-radius:4px; font-weight:bold; }
    .key-ok { background:var(--success); color:#000; }

    .controls { display:flex; gap:9px; }
    button {
        background:rgba(0,0,0,0.7); border:1px solid var(--primary); color:var(--primary);
        padding:8px 18px; font-size:0.85rem; cursor:pointer; transition:all 0.2s;
        text-transform:uppercase; font-family:var(--font);
    }
    button:hover:not(:disabled) { background:var(--primary); color:#000; box-shadow:0 0 15px var(--primary); }
    button.active, button.success { background:var(--danger); color:#fff; }

    #canvas-container { flex:1; position:relative; background:#000; }
    canvas { display:block; width:100%; height:100%; }

    #terminal {
        height:210px; background:var(--panel); border-top:2px solid var(--secondary);
        padding:12px; font-size:13px; overflow-y:auto; scrollbar-color:var(--secondary) #111;
    }
    .log-line { margin:3px 0; padding-left:10px; border-left:3px solid transparent; animation:fade 0.4s; }
    .log-user { color:var(--primary); border-color:var(--primary); }
    .log-ai { color:var(--secondary); border-color:var(--secondary); font-weight:bold; }
    .log-error { color:var(--danger); border-color:var(--danger); }
    .log-success { color:var(--success); border-color:var(--success); }

    @keyframes fade { from {opacity:0; transform:translateX(-10px);} to {opacity:1;} }
</style>
</head>
<body>

<header>
    <div class="brand">SUPRA <span>NEURAL</span> AI <span style="font-size:0.8rem;opacity:0.6;">v3.6 ULTIME</span></div>
    <div id="envBadge" class="env-badge">CHK...</div>
    <div class="controls">
        <button id="btnMic">MICRO</button>
        <button id="btnVoice">ÉCOUTE</button>
        <button id="btnAuto" class="success">🚀 FULL AUTO</button>
        <button id="btnClear">🗑️</button>
        <button id="btnConfig">KEY</button>
    </div>
</header>

<div id="canvas-container"><canvas id="canvas"></canvas></div>
<div id="terminal"></div>

<!-- MODAL -->
<div id="config-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.96);z-index:100;justify-content:center;align-items:center;">
    <div style="background:#111;border:2px solid var(--primary);padding:30px;width:520px;">
        <h3 style="color:var(--primary);margin:0 0 15px;">Clé API (hardcodée mais modifiable)</h3>
        <input type="password" id="apiKeyInput" style="width:100%;padding:12px;background:#000;border:1px solid #555;color:#fff;font-family:monospace;">
        <div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end;">
            <button onclick="toggleModal()" style="background:#333;color:#fff;">FERMER</button>
            <button onclick="saveKey()" style="background:var(--primary);color:#000;font-weight:bold;">SAUVEGARDER</button>
        </div>
    </div>
</div>

<script>
// ====================== CONFIG ======================
const HARDCODED_KEY = "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";

const $ = id => document.getElementById(id);
const Logger = {
    log: (msg, type="sys") => {
        const d = document.createElement("div");
        d.className = `log-line log-${type}`;
        d.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
        $('terminal').appendChild(d);
        $('terminal').scrollTop = $('terminal').scrollHeight;
    },
    success: m => Logger.log(m, "success"),
    error: m => Logger.log(m, "error")
};

// ====================== AI ENGINE ======================
class AIEngine {
    constructor() {
        this.apiKey = localStorage.getItem('supra_key') || HARDCODED_KEY;
        localStorage.setItem('supra_key', this.apiKey);
        this.synth = window.speechSynthesis;
        this.isSpeaking = false;
        this.voices = [];
        speechSynthesis.onvoiceschanged = () => this.voices = speechSynthesis.getVoices();
    }
    async process(text) {
        if (text.length < 2) return;
        Logger.log(`VOIX: "${text}"`, "user");
        const resp = await this.fetchGPT(text);
        this.speak(resp);
    }
    async fetchGPT(p) {
        const res = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {"Content-Type":"application/json","Authorization":`Bearer ${this.apiKey}`},
            body: JSON.stringify({
                model: "gpt-4o-mini",
                messages: [{role:"system",content:"Tu es SUPRA NEURAL AI v3.6. Réponds en français, max 18 mots, style cyberpunk ultra-direct."},{role:"user",content:p}],
                max_tokens: 45
            })
        });
        const data = await res.json();
        return data.choices[0].message.content;
    }
    speak(text) {
        this.synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const frVoice = this.voices.find(v => v.lang.includes('fr'));
        if (frVoice) u.voice = frVoice;
        u.rate = 1.08;
        u.onstart = () => { this.isSpeaking = true; Logger.log(`IA → ${text}`, "ai"); };
        u.onend = () => this.isSpeaking = false;
        this.synth.speak(u);
    }
}

// ====================== AUDIO + VISUALS (MAX) ======================
class AudioEngine {
    constructor() { this.ready = false; }
    async start() {
        if (this.ready) return;
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        const src = ctx.createMediaStreamSource(stream);
        this.analyser = ctx.createAnalyser();
        this.analyser.fftSize = 256;
        src.connect(this.analyser);
        this.data = new Uint8Array(this.analyser.frequencyBinCount);
        this.ready = true;
        Logger.success("MICRO CONNECTÉ");
        $('btnMic').classList.add('active');
    }
    getData() {
        if (!this.ready) return {vol:0, raw:null};
        this.analyser.getByteFrequencyData(this.data);
        let sum = 0; for (let v of this.data) sum += v;
        return {vol: sum / this.data.length, raw: this.data};
    }
}

class Visuals {
    constructor() {
        this.c = $('canvas');
        this.ctx = this.c.getContext('2d');
        this.nodes = Array.from({length:80}, () => ({
            x: Math.random()*innerWidth, y: Math.random()*innerHeight,
            vx: (Math.random()-0.5)*1.8, vy: (Math.random()-0.5)*1.8, s: Math.random()*3+1.5
        }));
        this.isSpeaking = false;
        window.onresize = () => { this.c.width = innerWidth; this.c.height = innerHeight-272; };
        this.c.width = innerWidth; this.c.height = innerHeight-272;
    }
    draw(audio, speaking) {
        const {vol, raw} = audio;
        const w = this.c.width, h = this.c.height;
        this.ctx.fillStyle = "rgba(2,2,5,0.18)";
        this.ctx.fillRect(0,0,w,h);

        // Orb centrale
        const pulse = 45 + vol*0.9 + (speaking ? 25 : 0);
        this.ctx.shadowBlur = 40;
        this.ctx.shadowColor = "#00f3ff";
        this.ctx.beginPath();
        this.ctx.arc(w/2, h/2, pulse, 0, Math.PI*2);
        this.ctx.strokeStyle = `rgba(0,243,255,${speaking ? 0.9 : 0.4})`;
        this.ctx.lineWidth = 5;
        this.ctx.stroke();
        this.ctx.shadowBlur = 0;

        // Nodes + connexions
        for (let n of this.nodes) {
            n.x += n.vx; n.y += n.vy;
            if (n.x<0||n.x>w) n.vx*=-1;
            if (n.y<0||n.y>h) n.vy*=-1;

            this.ctx.fillStyle = "#00f3ff";
            this.ctx.shadowBlur = 12;
            this.ctx.shadowColor = "#00f3ff";
            this.ctx.beginPath();
            this.ctx.arc(n.x, n.y, n.s + vol/30, 0, Math.PI*2);
            this.ctx.fill();
        }
        this.ctx.shadowBlur = 0;

        // Connexions glow
        this.ctx.lineWidth = 1.2;
        for (let i=0; i<this.nodes.length; i++) {
            for (let j=i+1; j<this.nodes.length; j++) {
                const a = this.nodes[i], b = this.nodes[j];
                const d = Math.hypot(a.x-b.x, a.y-b.y);
                if (d < 170) {
                    this.ctx.strokeStyle = `rgba(0,243,255,${(170-d)/170 * 0.55})`;
                    this.ctx.beginPath();
                    this.ctx.moveTo(a.x,a.y);
                    this.ctx.lineTo(b.x,b.y);
                    this.ctx.stroke();
                }
            }
        }

        // Barre fréquence
        if (raw) {
            const bw = w / raw.length;
            for (let i=0; i<raw.length; i++) {
                const height = raw[i]/255 * h*0.38;
                this.ctx.fillStyle = `rgba(255,0,255,0.3)`;
                this.ctx.fillRect(i*bw, h-height, bw-1, height);
            }
        }
    }
}

// ====================== VOICE + APP ======================
class VoiceEngine {
    constructor(cb) {
        this.cb = cb;
        this.rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        this.rec.lang = 'fr-FR';
        this.rec.continuous = true;
        this.rec.interimResults = false;
        this.active = false;

        this.rec.onresult = e => this.cb(e.results[e.results.length-1][0].transcript);
        this.rec.onend = () => { if (this.active) this.rec.start(); };
    }
    toggle() {
        this.active = !this.active;
        this.active ? this.rec.start() : this.rec.stop();
        $('btnVoice').textContent = this.active ? "ÉCOUTE (ON)" : "ÉCOUTE";
        $('btnVoice').classList.toggle('active', this.active);
    }
}

class App {
    constructor() {
        this.audio = new AudioEngine();
        this.ai = new AIEngine();
        this.visuals = new Visuals();
        this.voice = new VoiceEngine(t => this.ai.process(t));

        checkEnvironment();

        // FULL AUTO
        setTimeout(async () => {
            if (this.ai.apiKey) {
                Logger.success("🔑 CLÉ HARDCO DÉTECTÉE");
                $('envBadge').textContent = "KEY OK + AUTO";
                $('envBadge').classList.add('key-ok');
                await this.audio.start();
                this.voice.toggle();
                Logger.success("🚀 TOUT LANCÉ AUTOMATIQUEMENT");
            }
        }, 900);

        // Boutons
        $('btnMic').onclick = () => this.audio.start();
        $('btnVoice').onclick = () => this.voice.toggle();
        $('btnAuto').onclick = () => {
            this.audio.start();
            this.voice.toggle();
        };
        $('btnClear').onclick = () => { $('terminal').innerHTML = ''; Logger.success("Terminal nettoyé"); };
        $('btnConfig').onclick = () => {
            $('apiKeyInput').value = this.ai.apiKey;
            $('config-modal').style.display = 'flex';
        };

        // Raccourci clavier
        document.addEventListener('keydown', e => { if (e.key === " ") this.voice.toggle(); });

        this.loop();
    }
    loop() {
        requestAnimationFrame(() => this.loop());
        this.visuals.draw(this.audio.getData(), this.ai.isSpeaking);
    }
}

function checkEnvironment() {
    const badge = $('envBadge');
    if (location.protocol === "file:") {
        badge.textContent = "FILE://";
        badge.style.background = "red";
    } else {
        badge.textContent = "HTTP OK";
    }
}
window.toggleModal = () => $('config-modal').style.display = 'none';
window.saveKey = () => {
    localStorage.setItem('supra_key', $('apiKeyInput').value.trim());
    Logger.success("CLÉ MISE À JOUR");
    location.reload();
};

const app = new App();
</script>
</body>
</html>
