<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS v23.0 - ULTRA COMPLETE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020202; --neon: #00ff41; --alert: #ff003c; --warn: #fcee0a; 
            --panel: #0a0f14; --border: 1px solid rgba(0, 255, 65, 0.2);
            --font-head: 'Orbitron', sans-serif; --font-mono: 'Share Tech Mono', monospace;
        }

        * { box-sizing: border-box; user-select: none; }
        
        body { 
            margin: 0; padding: 0; background: var(--bg); color: var(--neon); font-family: var(--font-mono); 
            height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- HEADER --- */
        header {
            height: 50px; display: flex; justify-content: space-between; align-items: center; 
            padding: 0 20px; background: var(--panel); border-bottom: var(--border);
        }
        .brand { font-family: var(--font-head); font-weight: 900; letter-spacing: 3px; }
        .sys-clock { color: #666; font-size: 0.9rem; }

        /* --- MAIN GRID --- */
        #main-grid {
            flex: 1; display: grid; 
            grid-template-columns: 280px 1fr 300px; 
            grid-template-rows: 1fr 120px; 
            gap: 1px; background: #222; overflow: hidden;
        }

        /* --- ZONES --- */
        .panel { background: var(--panel); padding: 15px; display: flex; flex-direction: column; position: relative; }
        .panel-title { 
            font-size: 0.7rem; color: #666; text-transform: uppercase; letter-spacing: 2px; 
            border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 15px; display: flex; justify-content: space-between;
        }

        /* 1. CONTROLS (Left Top) */
        #zone-controls { grid-row: 1 / 3; border-right: var(--border); }
        
        .control-group { margin-bottom: 20px; }
        .control-label { font-size: 0.8rem; color: #888; margin-bottom: 5px; display: block; }
        
        input[type="range"] { width: 100%; background: #222; height: 4px; -webkit-appearance: none; border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--neon); border-radius: 50%; cursor: pointer; }
        
        select { width: 100%; background: #111; color: #fff; border: 1px solid #444; padding: 5px; font-family: inherit; }

        /* 2. VISUALIZER (Center Top) */
        #zone-visual { grid-column: 2; grid-row: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden; }
        
        #radar-canvas { position: absolute; z-index: 1; }
        #wave-canvas { position: absolute; z-index: 2; opacity: 0.5; }
        
        #core-text {
            z-index: 10; text-align: center; pointer-events: none; text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }
        #detection-tag {
            font-size: 0.8rem; color: var(--warn); letter-spacing: 2px; background: rgba(0,0,0,0.7); padding: 2px 10px; border: 1px solid var(--warn); display: inline-block; margin-bottom: 10px;
        }
        #main-readout { font-family: var(--font-head); font-size: 2.5rem; font-weight: 900; margin: 0; line-height: 1; min-height: 50px; }

        /* 3. LOGS & CHAT (Right Top) */
        #zone-logs { grid-column: 3; grid-row: 1 / 3; border-left: var(--border); }
        
        #chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 0.8rem; padding-right: 5px; }
        .msg { padding: 8px; border-radius: 4px; max-width: 90%; word-wrap: break-word; }
        .msg.user { align-self: flex-end; background: rgba(0, 255, 65, 0.1); border: 1px solid var(--neon); color: #fff; text-align: right; }
        .msg.jarvis { align-self: flex-start; background: rgba(255, 255, 255, 0.05); border: 1px solid #333; color: var(--neon); }
        .msg.sys { align-self: center; color: #555; font-style: italic; font-size: 0.7rem; }

        /* 4. GRAPHS & INPUT (Bottom) */
        #zone-metrics { grid-column: 2; grid-row: 2; border-top: var(--border); display: grid; grid-template-columns: 1fr 250px; gap: 10px; padding: 10px; }
        
        .graph-container { position: relative; height: 100%; background: #080808; border: 1px solid #222; }
        .graph-label { position: absolute; top: 5px; left: 5px; font-size: 0.7rem; color: #444; }
        
        #input-area { display: flex; flex-direction: column; gap: 5px; }
        #chat-input { 
            background: #111; border: 1px solid #444; color: #fff; padding: 10px; 
            font-family: var(--font-mono); width: 100%; resize: none; height: 60px;
        }
        #chat-input:focus { outline: none; border-color: var(--neon); }
        
        .btn-send { 
            background: var(--neon); color: #000; border: none; padding: 8px; 
            font-family: var(--font-head); font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        .btn-send:hover { opacity: 0.8; }

        /* BIG MIC BUTTON (Overlay) */
        #mic-btn {
            position: absolute; bottom: 20px; right: 320px; width: 60px; height: 60px; 
            border-radius: 50%; background: rgba(0,0,0,0.8); border: 2px solid #333; 
            color: #666; font-size: 1.5rem; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100; transition: all 0.3s;
        }
        #mic-btn:hover { border-color: var(--neon); color: var(--neon); transform: scale(1.1); }
        #mic-btn.listening { border-color: var(--alert); color: var(--alert); box-shadow: 0 0 20px var(--alert); animation: pulse 1s infinite; }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(255, 0, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0); } }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon); }
    </style>
</head>
<body>

    <header>
        <div class="brand">JARVIS <span style="color:#666">// ULTRA COMPLETE</span></div>
        <div class="sys-clock" id="clock">00:00:00</div>
    </header>

    <div id="main-grid">
        <!-- ZONE 1: CONTROLS & OPTIONS -->
        <aside id="zone-controls" class="panel">
            <div class="panel-title">Configuration Système</div>
            
            <div class="control-group">
                <span class="control-label">Langue Vocale</span>
                <select id="opt-lang" onchange="updateConfig()">
                    <option value="fr-FR">Français</option>
                    <option value="en-US">English (US)</option>
                    <option value="es-ES">Español</option>
                    <option value="de-DE">Deutsch</option>
                </select>
            </div>

            <div class="control-group">
                <span class="control-label">Vitesse Parole: <span id="val-rate">1.0</span>x</span>
                <input type="range" min="0.5" max="2" step="0.1" value="1" oninput="document.getElementById('val-rate').innerText=this.value; updateConfig()">
            </div>

            <div class="control-group">
                <span class="control-label">Hauteur Voix: <span id="val-pitch">1.0</span></span>
                <input type="range" min="0.5" max="2" step="0.1" value="1" oninput="document.getElementById('val-pitch').innerText=this.value; updateConfig()">
            </div>

            <div class="control-group">
                <span class="control-label">Sensibilité Audio</span>
                <input type="range" min="0" max="100" value="50">
            </div>

            <div class="panel-title" style="margin-top:20px;">Modules Actifs</div>
            <div class="control-group">
                <label style="color:#fff; display:flex; align-items:center; gap:10px; cursor:pointer;">
                    <input type="checkbox" id="chk-math" checked> Calculatrice
                </label>
                <label style="color:#fff; display:flex; align-items:center; gap:10px; cursor:pointer; margin-top:5px;">
                    <input type="checkbox" id="chk-web" checked> Recherche Web
                </label>
            </div>
            
            <div style="margin-top:auto; font-size:0.7rem; color:#444;">
                v23.0 ULTRA BUILD<br>
                CORE: ACTIVE
            </div>
        </aside>

        <!-- ZONE 2: VISUALISATION CENTRALE -->
        <main id="zone-visual">
            <canvas id="radar-canvas"></canvas>
            <canvas id="wave-canvas"></canvas>
            
            <div id="core-text">
                <div id="detection-tag" style="display:none;">DÉTECTION</div>
                <h1 id="main-readout">STANDBY</h1>
            </div>

            <!-- BOUTON MICRO FLOTTANT -->
            <div id="mic-btn" onclick="toggleMic()" title="Activer Micro">🎙️</div>
        </main>

        <!-- ZONE 3: LOGS & HISTORIQUE -->
        <aside id="zone-logs" class="panel">
            <div class="panel-title">Flux de Données</div>
            <div id="chat-history">
                <div class="msg sys">Système initialisé v23.0</div>
                <div class="msg sys">En attente d'input audio ou texte...</div>
            </div>
        </aside>

        <!-- ZONE 4: GRAPHIQUES & INPUT -->
        <section id="zone-metrics">
            <!-- Mini Graphiques Barres -->
            <div class="graph-container">
                <div class="graph-label">AUDIO SPECTRUM ANALYSIS</div>
                <canvas id="bar-canvas" style="width:100%; height:100%;"></canvas>
            </div>
            
            <!-- Zone de Saisie Texte -->
            <div id="input-area">
                <textarea id="chat-input" placeholder="Écris une commande ici..."></textarea>
                <button class="btn-send" onclick="sendText()">ENVOYER</button>
            </div>
        </section>
    </div>

    <script>
        /* ==============================================================================
           JARVIS v23.0 - COMPLETE ENGINE
           ============================================================================== */

        // --- CONFIGURATION ---
        const Config = {
            lang: 'fr-FR', rate: 1, pitch: 1,
            math: true, web: true
        };

        const State = { active: false, speaking: false };
        let audioCtx, analyser, dataArray, waveArray;
        let recognition;

        // --- AUDIO SETUP (MULTI-CANVAS) ---
        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                
                const src = audioCtx.createMediaStreamSource(stream);
                src.connect(analyser);
                
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength); // Pour Spectrum
                waveArray = new Uint8Array(bufferLength); // Pour Waveform
                
                drawAll();
                return true;
            } catch (e) {
                log("Erreur Micro: " + e.message, "sys");
                return false;
            }
        }

        function drawAll() {
            if (!State.active) return;
            requestAnimationFrame(drawAll);
            
            analyser.getByteFrequencyData(dataArray); // Spectre (Barres + Radar)
            analyser.getByteTimeDomainData(waveArray); // Onde (Ligne)

            // 1. Dessin Radar (Centre)
            drawRadar(dataArray);
            
            // 2. Dessin Onde (Centre Overlay)
            drawWave(waveArray);

            // 3. Dessin Barres (Bas Gauche)
            drawBars(dataArray);
        }

        function drawRadar(data) {
            const cvs = document.getElementById('radar-canvas');
            const ctx = cvs.getContext('2d');
            const w = cvs.width = cvs.parentElement.clientWidth;
            const h = cvs.height = cvs.parentElement.clientHeight;
            const cx = w/2, cy = h/2, radius = Math.min(w,h)/3;

            ctx.clearRect(0,0,w,h);
            ctx.beginPath();
            ctx.strokeStyle = Config.math ? 'var(--neon)' : '#444';
            ctx.lineWidth = 2;

            // Dessiner cercle audio
            for (let i = 0; i < data.length; i+=5) { // Skip steps for performance/style
                const v = data[i] / 255.0;
                const r = radius + (v * 50); // Rayon dynamique
                const angle = (i / data.length) * Math.PI * 2;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                if(i===0) ctx.moveTo(x,y);
                else ctx.lineTo(x,y);
            }
            ctx.closePath();
            ctx.stroke();
            
            // Cercle central pulse si parle
            if (State.speaking) {
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.8 + Math.sin(Date.now()/100)*5, 0, Math.PI*2);
                ctx.fillStyle = "rgba(0,255,65,0.1)";
                ctx.fill();
            }
        }

        function drawWave(data) {
            const cvs = document.getElementById('wave-canvas');
            const ctx = cvs.getContext('2d');
            const w = cvs.width = cvs.parentElement.clientWidth;
            const h = cvs.height = cvs.parentElement.clientHeight;

            ctx.clearRect(0,0,w,h);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            const sliceW = w * 1.0 / data.length;
            let x = 0;
            for(let i=0; i<data.length; i++) {
                const v = data[i] / 128.0;
                const y = v * h/2;
                if(i===0) ctx.moveTo(x,y);
                else ctx.lineTo(x,y);
                x+=sliceW;
            }
            ctx.stroke();
        }

        function drawBars(data) {
            const cvs = document.getElementById('bar-canvas');
            const ctx = cvs.getContext('2d');
            const w = cvs.width = cvs.parentElement.clientWidth;
            const h = cvs.height = cvs.parentElement.clientHeight;
            
            ctx.clearRect(0,0,w,h);
            const barW = (w / 64); // 64 barres
            
            for(let i=0; i<64; i++) {
                // Prendre un échantillon tous les X
                const val = data[i * 4]; 
                const barH = (val / 255) * h;
                
                // Couleur dynamique
                ctx.fillStyle = val > 200 ? 'var(--alert)' : (val > 100 ? 'var(--warn)' : 'var(--neon)');
                ctx.fillRect(i * barW, h - barH, barW - 2, barH);
            }
        }

        // --- RECONNAISSANCE & LOGIQUE ---
        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return log("Navigateur incompatible", "sys");

            recognition = new SR();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = Config.lang;

            recognition.onstart = () => {
                document.getElementById('mic-btn').classList.add('listening');
            };
            recognition.onend = () => { if(State.active) recognition.start(); };
            
            recognition.onresult = (e) => {
                const text = e.results[e.results.length-1][0].transcript;
                processInput(text, true);
            };
        }

        // --- CERVEAU AVANCÉ (DÉTECTIONS) ---
        function processInput(text, isVoice) {
            const t = text.toLowerCase();
            const readout = document.getElementById('main-readout');
            const tag = document.getElementById('detection-tag');
            
            readout.innerText = text.toUpperCase();
            log(text, "user");

            let response = "Commande inconnue.";
            let detected = null;

            // 1. DÉTECTION MATHÉMATIQUE
            if (Config.math && /\d/.test(t) && /plus|moins|fois|divisé|egal|font|égale/.test(t)) {
                // Nettoyage basique pour le calcul
                let clean = t.replace("combien font", "")
                                .replace("égal", "=")
                                .replace("fois", "*")
                                .replace("plus", "+")
                                .replace("moins", "-")
                                .replace("divisé", "/")
                                .replace("?", "");
                try {
                    // Attention: eval est dangereux en prod, ok pour une app locale
                    const res = eval(clean); 
                    response = `Le résultat est ${res}.`;
                    detected = "CALCUL MATHÉMATIQUE";
                } catch(e) { response = "Calcul impossible."; }
            }
            // 2. DÉTECTION RECHERCHE
            else if (Config.web && (t.includes("cherche") || t.includes("trouve") || t.includes("google"))) {
                const query = t.replace("cherche", "").replace("trouve", "").replace("sur google", "").trim();
                const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                response = `Ouverture de Google pour : ${query}`;
                window.open(url, '_blank');
                detected = "RECHERCHE WEB";
            }
            // 3. DÉTECTION HEURE
            else if (t.includes("heure")) {
                response = `Il est ${new Date().toLocaleTimeString(Config.lang)}.`;
                detected = "INFORMATION TEMPS";
            }
            // 4. DÉTECTION EFFACEMENT
            else if (t.includes("efface") || t.includes("nettoie")) {
                document.getElementById('chat-history').innerHTML = '';
                response = "Historique effacé.";
                detected = "MAINTENANCE SYSTÈME";
            }
            // 5. RÉPONSE PAR DÉFAUT
            else {
                response = `J'ai entendu: "${text}". Que puis-je faire ?`;
                detected = "INPUT STANDARD";
            }

            // Affichage Détection
            if(detected) {
                tag.style.display = 'inline-block';
                tag.innerText = detected;
                setTimeout(() => tag.style.display = 'none', 3000);
            }

            // Réponse
            log(response, "jarvis");
            speak(response);
        }

        // --- INTERACTIONS ---
        function sendText() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;
            
            processInput(text, false);
            input.value = '';
        }

        // Permettre 'Entrée' pour envoyer
        document.getElementById('chat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendText();
            }
        });

        function speak(txt) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(txt);
            u.lang = Config.lang;
            u.rate = Config.rate;
            u.pitch = Config.pitch;
            
            u.onstart = () => State.speaking = true;
            u.onend = () => State.speaking = false;
            
            window.speechSynthesis.speak(u);
        }

        function log(msg, type="sys") {
            const c = document.getElementById('chat-history');
            const d = document.createElement('div');
            d.className = `msg ${type}`;
            d.innerText = msg;
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }

        function updateConfig() {
            Config.lang = document.getElementById('opt-lang').value;
            Config.rate = parseFloat(document.getElementById('val-rate').innerText);
            Config.pitch = parseFloat(document.getElementById('val-pitch').innerText);
            
            if(recognition) recognition.lang = Config.lang;
            log("Configuration mise à jour.", "sys");
        }

        async function toggleMic() {
            State.active = !State.active;
            const btn = document.getElementById('mic-btn');
            
            if (State.active) {
                if(!audioCtx) await initAudio();
                if(!recognition) initSpeech();
                recognition.start();
                btn.style.borderColor = 'var(--neon)';
                btn.style.color = 'var(--neon)';
            } else {
                recognition.stop();
                btn.style.borderColor = '#333';
                btn.style.color = '#666';
            }
        }

        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
    </script>
</body>
</html>
