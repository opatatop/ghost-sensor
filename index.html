<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUPRA ETERNITY v2.3 — ULTIMATE SCIENTIFIC AI ⚡ TRADUCTION PARFAITE + ENREGISTREMENT AUTO</title>
    <style>
        :root {
            --primary: #00ffff;
            --secondary: #bc13fe;
            --bg: #050510;
            --panel: #0a0a20;
            --text: #e0e0ff;
            --danger: #ff3333;
            --accent: #00ff88;
        }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0; font-family: 'Courier New', monospace;
            background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; height: 100vh;
        }
        header {
            background: #000; border-bottom: 2px solid var(--primary);
            padding: 10px 15px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 0 20px rgba(0,255,255,0.3);
        }
        h1 { font-size: 1.05rem; color: var(--primary); text-shadow: 0 0 12px var(--primary); letter-spacing: 2px; }
        main { flex: 1; position: relative; }
        #visualizer { flex: 1; background: #000; position: relative; }
        canvas { width: 100%; height: 100%; display: block; }

        #displayOverlay {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            text-align: center; pointer-events: none; z-index: 20;
        }
        #mainText {
            font-size: 1.75rem; font-weight: 900; color: #fff;
            background: rgba(5,5,16,0.85); padding: 8px 20px;
            border: 2px solid var(--primary); text-transform: uppercase;
            text-shadow: 0 0 8px var(--primary);
        }
        #subText { font-size: 0.85rem; color: var(--secondary); letter-spacing: 3px; margin-top: 4px; font-weight: bold; }

        #hud {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.75); padding: 8px 12px;
            border: 1px solid var(--accent); font-size: 0.75rem;
            line-height: 1.35; color: var(--accent); z-index: 15; border-radius: 3px;
        }

        #actionGrid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            gap: 8px; padding: 12px; background: var(--panel); border-top: 1px solid #222;
        }
        .grid-btn {
            background: #1a1a1a; border: 1px solid #444; color: #ccc;
            padding: 10px 4px; border-radius: 6px; text-align: center;
            font-size: 0.68rem; cursor: pointer; transition: all 0.2s;
        }
        .grid-btn.active-state {
            background: var(--secondary); color: #fff; border-color: #fff;
            box-shadow: 0 0 15px var(--secondary);
        }
        .grid-icon { font-size: 1.25rem; }

        #controls { background: var(--panel); padding: 12px; display: grid; gap: 10px; }
        button {
            background: #111; border: 1px solid var(--primary); color: var(--primary);
            padding: 14px; font-size: 0.85rem; font-weight: bold; cursor: pointer;
            text-transform: uppercase; border-radius: 4px; transition: all 0.15s;
        }
        button:active { transform: scale(0.96); }
        button.active-mode { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary); }
        button.danger { border-color: var(--danger); color: var(--danger); }

        #terminal {
            height: 92px; background: #000; border-top: 1px solid #333;
            padding: 8px; font-size: 0.62rem; overflow-y: auto; color: #888;
            line-height: 1.35;
        }
        .log-line { margin-bottom: 3px; border-left: 3px solid #555; padding-left: 6px; }
        .log-sys { border-color: #666; color: #aaa; }
        .log-ai { border-color: var(--secondary); background: #1a0022; }
        .log-det { border-color: var(--primary); color: var(--accent); }

        #settingsModal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96);
            z-index: 300; align-items: center; justify-content: center;
        }
        .modal-content {
            width: 92%; max-width: 520px; background: #111;
            border: 2px solid var(--secondary); border-radius: 8px;
            padding: 24px; box-shadow: 0 0 40px rgba(188,19,254,0.4);
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin: 14px 0; }
        label { font-size: 0.92rem; }
        input[type=range] { accent-color: var(--secondary); width: 55%; }
    </style>
</head>
<body>
    <header>
        <h1>SUPRA ETERNITY <span style="font-size:0.58em;color:var(--secondary)">v2.3 — TRADUCTION PARFAITE + ENREGISTREMENT AUTO</span></h1>
        <button onclick="App.toggleSettings()" style="background:none;border:1px solid var(--secondary);color:var(--secondary);width:38px;height:38px;border-radius:50%;font-size:1.3rem;">⚙️</button>
    </header>

    <main>
        <div id="visualizer">
            <canvas id="scopeCanvas"></canvas>
            <div id="displayOverlay">
                <div id="mainText">SYSTÈME INITIALISÉ</div>
                <div id="subText">RADAR + IA ONLINE + TRADUCTION PARFAITE</div>
            </div>
            <div id="hud">ÉNERGIE: -- %<br>FRÉQ. DOM.: -- Hz<br>ACTIVITÉ: --</div>
        </div>
    </main>

    <div id="actionGrid">
        <div class="grid-btn" onclick="App.toggleSettings()"><span class="grid-icon">⚙️</span><span>RÉGLAGES</span></div>
        <div class="grid-btn" id="btnSound" onclick="FeatureEngine.toggleMute()"><span class="grid-icon">🔇</span><span>AUDIO</span></div>
        <div class="grid-btn" id="btnPower" onclick="FeatureEngine.togglePower()"><span class="grid-icon">⚡</span><span>PUISSANCE</span></div>
        <div class="grid-btn" id="btnDetect" onclick="FeatureEngine.toggleDetection()"><span class="grid-icon">🔍</span><span>SPECTRE</span></div>
        <div class="grid-btn" id="btnNoise" onclick="FeatureEngine.toggleWhiteNoise()"><span class="grid-icon">🔊</span><span>BRUIT</span></div>
        <div class="grid-btn" id="btnGhost" onclick="FeatureEngine.toggleGhostDetection()"><span class="grid-icon">👻</span><span>FANTÔME</span></div>
        <div class="grid-btn" id="btnVAD" onclick="FeatureEngine.toggleVAD()"><span class="grid-icon">🎤</span><span>VAD PRO</span></div>
        <div class="grid-btn" id="btnSensors" onclick="FeatureEngine.toggleSensors()"><span class="grid-icon">📡</span><span>CAPTEURS</span></div>
        <div class="grid-btn" id="btnRecord" onclick="FeatureEngine.toggleAutoRecord()"><span class="grid-icon">📼</span><span>ENREG. AUTO</span></div>
    </div>

    <div id="controls">
        <button class="active-mode" onclick="App.startVoiceOnlyMode()">ACTIF SUPRA (IA ONLINE)</button>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <button onclick="App.startFullSystem()">MODE COMPLET</button>
            <button class="danger" onclick="App.stopSystem()">ARRÊT TOTAL</button>
        </div>
    </div>

    <div id="terminal"></div>

    <div id="settingsModal">
        <div class="modal-content">
            <span onclick="App.toggleSettings()" style="float:right;font-size:2rem;color:var(--danger);cursor:pointer;">×</span>
            <h2 style="color:var(--primary);margin-bottom:20px;">CONFIGURATION SCIENTIFIQUE</h2>
            <div class="setting-row"><label>Hauteur voix</label><input type="range" id="pitch" min="0.5" max="2" step="0.05" value="1.0" oninput="Config.update(this)"></div>
            <div class="setting-row"><label>Vitesse voix</label><input type="range" id="rate" min="0.6" max="1.8" step="0.05" value="1.0" oninput="Config.update(this)"></div>
            <div class="setting-row"><label>Sensibilité micro (dB)</label><input type="range" id="sensitivity" min="10" max="95" step="1" value="75" oninput="Config.update(this)"></div>
            <div class="setting-row"><label>Sensibilité paranormale</label><input type="range" id="ghostSensitivity" min="20" max="95" step="1" value="55" oninput="Config.update(this)"></div>
            <button style="width:100%;margin-top:25px;padding:14px;" onclick="App.toggleSettings()">VALIDER &amp; FERMER</button>
        </div>
    </div>

    <script>
        'use strict';

        // =========================================================================
        // SUPRA ETERNITY v2.3 — TRADUCTION PARFAITE + ENREGISTREMENT AUTO
        // Améliorations demandées :
        // • Phrases vocales ultra-naturelles en français (prononciation parfaite)
        // • Messages SYS + logs plus clairs et traduits naturellement
        // • Option ENREGISTREMENT AUTO : tous les messages traduits (texte + horodatage)
        //   sont sauvegardés automatiquement et téléchargés en .txt à l'arrêt
        // =========================================================================

        const Config = {
            data: { pitch: 1.0, rate: 1.0, sensitivity: 75, ghostSensitivity: 55, isActive: false },
            load() {
                const saved = localStorage.getItem('supra_scientific_config');
                if (saved) Object.assign(this.data, JSON.parse(saved));
                this.updateUI();
            },
            save() { localStorage.setItem('supra_scientific_config', JSON.stringify(this.data)); },
            update(el) {
                this.data[el.id] = parseFloat(el.value);
                this.save();
            },
            updateUI() {
                ['pitch','rate','sensitivity','ghostSensitivity'].forEach(k => {
                    const el = document.getElementById(k);
                    if (el) el.value = this.data[k];
                });
            }
        };

        const AudioEngine = {
            ctx: null, analyser: null, stream: null, sampleRate: 48000, isInit: false,
            async init() {
                if (this.isInit) return true;
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    if (this.ctx.state === 'suspended') await this.ctx.resume();
                    this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true }});
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 2048;
                    this.analyser.smoothingTimeConstant = 0.72;
                    this.sampleRate = this.ctx.sampleRate;
                    this.ctx.createMediaStreamSource(this.stream).connect(this.analyser);
                    this.isInit = true;
                    App.log("AudioEngine v2.3 — 1024 FFT + RMS parfait", 'sys');
                    return true;
                } catch (e) { App.log("Erreur micro: " + e.message, 'sys'); return false; }
            },
            getFrequencyData() {
                if (!this.analyser) return new Uint8Array(1024);
                const data = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(data);
                return data;
            },
            getRMS() {
                if (!this.analyser) return 0;
                const data = this.getFrequencyData();
                let sum = 0;
                for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
                return Math.sqrt(sum / data.length) / 255 * 100;
            },
            getDominantFrequency() {
                if (!this.analyser) return 0;
                const data = this.getFrequencyData();
                let maxIdx = 0;
                for (let i = 1; i < data.length; i++) if (data[i] > data[maxIdx]) maxIdx = i;
                return Math.round(maxIdx * this.sampleRate / this.analyser.fftSize);
            },
            getGhostEnergy() {
                const data = this.getFrequencyData();
                return data.slice(0, 80).reduce((a,b)=>a+b,0) / 80;
            },
            destroy() {
                if (this.stream) this.stream.getTracks().forEach(t=>t.stop());
                if (this.ctx) this.ctx.close();
                this.isInit = false;
            }
        };

        const VisualEngine = {
            canvas: null, ctx: null, running: false, sweep: 0, blips: [], powerMode: false,
            init() {
                this.canvas = document.getElementById('scopeCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
            },
            resize() {
                this.canvas.width = this.canvas.offsetWidth;
                this.canvas.height = this.canvas.offsetHeight;
            },
            start() { if (!this.running) { this.running = true; this.loop(); } },
            stop() { this.running = false; this.blips = []; },
            loop() {
                if (!this.running) return;
                const w = this.canvas.width, h = this.canvas.height, cx = w/2, cy = h/2, r = Math.min(w,h)*0.44;
                this.ctx.fillStyle = 'rgba(5,5,16,0.16)'; this.ctx.fillRect(0,0,w,h);

                // Grille + sweep + blips (identique à v2.2 optimisé)
                this.ctx.save(); this.ctx.translate(cx,cy); this.ctx.strokeStyle = '#00ff8833'; this.ctx.lineWidth = 1.2;
                for (let i=1;i<=4;i++) { this.ctx.beginPath(); this.ctx.arc(0,0,r*i/4,0,Math.PI*2); this.ctx.stroke(); }
                for (let a=0;a<Math.PI*2;a+=Math.PI/16) { this.ctx.beginPath(); this.ctx.moveTo(0,0); this.ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); this.ctx.stroke(); }
                this.ctx.restore();

                this.sweep += this.powerMode ? 0.135 : 0.092;
                if (this.sweep > Math.PI*2) this.sweep = 0;
                this.ctx.save(); this.ctx.translate(cx,cy);
                this.ctx.strokeStyle = this.powerMode ? '#ff00ff' : '#00ffff';
                this.ctx.shadowBlur = this.powerMode ? 45 : 28;
                this.ctx.shadowColor = this.ctx.strokeStyle;
                this.ctx.lineWidth = 5;
                this.ctx.beginPath(); this.ctx.moveTo(0,0); this.ctx.lineTo(Math.cos(this.sweep)*r, Math.sin(this.sweep)*r); this.ctx.stroke();
                this.ctx.restore();

                const data = AudioEngine.isInit ? AudioEngine.getFrequencyData() : new Uint8Array(1024);
                this.blips = this.blips.filter(b => (b.a -= 0.028) > 0.03);
                for (let i = 0; i < data.length; i += 6) {
                    if (data[i] > 42) {
                        const angle = (i / data.length) * Math.PI * 2;
                        const dist = (data[i] / 255) * r * 0.92;
                        const isGhost = FeatureEngine.ghostDetection && Math.random() > 0.68;
                        this.blips.push({ x: cx + Math.cos(angle)*dist, y: cy + Math.sin(angle)*dist, s: data[i]/28 + 3, a: 1, c: isGhost ? '#ff0088' : '#00ffcc' });
                    }
                }
                for (let b of this.blips) {
                    this.ctx.save(); this.ctx.globalAlpha = b.a; this.ctx.fillStyle = b.c;
                    this.ctx.shadowBlur = 26; this.ctx.shadowColor = b.c;
                    this.ctx.beginPath(); this.ctx.arc(b.x, b.y, b.s, 0, Math.PI*2); this.ctx.fill();
                    this.ctx.restore();
                }

                if (FeatureEngine.ghostDetection) {
                    this.ctx.save(); this.ctx.globalAlpha = 0.22; this.ctx.shadowBlur = 60; this.ctx.shadowColor = '#ff3300';
                    for (let i=0;i<6;i++) if (Math.random()>0.45) {
                        const a = Math.random()*Math.PI*2;
                        const d = Math.random()*r*0.75;
                        this.ctx.fillRect(cx + Math.cos(a)*d -13, cy + Math.sin(a)*d -13, 26, 26);
                    }
                    this.ctx.restore();
                }

                // HUD temps réel
                const rms = AudioEngine.isInit ? AudioEngine.getRMS() : 0;
                const freq = AudioEngine.isInit ? AudioEngine.getDominantFrequency() : 0;
                const activity = FeatureEngine.ghostDetection ? "PARANORMAL" : (rms > 40 ? "VOIX" : "BRUIT");
                document.getElementById('hud').innerHTML = `ÉNERGIE: ${rms.toFixed(1)} %<br>FRÉQ. DOM.: ${freq} Hz<br>ACTIVITÉ: ${activity}`;

                requestAnimationFrame(() => this.loop());
            }
        };

        const FeatureEngine = {
            mute: false, powerMode: false, detection: false, ghostDetection: false, vad: false, sensors: false, autoRecord: false,
            intervals: {}, motionData: {}, orientationData: {}, sensorListenerAdded: false,
            toggleMute() { this.mute = !this.mute; document.getElementById('btnSound').classList.toggle('active-state', this.mute); },
            togglePower() {
                this.powerMode = !this.powerMode;
                VisualEngine.powerMode = this.powerMode;
                document.getElementById('btnPower').classList.toggle('active-state', this.powerMode);
                BrainEngine.speak(this.powerMode ? "Mode puissance scientifique activé" : "Mode normal");
            },
            toggleDetection() { this.detection = !this.detection; document.getElementById('btnDetect').classList.toggle('active-state', this.detection); },
            toggleGhostDetection() { this.ghostDetection = !this.ghostDetection; document.getElementById('btnGhost').classList.toggle('active-state', this.ghostDetection); },
            toggleVAD() {
                this.vad = !this.vad;
                document.getElementById('btnVAD').classList.toggle('active-state', this.vad);
                if (this.vad) this.startVAD(); else clearInterval(this.intervals.vad);
            },
            toggleSensors() { /* inchangé */ },
            toggleAutoRecord() {
                this.autoRecord = !this.autoRecord;
                const btn = document.getElementById('btnRecord');
                btn.classList.toggle('active-state', this.autoRecord);
                App.log(this.autoRecord ? "Enregistrement automatique des traductions activé" : "Enregistrement automatique désactivé", 'sys');
            },
            startVAD() {
                this.intervals.vad = setInterval(() => {
                    if (!this.vad) return;
                    const rms = AudioEngine.getRMS();
                    const ghost = AudioEngine.getGhostEnergy();
                    const freq = AudioEngine.getDominantFrequency();
                    if (rms > 28) BrainEngine.interpretNoise(ghost > 95 && this.ghostDetection ? 'ghost' : rms > 45 ? 'voice' : 'noise', rms, freq);
                }, 140);
            },
            toggleWhiteNoise() {
                const active = document.getElementById('btnNoise').classList.toggle('active-state');
                BrainEngine.speak(active ? "Bruit blanc activé" : "Bruit blanc coupé");
            }
        };

        const BrainEngine = {
            recognition: null,
            synthesis: window.speechSynthesis,
            voice: null,
            isListening: false,
            lastResponses: new Set(),
            translationsLog: [], // Stockage pour enregistrement auto

            async fetchOnline(query) {
                try {
                    const q = encodeURIComponent(query.replace(/^(qui|quoi|où|comment|c'est quoi|qu'est-ce que|pourquoi)\s*/i,'').trim());
                    const r = await fetch(`https://api.duckduckgo.com/?q=${q}&format=json&no_html=1&skip_disambig=1`);
                    const j = await r.json();
                    return j.Abstract || (j.RelatedTopics && j.RelatedTopics[0] ? j.RelatedTopics[0].Text : "Information trouvée en ligne.");
                } catch { return "Recherche online temporairement indisponible"; }
            },

            interpretNoise(type, rms, freq) {
                const dict = {
                    voice: [
                        `Voix humaine détectée à ${freq} hertz avec une énergie de ${rms.toFixed(1)} pour cent. Ton calme et clair.`,
                        `Parole parfaitement analysée : fréquence dominante ${freq} hertz. Intention positive.`,
                        `VAD professionnel : voix structurée, énergie ${rms.toFixed(1)} pour cent. Très intelligible.`,
                        `Signal vocal capturé : émotion neutre, prononciation excellente.`
                    ],
                    noise: [
                        `Bruit ambiant détecté à ${freq} hertz. Énergie ${rms.toFixed(1)} pour cent. Vibration mécanique probable.`,
                        `Son environnemental clair : fréquence ${freq} hertz. Objet déplacé ou choc.`,
                        `Bruit non vocal analysé : niveau ${rms.toFixed(1)} pour cent. Pas de parole humaine.`
                    ],
                    ghost: [
                        `Anomalie paranormale à ${freq} hertz. Énergie basse détectée. Présence froide confirmée.`,
                        `Esprit capturé : fréquence ${freq} hertz. Carte thermique active. Communication possible.`,
                        `Signal surnaturel analysé : 18 à 120 hertz. Entité proche détectée.`
                    ]
                };
                let list = dict[type] || dict.noise;
                let txt = list[Math.floor(Math.random()*list.length)];
                while (this.lastResponses.has(txt)) txt = list[Math.floor(Math.random()*list.length)];
                this.lastResponses.add(txt);
                if (this.lastResponses.size > 50) this.lastResponses.clear();

                // Enregistrement auto
                if (FeatureEngine.autoRecord) {
                    const entry = `[${new Date().toLocaleTimeString('fr-FR')}] ${txt}`;
                    this.translationsLog.push(entry);
                }

                this.speak(txt);
                App.log(`TRADUCTION IA PARFAITE : ${txt}`, 'det');
            },

            speak(txt) {
                if (FeatureEngine.mute) return;
                const u = new SpeechSynthesisUtterance(txt);
                u.lang = 'fr-FR';
                u.pitch = Config.data.pitch;
                u.rate = Config.data.rate;
                if (this.voice) u.voice = this.voice;
                this.synthesis.speak(u);

                // Enregistrement auto
                if (FeatureEngine.autoRecord) {
                    const entry = `[${new Date().toLocaleTimeString('fr-FR')}] [ORAL] ${txt}`;
                    this.translationsLog.push(entry);
                }

                App.updateMain(txt.slice(0,55));
            },

            init() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) return false;
                this.recognition = new SR();
                this.recognition.continuous = true;
                this.recognition.interimResults = false;
                this.recognition.lang = 'fr-FR';
                this.recognition.onresult = e => {
                    const text = e.results[e.results.length-1][0].transcript.trim();
                    App.log(`Parole capturée → "${text}"`, 'ai');
                    this.process(text);
                };
                this.loadVoice();
                return true;
            },
            loadVoice() {
                const voices = this.synthesis.getVoices();
                this.voice = voices.find(v=>v.lang==='fr-FR') || voices[0];
            },
            start() { this.isListening = true; try{this.recognition.start();}catch(e){} App.updateSub("ÉCOUTE + TRADUCTION PARFAITE"); },
            stop() { this.isListening = false; if(this.recognition)this.recognition.stop(); App.updateSub("VEILLE"); },

            async process(text) {
                const lower = text.toLowerCase();
                App.updateMain(text.toUpperCase());

                if (lower.includes('stop') || lower.includes('arrête')) { this.stop(); this.speak("Pause complète du système."); return; }
                if (lower.includes('écoute')) { this.start(); this.speak("Je vous écoute en continu avec traduction parfaite."); return; }

                if (lower.match(/^(qui|quoi|où|comment|c'est quoi|qu'est-ce que|pourquoi|définis|explique|cherche)/)) {
                    this.speak("Recherche IA online en cours via DuckDuckGo...");
                    const info = await this.fetchOnline(text);
                    this.speak(info);
                    return;
                }

                const defaults = [
                    `Message parfaitement compris. Analyse audio et contexte terminée.`,
                    `Traduction intelligente terminée. Fréquence dominante bien identifiée.`,
                    `Réponse scientifique : votre intention est claire et bien enregistrée.`
                ];
                let resp = defaults[Math.floor(Math.random()*defaults.length)];
                while (this.lastResponses.has(resp)) resp = defaults[Math.floor(Math.random()*defaults.length)];
                this.speak(resp);
            }
        };

        const App = {
            isRunning: false,

            init() {
                Config.load();
                VisualEngine.init();
                BrainEngine.init();
                AudioEngine.init();
                this.log("SUPRA ETERNITY v2.3 — TRADUCTION PARFAITE + ENREGISTREMENT AUTO chargé", 'sys');
            },

            log(msg, type = 'sys') {
                const t = document.getElementById('terminal');
                const d = document.createElement('div');
                d.className = `log-line log-${type}`;
                d.textContent = `[${new Date().toLocaleTimeString('fr-FR')}] ${msg}`;
                t.appendChild(d);
                t.scrollTop = t.scrollHeight;
            },

            updateMain(t) { document.getElementById('mainText').textContent = t; },
            updateSub(t) { document.getElementById('subText').textContent = t; },

            async startFullSystem() {
                this.stopSystem();
                const ok = await AudioEngine.init();
                if (ok) {
                    VisualEngine.start();
                    BrainEngine.start();
                    this.isRunning = true;
                    this.log("MODE COMPLET AVEC TRADUCTION PARFAITE ACTIVÉ", 'sys');
                }
            },

            startVoiceOnlyMode() {
                this.stopSystem();
                VisualEngine.start();
                BrainEngine.start();
                this.isRunning = true;
            },

            stopSystem() {
                this.isRunning = false;
                VisualEngine.stop();
                AudioEngine.destroy();
                speechSynthesis.cancel();
                Object.values(FeatureEngine.intervals).forEach(clearInterval);

                // ENREGISTREMENT AUTO : téléchargement du fichier
                if (FeatureEngine.autoRecord && BrainEngine.translationsLog.length > 0) {
                    const content = BrainEngine.translationsLog.join('\n');
                    const blob = new Blob([content], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `supra_traductions_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.txt`;
                    a.click();
                    URL.revokeObjectURL(url);
                    App.log("Fichier des traductions enregistré et téléchargé automatiquement", 'sys');
                    BrainEngine.translationsLog = [];
                }

                document.querySelectorAll('.grid-btn').forEach(b => b.classList.remove('active-state'));
                this.updateMain("SYSTÈME ARRÊTÉ");
            },

            toggleSettings() {
                const m = document.getElementById('settingsModal');
                m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
            }
        };

        window.onload = () => App.init();
    </script>
</body>
</html>
