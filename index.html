<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPRA LAB - 100% RÉEL</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        #container {
            max-width: 600px;
            margin: 0 auto;
        }
        #log {
            background: #111;
            border: 1px solid #0f0;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            margin: 10px 0;
            text-align: left;
            font-size: 14px;
            white-space: pre-wrap;
        }
        button {
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 12px 24px;
            margin: 10px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #0f0;
            color: #000;
        }
        #voiceToggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #0f0;
            border: none;
            color: #000;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 0 15px #0f0;
        }
        #voiceToggle:active {
            background: #f00;
            box-shadow: 0 0 15px #f00;
        }
        #micIndicator {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #111;
            border: 2px solid #0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #0f0;
        }
        #micIndicator.listening {
            background: #0f0;
            border-color: #0f0;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        #ai-report {
            background: #111;
            border: 1px dashed #0f0;
            padding: 15px;
            margin: 10px 0;
            text-align: left;
            font-size: 14px;
            white-space: pre-wrap;
            min-height: 100px;
        }
        .status {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            border-top: 1px solid #0f0;
            padding: 8px;
            font-size: 14px;
        }
        #settings {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            padding: 20px;
            z-index: 1000;
            overflow-y: auto;
        }
        #settings input, #settings select, #settings button {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            background: #111;
            color: #0f0;
            border: 1px solid #0f0;
            font-family: 'Courier New', monospace;
        }
        #settings h3 {
            color: #0f0;
            margin-top: 0;
        }
        .error {
            color: #f00 !important;
        }
        .success {
            color: #0f0 !important;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1 style="color: #0f0;">SUPRA LAB</h1>
        <h2 style="color: #00ff00; font-size: 16px;">100% RÉEL - ZÉRO SIMULATION</h2>

        <div id="log"></div>

        <div id="ai-report">[EN ATTENTE DE DONNÉES RÉELLES...]</div>

        <div style="margin: 20px 0;">
            <button id="btnStartIA">🎤 ACTIVER IA VOCALE</button>
            <button id="testVoiceBtn">🔊 TESTER VOIX</button>
            <button id="sendToGroqBtn">📤 ENVOYER À GROQ</button>
            <button id="btnSettings">⚙️ PARAMÈTRES</button>
        </div>
    </div>

    <div id="settings">
        <h3>⚙️ PARAMÈTRES (100% RÉEL)</h3>
        <div>
            <label style="color: #00ff00;">Clé API Groq:</label>
            <input type="password" id="groqApiKey" placeholder="Ta clé API Groq (100% réel)">
            <button id="testApiKeyBtn">🧪 Tester la clé</button>
            <div id="apiTestResult"></div>
        </div>
        <div>
            <label style="color: #00ff00;"><input type="checkbox" id="voiceFeedback" checked> L'IA PARLE (réel)</label>
        </div>
        <div>
            <label style="color: #00ff00;"><input type="checkbox" id="voiceAlerts" checked> ALERTES VOCALES (réel)</label>
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <button id="saveSettings">💾 Sauvegarder</button>
            <button id="closeSettings">✕ Fermer</button>
        </div>
    </div>

    <div class="status" id="status">En attente de données réelles...</div>

    <button id="voiceToggle" title="Activer/Désactiver la voix">🎤</button>
    <div id="micIndicator" title="État du micro (réel)">🎤</div>

    <script>
        // ========== VARIABLES GLOBALES (100% RÉELLES) ==========
        let config = {
            groqApiKey: localStorage.getItem('groqApiKey') || '',
            voiceFeedback: true,
            voiceAlerts: true,
            voiceLanguage: 'fr-FR'
        };
        let finalTranscript = '';
        let recognition = null;
        let isListening = false;
        let isVoiceEnabled = false;
        let synthesis = window.speechSynthesis;
        let isSpeaking = false;

        // ========== INITIALISATION ==========
        document.addEventListener('DOMContentLoaded', () => {
            setupUI();
            loadVoices();
            checkPermissions();

            // Charger la clé API si elle existe
            if (config.groqApiKey) {
                document.getElementById('groqApiKey').value = config.groqApiKey;
            }
        });

        // ========== FONCTIONS DE BASE (100% RÉELLES) ==========
        function log(text, important = false) {
            const logDiv = document.getElementById('log');
            if (!logDiv) return;
            const line = document.createElement('div');
            if (important) line.className = 'error';
            line.innerHTML = `<span style="color: #00ff00;">[${new Date().toLocaleTimeString('fr-FR')}]</span> ${text}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(txt) {
            document.getElementById('status').textContent = txt;
        }

        function showAlert(message) {
            if (config.voiceAlerts && isVoiceEnabled) {
                speakText(`Alerte: ${message}`);
            }
            log(`⚠️ ALERTE RÉELLE: ${message}`, true);
        }

        function loadVoices() {
            if ('speechSynthesis' in window) {
                synthesis.getVoices();
                if (synthesis.onvoiceschanged) {
                    synthesis.onvoiceschanged = loadVoices;
                }
            }
        }

        function getVoice(lang) {
            const voices = synthesis.getVoices();
            return voices.find(v => v.lang.startsWith(lang)) || voices[0];
        }

        function speakText(text, interrupt = true) {
            if (!config.voiceFeedback || !isVoiceEnabled || !synthesis) return;

            if (isSpeaking) {
                if (interrupt) {
                    synthesis.cancel();
                    isSpeaking = false;
                } else {
                    setTimeout(() => speakText(text, false), 500);
                    return;
                }
            }

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = config.voiceLanguage;
                utterance.voice = getVoice(config.voiceLanguage);
                utterance.onstart = () => isSpeaking = true;
                utterance.onend = () => isSpeaking = false;
                utterance.onerror = () => isSpeaking = false;
                synthesis.speak(utterance);
                log(`[VOIX RÉELLE] "${text}"`);
            } catch (e) {
                log(`[VOIX ERREUR RÉELLE] ${e.message}`, true);
            }
        }

        function stopSpeaking() {
            if (synthesis && isSpeaking) {
                synthesis.cancel();
                isSpeaking = false;
            }
        }

        // ========== VÉRIFIE LES PERMISSIONS (100% RÉELLES) ==========
        function checkPermissions() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                log("[ERREUR RÉELLE] Reconnaissance vocale non supportée ! Utilisez Chrome.", true);
                document.getElementById('micIndicator').classList.add('error');
                return false;
            }
            return true;
        }

        async function checkMicrophonePermission() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                log("[PERMISSION RÉELLE] ✅ Micro autorisé !", true);
                return true;
            } catch (err) {
                log(`[PERMISSION ERREUR RÉELLE] ❌ ${err.message}`, true);
                if (err.name === 'NotAllowedError') {
                    showAlert("Activez la permission MICROPHONE dans les paramètres (100% réel) !");
                    document.getElementById('micIndicator').classList.add('error');
                }
                return false;
            }
        }

        // ========== TEST DE CLÉ API GROQ (100% RÉEL) ==========
        async function testGroqApiKey() {
            const apiKey = document.getElementById('groqApiKey').value.trim();
            if (!apiKey) {
                log("[GROQ RÉEL] ⚠️ Aucune clé API à tester.", true);
                document.getElementById('apiTestResult').textContent = "⚠️ Aucune clé API saisie";
                document.getElementById('apiTestResult').className = 'error';
                return;
            }

            log("[GROQ RÉEL] 🧪 Test de la clé API en cours...", true);
            updateStatus("Test API Groq (100% réel)...");

            try {
                const testPayload = {
                    model: "mixtral-8x7b-32768",
                    messages: [{
                        role: "user",
                        content: "Réponds simplement 'OK' si tu reçois ce message (100% réel)."
                    }],
                    temperature: 0.3,
                    max_tokens: 10
                };

                const response = await fetch('https://api.groq.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify(testPayload)
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(`Erreur réelle ${response.status}: ${errorData.message || response.statusText}`);
                }

                const data = await response.json();
                const result = data.choices[0].message.content.trim();

                if (result === "OK" || result.includes("OK")) {
                    log("[GROQ RÉEL] ✅ Clé API VALIDE ! (100% réel)", true);
                    document.getElementById('apiTestResult').textContent = "✅ Clé API valide (100% réel)";
                    document.getElementById('apiTestResult').className = 'success';
                    config.groqApiKey = apiKey;
                    localStorage.setItem('groqApiKey', apiKey);
                    updateStatus("Prêt (100% réel)");
                } else {
                    log("[GROQ RÉEL] ⚠️ Réponse inattendue: " + result, true);
                    document.getElementById('apiTestResult').textContent = "⚠️ Réponse inattendue (100% réel)";
                    document.getElementById('apiTestResult').className = 'error';
                }

            } catch (error) {
                log(`[GROQ ERREUR RÉELLE] ❌ ${error.message}`, true);
                document.getElementById('apiTestResult').textContent = `❌ Erreur réelle: ${error.message}`;
                document.getElementById('apiTestResult').className = 'error';
                updateStatus("Erreur API Groq (100% réel)");
            }
        }

        // ========== RECONNAISSANCE VOCALE (100% RÉELLE) ==========
        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                log("[ERREUR RÉELLE] ❌ Reconnaissance vocale non supportée ! Utilisez Chrome (100% réel).", true);
                showAlert("Utilisez Chrome et activez le micro (100% réel).");
                document.getElementById('micIndicator').classList.add('error');
                return;
            }

            try {
                if (recognition) {
                    recognition.stop();
                    recognition = null;
                }

                recognition = new SpeechRecognition();
                recognition.continuous = true; // Écoute en continu (100% réel)
                recognition.interimResults = true; // Résultats intermédiaires (100% réel)
                recognition.lang = 'fr-FR'; // Français (100% réel)
                recognition.maxAlternatives = 1;

                finalTranscript = '';

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    let finalTranscriptPart = '';

                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscriptPart += transcript;
                        } else {
                            interimTranscript += transcript;
                        }
                    }

                    if (interimTranscript) {
                        log(`[IA RÉELLE] 💬 "${interimTranscript}"`);
                    }

                    if (finalTranscriptPart) {
                        finalTranscript = finalTranscriptPart;
                        log(`[IA RÉELLE] ✅ "${finalTranscript}"`);
                        processFinalTranscript(finalTranscript);
                    }
                };

                recognition.onerror = (event) => {
                    log(`[IA ERREUR RÉELLE] ❌ ${event.error}`, true);
                    if (event.error === 'not-allowed') {
                        document.getElementById('micIndicator').classList.add('error');
                        showAlert("Activez la permission MICROPHONE (100% réel) !");
                    }
                    if (isVoiceEnabled) setTimeout(initSpeech, 1000);
                };

                recognition.onstart = () => {
                    isListening = true;
                    log("[IA RÉELLE] 🎤 Écoute ACTIVE ! Parlez ou claquez des doigts (100% réel).", true);
                    updateStatus("IA: Écoute en cours (100% réel)...");
                    document.getElementById('micIndicator').classList.add('listening');
                    document.getElementById('btnStartIA').textContent = 'ARRÊTER IA';
                };

                recognition.onend = () => {
                    isListening = false;
                    updateStatus("IA: En attente (100% réel)");
                    document.getElementById('micIndicator').classList.remove('listening');
                    document.getElementById('btnStartIA').textContent = 'ACTIVER IA';

                    if (isVoiceEnabled) {
                        setTimeout(() => {
                            try { recognition.start(); } catch (e) { initSpeech(); }
                        }, 100);
                    }
                };

                recognition.start();
                isVoiceEnabled = true;
                document.getElementById('micIndicator').classList.remove('error');
                log("[IA RÉELLE] ✅ Transmission vocale ACTIVE (100% réel).", true);

            } catch (e) {
                log(`[IA ERREUR CRITIQUE RÉELLE] ❌ ${e.message}`, true);
                document.getElementById('micIndicator').classList.add('error');
                setTimeout(initSpeech, 2000);
            }
        }

        function stopSpeechRecognition() {
            if (recognition) {
                recognition.stop();
                isVoiceEnabled = false;
                isListening = false;
                document.getElementById('micIndicator').classList.remove('listening');
                document.getElementById('btnStartIA').textContent = 'ACTIVER IA';
                updateStatus("IA: Désactivée (100% réel)");
                log("[IA RÉELLE] ❌ Transmission arrêtée (100% réel).");
            }
        }

        function processFinalTranscript(transcript) {
            if (!transcript) return;

            log(`[IA RÉELLE] 📝 Texte reçu: "${transcript}"`);

            // Génère un rapport 100% réel basé sur la transcription
            const report = `
// ======================
// RAPPORT RÉEL - SUPRA LAB
// Généré le: ${new Date().toLocaleString('fr-FR')}
// ======================
[TRANSMISSION RÉELLE]
> "${transcript}"

[ANOMALIES RÉELLES]
> ${['drone', 'avion', 'esprit', 'EVP', 'fantôme', 'SOS', 'alerte', 'clic', 'son', 'urgence'].some(k => transcript.toLowerCase().includes(k)) ? "🎯 Mot-clé détecté (100% réel)" : "Aucun mot-clé (100% réel)"}

[ANALYSE RÉELLE]
> ${['drone', 'avion', 'esprit', 'EVP', 'fantôme', 'SOS', 'alerte', 'clic', 'son', 'urgence'].some(k => transcript.toLowerCase().includes(k)) ?
        "⚡ RECOMMANDATION RÉELLE: Investiguer !" : "Aucune menace détectée (100% réel)."}
// ======================
            `;

            document.getElementById('ai-report').textContent = report;

            // Lit le rapport à voix haute (100% réel)
            if (config.voiceFeedback && isVoiceEnabled) {
                speakText(`Analyse réelle terminée pour: ${transcript}`);
            }

            // Envoie à Groq si clé API valide (100% réel)
            if (config.groqApiKey) {
                sendToGroq(transcript, report);
            } else {
                log("[IA RÉELLE] ⚠️ Clé API Groq manquante. Mode local (100% réel).", true);
            }
        }

        // ========== ENVOI À GROQ (100% RÉEL) ==========
        async function sendToGroq(transcript, localReport) {
            try {
                log("[GROQ RÉEL] 📤 Envoi à Groq API (100% réel)...", true);
                updateStatus("Envoi à Groq (100% réel)...");

                const payload = {
                    model: "mixtral-8x7b-32768",
                    messages: [{
                        role: "user",
                        content: `
                            Analyse cette transmission RÉELLE en français:
                            "${transcript}"

                            Instructions RÉELLES:
                            1. Classifie la menace (Faible/Moyenne/Élevée/Critique)
                            2. Donne une analyse RÉELLE en 2-3 phrases max.
                            3. Recommande une action RÉELLE si nécessaire.
                        `
                    }],
                    temperature: 0.3,
                    max_tokens: 256
                };

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                const response = await fetch('https://api.groq.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.groqApiKey}`
                    },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(`Erreur réelle ${response.status}: ${errorData.message || response.statusText}`);
                }

                const data = await response.json();
                const groqResponse = data.choices[0].message.content;

                document.getElementById('ai-report').textContent =
                    localReport + `\n\n// 🤖 RÉPONSE GROQ RÉELLE\n${groqResponse}\n// ======================`;

                if (config.voiceFeedback && isVoiceEnabled) {
                    const firstLine = groqResponse.split('\n')[0].trim();
                    speakText(`Groq répond (100% réel): ${firstLine}`);
                }

                log("[GROQ RÉEL] ✅ Réponse reçue (100% réel).", true);
                updateStatus("Prêt (100% réel)");

            } catch (error) {
                log(`[GROQ ERREUR RÉELLE] ❌ ${error.message}`, true);
                updateStatus("Erreur API Groq (100% réel)");
                document.getElementById('ai-report').textContent =
                    localReport + `\n\n// ❌ ERREUR GROQ RÉELLE: ${error.message}\n// ======================`;
            }
        }

        // ========== GESTION DE L'INTERFACE (100% RÉELLE) ==========
        function setupUI() {
            // Bouton paramètres
            document.getElementById('btnSettings')?.addEventListener('click', () => {
                document.getElementById('settings').style.display = 'block';
            });

            document.getElementById('closeSettings')?.addEventListener('click', () => {
                document.getElementById('settings').style.display = 'none';
            });

            // Bouton IA vocale
            document.getElementById('btnStartIA')?.addEventListener('click', () => {
                isVoiceEnabled ? stopSpeechRecognition() : initSpeech();
            });

            // Bouton tester voix
            document.getElementById('testVoiceBtn')?.addEventListener('click', () => {
                speakText("Test voix RÉEL: si vous m'entendez, la synthèse vocale fonctionne (100% réel).");
            });

            // Bouton tester clé API
            document.getElementById('testApiKeyBtn')?.addEventListener('click', testGroqApiKey);

            // Bouton envoyer à Groq
            document.getElementById('sendToGroqBtn')?.addEventListener('click', () => {
                if (!config.groqApiKey) {
                    log("[GROQ RÉEL] ⚠️ Clé API manquante (100% réel).", true);
                    return;
                }
                if (!finalTranscript) {
                    log("[ERREUR RÉELLE] ❌ Aucune transmission disponible (100% réel).", true);
                    return;
                }
                processFinalTranscript(finalTranscript);
            });

            // Bouton sauvegarder
            document.getElementById('saveSettings')?.addEventListener('click', () => {
                config.groqApiKey = document.getElementById('groqApiKey').value;
                config.voiceFeedback = document.getElementById('voiceFeedback').checked;
                config.voiceAlerts = document.getElementById('voiceAlerts').checked;
                localStorage.setItem('groqApiKey', config.groqApiKey);
                log("[PARAM RÉEL] ✅ Configuration sauvegardée (100% réel).");
                document.getElementById('settings').style.display = 'none';
            });

            // Bouton voiceToggle
            document.getElementById('voiceToggle')?.addEventListener('click', () => {
                isVoiceEnabled = !isVoiceEnabled;
                if (isVoiceEnabled && !isListening) initSpeech();
                else if (!isVoiceEnabled) stopSpeechRecognition();
                document.getElementById('voiceToggle').classList.toggle('active');
            });
        }

        // ========== NETTOYAGE ==========
        window.addEventListener('beforeunload', () => {
            stopSpeechRecognition();
            stopSpeaking();
            if (recognition) recognition.stop();
        });
    </script>
</body>
</html>
