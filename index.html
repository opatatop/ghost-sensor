<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUPRA AI v11.0 // LEGACY EDITION</title>
<style>
    :root {
        --bg-color: #050508;
        --primary: #00f3ff;
        --secondary: #bc13fe;
        --text-color: #e0e0e0;
        --font-main: 'Courier New', Courier, monospace;
        --panel-bg: rgba(10, 12, 16, 0.95);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    body {
        margin: 0; background-color: var(--bg-color); color: var(--text-color);
        font-family: var(--font-main); overflow: hidden; height: 100vh;
        display: flex; flex-direction: column; border-top: 1px solid var(--primary);
    }

    /* --- BOOT SCREEN (DIAGNOSTIC) --- */
    #boot-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #000; z-index: 2000; display: flex; flex-direction: column;
        justify-content: center; align-items: center; color: var(--primary);
        font-family: monospace;
    }
    .boot-logo { font-size: 3rem; font-weight: 900; letter-spacing: 10px; margin-bottom: 20px; text-shadow: 0 0 20px var(--primary); }
    .checklist { width: 300px; text-align: left; margin-bottom: 30px; border: 1px solid #333; padding: 20px; background: #0a0a0a; }
    .check-item { display: flex; align-items: center; margin-bottom: 10px; opacity: 0.5; transition: 0.3s; }
    .check-item.ok { opacity: 1; color: #00ff41; }
    .check-item.fail { opacity: 1; color: #ff2a2a; }
    .check-item::before { content: '[ ]'; margin-right: 10px; font-weight: bold; }
    .check-item.ok::before { content: '[OK]'; }
    .check-item.fail::before { content: '[ERR]'; }
    
    .boot-btn {
        padding: 15px 50px; background: transparent; color: var(--primary); border: 2px solid var(--primary);
        font-family: var(--font-main); font-size: 1.2rem; cursor: pointer; text-transform: uppercase;
        letter-spacing: 3px; transition: 0.3s; box-shadow: 0 0 15px var(--primary);
    }
    .boot-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 30px var(--primary); }

    /* --- MAIN UI --- */
    header {
        height: 60px; background: var(--panel-bg); border-bottom: 1px solid var(--primary);
        display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
    }
    .brand { font-size: 1.2rem; font-weight: bold; color: #fff; }
    .brand span { color: var(--primary); }

    .status-badge {
        padding: 5px 10px; border: 1px solid #333; font-size: 0.8rem; letter-spacing: 1px;
        display: flex; align-items: center; gap: 5px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #333; }
    .dot.active { background: #00ff41; box-shadow: 0 0 5px #00ff41; }
    .dot.listening { background: var(--primary); box-shadow: 0 0 5px var(--primary); animation: pulse 1s infinite; }
    .dot.error { background: #ff2a2a; }

    /* --- CANVAS AREA --- */
    #visual-container { flex-grow: 1; position: relative; background: radial-gradient(circle at center, #0a0a12 0%, #000 100%); overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }

    /* --- TERMINAL INTERACTIF --- */
    #terminal-container {
        height: 180px; background: #000; border-top: 1px solid var(--primary);
        display: flex; flex-direction: column; font-family: 'Consolas', monospace;
    }
    #log-area {
        flex-grow: 1; padding: 10px; overflow-y: auto; color: #ccc; font-size: 12px; line-height: 1.4;
        scrollbar-width: thin; scrollbar-color: #333 #000;
    }
    #input-area {
        height: 40px; display: flex; align-items: center; padding: 0 10px; border-top: 1px solid #222; background: #050505;
    }
    .prompt { color: var(--primary); margin-right: 10px; font-weight: bold; }
    #cmd-input {
        flex-grow: 1; background: transparent; border: none; color: #fff; font-family: 'Consolas', monospace; font-size: 14px; outline: none;
    }
    .log-entry { margin-bottom: 4px; border-left: 2px solid transparent; padding-left: 8px; }
    .log-sys { color: #555; border-color: #555; }
    .log-ai { color: var(--secondary); border-color: var(--secondary); font-weight: bold; }
    .log-user { color: var(--primary); border-color: var(--primary); }
    .log-err { color: #ff2a2a; border-color: #ff2a2a; }

    /* --- MODALS --- */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); z-index: 100; display: none;
        justify-content: center; align-items: center; backdrop-filter: blur(5px);
    }
    .modal-box {
        background: #0f0f13; border: 1px solid var(--primary); padding: 20px;
        width: 90%; max-width: 400px; box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
    }
    .modal-box h3 { margin-top: 0; color: var(--primary); text-transform: uppercase; }
    .setting-row { margin-bottom: 15px; }
    .setting-row label { display: block; color: #888; font-size: 0.8rem; margin-bottom: 5px; }
    .setting-row input, .setting-row select { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 8px; }
    .btn-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn { padding: 8px 16px; cursor: pointer; border: 1px solid #555; background: #222; color: #fff; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #000; font-weight: bold; }

    /* TOAST NOTIFICATION */
    #toast {
        position: fixed; bottom: 200px; left: 50%; transform: translateX(-50%);
        background: rgba(188, 19, 254, 0.9); color: #fff; padding: 10px 20px;
        border-radius: 4px; pointer-events: none; opacity: 0; transition: 0.3s; z-index: 500;
        font-weight: bold; text-align: center;
    }

    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
</style>
</head>
<body>

<!-- BOOT SCREEN -->
<div id="boot-screen">
    <div class="boot-logo">SUPRA</div>
    <div class="checklist">
        <div class="check-item" id="check-js">Moteur JavaScript</div>
        <div class="check-item" id="check-speech">API Reconnaissance Vocale</div>
        <div class="check-item" id="check-audio">Périphérique Audio</div>
        <div class="check-item" id="check-perm">Permissions Utilisateur</div>
    </div>
    <button class="boot-btn" id="initBtn" disabled>INITIALISER</button>
    <div id="boot-msg" style="margin-top:15px; color:#ff2a2a; display:none;"></div>
</div>

<!-- MAIN APP -->
<header>
    <div class="brand">SUPRA <span>LEGACY</span></div>
    <div class="status-badge">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">HORS LIGNE</span>
    </div>
    <button class="btn" onclick="ui.openSettings()">⚙️ CONFIG</button>
</header>

<div id="visual-container">
    <canvas id="canvas"></canvas>
</div>

<div id="terminal-container">
    <div id="log-area"></div>
    <div id="input-area">
        <span class="prompt">root@supra:~#</span>
        <input type="text" id="cmd-input" placeholder="Tapez 'SUPRA' + commande ou 'HELP'..." autocomplete="off">
    </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settings-modal" class="modal-overlay">
    <div class="modal-box">
        <h3>Configuration</h3>
        <div class="setting-row">
            <label>Mots de Réveil (Virgule)</label>
            <input type="text" id="cfg-wakewords" value="supra, système">
        </div>
        <div class="setting-row">
            <label>Vitesse Voix</label>
            <input type="range" id="cfg-rate" min="0.5" max="2" step="0.1" value="1.1">
        </div>
        <div class="btn-group">
            <button class="btn" onclick="ui.closeSettings()">Fermer</button>
            <button class="btn btn-primary" onclick="ui.saveSettings()">Sauvegarder</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div id="toast">Message</div>

<script>
/* --- CONFIGURATION & UTILS --- */
const $ = id => document.getElementById(id);
const log = (msg, type='sys') => {
    const area = $('log-area');
    const div = document.createElement('div');
    div.className = `log-entry log-${type}`;
    const time = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    div.innerHTML = `<span style="opacity:0.5">[${time}]</span> ${msg}`;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
};
const toast = (msg) => {
    const t = $('toast'); t.innerText = msg; t.style.opacity = 1;
    setTimeout(() => t.style.opacity = 0, 3000);
};

/* --- AUDIO ENGINE --- */
class AudioEngine {
    constructor() {
        this.ctx = null; this.analyser = null; this.stream = null; this.ready = false; this.dataArray = null;
    }
    async init() {
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            if(this.ctx.state === 'suspended') await this.ctx.resume();
            this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const src = this.ctx.createMediaStreamSource(this.stream);
            this.analyser = this.ctx.createAnalyser();
            this.analyser.fftSize = 256;
            src.connect(this.analyser);
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
            this.ready = true;
            return true;
        } catch(e) {
            console.error(e);
            return false;
        }
    }
    getData() {
        if(!this.ready) return { vol: 0, raw: [] };
        this.analyser.getByteFrequencyData(this.dataArray);
        return { 
            vol: this.dataArray.reduce((a,b)=>a+b,0) / this.dataArray.length, 
            raw: this.dataArray 
        };
    }
}

/* --- BRAIN (LOGIC) --- */
class Brain {
    constructor() {
        this.synth = window.speechSynthesis;
        this.wakeWords = ["supra", "système"];
        this.config = { rate: 1.1 };
        this.voices = [];
        speechSynthesis.onvoiceschanged = () => this.voices = this.synth.getVoices();
    }
    
    process(input) {
        const txt = input.toLowerCase().trim();
        if(!txt) return;
        
        log(`> ${input}`, 'user');

        // Détection
        const trigger = this.wakeWords.find(w => txt.startsWith(w));
        let cmd = trigger ? txt.replace(trigger, "").trim() : txt;
        
        // Si pas de trigger, ignorer (sauf si tapé au clavier pour démo)
        const isTyped = true; // On accepte tout pour la version robuste
        
        if(trigger || isTyped) {
            this.think(cmd);
        } else {
            // log("Commande ignorée (pas de mot clé)", 'sys');
        }
    }

    think(cmd) {
        let response = "";
        if(cmd.includes("heure")) response = `Il est ${new Date().toLocaleTimeString('fr-FR')}.`;
        else if(cmd.includes("date")) response = `Nous sommes le ${new Date().toLocaleDateString('fr-FR')}.`;
        else if(cmd.includes("qui es-tu")) response = "Je suis Supra Legacy, une IA autonome.";
        else if(cmd.includes("aide") || cmd.includes("help")) response = "Commandes: Heure, Date, État, Qui es-tu. Tapez 'Supra' avant.";
        else if(cmd.includes("état")) response = "Systèmes opérationnels. Mode dégradé actif.";
        else if(cmd === "") response = "Oui ?";
        else response = "J'ai entendu: " + cmd + ".";

        this.speak(response);
    }

    speak(text) {
        log(`IA: ${text}`, 'ai');
        const u = new SpeechSynthesisUtterance(text);
        u.rate = this.config.rate;
        const fr = this.voices.find(v => v.lang.includes('fr'));
        if(fr) u.voice = fr;
        u.onstart = () => app.setSpeaking(true);
        u.onend = () => app.setSpeaking(false);
        this.synth.speak(u);
    }
}

/* --- VOICE ENGINE --- */
class VoiceEngine {
    constructor(callback) {
        this.callback = callback;
        this.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        this.rec = null;
        this.isActive = false;
        this.retryCount = 0;
        
        if(!this.SpeechRecognition) return;
        
        this.rec = new this.SpeechRecognition();
        this.rec.lang = 'fr-FR';
        this.rec.continuous = true;
        this.rec.interimResults = false;

        this.rec.onstart = () => { 
            this.isActive = true; 
            this.retryCount = 0;
            app.updateStatus("ÉCOUTE", "listening");
        };
        
        this.rec.onend = () => {
            this.isActive = false;
            // LOGIQUE DE REDÉMARRAGE AUTOMATIQUE (Le fix principal)
            if(app.isRunning && !app.isSpeaking) {
                log("Reconnexion vocale...", 'sys');
                setTimeout(() => {
                    try { this.start(); } 
                    catch(e) { 
                        this.retryCount++;
                        if(this.retryCount < 5) this.start(); // Réessaie 5 fois
                        else app.updateStatus("ERREUR VOIX", "error");
                    }
                }, 1000);
            } else {
                app.updateStatus("PRÊT", "active");
            }
        };

        this.rec.onresult = (e) => {
            const last = e.results[e.results.length - 1];
            if(last.isFinal) this.callback(last[0].transcript);
        };
        
        this.rec.onerror = (e) => {
            console.warn("Voice Error:", e.error);
            if(e.error === 'not-allowed') {
                log("Micro refusé. Passez en mode TEXTE.", 'err');
                app.updateStatus("MODE TEXTE", "error");
            }
        };
    }

    start() {
        if(!this.rec) return;
        try { this.rec.start(); } catch(e){}
    }
    stop() {
        if(this.rec) try { this.rec.stop(); } catch(e){}
    }
}

/* --- VISUALS --- */
class Visuals {
    constructor() {
        this.c = $('canvas'); this.ctx = this.c.getContext('2d');
        this.resize(); window.onresize = () => this.resize();
        this.angle = 0;
    }
    resize() { this.c.width = this.c.offsetWidth; this.c.height = this.c.offsetHeight; }
    draw(data, state) {
        const { vol, raw } = data;
        const w = this.c.width, h = this.c.height, cx = w/2, cy = h/2;
        
        this.ctx.fillStyle = "rgba(2,2,5,0.2)"; this.ctx.fillRect(0,0,w,h);
        
        let col = state === "SPEAKING" ? '#bc13fe' : (state === "LISTENING" ? '#00f3ff' : '#333');
        
        // Cercle central
        const r = 40 + vol * 0.8;
        this.ctx.beginPath(); this.ctx.arc(cx, cy, r, 0, Math.PI*2);
        this.ctx.strokeStyle = col; this.ctx.lineWidth = 3; this.ctx.stroke();
        
        // Vagues
        this.ctx.beginPath(); this.ctx.arc(cx, cy, r + 10 + Math.sin(this.angle)*5, 0, Math.PI*2);
        this.ctx.strokeStyle = col; this.ctx.globalAlpha = 0.5; this.ctx.stroke(); this.ctx.globalAlpha = 1;

        if(raw.length > 0) {
            for(let i=0; i<raw.length; i+=5) {
                const x = (i/raw.length)*w;
                const hBar = (raw[i]/255)*100;
                this.ctx.fillStyle = col;
                this.ctx.fillRect(x, h - hBar, 4, hBar);
            }
        }
        this.angle += 0.05;
    }
}

/* --- CONTROLLER & BOOT LOGIC --- */
const brain = new Brain();
const visuals = new Visuals();
const audio = new AudioEngine();
const voice = new VoiceEngine(t => brain.process(t));

const app = {
    isRunning: false,
    isSpeaking: false,
    
    init: async () => {
        $('initBtn').disabled = true;
        $('initBtn').innerText = "CHARGEMENT...";
        
        // 1. Check JS
        $('check-js').classList.add('ok');
        
        // 2. Check Speech API
        if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            $('check-speech').classList.add('ok');
        } else {
            $('check-speech').classList.add('fail');
            $('boot-msg').style.display = 'block';
            $('boot-msg').innerText = "Votre navigateur ne supporte pas la reconnaissance vocale. Utilisation du MODE TEXTE uniquement.";
        }

        // 3. Check Audio
        const audioOk = await audio.init();
        if(audioOk) {
            $('check-audio').classList.add('ok');
            $('check-perm').classList.add('ok');
        } else {
            $('check-audio').classList.add('fail');
            $('check-perm').classList.add('fail');
            $('boot-msg').style.display = 'block';
            $('boot-msg').innerText = "Micro refusé. L'IA fonctionnera en MODE TEXTE (tapez vos commandes).";
        }

        // FIN BOOT
        setTimeout(() => {
            $('boot-screen').style.opacity = 0;
            setTimeout(() => $('boot-screen').remove(), 1000);
            app.isRunning = true;
            app.startLoop();
            log("SYSTÈME SUPRA LEGACY CHARGÉ.", 'sys');
            log("Mode Audio: " + (audioOk ? "ACTIF" : "INACTIF (Texte uniquement)"), 'sys');
            log("Tapez 'SUPRA help' pour commencer.", 'sys');
            
            if(audioOk) voice.start();
            app.updateStatus("PRÊT", "active");
        }, 1500);
    },

    startLoop: () => {
        const loop = () => {
            requestAnimationFrame(loop);
            const state = app.isSpeaking ? "SPEAKING" : (voice.isActive ? "LISTENING" : "IDLE");
            visuals.draw(audio.getData(), state);
        };
        loop();
    },
    
    updateStatus: (text, cssClass) => {
        $('statusText').innerText = text;
        $('statusDot').className = 'dot ' + cssClass;
    },
    
    setSpeaking: (val) => { 
        app.isSpeaking = val; 
        app.updateStatus(val ? "PARLE" : "PRÊT", val ? "listening" : "active");
    },
    
    handleInput: (e) => {
        if(e.key === 'Enter') {
            const val = $('cmd-input').value;
            if(val) {
                brain.process(val);
                $('cmd-input').value = '';
            }
        }
    }
};

/* --- UI INTERACTIONS --- */
const ui = {
    openSettings: () => $('settings-modal').style.display = 'flex',
    closeSettings: () => $('settings-modal').style.display = 'none',
    saveSettings: () => {
        const words = $('cfg-wakewords').value.split(',');
        brain.wakeWords = words.map(w => w.trim()).filter(w => w);
        brain.config.rate = parseFloat($('cfg-rate').value);
        ui.closeSettings();
        toast("Configuration sauvegardée");
    }
};

// EVENTS
 $('initBtn').addEventListener('click', app.init);
 $('cmd-input').addEventListener('keypress', app.handleInput);

</script>
</body>
</html>
