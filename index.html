<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPRA NEURAL AI v2.2 (DIAGNOSTIC)</title>
<style>
    /* --- STYLE --- */
    :root {
        --bg-color: #050508;
        --primary: #00f3ff; 
        --secondary: #ff00ff;
        --danger: #ff3333;
        --success: #00ff00;
        --text-color: #e0e0e0;
        --font-main: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; outline: none; }
    
    body {
        margin: 0;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: var(--font-main);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
    }

    /* Fond Grille */
    body::before {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: 0; pointer-events: none;
    }

    /* Scanlines */
    body::after {
        content: " "; display: block; position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
        z-index: 2; pointer-events: none;
    }

    /* HEADER */
    header {
        position: relative; z-index: 10; height: 70px;
        background: rgba(0, 0, 0, 0.95);
        border-bottom: 2px solid var(--primary);
        display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
    }

    .brand { font-size: 1.4rem; font-weight: bold; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 5px var(--primary); }
    .brand span { color: var(--secondary); }

    .controls { display: flex; gap: 15px; }

    button {
        background: rgba(0,0,0,0.5);
        border: 1px solid var(--primary); color: var(--primary);
        padding: 10px 20px; font-family: var(--font-main); font-weight: bold;
        cursor: pointer; transition: all 0.3s; text-transform: uppercase; font-size: 0.9rem;
    }

    button:hover:not(:disabled) { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
    button:disabled { border-color: #555; color: #555; cursor: not-allowed; }

    /* État actif (Rouge pour l'écoute) */
    button.listening { border-color: var(--danger); color: var(--danger); box-shadow: 0 0 10px var(--danger); }
    button.listening:hover { background: var(--danger); color: white; }

    /* CANVAS */
    #canvas-container { position: relative; flex-grow: 1; width: 100%; z-index: 1; }
    canvas { display: block; width: 100%; height: 100%; }

    /* TERMINAL */
    #terminal {
        position: relative; z-index: 10; height: 200px;
        background: rgba(10, 10, 16, 0.9);
        border-top: 2px solid var(--secondary);
        padding: 15px; font-size: 14px; overflow-y: auto;
        scrollbar-width: thin; scrollbar-color: var(--primary) #111;
    }
    #terminal::-webkit-scrollbar { width: 8px; }
    #terminal::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

    .log-line { margin-bottom: 6px; line-height: 1.4; opacity: 0.9; border-left: 3px solid transparent; padding-left: 10px; animation: fadeIn 0.2s; }
    .log-sys { color: #aaa; border-left-color: #aaa; }
    .log-audio { color: var(--primary); border-left-color: var(--primary); }
    .log-ai { color: var(--secondary); border-left-color: var(--secondary); font-weight: bold; }
    .log-error { color: var(--danger); border-left-color: var(--danger); background: rgba(255,0,0,0.1); }
    .log-warn { color: #ffd700; border-left-color: #ffd700; }

    .timestamp { color: #555; margin-right: 10px; font-size: 0.85em; }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-5px); } to { opacity: 0.9; transform: translateX(0); } }

</style>
</head>
<body>

<header>
    <div class="brand">SUPRA <span>NEURAL</span> AI</div>
    <div class="controls">
        <button id="btnMic">1. Activer Micro</button>
        <button id="btnVoice">2. Écouter (OFF)</button>
    </div>
</header>

<div id="canvas-container">
    <canvas id="canvas"></canvas>
</div>

<div id="terminal"></div>

<script>
/* --- LOGGER --- */
class Logger {
    static log(msg, type = "sys") {
        const term = document.getElementById("terminal");
        const line = document.createElement("div");
        line.className = `log-line log-${type}`;
        const time = new Date().toLocaleTimeString('fr-FR', { hour12: false });
        line.innerHTML = `<span class="timestamp">[${time}]</span> ${msg}`;
        term.appendChild(line);
        term.scrollTop = term.scrollHeight;
        if (term.childElementCount > 80) term.removeChild(term.firstChild);
    }
    static error(msg) { this.log("ERREUR: " + msg, "error"); }
    static warn(msg) { this.log("ATTENTION: " + msg, "warn"); }
}

/* --- AUDIO ENGINE --- */
class AudioEngine {
    constructor() {
        this.ctx = null;
        this.analyser = null;
        this.dataArray = null;
        this.isReady = false;
    }

    async init() {
        if (this.isReady) return true;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const src = this.ctx.createMediaStreamSource(stream);
            this.analyser = this.ctx.createAnalyser();
            this.analyser.fftSize = 256;
            this.analyser.smoothingTimeConstant = 0.8;
            src.connect(this.analyser);
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
            this.isReady = true;
            Logger.log("Flux audio initialisé.", "audio");
            return true;
        } catch (e) {
            Logger.error("Accès micro refusé ou impossible. Vérifiez les permissions.");
            console.error(e);
            return false;
        }
    }

    getAnalysis() {
        if (!this.isReady) return { volume: 0, bass: 0, raw: null };
        this.analyser.getByteFrequencyData(this.dataArray);
        let sum = 0, bassSum = 0;
        for (let i = 0; i < this.dataArray.length; i++) {
            sum += this.dataArray[i];
            if (i < 10) bassSum += this.dataArray[i];
        }
        return { volume: sum / this.dataArray.length, bass: bassSum / 10, raw: this.dataArray };
    }
}

/* --- AI ENGINE (TTS & LOGIC) --- */
class AIEngine {
    constructor() {
        this.synth = window.speechSynthesis;
        this.voices = [];
        // Force le chargement des voix
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => { this.voices = this.synth.getVoices(); };
        }
    }

    process(text) {
        const clean = text.toLowerCase().trim();
        Logger.log(`Analyse : "${text}"`, "ai");
        
        let response = "Commande non reconnue.";
        
        if (clean.includes("bonjour") || clean.includes("salut")) response = "Système en ligne. Bonjour.";
        else if (clean.includes("qui es-tu")) response = "Je suis l'intelligence neurale Supra.";
        else if (clean.includes("heure")) response = "Il est " + new Date().toLocaleTimeString();
        else if (clean.includes("test")) response = "Système vocal opérationnel.";

        this.speak(response);
    }

    speak(text) {
        // Réveil forcé du contexte audio
        this.synth.cancel();
        this.synth.resume();

        const u = new SpeechSynthesisUtterance(text);
        const frenchVoice = this.voices.find(v => v.lang.includes('fr'));
        if (frenchVoice) u.voice = frenchVoice;
        u.lang = 'fr-FR';
        u.rate = 1;
        
        u.onstart = () => Logger.log(">> IA PARLE", "ai");
        u.onerror = (e) => Logger.error("Erreur synthèse: " + e.error);
        
        this.synth.speak(u);
    }
}

/* --- VOICE ENGINE (STT) --- */
class VoiceEngine {
    constructor(callback) {
        this.callback = callback;
        this.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        this.isActive = false;
        this.recognition = null;
        this.init();
    }

    init() {
        if (!this.SpeechRecognition) {
            Logger.error("Navigateur incompatible avec la reconnaissance vocale.");
            document.getElementById('btnVoice').disabled = true;
            return;
        }
        this.createRecognition();
    }

    createRecognition() {
        this.recognition = new this.SpeechRecognition();
        this.recognition.lang = 'fr-FR';
        this.recognition.continuous = true;
        this.recognition.interimResults = false;

        this.recognition.onstart = () => {
            Logger.log("Reconnaissance vocale démarrée.", "audio");
            this.isActive = true;
            this.updateButton();
        };

        this.recognition.onend = () => {
            // Si on est censé être actif, on redémarre (auto-restart)
            if (this.isActive) {
                Logger.log("Connexion perdue, tentative reconnexion...", "warn");
                try { this.recognition.start(); } catch(e) { this.isActive = false; this.updateButton(); }
            } else {
                this.updateButton();
            }
        };

        this.recognition.onresult = (event) => {
            const last = event.results[event.results.length - 1];
            if (last.isFinal) {
                this.callback(last[0].transcript);
            }
        };

        this.recognition.onerror = (event) => {
            if (event.error === 'not-allowed') {
                Logger.error("Permission micro refusée par l'utilisateur.");
                this.isActive = false;
                this.updateButton();
            } else if (event.error !== 'no-speech') {
                Logger.warn("Erreur Mic: " + event.error);
            }
        };
    }

    toggle() {
        if (!this.SpeechRecognition) return;

        if (this.isActive) {
            this.isActive = false;
            this.recognition.stop();
            Logger.log("Arrêt manuel de l'écoute.", "sys");
        } else {
            try {
                this.recognition.start();
            } catch (e) {
                // Si erreur lors du start (ex: objet mort), on le recrée
                Logger.warn("Redémarrage du module vocal requis...", "warn");
                this.createRecognition();
                this.recognition.start();
            }
        }
    }

    updateButton() {
        const btn = document.getElementById('btnVoice');
        if (this.isActive) {
            btn.textContent = "2. Écouter (ON)";
            btn.classList.add('listening');
        } else {
            btn.textContent = "2. Écouter (OFF)";
            btn.classList.remove('listening');
        }
    }
}

/* --- VISUALS --- */
class NeuralBrain {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.nodes = [];
        this.nodeCount = 60;
        this.connectionDist = 150;
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.initNodes();
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight - 270; // Ajusté header + terminal
    }

    initNodes() {
        this.nodes = [];
        for (let i = 0; i < this.nodeCount; i++) {
            this.nodes.push({
                x: Math.random() * this.canvas.width,
                y: Math.random() * this.canvas.height,
                vx: (Math.random() - 0.5),
                vy: (Math.random() - 0.5),
                size: Math.random() * 2 + 1
            });
        }
    }

    draw(audio) {
        const w = this.canvas.width;
        const h = this.canvas.height;
        const { volume, bass, raw } = audio;

        // Effet de trainée
        this.ctx.fillStyle = 'rgba(5, 5, 8, 0.2)';
        this.ctx.fillRect(0, 0, w, h);

        // Cœur
        const cx = w/2, cy = h/2;
        this.ctx.beginPath();
        this.ctx.arc(cx, cy, 40 + (bass/5), 0, Math.PI*2);
        this.ctx.strokeStyle = `rgba(0, 243, 255, ${0.1 + volume/200})`;
        this.ctx.stroke();

        // Noeuds
        this.ctx.fillStyle = '#00f3ff';
        this.nodes.forEach(n => {
            n.x += n.vx; n.y += n.vy;
            if (n.x<0||n.x>w) n.vx*=-1;
            if (n.y<0||n.y>h) n.vy*=-1;

            const r = n.size + (volume/30);
            this.ctx.beginPath();
            this.ctx.arc(n.x, n.y, r, 0, Math.PI*2);
            this.ctx.fill();
        });

        // Connexions
        this.ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
        for(let i=0; i<this.nodes.length; i++) {
            for(let j=i+1; j<this.nodes.length; j++) {
                const d = Math.hypot(this.nodes[i].x - this.nodes[j].x, this.nodes[i].y - this.nodes[j].y);
                if (d < this.connectionDist) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.nodes[i].x, this.nodes[i].y);
                    this.ctx.lineTo(this.nodes[j].x, this.nodes[j].y);
                    this.ctx.stroke();
                }
            }
        }

        // Spectrum
        if(raw) {
            const barW = (w / raw.length) * 2.5;
            let x = 0;
            for(let i=0; i<raw.length; i++) {
                const barH = (raw[i]/255) * (h/3);
                this.ctx.fillStyle = `rgba(0, 243, 255, 0.2)`;
                this.ctx.fillRect(x, h-barH, barW, barH);
                x += barW + 1;
            }
        }
    }
}

/* --- APP --- */
class App {
    constructor() {
        this.audio = new AudioEngine();
        this.ai = new AIEngine();
        this.brain = new NeuralBrain(document.getElementById('canvas'));
        this.voice = new VoiceEngine((txt) => this.ai.process(txt));

        document.getElementById('btnMic').onclick = async () => {
            const success = await this.audio.init();
            if(success) document.getElementById('btnMic').textContent = "Micro Actif";
        };
        
        document.getElementById('btnVoice').onclick = () => this.voice.toggle();

        this.loop();
        Logger.log("Initialisation terminée. Cliquez sur 'Activer Micro'.", "sys");
    }

    loop() {
        requestAnimationFrame(() => this.loop());
        this.brain.draw(this.audio.getAnalysis());
    }
}

const app = new App();
</script>
</body>
</html>
