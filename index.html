<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎤 SUPRA LAB - RELAIS FREE MOBILE</title>
    <style>
        :root {
            --primary: #00ff41;
            --danger: #ff0044;
            --bg: #000;
            --bg-dark: #001100;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }
        body {
            background: var(--bg);
            color: var(--primary);
            min-height: 100vh;
            padding: 15px;
        }
        #start-screen, #main {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: var(--bg);
        }
        #main { display: none; }
        .boot-text {
            font-size: 22px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px var(--primary);
            text-align: center;
        }
        button {
            background: var(--bg-dark);
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 12px 24px;
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: var(--primary); color: var(--bg); }
        #btnStart { padding: 15px 30px; font-size: 18px; }
        .panel {
            background: var(--bg-dark);
            border: 1px solid var(--primary);
            padding: 15px;
            margin: 10px 0;
            width: 100%;
        }
        .panel-header {
            margin-bottom: 10px;
            font-size: 16px;
            color: #00cc33;
        }
        #log {
            height: 250px;
            overflow-y: auto;
            font-size: 14px;
            white-space: pre-wrap;
        }
        .log-line { margin-bottom: 5px; }
        .log-line::before { content: "> "; color: #00cc33; }
        #ai-report {
            min-height: 150px;
            font-size: 14px;
            white-space: pre-wrap;
            background: var(--bg-dark);
            border: 1px dashed var(--primary);
            padding: 15px;
        }
        #settings-page {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            padding: 20px;
            z-index: 101;
            overflow-y: auto;
        }
        #settings-page.active { display: block; }
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-dark);
            border-top: 1px solid var(--primary);
            padding: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        #voiceToggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: var(--bg);
            font-size: 20px;
            cursor: pointer;
        }
        #micIndicator {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--bg-dark);
            border: 2px solid #00cc33;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        #micIndicator.listening {
            background: var(--primary);
            border-color: var(--primary);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .alert {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-dark);
            border: 2px solid var(--danger);
            padding: 15px;
            font-size: 16px;
            text-align: center;
            z-index: 20000;
            display: none;
        }
        .alert.active { display: block; }
    </style>
</head>
<body>
    <!-- ÉCRAN DE DÉMARRAGE -->
    <div id="start-screen">
        <div class="boot-text">
            🎤 SUPRA LAB
            <div style="color: #ffaa00;">SOLUTION 404 FREE MOBILE</div>
        </div>
        <button id="btnStart">🚀 LANCER</button>
        <button id="btnSettings">⚙️ PARAMÈTRES</button>
    </div>

    <!-- INTERFACE PRINCIPALE -->
    <div id="main">
        <div class="panel">
            <div class="panel-header">🤖 TRANSCRIPTION</div>
            <div id="ai-report">[PRÊT]</div>
            <div style="margin-top: 10px; text-align: center;">
                <button id="sendToGroqBtn">📤 ENVOYER À GROQ</button>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header">📜 JOURNAL</div>
            <div id="log"></div>
        </div>
    </div>

    <!-- PAGE DE PARAMÈTRES -->
    <div id="settings-page">
        <div style="text-align: center; margin-bottom: 20px; color: var(--primary);">
            ⚙️ PARAMÈTRES
            <button id="closeSettings" style="position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--primary); font-size: 24px; cursor: pointer;">✕</button>
        </div>
        <div style="background: var(--bg-dark); border: 1px solid var(--primary); padding: 15px; margin-bottom: 15px;">
            <div style="margin-bottom: 10px;">
                <label for="groqApiKey" style="display: block; margin-bottom: 5px;">Clé API Groq :</label>
                <input type="text" id="groqApiKey" placeholder="Ta clé API" style="width: 100%; padding: 8px; background: #000; color: var(--primary); border: 1px solid var(--primary);">
                <button id="testApiKeyBtn" style="margin-top: 10px; width: 100%;">🧪 TESTER LA CLÉ</button>
                <div id="apiTestResult" style="margin-top: 10px; font-size: 14px;"></div>
            </div>
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <button id="saveSettings">💾 SAUVEGARDER</button>
            <button id="closeSettings2">FERMER</button>
        </div>
    </div>

    <!-- BOUTONS VOIX -->
    <button id="voiceToggle" title="Activer/Désactiver la voix">🎤</button>
    <div id="micIndicator" title="État du micro">🎤</div>

    <!-- BARRE DE STATUS -->
    <div class="status-bar">
        <span id="status-text">En attente...</span>
        <span>v11 - Solution 404</span>
    </div>

    <!-- ALERTE -->
    <div class="alert" id="criticalAlert">⚠️ ALERTE : <span id="alert-message"></span></div>

    <script>
        // ========== CONFIG ==========
        let config = {
            groqApiKey: localStorage.getItem('groqApiKey') || '',
            voiceFeedback: true,
            voiceLanguage: 'fr-FR'
        };
        let finalTranscript = '';
        let recognition = null;
        let isListening = false;
        let isVoiceEnabled = false;
        let synthesis = window.speechSynthesis;
        let isSpeaking = false;

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', () => {
            setupUI();
            loadVoices();
            if (config.groqApiKey) document.getElementById('groqApiKey').value = config.groqApiKey;
        });

        // ========== BASE FUNCTIONS ==========
        function log(text, important = false) {
            const logDiv = document.getElementById('log');
            if (!logDiv) return;
            const line = document.createElement('div');
            line.className = 'log-line' + (important ? ' important' : '');
            line.innerHTML = `<span style="color: #00ff00;">[${new Date().toLocaleTimeString('fr-FR')}]</span> ${text}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(txt) {
            document.getElementById('status-text').textContent = txt;
        }

        function showAlert(message) {
            const alertBox = document.getElementById('criticalAlert');
            const alertMsg = document.getElementById('alert-message');
            if (alertMsg) alertMsg.textContent = message;
            if (alertBox) {
                alertBox.classList.add('active');
                setTimeout(() => alertBox.classList.remove('active'), 5000);
            }
            log(`⚠️ ALERTE: ${message}`, true);
        }

        function loadVoices() {
            if ('speechSynthesis' in window) {
                synthesis.getVoices();
                if (synthesis.onvoiceschanged) synthesis.onvoiceschanged = loadVoices;
            }
        }

        function getVoice(lang) {
            const voices = synthesis.getVoices();
            return voices.find(v => v.lang.startsWith(lang)) || voices[0];
        }

        function speakText(text) {
            if (!config.voiceFeedback || !isVoiceEnabled || !synthesis) return;
            if (isSpeaking) synthesis.cancel();
            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = config.voiceLanguage;
                utterance.voice = getVoice(config.voiceLanguage);
                utterance.onend = () => isSpeaking = false;
                synthesis.speak(utterance);
                isSpeaking = true;
                log(`[VOIX] "${text}"`);
            } catch (e) {
                log(`[VOIX ERREUR] ${e.message}`, true);
            }
        }

        function stopSpeaking() {
            if (synthesis) synthesis.cancel();
            isSpeaking = false;
        }

        // ========== PERMISSIONS ==========
        async function checkMicrophonePermission() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                log("[OK] Micro autorisé", true);
                return true;
            } catch (err) {
                log(`[ERREUR] ${err.message}`, true);
                showAlert("Activez le micro dans les paramètres !");
                return false;
            }
        }

        // ========== RELAIS POUR FREE MOBILE ==========
        // Utilise un relais public qui contourne les restrictions
        const RELAY_URL = "https://supra-lab-relay.glitch.me";

        // ========== TEST CLÉ API VIA RELAIS ==========
        async function testGroqApiKey() {
            const apiKey = document.getElementById('groqApiKey').value.trim();
            if (!apiKey) {
                document.getElementById('apiTestResult').textContent = "⚠️ Clé manquante";
                document.getElementById('apiTestResult').style.color = "#ffaa00";
                return;
            }

            log("[GROQ] Test de la clé via relais...", true);
            updateStatus("Test API...");

            try {
                const response = await fetch(`${RELAY_URL}/test-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apiKey })
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(`Erreur ${response.status}: ${error.error || 'Inconnue'}`);
                }

                const data = await response.json();
                if (data.choices && data.choices[0].message.content.trim() === "OK") {
                    log("[OK] Clé API VALIDE !", true);
                    document.getElementById('apiTestResult').textContent = "✅ VALIDE";
                    document.getElementById('apiTestResult').style.color = "#00ff41";
                    config.groqApiKey = apiKey;
                    localStorage.setItem('groqApiKey', apiKey);
                } else {
                    document.getElementById('apiTestResult').textContent = "⚠️ Réponse inattendue";
                    document.getElementById('apiTestResult').style.color = "#ffaa00";
                }
                updateStatus("Prêt");
            } catch (error) {
                log(`[ERREUR] ${error.message}`, true);
                document.getElementById('apiTestResult').textContent = `❌ Erreur: ${error.message}`;
                document.getElementById('apiTestResult').style.color = "#ff0044";
                updateStatus("Erreur");
            }
        }

        // ========== RECONNAISSANCE VOCALE ==========
        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                log("[ERREUR] Reconnaissance vocale non supportée", true);
                showAlert("Utilisez Chrome");
                return;
            }

            try {
                if (recognition) recognition.stop();

                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'fr-FR';

                finalTranscript = '';

                recognition.onresult = (event) => {
                    let interim = '';
                    let final = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const trans = event.results[i][0].transcript;
                        if (event.results[i].isFinal) final += trans;
                        else interim += trans;
                    }
                    if (interim) log(`[IA] "${interim}"`);
                    if (final) {
                        finalTranscript = final.trim();
                        log(`[IA] ✅ "${finalTranscript}"`);
                        document.getElementById('ai-report').textContent =
                            `// TRANSCRIPTION\n> "${finalTranscript}"\n\n// STATUT: Prêt pour analyse`;
                        if (config.groqApiKey) sendToGroq(finalTranscript);
                        if (config.voiceFeedback) speakText(`Reçu: ${finalTranscript}`);
                    }
                };

                recognition.onerror = (event) => {
                    log(`[ERREUR] ${event.error}`, true);
                    if (event.error === 'not-allowed') showAlert("Micro bloqué !");
                    if (isVoiceEnabled) setTimeout(initSpeech, 1000);
                };

                recognition.onstart = () => {
                    isListening = true;
                    isVoiceEnabled = true;
                    log("[OK] Écoute activée", true);
                    updateStatus("Écoute...");
                    document.getElementById('micIndicator').classList.add('listening');
                    document.getElementById('voiceToggle').classList.add('active');
                };

                recognition.onend = () => {
                    isListening = false;
                    updateStatus("Prêt");
                    document.getElementById('micIndicator').classList.remove('listening');
                    document.getElementById('voiceToggle').classList.remove('active');
                    if (isVoiceEnabled) setTimeout(initSpeech, 100);
                };

                recognition.start();
            } catch (e) {
                log(`[ERREUR] ${e.message}`, true);
            }
        }

        function stopSpeechRecognition() {
            if (recognition) {
                recognition.stop();
                isVoiceEnabled = false;
                isListening = false;
                updateStatus("Désactivé");
                document.getElementById('micIndicator').classList.remove('listening');
                document.getElementById('voiceToggle').classList.remove('active');
            }
        }

        // ========== ENVOI À GROQ VIA RELAIS ==========
        async function sendToGroq(transcript) {
            if (!config.groqApiKey) {
                log("[ERREUR] Clé API manquante", true);
                return;
            }

            try {
                log("[GROQ] Envoi via relais...", true);
                updateStatus("Envoi à Groq...");

                const response = await fetch(`${RELAY_URL}/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        apiKey: config.groqApiKey,
                        transcript: transcript
                    })
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(`Erreur ${response.status}: ${error.error || 'Inconnue'}`);
                }

                const data = await response.json();
                const reply = data.choices[0].message.content;
                document.getElementById('ai-report').textContent += `\n\n// RÉPONSE GROQ\n${reply}\n// =====`;
                if (config.voiceFeedback) speakText(`Groq: ${reply.split('\n')[0]}`);
                log("[OK] Réponse reçue", true);
                updateStatus("Prêt");
            } catch (error) {
                log(`[ERREUR] ${error.message}`, true);
                updateStatus("Erreur Groq");
            }
        }

        // ========== UI SETUP ==========
        function setupUI() {
            // LANCER
            document.getElementById('btnStart').addEventListener('click', async () => {
                const start = document.getElementById('start-screen');
                const main = document.getElementById('main');
                if (!start || !main) return;

                const ok = await checkMicrophonePermission();
                if (!ok) return;

                start.style.display = 'none';
                main.style.display = 'block';
                log("=== SYSTÈME LANCÉ ===");
                updateStatus("Prêt");

                // Ajoute le bouton IA
                const btnIA = document.createElement('button');
                btnIA.textContent = '🎤 ACTIVER VOIX';
                btnIA.id = 'btnStartIA';
                btnIA.style.cssText = 'margin: 10px;';
                document.querySelector('#main .panel:first-child').appendChild(btnIA);

                btnIA.addEventListener('click', () => {
                    isVoiceEnabled ? stopSpeechRecognition() : initSpeech();
                });
            });

            // PARAMÈTRES
            document.getElementById('btnSettings').addEventListener('click', () => {
                document.getElementById('settings-page').classList.add('active');
            });

            // FERMER PARAMÈTRES
            ['closeSettings', 'closeSettings2'].forEach(id => {
                document.getElementById(id)?.addEventListener('click', () => {
                    document.getElementById('settings-page').classList.remove('active');
                });
            });

            // TEST CLÉ API
            document.getElementById('testApiKeyBtn').addEventListener('click', testGroqApiKey);

            // SAUVEGARDER
            document.getElementById('saveSettings').addEventListener('click', () => {
                config.groqApiKey = document.getElementById('groqApiKey').value;
                localStorage.setItem('groqApiKey', config.groqApiKey);
                localStorage.setItem('supraLabConfig', JSON.stringify(config));
                log("[OK] Paramètres sauvegardés");
                document.getElementById('settings-page').classList.remove('active');
            });

            // TOGGLE VOIX
            document.getElementById('voiceToggle').addEventListener('click', () => {
                isVoiceEnabled = !isVoiceEnabled;
                if (isVoiceEnabled && !isListening) initSpeech();
                else if (!isVoiceEnabled) stopSpeechRecognition();
            });

            // ENVOYER À GROQ
            document.getElementById('sendToGroqBtn').addEventListener('click', () => {
                if (!finalTranscript) {
                    log("[ERREUR] Rien à envoyer", true);
                    return;
                }
                sendToGroq(finalTranscript);
            });
        }

        // ========== CLEANUP ==========
        window.addEventListener('beforeunload', () => {
            stopSpeechRecognition();
            stopSpeaking();
            if (recognition) recognition.stop();
        });
    </script>
</body>
</html>
