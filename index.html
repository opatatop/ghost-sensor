<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUPRA AI v9.1 // STABILITY</title>
<style>
    :root {
        --bg-color: #020205;
        --primary: #00f3ff;
        --secondary: #bc13fe;
        --danger: #ff2a2a;
        --text-color: #e0e0e0;
        --font-main: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
    
    body {
        margin: 0; background-color: var(--bg-color); color: var(--text-color);
        font-family: var(--font-main); overflow: hidden; height: 100vh;
        display: flex; flex-direction: column; border-top: 2px solid var(--primary);
    }

    /* CRT EFFECT */
    body::after {
        content: " "; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 999; opacity: 0.4;
    }

    /* HEADER */
    header {
        position: relative; z-index: 10; height: 70px;
        background: rgba(5, 10, 15, 0.9); border-bottom: 1px solid var(--primary);
        display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
    }

    .brand { font-size: 1.1rem; font-weight: 900; color: var(--primary); letter-spacing: 3px; text-transform: uppercase; display: flex; flex-direction: column; line-height: 1; }
    .brand span { font-size: 0.6rem; color: #666; letter-spacing: 1px; margin-top: 2px; }
    
    .status-indicator {
        font-size: 0.8rem; color: #fff; background: #111; padding: 5px 10px; border: 1px solid #333;
        text-transform: uppercase; letter-spacing: 1px; min-width: 120px; text-align: center;
        transition: 0.3s;
    }
    .status-indicator.active { border-color: var(--secondary); color: var(--secondary); box-shadow: 0 0 10px var(--secondary); }
    .status-indicator.listening { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 10px var(--primary); }

    .controls { display: flex; gap: 8px; align-items: center; }

    button {
        background: rgba(0,0,0,0.6); border: 1px solid #444; color: #ccc;
        padding: 8px 12px; font-family: var(--font-main); font-weight: bold; font-size: 0.7rem;
        cursor: pointer; transition: 0.2s; text-transform: uppercase;
    }
    button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    
    #btnPrivacy { border-color: #333; color: #555; }
    #btnPrivacy.privacy-on { border-color: var(--danger); color: var(--danger); background: rgba(255, 42, 42, 0.1); animation: blinkRed 1s infinite; }
    
    @keyframes blinkRed { 0% { box-shadow: 0 0 5px var(--danger); } 50% { box-shadow: 0 0 15px var(--danger); } 100% { box-shadow: 0 0 5px var(--danger); } }

    /* CANVAS */
    #canvas-container { flex-grow: 1; position: relative; z-index: 1; overflow: hidden; background: radial-gradient(circle at center, #08080c 0%, #000 100%); }
    canvas { display: block; width: 100%; height: 100%; }

    /* TERMINAL */
    #terminal {
        height: 140px; background: rgba(0, 0, 0, 0.95); border-top: 1px solid var(--primary);
        padding: 8px 15px; font-size: 11px; overflow-y: auto; z-index: 10;
        scrollbar-width: thin; scrollbar-color: var(--primary) #000; font-family: 'Consolas', monospace;
    }
    .log-line { margin-bottom: 2px; padding-left: 8px; opacity: 0; animation: slideIn 0.2s forwards; display: flex; gap: 8px;}
    .log-time { color: #444; min-width: 65px; }
    .log-msg { color: #aaa; }
    .log-sys { color: #555; }
    .log-wake { color: var(--secondary); font-weight: bold; text-shadow: 0 0 5px var(--secondary); }
    .log-err { color: var(--danger); }
    @keyframes slideIn { from { opacity:0; transform:translateX(-5px); } to { opacity:1; transform:translateX(0); } }

    /* MODALS */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
    .modal-content { background: #0f0f13; border: 1px solid var(--primary); padding: 20px; width: 100%; max-width: 350px; box-shadow: 0 0 30px rgba(0, 243, 255, 0.15); }
    .modal-content input { width: 100%; background: #000; border: 1px solid #333; color: var(--primary); padding: 10px; margin: 10px 0; font-family: monospace; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }

    /* BOOT OVERLAY */
    #boot-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #000; z-index: 2000; display: flex; flex-direction: column;
        justify-content: center; align-items: center; color: var(--primary);
    }
    .start-btn {
        margin-top: 30px; padding: 15px 40px; background: var(--primary); color: #000;
        border: none; font-family: var(--font-main); font-weight: bold; font-size: 1.2rem;
        cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
        box-shadow: 0 0 20px var(--primary); transition: 0.3s;
    }
    .start-btn:hover { transform: scale(1.05); box-shadow: 0 0 40px var(--primary); }
</style>
</head>
<body>

<div id="boot-overlay">
    <h1 style="letter-spacing:5px; margin:0;">SUPRA SENTINEL</h1>
    <div style="font-size:0.8rem; color:#666; margin-top:5px;">SYSTÈME PRÊT</div>
    <button class="start-btn" onclick="app.manualBoot()">INITIALISER</button>
</div>

<header>
    <div class="brand">SUPRA <span>SENTINEL</span></div>
    <div id="statusDisplay" class="status-indicator">VEILLE</div>
    <div class="controls">
        <button id="btnPrivacy">🔒 PRIVACY</button>
        <button id="btnConfig">⚙️ CONFIG</button>
    </div>
</header>

<div id="canvas-container">
    <canvas id="canvas"></canvas>
</div>

<div id="terminal"></div>

<!-- CONFIG MODAL -->
<div id="config-modal" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--primary); margin-top:0;">PARAMÈTRES</h3>
        <p style="color:#777; font-size:0.8rem;">Dites "SUPRA" avant chaque commande.</p>
        <label style="color:#888; font-size:0.7rem;">CLÉ API OPENAI (Optionnel)</label>
        <input type="password" id="apiKeyInput" placeholder="sk-...">
        <div class="modal-actions">
            <button onclick="toggleModal()" style="border-color:#333;">FERMER</button>
            <button onclick="saveConfig()" style="background:var(--primary); color:#000;">OK</button>
        </div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
const now = () => new Date().toLocaleTimeString('fr-FR', {hour12:false});

const Logger = {
    log: (msg, type="sys") => {
        const t = $('terminal');
        if(!t) return; // Sécurité
        const d = document.createElement("div");
        d.className = `log-line log-${type}`;
        d.innerHTML = `<span class="log-time">[${now()}]</span> <span class="log-msg">${msg}</span>`;
        t.appendChild(d);
        t.scrollTop = t.scrollHeight;
        if(t.childElementCount > 40) t.removeChild(t.firstChild);
    }
};

/* --- AUDIO ENGINE --- */
class AudioEngine {
    constructor() {
        this.ready = false;
        this.analyser = null;
        this.dataArray = null;
        this.stream = null;
        this.ctx = null;
        this.isMuted = false;
    }
    async start() {
        if(this.ready || this.isMuted) return true;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (this.ctx.state === 'suspended') await this.ctx.resume();
            this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const src = this.ctx.createMediaStreamSource(this.stream);
            this.analyser = this.ctx.createAnalyser();
            this.analyser.fftSize = 512;
            src.connect(this.analyser);
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
            this.ready = true;
            Logger.log("Flux audio actif.", "sys");
            return true;
        } catch(e) { 
            console.error(e);
            Logger.log("Erreur Micro: Vérifiez les permissions.", "err"); 
            return false;
        }
    }
    stop() {
        if(this.stream) { this.stream.getTracks().forEach(track => track.stop()); this.stream = null; }
        this.ready = false;
    }
    getData() {
        if(!this.ready || this.isMuted) return { vol:0, raw: new Uint8Array(0) };
        this.analyser.getByteFrequencyData(this.dataArray);
        let sum = 0;
        for(let i=0; i<this.dataArray.length; i++) sum += this.dataArray[i];
        return { vol: sum / this.dataArray.length, raw: this.dataArray };
    }
}

/* --- WAKE WORD ENGINE --- */
class Brain {
    constructor() {
        this.apiKey = localStorage.getItem('supra_api_key') || "";
        this.synth = window.speechSynthesis;
        this.voices = [];
        this.loadVoices();
        if(speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = () => this.loadVoices();
    }
    loadVoices() { this.voices = this.synth.getVoices(); }
    setKey(k) { this.apiKey = k.trim(); localStorage.setItem('supra_api_key', this.apiKey); }

    async process(text) {
        const t = text.toLowerCase().trim();
        if(t.length < 2) return;

        const wakeWords = ["supra", "humain", "ordi"];
        let command = "";
        let triggered = false;

        for(let word of wakeWords) {
            if(t.startsWith(word)) {
                triggered = true;
                command = t.replace(word, "").trim();
                break;
            }
        }

        if(!triggered) return; // Ignore le bruit

        app.setStatus("COMMANDE", true);
        Logger.log(`DETECTÉ: "${text}"`, "wake");
        sfx.play(800, 'sine', 0.1);

        if(!command) {
            this.speak("Oui ? Je vous écoute.");
            app.resetStatus();
            return;
        }

        let response = "";
        if (this.apiKey.length > 10) {
            try { response = await this.fetchGPT(command); }
            catch(e) { response = this.localLogic(command); }
        } else {
            response = this.localLogic(command);
        }
        this.speak(response);
    }

    localLogic(cmd) {
        if(cmd.includes("heure")) return `Il est ${new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}.`;
        if(cmd.includes("date")) return `Nous sommes le ${new Date().toLocaleDateString('fr-FR')}.`;
        if(cmd.includes("qui es-tu")) return "Je suis Supra, sentinelle numérique.";
        if(cmd.includes("blague")) return "Un octet rencontre un bit. Il lui dit: 'Hé, tu as l'air pâle aujourd'hui.'";
        return "Commande reçue : " + cmd + ".";
    }

    async fetchGPT(prompt) {
        try {
            const res = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${this.apiKey}` },
                body: JSON.stringify({
                    model: "gpt-3.5-turbo",
                    messages: [{role: "system", content: "Réponds en une phrase courte."}, {role: "user", content: prompt}]
                })
            });
            const data = await res.json();
            return data.choices[0].message.content;
        } catch(e) { return "Erreur de connexion."; }
    }

    speak(text) {
        if(!text) { app.resetStatus(); return; }
        this.synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const fr = this.voices.find(v => v.lang.includes('fr'));
        if(fr) u.voice = fr;
        u.rate = 1.1;
        u.onstart = () => { app.setSpeaking(true); };
        u.onend = () => { app.resetStatus(); };
        this.synth.speak(u);
    }
}

/* --- VOICE RECOGNITION --- */
class VoiceEngine {
    constructor(callback) {
        this.callback = callback;
        this.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        this.isActive = false;
        this.keepAlive = true;
        
        if(!this.SpeechRecognition) { 
            Logger.log("Reconnaissance vocale non supportée.", "err"); 
            return; 
        }
        
        this.rec = new this.SpeechRecognition();
        this.rec.lang = 'fr-FR';
        this.rec.continuous = true;
        this.rec.interimResults = false;

        this.rec.onend = () => {
            if(this.keepAlive && !app.isMuted && !app.isSpeaking) {
                setTimeout(() => { try { this.rec.start(); } catch(e){} }, 500);
            } else {
                this.isActive = false;
                app.resetStatus();
            }
        };

        this.rec.onresult = (e) => {
            const last = e.results[e.results.length - 1];
            if(last.isFinal) this.callback(last[0].transcript);
        };

        this.rec.onstart = () => { 
            this.isActive = true; 
            if(!app.isSpeaking) app.setStatus("SURVEILLANCE", false);
        };
    }
    
    start() { 
        this.keepAlive = true; 
        try { this.rec.start(); } catch(e){ console.log(e); } 
    }
    stop() { 
        this.keepAlive = false; 
        try { this.rec.stop(); } catch(e){} 
    }
}

/* --- VISUALS --- */
class Visuals {
    constructor() {
        this.c = $('canvas');
        this.ctx = this.c.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.angle = 0;
    }
    resize() { this.c.width = this.c.offsetWidth; this.c.height = this.c.offsetHeight; }
    
    draw(audioData, state) {
        const { vol, raw } = audioData;
        const w = this.c.width, h = this.c.height, cx = w/2, cy = h/2;
        
        this.ctx.fillStyle = "rgba(2, 2, 5, 0.2)";
        this.ctx.fillRect(0,0,w,h);

        let color = '#004455';
        if(state === "SURVEILLANCE") color = '#00f3ff';
        if(state === "COMMANDE") color = '#bc13fe';
        if(state === "SPEAKING") color = '#fff';

        const r = 50 + (vol * 0.5) + (Math.sin(this.angle)*5);
        this.ctx.beginPath();
        this.ctx.arc(cx, cy, r, 0, Math.PI*2);
        this.ctx.strokeStyle = color;
        this.ctx.lineWidth = 2;
        this.ctx.stroke();

        if(state === "SURVEILLANCE" || state === "IDLE") {
            this.ctx.save();
            this.ctx.translate(cx, cy);
            this.ctx.rotate(this.angle);
            this.ctx.beginPath();
            this.ctx.moveTo(0,0);
            this.ctx.lineTo(0, -150);
            const grad = this.ctx.createLinearGradient(0,0,0,-150);
            grad.addColorStop(0, color);
            grad.addColorStop(1, 'transparent');
            this.ctx.strokeStyle = grad;
            this.ctx.lineWidth = 50;
            this.ctx.lineCap = 'round';
            this.ctx.stroke();
            this.ctx.restore();
        }

        if(raw && raw.length > 0 && state !== "IDLE") {
            const step = Math.floor(raw.length / 40);
            for(let i=0; i<40; i++) {
                const val = raw[i*step];
                const hBar = (val/255)*100;
                this.ctx.fillStyle = color;
                this.ctx.fillRect(cx - 100 + (i*5), cy + 60, 4, hBar);
            }
        }
        this.angle += 0.02;
    }
}

/* --- SOUND FX --- */
class SoundFX {
    constructor() { this.ctx = null; }
    init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    play(freq, type, dur) {
        this.init();
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type; osc.frequency.value = freq;
        g.gain.setValueAtTime(0.1, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + dur);
    }
}

/* --- APP CONTROLLER --- */
class App {
    constructor() {
        this.audio = new AudioEngine();
        this.brain = new Brain();
        this.visuals = new Visuals();
        this.voice = new VoiceEngine(t => this.brain.process(t));
        this.sfx = new SoundFX();
        this.isMuted = false;
        this.isSpeaking = false;
        this.currentState = "IDLE";

        this.setupUI();
        this.loop();
    }

    setupUI() {
        $('btnPrivacy').onclick = () => this.togglePrivacy();
        $('btnConfig').onclick = () => {
            $('apiKeyInput').value = this.brain.apiKey;
            $('config-modal').style.display = 'flex';
        };
    }

    async manualBoot() {
        // 1. Lancer l'audio (nécessite le clic)
        const audioSuccess = await this.audio.start();
        
        // 2. Cacher l'overlay
        const overlay = $('boot-overlay');
        overlay.style.opacity = 0;
        setTimeout(() => overlay.remove(), 1000);

        if(audioSuccess) {
            Logger.log("Système opérationnel. En attente 'SUPRA'.", "sys");
            this.setStatus("SURVEILLANCE", false);
            this.voice.start();
        } else {
            Logger.log("Échec initialisation Micro. Vérifiez les paramètres.", "err");
            this.setStatus("ERREUR", false);
        }
    }

    togglePrivacy() {
        this.isMuted = !this.isMuted;
        const btn = $('btnPrivacy');
        if(this.isMuted) {
            this.audio.stop();
            this.voice.stop();
            btn.classList.add('privacy-on');
            btn.textContent = "🔓 MICRO OFF";
            Logger.log("PRIVACY MODE ACTIVÉ", "err");
            this.setStatus("MUET", false);
        } else {
            this.audio.start();
            this.voice.start();
            btn.classList.remove('privacy-on');
            btn.textContent = "🔒 PRIVACY";
            Logger.log("Micro réactivé.", "sys");
            this.setStatus("SURVEILLANCE", false);
        }
    }

    setStatus(text, active) {
        this.currentState = text;
        const el = $('statusDisplay');
        el.textContent = text;
        el.className = "status-indicator " + (active ? "active" : "listening");
    }
    
    resetStatus() {
        this.isSpeaking = false;
        if(!this.isMuted) this.setStatus("SURVEILLANCE", false);
        else this.setStatus("MUET", false);
    }

    setSpeaking(val) { 
        this.isSpeaking = val; 
        if(val) this.setStatus("PAROLE", true);
    }

    loop() {
        requestAnimationFrame(() => this.loop());
        this.visuals.draw(this.audio.getData(), this.currentState);
    }
}

/* GLOBALS */
const sfx = new SoundFX();
let app;

window.onload = () => { app = new App(); };
window.toggleModal = () => $('config-modal').style.display = 'none';
window.saveConfig = () => { 
    app.brain.setKey($('apiKeyInput').value); 
    toggleModal(); 
    Logger.log("Configuration sauvegardée.", "sys");
};
</script>
</body>
</html>
