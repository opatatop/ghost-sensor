<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>KITT v52 FINAL</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--fg:#00ff41;--dim:#00aa2a;--muted:#006618;--red:#ff0033;--orange:#ff6600;--blue:#00ccff;--panel:#0a0a0a;--font:'VT323',monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;color:var(--fg);font-family:var(--font);-webkit-tap-highlight-color:transparent}
body{background-image:linear-gradient(rgba(0,255,65,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,65,.03) 1px,transparent 1px);background-size:28px 28px}
button,input,select,textarea{font-family:var(--font);font-size:16px;touch-action:manipulation}
.btn{background:transparent;border:4px solid var(--fg);color:var(--fg);padding:14px 16px;cursor:pointer;box-shadow:0 0 12px rgba(0,255,65,.3);min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.btn:active{background:var(--fg);color:#000}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.blue{border-color:var(--blue);color:var(--blue)}
.btn.on{background:var(--fg)!important;color:#000!important}
.btn.sm{min-height:50px;padding:10px 14px;font-size:16px}
.btntitle{font-size:20px;line-height:1.1}
.btndesc{font-size:11px;color:var(--muted)}
.scanline{position:fixed;top:0;left:0;right:0;height:3px;z-index:9998;pointer-events:none;background:linear-gradient(90deg,transparent,var(--red) 45%,#fff 50%,var(--red) 55%,transparent);background-size:40% 100%;animation:kitt 2.2s linear infinite}
@keyframes kitt{to{background-position:140% 0}}
#boot{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;border:5px solid var(--fg);background:#000;text-align:center;padding:20px}
#boot h1{font-size:28px;letter-spacing:2px;text-shadow:0 0 14px rgba(0,255,65,.7)}
#boot p{color:var(--red);margin:12px 0;font-size:16px}
#boot .sub{color:var(--muted);font-size:13px}
#boot .acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:22px}
#boot .acts .btn{min-height:74px;min-width:180px;font-size:22px}
#app{display:none;position:fixed;inset:0;border:4px solid var(--fg);flex-direction:column;background:#000}
#app.show{display:flex}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:3px solid var(--fg);background:var(--panel)}
header .title{flex:1;text-align:center;font-size:14px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px;padding-bottom:58px;display:flex;flex-direction:column;gap:10px}
footer{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:8px 12px;border-top:3px solid var(--fg);background:var(--panel);font-size:12px}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar .btn{min-height:72px;width:100%}
.viz{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.panel{border:3px solid var(--fg);background:var(--panel);padding:12px;position:relative}
.panel .lab{position:absolute;top:-10px;left:10px;background:var(--panel);padding:0 6px;font-size:11px}
canvas{display:block;width:100%;height:70px;background:#000}
.live{border:3px solid var(--fg);background:#050505;padding:14px 12px 12px;position:relative;min-height:80px}
.live .lab{position:absolute;top:-10px;left:10px;background:#050505;padding:0 6px;font-size:11px}
.live .badge{position:absolute;top:8px;right:10px;border:1px solid var(--muted);color:var(--muted);padding:3px 8px;font-size:12px}
.live .badge.listen{color:var(--blue);border-color:var(--blue)}
.live .badge.rec{color:var(--red);border-color:var(--red)}
.live .badge.ok{color:var(--fg);border-color:var(--fg)}
.live .badge.speak{color:var(--blue);border-color:var(--blue)}
.live .badge.stop{color:var(--red);border-color:var(--red)}
.live .txt{margin-top:12px;font-size:17px;line-height:1.3;word-break:break-word}
.live .txt.dim{color:var(--muted);font-size:14px}
.live .txt.red{color:var(--red)}
.inputrow{display:flex;border:2px solid var(--dim);background:#050505}
.inputrow .pre{padding:12px;border-right:2px solid var(--dim);color:var(--dim)}
.inputrow input{flex:1;border:0;background:transparent;color:var(--fg);padding:12px;outline:0;font-size:17px}
.inputrow button{border:0;border-left:2px solid var(--dim);background:rgba(0,255,65,.12);color:var(--fg);padding:0 18px;font-size:18px}
.out{border:2px dashed var(--dim);background:#050505;padding:10px;min-height:90px;max-height:200px;overflow:auto;white-space:pre-wrap;font-size:15px;line-height:1.35;color:var(--dim)}
.logbox{border:2px dashed var(--orange);background:#050505;padding:8px;min-height:80px;max-height:160px;overflow:auto;font-size:12px}
.logbox div{margin:2px 0;padding-left:6px;border-left:3px solid transparent}
.logbox .ok{color:var(--dim);border-color:var(--muted)}
.logbox .err{color:var(--red);border-color:var(--red)}
.logbox .info{color:var(--orange);border-color:var(--orange)}
.logbox .qa{color:var(--fg);border-color:var(--fg)}
.sys{font-size:12px;line-height:1.4}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99999;padding:12px 18px;border:2px solid var(--fg);background:var(--panel);opacity:0;transition:.2s;max-width:92vw;text-align:center;pointer-events:none;font-size:16px}
.toast.show{opacity:1}
.toast.err{border-color:var(--red);color:var(--red)}
#ptt{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);width:100px;height:100px;border-radius:50%;display:none;align-items:center;justify-content:center;text-align:center;line-height:1.1;font-size:15px;z-index:200;background:#000;border-width:4px}
#ptt.show{display:flex}
#ptt.rec{background:var(--red);border-color:var(--red);color:#fff}
dialog{border:4px solid var(--fg);background:#000;color:var(--fg);width:96vw;max-width:720px;max-height:92vh;padding:0;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.92)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:3px solid var(--fg);position:sticky;top:0;background:#000;z-index:2;font-size:18px}
.db{padding:14px}
.df{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px;border-top:2px solid var(--muted);position:sticky;bottom:0;background:#000}
.sec{font-size:16px;color:var(--red);margin:16px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--muted)}
.fl{margin-bottom:16px}
.fl>label{display:block;margin-bottom:5px;font-size:15px}
.fl input[type=text],.fl select,.fl textarea{width:100%;padding:12px;background:#050505;border:2px solid var(--dim);color:var(--fg);font-size:16px;outline:0}
.fl textarea{min-height:64px}
.check{display:flex;align-items:flex-start;gap:12px;font-size:16px;padding:6px 0}
.check input{width:28px;height:28px;min-width:28px;accent-color:var(--fg);margin-top:2px}
.desc{font-size:13px;color:var(--dim);margin-top:4px;padding-left:40px}
.desc-select{font-size:13px;color:var(--dim);margin-top:4px}
.range{display:flex;align-items:center;gap:10px;margin-top:4px}
.range input{flex:1;height:40px;accent-color:var(--fg)}
.range span{min-width:50px;text-align:right;color:var(--orange);font-size:16px}
.summary{border:2px solid var(--orange);background:#0a0800;padding:12px;white-space:pre-wrap;font-size:14px;line-height:1.45;color:var(--orange);margin-top:8px}
#keystatus{margin-top:6px;padding:8px;border:1px dashed var(--dim);font-size:14px}
#keystatus.ok{border-color:var(--fg);color:var(--fg)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid3 .btn{min-height:54px;font-size:15px}
@media(min-width:720px){.bar{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="scanline"></div>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <div class="dh"><span>PARAMÈTRES v52</span><button class="btn sm" id="x" type="button">FERMER</button></div>
  <div class="db">
    <div class="sec">1. CLÉ GROQ</div>
    <div class="fl">
      <label>Clé gsk_…</label>
      <textarea id="key" placeholder="gsk_..." spellcheck="false"></textarea>
      <div id="keystatus">Aucune clé</div>
    </div>
    <div class="grid3">
      <button class="btn blue sm" id="paste" type="button">COLLER</button>
      <button class="btn sm" id="savekey" type="button">SAUVER</button>
      <button class="btn blue sm" id="test" type="button">TESTER</button>
    </div>

    <div class="sec">2. PROFIL</div>
    <div class="fl">
      <label>Profil</label>
      <select id="profile">
        <option value="bt">Dehors + Bluetooth</option>
        <option value="home">Maison</option>
        <option value="max">Max</option>
      </select>
      <div class="desc-select" id="profDesc">BT strict</div>
    </div>
    <div class="fl">
      <label>Sortie audio</label>
      <select id="audioOut">
        <option value="auto">Auto</option>
        <option value="speaker">Haut-parleur</option>
        <option value="bt">Bluetooth</option>
      </select>
    </div>

    <div class="sec">3. OPTIONS</div>
    <div class="fl"><label class="check"><input type="checkbox" id="agentMode" checked> Agent</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="reportSpeech" checked> Paroles autour</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="always" checked> Sans mot d'appel</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="btFriendly" checked> Relâcher micro</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="noise" checked> Bruits</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="speakNoise" checked> Dire les bruits</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="useSensors" checked> Capteurs</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="tts" checked> Voix</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="wakelock" checked> Écran allumé</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="autoLog" checked> Journal</label></div>

    <div class="sec">4. ÉCOUTE STRICTE</div>
    <div class="fl"><label>Sensibilité <span id="vsens" style="color:var(--orange)">6</span></label><div class="range"><input type="range" id="sens" min="3" max="14" value="6"></div></div>
    <div class="fl"><label>Seuil bruit <span id="vnoisevol" style="color:var(--orange)">10</span></label><div class="range"><input type="range" id="noisevol" min="5" max="18" value="10"></div></div>
    <div class="fl"><label>Silence fin ms <span id="vsil" style="color:var(--orange)">1000</span></label><div class="range"><input type="range" id="sil" min="700" max="1600" step="50" value="1000"></div></div>
    <div class="fl"><label>Durée max s <span id="vmax" style="color:var(--orange)">9</span></label><div class="range"><input type="range" id="max" min="4" max="15" value="9"></div></div>
    <div class="fl"><label>Pause ms <span id="vgap" style="color:var(--orange)">2800</span></label><div class="range"><input type="range" id="gap" min="1500" max="5000" step="100" value="2800"></div></div>
    <div class="fl"><label>Cooldown s <span id="vcool" style="color:var(--orange)">15</span></label><div class="range"><input type="range" id="cool" min="8" max="30" value="15"></div></div>

    <div class="sec">5. IA</div>
    <div class="fl">
      <label>Modèle</label>
      <select id="model">
        <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
        <option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option>
        <option value="llama3-70b-8192">llama3-70b-8192</option>
        <option value="gemma2-9b-it">gemma2-9b-it</option>
      </select>
    </div>
    <div class="fl"><label>Temp <span id="vtemp" style="color:var(--orange)">0.2</span></label><div class="range"><input type="range" id="temp" min="0.05" max="0.35" step="0.01" value="0.2"></div></div>
    <div class="fl"><label>Tokens <span id="vtokens" style="color:var(--orange)">400</span></label><div class="range"><input type="range" id="tokens" min="80" max="800" step="20" value="400"></div></div>
    <div class="fl"><label>Vitesse voix <span id="vrate" style="color:var(--orange)">0.92</span></label><div class="range"><input type="range" id="rate" min="0.7" max="1.1" step="0.01" value="0.92"></div></div>
    <div class="fl"><label>Langue</label><select id="lang"><option value="fr">Français</option><option value="en">English</option></select></div>

    <div class="sec">6. MOTS</div>
    <div class="fl"><label>Stop</label><input type="text" id="stopw" value="stop,arrête,arrete,tais-toi,silence,assez"></div>
    <div class="fl"><label>Appel</label><input type="text" id="wake" value="kitt,supra,hey,ok"></div>
    <div class="fl"><label>Email</label><input type="text" id="mailTo" value="opatatop@protonmail.com"></div>
    <div class="fl"><label>Nom</label><input type="text" id="aiName" value="KITT"></div>

    <div class="sec">RÉSUMÉ</div>
    <div class="summary" id="configSummary">…</div>
  </div>
  <div class="df">
    <button class="btn" id="save" type="button" style="min-width:160px;min-height:64px;font-size:20px">SAUVER</button>
    <button class="btn red" id="rst" type="button" style="min-width:120px;min-height:64px">RESET</button>
  </div>
</dialog>

<section id="boot">
  <h1>KITT v52 FINAL</h1>
  <p>STRICT · STABLE · REALME</p>
  <div class="sub">code entier</div>
  <div class="acts">
    <button class="btn" id="go" type="button"><span class="btntitle">LANCER</span><span class="btndesc">Start</span></button>
    <button class="btn blue" id="cfg" type="button"><span class="btntitle">PARAMÈTRES</span><span class="btndesc">Clé</span></button>
  </div>
</section>

<div id="app">
  <header>
    <button class="btn sm" id="cfg2" type="button">MENU</button>
    <div class="title"><span id="nameTag">KITT</span> — <span id="mode">OFF</span> · <span id="profTag">BT</span></div>
    <button class="btn sm red" id="halt" type="button">STOP</button>
  </header>
  <main>
    <div class="bar">
      <button class="btn blue" id="auto" type="button"><span class="btntitle">AUTO</span><span class="btndesc">Écoute</span></button>
      <button class="btn" id="comp" type="button"><span class="btntitle">24/7</span><span class="btndesc">Permanent</span></button>
      <button class="btn" id="agentBtn" type="button"><span class="btntitle">AGENT</span><span class="btndesc">Autour</span></button>
      <button class="btn" id="profBtn" type="button"><span class="btntitle">PROFIL</span><span class="btndesc">BT/Maison/Max</span></button>
      <button class="btn" id="audioBtn" type="button"><span class="btntitle">AUDIO</span><span class="btndesc">Sortie</span></button>
      <button class="btn" id="export" type="button"><span class="btntitle">LOG</span><span class="btndesc">Export</span></button>
      <button class="btn red" id="clr" type="button"><span class="btntitle">EFFACER</span><span class="btndesc">Clear</span></button>
      <button class="btn" id="mute" type="button"><span class="btntitle">SON ON</span><span class="btndesc">Mute</span></button>
    </div>
    <div class="viz">
      <div class="panel"><div class="lab">SPECTRO</div><canvas id="c1"></canvas></div>
      <div class="panel"><div class="lab">OSCILLO</div><canvas id="c2"></canvas></div>
      <div class="panel"><div class="lab">VOLUME</div><canvas id="c3"></canvas></div>
    </div>
    <div class="live">
      <div class="lab">STATUT</div>
      <div class="badge" id="badge">PRÊT</div>
      <div class="txt dim" id="live">Micro OFF</div>
    </div>
    <div class="inputrow">
      <div class="pre">&gt;</div>
      <input id="txt" placeholder="Message ou stop" autocomplete="off">
      <button type="button" id="send">OK</button>
    </div>
    <div class="panel"><div class="lab">OREILLE</div><div class="out" id="out">…</div></div>
    <div class="panel"><div class="lab">JOURNAL</div><div class="logbox" id="log"></div></div>
    <div class="panel"><div class="lab">SYS</div><div class="sys" id="sys">—</div><div class="sys" id="stats" style="color:#006618;margin-top:4px">—</div><div class="sys" id="sensors" style="color:#006618;margin-top:4px">—</div></div>
  </main>
  <footer><span id="status">OFF</span><span>v52 · <span id="clock">--:--:--</span></span></footer>
</div>
<button class="btn" id="ptt" type="button">PTT<br>parler</button>

<script>
(function(){
'use strict';
var MODELS=['llama-3.3-70b-versatile','llama-3.1-8b-instant','llama3-70b-8192','gemma2-9b-it'];
var SAFE='llama-3.3-70b-versatile';
var S_CFG='kitt52',S_LOG='kitt52_log',S_EXP='kitt52_exp';
var GROQ='https://api.groq.com/openai/v1';
var MAX_RETRIES=3,RETRY_BASE_MS=1000,API_TIMEOUT_MS=25000;

var DEFAULT={
  key:'',model:SAFE,lang:'fr',tts:true,aiName:'KITT',profile:'bt',audioOut:'auto',
  agentMode:true,reportSpeech:true,btFriendly:true,always:true,noise:true,speakNoise:true,useSensors:true,
  sens:6,noiseVol:10,silence:1000,maxRecord:9,gapMs:2800,releaseMs:800,coolSec:15,
  temp:0.2,maxTokens:400,rate:0.92,wakelock:true,autoLog:true,
  wakeWords:'kitt,supra,hey,ok',stopWords:'stop,arrête,arrete,tais-toi,silence,assez',
  mailTo:'opatatop@protonmail.com'
};
var cfg=Object.assign({},DEFAULT);
var st={
  ready:false,ctx:null,an:null,volNode:null,stream:null,fdata:null,wdata:null,vdata:null,
  ptt:false,pmr:null,piv:null,auto:false,run:false,comp:false,speaking:false,hardStop:false,
  hist:[],fullLog:[],ctrl:null,reqs:0,lat:0,lastVol:0,lastBass:0,lastMid:0,lastHigh:0,lastNoiseAt:0,
  muted:false,loopId:0,drawOn:false,motionMag:0,motionHistory:[],motionHistoryMax:30,
  impactLevel:0,impactType:'',motionType:'still',stepCount:0,lastStepTime:0,orientation:'unknown',
  gravityEst:{x:0,y:9.8,z:0},wakelockSentinel:null,sensorsReady:false
};

function $(s){return document.querySelector(s)}
function now(){return new Date().toLocaleTimeString('fr-FR')}
function stamp(){return new Date().toLocaleString('fr-FR')}
function localTime(){return new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function cleanKey(k){return String(k||'').replace(/[\u200B-\u200D\uFEFF\u00A0\r\n\t ]+/g,'').trim()}
function norm(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function aiName(){return (cfg.aiName||'KITT').trim()||'KITT'}
function delay(ms){return new Promise(r=>setTimeout(r,ms))}
function cleanForSpeech(t){return String(t||'').replace(/\*{1,}/g,' ').replace(/[`|#]+/g,' ').replace(/<[^>]*>/g,' ').replace(/\s{2,}/g,' ').trim()}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function safeGet(k,f){try{var v=localStorage.getItem(k);return v==null?f:v}catch(e){return f}}

function isGarbageTranscript(text){
  var t=String(text||'').trim();
  if(!t||t.length<3)return true;
  var letters=t.replace(/[^a-zA-ZàâäéèêëïîôùûüçÀÂÄÉÈÊËÏÎÔÙÛÜÇ0-9]/g,'');
  if(letters.length<3)return true;
  var n=norm(t);
  var junk=['sous-titrage','sous-titre','subtitle','netflix','youtube','twitch','radio canada','radio-canada','radiocanada','cbc','musique','applause','silence','bruit','inaudible','hmm','euh','hum','hein','ouais ouais'];
  for(var i=0;i<junk.length;i++)if(n.indexOf(junk[i])!==-1)return true;
  if(letters.length/t.length<0.45)return true;
  if(t.length<7&&!/[aeiouyàéèêë]/i.test(t))return true;
  return false;
}
function isStopPhrase(text){
  var t=norm(text);if(!t)return false;
  var words=(cfg.stopWords||'').split(',');
  for(var i=0;i<words.length;i++){var w=norm(words[i]);if(w&&(t===w||t.indexOf(w)!==-1))return true}
  return /^(stop|arrete|arrête|silence)/.test(t);
}
function nextExportNum(){var n=0;try{n=parseInt(sessionStorage.getItem(S_EXP)||'0',10)||0}catch(e){}n++;try{sessionStorage.setItem(S_EXP,String(n))}catch(e){}return n}

function applyProfile(p){
  cfg.profile=p||cfg.profile||'bt';
  if(cfg.profile==='bt'){cfg.sens=6;cfg.noiseVol=10;cfg.gapMs=2800;cfg.releaseMs=800;cfg.coolSec=15;cfg.btFriendly=true;cfg.maxRecord=9}
  else if(cfg.profile==='home'){cfg.sens=5;cfg.noiseVol=9;cfg.gapMs=2000;cfg.releaseMs=600;cfg.coolSec=12;cfg.btFriendly=false;cfg.maxRecord=10}
  else{cfg.sens=4;cfg.noiseVol=8;cfg.gapMs=1600;cfg.releaseMs=500;cfg.coolSec=10;cfg.btFriendly=false;cfg.maxRecord=12}
}
function profLabel(){return cfg.profile==='home'?'MAISON':(cfg.profile==='max'?'MAX':'BT')}
var PROF_DESCS={bt:'BT strict + micro relâché',home:'Maison un peu plus sensible',max:'Plus réactif'};

var MotionTracker={
  WALK:12,RUN:22,VEH:6,STEP_MS:300,IMP2:25,IMP3:35,ALPHA:0.82,
  init:function(){
    if(!cfg.useSensors||st.sensorsReady)return;
    var self=this;
    function onM(e){
      if(!e||!e.accelerationIncludingGravity)return;
      var a=e.accelerationIncludingGravity,rx=a.x||0,ry=a.y||0,rz=a.z||0,al=self.ALPHA;
      st.gravityEst.x=al*st.gravityEst.x+(1-al)*rx;
      st.gravityEst.y=al*st.gravityEst.y+(1-al)*ry;
      st.gravityEst.z=al*st.gravityEst.z+(1-al)*rz;
      var lx=rx-st.gravityEst.x,ly=ry-st.gravityEst.y,lz=rz-st.gravityEst.z;
      var mag=Math.sqrt(lx*lx+ly*ly+lz*lz);
      st.motionMag=mag;
      st.motionHistory.push({mag:mag,t:Date.now()});
      if(st.motionHistory.length>st.motionHistoryMax)st.motionHistory.shift();
      self.classify(mag);self.step(mag);self.impact(mag,lz);
    }
    function start(){window.addEventListener('devicemotion',onM,true);st.sensorsReady=true}
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function')
      DeviceMotionEvent.requestPermission().then(s=>{if(s==='granted')start()}).catch(()=>{});
    else start();
  },
  classify:function(mag){
    var h=st.motionHistory;if(h.length<4){st.motionType='still';return}
    var r=h.slice(-4),avg=0;for(var i=0;i<r.length;i++)avg+=r[i].mag;avg/=r.length;
    if(avg>this.IMP3)st.motionType='shake';
    else if(avg>this.RUN)st.motionType='running';
    else if(avg>this.WALK)st.motionType='walking';
    else if(avg>this.VEH)st.motionType='vehicle';
    else st.motionType='still';
  },
  step:function(mag){var n=Date.now();if(mag>this.WALK&&n-st.lastStepTime>this.STEP_MS){st.stepCount++;st.lastStepTime=n}},
  impact:function(mag,lz){
    if(mag>this.IMP3){st.impactLevel=3;st.impactType='bump';setTimeout(()=>{st.impactLevel=0},1500)}
    else if(mag>this.IMP2){st.impactLevel=2;st.impactType='bump';setTimeout(()=>{st.impactLevel=0},1000)}
  },
  getSummary:function(){return st.motionType+' mag '+st.motionMag.toFixed(1)+(st.impactLevel?' choc':'')}
};

function humanNoise(vol,bass,mid,high){
  var force=vol>=14?'très fort':(vol>=11?'fort':(vol>=8?'présent':'léger'));
  var dom='équilibré';
  if(bass>=mid+8&&bass>=high+8)dom='grave';
  else if(high>=mid+8&&high>=bass+8)dom='aigu';
  var move='';
  if(cfg.useSensors){
    if(st.impactLevel>=2)move=' Choc.';
    else if(st.motionType==='walking')move=' Tu marches.';
    else if(st.motionType==='running')move=' Tu cours.';
  }
  return {line:'J\'entends un bruit '+force+', '+dom+'.'+move};
}

}

function detectQueryType(text){
  var t=norm(text);
  if(isStopPhrase(text))return 'command';
  if(/^(salut|hello|hey|bonjour)/.test(t))return 'greeting';
  if(/\?/.test(t)||/^(qui|quoi|comment|pourquoi|où|quand|peux|fais|dis|explique)/.test(t))return 'question';
  return 'conversation';
}
function getAdaptiveParams(q){
  var p={temp:cfg.temp,maxTokens:cfg.maxTokens};
  if(q==='command')p.maxTokens=40;
  else if(q==='greeting'){p.maxTokens=80;p.temp=Math.min(0.25,cfg.temp+0.03)}
  else if(q==='question')p.temp=Math.min(0.28,cfg.temp+0.03);
  return p;
}
function addToHistory(role,content){st.hist.push({role,content:String(content).slice(0,1400)});if(st.hist.length>20)st.hist=st.hist.slice(-12)}
function getContextMessages(){return st.hist.slice(-8)}

function callGroq(messages){
  var key=getKey();if(!key)return Promise.reject(new Error('Pas de clé'));
  var ctrl=new AbortController();st.ctrl=ctrl;
  var to=setTimeout(()=>ctrl.abort(),API_TIMEOUT_MS);
  return fetch(GROQ+'/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({model:cfg.model,messages,max_tokens:clamp(cfg.maxTokens,20,1200),temperature:clamp(cfg.temp,0,1),top_p:0.9}),
    signal:ctrl.signal
  }).then(r=>{
    clearTimeout(to);
    if(!r.ok)return r.text().then(txt=>{var msg='Erreur '+r.status;try{var j=JSON.parse(txt);if(j.error&&j.error.message)msg=j.error.message}catch(e){}throw new Error(msg)});
    return r.json();
  }).then(j=>{
    if(j.choices&&j.choices[0]&&j.choices[0].message)return cleanForSpeech(j.choices[0].message.content||'');
    throw new Error('Vide');
  }).catch(e=>{clearTimeout(to);if(e.name==='AbortError')throw new Error('Timeout');throw e});
}
function callGroqWithRetry(messages,attempt){
  attempt=attempt||0;
  return callGroq(messages).catch(e=>{
    if(attempt>=MAX_RETRIES-1)throw e;
    return delay(RETRY_BASE_MS*Math.pow(1.6,attempt)).then(()=>callGroqWithRetry(messages,attempt+1));
  });
}

function releaseMic(){
  try{if(st.stream)st.stream.getTracks().forEach(t=>{try{t.stop()}catch(e){}})}catch(e){}
  st.stream=null;st.ready=false;st.drawOn=false;
  st.an=null;st.volNode=null;st.fdata=null;st.wdata=null;st.vdata=null;
  try{if(st.ctx&&st.ctx.state==='running')st.ctx.suspend().catch(()=>{})}catch(e){}
  sys();
}
function ensureMic(){
  if(st.hardStop)return Promise.resolve(false);
  if(st.stream&&st.ready&&st.ctx){if(st.ctx.state==='suspended')st.ctx.resume().catch(()=>{});return Promise.resolve(true)}
  return initAudio();
}
function shouldRelease(){return !!(cfg.btFriendly||cfg.profile==='bt')}
function hardStopAll(reason){
  st.hardStop=true;st.auto=false;st.comp=false;st.run=false;st.loopId++;
  stopTTS();
  if(st.ctrl)try{st.ctrl.abort()}catch(e){}
  if(st.pmr&&st.pmr.state==='recording')try{st.pmr.stop()}catch(e){}
  st.ptt=false;clearInterval(st.piv);
  releaseMic();releaseWakeLock();
  var a=$('#auto'),c=$('#comp'),m=$('#mode');
  if(a)a.classList.remove('on');if(c)c.classList.remove('on');if(m)m.textContent='STOP';
  live(reason||'Stop.','stop');status('STOP');log('STOP','info');toast('Stop');sys();
}
function clearHardStop(){st.hardStop=false}
function requestWakeLock(){
  if(!cfg.wakelock||!('wakeLock' in navigator))return;
  navigator.wakeLock.request('screen').then(s=>{st.wakelockSentinel=s;s.addEventListener('release',()=>{st.wakelockSentinel=null})}).catch(()=>{});
}
function releaseWakeLock(){if(st.wakelockSentinel){st.wakelockSentinel.release().catch(()=>{});st.wakelockSentinel=null}}

function initAudio(){
  try{
    if(!st.ctx||st.ctx.state==='closed')st.ctx=new (window.AudioContext||window.webkitAudioContext)();
    return st.ctx.resume().then(()=>navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}}))
    .then(stream=>{
      st.stream=stream;
      var src=st.ctx.createMediaStreamSource(stream);
      st.an=st.ctx.createAnalyser();st.an.fftSize=2048;st.an.smoothingTimeConstant=0.75;src.connect(st.an);
      st.fdata=new Uint8Array(st.an.frequencyBinCount);st.wdata=new Uint8Array(st.an.fftSize);
      st.volNode=st.ctx.createAnalyser();st.volNode.fftSize=256;src.connect(st.volNode);st.vdata=new Uint8Array(st.volNode.frequencyBinCount);
      st.ready=true;st.drawOn=true;sizeCanvases();drawLoop();sys();
      return true;
    });
  }catch(e){log(String(e&&e.message||e),'err');return Promise.resolve(false)}
}
function vol(){
  if(!st.volNode||!st.vdata)return 0;
  st.volNode.getByteFrequencyData(st.vdata);
  var s=0;for(var i=0;i<st.vdata.length;i++)s+=st.vdata[i];
  return s/st.vdata.length;
}
function analyzeBands(){
  if(!st.an||!st.fdata)return {bass:0,mid:0,high:0};
  st.an.getByteFrequencyData(st.fdata);
  var n=st.fdata.length,b1=Math.floor(n*.1),b2=Math.floor(n*.4),bass=0,mid=0,high=0,cB=0,cM=0,cH=0;
  for(var i=0;i<n;i++){var v=st.fdata[i];if(i<b1){bass+=v;cB++}else if(i<b2){mid+=v;cM++}else{high+=v;cH++}}
  return {bass:cB?Math.round(bass/cB):0,mid:cM?Math.round(mid/cM):0,high:cH?Math.round(high/cH):0};
}
function drawLoop(){
  if(!st.drawOn||!st.ready)return;
  requestAnimationFrame(drawLoop);
  try{
    st.an.getByteFrequencyData(st.fdata);st.an.getByteTimeDomainData(st.wdata);st.volNode.getByteFrequencyData(st.vdata);
    var c1=$('#c1');
    if(c1){var x=c1.getContext('2d'),w=c1.width,h=c1.height;x.fillStyle='#000';x.fillRect(0,0,w,h);var n=st.fdata.length,bw=Math.max(1,w/n);for(var i=0;i<n;i++){var v=st.fdata[i];if(v<5)continue;x.fillStyle='hsl('+Math.max(0,110-v*.35)+',100%,'+Math.max(18,v*.28)+'%)';x.fillRect(i*bw,h-Math.log10(v+1)*13,bw+.3,Math.log10(v+1)*13)}}
    var c2=$('#c2');
    if(c2){var x2=c2.getContext('2d'),w2=c2.width,h2=c2.height;x2.fillStyle='#000';x2.fillRect(0,0,w2,h2);x2.strokeStyle='#00ff41';x2.beginPath();var step=w2/st.wdata.length;for(var j=0;j<st.wdata.length;j++){var y=(st.wdata[j]/128-.5)*h2*.7+h2/2;j?x2.lineTo(j*step,y):x2.moveTo(0,y)}x2.stroke()}
    var c3=$('#c3');
    if(c3){var x3=c3.getContext('2d'),w3=c3.width,h3=c3.height;x3.fillStyle='#000';x3.fillRect(0,0,w3,h3);var s=0;for(var k=0;k<st.vdata.length;k++)s+=st.vdata[k];var p=s/st.vdata.length/255;x3.fillStyle='hsl('+Math.max(0,120-p*150)+',100%,40%)';x3.fillRect(w3*.3,h3-Math.max(3,p*h3*.75),w3*.4,Math.max(3,p*h3*.75))}
  }catch(e){}
}
function sizeCanvases(){document.querySelectorAll('canvas').forEach(c=>{var r=c.parentElement.getBoundingClientRect();c.width=Math.max(40,Math.floor(r.width-14));c.height=70})}
function getMime(){var m=['audio/webm;codecs=opus','audio/webm','audio/mp4'];for(var i=0;i<m.length;i++)if(MediaRecorder.isTypeSupported(m[i]))return m[i];return''}

function waitForSound(myId){
  return new Promise(resolve=>{
    var t0=0,sens=Math.max(5,cfg.sens||6),need=320;
    function tick(){
      if(!st.auto||st.loopId!==myId||st.hardStop||st.speaking)return resolve(false);
      var v=vol();
      if(v>=sens){if(!t0)t0=Date.now();if(Date.now()-t0>=need)return resolve(true)}
      else t0=0;
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}
function recUntilSilent(myId){
  return new Promise(resolve=>{
    if(!st.stream)return resolve(null);
    var chunks=[],mime=getMime();if(!mime)return resolve(null);
    var rec;try{rec=new MediaRecorder(st.stream,{mimeType:mime})}catch(e){return resolve(null)}
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    rec.onstop=()=>{st.lastVol=vol();var b=analyzeBands();st.lastBass=b.bass;st.lastMid=b.mid;st.lastHigh=b.high;resolve(new Blob(chunks,{type:rec.mimeType}))};
    var start=Date.now(),last=Date.now(),spoken=false;
    var maxMs=(cfg.maxRecord||9)*1000,sil=Math.max(950,cfg.silence||1000);
    rec.start(60);
    var iv=setInterval(()=>{
      if(!st.auto||st.loopId!==myId||st.hardStop){clearInterval(iv);if(rec.state==='recording')rec.stop();return}
      var v=vol();
      if(v>=Math.max(5,(cfg.sens||6)*.5)){last=Date.now();spoken=true;st.lastVol=v}
      if(spoken&&(Date.now()-last>=sil||Date.now()-start>=maxMs)){clearInterval(iv);if(rec.state==='recording')rec.stop()}
      if(!spoken&&Date.now()-start>2500){clearInterval(iv);if(rec.state==='recording')rec.stop()}
    },60);
  });
}
function transcribe(blob){
  var key=getKey();if(!key)return Promise.resolve('');
  var fd=new FormData();
  fd.append('file',blob,'rec.webm');fd.append('model','whisper-large-v3');fd.append('language',cfg.lang||'fr');fd.append('response_format','json');fd.append('temperature','0');
  return fetch(GROQ+'/audio/transcriptions',{method:'POST',headers:{'Authorization':'Bearer '+key},body:fd})
  .then(r=>{if(!r.ok)throw new Error('STT '+r.status);return r.json()})
  .then(j=>(j.text||'').trim())
  .catch(e=>{log('STT: '+e.message,'err');return''});
}
function stopTTS(){try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}st.speaking=false}
function speak(text){
  if(!cfg.tts||st.muted||st.hardStop)return Promise.resolve();
  var cleaned=cleanForSpeech(text);if(!cleaned)return Promise.resolve();
  return new Promise(resolve=>{
    if(!window.speechSynthesis){resolve();return}
    stopTTS();
    var utt=new SpeechSynthesisUtterance(cleaned);
    utt.lang=cfg.lang==='en'?'en-US':'fr-FR';
    utt.rate=clamp(cfg.rate||0.92,.65,1.2);utt.pitch=1;utt.volume=1;
    var voices=speechSynthesis.getVoices();
    for(var i=0;i<voices.length;i++){if(voices[i].lang.startsWith(cfg.lang==='en'?'en':'fr')){utt.voice=voices[i];break}}
    st.speaking=true;
    var safety=setTimeout(()=>{st.speaking=false;resolve()},Math.min(20000,cleaned.length*160+2000));
    utt.onend=()=>{clearTimeout(safety);st.speaking=false;resolve()};
    utt.onerror=()=>{clearTimeout(safety);st.speaking=false;resolve()};
    speechSynthesis.speak(utt);
  });
}

function handleCommand(text){
  var t=norm(text);if(!t)return false;
  if(isStopPhrase(text)){hardStopAll('Stop.');return true}
  if(/24\s*\/?\s*7|mode agent/.test(t)){clearHardStop();cfg.agentMode=true;updateUITags();autoStart(true);return true}
  if(/mode auto/.test(t)){clearHardStop();autoStart(false);return true}
  if(/profil bt|casque/.test(t)){applyProfile('bt');safeSet(S_CFG,JSON.stringify(cfg));applyToUI();toast('BT');return true}
  if(/profil maison/.test(t)){applyProfile('home');safeSet(S_CFG,JSON.stringify(cfg));applyToUI();toast('MAISON');return true}
  if(/profil max/.test(t)){applyProfile('max');safeSet(S_CFG,JSON.stringify(cfg));applyToUI();toast('MAX');return true}
  if(/haut.?parleur|speaker/.test(t)){cfg.audioOut='speaker';safeSet(S_CFG,JSON.stringify(cfg));updateUITags();toast('Haut-parleur');return true}
  if(/bluetooth/.test(t)){cfg.audioOut='bt';safeSet(S_CFG,JSON.stringify(cfg));updateUITags();toast('Bluetooth');return true}
  if(/tais.toi|silence|mute|coupe le son/.test(t)){st.muted=true;updateMuteUI();toast('Mute');return true}
  if(/remets le son|son on|unmute/.test(t)){st.muted=false;updateMuteUI();toast('Son ON');return true}
  return false;
}

function autoStart(comp){
  if(st.hardStop)clearHardStop();
  if(st.run&&st.comp===!!comp)return;
  if(st.run)autoStop();
  if(!hasKey()){toast('Clé API','err');openSettings();return}
  st.auto=true;st.run=true;st.comp=!!comp;st.loopId++;st.hardStop=false;
  var myId=st.loopId;
  var a=$('#auto'),c=$('#comp'),m=$('#mode');
  if(a)a.classList.toggle('on',!comp);if(c)c.classList.toggle('on',!!comp);if(m)m.textContent=comp?'24/7':'AUTO';
  live(comp?'24/7':'AUTO','listen');status(comp?'24/7':'AUTO');log((comp?'24/7':'AUTO')+' ON','info');
  requestWakeLock();

  (function loop(){
    if(!st.auto||st.loopId!==myId||st.hardStop)return;
    ensureMic().then(ok=>{
      if(!ok||!st.auto||st.loopId!==myId||st.hardStop){if(st.auto&&st.loopId===myId&&!st.hardStop)setTimeout(loop,1600);return null}
      live('Veille…','listen');
      return waitForSound(myId);
    }).then(det=>{
      if(!det||!st.auto||st.loopId!==myId||st.hardStop)return null;
      live('REC…','rec');
      return recUntilSilent(myId);
    }).then(blob=>{
      if(!blob||!st.auto||st.loopId!==myId||st.hardStop)return null;
      if(blob.size<1200){
        if(cfg.noise&&cfg.speakNoise&&Date.now()-st.lastNoiseAt>cfg.coolSec*1000&&st.lastVol>=cfg.noiseVol){
          st.lastNoiseAt=Date.now();live('Bruit…','think');
          var msgs=[{role:'system',content:buildSystemPrompt()},{role:'user',content:buildNoisePrompt(st.lastVol)}];
          var t0=Date.now();
          return callGroqWithRetry(msgs).then(resp=>{
            st.lat=Date.now()-t0;st.reqs++;
            var r=resp||'Bruit.';
            if(r.toLowerCase().indexOf('rien de clair')===-1){showResponse(r);addToHistory('assistant',r);if(cfg.tts&&!st.muted)return speak(r).then(()=>delay(cfg.releaseMs||800))}
            return delay(cfg.gapMs||2800);
          }).catch(()=>{
            var h=humanNoise(st.lastVol,st.lastBass,st.lastMid,st.lastHigh);
            showResponse(h.line);if(cfg.tts&&!st.muted)return speak(h.line).then(()=>delay(cfg.releaseMs||800));
            return delay(cfg.gapMs||2800);
          });
        }
        if(shouldRelease())releaseMic();
        return delay(280);
      }
      live('STT…','think');
      return transcribe(blob).then(text=>{
        if(!st.auto||st.loopId!==myId||st.hardStop)return null;
        if(isGarbageTranscript(text)){if(shouldRelease())releaseMic();return delay(300)}
        log('« '+text+' »','qa');
        if(handleCommand(text)){if(shouldRelease())releaseMic();return delay(350)}
        if(!cfg.always){
          var wakes=(cfg.wakeWords||'').split(','),ok=false,tn=norm(text);
          for(var i=0;i<wakes.length;i++){var w=norm(wakes[i]);if(w&&tn.indexOf(w)!==-1){ok=true;break}}
          if(!ok){
            if(cfg.agentMode&&cfg.reportSpeech){
              live('Autour…','think');
              var msgs=[{role:'system',content:buildSystemPrompt()},{role:'user',content:buildAroundPrompt(text)}];
              var t0=Date.now();
              return callGroqWithRetry(msgs).then(resp=>{
                st.lat=Date.now()-t0;st.reqs++;
                var r=resp||'';
                if(r&&r.toLowerCase().indexOf('rien de clair')===-1){showResponse(r);addToHistory('user','[autour] '+text);addToHistory('assistant',r);if(cfg.tts&&!st.muted)return speak(r).then(()=>delay(cfg.releaseMs||800))}
                return delay(cfg.gapMs||2800);
              }).catch(()=>delay(800));
            }
            if(shouldRelease())releaseMic();
            return delay(280);
          }
        }
        live('Réfléchit…','think');
        addToHistory('user',text);
        var q=detectQueryType(text),ad=getAdaptiveParams(q);
        var msgs=[{role:'system',content:buildSystemPrompt()}];
        getContextMessages().forEach(m=>msgs.push(m));
        var sT=cfg.temp,sK=cfg.maxTokens;cfg.temp=ad.temp;cfg.maxTokens=ad.maxTokens;
        var t1=Date.now();
        return callGroqWithRetry(msgs).then(resp=>{
          cfg.temp=sT;cfg.maxTokens=sK;st.lat=Date.now()-t1;st.reqs++;
          var r=resp||'…';
          log('→ '+r,'qa');addToHistory('assistant',r);showResponse(r);
          if(cfg.tts&&!st.muted)return speak(r).then(()=>delay(cfg.releaseMs||800));
          return delay(cfg.gapMs||2800);
        }).catch(e=>{
          cfg.temp=sT;cfg.maxTokens=sK;log('API '+e.message,'err');toast('Erreur','err');
          return delay(1600);
        });
      });
    }).then(()=>{
      if(!st.auto||st.loopId!==myId||st.hardStop)return null;
      if(shouldRelease())releaseMic();sys();
      return delay(cfg.gapMs||2800);
    }).then(()=>{if(st.auto&&st.loopId===myId&&!st.hardStop)loop()})
    .catch(e=>{log('Loop '+ (e&&e.message||e),'err');if(st.auto&&st.loopId===myId&&!st.hardStop)setTimeout(loop,1800)});
  })();
}
function autoStop(){
  st.auto=false;st.run=false;st.comp=false;st.loopId++;
  if(st.ctrl)try{st.ctrl.abort()}catch(e){}
  var a=$('#auto'),c=$('#comp'),m=$('#mode');
  if(a)a.classList.remove('on');if(c)c.classList.remove('on');if(m)m.textContent='OFF';
  live('OFF','idle');status('OFF');log('OFF','info');stopTTS();releaseWakeLock();
  if(shouldRelease())releaseMic();sys();
}
function showResponse(text){
  var el=$('#out');if(!el)return;
  var d=document.createElement('div');d.textContent='['+now()+'] '+text;d.style.color='var(--fg)';d.style.margin='3px 0';
  el.appendChild(d);el.scrollTop=el.scrollHeight;while(el.children.length>20)el.firstChild.remove();
}
function sendText(text){
  if(!text||!text.trim())return;
  text=text.trim();
  if(isStopPhrase(text)){hardStopAll('Stop.');return}
  if(handleCommand(text))return;
  if(!hasKey()){toast('Clé','err');openSettings();return}
  log('TXT « '+text+' »','qa');addToHistory('user',text);live('…','think');
  var q=detectQueryType(text),ad=getAdaptiveParams(q);
  var msgs=[{role:'system',content:buildSystemPrompt()}];
  getContextMessages().forEach(m=>msgs.push(m));
  var sT=cfg.temp,sK=cfg.maxTokens;cfg.temp=ad.temp;cfg.maxTokens=ad.maxTokens;
  var t0=Date.now();
  callGroqWithRetry(msgs).then(resp=>{
    cfg.temp=sT;cfg.maxTokens=sK;st.lat=Date.now()-t0;st.reqs++;
    var r=resp||'…';log('→ '+r,'qa');addToHistory('assistant',r);showResponse(r);
    live(r.slice(0,60)+(r.length>60?'…':''),'ok');
    if(cfg.tts&&!st.muted)speak(r);
  }).catch(e=>{cfg.temp=sT;cfg.maxTokens=sK;log(e.message,'err');toast('Erreur','err');live('Erreur','stop')});
}
function pttStart(){
  if(st.ptt||st.hardStop)return;
  if(!hasKey()){toast('Clé','err');openSettings();return}
  st.ptt=true;var p=$('#ptt');if(p)p.classList.add('rec');live('PTT','rec');
  ensureMic().then(ok=>{
    if(!ok){st.ptt=false;return}
    var chunks=[],mime=getMime();if(!mime){st.ptt=false;return}
    try{st.pmr=new MediaRecorder(st.stream,{mimeType:mime})}catch(e){st.ptt=false;return}
    st.pmr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    st.pmr.onstop=()=>{
      st.ptt=false;var p2=$('#ptt');if(p2)p2.classList.remove('rec');
      var blob=new Blob(chunks,{type:st.pmr.mimeType});
      if(blob.size<700){live('Court','idle');return}
      live('STT…','think');
      transcribe(blob).then(text=>{if(isGarbageTranscript(text)){live('Rien','idle');return}sendText(text)});
    };
    st.pmr.start(60);st._pttStart=Date.now();
    st.piv=setInterval(()=>{if(st.pmr&&st.pmr.state==='recording'&&Date.now()-(st._pttStart||0)>(cfg.maxRecord||9)*1000){clearInterval(st.piv);st.pmr.stop()}},250);
  });
}
function pttStop(){clearInterval(st.piv);if(st.pmr&&st.pmr.state==='recording')try{st.pmr.stop()}catch(e){}st.ptt=false;var p=$('#ptt');if(p)p.classList.remove('rec')}

function buildLogText(){
  var lines=['=== KITT v52 ===',stamp(),'Profil '+cfg.profile,'Audio '+cfg.audioOut,''];
  st.hist.forEach(m=>lines.push((m.role==='user'?'IN: ':'OUT: ')+m.content));
  lines.push('---');st.fullLog.forEach(l=>lines.push(l));
  return lines.join('\n');
}
function exportFullLog(){
  var n=nextExportNum(),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+buildLogText()],{type:'text/plain;charset=utf-8'}));
  a.download='kitt52-'+n+'.txt';document.body.appendChild(a);a.click();document.body.removeChild(a);toast('LOG #'+n);
}

function openSettings(){updateKeyStatus();updateSummary();try{$('#dlg').showModal()}catch(e){}}
function closeSettings(){var d=$('#dlg');if(d&&d.open)d.close()}
function updateKeyStatus(){var el=$('#keystatus');if(!el)return;el.textContent=hasKey()?'Clé OK':'Aucune clé';el.className=hasKey()?'ok':''}
function updateSummary(){
  var lines=['Profil '+profLabel(),'Audio '+(cfg.audioOut||'auto'),'Sens '+cfg.sens+' | Bruit '+cfg.noiseVol,cfg.agentMode?'Agent ON':'Agent OFF'];
  var el=$('#configSummary');if(el)el.textContent=lines.join('\n');
}

function load(){
  try{var raw=safeGet(S_CFG,null);if(raw)Object.assign(cfg,JSON.parse(raw))}catch(e){}
  try{var s=JSON.parse(safeGet(S_LOG,'[]')||'[]');if(Array.isArray(s))st.fullLog=s}catch(e){}
  st.muted=false;st.hardStop=false;if(!cfg.profile)cfg.profile='bt';
  fixModel();applyToUI();updateKeyStatus();updateMuteUI();updateUITags();
}
function applyToUI(){
  fixModel();
  function sv(id,v){var e=$('#'+id);if(e)e.value=v}
  function sc(id,v){var e=$('#'+id);if(e)e.checked=!!v}
  sv('key',cfg.key||'');sv('model',cfg.model);sv('lang',cfg.lang);sv('profile',cfg.profile||'bt');sv('audioOut',cfg.audioOut||'auto');
  sv('aiName',cfg.aiName||'KITT');sv('wake',cfg.wakeWords);sv('stopw',cfg.stopWords);sv('mailTo',cfg.mailTo||'');
  sc('agentMode',cfg.agentMode!==false);sc('reportSpeech',cfg.reportSpeech!==false);sc('btFriendly',cfg.btFriendly!==false);
  sc('always',cfg.always!==false);sc('noise',cfg.noise!==false);sc('speakNoise',cfg.speakNoise!==false);sc('useSensors',cfg.useSensors!==false);
  sc('tts',cfg.tts);sc('wakelock',cfg.wakelock);sc('autoLog',cfg.autoLog);
  [['sens','vsens',cfg.sens],['noisevol','vnoisevol',cfg.noiseVol],['sil','vsil',cfg.silence],['max','vmax',cfg.maxRecord],['gap','vgap',cfg.gapMs],['cool','vcool',cfg.coolSec],['temp','vtemp',cfg.temp],['tokens','vtokens',cfg.maxTokens],['rate','vrate',cfg.rate]]
  .forEach(a=>{sv(a[0],a[2]);var e=$('#'+a[1]);if(e)e.textContent=a[2]});
  updateUITags();updateProfDesc();updateSummary();sys();
}
function persistKey(){var k=cleanKey($('#key')?$('#key').value:'');if(k.length>=10){cfg.key=k;safeSet(S_CFG,JSON.stringify(cfg))}updateKeyStatus()}
function saveAll(){
  persistKey();
  var prev=cfg.profile;
  cfg.model=$('#model').value;fixModel();
  cfg.lang=$('#lang').value;cfg.tts=$('#tts').checked;cfg.aiName=($('#aiName').value||'KITT').trim();
  cfg.profile=$('#profile').value;if(cfg.profile!==prev)applyProfile(cfg.profile);
  cfg.audioOut=$('#audioOut').value||'auto';
  cfg.agentMode=$('#agentMode').checked;cfg.reportSpeech=$('#reportSpeech').checked;cfg.btFriendly=$('#btFriendly').checked;
  cfg.always=$('#always').checked;cfg.noise=$('#noise').checked;cfg.speakNoise=$('#speakNoise').checked;cfg.useSensors=$('#useSensors').checked;
  cfg.sens=+$('#sens').value;cfg.noiseVol=+$('#noisevol').value;cfg.silence=+$('#sil').value;cfg.maxRecord=+$('#max').value;
  cfg.gapMs=+$('#gap').value;cfg.coolSec=+$('#cool').value;cfg.temp=+$('#temp').value;cfg.maxTokens=+$('#tokens').value;cfg.rate=+$('#rate').value;
  cfg.wakelock=$('#wakelock').checked;cfg.autoLog=$('#autoLog').checked;
  cfg.wakeWords=$('#wake').value.trim();cfg.stopWords=$('#stopw').value.trim();cfg.mailTo=$('#mailTo').value.trim();
  safeSet(S_CFG,JSON.stringify(cfg));applyToUI();toast('OK');closeSettings();
  if(cfg.useSensors)MotionTracker.init();
}
function testKey(){
  persistKey();if(!hasKey()){toast('Clé','err');return}
  fetch(GROQ+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getKey()},body:JSON.stringify({model:cfg.model,messages:[{role:'user',content:'OK'}],max_tokens:5,temperature:0})})
  .then(r=>toast(r.ok?'Clé OK':'Erreur '+r.status,r.ok?'':'err')).catch(()=>toast('Réseau','err'));
}
function resetAll(){
  if(!confirm('Reset ?'))return;
  Object.assign(cfg,DEFAULT);safeSet(S_CFG,JSON.stringify(cfg));
  try{localStorage.removeItem(S_LOG)}catch(e){}
  st.fullLog=[];st.hist=[];applyToUI();toast('Reset');closeSettings();
}
function tickClock(){var el=$('#clock');if(el)el.textContent=now()}

function bindUI(){
  $('#go').addEventListener('click',()=>{$('#boot').style.display='none';$('#app').classList.add('show');sizeCanvases();if(cfg.useSensors)MotionTracker.init()});
  $('#cfg').addEventListener('click',openSettings);
  $('#cfg2').addEventListener('click',openSettings);
  $('#halt').addEventListener('click',()=>hardStopAll('Stop'));
  $('#auto').addEventListener('click',()=>{st.auto&&!st.comp?autoStop():autoStart(false)});
  $('#comp').addEventListener('click',()=>{st.comp?autoStop():autoStart(true)});
  $('#agentBtn').addEventListener('click',()=>{cfg.agentMode=!cfg.agentMode;safeSet(S_CFG,JSON.stringify(cfg));updateUITags();toast(cfg.agentMode?'Agent ON':'OFF')});
  $('#profBtn').addEventListener('click',()=>{var n=cfg.profile==='bt'?'home':(cfg.profile==='home'?'max':'bt');applyProfile(n);safeSet(S_CFG,JSON.stringify(cfg));applyToUI();toast(profLabel())});
  $('#audioBtn').addEventListener('click',()=>{var o=['auto','speaker','bt'];var i=o.indexOf(cfg.audioOut||'auto');cfg.audioOut=o[(i+1)%3];safeSet(S_CFG,JSON.stringify(cfg));updateUITags();toast('Audio '+cfg.audioOut)});
  $('#export').addEventListener('click',exportFullLog);
  $('#clr').addEventListener('click',()=>{var o=$('#out'),l=$('#log');if(o)o.textContent='…';if(l)l.textContent='';st.hist=[];toast('Clear')});
  $('#mute').addEventListener('click',()=>{st.muted=!st.muted;updateMuteUI();toast(st.muted?'Mute':'Son')});
  $('#send').addEventListener('click',()=>{var el=$('#txt');if(el){sendText(el.value);el.value=''}});
  $('#txt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendText(e.target.value);e.target.value=''}});
  var ptt=$('#ptt');
  ptt.addEventListener('mousedown',pttStart);ptt.addEventListener('mouseup',pttStop);
  ptt.addEventListener('touchstart',e=>{e.preventDefault();pttStart()},{passive:false});
  ptt.addEventListener('touchend',e=>{e.preventDefault();pttStop()},{passive:false});
  $('#x').addEventListener('click',closeSettings);
  $('#paste').addEventListener('click',()=>{
    if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(t=>{var el=$('#key');if(el)el.value=t;persistKey();toast('Collé')}).catch(()=>toast('Refusé','err'));
    else toast('N/A','err');
  });
  $('#savekey').addEventListener('click',()=>{persistKey();toast('Clé')});
  $('#test').addEventListener('click',testKey);
  $('#save').addEventListener('click',saveAll);
  $('#rst').addEventListener('click',resetAll);
  [['sens','vsens'],['noisevol','vnoisevol'],['sil','vsil'],['max','vmax'],['gap','vgap'],['cool','vcool'],['temp','vtemp'],['tokens','vtokens'],['rate','vrate']]
  .forEach(p=>{var el=$('#'+p[0]);if(el)el.addEventListener('input',function(){var v=$('#'+p[1]);if(v)v.textContent=this.value})});
  var pr=$('#profile');if(pr)pr.addEventListener('change',function(){cfg.profile=this.value;updateProfDesc()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){var d=$('#dlg');if(d&&d.open)d.close()}});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&st.auto)requestWakeLock()});
  window.addEventListener('resize',sizeCanvases);
}

function boot(){
  load();bindUI();
  setInterval(tickClock,1000);setInterval(sys,2000);
  setInterval(()=>{
    if(st.fullLog.length>400)st.fullLog=st.fullLog.slice(-200);
    if(st.hist.length>14)st.hist=st.hist.slice(-8);
    if(st.motionHistory.length>25)st.motionHistory=st.motionHistory.slice(-15);
  },90000);
  tickClock();sys();
  if(window.speechSynthesis){speechSynthesis.getVoices();if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}
  if('ontouchstart' in window){var p=$('#ptt');if(p)p.classList.add('show')}
  log('KITT v52 FINAL prêt','info');
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();
})();
</script>
</body>
</html>
