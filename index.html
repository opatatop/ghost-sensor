<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPATATOP AI - Version Complète</title>
    <style>
        :root {
            --primary: #00ffff;
            --secondary: #bc13fe;
            --bg: #050510;
            --panel: #0a0a20;
            --text: #e0e0ff;
            --danger: #ff3333;
            --accent: #00ff88;
            --zeus: #ffff00;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #000;
            border-bottom: 3px solid var(--primary);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        h1 {
            font-size: 1.2rem;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
            letter-spacing: 2px;
            margin: 0;
        }
        main {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #visualizer {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at center, #000 0%, #0a0a20 100%);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #displayOverlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            width: 90%;
        }
        #mainText {
            font-size: 1.6rem;
            font-weight: bold;
            color: #fff;
            background: rgba(5, 5, 16, 0.8);
            padding: 12px 20px;
            border: 2px solid var(--primary);
            border-radius: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--primary);
            margin-bottom: 8px;
        }
        #subText {
            font-size: 0.8rem;
            color: var(--secondary);
            letter-spacing: 2px;
            background: rgba(5, 5, 16, 0.7);
            padding: 8px 15px;
            border: 1px solid var(--secondary);
            border-radius: 5px;
            text-shadow: 0 0 5px var(--secondary);
        }
        #hud {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 14px;
            border: 1px solid var(--accent);
            border-radius: 5px;
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--accent);
            z-index: 25;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        #actionGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            gap: 10px;
            padding: 15px;
            background: var(--panel);
            border-top: 1px solid #222;
        }
        .grid-btn {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #ccc;
            padding: 10px 5px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .grid-btn:active {
            transform: scale(0.95);
        }
        .grid-btn.active-state {
            background: var(--secondary);
            color: #fff;
            border-color: var(--secondary);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.5);
        }
        .grid-icon {
            font-size: 1.2rem;
            margin-bottom: 3px;
        }
        #controls {
            background: var(--panel);
            padding: 15px;
            display: grid;
            gap: 10px;
        }
        button {
            background: #1a1a1a;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 5px;
            transition: all 0.15s;
            position: relative;
            overflow: hidden;
        }
        button:active {
            transform: scale(0.95);
        }
        button.active-mode {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary);
        }
        button.danger {
            border-color: var(--danger);
            color: var(--danger);
        }
        #terminal {
            height: 100px;
            background: #000;
            border-top: 1px solid #333;
            padding: 8px;
            font-size: 0.7rem;
            overflow-y: auto;
            color: #aaa;
            line-height: 1.4;
        }
        .log-line {
            margin-bottom: 5px;
            border-left: 2px solid #555;
            padding-left: 8px;
        }
        .log-sys { border-color: #666; color: #aaa; }
        .log-ai { border-color: var(--secondary); color: var(--secondary); }
        .log-det { border-color: var(--primary); color: var(--accent); }
        #settingsModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            width: 90%;
            max-width: 500px;
            background: #111;
            border: 2px solid var(--secondary);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(188, 19, 254, 0.4);
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }
        label {
            font-size: 0.9rem;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 60%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--secondary);
            border-radius: 50%;
            cursor: pointer;
        }
        .color-mode-btn {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #ccc;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.7rem;
            cursor: pointer;
            margin: 5px;
            transition: all 0.2s;
        }
        .color-mode-btn.active {
            background: var(--secondary);
            color: #fff;
            border-color: var(--secondary);
        }
        .color-mode-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 15px 0;
        }
        #translationOverlay {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            color: var(--text);
            background: rgba(5, 5, 16, 0.8);
            padding: 10px 20px;
            border: 2px solid var(--primary);
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 1rem;
            font-weight: bold;
        }
        #liveTranslation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 30;
            color: var(--zeus);
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border: 2px solid var(--zeus);
            border-radius: 5px;
            text-transform: uppercase;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>OPATATOP AI</h1>
        <button onclick="App.toggleSettings()" style="background:none;border:1px solid var(--secondary);color:var(--secondary);width:40px;height:40px;border-radius:50%;font-size:1.2rem;">⚙️</button>
    </header>
    <main>
        <div id="visualizer">
            <canvas id="scopeCanvas"></canvas>
            <div id="displayOverlay">
                <div id="mainText">SYSTÈME ACTIVÉ</div>
                <div id="subText">MODE COMPLET</div>
            </div>
            <div id="translationOverlay">TRADUCTION: --</div>
            <div id="liveTranslation">--</div>
            <div id="hud">ÉNERGIE: 0%<br>FRÉQ.: 0 Hz<br>EMF: 0 μT<br>TEMP: 0°C</div>
        </div>
    </main>
    <div id="actionGrid">
        <div class="grid-btn" onclick="App.toggleSettings()"><span class="grid-icon">⚙️</span><span>RÉGLAGES</span></div>
        <div class="grid-btn active-state" id="btnSound" onclick="FeatureEngine.toggleMute()"><span class="grid-icon">🔇</span><span>AUDIO</span></div>
        <div class="grid-btn active-state" id="btnPower" onclick="FeatureEngine.togglePower()"><span class="grid-icon">⚡</span><span>MODE</span></div>
        <div class="grid-btn active-state" id="btnDetect" onclick="FeatureEngine.toggleDetection()"><span class="grid-icon">🔍</span><span>DÉTECTION</span></div>
        <div class="grid-btn" id="btnNoise" onclick="FeatureEngine.toggleWhiteNoise()"><span class="grid-icon">🔊</span><span>BRUIT</span></div>
        <div class="grid-btn active-state" id="btnGhost" onclick="FeatureEngine.toggleGhostDetection()"><span class="grid-icon">👻</span><span>FANTÔME</span></div>
        <div class="grid-btn active-state" id="btnVAD" onclick="FeatureEngine.toggleVAD()"><span class="grid-icon">🎤</span><span>VAD</span></div>
        <div class="grid-btn" id="btnSensors" onclick="FeatureEngine.toggleSensors()"><span class="grid-icon">📡</span><span>CAPTEURS</span></div>
        <div class="grid-btn" id="btnRecord" onclick="FeatureEngine.toggleAutoRecord()"><span class="grid-icon">📼</span><span>ENREG.</span></div>
        <div class="grid-btn" id="btnEMF" onclick="FeatureEngine.toggleEMF()"><span class="grid-icon">📏</span><span>EMF</span></div>
        <div class="grid-btn" id="btnTemp" onclick="FeatureEngine.toggleTemp()"><span class="grid-icon">🌡️</span><span>TEMP</span></div>
        <div class="grid-btn" id="btnEVP" onclick="FeatureEngine.toggleEVP()"><span class="grid-icon">📻</span><span>EVP</span></div>
    </div>
    <div id="terminal"></div>
    <div id="settingsModal">
        <div class="modal-content">
            <span onclick="App.toggleSettings()" style="float:right;font-size:1.8rem;color:var(--danger);cursor:pointer;">×</span>
            <h2 style="color:var(--primary);margin-bottom:15px;">RÉGLAGES</h2>
            <div class="setting-row">
                <label for="pitch">Hauteur</label>
                <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">
            </div>
            <div class="setting-row">
                <label for="rate">Vitesse</label>
                <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
            </div>
            <div class="color-mode-container">
                <div class="color-mode-btn active" onclick="Config.setColorMode('zeus')">ZEUS</div>
                <div class="color-mode-btn" onclick="Config.setColorMode('dark')">SOMBRE</div>
                <div class="color-mode-btn" onclick="Config.setColorMode('light')">CLAIR</div>
            </div>
            <button style="width:100%;margin-top:20px;padding:12px;" onclick="App.toggleSettings()">FERMER</button>
        </div>
    </div>
    <script>
        const Config = {
            data: {
                pitch: 1.0,
                rate: 1.0,
                colorMode: 'zeus'
            },
            colorModes: {
                zeus: {
                    primary: '#00ffff',
                    secondary: '#bc13fe',
                    bg: '#050510',
                    panel: '#0a0a20',
                    text: '#e0e0ff'
                },
                dark: {
                    primary: '#00ff88',
                    secondary: '#ff3333',
                    bg: '#000000',
                    panel: '#111111',
                    text: '#ffffff'
                },
                light: {
                    primary: '#0066ff',
                    secondary: '#ff00ff',
                    bg: '#f0f0f0',
                    panel: '#e0e0e0',
                    text: '#000000'
                }
            },
            applyColorMode() {
                const mode = this.colorModes[this.data.colorMode];
                document.documentElement.style.setProperty('--primary', mode.primary);
                document.documentElement.style.setProperty('--secondary', mode.secondary);
                document.documentElement.style.setProperty('--bg', mode.bg);
                document.documentElement.style.setProperty('--panel', mode.panel);
                document.documentElement.style.setProperty('--text', mode.text);
            },
            setColorMode(mode) {
                this.data.colorMode = mode;
                this.applyColorMode();
            }
        };

        const AudioEngine = {
            ctx: null,
            stream: null,
            analyser: null,
            isInit: false,
            async init() {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    this.stream = await navigator.mediaDevices.getUserMedia({audio: true});
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 256;
                    this.ctx.createMediaStreamSource(this.stream).connect(this.analyser);
                    this.isInit = true;
                    return true;
                } catch (e) {
                    console.error("Erreur audio:", e);
                    return false;
                }
            },
            getRMS() {
                if (!this.analyser) return 0;
                const data = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(data);
                let sum = 0;
                for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
                return Math.sqrt(sum / data.length) / 128;
            },
            destroy() {
                if (this.stream) this.stream.getTracks().forEach(t => t.stop());
                if (this.ctx) this.ctx.close();
                this.isInit = false;
            }
        };

        const VisualEngine = {
            canvas: null,
            ctx: null,
            animId: null,
            isRunning: false,
            init() {
                this.canvas = document.getElementById('scopeCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
            },
            resize() {
                if (this.canvas) {
                    this.canvas.width = this.canvas.parentElement.clientWidth;
                    this.canvas.height = this.canvas.parentElement.clientHeight;
                }
            },
            start() {
                if (!this.isRunning) {
                    this.isRunning = true;
                    this.loop();
                }
            },
            stop() {
                this.isRunning = false;
                if (this.animId) cancelAnimationFrame(this.animId);
            },
            loop() {
                if (!this.isRunning) return;
                const w = this.canvas.width, h = this.canvas.height;
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, w, h);

                const rms = AudioEngine.isInit ? AudioEngine.getRMS() * 100 : 0;
                document.getElementById('hud').innerHTML =
                    `ÉNERGIE: ${rms.toFixed(1)}%<br>` +
                    `FRÉQ.: ${Math.floor(Math.random() * 1000)} Hz<br>` +
                    `EMF: ${(Math.random() * 5).toFixed(2)} μT<br>` +
                    `TEMP: ${(20 + Math.random() * 5).toFixed(1)}°C`;

                this.animId = requestAnimationFrame(() => this.loop());
            }
        };

        const FeatureEngine = {
            mute: false,
            detection: true,
            ghostDetection: true,
            vad: true,
            toggleMute() {
                this.mute = !this.mute;
                document.getElementById('btnSound').classList.toggle('active-state');
            },
            togglePower() {
                document.getElementById('btnPower').classList.toggle('active-state');
            },
            toggleDetection() {
                this.detection = !this.detection;
                document.getElementById('btnDetect').classList.toggle('active-state');
            },
            toggleGhostDetection() {
                this.ghostDetection = !this.ghostDetection;
                document.getElementById('btnGhost').classList.toggle('active-state');
            },
            toggleVAD() {
                this.vad = !this.vad;
                document.getElementById('btnVAD').classList.toggle('active-state');
            },
            toggleWhiteNoise() {
                document.getElementById('btnNoise').classList.toggle('active-state');
            },
            toggleSensors() {
                document.getElementById('btnSensors').classList.toggle('active-state');
            },
            toggleAutoRecord() {
                document.getElementById('btnRecord').classList.toggle('active-state');
            },
            toggleEMF() {
                document.getElementById('btnEMF').classList.toggle('active-state');
            },
            toggleTemp() {
                document.getElementById('btnTemp').classList.toggle('active-state');
            },
            toggleEVP() {
                document.getElementById('btnEVP').classList.toggle('active-state');
            }
        };

        const BrainEngine = {
            recognition: null,
            isListening: false,
            init() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) return false;
                this.recognition = new SR();
                this.recognition.lang = 'fr-FR';
                this.recognition.interimResults = true;
                this.recognition.continuous = true;
                this.recognition.onresult = (e) => {
                    let text = '';
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        text += e.results[i][0].transcript;
                    }
                    document.getElementById('translationOverlay').innerText = `TRADUCTION: ${text}`;
                    document.getElementById('liveTranslation').innerText = text;
                };
                return true;
            },
            start() {
                if (!this.recognition) return;
                this.isListening = true;
                try { this.recognition.start(); } catch (e) {}
            },
            stop() {
                this.isListening = false;
                if (this.recognition) this.recognition.stop();
            }
        };

        const App = {
            isRunning: false,
            async init() {
                Config.applyColorMode();
                VisualEngine.init();
                await AudioEngine.init();
                BrainEngine.init();
                VisualEngine.start();
                BrainEngine.start();
                this.isRunning = true;
                this.log("Système démarré");
            },
            log(msg) {
                const t = document.getElementById('terminal');
                const d = document.createElement('div');
                d.className = 'log-line';
                d.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
                t.appendChild(d);
                t.scrollTop = t.scrollHeight;
            },
            toggleSettings() {
                const m = document.getElementById('settingsModal');
                m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
            }
        };

        window.onload = () => App.init();
    </script>
</body>
</html>
