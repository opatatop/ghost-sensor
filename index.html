<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUPRA LAB - TOUT FONCTIONNE</title>
    <style>
        :root {
            --primary: #00ff41;
            --secondary: #00cc33;
            --danger: #ff0044;
            --warning: #ffaa00;
            --bg-dark: #001100;
            --bg-darker: #000000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; font-family: 'Courier New', monospace; }
        body {
            background: var(--bg-darker);
            color: var(--primary);
            font-size: 14px;
            line-height: 1.4;
            min-height: 100vh;
            overflow: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 10% 20%, rgba(0, 255, 65, 0.03) 0%, transparent 20%),
                        repeating-linear-gradient(to bottom, rgba(0, 255, 65, 0.02) 0px, rgba(0, 255, 65, 0.02) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            z-index: 9999;
        }
        #start-screen, #main {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-darker);
            border: 4px solid var(--primary);
            z-index: 10000;
            overflow: hidden;
        }
        #main { display: none; padding: 10px; overflow-y: auto; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
        #main.grid { display: grid; }
        #start-screen { text-align: center; padding: 20px; }
        .boot-text { font-size: 24px; margin-bottom: 20px; text-shadow: 0 0 10px var(--primary); }
        button {
            background: transparent;
            color: var(--primary);
            border: 3px solid var(--primary);
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            margin: 8px;
            font-family: 'Courier New', monospace;
        }
        button:hover { background: var(--primary); color: var(--bg-dark); }
        #btnStart { padding: 15px 30px; font-size: 18px; margin: 10px 0; }
        .panel {
            background: var(--bg-dark);
            border: 2px solid var(--primary);
            padding: 10px;
            margin: 8px;
            position: relative;
            min-height: 150px;
        }
        .panel-header {
            position: absolute;
            top: -12px;
            left: 10px;
            background: var(--bg-dark);
            padding: 0 8px;
            font-size: 12px;
            text-transform: uppercase;
        }
        .panel.full-width { grid-column: 1 / -1; }
        canvas { width: 100% !important; height: 100% !important; display: block; background: #000; }
        #log {
            max-height: 200px;
            overflow-y: auto;
            background: var(--bg-dark);
            border: 1px solid var(--primary);
            padding: 8px;
            margin: 8px;
            font-size: 14px;
            line-height: 1.2;
            grid-column: 1 / -1;
        }
        .log-line { margin: 2px 0; word-break: break-word; }
        .log-line::before { content: "> "; color: var(--secondary); }
        .log-line.error { color: var(--danger); }
        .log-line.success { color: var(--primary); }
        #status {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-dark);
            border-top: 2px solid var(--primary);
            padding: 5px 10px;
            font-size: 12px;
            text-align: center;
        }
        .indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 8px;
        }
        .indicator.ready { background: var(--primary); }
        #permission-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-dark);
            border: 4px solid var(--warning);
            padding: 20px;
            font-size: 16px;
            text-align: center;
            z-index: 20000;
            display: none;
        }
        #permission-message.active { display: block; }
        #permission-message button { margin-top: 15px; background: var(--primary); color: var(--bg-dark); }
        #voiceToggle {
            position: fixed;
            bottom: 60px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: var(--bg-dark);
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
        }
        #settings-page {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-darker);
            z-index: 10001;
            padding: 20px;
            overflow-y: auto;
            border: 4px solid var(--primary);
            display: none;
        }
        #settings-page.active { display: block !important; }
        .settings-header { text-align: center; margin-bottom: 20px; font-size: 20px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        .settings-section { background: var(--bg-dark); border: 2px solid var(--primary); padding: 15px; margin-bottom: 15px; }
        .settings-section h3 { margin-bottom: 10px; font-size: 18px; color: var(--secondary); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 16px; }
        .form-group input[type="text"],
        .form-group input[type="password"],
        .form-group input[type="range"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            background: #000;
            color: var(--primary);
            border: 2px solid var(--primary);
            font-family: 'Courier New', monospace;
            font-size: 16px;
        }
        .form-group input[type="range"] { padding: 0; height: 10px; }
        .range-value { text-align: center; font-size: 16px; margin-top: 5px; display: block; }
        .btn-close {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
        }
        #band-histogram { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; height: 100px; padding: 10px; }
        .band-bar { background: var(--bg-dark); border: 1px solid var(--primary); transition: height 0.3s; }
        .band-bar.fill { background: var(--primary); }
        .band-bar.danger { background: var(--danger); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div id="permission-message">
        <div style="color: var(--warning);">⚠️ PERMISSION MICRO REQUISE</div>
        <button id="requestMicroBtn">🎤 AUTORISER LE MICRO</button>
    </div>

    <div id="start-screen">
        <div class="boot-text">SUPRA LAB - TOUT FONCTIONNE</div>
        <button id="btnStart">🚀 LANCER TOUT</button>
        <button id="btnSettings">⚙️ PARAMÈTRES</button>
    </div>

    <div id="settings-page">
        <button class="btn-close" id="closeSettings">✕</button>
        <div class="settings-header">⚙️ PARAMÈTRES</div>

        <div class="settings-section">
            <h3>🔑 Clé API Groq</h3>
            <div class="form-group">
                <label for="groqApiKey">Clé API Groq (persistante)</label>
                <div style="display: flex; gap: 5px;">
                    <input type="password" id="groqApiKey" placeholder="Entrez votre clé..." autocomplete="on">
                    <button id="pasteApiKeyBtn" style="padding: 6px 10px; font-size: 14px;">📋 Coller</button>
                </div>
                <div id="apiKeyStatus" style="margin-top: 5px; font-size: 14px;"></div>
            </div>
        </div>

        <div class="settings-section">
            <h3>🎤 Micro & Voix</h3>
            <div class="form-group">
                <label for="micSensitivity">Sensibilité micro: <span id="micSensitivityValue" class="range-value">50</span>%</label>
                <input type="range" id="micSensitivity" min="10" max="100" value="50">
            </div>
            <div class="form-group">
                <label for="voiceVolume">Volume voix: <span id="voiceVolumeValue" class="range-value">100</span>%</label>
                <input type="range" id="voiceVolume" min="0" max="100" value="100">
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="voiceEnabled" checked> Activer la voix</label>
            </div>
            <div class="form-group">
                <label for="voiceLanguage">Langue:</label>
                <select id="voiceLanguage">
                    <option value="fr-FR">Français</option>
                    <option value="en-US">Anglais</option>
                </select>
            </div>
        </div>

        <div class="settings-section">
            <h3>🎨 Affichage</h3>
            <div class="form-group">
                <label for="colorTheme">Thème:</label>
                <select id="colorTheme">
                    <option value="green">Vert militaire</option>
                    <option value="red">Rouge cyber</option>
                    <option value="blue">Bleu SIGINT</option>
                </select>
            </div>
        </div>

        <div class="settings-section">
            <h3>⚡ Détection</h3>
            <div class="form-group">
                <label for="autoScanInterval">Scan (s): <span id="autoScanIntervalValue" class="range-value">10</span></label>
                <input type="range" id="autoScanInterval" min="5" max="60" value="10">
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="autoTriggerIA" checked> Déclencher IA automatiquement</label>
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <button id="saveSettings">💾 SAUVEGARDER</button>
            <button id="testVoiceBtn">🔊 TESTER LA VOIX</button>
            <button id="resetSettings">🔄 RÉINITIALISER</button>
        </div>
    </div>

    <div id="main">
        <div class="panel">
            <div class="panel-header">SPECTROGRAMME</div>
            <canvas id="spectrogram"></canvas>
            <div>RMS: <span id="rmsValue">-- dB</span></div>
        </div>

        <div class="panel">
            <div class="panel-header">OSCILLOSCOPE</div>
            <canvas id="scope"></canvas>
        </div>

        <div class="panel">
            <div class="panel-header">CAPTEURS</div>
            <canvas id="sensors"></canvas>
            <div>X: <span id="accelX">0</span> Y: <span id="accelY">0</span> Z: <span id="accelZ">0</span></div>
            <div>CAP: <span id="capValue">0</span>°</div>
        </div>

        <div class="panel full-width">
            <div class="panel-header">DÉTECTION DE BANDES</div>
            <div id="band-histogram"></div>
            <div>Bande: <span id="band-info">--</span></div>
        </div>

        <div class="panel full-width">
            <div class="panel-header">ANALYSE IA</div>
            <button class="btn" id="immediateAIBtn">🤖 ANALYSE IA</button>
            <button class="btn record" id="recordBtn">● ENREGISTRER</button>
            <div id="ai-report" style="margin-top: 10px; font-size: 12px;">[EN ATTENTE...]</div>
        </div>

        <div id="log" class="panel full-width">
            <div class="panel-header">LOG (DEBUG)</div>
        </div>
    </div>

    <div id="status">
        <span>Micro: <span class="indicator" id="micIndicator"></span></span>
        <span>IA: <span class="indicator" id="voiceIndicator"></span></span>
        <span>Capteurs: <span class="indicator" id="sensorsIndicator"></span></span>
    </div>

    <button id="voiceToggle" title="Activer/Désactiver la voix">🎤</button>

    <script>
        // ========== CONFIGURATION ==========
        const DEFAULT_CONFIG = {
            micSensitivity: 50,
            voiceVolume: 100,
            voiceEnabled: true,
            voiceLanguage: 'fr-FR',
            colorTheme: 'green',
            autoScanInterval: 10,
            autoTriggerIA: true,
            groqApiKey: ''
        };
        let config = { ...DEFAULT_CONFIG };
        const FREQUENCY_DB = {
            'DRONE_433': { min: 433, max: 434.8, label: 'Drone 433MHz', critical: true },
            'DRONE_915': { min: 915, max: 928, label: 'Drone 915MHz', critical: true },
            'DRONE_2_4': { min: 2400, max: 2483.5, label: 'Drone 2.4GHz', critical: true },
            'AVIATION_VHF': { min: 108, max: 137, label: 'Aviation VHF', critical: false },
            'AVIATION_EMERGENCY': { min: 121.4, max: 121.6, label: 'Guard 121.5', critical: true },
            'FM_RADIO': { min: 87.5, max: 108, label: 'FM Radio', critical: false }
        };
        let KEYWORDS = ['avion', 'drone', 'urgence', 'sos', 'alerte', 'danger', 'bruit', 'son'];

        // ========== VARIABLES GLOBALES ==========
        let audioCtx, analyser, microphone, gainNode, mediaRecorder, audioStream;
        let frequencyArray, timeArray, spectroHistory = [];
        let isRunning = false, isRecording = false, isListening = false, isVoiceEnabled = true;
        let accelX = 0, accelY = 0, accelZ = 0, magnetHeading = 0;
        let recognition, synthesis = window.speechSynthesis;
        let dominantFrequency = 0, detectedBand = null, bandDetectionHistory = {};
        let animationId = null;

        // ========== FONCTIONS DE BASE ==========
        function log(text, isError = false) {
            const logDiv = document.getElementById('log');
            if (!logDiv) return;
            const line = document.createElement('div');
            line.className = `log-line ${isError ? 'error' : ''}`;
            line.innerHTML = `<span style="color: var(--secondary);">[${new Date().toLocaleTimeString('fr-FR')}]</span> ${text}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
            if (logDiv.children.length > 100) logDiv.removeChild(logDiv.children[0]);
        }

        function updateStatus() {
            document.getElementById('micIndicator').className = isRunning ? 'indicator ready' : 'indicator';
            document.getElementById('voiceIndicator').className = isListening ? 'indicator ready' : 'indicator';
            document.getElementById('sensorsIndicator').className = (accelX !== 0 || accelY !== 0) ? 'indicator ready' : 'indicator';
        }

        function showPermissionMessage() {
            document.getElementById('permission-message').classList.add('active');
        }

        function hidePermissionMessage() {
            document.getElementById('permission-message').classList.remove('active');
        }

        function speak(text) {
            if (!config.voiceEnabled || !isVoiceEnabled || !synthesis) return;
            try {
                if (synthesis.getVoices().length === 0) {
                    synthesis.onvoiceschanged = () => speak(text);
                    return;
                }
                synthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = config.voiceLanguage;
                utterance.rate = 1.0;
                utterance.volume = config.voiceVolume / 100;
                const voices = synthesis.getVoices();
                const frenchVoice = voices.find(v => v.lang.includes('fr')) || voices[0];
                if (frenchVoice) utterance.voice = frenchVoice;
                synthesis.speak(utterance);
                log(`[VOIX] "${text}"`);
            } catch (e) {
                log(`[VOIX ERREUR] ${e.message}`, true);
            }
        }

        // ========== INITIALISATION ==========
        async function initAll() {
            try {
                log("=== INITIALISATION ===", "success");

                // Étape 1: Micro
                log("Étape 1/4: Initialisation du micro...", "normal");
                await initAudio();
                log("✅ Étape 1/4: Micro prêt", "success");

                // Étape 2: Capteurs
                log("Étape 2/4: Initialisation des capteurs...", "normal");
                initSensors();
                log("✅ Étape 2/4: Capteurs prêts", "success");

                // Étape 3: IA vocale
                log("Étape 3/4: Initialisation de l'IA vocale...", "normal");
                initSpeech();
                log("✅ Étape 3/4: IA vocale prête", "success");

                // Étape 4: Histogramme
                log("Étape 4/4: Initialisation de l'histogramme...", "normal");
                initBandHistogram();
                log("✅ Étape 4/4: Histogramme prêt", "success");

                // Démarrer la boucle
                log("Démarrage de la boucle principale...", "normal");
                if (animationId) cancelAnimationFrame(animationId);
                isRunning = true;
                animationId = requestAnimationFrame(loop);
                log("✅ BOUCLE DÉMARRÉE", "success");

                updateStatus();
                resizeCanvases();
                log("✅ TOUT EST PRÊT !", "success");
                setTimeout(() => speak("Système prêt. TOUT fonctionne."), 1000);

            } catch (err) {
                log(`❌ ERREUR INITIALISATION: ${err.message}`, "error");
                showPermissionMessage();
            }
        }

        async function initAudio() {
            try {
                log("[AUDIO] Demande d'accès au micro...", "normal");

                // Fermer l'ancien contexte
                if (audioCtx) await audioCtx.close().catch(() => {});
                if (audioStream) audioStream.getTracks().forEach(t => t.stop());

                // Créer un nouveau contexte
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                await audioCtx.resume();

                // Demander le micro
                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                // Initialiser les nœuds audio
                microphone = audioCtx.createMediaStreamSource(audioStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.1;

                gainNode = audioCtx.createGain();
                gainNode.gain.value = config.micSensitivity / 100;

                // Connexion SANS feedback (pour éviter le bruit)
                microphone.connect(analyser);
                analyser.connect(gainNode);

                frequencyArray = new Uint8Array(analyser.frequencyBinCount);
                timeArray = new Uint8Array(analyser.frequencyBinCount);

                // Enregistreur
                mediaRecorder = new MediaRecorder(audioStream);
                let recordedChunks = [];
                mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `rec-${Date.now()}.webm`;
                    a.click();
                    recordedChunks = [];
                    log("[ENREGISTREMENT] Fichier sauvegardé", "success");
                };

                log("[AUDIO] ✅ Micro initialisé", "success");
                return true;

            } catch (err) {
                log(`[AUDIO ERREUR] ${err.message}`, "error");
                if (err.name === 'NotAllowedError') showPermissionMessage();
                throw err;
            }
        }

        function initSensors() {
            if (window.DeviceMotionEvent) {
                window.addEventListener('devicemotion', e => {
                    if (e.accelerationIncludingGravity) {
                        accelX = (e.accelerationIncludingGravity.x || 0).toFixed(2);
                        accelY = (e.accelerationIncludingGravity.y || 0).toFixed(2);
                        accelZ = (e.accelerationIncludingGravity.z || 0).toFixed(2);
                        document.getElementById('accelX').textContent = accelX;
                        document.getElementById('accelY').textContent = accelY;
                        document.getElementById('accelZ').textContent = accelZ;
                    }
                });
                log("[CAPTEURS] ✅ Accéléromètre activé", "success");
            }

            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', e => {
                    if (e.alpha !== null) {
                        magnetHeading = Math.round(e.alpha);
                        document.getElementById('capValue').textContent = magnetHeading;
                    }
                });
                log("[CAPTEURS] ✅ Boussole activée", "success");
            }
        }

        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                log("[IA] ❌ Reconnaissance vocale non supportée", "error");
                return;
            }

            try {
                if (recognition) recognition.stop();

                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = config.voiceLanguage;

                recognition.onresult = (event) => {
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            log(`[IA] 🎤 "${transcript}"`, "success");
                            document.getElementById('ai-report').textContent = `[TRANSCRIPTION] ${transcript}`;
                            speak(transcript);
                            if (KEYWORDS.some(kw => transcript.toLowerCase().includes(kw))) {
                                triggerAIAnalysis(transcript);
                            }
                        }
                    }
                };

                recognition.onerror = (event) => {
                    log(`[IA ERREUR] ${event.error}`, "error");
                    if (event.error === 'not-allowed') showPermissionMessage();
                };

                recognition.onstart = () => {
                    isListening = true;
                    log("[IA] ✅ Écoute activée", "success");
                    updateStatus();
                };

                recognition.onend = () => {
                    isListening = false;
                    updateStatus();
                    if (isVoiceEnabled) {
                        setTimeout(() => {
                            try { recognition.start(); } catch (e) {}
                        }, 1000);
                    }
                };

                recognition.start();
                log("[IA] ✅ IA vocale démarrée", "success");

            } catch (e) {
                log(`[IA ERREUR] ${e.message}`, "error");
            }
        }

        function initBandHistogram() {
            const histogramDiv = document.getElementById('band-histogram');
            if (!histogramDiv) return;
            histogramDiv.innerHTML = '';
            Object.keys(FREQUENCY_DB).forEach(band => {
                const barDiv = document.createElement('div');
                barDiv.className = 'band-bar';
                barDiv.dataset.band = band;
                histogramDiv.appendChild(barDiv);
                bandDetectionHistory[band] = 0;
            });
        }

        // ========== DÉTECTION DE BANDES ==========
        function detectFrequencyBand(frequencyHz) {
            if (frequencyHz <= 0) return null;
            const freqMHz = frequencyHz / 1e6;
            for (const [bandName, bandData] of Object.entries(FREQUENCY_DB)) {
                if (freqMHz >= bandData.min && freqMHz <= bandData.max) {
                    return { label: bandData.label, critical: bandData.critical };
                }
            }
            return null;
        }

        function findDominantFrequency() {
            if (!analyser) return 0;
            analyser.getByteFrequencyData(frequencyArray);
            let maxIndex = 0, maxValue = 0;
            const startIndex = Math.floor(100 / (audioCtx.sampleRate / analyser.fftSize));
            for (let i = startIndex; i < frequencyArray.length; i++) {
                if (frequencyArray[i] > maxValue) {
                    maxValue = frequencyArray[i];
                    maxIndex = i;
                }
            }
            return maxIndex * (audioCtx.sampleRate / analyser.fftSize);
        }

        function updateBandDetection() {
            if (!analyser) return;
            dominantFrequency = findDominantFrequency();
            const detected = detectFrequencyBand(dominantFrequency);
            if (detected) {
                detectedBand = detected;
                const bandInfoEl = document.getElementById('band-info');
                if (bandInfoEl) {
                    bandInfoEl.textContent = `${detected.label} ${detected.critical ? '🚨' : '✅'}`;
                    bandInfoEl.style.color = detected.critical ? 'var(--danger)' : 'var(--primary)';
                }
                updateBandHistogram(detected.label);
                if (detected.critical) speak(`Attention ! Bande critique: ${detected.label}`);
            }
        }

        function updateBandHistogram(bandName) {
            if (!bandDetectionHistory[bandName]) return;
            bandDetectionHistory[bandName]++;
            const maxCount = Math.max(...Object.values(bandDetectionHistory));
            document.querySelectorAll('.band-bar').forEach(bar => {
                const band = bar.dataset.band;
                const count = bandDetectionHistory[band] || 0;
                const heightPercent = maxCount > 0 ? (count / maxCount) * 100 : 0;
                bar.style.height = `${heightPercent}%`;
                bar.classList.remove('fill', 'danger');
                if (heightPercent > 0) {
                    bar.classList.add('fill');
                    if (FREQUENCY_DB[band].critical) bar.classList.add('danger');
                }
            });
        }

        // ========== ANALYSE IA ==========
        function triggerAIAnalysis(transcript = "") {
            if (!isRunning || !analyser) {
                log("[IA] ❌ Système non prêt", "error");
                return;
            }

            analyser.getByteFrequencyData(frequencyArray);
            const rms = Math.sqrt(frequencyArray.reduce((a, b) => a + b * b, 0) / frequencyArray.length) / 128;
            document.getElementById('rmsValue').textContent = `${rms.toFixed(1)} dB`;

            const dominantFreq = findDominantFrequency();
            const band = detectFrequencyBand(dominantFreq);

            const report = `
[RAPPORT - ${new Date().toLocaleTimeString('fr-FR')}]
Fréquence: ${(dominantFreq / 1e6).toFixed(3)} MHz (${band ? band.label : 'Inconnue'})
RMS: ${rms.toFixed(2)} dB
Transcription: "${transcript || "Aucune"}"
${band && band.critical ? "⚠️ BANDE CRITIQUE" : "✅ Normal"}
            `;
            document.getElementById('ai-report').textContent = report;

            if (config.voiceEnabled && isVoiceEnabled) {
                const summary = band ? `Bande: ${band.label}.` : 'Aucune bande détectée.';
                speak(summary);
            }
        }

        // ========== DESSINS ==========
        function drawSpectrogram() {
            const canvas = document.getElementById('spectrogram');
            if (!canvas || !analyser) return;
            const ctx = canvas.getContext('2d');
            analyser.getByteFrequencyData(frequencyArray);
            spectroHistory.unshift([...frequencyArray]);
            if (spectroHistory.length > 80) spectroHistory.pop();

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width / frequencyArray.length;
            for (let y = 0; y < spectroHistory.length; y++) {
                for (let x = 0; x < spectroHistory[y].length; x++) {
                    const val = spectroHistory[y][x];
                    let hue = 90 + val / 2.5;
                    if (detectedBand && detectedBand.critical) hue = 0;
                    ctx.fillStyle = `hsl(${hue}, 100%, ${val / 2.8}%)`;
                    ctx.fillRect(x * w, y * 2, w + 1, 2);
                }
            }
        }

        function drawScope() {
            const canvas = document.getElementById('scope');
            if (!canvas || !analyser) return;
            const ctx = canvas.getContext('2d');
            analyser.getByteTimeDomainData(timeArray);

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#00ff41';
            ctx.lineWidth = 2;
            ctx.beginPath();
            const slice = canvas.width / timeArray.length;
            for (let i = 0; i < timeArray.length; i++) {
                const y = (timeArray[i] / 128) * canvas.height / 2;
                i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * slice, y);
            }
            ctx.stroke();
        }

        function drawSensors() {
            const canvas = document.getElementById('sensors');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#001100';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const maxG = 22;
            const w = (canvas.width / 3) - 20;
            ctx.fillStyle = '#00ff41';
            ctx.fillRect(20, 50, w, Math.min(Math.abs(accelX) * 13, maxG));
            ctx.fillRect(canvas.width / 3 + 10, 50, w, Math.min(Math.abs(accelY) * 13, maxG));
            ctx.fillRect(2 * canvas.width / 3, 50, w, Math.min(Math.abs(accelZ) * 13, maxG));
        }

        function resizeCanvases() {
            document.querySelectorAll('.panel canvas').forEach(canvas => {
                const rect = canvas.parentElement.getBoundingClientRect();
                if (rect.width > 0 && rect.height > 0) {
                    canvas.width = rect.width - 20;
                    canvas.height = rect.height - 50;
                }
            });
        }

        // ========== BOUCLE PRINCIPALE ==========
        function loop() {
            if (!isRunning || !analyser) return;

            // Mettre à jour tout
            drawSpectrogram();
            drawScope();
            drawSensors();
            updateBandDetection();

            // Calculer le RMS
            analyser.getByteFrequencyData(frequencyArray);
            const rms = Math.sqrt(frequencyArray.reduce((a, b) => a + b * b, 0) / frequencyArray.length) / 128;
            document.getElementById('rmsValue').textContent = `${rms.toFixed(1)} dB`;

            animationId = requestAnimationFrame(loop);
        }

        // ========== GESTION DES PARAMÈTRES ==========
        function loadConfig() {
            const savedConfig = localStorage.getItem('supraLabConfig') || sessionStorage.getItem('supraLabConfig');
            if (savedConfig) {
                try {
                    const parsedConfig = JSON.parse(savedConfig);
                    config = { ...DEFAULT_CONFIG, ...parsedConfig };
                    log("[PARAM] Configuration chargée", "success");
                    updateApiKeyStatus();
                } catch (e) {
                    log(`[ERREUR] ${e.message}`, true);
                }
            }
            applyConfig();
        }

        function updateApiKeyStatus() {
            const statusEl = document.getElementById('apiKeyStatus');
            if (statusEl) {
                statusEl.textContent = config.groqApiKey ? "✅ Clé API enregistrée" : "❌ Aucune clé API";
                statusEl.style.color = config.groqApiKey ? "var(--primary)" : "var(--danger)";
            }
        }

        function applyConfig() {
            if (document.getElementById('micSensitivity')) {
                document.getElementById('micSensitivity').value = config.micSensitivity;
                document.getElementById('micSensitivityValue').textContent = config.micSensitivity;
            }
            if (document.getElementById('voiceVolume')) {
                document.getElementById('voiceVolume').value = config.voiceVolume;
                document.getElementById('voiceVolumeValue').textContent = config.voiceVolume;
            }
            if (document.getElementById('voiceEnabled')) {
                document.getElementById('voiceEnabled').checked = config.voiceEnabled;
            }
            if (document.getElementById('colorTheme')) {
                document.getElementById('colorTheme').value = config.colorTheme;
                applyTheme();
            }
            if (document.getElementById('autoScanInterval')) {
                document.getElementById('autoScanInterval').value = config.autoScanInterval;
                document.getElementById('autoScanIntervalValue').textContent = config.autoScanInterval;
            }
            if (document.getElementById('autoTriggerIA')) {
                document.getElementById('autoTriggerIA').checked = config.autoTriggerIA;
            }
            if (document.getElementById('groqApiKey')) {
                document.getElementById('groqApiKey').value = config.groqApiKey;
            }
            // Appliquer la sensibilité du micro si déjà initialisé
            if (gainNode) gainNode.gain.value = config.micSensitivity / 100;
        }

        function applyTheme() {
            const root = document.documentElement;
            switch (config.colorTheme) {
                case 'red':
                    root.style.setProperty('--primary', '#ff4444');
                    root.style.setProperty('--secondary', '#cc0000');
                    break;
                case 'blue':
                    root.style.setProperty('--primary', '#44aaff');
                    root.style.setProperty('--secondary', '#0088cc');
                    break;
                default:
                    root.style.setProperty('--primary', '#00ff41');
                    root.style.setProperty('--secondary', '#00cc33');
            }
        }

        function saveConfig() {
            config.micSensitivity = parseInt(document.getElementById('micSensitivity').value);
            config.voiceVolume = parseInt(document.getElementById('voiceVolume').value);
            config.voiceEnabled = document.getElementById('voiceEnabled').checked;
            config.voiceLanguage = document.getElementById('voiceLanguage').value;
            config.colorTheme = document.getElementById('colorTheme').value;
            config.autoScanInterval = parseInt(document.getElementById('autoScanInterval').value);
            config.autoTriggerIA = document.getElementById('autoTriggerIA').checked;
            config.groqApiKey = document.getElementById('groqApiKey').value;

            try {
                localStorage.setItem('supraLabConfig', JSON.stringify(config));
                sessionStorage.setItem('supraLabConfig', JSON.stringify(config)); // DOUBLE SAUVEGARDE
                log("[PARAM] ✅ Configuration sauvegardée (localStorage + sessionStorage)", "success");
            } catch (e) {
                log(`[ERREUR] Impossible de sauvegarder: ${e.message}`, true);
            }

            applyConfig();
            updateApiKeyStatus();
            // Appliquer la sensibilité du micro
            if (gainNode) gainNode.gain.value = config.micSensitivity / 100;
        }

        // ========== DÉMARRAGE ==========
        window.addEventListener('DOMContentLoaded', () => {
            log("✅ DOM chargé. Initialisation des écouteurs...", "success");
            loadConfig();
            resizeCanvases();
            window.addEventListener('resize', resizeCanvases);

            // Attacher les écouteurs UN PAR UN
            document.getElementById('btnStart').addEventListener('click', async () => {
                log("🚀 Bouton LANCER cliqué !", "success");
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main').style.display = 'block';
                document.getElementById('main').classList.add('grid');
                await initAll();
            });

            document.getElementById('btnSettings').addEventListener('click', () => {
                log("⚙️ Ouverture des paramètres", "success");
                document.getElementById('settings-page').classList.add('active');
            });

            document.getElementById('closeSettings').addEventListener('click', () => {
                document.getElementById('settings-page').classList.remove('active');
                log("Paramètres fermés", "normal");
            });

            document.getElementById('saveSettings').addEventListener('click', () => {
                saveConfig();
                document.getElementById('settings-page').classList.remove('active');
            });

            document.getElementById('testVoiceBtn').addEventListener('click', () => {
                speak("Test de la voix. Si vous m'entendez, tout fonctionne.");
            });

            document.getElementById('resetSettings').addEventListener('click', () => {
                if (confirm("Réinitialiser tous les paramètres ?")) {
                    config = { ...DEFAULT_CONFIG };
                    try {
                        localStorage.removeItem('supraLabConfig');
                        sessionStorage.removeItem('supraLabConfig');
                    } catch (e) {}
                    applyConfig();
                    log("[PARAM] Réinitialisation effectuée", "success");
                }
            });

            document.getElementById('requestMicroBtn').addEventListener('click', async () => {
                hidePermissionMessage();
                await initAll();
            });

            document.getElementById('voiceToggle').addEventListener('click', () => {
                isVoiceEnabled = !isVoiceEnabled;
                document.getElementById('voiceToggle').style.background = isVoiceEnabled ? '#ff0044' : '#00ff41';
                if (isVoiceEnabled && !isListening) initSpeech();
                if (!isVoiceEnabled && recognition) recognition.stop();
                log(isVoiceEnabled ? "Voix activée" : "Voix désactivée", "success");
            });

            document.getElementById('immediateAIBtn').addEventListener('click', () => {
                triggerAIAnalysis();
            });

            document.getElementById('recordBtn').addEventListener('click', () => {
                if (!isRecording) {
                    const recordedChunks = [];
                    mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
                    mediaRecorder.start();
                    isRecording = true;
                    document.getElementById('recordBtn').classList.add('recording');
                    document.getElementById('recordBtn').textContent = "STOP";
                    log("Enregistrement démarré", "success");
                } else {
                    mediaRecorder.stop();
                    isRecording = false;
                    document.getElementById('recordBtn').classList.remove('recording');
                    document.getElementById('recordBtn').textContent = "● ENREGISTRER";
                    log("Enregistrement arrêté", "success");
                }
            });

            document.getElementById('pasteApiKeyBtn').addEventListener('click', async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    document.getElementById('groqApiKey').value = text;
                    config.groqApiKey = text;
                    updateApiKeyStatus();
                    log("[PARAM] Clé API collée", "success");
                } catch (e) {
                    log(`[ERREUR] ${e.message}`, "error");
                }
            });

            // Vérifier les permissions
            if (!navigator.mediaDevices) {
                log("❌ navigator.mediaDevices non disponible", "error");
                showPermissionMessage();
            }
        });

        // Nettoyage
        window.addEventListener('beforeunload', () => {
            if (recognition) recognition.stop();
            if (audioStream) audioStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close().catch(() => {});
            if (animationId) cancelAnimationFrame(animationId);
        });
    </script>
</body>
</html>
