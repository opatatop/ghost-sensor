<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUPRA LAB - TOUT CAPTURER</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background: #000;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            touch-action: manipulation;
            overflow: hidden;
        }
        #app {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
        }
        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #001100;
            color: #00ff41;
            border: 2px solid #00ff41;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #00ff41;
            color: #000;
        }
        #visualizer {
            width: 100%;
            height: 150px;
            background: #000;
            margin: 10px 0;
            display: block;
        }
        #log {
            height: 200px;
            overflow-y: auto;
            background: #001100;
            border: 1px solid #00ff41;
            padding: 10px;
            margin: 10px 0;
            font-size: 14px;
            line-height: 1.4;
        }
        .log-line {
            margin: 3px 0;
            word-break: break-word;
        }
        .log-line::before {
            content: "> ";
            color: #00cc33;
        }
        .log-line.important {
            color: #ff0044;
        }
        #status {
            text-align: center;
            margin: 10px 0;
            font-size: 14px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }
        .indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 8px;
            vertical-align: middle;
        }
        .indicator.ready {
            background: #00ff41;
        }
        .indicator.error {
            background: #ff0044;
        }
        #micStatus, #voiceStatus {
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>🎤 SUPRA LAB - TOUT CAPTURER</h1>

        <button id="startBtn">🚀 LANCER (TOUT est capté et lu)</button>

        <div class="controls">
            <button id="testMicroBtn">🎙️ Tester Micro</button>
            <span class="indicator" id="microIndicator"></span>
            <span id="micStatus"></span>
        </div>

        <div class="controls">
            <button id="testVoiceBtn">🗣️ Tester Voix</button>
            <span class="indicator" id="voiceIndicator"></span>
            <span id="voiceStatus"></span>
        </div>

        <div>
            <div>Visualiseur sonore:</div>
            <canvas id="visualizer"></canvas>
            <div>Niveau: <span id="volumeLevel">--</span> dB</div>
        </div>

        <div>
            <div>LOG (TOUT ce qui est capté):</div>
            <div id="log"></div>
        </div>

        <div id="status">En attente...</div>
    </div>

    <script>
        // ========== VARIABLES GLOBALES ==========
        let audioCtx = null;
        let analyser = null;
        let microphone = null;
        let frequencyData = null;
        let isRunning = false;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let lastSoundTime = 0;
        let spectroHistory = [];

        // ========== CONFIG ==========
        const config = {
            noiseThreshold: 0.3,  // Seuil de détection de bruit (plus bas = plus sensible)
            voiceRate: 1.0,
            voiceVolume: 1.0,
            voiceLanguage: 'fr-FR'
        };

        // ========== FONCTIONS DE BASE ==========
        function log(message, type = "normal") {
            const logDiv = document.getElementById('log');
            if (!logDiv) return;

            const line = document.createElement('div');
            line.className = `log-line ${type === 'error' ? 'important' : ''}`;
            line.innerHTML = `<span style="color: #00cc33;">[${new Date().toLocaleTimeString('fr-FR')}]</span> ${message}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;

            if (logDiv.children.length > 50) {
                logDiv.removeChild(logDiv.children[0]);
            }
        }

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        // ========== SYNTHÈSE VOCALE (TOUT EST LU) ==========
        function speak(text) {
            if (!synthesis) {
                log("Synthèse vocale non disponible.", "error");
                return;
            }

            try {
                // Annuler toute lecture en cours
                synthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = config.voiceLanguage;
                utterance.rate = config.voiceRate;
                utterance.volume = config.voiceVolume;

                // Choisir la meilleure voix française
                const voices = synthesis.getVoices();
                const frenchVoice = voices.find(v => v.lang.includes('fr')) || voices[0];
                if (frenchVoice) {
                    utterance.voice = frenchVoice;
                }

                utterance.onerror = (e) => {
                    log(`Erreur voix: ${e.error}`, "error");
                };

                synthesis.speak(utterance);
                log(`[VOIX] "${text}"`, "normal");
            } catch (e) {
                log(`Erreur synthèse: ${e.message}`, "error");
            }
        }

        // ========== INITIALISATION DU MICRO ==========
        async function initMicro() {
            try {
                // Fermer l'ancien contexte
                if (audioCtx) {
                    await audioCtx.close().catch(() => {});
                }

                // Créer un nouveau contexte
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                await audioCtx.resume();

                // Demander le micro (TOUS LES SONS, sans filtrage)
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,  // Désactivé pour capturer TOUT
                        noiseSuppression: false,  // Désactivé pour capturer TOUT
                        autoGainControl: false
                    }
                });

                // Créer les nœuds audio
                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.1;

                microphone.connect(analyser);

                frequencyData = new Uint8Array(analyser.frequencyBinCount);

                // Initialiser l'IA vocale
                initSpeechRecognition();

                // Initialiser le visualiseur
                drawVisualizer();

                document.getElementById('microIndicator').className = 'indicator ready';
                document.getElementById('micStatus').textContent = "✅ Prêt";
                return true;
            } catch (error) {
                log(`Erreur micro: ${error.message}`, "error");
                updateStatus("❌ Micro non disponible");
                document.getElementById('microIndicator').className = 'indicator error';
                document.getElementById('micStatus').textContent = "❌ Erreur";
                return false;
            }
        }

        // ========== INITIALISATION DE L'IA VOCALE ==========
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                log("Reconnaissance vocale non supportée. Utilise Chrome.", "error");
                return;
            }

            try {
                if (recognition) {
                    recognition.stop();
                }

                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;  // Capturer TOUT, même les fragments
                recognition.lang = config.voiceLanguage.split('-')[0];
                recognition.maxAlternatives = 1;

                let finalTranscript = '';
                let interimTranscript = '';

                recognition.onresult = (event) => {
                    interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript + ' ';
                            // Lire TOUT ce qui est dit
                            speak(transcript);
                            log(`[PAROLE] "${transcript}"`, "normal");
                        } else {
                            interimTranscript += transcript;
                            // Afficher les fragments en temps réel
                            log(`[FRAGMENT] "${interimTranscript}"`, "normal");
                        }
                    }
                };

                recognition.onerror = (event) => {
                    log(`Erreur reconnaissance: ${event.error}`, "error");
                };

                recognition.onstart = () => {
                    log("IA vocale démarrée. TOUT est capté.", "normal");
                    document.getElementById('voiceIndicator').className = 'indicator ready';
                    document.getElementById('voiceStatus').textContent = "🎤 Écoute...";
                };

                recognition.onend = () => {
                    if (isRunning) {
                        setTimeout(() => {
                            try { recognition.start(); } catch (e) {}
                        }, 1000);
                    }
                };

                recognition.start();
                isRunning = true;
            } catch (e) {
                log(`Erreur IA vocale: ${e.message}`, "error");
                document.getElementById('voiceIndicator').className = 'indicator error';
                document.getElementById('voiceStatus').textContent = "❌ Erreur";
            }
        }

        // ========== DÉTECTION DE BRUITS NON VERBAUX ==========
        function detectSounds() {
            if (!analyser) return;

            analyser.getByteFrequencyData(frequencyData);
            const average = frequencyData.reduce((a, b) => a + b, 0) / frequencyData.length;

            // Mettre à jour le niveau sonore
            document.getElementById('volumeLevel').textContent = `${(average / 2.5).toFixed(1)}`;

            // Détecter les bruits forts (non verbaux)
            if (average > config.noiseThreshold * 255) {
                const now = Date.now();
                if (now - lastSoundTime > 2000) {  // Éviter les répétitions
                    lastSoundTime = now;
                    log(`[BRUIT] Niveau sonore élevé détecté: ${(average / 2.5).toFixed(1)}%`, "important");
                    speak(`Attention, bruit détecté !`);
                }
            }
        }

        // ========== VISUALISEUR ==========
        function drawVisualizer() {
            const canvas = document.getElementById('visualizer');
            const ctx = canvas.getContext('2d');

            function draw() {
                if (!analyser) {
                    requestAnimationFrame(draw);
                    return;
                }

                analyser.getByteFrequencyData(frequencyData);

                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const barWidth = (canvas.width / frequencyData.length) * 2.5;
                let x = 0;

                for (let i = 0; i < frequencyData.length; i++) {
                    const barHeight = frequencyData[i] / 2;
                    ctx.fillStyle = `hsl(${i * 2}, 100%, 50%)`;
                    ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }

                // Détecter les sons
                detectSounds();

                requestAnimationFrame(draw);
            }

            draw();
        }

        // ========== DÉMARRAGE COMPLET ==========
        async function start() {
            log("Démarrage du système... TOUT sera capté et lu.");
            updateStatus("Initialisation en cours...");

            const success = await initMicro();
            if (success) {
                updateStatus("✅ TOUT EST PRÊT ! Parlez, claquez, sifflez...");
                log("Système prêt. TOUT est capté et lu à voix haute.", "normal");
                speak("Système prêt. Je capte TOUT et je lis TOUT à voix haute.");
            }
        }

        // ========== BOUTONS ==========
        document.getElementById('startBtn').addEventListener('click', start);

        document.getElementById('testMicroBtn').addEventListener('click', async () => {
            try {
                await initMicro();
                log("Micro testé avec succès.", "normal");
            } catch (err) {
                log(`Test micro échoué: ${err.message}`, "error");
            }
        });

        document.getElementById('testVoiceBtn').addEventListener('click', () => {
            speak("Test de la voix. Si vous entendez ceci, TOUT fonctionne.");
        });

        // Message initial
        log("SUPRA LAB - TOUT CAPTURER, TOUT LIRE");
        log("Cliquez sur 'LANCER' pour commencer. TOUT sera capté et lu.");
    </script>
</body>
</html>
