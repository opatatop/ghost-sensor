<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PERSONA LINK v100.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00ffcc; /* Cyan cyber */
            --secondary: #004433;
            --alert: #ff3366;
            --bg: #050a08;
            --panel: rgba(0, 20, 15, 0.85);
            --font-main: 'Rajdhani', sans-serif;
            --font-tech: 'Orbitron', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--primary);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* BACKGROUND GRID EFFECT */
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--secondary) 1px, transparent 1px), linear-gradient(90deg, var(--secondary) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.1;
            z-index: -1;
        }

        /* --- HEADER --- */
        header {
            height: 60px;
            border-bottom: 2px solid var(--primary);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: var(--panel);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }

        .user-badge {
            display: flex; align-items: center; gap: 10px;
        }
        
        .avatar-ring {
            width: 40px; height: 40px; border: 2px solid var(--primary);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-family: var(--font-tech); font-weight: bold; font-size: 0.8rem;
            box-shadow: 0 0 10px var(--primary);
        }

        .status-badge {
            font-size: 0.7rem; background: var(--primary); color: #000;
            padding: 2px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase;
        }

        /* --- MAIN INTERFACE --- */
        main {
            flex: 1; position: relative; display: flex; flex-direction: column;
            padding: 15px; gap: 15px; z-index: 10;
        }

        /* RESONANCE CORE (The Visual Center) */
        .core-section {
            flex: 1; display: flex; justify-content: center; align-items: center; position: relative;
            border: 1px solid var(--secondary); background: rgba(0,0,0,0.3);
        }

        #resonance-circle {
            width: 180px; height: 180px;
            border-radius: 50%;
            border: 4px solid var(--primary);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative;
            transition: all 0.1s;
        }

        #resonance-circle::before {
            content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
            border: 1px dashed var(--primary); border-radius: 50%;
            animation: spin-slow 20s linear infinite;
        }

        #resonance-val {
            font-family: var(--font-tech); font-size: 2.5rem; font-weight: 900;
            text-shadow: 0 0 20px var(--primary);
        }

        #resonance-label {
            font-size: 0.8rem; letter-spacing: 2px; opacity: 0.8;
        }

        /* DATA GRID */
        .data-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; height: 140px;
        }

        .data-card {
            background: var(--panel); border: 1px solid var(--secondary); padding: 10px;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .card-title { font-size: 0.7rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .card-value { font-family: var(--font-tech); font-size: 1.4rem; color: #fff; }
        .progress-bar { height: 3px; background: #112211; margin-top: 5px; width: 100%; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.1s; }

        /* --- FOOTER & CONTROLS --- */
        footer {
            height: 100px; border-top: 1px solid var(--secondary);
            background: var(--panel); display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 5px;
        }

        #log-display {
            width: 90%; font-size: 0.7rem; color: #666; text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .control-dock {
            display: flex; gap: 20px; align-items: center;
        }

        #action-btn {
            width: 70px; height: 70px; border-radius: 12px;
            border: 2px solid var(--primary); background: rgba(0, 255, 204, 0.1);
            color: var(--primary); font-size: 1.5rem;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.2s;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }

        #action-btn:active { transform: scale(0.95); background: var(--primary); color: #000; }
        #action-btn.active { background: var(--alert); border-color: var(--alert); color: #fff; animation: pulse-alert 1s infinite; }

        .mini-btn {
            background: none; border: 1px solid #444; color: #888;
            padding: 10px; font-family: var(--font-tech); font-size: 0.7rem; cursor: pointer;
            border-radius: 4px;
        }
        .mini-btn:hover { border-color: var(--primary); color: var(--primary); }

        /* --- SETUP MODAL (IDENTITY) --- */
        #setup-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 2000;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
        }

        .input-group { margin-top: 20px; display: flex; gap: 10px; }
        #codename-input {
            background: transparent; border: 2px solid var(--primary); color: var(--primary);
            padding: 10px; font-family: var(--font-tech); font-size: 1.2rem; text-align: center;
            outline: none; width: 250px; text-transform: uppercase;
        }

        /* --- ANIMATIONS --- */
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }
        @keyframes pulse-alert { 0% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 51, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); } }

        /* Canvas Overlay */
        #wave-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.3; pointer-events: none; z-index: 1;
        }

    </style>
</head>
<body>

<div class="bg-grid"></div>

<!-- IDENTITY SETUP -->
<div id="setup-modal">
    <h1 style="font-family: var(--font-tech); color: var(--primary); margin-bottom: 10px;">INITIALISATION LIEN</h1>
    <p style="color: #888; font-size: 0.9rem;">IDENTIFIEZ-VOUS POUR SYNCHRONISER LE SYSTÈME.</p>
    <div class="input-group">
        <input type="text" id="codename-input" placeholder="VOTRE CODE NOM" maxlength="12">
        <button onclick="registerUser()" style="background: var(--primary); border:none; padding: 0 20px; font-weight: bold; cursor: pointer;">OK</button>
    </div>
</div>

<header>
    <div class="user-badge">
        <div class="avatar-ring" id="user-initial">?</div>
        <div>
            <div style="font-weight: bold; font-size: 1.1rem;" id="display-name">OPÉRATEUR</div>
            <div style="font-size: 0.7rem; color: #666;">NIVEAU D'ACCÈS: ALPHA</div>
        </div>
    </div>
    <div class="status-badge" id="sys-status">EN LIGNE</div>
</header>

<main>
    <div class="core-section">
        <canvas id="wave-canvas"></canvas>
        <div id="resonance-circle">
            <div id="resonance-val">0%</div>
            <div id="resonance-label">RÉSONANCE</div>
        </div>
    </div>

    <div class="data-grid">
        <div class="data-card">
            <div class="card-title">ENTRÉE VOCALE (USER)</div>
            <div class="card-value"><span id="val-input">0</span> dB</div>
            <div class="progress-bar"><div id="bar-input" class="progress-fill"></div></div>
        </div>
        <div class="data-card">
            <div class="card-title">ACTIVITÉ KINÉTIQUE</div>
            <div class="card-value"><span id="val-move">0.0</span> G</div>
            <div class="progress-bar"><div id="bar-move" class="progress-fill" style="background:var(--alert)"></div></div>
        </div>
    </div>
</main>

<footer>
    <div id="log-display">SYSTÊME EN ATTENTE DE PILOTAGE...</div>
    <div class="control-dock">
        <button class="mini-btn" onclick="toggleMenu()"><i class="fas fa-cog"></i></button>
        <button id="action-btn" onclick="toggleLink()"><i class="fas fa-microphone"></i></button>
        <button class="mini-btn" onclick="speakToEntity()"><i class="fas fa-comment-dots"></i></button>
    </div>
</footer>

<script>
    /* 
       ================================================================
       PERSONA LINK v100.0
       Système adapté à l'Identité de l'Utilisateur
       ================================================================
    */

    const USER = {
        codename: "OPÉRATEUR",
        initials: "OP",
        aggressionProfile: 50, // S'adapte à l'utilisateur
        linked: false
    };

    const SYS = {
        audioCtx: null,
        analyser: null,
        recognition: null,
        voices: [],
        baseline: 0,
        resonance: 0
    };

    // --- 1. GESTION DE L'IDENTITÉ ---
    window.onload = () => {
        const savedName = localStorage.getItem('jarvis_codename');
        if (savedName) {
            USER.codename = savedName.toUpperCase();
            USER.initials = savedName.substring(0, 2).toUpperCase();
            applyIdentity();
            startSystem();
        } else {
            // Focus input pour démarrer
            setTimeout(() => document.getElementById('codename-input').focus(), 500);
        }
    };

    function registerUser() {
        const input = document.getElementById('codename-input').value;
        if (input.trim().length > 0) {
            USER.codename = input.toUpperCase();
            USER.initials = input.substring(0, 2).toUpperCase();
            localStorage.setItem('jarvis_codename', USER.codename);
            
            document.getElementById('setup-modal').style.display = 'none';
            applyIdentity();
            startSystem();
        }
    }

    function applyIdentity() {
        document.getElementById('display-name').innerText = USER.codename;
        document.getElementById('user-initial').innerText = USER.initials;
        document.getElementById('log-display').innerText = `BIENVENUE, ${USER.codename}. LIEN NEURAL ÉTABLI.`;
    }

    // --- 2. DÉMARRAGE SYSTÈME (RÉEL) ---
    async function startSystem() {
        try {
            SYS.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            SYS.analyser = SYS.audioCtx.createAnalyser();
            SYS.analyser.fftSize = 256;
            const source = SYS.audioCtx.createMediaStreamSource(stream);
            source.connect(SYS.analyser);

            initCanvas();
            analyzeUserBio();
            initMotion();
            initSpeech();
            loadVoices();

            // Message de bienvenue personnalisé
            setTimeout(() => speak(`Système prêt, ${USER.codename}. J'attends vos ordres.`), 1000);

        } catch(e) {
            alert("Autorisation Micro requise pour le lien neural.");
        }
    }

    // --- 3. ANALYSE BIO-MÉTRIQUE (L'utilisateur est le capteur) ---
    function analyzeUserBio() {
        if (!SYS.analyser) return;
        
        const array = new Uint8Array(SYS.analyser.frequencyBinCount);
        
        function loop() {
            requestAnimationFrame(loop);
            SYS.analyser.getByteFrequencyData(array);

            // Calcul intensité User
            let sum = 0;
            for(let i=0; i<array.length; i++) sum += array[i];
            const rms = Math.sqrt(sum / array.length);
            const db = 20 * Math.log10(rms) || -100;
            const displayDb = Math.max(-100, Math.round(db));

            // Calibrage dynamique
            if (SYS.baseline === 0) SYS.baseline = displayDb + 10;
            
            // Update UI
            document.getElementById('val-input').innerText = displayDb;
            document.getElementById('bar-input').style.width = Math.min(100, (displayDb + 100) * 0.8) + "%";

            // Calcul RÉSONANCE (C'est le "score" de connexion)
            // Si l'utilisateur est calme, la résonance est stable. S'il est bruyant, elle monte.
            let resonance = 0;
            if (displayDb > SYS.baseline) {
                resonance = ((displayDb - SYS.baseline) * 5); 
            }
            resonance = Math.min(100, resonance);
            
            // Lissage visuel
            SYS.resonance += (resonance - SYS.resonance) * 0.1;
            
            // Update Core Visual
            document.getElementById('resonance-val').innerText = Math.round(SYS.resonance) + "%";
            const circle = document.getElementById('resonance-circle');
            const scale = 1 + (SYS.resonance / 200);
            circle.style.transform = `scale(${scale})`;
            circle.style.boxShadow = `0 0 ${SYS.resonance}px var(--primary)`;
            
            // Couleur dynamique
            if(SYS.resonance > 80) {
                circle.style.borderColor = 'var(--alert)';
                document.getElementById('resonance-label').innerText = "PICS D'ÉNERGIE";
                document.getElementById('resonance-label').style.color = 'var(--alert)';
            } else {
                circle.style.borderColor = 'var(--primary)';
                document.getElementById('resonance-label').innerText = "RÉSONANCE STABLE";
                document.getElementById('resonance-label').style.color = 'var(--primary)';
            }
        }
        loop();
    }

    // --- 4. CANVAS WAVE ---
    function initCanvas() {
        const canvas = document.getElementById('wave-canvas');
        const ctx = canvas.getContext('2d');
        const resize = () => { canvas.width = canvas.parentElement.offsetWidth; canvas.height = canvas.parentElement.offsetHeight; };
        window.addEventListener('resize', resize); resize();

        const bufferLength = SYS.analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function draw() {
            requestAnimationFrame(draw);
            SYS.analyser.getByteTimeDomainData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 2;
            ctx.strokeStyle = SYS.resonance > 80 ? 'var(--alert)' : 'var(--primary)';
            ctx.beginPath();
            const sliceWidth = canvas.width * 1.0 / bufferLength;
            let x = 0;
            for(let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * canvas.height / 2;
                if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                x += sliceWidth;
            }
            ctx.stroke();
        }
        draw();
    }

    // --- 5. MOUVEMENT (RÉEL) ---
    function initMotion() {
        if(window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', (e) => {
                const acc = e.accelerationIncludingGravity;
                if(!acc) return;
                const m = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
                const val = (m/3).toFixed(2);
                document.getElementById('val-move').innerText = val;
                document.getElementById('bar-move').style.width = Math.min(100, val * 20) + "%";
            });
        }
    }

    // --- 6. INTERACTION & IA ---
    function loadVoices() {
        SYS.voices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => SYS.voices = window.speechSynthesis.getVoices();
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'fr-FR';
        u.rate = 0.9;
        u.pitch = 0.6;
        const fr = SYS.voices.find(v => v.lang.includes('fr'));
        if(fr) u.voice = fr;
        window.speechSynthesis.speak(u);
        document.getElementById('log-display').innerText = `> ${text}`;
    }

    function speakToEntity() {
        const phrases = [
            "Je sens ta présence.",
            "Montre-toi.",
            "Quelle est ta nature ?",
            "Je ne crains rien.",
            "Parle-moi."
        ];
        const p = phrases[Math.floor(Math.random() * phrases.length)];
        document.getElementById('log-display').innerText = `VOUS: ${p}`;
        // Simulation réponse entité rapide
        setTimeout(() => {
            const replies = ["Je suis partout.", "Pourquoi cherches-tu ?", "Silence...", "Tu ne comprends pas."];
            speak(replies[Math.floor(Math.random() * replies.length)]);
        }, 1500);
    }

    // --- SPEECH RECOG ---
    function initSpeech() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SpeechRecognition) return;
        SYS.recognition = new SpeechRecognition();
        SYS.recognition.lang = 'fr-FR';
        SYS.recognition.continuous = false;
        
        SYS.recognition.onresult = (e) => {
            const txt = e.results[0][0].transcript;
            document.getElementById('log-display').innerText = `${USER.codename}: "${txt}"`;
            // L'entité réagit à l'utilisateur
            setTimeout(() => speak("Message reçu, " + USER.codename + ". Traitement en cours."), 1000);
        };
        
        SYS.recognition.onend = () => {
            USER.linked = false;
            document.getElementById('action-btn').classList.remove('active');
        };
    }

    function toggleLink() {
        if(!SYS.recognition) return;
        try {
            SYS.recognition.start();
            USER.linked = true;
            document.getElementById('action-btn').classList.add('active');
            document.getElementById('log-display').innerText = "CONNECTION AUDIO ACTIVE... PARLEZ.";
        } catch(e) {}
    }

    function toggleMenu() {
        if(confirm("Réinitialiser l'identité de " + USER.codename + " ?")) {
            localStorage.removeItem('jarvis_codename');
            location.reload();
        }
    }

</script>
</body>
</html>
