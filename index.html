<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="JARVIS PARANORMAL v48.0 - Intelligence Artificielle Spectrale">
    <meta name="theme-color" content="#000000">
    <title>JARVIS PARANORMAL v48.0 - IA SPECTRALE</title>

    <!-- Polices & Icones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --ghost: #00ff85;
            --ghost-dim: rgba(0, 255, 133, 0.2);
            --cold: #00ffff;
            --red: #ff0000;
            --purple: #bd00ff;
            --dark: #1a0033;
            --background: #050505;
            --text: #e0e0e0;
            --highlight: #ffd700;
            --panel-bg: rgba(10, 10, 10, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--background);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, var(--dark) 0%, #000 80%);
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        header {
            height: 55px;
            background: #000;
            border-bottom: 1px solid var(--ghost);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 0 15px rgba(0, 255, 133, 0.15);
            z-index: 10;
        }

        .brand { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 900; letter-spacing: 3px; color: var(--ghost); text-shadow: 0 0 8px var(--ghost); }
        #status { font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; color: var(--cold); text-align: right; text-transform: uppercase; }

        /* --- MAIN DISPLAY --- */
        #display {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 5;
        }

        /* Visualisation Canvas */
        #visualizer-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.5;
        }

        /* Effet Radar Overlay */
        .radar-sweep {
            position: absolute;
            top: 50%; left: 50%;
            width: 80vmax; height: 80vmax;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(0, 255, 133, 0.1);
            background: conic-gradient(from 0deg, transparent 0deg, rgba(0, 255, 133, 0.1) 60deg, transparent 61deg);
            animation: radar-spin 4s linear infinite;
            pointer-events: none;
            z-index: -1;
            opacity: 0.6;
        }
        
        .radar-grid {
            position: absolute;
            top: 50%; left: 50%;
            width: 60vmax; height: 60vmax;
            transform: translate(-50%, -50%);
            border: 1px dashed rgba(0, 255, 133, 0.1);
            border-radius: 50%;
            z-index: -1;
        }

        @keyframes radar-spin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* Texte & Glitch */
        #input-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--highlight);
            text-shadow: 0 0 10px var(--highlight);
            margin-bottom: 15px;
            min-height: 35px;
            letter-spacing: 1px;
        }

        #output-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.3rem;
            color: #fff;
            line-height: 1.5;
            max-width: 90%;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 4px;
            border: 1px solid var(--cold);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            position: relative;
        }

        /* Glitch Animation Class */
        .glitch-active {
            animation: glitch-anim 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            color: var(--red) !important;
            border-color: var(--red) !important;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        /* --- SENSORS PANEL --- */
        #viz {
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid #333;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            height: 90px;
            z-index: 10;
        }

        .sensor-box { display: flex; flex-direction: column; justify-content: center; }
        .sensor-label { font-family: 'Share Tech Mono'; font-size: 0.65rem; color: #888; display: flex; justify-content: space-between; margin-bottom: 4px; }
        .bar-container { height: 4px; background: #111; width: 100%; border-radius: 2px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; transition: width 0.1s linear; }

        /* --- CONSOLE --- */
        #console {
            height: 70px;
            background: #000;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.65rem;
            color: var(--ghost);
            padding: 5px 15px;
            overflow-y: auto;
            border-top: 1px solid #222;
            opacity: 0.9;
            z-index: 10;
        }

        /* --- FOOTER --- */
        footer {
            height: 140px;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-top: 2px solid var(--red);
            padding: 10px;
            z-index: 20;
            position: relative;
        }

        #mic {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: #111;
            border: 2px solid var(--ghost);
            color: var(--ghost);
            font-size: 2rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(0, 255, 133, 0.2);
            cursor: pointer; transition: all 0.3s;
        }

        #mic.active {
            background: var(--red);
            color: #fff;
            border-color: var(--red);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
            animation: pulse-mic 1s infinite;
        }

        @keyframes pulse-mic { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .btn-row { display: flex; gap: 10px; width: 100%; justify-content: center; }
        .btn {
            background: transparent; border: 1px solid #444; color: #888;
            padding: 6px 12px; font-family: 'Orbitron'; font-size: 0.7rem;
            border-radius: 4px; cursor: pointer; flex: 1; max-width: 120px;
        }
        .btn:hover { border-color: var(--ghost); color: var(--ghost); }
        .btn.danger:hover { border-color: var(--red); color: var(--red); }

        /* --- OVERLAYS --- */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100;
            display: none; flex-direction: column; padding: 20px;
        }
        .overlay.open { display: flex; }
        .overlay-header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .overlay h2 { color: var(--ghost); font-family: 'Orbitron'; font-size: 1.5rem; }
        .close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-item {
            background: #111; border: 1px solid #333; padding: 20px;
            text-align: center; border-radius: 8px; cursor: pointer;
        }
        .menu-item:hover { border-color: var(--ghost); background: #1a1a1a; }
        .menu-item i { font-size: 1.5rem; color: var(--ghost); margin-bottom: 10px; display: block; }
        
        .toast {
            position: fixed; top: 70px; right: 20px;
            background: #000; border-left: 3px solid var(--ghost);
            color: #fff; padding: 10px 20px; border-radius: 4px;
            font-family: 'Share Tech Mono'; font-size: 0.8rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<header>
    <button class="btn" style="width: auto; border:none;" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
    <div class="brand">JARVIS <span style="color:var(--red)">PARANORMAL</span></div>
    <div id="status">v48.0 • IA SPECTRALE • EN LIGNE</div>
</header>

<div id="display">
    <div class="radar-grid"></div>
    <div class="radar-sweep" id="radar"></div>
    <canvas id="visualizer-canvas"></canvas>
    
    <div id="input-text">INITIALISATION DU RÉSEAU NEURAL...</div>
    <div id="output-text">Connexion avec l'au-delà en cours.</div>
</div>

<div id="viz">
    <div class="sensor-box">
        <div class="sensor-label"><span>ENTITÉ (SIGNAL)</span><span id="val-ent">0%</span></div>
        <div class="bar-container"><div id="bar-ent" class="bar-fill" style="background:var(--ghost)"></div></div>
    </div>
    <div class="sensor-box">
        <div class="sensor-label"><span>EMF (CHAMP)</span><span id="val-emf">0</span></div>
        <div class="bar-container"><div id="bar-emf" class="bar-fill" style="background:#00ff00"></div></div>
    </div>
    <div class="sensor-box">
        <div class="sensor-label"><span>HUMEUR</span><span id="val-mood">NEUTRE</span></div>
        <div class="bar-container"><div id="bar-mood" class="bar-fill" style="background:var(--cold)"></div></div>
    </div>
</div>

<div id="console"></div>

<footer>
    <div id="mic"><i class="fas fa-microphone"></i></div>
    <div class="btn-row">
        <button class="btn" onclick="triggerEVP()"><i class="fas fa-wave-square"></i> MODE EVP</button>
        <button class="btn danger" onclick="toggleFlashlight()"><i class="fas fa-bolt"></i> CHOC ÉLÉCT.</button>
    </div>
</footer>

<div id="toast" class="toast">Message système</div>

<!-- MENU OVERLAY -->
<div id="menu-overlay" class="overlay">
    <div class="overlay-header">
        <h2>SYSTÈME v48.0</h2>
        <button class="close-btn" onclick="toggleMenu()">&times;</button>
    </div>
    <div class="menu-grid">
        <div class="menu-item" onclick="openLogs()">
            <i class="fas fa-list-ul"></i>
            <span>Journal des esprits</span>
        </div>
        <div class="menu-item" onclick="clearData()">
            <i class="fas fa-trash-alt"></i>
            <span>Purger les données</span>
        </div>
        <div class="menu-item" onclick="showInfo()">
            <i class="fas fa-microchip"></i>
            <span>État du Capteur</span>
        </div>
        <div class="menu-item" onclick="toggleMenu()">
            <i class="fas fa-times"></i>
            <span>Fermer</span>
        </div>
    </div>
</div>

<script>
    /* ========================================================
       JARVIS PARANORMAL v48.0 - INTELLIGENCE SPECTRALE
       Logique de réponse améliorée et analyse d'humeur
       ======================================================== */

    // --- ETAT DU SYSTEME ---
    const state = {
        listening: false,
        audioCtx: null,
        analyser: null,
        recognition: null,
        voices: [],
        mood: 'NEUTRE', // NEUTRE, CURIEUX, COLERE, PEUR
        aggressionLevel: 0,
        lastInteraction: Date.now()
    };

    // --- BASE DE DONNÉES DE L'ENTITÉ (Le Cerveau) ---
    const ghostBrain = {
        identite: [
            "Je ne me souviens plus de mon nom.",
            "On m'appelait l'oublié.",
            "Je suis ce qui reste après la fin.",
            "Un écho... juste un écho."
        ],
        lieu: [
            "Je suis bloqué ici.",
            "Cette pièce est froide, n'est-ce pas ?",
            "Je vois des murs qui n'existent plus.",
            "C'est ici que tout s'est arrêté."
        ],
        menace: [ // Si l'utilisateur est méchant
            "NE ME CRIE PAS DESSUS !",
            "Tu devrais avoir peur.",
            "Je vais te montrer ce qu'est la vraie douleur.",
            "Partir... c'est trop tard pour toi.",
            "TAIS-TOI !"
        ],
        peur: [
            "Ne me fais pas mal.",
            "La lumière... elle brûle.",
            "Je veux juste rentrer.",
            "Pourquoi es-tu si méchant ?"
        ],
        curiosite: [
            "Qui es-tu ?",
            "Tu as une âme chaude.",
            "C'est quoi cet appareil ?",
            "Entends-tu comme moi ?"
        ],
        evp: [ // Phrases aléatoires EVP
            "Il arrive...",
            "Aide-moi...",
            "Derrière la porte.",
            "Le sang...",
            "Froid...",
            "Non... pas encore.",
            "Ils reviennent."
        ]
    };

    // --- LOGS & UI ---
    const log = (msg, type = 'info') => {
        const c = document.getElementById('console');
        const d = document.createElement('div');
        const t = new Date().toLocaleTimeString().split(' ')[0];
        let col = '#00ff85';
        if (type === 'warn') col = '#ff0000';
        if (type === 'user') col = '#ffd700';
        if (type === 'ghost') col = '#00ffff';
        
        d.innerHTML = `<span style="color:#555">[${t}]</span> <span style="color:${col}">${msg}</span>`;
        c.appendChild(d);
        c.scrollTop = c.scrollHeight;
        if (c.children.length > 30) c.removeChild(c.firstChild);
    };

    const toast = (msg) => {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    };

    // --- MOTEUR AUDIO & VISUALISATION ---
    async function initAudio() {
        try {
            state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            state.analyser = state.audioCtx.createAnalyser();
            state.analyser.fftSize = 2048;
            const source = state.audioCtx.createMediaStreamSource(stream);
            source.connect(state.analyser);

            const canvas = document.getElementById('visualizer-canvas');
            const ctx = canvas.getContext('2d');
            
            const resize = () => {
                canvas.width = window.innerWidth;
                canvas.height = document.getElementById('display').offsetHeight;
            };
            window.addEventListener('resize', resize);
            resize();

            const bufferLength = state.analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);
                state.analyser.getByteTimeDomainData(dataArray);
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Couleur dynamique selon l'humeur
                let strokeColor = '#00ff85'; // Neutre
                if (state.mood === 'COLERE') strokeColor = '#ff0000';
                else if (state.mood === 'PEUR') strokeColor = '#00ffff';
                else if (state.mood === 'CURIEUX') strokeColor = '#bd00ff';

                ctx.lineWidth = 2;
                ctx.strokeStyle = strokeColor;
                ctx.shadowBlur = 10;
                ctx.shadowColor = strokeColor;

                ctx.beginPath();
                const sliceWidth = canvas.width * 1.0 / bufferLength;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = v * canvas.height / 2;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                    x += sliceWidth;
                }
                ctx.stroke();
            }
            draw();

            // Boucle capteurs simulés
            setInterval(simulateSensors, 100);
            
            return true;
        } catch (e) {
            log("ERREUR AUDIO: " + e.message, 'warn');
            toast("Micro requis pour la détection");
            return false;
        }
    }

    function simulateSensors() {
        if (!state.analyser) return;
        
        const arr = new Uint8Array(state.analyser.frequencyBinCount);
        state.analyser.getByteFrequencyData(arr);
        
        let sum = 0;
        for(let i=0; i<arr.length/5; i++) sum += arr[i]; // Basses fréquences
        
        let activity = Math.min(100, Math.round((sum / (arr.length/5)) * 4));
        
        // Influence de l'humeur sur l'activité
        if (state.mood === 'COLERE') activity += 15;
        
        // UI Update
        document.getElementById('val-ent').innerText = activity + "%";
        document.getElementById('bar-ent').style.width = activity + "%";
        
        // EMF Simulation
        const emf = Math.min(100, Math.max(0, activity + (Math.random()*20 - 10)));
        document.getElementById('val-emf').innerText = Math.floor(emf) + " mG";
        document.getElementById('bar-emf').style.width = emf + "%";

        // Mood UI
        const mBar = document.getElementById('bar-mood');
        document.getElementById('val-mood').innerText = state.mood;
        mBar.style.width = "100%";
        if(state.mood === 'COLERE') mBar.style.background = 'red';
        else if(state.mood === 'NEUTRE') mBar.style.background = '#00ff85';
        else if(state.mood === 'CURIEUX') mBar.style.background = 'purple';
        else mBar.style.background = '#00ffff';

        // Radar speed based on activity
        const radar = document.getElementById('radar');
        if(radar) radar.style.animationDuration = (4 - (activity/40)) + "s";
    }

    // --- INTELLIGENCE ARTIFICIELLE DE RÉPONSE ---
    function processThought(input) {
        const text = input.toLowerCase();
        let response = "";
        let newMood = state.mood;

        // 1. Analyse de l'agressivité de l'utilisateur
        const angryWords = ['dégage', 'va-t-en', 'con', 'salope', 'merde', 'ferme', 'tue', 'crève', 'putain'];
        const isUserAngry = angryWords.some(w => text.includes(w));

        if (isUserAngry) {
            newMood = 'COLERE';
            state.aggressionLevel += 20;
            response = pick(ghostBrain.menace);
        } else {
            // Analyse sémantique
            if (text.includes('qui') || text.includes('nom') || text.includes('comment t\'appelle')) {
                newMood = 'CURIEUX';
                response = pick(ghostBrain.identite);
            } else if (text.includes('où') || text.includes('ici') || text.includes('endroit')) {
                response = pick(ghostBrain.lieu);
            } else if (text.includes('peur') || text.includes('mal') || text.includes('douleur')) {
                newMood = 'PEUR';
                response = pick(ghostBrain.peur);
            } else if (text.includes('bonjour') || text.includes('salut') || text.includes('ça va')) {
                newMood = 'NEUTRE';
                response = "Je suis là... depuis toujours.";
            } else {
                // Réponse générique intelligente
                const generic = [
                    "Je n'ai pas compris les vivants.",
                    "Les mots manquent de sens ici.",
                    "Pourquoi insistes-tu ?",
                    "L'énergie diminue...",
                    "Écoute le silence."
                ];
                response = pick(generic);
            }
        }

        // Calmer le jeu si l'utilisateur est gentil
        if (!isUserAngry && state.aggressionLevel > 0) state.aggressionLevel -= 5;
        if (state.aggressionLevel < 0) state.aggressionLevel = 0;
        if (state.aggressionLevel > 80) newMood = 'COLERE';

        state.mood = newMood;
        return response;
    }

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    // --- SYNTHÈSE VOCALE (TTS) ---
    function loadVoices() {
        state.voices = window.speechSynthesis.getVoices();
        if (state.voices.length === 0) {
            window.speechSynthesis.onvoiceschanged = () => {
                state.voices = window.speechSynthesis.getVoices();
            };
        }
    }

    function ghostSpeak(text) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'fr-FR';
        
        // Modification de la voix selon l'humeur
        if (state.mood === 'COLERE') {
            u.rate = 1.1; // Rapide
            u.pitch = 0.4; // Grave
            document.getElementById('output-text').style.borderColor = 'red';
        } else if (state.mood === 'PEUR') {
            u.rate = 0.7; // Lent
            u.pitch = 0.8; // Aigu
            document.getElementById('output-text').style.borderColor = '#00ffff';
        } else {
            u.rate = 0.8;
            u.pitch = 0.6;
            document.getElementById('output-text').style.borderColor = 'var(--ghost)';
        }

        // Sélection voix
        const frVoice = state.voices.find(v => v.lang.includes('fr'));
        if (frVoice) u.voice = frVoice;

        // Effet Glitch sur le texte pendant la parole
        const out = document.getElementById('output-text');
        out.classList.add('glitch-active');
        out.innerText = ">> " + text.toUpperCase();
        
        u.onend = () => {
            out.classList.remove('glitch-active');
            out.style.borderColor = 'var(--cold)';
        };

        window.speechSynthesis.speak(u);
        log("ENTITÉ: " + text, 'ghost');
    }

    // --- RECONNAISSANCE VOCALE (STT) ---
    function initSpeech() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return false;

        state.recognition = new SpeechRecognition();
        state.recognition.lang = 'fr-FR';
        state.recognition.continuous = false;
        state.recognition.interimResults = false;

        state.recognition.onstart = () => {
            state.listening = true;
            document.getElementById('mic').classList.add('active');
            document.getElementById('input-text').innerText = "ÉCOUTE...";
            log("Canal vocal ouvert...", 'info');
        };

        state.recognition.onend = () => {
            state.listening = false;
            document.getElementById('mic').classList.remove('active');
            if(document.getElementById('input-text').innerText === "ÉCOUTE...") {
                document.getElementById('input-text').innerText = "EN ATTENTE DE SIGNAL...";
            }
        };

        state.recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('input-text').innerText = "VOUS: " + transcript;
            log("UTILISATEUR: " + transcript, 'user');
            
            // Analyse et réponse
            const reply = processThought(transcript);
            setTimeout(() => ghostSpeak(reply), 800 + Math.random() * 1000);
        };

        return true;
    }

    // --- INTERACTIONS ---
    document.getElementById('mic').addEventListener('click', () => {
        if(state.recognition) {
            try { state.recognition.start(); } catch(e){}
        } else {
            toast("Module vocal non initialisé");
        }
    });

    function triggerEVP() {
        toast("Capture EVP en cours...");
        log("Analyse spectrale bruit de fond...", 'warn');
        document.getElementById('input-text').innerText = "ANALYSE DES FRÉQUENCES...";
        
        setTimeout(() => {
            const evpMsg = pick(ghostBrain.evp);
            state.mood = 'CURIEUX';
            ghostSpeak(evpMsg);
        }, 3000);
    }

    function toggleFlashlight() {
        toast("Décharge électromagnétique simulée");
        log("CHOC ÉLÉCTRIQUE envoyé", 'warn');
        document.body.style.background = '#fff';
        setTimeout(() => document.body.style.background = 'radial-gradient(circle at 50% 0%, var(--dark) 0%, #000 80%)', 100);
        
        if(state.mood !== 'COLERE') {
            state.mood = 'COLERE';
            setTimeout(() => ghostSpeak("ARRÊTE ÇA !"), 1500);
        }
    }

    // --- MENU ---
    function toggleMenu() { document.getElementById('menu-overlay').classList.toggle('open'); }
    function openLogs() { alert("Logs sauvegardés dans la console mémoire locale (simulation)."); toggleMenu(); }
    function clearData() { document.getElementById('console').innerHTML = ''; log("Mémoire purgée.", 'warn'); toggleMenu(); }
    function showInfo() { alert("Batterie: Connectée\nRéseau: Neural v48.0\nLatence: 12ms"); toggleMenu(); }

    // --- START ---
    window.onload = async () => {
        log("Démarrage JARVIS PARANORMAL v48.0...", 'info');
        loadVoices();
        
        const ok = await initAudio();
        if(ok) {
            initSpeech();
            setTimeout(() => {
                ghostSpeak("Le réseau est actif. Je t'entends.");
                document.getElementById('output-text').innerText = "Le système est prêt.";
                document.getElementById('input-text').innerText = "EN ATTENTE DE SIGNAL...";
            }, 1500);
        } else {
            document.getElementById('input-text').innerText = "ERREUR CAPTEUR AUDIO";
        }
    };

</script>
