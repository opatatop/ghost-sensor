<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEUS BLACK PROJECT vFINAL</title>

<style>
body{
    margin:0;
    background:#050510;
    color:#00ffff;
    font-family:monospace;
}
#terminal{
    height:140px;
    background:#000;
    overflow:auto;
    font-size:11px;
}
button{
    padding:8px;
    margin:2px;
    background:#111;
    color:#00ffff;
    border:1px solid #00ffff;
}
.active{background:#00ffff;color:#000;}
</style>
</head>

<body>

<div>
<button onclick="App.start()">⚡ START</button>
<button onclick="App.stop()">🛑 STOP</button>
<br>
<button onclick="Brain.setMode('zeus')" id="b_zeus">⚡ ZEUS</button>
<button onclick="Brain.setMode('dark')" id="b_dark">💀 DARK</button>
<button onclick="Brain.setMode('scientist')" id="b_scientist">🧠 SCIENTIST</button>
<button onclick="Brain.setMode('jarvis')" id="b_jarvis">🤖 JARVIS</button>
</div>

<canvas id="scopeCanvas"></canvas>
<div id="terminal"></div>

<script>
const API_URL = "https://ghost-sensor.opatatop.workers.dev";

// 🧠 mémoire locale
let memory = JSON.parse(localStorage.getItem("zeus_memory")||"[]");

let recognition, analyser, data;
let lastSpeak = 0;

const App = {
 log(msg){
  const t=document.getElementById("terminal");
  const d=document.createElement("div");
  d.textContent="["+new Date().toLocaleTimeString()+"] "+msg;
  t.appendChild(d);
  t.scrollTop=t.scrollHeight;
 },

 async start(){
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  const ctx = new AudioContext();
  const src = ctx.createMediaStreamSource(stream);

  analyser = ctx.createAnalyser();
  analyser.fftSize=2048;
  src.connect(analyser);
  data = new Uint8Array(analyser.frequencyBinCount);

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang="fr-FR";
  recognition.continuous=true;

  recognition.onresult = e=>{
    const res = e.results[e.results.length-1][0];
    const txt = res.transcript.trim();
    const conf = res.confidence;

    if(conf < 0.6) return;
    if(Date.now() - lastSpeak < 4000) return;

    lastSpeak = Date.now();

    App.log("🎤 "+txt+" ("+Math.round(conf*100)+"%)");
    Brain.process(txt);
  };

  recognition.start();
  Visual.loop();

  App.log("⚡ ZEUS ACTIVÉ");
 },

 stop(){
  if(recognition) recognition.stop();
  App.log("🛑 STOP");
 }
};

const Brain = {

 mode:"zeus",

 setMode(m){
  this.mode=m;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  document.getElementById("b_"+m).classList.add("active");
  App.log("MODE: "+m.toUpperCase());
 },

 getPrompt(){
  return {
   zeus:"IA mystérieuse, puissante, réponses courtes.",
   dark:"IA sombre, froide, inquiétante.",
   scientist:"IA logique, analytique.",
   jarvis:"Assistant intelligent, clair."
  }[this.mode];
 },

 async process(input){

  // mémoire
  memory.push(input);
  if(memory.length>20) memory.shift();
  localStorage.setItem("zeus_memory", JSON.stringify(memory));

  const context = memory.slice(-8).join(" | ");

  try{
   const res = await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
     messages:[
      {role:"system",content:this.getPrompt()},
      {role:"system",content:"Contexte: "+context},
      {role:"user",content:input}
     ]
    })
   });

   const data = await res.json();
   const reply = data.choices[0].message.content;

   App.log("⚡ "+this.mode.toUpperCase()+": "+reply);
   this.speak(reply);

  }catch(e){
   App.log("❌ ERREUR IA");
   console.error(e);
  }
 },

 speak(text){
  const u=new SpeechSynthesisUtterance(text);
  u.rate=0.9;
  speechSynthesis.speak(u);
 }
};

// 🎧 VISUAL SPECTRAL PRO
const Visual = {
 loop(){
  requestAnimationFrame(()=>this.loop());

  const canvas=document.getElementById("scopeCanvas");
  const ctx=canvas.getContext("2d");

  canvas.width=innerWidth;
  canvas.height=innerHeight;

  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(!analyser) return;

  analyser.getByteFrequencyData(data);

  for(let i=0;i<data.length;i++){
   const val=data[i];
   const x=i*2;
   const h=val*1.5;

   ctx.fillStyle=`hsl(${i/2},100%,50%)`;
   ctx.fillRect(x,canvas.height-h,2,h);
  }
 }
};

// 📡 EMF SIMULÉ INTELLIGENT
setInterval(()=>{
 const emf = Math.random()*100;

 if(emf > 85){
  App.log("📡 PIC EMF: "+emf.toFixed(1));
  Brain.process("Anomalie EMF détectée niveau "+emf.toFixed(1));
 }
},5000);

</script>
</body>
</html>
