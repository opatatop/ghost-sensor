<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUPRA LAB — Mode Pote</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

:root {
  --green: #00ff41;
  --red: #ff0044;
  --bg: #000000;
  --panel: #001100;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background: var(--bg);
  color: var(--green);
  font-family: 'VT323', monospace;
  font-size: 18px;
  height: 100vh;
  overflow: hidden;
}

#start-screen, #main {
  position: fixed;
  inset: 0;
  background: var(--bg);
  border: 7px solid var(--green);
}

#start-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

#main {
  display: none;
  flex-direction: column;
  padding: 12px;
  gap: 12px;
}

#main.show {
  display: flex;
}

.boot-text {
  font-size: 26px;
  margin-bottom: 35px;
  text-shadow: 0 0 14px var(--green);
  line-height: 1.3;
}

button {
  background: transparent;
  color: var(--green);
  border: 4px solid var(--green);
  padding: 12px 26px;
  font-size: 20px;
  font-family: 'VT323', monospace;
  margin: 8px;
}

button:active {
  background: var(--green);
  color: #000;
}

#btnStart {
  font-size: 28px;
  padding: 18px 48px;
}

header {
  text-align: center;
  font-size: 20px;
  padding: 10px;
  border-bottom: 3px solid var(--green);
}

#report {
  flex: 1;
  background: var(--panel);
  border: 3px solid var(--green);
  padding: 14px;
  font-size: 16px;
  line-height: 1.45;
  white-space: pre-wrap;
  overflow-y: auto;
  min-height: 200px;
}

#log {
  height: 130px;
  overflow-y: auto;
  font-size: 14px;
  border: 2px solid var(--green);
  padding: 8px;
  background: #000;
}

#ptt {
  position: fixed;
  bottom: 55px;
  left: 50%;
  transform: translateX(-50%);
  width: 145px;
  height: 145px;
  border-radius: 50%;
  background: var(--panel);
  border: 6px solid var(--green);
  color: var(--green);
  font-size: 17px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  line-height: 1.2;
  z-index: 50;
  box-shadow: 0 0 22px var(--green);
}

#ptt.active {
  background: var(--red);
  border-color: var(--red);
  color: white;
  box-shadow: 0 0 35px var(--red);
  transform: translateX(-50%) scale(1.06);
}

#settings {
  display: none;
  position: fixed;
  inset: 0;
  background: #000;
  border: 7px solid var(--green);
  padding: 20px;
  z-index: 100;
  overflow-y: auto;
}

#settings.show {
  display: block;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
}

input, select {
  width: 100%;
  padding: 10px;
  background: #000;
  color: var(--green);
  border: 2px solid var(--green);
  font-family: 'VT323', monospace;
  font-size: 17px;
}
</style>
</head>
<body>

<!-- PARAMÈTRES -->
<div id="settings">
  <h2 style="margin-bottom: 18px; text-align: center;">Paramètres</h2>
  
  <div class="form-group">
    <label>Clé API Groq (obligatoire)</label>
    <input type="password" id="apiKey" placeholder="gsk_...">
  </div>
  
  <div class="form-group">
    <label>Langue de reconnaissance</label>
    <select id="lang">
      <option value="fr-FR">Français</option>
      <option value="en-US">English</option>
    </select>
  </div>
  
  <div style="text-align: center; margin-top: 25px;">
    <button onclick="saveConfig()">Sauvegarder</button>
    <button onclick="closeSettings()">Fermer</button>
  </div>
</div>

<!-- ÉCRAN DE DÉMARRAGE -->
<div id="start-screen">
  <div class="boot-text">
    SUPRA LAB<br>
    <span style="color: #ffaa00;">Mode Pote</span><br>
    On est là ensemble
  </div>
  <button id="btnStart">LANCER</button>
  <button onclick="openSettings()">Paramètres</button>
</div>

<!-- INTERFACE PRINCIPALE -->
<div id="main">
  <header>On discute • Présence possible</header>
  
  <div id="report">
    Appuie et maintiens le bouton.
    Parle clairement ou laisse l’environnement.
    Relâche ensuite.

    Je t’écouterai et je te dirai franchement ce que j’en pense, comme un pote qui est là.
  </div>
  
  <div id="log"></div>
</div>

<!-- BOUTON -->
<button id="ptt">MAINTENIR<br>POUR PARLER</button>

<script>
// ====================== CONFIG ======================
let config = {
  key: localStorage.getItem('groqKey') || '',
  lang: localStorage.getItem('lang') || 'fr-FR'
};

let recognition = null;
let finalTranscript = '';
let isListening = false;
let isRunning = false;

// ====================== UTILITAIRES ======================
function log(msg) {
  const el = document.getElementById('log');
  if (!el) return;
  const time = new Date().toLocaleTimeString('fr-FR');
  el.innerHTML += `<div>[${time}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
  // garde seulement les 25 dernières lignes
  while (el.children.length > 25) {
    el.removeChild(el.firstChild);
  }
}

function openSettings() {
  document.getElementById('apiKey').value = config.key;
  document.getElementById('lang').value = config.lang;
  document.getElementById('settings').classList.add('show');
}

function closeSettings() {
  document.getElementById('settings').classList.remove('show');
}

function saveConfig() {
  config.key = document.getElementById('apiKey').value.trim();
  config.lang = document.getElementById('lang').value;
  localStorage.setItem('groqKey', config.key);
  localStorage.setItem('lang', config.lang);
  log("Configuration sauvegardée");
  closeSettings();
}

// ====================== BOUTON MAINTENIR ======================
function initButton() {
  const btn = document.getElementById('ptt');

  const start = (e) => {
    e.preventDefault();
    if (!isRunning) {
      log("Lance d’abord le système");
      return;
    }
    if (isListening) return;

    isListening = true;
    finalTranscript = '';
    btn.classList.add('active');
    btn.innerHTML = "J’écoute...<br>parle";
    log("Écoute démarrée");
    startRecognition();
  };

  const stop = (e) => {
    e.preventDefault();
    if (!isListening) return;

    isListening = false;
    btn.classList.remove('active');
    btn.innerHTML = "MAINTENIR<br>POUR PARLER";

    // petit délai pour laisser finir la reconnaissance
    setTimeout(() => {
      stopRecognition();
      const text = finalTranscript.trim() || "(rien de bien clair capté)";
      log("Capté : " + text);
      analyze(text);
    }, 400);
  };

  // Tactile + souris
  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('touchend', stop, { passive: false });
  btn.addEventListener('touchcancel', stop, { passive: false });
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', stop);
  btn.addEventListener('mouseleave', stop);
}

// ====================== RECONNAISSANCE VOCALE ======================
function startRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  if (!SpeechRecognition) {
    log("Reconnaissance vocale non supportée");
    return;
  }

  try {
    if (recognition) {
      recognition.abort();
    }

    recognition = new SpeechRecognition();
    recognition.lang = config.lang || 'fr-FR';
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 3;

    recognition.onresult = (event) => {
      let text = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        text += event.results[i][0].transcript;
      }
      if (text.trim()) {
        finalTranscript = text.trim();
        log("En cours : " + finalTranscript);
      }
    };

    recognition.onerror = (event) => {
      if (event.error !== 'no-speech' && event.error !== 'aborted') {
        log("Erreur reconnaissance : " + event.error);
      }
    };

    recognition.start();
  } catch (err) {
    log("Impossible de démarrer l’écoute : " + err.message);
  }
}

function stopRecognition() {
  if (recognition) {
    try {
      recognition.stop();
    } catch (e) {}
  }
}

// ====================== ANALYSE (MODE POTE) ======================
async function analyze(transcript) {
  const report = document.getElementById('report');

  if (!config.key) {
    report.textContent = "Il me faut ta clé API Groq.\nVa dans les paramètres et colle-la.";
    return;
  }

  report.textContent = "Attends, je regarde ce qui s’est passé...";

  const prompt = `Tu es un pote franc qui est vraiment présent avec la personne.
Vous êtes ensemble au même endroit. Tu viens d’entendre ce qui a été capté au micro :

"${transcript}"

Parle-lui comme on se parle entre nous :
- Dis clairement ce que tu as compris ou ressenti
- Cherche toujours une possible présence humaine ou vivante
- Donne ton avis direct et honnête
- Reste naturel, un peu mystérieux si ça colle, mais surtout vrai et proche

Réponds uniquement en français, comme un pote qui est là.`;

  try {
    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + config.key
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [
          {
            role: 'system',
            content: 'Tu parles comme un pote direct, présent et sincère. Tu cherches toujours une possible présence vivante ou humaine.'
          },
          {
            role: 'user',
            content: prompt
          }
        ],
        temperature: 0.75,
        max_tokens: 650
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || 'Erreur ' + response.status);
    }

    const data = await response.json();
    const answer = data.choices?.[0]?.message?.content || "J’ai pas grand-chose à dire pour l’instant.";

    report.textContent = `Ce que j’ai entendu :\n"${transcript}"\n\n————————————\n\n${answer}`;
    log("Réponse reçue");

  } catch (err) {
    report.textContent = "Erreur : " + err.message;
    log("Erreur : " + err.message);
  }
}

// ====================== DÉMARRAGE ======================
document.getElementById('btnStart').addEventListener('click', async () => {
  try {
    // Demande juste la permission micro
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(track => track.stop());
    
    isRunning = true;
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('main').classList.add('show');
    log("Système prêt. On est là.");
  } catch (err) {
    log("Permission micro refusée");
    alert("Il faut autoriser le micro pour que ça marche.");
  }
});

// Initialisation
initButton();
</script>
</body>
</html>
