<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS ARCHITECT v20.4 - RÉPONSE GARANTIE</title>
    <style>
        :root { --bg: #020202; --panel: #0a0f12; --primary: #00f3ff; --trans: #ffe600; --ghost: #bc13fe; --demon: #ff003c; --text: #e0f7fa; }
        * { box-sizing: border-box; user-select: none; }
        body { margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; min-height:100vh; display:flex; flex-direction:column; }
        header { background:rgba(0,0,0,0.9); padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
        .brand { font-size:1.15rem; font-weight:bold; color:var(--primary); letter-spacing:2px; }
        #main-layout { display:flex; flex:1; flex-wrap:wrap; }
        aside { background:var(--panel); padding:15px; flex:1; min-width:260px; border-right:1px solid #222; display:flex; flex-direction:column; }
        aside:last-child { border-right:none; border-left:1px solid #222; }
        #stage { flex:3; min-height:420px; background:radial-gradient(circle,#0d1418,#000); position:relative; }
        canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
        #display-overlay { position:absolute; z-index:10; text-align:center; width:90%; top:50%; left:50%; transform:translate(-50%,-50%); }
        #main-text { font-size:2.1rem; font-weight:900; text-transform:uppercase; letter-spacing:5px; }
        #controls { background:var(--panel); border-top:1px solid #333; padding:20px; display:flex; flex-wrap:wrap; gap:15px; }
        button { background:#111; border:1px solid #444; color:#ccc; padding:13px; font-size:0.85rem; cursor:pointer; border-radius:4px; width:100%; }
        button:hover { background:#222; color:#fff; }
        button.active { border-color:var(--primary); color:var(--primary); }
        .bar-container { height:8px; background:#222; border-radius:4px; overflow:hidden; }
        .bar-fill { height:100%; transition:width 0.15s; }
        #logs { flex:1; overflow-y:auto; font-size:0.75rem; }
        .log { margin:3px 0; padding-left:6px; border-left:2px solid #555; }
    </style>
</head>
<body>
    <header>
        <div class="brand">JARVIS ARCHITECT v20.4 - RÉPONSE GARANTIE</div>
        <div id="clock" style="color:#666;font-family:monospace;">00:00:00</div>
    </header>

    <div id="main-layout">
        <aside><div style="color:#666;margin-bottom:8px;">LOGS RÉELS</div><div id="logs"></div></aside>
        <div id="stage">
            <canvas id="canvas"></canvas>
            <div id="display-overlay">
                <div id="main-text" style="color:var(--primary)">EN VEILLE</div>
                <div style="font-size:0.95rem;color:#888;margin-top:8px;">Parle maintenant → réponse immédiate</div>
            </div>
        </div>
        <aside>
            <div style="color:#666;margin-bottom:8px;">VOLUME LIVE</div>
            <div class="bar-container"><div id="vol-bar" class="bar-fill" style="background:var(--primary);width:0%"></div></div>
            <div id="vol-val" style="text-align:center;margin-top:8px;font-size:0.9rem;">0%</div>
        </aside>
    </div>

    <div id="controls">
        <button id="btn-power" onclick="App.togglePower()">⚡ DÉMARRER JARVIS</button>
        <button onclick="App.toggleTranslate()">🌐 TRADUCTEUR FR→EN</button>
        <button onclick="App.setMode('ghost')">👻 FANTÔME</button>
        <button onclick="App.setMode('demon')">😈 DÉMON</button>
    </div>

    <script>
        let recognition = null;
        let active = false;
        let translateMode = false;

        const Log = (msg, type="") => {
            const d = document.createElement("div");
            d.className = `log ${type}`;
            d.textContent = `[${new Date().toLocaleTimeString('fr-FR')}] ${msg}`;
            document.getElementById("logs").prepend(d);
            if (document.getElementById("logs").children.length > 25) document.getElementById("logs").lastChild.remove();
        };

        const Voice = {
            init() {
                // Force le chargement des voix
                speechSynthesis.getVoices();
            },
            speak(text) {
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = translateMode ? "en-US" : "fr-FR";
                u.rate = 0.98;
                u.pitch = 1.0;
                speechSynthesis.speak(u);
            }
        };

        const App = {
            async togglePower() {
                active = !active;
                const btn = document.getElementById("btn-power");
                if (active) {
                    btn.textContent = "⚡ JARVIS ACTIF";
                    btn.style.borderColor = "#00f3ff";

                    // Micro + reconnaissance
                    await navigator.mediaDevices.getUserMedia({audio:true});
                    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                    recognition = new SR();
                    recognition.continuous = true;
                    recognition.interimResults = true;
                    recognition.lang = "fr-FR";

                    recognition.onresult = e => {
                        let txt = "";
                        for (let i = e.resultIndex; i < e.results.length; i++) txt += e.results[i][0].transcript;
                        if (!txt.trim()) return;

                        document.getElementById("main-text").textContent = txt.toUpperCase();
                        Log("VOUS : " + txt, "speech");

                        const lower = txt.toLowerCase();
                        let response = "J'ai bien capté : " + txt;

                        if (lower.includes("réponds") || lower.includes("parle") || lower.includes("qui es tu") || lower.includes("répond moi")) {
                            response = ["Je suis là...", "Oui je t'écoute...", "Que veux-tu ?", "Je suis juste à côté de toi..."][Math.floor(Math.random()*4)];
                        }

                        Voice.speak(response);
                        Log("JARVIS : " + response, "detected");
                    };

                    recognition.start();
                    Voice.init();
                    Log("✅ ÉCOUTE + RÉPONSE ACTIVÉES", "ok");
                    Voice.speak("Jarvis en ligne. Je réponds maintenant à tout.");
                } else {
                    btn.textContent = "⚡ DÉMARRER JARVIS";
                    if (recognition) recognition.stop();
                    Log("Système arrêté");
                }
            },
            toggleTranslate() {
                translateMode = !translateMode;
                Log(translateMode ? "MODE TRADUCTEUR FR→EN ACTIVÉ" : "Mode traducteur désactivé", "translate");
            },
            setMode(m) {
                Log(`MODE ${m.toUpperCase()} ACTIVÉ`);
            }
        };

        // Boucle volume
        function loop() {
            if (!active) return requestAnimationFrame(loop);
            requestAnimationFrame(loop);
        }

        window.onload = () => {
            setInterval(() => document.getElementById("clock").textContent = new Date().toLocaleTimeString('fr-FR'), 1000);
            Voice.init();   // Pré-charge les voix
            loop();
            Log("Prêt. Clique sur DÉMARRER JARVIS et parle.", "info");
        };
    </script>
</body>
</html>
