<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS ARCHITECT v18.0 - FULL ACCESS</title>
    <style>
        :root {
            --bg: #020202;
            --panel: #0a0f12;
            --primary: #00f3ff;
            --ghost: #bc13fe;
            --demon: #ff003c;
            --text: #e0f7fa;
            --dim: #445566;
            --font-mono: 'Consolas', 'Courier New', monospace;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        /* --- LAYOUT PRINCIPAL FLEXIBLE (SCROLLABLE) --- */
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh; /* Permet le scroll si le contenu dépasse */
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* ACTIVATION DU SCROLL */
        }

        /* --- HEADER --- */
        header {
            background: rgba(0,0,0,0.9); border-bottom: 1px solid #333;
            padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .brand { font-size: 1.1rem; font-weight: bold; color: var(--primary); letter-spacing: 2px; font-family: var(--font-mono); }
        .clock { font-family: var(--font-mono); color: #888; font-size: 0.9rem; }

        /* --- CONTENEUR PRINCIPAL (GRID RESPONSIVE) --- */
        #main-layout {
            display: flex;
            flex-wrap: wrap; /* Permet le retour à la ligne sur petit écran */
            flex: 1; /* Prend l'espace restant */
        }

        /* --- SIDE BARS --- */
        aside {
            background: var(--panel); padding: 15px; font-family: var(--font-mono); font-size: 0.75rem;
            flex: 1; /* Prend de l'espace proportionnel */
            min-width: 250px; /* Largeur minimale */
            border-right: 1px solid #222;
            display: flex; flex-direction: column;
        }
        aside:last-child { border-right: none; border-left: 1px solid #222; }

        .panel-title { color: #666; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; font-weight: bold; }

        #logs { flex: 1; overflow-y: auto; color: #888; display: flex; flex-direction: column-reverse; max-height: 300px; }
        .log { margin-bottom: 4px; border-left: 2px solid #333; padding-left: 5px; font-size: 0.7rem; }
        .log.detected { color: var(--primary); border-color: var(--primary); }
        .log.speech { color: #fff; border-color: #fff; }

        /* --- MAIN STAGE (L'OEIL) --- */
        #stage {
            flex: 3; /* Prend 3x plus de place que les sidebars */
            min-width: 300px;
            min-height: 400px; /* Hauteur minimale garantie */
            background: radial-gradient(circle at center, #0d1418 0%, #000 100%);
            position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        #display-overlay {
            position: absolute; z-index: 5; text-align: center; pointer-events: none; width: 90%;
        }
        #main-text {
            font-size: 2rem; font-weight: 900; text-transform: uppercase;
            letter-spacing: 4px; text-shadow: 0 0 20px #000; margin-bottom: 10px;
        }
        #sub-text {
            font-size: 0.9rem; background: rgba(0,0,0,0.7); padding: 5px 15px;
            border-radius: 20px; border: 1px solid #444; color: #ccc;
        }

        /* --- CONTROLS (TOUJOURS ACCESSIBLE EN BAS) --- */
        #controls {
            background: var(--panel); border-top: 1px solid #333;
            padding: 20px; display: flex; flex-wrap: wrap; gap: 20px;
            width: 100%; flex-shrink: 0; /* Ne s'écrase pas */
        }
        
        .control-group { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 10px; }
        .control-group.wide { flex-basis: 100%; }

        /* --- BOUTONS & INPUTS --- */
        button {
            background: #111; border: 1px solid #444; color: #aaa;
            padding: 12px; font-family: var(--font-mono); font-size: 0.8rem;
            text-transform: uppercase; cursor: pointer; transition: 0.2s; border-radius: 4px;
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        button:hover { background: #222; color: #fff; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Active States */
        button.active { border-color: var(--primary); color: var(--primary); background: rgba(0, 243, 255, 0.1); }
        button.active-ghost { border-color: var(--ghost); color: var(--ghost); background: rgba(188, 19, 254, 0.1); }
        button.active-demon { border-color: var(--demon); color: var(--demon); background: rgba(255, 0, 60, 0.1); }
        
        /* Animation Pulse pour le bouton POWER quand actif */
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 243, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0); }
        }
        #btn-power.active { animation: pulse-green 2s infinite; }

        .btn-power { height: 60px; font-weight: bold; font-size: 1.1rem; }

        /* Sliders & Bars */
        .slider-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        .slider-label { display: flex; justify-content: space-between; color: #aaa; font-size: 0.75rem; font-family: var(--font-mono); }
        input[type="range"] { width: 100%; height: 6px; background: #222; outline: none; -webkit-appearance: none; border-radius: 3px; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px rgba(255,255,255,0.5); }

        .bar-container { width: 100%; height: 8px; background: #222; border-radius: 4px; overflow: hidden; margin-top: 2px; }
        .bar-fill { height: 100%; transition: width 0.1s; }

        /* Mobile Specifics */
        @media (max-width: 800px) {
            #main-layout { flex-direction: column; }
            aside { width: 100%; border-right: none; border-bottom: 1px solid #222; min-height: auto; }
            #stage { height: 350px; flex: none; }
            #controls { flex-direction: column; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand">JARVIS ARCHITECT v18.0</div>
    <div class="clock" id="clock">00:00:00</div>
</header>

<div id="main-layout">
    <!-- GAUCHE : LOGS -->
    <aside>
        <div class="panel-title">JOURNAL SYSTÈME</div>
        <div id="logs">
            <div class="log">> En attente d'initialisation...</div>
        </div>
    </aside>

    <!-- CENTRE : VISUEL -->
    <div id="stage">
        <canvas id="mainCanvas"></canvas>
        <div id="display-overlay">
            <div id="main-text" style="color:var(--primary)">VEILLE</div>
            <div id="sub-text">Cliquez sur DÉMARRER</div>
        </div>
    </div>

    <!-- DROITE : SPECTRE & PARAMÈTRES -->
    <aside>
        <div class="panel-title">ANALYSE AUDIO</div>
        
        <!-- Bars Visuelles -->
        <div style="margin-bottom: 15px;">
            <div class="slider-label"><span>BASSES (Démons)</span> <span id="val-bass">0%</span></div>
            <div class="bar-container"><div id="bar-bass" class="bar-fill" style="background:var(--demon); width:0%"></div></div>
        </div>
        <div style="margin-bottom: 15px;">
            <div class="slider-label"><span>AIGUS (Fantômes)</span> <span id="val-treble">0%</span></div>
            <div class="bar-container"><div id="bar-treble" class="bar-fill" style="background:var(--ghost); width:0%"></div></div>
        </div>
        <div style="margin-bottom: 15px;">
            <div class="slider-label"><span>VOLUME TOTAL</span> <span id="val-vol">0%</span></div>
            <div class="bar-container"><div id="bar-vol" class="bar-fill" style="background:var(--primary); width:0%"></div></div>
        </div>

        <div class="panel-title" style="margin-top:20px;">RÉGLAGES MICRO</div>
        <div class="slider-row">
            <div class="slider-label">SENSIBILITÉ <span id="sens-val">50</span></div>
            <input type="range" id="rng-sens" min="0" max="100" value="50" oninput="Config.update('sens', this.value)">
        </div>
        <button onclick="AudioSys.calibrate()">🎚️ CALIBRER LE SILENCE</button>
    </aside>
</div>

<!-- CONTROLS (ACCESSIBLE PAR SCROLL) -->
<div id="controls">
    <!-- GROUPE 1 : PUISSANCE -->
    <div class="control-group">
        <button id="btn-power" class="btn-power" onclick="App.togglePower()">⚡ DÉMARRER JARVIS</button>
        <div style="font-size:0.75rem; color:#666; text-align:center; margin-top:5px;">
            Système reactif 100% - Faites défiler pour tout voir.
        </div>
    </div>

    <!-- GROUPE 2 : MODES -->
    <div class="control-group">
        <div class="panel-title">MODES DE DÉTECTION</div>
        <button id="mod-normal" class="active" onclick="App.setMode('normal')">👁️ STANDARD (Tout)</button>
        <button id="mod-ghost" onclick="App.setMode('ghost')">👻 FANTÔMES (Aigus)</button>
        <button id="mod-demon" onclick="App.setMode('demon')">😈 DÉMONS (Graves)</button>
    </div>

    <!-- GROUPE 3 : OPTIONS -->
    <div class="control-group">
        <div class="panel-title">OPTIONS</div>
        <button id="mod-humor" class="active" onclick="App.toggle('humor')">🗣️ HUMEUR (Ricolà)</button>
        <button id="mod-voice" class="active" onclick="App.toggle('voice')">🎙️ RÉPONSE VOCALE</button>
        <button onclick="App.clearLogs()" style="margin-top:auto; font-size:0.7rem; opacity:0.6;">🗑️ Effacer les logs</button>
    </div>
</div>

<script>
/**
 * JARVIS ARCHITECT v18.0
 * Layout Flexible et Full Access.
 */

// --- 1. CONFIGURATION ---
const Config = {
    sens: 50,
    thresholdVol: 15,
    thresholdZCR: 200,
    bassThreshold: 100,
    trebleThreshold: 80,
    
    update(key, val) {
        this[key] = parseInt(val);
        if(key === 'sens') {
            const factor = (100 - this.sens) / 100;
            this.thresholdVol = 10 + (factor * 20);
            this.bassThreshold = 80 + (factor * 50);
            this.trebleThreshold = 60 + (factor * 50);
            document.getElementById('sens-val').innerText = val;
        }
    }
};

const State = {
    active: false,
    mode: 'normal',
    options: { humor: true, voice: true },
    lastEvent: 0,
    mouse: { x: 0, y: 0 }
};

// --- 2. AUDIO ENGINE ---
const AudioSys = {
    ctx: null, analyser: null, source: null,
    freqData: null, timeData: null, bufferLen: 0,

    async init() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (this.ctx.state === 'suspended') await this.ctx.resume();

            this.analyser = this.ctx.createAnalyser();
            this.analyser.fftSize = 2048; 
            this.source = this.ctx.createMediaStreamSource(stream);
            this.source.connect(this.analyser);
            
            this.bufferLen = this.analyser.frequencyBinCount;
            this.freqData = new Uint8Array(this.bufferLen);
            this.timeData = new Uint8Array(this.bufferLen);
            
            Log.add("Flux audio connecté avec succès.", "ok");
            return true;
        } catch (e) {
            Log.add("Erreur Micro: " + e.message, "err");
            alert("Micro requis. Vérifiez les permissions.");
            return false;
        }
    },

    analyze() {
        if (!State.active) return null;
        this.analyser.getByteFrequencyData(this.freqData);
        this.analyser.getByteTimeDomainData(this.timeData);

        let sum = 0;
        for (let i = 0; i < this.bufferLen; i++) {
            const x = (this.timeData[i] / 128.0) - 1;
            sum += x * x;
        }
        const rms = Math.sqrt(sum / this.bufferLen);
        const volume = Math.min(100, rms * 100 * 2.5);

        let zcr = 0;
        for (let i = 1; i < this.bufferLen; i++) {
            if ((this.timeData[i] >= 128 && this.timeData[i - 1] < 128) ||
                (this.timeData[i] < 128 && this.timeData[i - 1] >= 128)) zcr++;
        }

        let bassSum = 0;
        for(let i=0; i<15; i++) bassSum += this.freqData[i];
        const bassAvg = bassSum / 15;

        let trebleSum = 0;
        for(let i=200; i<450; i++) trebleSum += this.freqData[i];
        const trebleAvg = trebleSum / 250;

        return { volume, zcr, bassAvg, trebleAvg, freq: this.freqData, time: this.timeData };
    },

    calibrate() {
        if (!State.active) return;
        Log.add("Calibration... Faites silence.", "info");
        let samples = 0, sumVol = 0;
        
        const interval = setInterval(() => {
            const m = this.analyze();
            if(!m) return;
            sumVol += m.volume;
            samples++;
            
            if(samples >= 40) {
                clearInterval(interval);
                const floor = (sumVol / samples) + 5;
                Config.sens = Math.max(0, 100 - (floor * 3)); 
                document.getElementById('rng-sens').value = Config.sens;
                document.getElementById('sens-val').innerText = Math.round(Config.sens);
                Log.add(`Calibration OK. Seuil adapté.`, "ok");
                Voice.speak("Calibration terminée. Je suis prêt.");
            }
        }, 50);
    }
};

// --- 3. VOICE ENGINE ---
const Voice = {
    synth: window.speechSynthesis,
    
    speak(text, type = 'normal') {
        if (!State.active) return;
        this.synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'fr-FR';
        u.rate = 1.0;
        
        if (type === 'ghost') { u.pitch = 0.6; u.rate = 0.8; }
        else if (type === 'demon') { u.pitch = 0.2; u.rate = 0.6; }
        else { u.pitch = 1.0; }
        
        this.synth.speak(u);
    },

    initRec() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return;
        const rec = new SR();
        rec.continuous = true; rec.interimResults = false; rec.lang = 'fr-FR';
        
        rec.onresult = (e) => {
            if (!State.options.voice) return;
            const txt = e.results[e.results.length-1][0].transcript.trim().toLowerCase();
            if (txt) {
                Log.add(`Vous: "${txt}"`, "speech");
                UI.setText(txt.toUpperCase());
                State.lastEvent = Date.now();
                
                if (txt.includes('jarvis')) this.speak("Je vous écoute.");
                else if (txt.includes('bonjour')) this.speak("Bonjour.");
                else if (txt.includes('merci')) this.speak("Je suis là pour servir.");
                else if (txt.includes('démon')) this.speak("Je surveille les basses fréquences.");
                else if (txt.includes('fantôme')) this.speak("Je scanne les hautes fréquences.");
            }
        };
        rec.start();
    }
};

// --- 4. VISUALS ---
const Visuals = {
    canvas: document.getElementById('mainCanvas'),
    ctx: document.getElementById('mainCanvas').getContext('2d'),
    
    resize() {
        this.canvas.width = this.canvas.parentElement.clientWidth;
        this.canvas.height = this.canvas.parentElement.clientHeight;
    },

    draw(m) {
        const w = this.canvas.width;
        const h = this.canvas.height;
        const ctx = this.ctx;
        const cx = w / 2;
        const cy = h / 2;

        ctx.fillStyle = 'rgba(2, 2, 2, 0.2)';
        ctx.fillRect(0, 0, w, h);
        if (!m) return;

        let color = '#00f3ff';
        if (State.mode === 'ghost') color = '#bc13fe';
        if (State.mode === 'demon') color = '#ff003c';

        const dx = State.mouse.x - cx; // Utilise les coordonnées relatives au canvas si besoin, ou pageX/Y
        const dy = State.mouse.y - cy;
        // Ajustement pour la position de la souris par rapport au canvas
        const rect = this.canvas.getBoundingClientRect();
        const mouseX = State.mouse.x - rect.left;
        const mouseY = State.mouse.y - rect.top;
        
        const angle = Math.atan2(mouseY - cy, mouseX - cx);
        const dist = Math.min(Math.sqrt(Math.pow(mouseX - cx, 2) + Math.pow(mouseY - cy, 2)), 20);

        ctx.save();
        ctx.translate(cx + Math.cos(angle)*dist, cy + Math.sin(angle)*dist);

        const pSize = 30 + (m.volume / 100) * 50;
        ctx.beginPath();
        ctx.arc(0, 0, pSize, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.shadowColor = color;
        ctx.shadowBlur = 30;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 5]);
        ctx.beginPath(); ctx.arc(0, 0, pSize + 20, 0, Math.PI*2); ctx.stroke();
        
        ctx.restore();
    }
};

// --- 5. LOGIC ---
const Logic = {
    loop() {
        if (!State.active) { requestAnimationFrame(() => this.loop()); return; }

        const m = AudioSys.analyze();
        Visuals.draw(m);

        // UI Update
        document.getElementById('bar-vol').style.width = m.volume + '%';
        document.getElementById('val-vol').innerText = Math.round(m.volume);
        document.getElementById('bar-bass').style.width = (m.bassAvg / 255 * 100) + '%';
        document.getElementById('val-bass').innerText = Math.round(m.bassAvg);
        document.getElementById('bar-treble').style.width = (m.trebleAvg / 255 * 100) + '%';
        document.getElementById('val-treble').innerText = Math.round(m.trebleAvg);

        const now = Date.now();
        if (now - State.lastEvent < 1500) { requestAnimationFrame(() => this.loop()); return; }

        // 1. TOUX
        if (m.volume > Config.thresholdVol && m.zcr > Config.thresholdZCR) {
            this.trigger('COUGH', "Irritation détectée.");
            if (State.options.humor) Voice.speak("Tiens, tu t'es raclé la gorge. Veux-tu un Ricolà ?");
            else Voice.speak("Toux détectée.");
            State.lastEvent = now;
            return;
        }

        // 2. MODES
        if (State.mode === 'demon') {
            if (m.bassAvg > Config.bassThreshold && m.volume > 10) {
                this.trigger('DEMON', "Basses fréquences.");
                Voice.speak("Je sens une présence sombre...", "demon");
                State.lastEvent = now;
                return;
            }
        } else if (State.mode === 'ghost') {
            if (m.trebleAvg > Config.trebleThreshold && m.volume > 10) {
                this.trigger('SPIRIT', "Hautes fréquences.");
                Voice.speak("Une entité est proche...", "ghost");
                State.lastEvent = now;
                return;
            }
        } else {
            if (m.volume > Config.thresholdVol * 2.5) {
                this.trigger('BRUIT', "Pic sonore.");
                Voice.speak("J'ai entendu.");
                State.lastEvent = now;
                return;
            }
        }

        requestAnimationFrame(() => this.loop());
    },

    trigger(type, msg) {
        Log.add(`${type}: ${msg}`, "detected");
        UI.setText(type);
        document.getElementById('stage').style.filter = "brightness(1.5)";
        setTimeout(() => document.getElementById('stage').style.filter = "brightness(1)", 100);
    }
};

// --- 6. CONTROLLER ---
const App = {
    async togglePower() {
        State.active = !State.active;
        const btn = document.getElementById('btn-power');
        
        if (State.active) {
            btn.classList.add('active');
            btn.innerHTML = "⚡ SYSTÈME ACTIF";
            const ok = await AudioSys.init();
            if (ok) {
                Visuals.resize();
                Logic.loop();
                Voice.initRec();
                Voice.speak("Jarvis en ligne. J'écoute.");
                Log.add("Système initialisé.", "ok");
            } else {
                State.active = false; btn.classList.remove('active');
            }
        } else {
            btn.classList.remove('active');
            btn.innerHTML = "⚡ DÉMARRER JARVIS";
            Voice.speak("Arrêt.");
            Log.add("Système éteint.", "info");
        }
    },

    setMode(mode) {
        State.mode = mode;
        ['normal', 'ghost', 'demon'].forEach(m => {
            const btn = document.getElementById('mod-'+m);
            btn.className = ""; // Reset
            if (m === mode) {
                btn.classList.add('active');
                if (m === 'ghost') btn.classList.add('active-ghost');
                if (m === 'demon') btn.classList.add('active-demon');
            }
        });
        Voice.speak(`Mode ${mode} activé.`);
        UI.setText("MODE: " + mode.toUpperCase());
    },

    toggle(opt) {
        State.options[opt] = !State.options[opt];
        const btn = document.getElementById('mod-'+opt);
        btn.classList.toggle('active');
        Voice.speak(`${opt} ${State.options[opt] ? 'activé' : 'désactivé'}.`);
    },

    clearLogs() {
        document.getElementById('logs').innerHTML = '';
    }
};

const UI = {
    setText(txt) {
        document.getElementById('main-text').innerText = txt;
        const el = document.getElementById('main-text');
        if(State.mode === 'demon') el.style.color = 'var(--demon)';
        else if(State.mode === 'ghost') el.style.color = 'var(--ghost)';
        else el.style.color = 'var(--primary)';
    }
};

const Log = {
    add(msg, type='') {
        const d = document.createElement('div');
        d.className = `log ${type}`;
        d.innerText = `[${new Date().toLocaleTimeString().split(' ')[0]}] ${msg}`;
        const c = document.getElementById('logs');
        c.prepend(d);
        if(c.children.length > 20) c.lastChild.remove();
    }
};

// --- INIT ---
window.onload = () => {
    Visuals.resize();
    window.addEventListener('resize', () => Visuals.resize());
    
    document.addEventListener('mousemove', e => { State.mouse.x = e.clientX; State.mouse.y = e.clientY; });
    document.addEventListener('touchmove', e => { State.mouse.x = e.touches[0].clientX; State.mouse.y = e.touches[0].clientY; });
    
    setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
    Log.add("Prêt. Scrollez pour voir les options.", "info");
};
</script>
</body>
</html>
