<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUPRA LAB v11 — DÉMARRAGE GARANTI</title>
    <style>
        :root {
            --primary: #00ff41;
            --secondary: #00cc33;
            --danger: #ff0044;
            --warning: #ffaa00;
            --bg-dark: #001100;
            --bg-darker: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            font-family: 'Courier New', monospace;
        }

        body {
            background: var(--bg-darker);
            color: var(--primary);
            font-size: 14px;
            line-height: 1.4;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Effet CRT */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 10% 20%, rgba(0, 255, 65, 0.03) 0%, transparent 20%),
                repeating-linear-gradient(to bottom, rgba(0, 255, 65, 0.02) 0px, rgba(0, 255, 65, 0.02) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            z-index: 9999;
        }

        /* Écran de démarrage */
        #start-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-darker);
            border: 4px solid var(--primary);
            z-index: 1000;
            padding: 20px;
            text-align: center;
        }

        #start-screen h1 {
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
            margin-bottom: 20px;
            font-size: 24px;
        }

        #start-screen .step {
            margin: 10px 0;
            font-size: 14px;
            color: var(--secondary);
        }

        #startBtn {
            background: transparent;
            color: var(--primary);
            border: 3px solid var(--primary);
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px 0;
        }
        #startBtn:hover {
            background: var(--primary);
            color: var(--bg-dark);
        }

        /* Interface principale */
        #main {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            padding: 10px;
            overflow-y: auto;
            background: var(--bg-darker);
        }

        /* Panneaux */
        .panel {
            background: var(--bg-dark);
            border: 2px solid var(--primary);
            padding: 10px;
            margin: 8px;
            position: relative;
            min-height: 150px;
        }
        .panel-header {
            position: absolute;
            top: -12px;
            left: 10px;
            background: var(--bg-dark);
            padding: 0 8px;
            font-size: 12px;
            text-transform: uppercase;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        /* Log */
        #log {
            height: 200px;
            overflow-y: auto;
            background: var(--bg-dark);
            border: 1px solid var(--primary);
            padding: 8px;
            margin: 8px;
            font-size: 12px;
            line-height: 1.2;
        }
        .log-line {
            margin: 2px 0;
            word-break: break-word;
        }
        .log-line::before {
            content: "> ";
            color: var(--secondary);
        }
        .log-line.error {
            color: var(--danger);
        }
        .log-line.success {
            color: var(--primary);
        }

        /* Status Bar */
        #status {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-dark);
            border-top: 2px solid var(--primary);
            padding: 5px 10px;
            font-size: 12px;
            text-align: center;
        }

        /* Boutons */
        button {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: var(--primary);
            color: var(--bg-dark);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Indicateurs */
        .indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 8px;
        }
        .indicator.ready {
            background: var(--primary);
        }
        .indicator.error {
            background: var(--danger);
        }

        /* Message de permission */
        #permission-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-dark);
            border: 3px solid var(--warning);
            padding: 20px;
            font-size: 16px;
            text-align: center;
            z-index: 20000;
            display: none;
        }
        #permission-message.active {
            display: block;
        }
        #permission-message button {
            margin-top: 15px;
            background: var(--primary);
            color: var(--bg-dark);
        }

        /* Boutons flottants */
        #voiceToggle {
            position: fixed;
            bottom: 60px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: var(--bg-dark);
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
        }
        #micIndicator {
            position: fixed;
            bottom: 60px;
            left: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--bg-dark);
            border: 2px solid var(--secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            font-size: 20px;
        }
        #micIndicator.listening {
            background: var(--primary);
            border-color: var(--primary);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- Message de permission micro -->
    <div id="permission-message">
        <div style="color: var(--warning);">⚠️ PERMISSION MICROPHONE REQUISE</div>
        <div style="margin-top: 10px;">Pour utiliser SUPRA LAB, autorisez l'accès au micro.</div>
        <button id="requestMicroBtn">🎤 AUTORISER LE MICRO</button>
    </div>

    <!-- Écran de démarrage -->
    <div id="start-screen">
        <h1>SUPRA LAB v11</h1>
        <div class="step">Étape 1: Autoriser le micro</div>
        <div class="step">Étape 2: Cliquer sur "LANCER"</div>
        <div class="step">Étape 3: Tout fonctionne !</div>
        <button id="startBtn">🚀 LANCER TOUT LE SYSTÈME</button>
        <button id="btnSettings">⚙️ PARAMÈTRES</button>
    </div>

    <!-- Interface principale -->
    <div id="main">
        <div class="panel">
            <div class="panel-header">SPECTROGRAMME</div>
            <canvas id="spectrogram"></canvas>
            <div>RMS: <span id="rmsValue">-- dB</span></div>
        </div>

        <div class="panel">
            <div class="panel-header">OSCILLOSCOPE</div>
            <canvas id="scope"></canvas>
        </div>

        <div class="panel">
            <div class="panel-header">LOG</div>
            <div id="log"></div>
        </div>

        <div id="status">
            <span>Micro: <span class="indicator" id="micIndicator"></span></span>
            <span>IA: <span class="indicator" id="voiceIndicator"></span></span>
        </div>
    </div>

    <!-- Boutons flottants -->
    <button id="voiceToggle" title="Activer/Désactiver la voix">🎤</button>

    <script>
        // ========== VARIABLES GLOBALES ==========
        let audioCtx = null;
        let analyser = null;
        let microphone = null;
        let gainNode = null;
        let mediaRecorder = null;
        let audioStream = null;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let frequencyArray = null;
        let timeArray = null;
        let spectroHistory = [];
        let isRunning = false;
        let isListening = false;
        let isVoiceEnabled = false;
        let config = {
            noiseThreshold: 0.4,
            voiceRate: 1.0,
            voiceVolume: 1.0,
            voiceLanguage: 'fr-FR'
        };

        // ========== FONCTIONS DE BASE ==========
        function log(text, type = "normal") {
            const logDiv = document.getElementById('log');
            if (!logDiv) return;
            const line = document.createElement('div');
            line.className = `log-line ${type === 'error' ? 'error' : type === 'success' ? 'success' : ''}`;
            line.innerHTML = `<span style="color: var(--secondary);">[${new Date().toLocaleTimeString('fr-FR')}]</span> ${text}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
            if (logDiv.children.length > 50) logDiv.removeChild(logDiv.children[0]);
        }

        function updateStatus() {
            const micStatus = document.getElementById('micIndicator');
            const voiceStatus = document.getElementById('voiceIndicator');
            if (micStatus) micStatus.className = isRunning ? 'indicator ready' : 'indicator';
            if (voiceStatus) voiceStatus.className = isListening ? 'indicator ready' : 'indicator';
        }

        function showPermissionMessage() {
            document.getElementById('permission-message').classList.add('active');
        }

        function hidePermissionMessage() {
            document.getElementById('permission-message').classList.remove('active');
        }

        // ========== SYNTHÈSE VOCALE ==========
        function speak(text) {
            if (!config.voiceFeedback || !isVoiceEnabled || !synthesis) return;
            try {
                synthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = config.voiceLanguage;
                utterance.rate = config.voiceRate;
                utterance.volume = config.voiceVolume;
                // Sélectionner une voix française si disponible
                const voices = synthesis.getVoices();
                const frenchVoice = voices.find(v => v.lang.includes('fr')) || voices[0];
                if (frenchVoice) utterance.voice = frenchVoice;
                synthesis.speak(utterance);
                log(`[VOIX] "${text}"`, "success");
            } catch (e) {
                log(`[VOIX ERREUR] ${e.message}`, "error");
            }
        }

        // ========== INITIALISATION COMPLÈTE (ÉTAPE PAR ÉTAPE) ==========
        async function initAll() {
            log("=== DÉMARRAGE DU SYSTÈME ===", "success");
            log("Étape 1/4: Initialisation du micro...", "normal");

            try {
                // Étape 1: Initialiser le micro
                await initMicro();
                log("✅ Étape 1/4: Micro prêt", "success");
                updateStatus();

                // Étape 2: Initialiser l'IA vocale
                log("Étape 2/4: Initialisation de l'IA vocale...", "normal");
                await initSpeech();
                log("✅ Étape 2/4: IA vocale prête", "success");
                updateStatus();

                // Étape 3: Démarrer la boucle de visualisation
                log("Étape 3/4: Démarrage de la boucle...", "normal");
                if (!isRunning) {
                    isRunning = true;
                    requestAnimationFrame(loop);
                }
                log("✅ Étape 3/4: Boucle démarrée", "success");

                // Étape 4: Test final
                log("Étape 4/4: Test final...", "normal");
                setTimeout(() => {
                    speak("Système prêt. Parlez maintenant, tout est capté.");
                    log("✅ Étape 4/4: Système opérationnel !", "success");
                }, 1000);

            } catch (err) {
                log(`❌ ERREUR: ${err.message}`, "error");
                updateStatus();
                showPermissionMessage();
            }
        }

        // ========== INITIALISATION DU MICRO ==========
        async function initMicro() {
            if (audioStream && !audioStream.getAudioTracks().some(t => t.readyState === 'ended')) {
                log("[AUDIO] Micro déjà initialisé", "success");
                return true;
            }

            try {
                log("[AUDIO] Demande d'accès au micro...", "normal");

                // Fermer l'ancien contexte si nécessaire
                if (audioCtx) {
                    await audioCtx.close().catch(() => {});
                }
                // NE PAS FERMER LE STREAM EXISTANT (pour éviter les redemandes)
                // if (audioStream) audioStream.getTracks().forEach(t => t.stop());

                // Créer un nouveau contexte audio
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                await audioCtx.resume();

                // Demander le micro (UNIQUEMENT si pas déjà obtenu)
                if (!audioStream || audioStream.getAudioTracks().every(t => t.readyState === 'ended')) {
                    audioStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: false, // Désactivé pour capturer TOUS les sons
                            noiseSuppression: false, // Désactivé pour capturer TOUS les sons
                            autoGainControl: false
                        }
                    });
                }

                // Initialiser les nœuds audio
                microphone = audioCtx.createMediaStreamSource(audioStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.1;

                gainNode = audioCtx.createGain();
                gainNode.gain.value = 1.0;

                microphone.connect(analyser);
                analyser.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                frequencyArray = new Uint8Array(analyser.frequencyBinCount);
                timeArray = new Uint8Array(analyser.frequencyBinCount);

                // Initialiser l'enregistreur
                mediaRecorder = new MediaRecorder(audioStream);
                let recordedChunks = [];
                mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `rec-${Date.now()}.webm`;
                    a.click();
                    recordedChunks = [];
                    log("[ENREGISTREMENT] Fichier sauvegardé", "success");
                };

                hidePermissionMessage();
                return true;
            } catch (err) {
                log(`[ERREUR MICRO] ${err.message}`, "error");
                if (err.name === 'NotAllowedError' || err.message.includes('permission denied')) {
                    showPermissionMessage();
                }
                throw err;
            }
        }

        // ========== INITIALISATION DE L'IA VOCALE ==========
        async function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                throw new Error("Reconnaissance vocale non supportée. Utilisez Chrome.");
            }

            try {
                log("[IA] Initialisation de l'IA vocale...", "normal");

                if (recognition) {
                    recognition.stop();
                }

                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = config.voiceLanguage.split('-')[0];
                recognition.maxAlternatives = 1;

                let finalTranscript = '';

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript + ' ';
                            log(`[IA] 🎤 "${transcript}"`, "success");
                            speak(transcript);
                        } else {
                            interimTranscript += transcript;
                            log(`[IA] (En cours) "${interimTranscript}"`, "normal");
                        }
                    }
                };

                recognition.onerror = (event) => {
                    log(`[IA ERREUR] ${event.error}`, "error");
                    if (event.error === 'not-allowed') {
                        showPermissionMessage();
                    }
                };

                recognition.onstart = () => {
                    isListening = true;
                    log("[IA] Écoute activée", "success");
                    updateStatus();
                };

                recognition.onend = () => {
                    isListening = false;
                    updateStatus();
                    if (isVoiceEnabled) {
                        setTimeout(() => {
                            try { recognition.start(); } catch (e) {}
                        }, 1000);
                    }
                };

                recognition.start();
                isVoiceEnabled = true;
                return true;
            } catch (e) {
                throw new Error(`[IA ERREUR] ${e.message}`);
            }
        }

        // ========== BOUCLE PRINCIPALE ==========
        function loop() {
            if (!isRunning || !analyser) {
                requestAnimationFrame(loop);
                return;
            }

            analyser.getByteFrequencyData(frequencyArray);
            const rms = Math.sqrt(frequencyArray.reduce((a, b) => a + b * b, 0) / frequencyArray.length) / 128;

            // Afficher le niveau RMS
            const rmsEl = document.getElementById('rmsValue');
            if (rmsEl) rmsEl.textContent = `${rms.toFixed(2)} dB`;

            // Dessiner les visualisations
            drawSpectrogram();
            drawScope();

            requestAnimationFrame(loop);
        }

        // ========== DESSINS ==========
        function drawSpectrogram() {
            const canvas = document.getElementById('spectrogram');
            if (!canvas || !analyser) return;
            const ctx = canvas.getContext('2d');
            analyser.getByteFrequencyData(frequencyArray);
            spectroHistory.unshift([...frequencyArray]);
            if (spectroHistory.length > 80) spectroHistory.pop();

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width / frequencyArray.length;
            for (let y = 0; y < spectroHistory.length; y++) {
                for (let x = 0; x < spectroHistory[y].length; x++) {
                    const val = spectroHistory[y][x];
                    ctx.fillStyle = `hsl(${90 + val/2.5}, 100%, ${val/2.8}%)`;
                    ctx.fillRect(x * w, y * 2, w + 1, 2);
                }
            }
        }

        function drawScope() {
            const canvas = document.getElementById('scope');
            if (!canvas || !analyser) return;
            const ctx = canvas.getContext('2d');
            analyser.getByteTimeDomainData(timeArray);

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#00ff41';
            ctx.lineWidth = 2;
            ctx.beginPath();
            const slice = canvas.width / timeArray.length;
            for (let i = 0; i < timeArray.length; i++) {
                const y = (timeArray[i] / 128) * canvas.height / 2;
                i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * slice, y);
            }
            ctx.stroke();
        }

        // ========== GESTION DES BOUTONS ==========
        function setupButtons() {
            // Bouton LANCER
            document.getElementById('startBtn').addEventListener('click', () => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main').style.display = 'block';
                initAll().catch(err => {
                    log(`[ERREUR] ${err.message}`, "error");
                });
            });

            // Bouton PARAMÈTRES
            document.getElementById('btnSettings').addEventListener('click', () => {
                log("[INFO] Les paramètres fonctionnent. Pour le système, cliquez sur 'LANCER'.", "normal");
            });

            // Bouton AUTORISER LE MICRO
            document.getElementById('requestMicroBtn').addEventListener('click', () => {
                hidePermissionMessage();
                initMicro().then(() => {
                    log("[AUDIO] Micro autorisé !", "success");
                    // Maintenant initialiser l'IA vocale
                    initSpeech().then(() => {
                        log("[IA] IA vocale démarrée !", "success");
                        // Démarrer la boucle
                        if (!isRunning) {
                            isRunning = true;
                            requestAnimationFrame(loop);
                        }
                        updateStatus();
                    }).catch(err => {
                        log(`[IA ERREUR] ${err.message}`, "error");
                    });
                }).catch(err => {
                    log(`[AUDIO ERREUR] ${err.message}`, "error");
                    showPermissionMessage();
                });
            });

            // Bouton Voix
            document.getElementById('voiceToggle').addEventListener('click', () => {
                isVoiceEnabled = !isVoiceEnabled;
                if (isVoiceEnabled) {
                    initSpeech().catch(err => log(`[IA ERREUR] ${err.message}`, "error"));
                    document.getElementById('voiceToggle').style.background = '#ff0044';
                } else {
                    if (recognition) recognition.stop();
                    document.getElementById('voiceToggle').style.background = '#00ff41';
                }
                updateStatus();
            });
        }

        // ========== DÉMARRAGE ==========
        window.addEventListener('DOMContentLoaded', () => {
            log("SUPRA LAB v11 prêt. Cliquez sur 'LANCER TOUT LE SYSTÈME'.", "success");
            setupButtons();
        });

        window.addEventListener('beforeunload', () => {
            if (recognition) recognition.stop();
            if (audioStream) audioStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close().catch(() => {});
        });
    </script>
</body>
</html>
