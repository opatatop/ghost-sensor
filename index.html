<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUPRA v14 — NOTE 60 FULL</title>
<style>
:root{--bg:#000;--primary:#00ff41;--secondary:#ff00ff}
body{margin:0;background:var(--bg);color:var(--primary);font-family:'Courier New',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:70px;background:rgba(0,255,65,0.1);border-bottom:3px solid var(--primary);display:flex;justify-content:space-between;align-items:center;padding:0 15px}
.brand{font-size:1.35rem;font-weight:900;letter-spacing:5px}
#status{font-size:0.95rem;background:#111;padding:6px 14px;border:2px solid var(--primary);min-width:160px;text-align:center}
#apikey{display:flex;gap:8px;padding:8px;background:#111}
input{background:#000;border:1px solid #0f0;color:#0f0;padding:8px;width:100%}
canvas{display:block;width:100%;height:100%}
#terminal{height:160px;background:#000;border-top:3px solid var(--primary);padding:10px;overflow-y:auto;font-size:11px}
.log{margin:3px 0}
.log.ai{color:#ff00ff;text-shadow:0 0 8px #ff00ff}
button{background:#111;border:1px solid #0f0;color:#0f0;padding:10px;font-weight:bold;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;justify-content:center;align-items:center}
.modal-box{background:#111;border:3px solid var(--primary);width:94%;max-width:520px;padding:20px;max-height:85vh;overflow:auto}
</style>
</head>
<body>

<header>
<div class="brand">SUPRA v14 — NOTE 60</div>
<div id="status">EMF : 0.0 μT</div>
</header>

<div id="apikey">
<input type="password" id="keyinput" placeholder="Colle ta clé OpenAI ici">
<button onclick="saveKey()">SAUVEGARDER CLÉ</button>
<button onclick="openOptions()">⚙️ OPTIONS</button>
</div>

<div id="canvas-container"><canvas id="canvas"></canvas></div>
<div id="terminal"></div>

<div style="padding:12px;background:#111;display:flex;gap:8px;flex-wrap:wrap">
<button onclick="toggleRecording()">🎤 EVP</button>
<button onclick="manualScan()">SCAN FULL</button>
<button onclick="clearLogs()">EFFACER</button>
</div>

<!-- MODAL OPTIONS -->
<div id="options-modal" class="modal">
<div class="modal-box">
<h2 style="color:#0f0">OPTIONS COMPLETES</h2>
<div class="setting">
<label>Sensibilité EMF <span id="val-emf">45</span></label>
<input type="range" id="sens-emf" min="20" max="80" value="45" oninput="document.getElementById('val-emf').innerText=this.value">
</div>
<div class="setting">
<label>Seuil coups <span id="val-motion">9</span></label>
<input type="range" id="sens-motion" min="5" max="20" value="9" oninput="document.getElementById('val-motion').innerText=this.value">
</div>
<div class="setting">
<label>Vitesse IA <span id="val-rate">0.95</span></label>
<input type="range" id="voice-rate" min="0.7" max="1.3" step="0.05" value="0.95" oninput="document.getElementById('val-rate').innerText=this.value">
</div>
<div class="setting">
<label>Ton voix <span id="val-pitch">0.85</span></label>
<input type="range" id="voice-pitch" min="0.6" max="1.4" step="0.05" value="0.85" oninput="document.getElementById('val-pitch').innerText=this.value">
</div>
<button onclick="closeOptions()" style="width:100%;padding:12px;background:#ff00ff;color:#000;margin-top:15px">SAUVEGARDER & FERMER</button>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const log = (txt, type="") => {
  const t = $('terminal');
  const d = document.createElement('div');
  d.className = `log ${type}`;
  d.innerHTML = `[${new Date().toLocaleTimeString('fr-FR')}] ${txt}`;
  t.appendChild(d);
  t.scrollTop = t.scrollHeight;
  if(t.children.length > 90) t.removeChild(t.firstChild);
};

let apiKey = localStorage.getItem('supra_key') || "";
let stream, mediaRecorder, audioChunks = [], isRecording = false;
let analyser, dataArray;
let emfValue = 0, motionValue = 0, ghostIntensity = 0;
let sensEMF = 45, sensMotion = 9, voiceRate = 0.95, voicePitch = 0.85;

// Sauvegarde clé
function saveKey() {
  apiKey = $('keyinput').value.trim();
  if(apiKey) localStorage.setItem('supra_key', apiKey);
  log("Clé sauvegardée", "ai");
}

// Micro
async function initMicro() {
  stream = await navigator.mediaDevices.getUserMedia({audio:{sampleRate:48000}});
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const source = ctx.createMediaStreamSource(stream);
  analyser = ctx.createAnalyser(); analyser.fftSize = 4096;
  source.connect(analyser);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
}

// Tous les capteurs Note 60
if(window.DeviceOrientationEvent) window.addEventListener('deviceorientation', e => {
  emfValue = Math.hypot(e.alpha||0, e.beta||0, e.gamma||0) / 3;
  $('status').textContent = `EMF : ${emfValue.toFixed(1)} μT`;
  if(emfValue > sensEMF) triggerAI("EMF SPIKE DÉTECTÉ");
});

if(window.DeviceMotionEvent) window.addEventListener('devicemotion', e => {
  motionValue = Math.hypot(e.acceleration.x||0, e.acceleration.y||0, e.acceleration.z||0);
  if(motionValue > sensMotion) triggerAI("COUP VIOLENT");
});

if('AmbientLightSensor' in window) {
  new AmbientLightSensor().onreading = e => { if(e.illuminance < 8) triggerAI("CHUTE LUMIÈRE"); };
}

if(navigator.getBattery) navigator.getBattery().then(b => {
  b.onlevelchange = () => { if(b.level < 0.25) log("Batterie faible → énergie spirituelle basse"); };
});

navigator.geolocation.getCurrentPosition(p => log(`Zone : ${p.coords.latitude.toFixed(3)}`));

// IA qui parle
async function triggerAI(reason) {
  ghostIntensity = 120;
  log(`⚠️ ${reason} → IA activée`, "ai");

  if(!apiKey) { speak("Clé manquante. Mode local."); return; }

  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
    body:JSON.stringify({
      model:"gpt-4o-mini",
      messages:[{role:"system",content:"Tu es Supra Paranormal v14. Réponds en français, sombre, court et flippant."},
                {role:"user",content:`Détection : ${reason}. Parle-moi.`}]
    })
  });
  const data = await res.json();
  const reply = data.choices[0].message.content;
  log(`SUPRA : ${reply}`, "ai");
  speak(reply);
}

function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.rate = voiceRate; u.pitch = voicePitch;
  speechSynthesis.speak(u);
}

// Reconnaissance vocale complète
const rec = new (window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang='fr-FR'; rec.continuous=true;
rec.onresult = e => {
  const txt = e.results[e.results.length-1][0].transcript.toLowerCase();
  if(txt.includes('esprit')||txt.includes('supra')||txt.includes('réponds')||txt.includes('qui es là')||txt.includes('parle'))
    triggerAI("Commande vocale : " + txt);
};
rec.start();

// Visuel + orbes
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;} resize();
window.addEventListener('resize',resize);

function draw() {
  requestAnimationFrame(draw);
  ctx.fillStyle="rgba(0,0,0,0.16)"; ctx.fillRect(0,0,canvas.width,canvas.height);
  if(analyser){ analyser.getByteFrequencyData(dataArray);
    for(let i=0;i<80;i++){
      const h=(dataArray[i*10]||0)/255*canvas.height*0.8;
      ctx.fillStyle = h>canvas.height*0.6?'#ff00ff':'#00ff41';
      ctx.fillRect(i*(canvas.width/80),canvas.height-h,8,h);
    }
  }
  if(ghostIntensity>5){
    const cx=canvas.width/2,cy=canvas.height/2;
    ctx.shadowBlur=40; ctx.shadowColor='#ff00ff';
    for(let i=0;i<16;i++){
      const x=cx+Math.sin(Date.now()/250+i)*(80+ghostIntensity);
      ctx.fillStyle=`rgba(255,0,255,${ghostIntensity/200})`;
      ctx.fillRect(x-5,cy-15,13,13);
    }
    ghostIntensity*=0.92;
  }
}
draw();

// Fonctions boutons
function toggleRecording(){ /* même code que avant */ }
function manualScan(){ triggerAI("Scan manuel"); }
function clearLogs(){ $('terminal').innerHTML=''; }

function openOptions(){ $('options-modal').style.display='flex'; }
function closeOptions(){
  sensEMF = parseFloat(document.getElementById('sens-emf').value);
  sensMotion = parseFloat(document.getElementById('sens-motion').value);
  voiceRate = parseFloat(document.getElementById('voice-rate').value);
  voicePitch = parseFloat(document.getElementById('voice-pitch').value);
  $('options-modal').style.display='none';
  log("Options mises à jour");
}

initMicro();
log("SUPRA v14 FULL prête sur ton Realme Note 60");
log("Toutes détections + IA parlante + options activées");
</script>
</body>
</html>
