<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUPRA LAB - TOUT FONCTIONNE</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background: #000;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            touch-action: manipulation;
        }
        #app {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #001100;
            color: #00ff41;
            border: 2px solid #00ff41;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #00ff41;
            color: #000;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #visualizer {
            width: 100%;
            height: 150px;
            background: #000;
            margin: 10px 0;
            display: block;
        }
        #log {
            height: 180px;
            overflow-y: auto;
            background: #001100;
            border: 1px solid #00ff41;
            padding: 10px;
            margin: 10px 0;
            font-size: 14px;
            line-height: 1.4;
        }
        .log-line {
            margin: 3px 0;
            word-break: break-word;
        }
        .log-line::before {
            content: "> ";
            color: #00cc33;
        }
        .log-line.important {
            color: #ff0044;
        }
        .status {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 14px;
        }
        .indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 8px;
        }
        .indicator.ready {
            background: #00ff41;
        }
        .indicator.error {
            background: #ff0044;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>🎤 SUPRA LAB - TOUT FONCTIONNE</h1>

        <!-- Étape 1: Initialiser le micro -->
        <button id="initMicroBtn">1️⃣ Initialiser le Micro</button>
        <div class="status">
            <span>Micro:</span>
            <span class="indicator" id="microIndicator"></span>
        </div>

        <!-- Étape 2: Initialiser l'IA vocale -->
        <button id="initSpeechBtn" disabled>2️⃣ Initialiser l'IA Vocale</button>
        <div class="status">
            <span>IA Vocale:</span>
            <span class="indicator" id="voiceIndicator"></span>
        </div>

        <!-- Étape 3: Tout lancer -->
        <button id="startAllBtn" disabled>3️⃣ TOUT LANCER (Écoute + Voix)</button>

        <!-- Visualiseur -->
        <div>
            <div>Visualiseur sonore:</div>
            <canvas id="visualizer"></canvas>
            <div>Niveau: <span id="volumeLevel">--</span> dB</div>
        </div>

        <!-- Log -->
        <div>
            <div>LOG (TOUT ce qui est capté):</div>
            <div id="log"></div>
        </div>
    </div>

    <script>
        // ========== VARIABLES GLOBALES ==========
        let audioCtx = null;
        let analyser = null;
        let microphone = null;
        let frequencyData = null;
        let isMicroReady = false;
        let isSpeechReady = false;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let lastSoundTime = 0;
        let animationId = null;

        // ========== CONFIG ==========
        const config = {
            noiseThreshold: 30,  // Seuil en valeur brute (0-255)
            voiceRate: 1.0,
            voiceVolume: 1.0,
            voiceLanguage: 'fr-FR'
        };

        // ========== FONCTIONS DE BASE ==========
        function log(message, type = "normal") {
            const logDiv = document.getElementById('log');
            if (!logDiv) return;

            const line = document.createElement('div');
            line.className = `log-line ${type === 'error' ? 'important' : ''}`;
            line.innerHTML = `<span style="color: #00cc33;">[${new Date().toLocaleTimeString('fr-FR')}]</span> ${message}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;

            if (logDiv.children.length > 50) {
                logDiv.removeChild(logDiv.children[0]);
            }
        }

        // ========== SYNTHÈSE VOCALE ==========
        function speak(text) {
            if (!synthesis) {
                log("Synthèse vocale non disponible.", "error");
                return;
            }

            try {
                synthesis.cancel(); // Annuler toute lecture en cours

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = config.voiceLanguage;
                utterance.rate = config.voiceRate;
                utterance.volume = config.voiceVolume;

                // Choisir la meilleure voix française
                const voices = synthesis.getVoices();
                const frenchVoice = voices.find(v => v.lang.includes('fr')) || voices[0];
                if (frenchVoice) {
                    utterance.voice = frenchVoice;
                }

                utterance.onerror = (e) => {
                    log(`Erreur voix: ${e.error}`, "error");
                };

                synthesis.speak(utterance);
                log(`[VOIX] "${text}"`, "normal");
            } catch (e) {
                log(`Erreur synthèse: ${e.message}`, "error");
            }
        }

        // ========== INITIALISATION DU MICRO ==========
        async function initMicro() {
            try {
                log("Initialisation du micro...", "normal");

                // Fermer l'ancien contexte
                if (audioCtx) {
                    await audioCtx.close().catch(() => {});
                }

                // Créer un nouveau contexte
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                await audioCtx.resume();

                // Demander le micro (TOUS LES SONS)
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });

                // Créer les nœuds audio
                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.1;

                microphone.connect(analyser);

                frequencyData = new Uint8Array(analyser.frequencyBinCount);

                // Démarrer le visualiseur
                startVisualizer();

                isMicroReady = true;
                document.getElementById('microIndicator').className = 'indicator ready';
                document.getElementById('initSpeechBtn').disabled = false;
                log("✅ Micro prêt !", "success");

                return true;
            } catch (error) {
                log(`❌ Erreur micro: ${error.message}`, "error");
                document.getElementById('microIndicator').className = 'indicator error';
                return false;
            }
        }

        // ========== VISUALISEUR + DÉTECTION DE SONS ==========
        function startVisualizer() {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }

            const canvas = document.getElementById('visualizer');
            const ctx = canvas.getContext('2d');

            function draw() {
                if (!analyser) {
                    animationId = requestAnimationFrame(draw);
                    return;
                }

                analyser.getByteFrequencyData(frequencyData);

                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const barWidth = (canvas.width / frequencyData.length) * 2.5;
                let x = 0;

                for (let i = 0; i < frequencyData.length; i++) {
                    const barHeight = frequencyData[i] / 2;
                    ctx.fillStyle = `hsl(${i * 2}, 100%, 50%)`;
                    ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }

                // Calculer le niveau sonore moyen
                const average = frequencyData.reduce((a, b) => a + b, 0) / frequencyData.length;
                document.getElementById('volumeLevel').textContent = `${Math.round(average)}`;

                // Détecter les sons forts
                if (average > config.noiseThreshold) {
                    const now = Date.now();
                    if (now - lastSoundTime > 2000) { // Éviter les répétitions
                        lastSoundTime = now;
                        log(`[BRUIT] Niveau sonore élevé: ${Math.round(average)}`, "important");
                        speak(`Bruit détecté !`);
                    }
                }

                animationId = requestAnimationFrame(draw);
            }

            draw();
        }

        // ========== INITIALISATION DE L'IA VOCALE ==========
        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                log("❌ Reconnaissance vocale non supportée. Utilise Chrome.", "error");
                return false;
            }

            try {
                log("Initialisation de l'IA vocale...", "normal");

                if (recognition) {
                    recognition.stop();
                }

                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = config.voiceLanguage.split('-')[0];
                recognition.maxAlternatives = 1;

                let finalTranscript = '';

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript + ' ';
                            log(`[PAROLE] "${transcript}"`, "normal");
                            speak(transcript); // Lire TOUT ce qui est dit
                        } else {
                            interimTranscript += transcript;
                            log(`[FRAGMENT] "${interimTranscript}"`, "normal");
                        }
                    }
                };

                recognition.onerror = (event) => {
                    log(`❌ Erreur IA vocale: ${event.error}`, "error");
                };

                recognition.onstart = () => {
                    log("✅ IA vocale démarrée. TOUT est capté.", "success");
                    document.getElementById('voiceIndicator').className = 'indicator ready';
                    document.getElementById('startAllBtn').disabled = false;
                };

                recognition.onend = () => {
                    if (isSpeechReady) {
                        setTimeout(() => {
                            try { recognition.start(); } catch (e) {}
                        }, 1000);
                    }
                };

                recognition.start();
                isSpeechReady = true;
                log("✅ IA vocale prête !", "success");
                return true;
            } catch (e) {
                log(`❌ Erreur IA vocale: ${e.message}`, "error");
                document.getElementById('voiceIndicator').className = 'indicator error';
                return false;
            }
        }

        // ========== TOUT LANCER ==========
        function startAll() {
            log("Démarrage complet...", "normal");
            speak("Système lancé. Je capte TOUT et je lis TOUT à voix haute.");
        }

        // ========== BOUTONS ==========
        document.getElementById('initMicroBtn').addEventListener('click', initMicro);
        document.getElementById('initSpeechBtn').addEventListener('click', () => {
            initSpeech();
        });
        document.getElementById('startAllBtn').addEventListener('click', startAll);

        // Message initial
        log("SUPRA LAB - TOUT FONCTIONNE");
        log("1. Cliquez sur 'Initialiser le Micro'");
        log("2. Cliquez sur 'Initialiser l'IA Vocale'");
        log("3. Cliquez sur 'TOUT LANCER'");
        log("Parlez, claquez, sifflez... TOUT sera capté et lu !");
    </script>
</body>
</html>
