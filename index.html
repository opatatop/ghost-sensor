<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST BOUTONS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #00ff41;
            text-align: center;
            padding: 20px;
        }
        button {
            background: #001100;
            color: #00ff41;
            border: 2px solid #00ff41;
            padding: 15px 30px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #00ff41;
            color: #000;
        }
        #log {
            background: #001100;
            border: 1px solid #00ff41;
            padding: 10px;
            margin: 20px;
            height: 200px;
            overflow-y: auto;
            text-align: left;
        }
        .log-line {
            color: #00ff41;
            margin: 5px 0;
        }
        .error {
            color: #ff0044;
        }
    </style>
</head>
<body>
    <h1>TEST DES BOUTONS</h1>
    <p>Cliquez sur les boutons pour vérifier si le JavaScript fonctionne.</p>

    <button id="btn1">BOUTON 1</button>
    <button id="btn2">BOUTON 2</button>
    <button id="btn3">BOUTON 3</button>

    <div id="log"></div>

    <script>
        // Fonction pour afficher des logs
        function log(message, isError = false) {
            const logDiv = document.getElementById('log');
            const line = document.createElement('div');
            line.className = `log-line ${isError ? 'error' : ''}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Vérifier si le DOM est chargé
        window.addEventListener('DOMContentLoaded', () => {
            log("✅ DOM chargé. JavaScript fonctionne !");

            // Attacher les écouteurs DIRECTEMENT
            document.getElementById('btn1').addEventListener('click', () => {
                log("✅ Bouton 1 cliqué !");
            });

            document.getElementById('btn2').addEventListener('click', () => {
                log("✅ Bouton 2 cliqué !");
            });

            document.getElementById('btn3').addEventListener('click', () => {
                log("✅ Bouton 3 cliqué !");
            });
        });

        // Si DOMContentLoaded ne se déclenche pas
        window.onload = () => {
            log("⚠️ DOMContentLoaded ne s'est pas déclenché. Utilisation de onload.");
        };
    </script>
</body>
</html>
