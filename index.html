<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUPRA ETERNITY v30.5 — DEBUG MIC ⚡</title>
    <style>
        :root { 
            --primary: #00ffff; --secondary: #bc13fe; --bg: #050510; --panel: #0a0a20; 
            --text: #e0e0ff; --danger: #ff3333; --accent: #00ff88; --evp: #ffaa00; 
            --ghost: #ff3333;
        }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            margin:0; padding:0; font-family:'Courier New',monospace; background:var(--bg); 
            color:var(--text); display:flex; flex-direction:column; height:100vh; overflow:hidden;
        }
        
        /* HEADER */
        header { background:#000; border-bottom:3px solid var(--primary); padding:10px 15px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 0 25px rgba(0,255,255,0.5); z-index:50; }
        h1 { font-size:1rem; color:var(--primary); text-shadow:0 0 10px var(--primary); letter-spacing:2px; margin:0; line-height:1.2; }
        .version { font-size:0.7em; color:var(--secondary); display:block; }

        /* MAIN VISUALIZER */
        main { flex:1; position:relative; display:flex; flex-direction:column; }
        #visualizer { flex:1; background:#000; position:relative; overflow:hidden; }
        canvas { width:100%; height:100%; display:block; }

        /* OVERLAYS */
        #displayOverlay { position:absolute; top:20%; left:50%; transform:translateX(-50%); text-align:center; pointer-events:none; z-index:30; width:90%; }
        #mainText { font-size:1.8rem; font-weight:900; color:#fff; background:rgba(0,0,0,0.8); padding:10px 20px; border:2px solid var(--primary); text-transform:uppercase; text-shadow:0 0 10px var(--primary); margin-bottom:5px; backdrop-filter:blur(4px); }
        
        /* LE TEXTE EN DIRECT (NOUVEAU) */
        #liveTranscript { 
            font-size:1.2rem; color:var(--accent); font-weight:bold; background:rgba(0,0,0,0.6); 
            padding:5px 10px; border-radius:4px; min-height:30px; margin-top:5px; 
            border: 1px dashed var(--accent);
        }

        #evpStatus { position:absolute; top:15px; left:15px; color:var(--evp); font-size:0.75rem; font-weight:bold; border:1px solid var(--evp); padding:4px 8px; border-radius:4px; background:rgba(0,0,0,0.7); display:none; animation: pulse 1s infinite; }
        #micStatus { position:absolute; top:15px; left:50%; transform:translateX(-50%); color:#fff; font-size:0.75rem; font-weight:bold; border:1px solid #fff; padding:4px 8px; border-radius:4px; background:rgba(0,50,0,0.8); display:none; }
        #micStatus.listening { background:rgba(0,100,0,0.9); border-color:#0f0; }
        #micStatus.processing { background:rgba(100,50,0,0.9); border-color:orange; }
        #micStatus.error { background:rgba(100,0,0,0.9); border-color:red; }

        #spiritStatus { position:absolute; top:15px; right:15px; color:var(--ghost); font-size:0.85rem; font-weight:bold; border:2px solid var(--ghost); padding:4px 10px; border-radius:4px; background:rgba(50,0,0,0.8); display:none; text-shadow:0 0 5px red; animation: scanline 2s linear infinite; }

        @keyframes pulse { 0% { opacity:0.6; } 50% { opacity:1; box-shadow:0 0 10px var(--evp); } 100% { opacity:0.6; } }
        @keyframes scanline { 0% { background:rgba(50,0,0,0.8); } 50% { background:rgba(100,0,0,0.9); } 100% { background:rgba(50,0,0,0.8); } }

        #hud { position:absolute; bottom:15px; right:15px; background:rgba(0,0,0,0.85); padding:8px 12px; border:1px solid var(--accent); font-size:0.75rem; line-height:1.5; color:var(--accent); z-index:25; border-radius:4px; text-align:right; min-width:120px; }

        /* CONTROLS GRID */
        #actionGrid { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; padding:10px; background:var(--panel); border-top:1px solid #333; }
        .grid-btn { background:#111; border:1px solid #444; color:#aaa; padding:10px 2px; border-radius:4px; text-align:center; font-size:0.65rem; cursor:pointer; transition:all 0.2s; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
        .grid-btn span:first-child { font-size:1.2rem; }
        .grid-btn.active-state { background:var(--secondary); color:#fff; border-color:#fff; box-shadow:0 0 15px var(--secondary); font-weight:bold; }
        .grid-btn.active-evp { background:var(--evp); color:#000; border-color:#fff; box-shadow:0 0 15px var(--evp); font-weight:bold; }
        .grid-btn.active-ghost { background:var(--ghost); color:#fff; border-color:#fff; box-shadow:0 0 20px red; font-weight:bold; animation: pulse 1s infinite; }

        /* MAIN BUTTONS */
        #controls { background:var(--panel); padding:10px; display:grid; gap:8px; border-top:1px solid #222; }
        button { background:#0a0a0a; border:1px solid var(--primary); color:var(--primary); padding:12px; font-size:0.85rem; font-weight:bold; cursor:pointer; text-transform:uppercase; border-radius:4px; transition:all 0.15s; }
        button:active { transform:scale(0.96); }
        button.active-mode { background:var(--primary); color:#000; box-shadow:0 0 20px var(--primary); }
        button.danger { border-color:var(--danger); color:var(--danger); }
        button:disabled { opacity:0.3; cursor:not-allowed; filter:grayscale(1); }

        /* TERMINAL */
        #terminal { height:90px; background:#000; border-top:1px solid #333; padding:8px; font-size:0.65rem; overflow-y:auto; color:#888; line-height:1.3; font-family:'Courier New', monospace; }
        .log-line { margin-bottom:2px; border-left:2px solid #555; padding-left:6px; word-break:break-all; }
        .log-sys { border-color:#666; color:#aaa; }
        .log-ai { border-color:var(--secondary); color:var(--secondary); background:rgba(40,0,40,0.3); }
        .log-entity { border-color:#ff00ff; color:#ff00ff; font-weight:bold; }
        .log-evp { border-color:var(--evp); color:var(--evp); font-style:italic; }
        .log-ghost { border-color:var(--ghost); color:var(--ghost); font-weight:bold; }

        /* MODAL */
        #settingsModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:300; align-items:center; justify-content:center; backdrop-filter:blur(5px); }
        .modal-content { width:92%; max-width:500px; background:#111; border:2px solid var(--secondary); border-radius:8px; padding:20px; box-shadow:0 0 40px rgba(188,19,254,0.3); max-height:90vh; overflow-y:auto; }
        .setting-row { display:flex; justify-content:space-between; align-items:center; margin:12px 0; border-bottom:1px solid #222; padding-bottom:8px; }
        label { font-size:0.85rem; color:#ccc; }
        input[type=range] { accent-color:var(--secondary); width:50%; }
        input[type=password] { background:#222; border:1px solid #444; color:#fff; padding:5px; width:55%; border-radius:3px; }
        .close-btn { float:right; font-size:1.8rem; color:var(--danger); cursor:pointer; line-height:1; }

        /* EVP & GHOST Visualizers */
        #evpWaveform, #ghostWaveform { height:40px; background:#000; width:100%; display:none; margin-top:5px; border:1px solid var(--evp); }
        #ghostWaveform { border-color:var(--ghost); }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>SUPRA ETERNITY <span class="version">v30.5 DEBUG</span></h1>
        </div>
        <button onclick="App.toggleSettings()" style="background:none;border:1px solid var(--secondary);color:var(--secondary);width:36px;height:36px;border-radius:50%;font-size:1.2rem;">⚙️</button>
    </header>

    <main>
        <div id="visualizer">
            <canvas id="scopeCanvas"></canvas>
            
            <div id="evpStatus">🔴 EVP REC</div>
            <div id="micStatus" class="listening">🎤 MIKRO ACTIF</div>
            <div id="spiritStatus">📻 GHOST BOX</div>
            
            <div id="displayOverlay">
                <div id="mainText">EN ATTENTE</div>
                <!-- C'est ici que vous verrez ce que vous dites en direct -->
                <div id="liveTranscript">...</div>
            </div>
            
            <div id="hud">
                EMF: <span id="valEmf">0.0</span> μT<br>
                MAG: <span id="valMag">0</span>°<br>
                VOL: <span id="valAudio">--</span>
            </div>
        </div>
        <canvas id="evpWaveform"></canvas>
        <canvas id="ghostWaveform"></canvas>
    </main>

    <div id="actionGrid">
        <div class="grid-btn" onclick="App.toggleSettings()"><span>⚙️</span>RÉGLAGES</div>
        <div class="grid-btn" id="btnEMF" onclick="FeatureEngine.toggleEMF()"><span>📡</span>EMF/MAG</div>
        <div class="grid-btn" id="btnVAD" onclick="FeatureEngine.toggleVAD()"><span>🎤</span>VOIX IA</div>
        <div class="grid-btn" id="btnGhostBox" onclick="SpiritBox.toggle()"><span>📻</span>RADIO GHOST</div>
        <div class="grid-btn active-evp" id="btnEVP" onclick="FeatureEngine.toggleEVP()"><span>📼</span>EVP LIVE</div>
        <div class="grid-btn" id="btnRecord" onclick="FeatureEngine.toggleAutoRecord()"><span>💾</span>AUTO-REC</div>
        <div class="grid-btn" id="btnPower" onclick="FeatureEngine.togglePower()"><span>⚡</span>ZEUS MODE</div>
        <div class="grid-btn" onclick="App.clearLog()"><span>🗑️</span>CLEAR</div>
    </div>

    <div id="controls">
        <button class="active-mode" id="btnMainStart" onclick="App.startFullSystem()">DÉMARRER SYSTÈME COMPLET</button>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <button onclick="App.replayLastEVP()">⏪ REJOUER EVP</button>
            <button class="danger" onclick="App.stopSystem()">ARRÊT TOTAL</button>
        </div>
    </div>

    <div id="terminal"></div>

    <div id="settingsModal">
        <div class="modal-content">
            <span class="close-btn" onclick="App.toggleSettings()">×</span>
            <h2 style="color:var(--primary);margin-top:0;">CONFIGURATION v30.5</h2>
            
            <h3 style="color:var(--secondary);font-size:0.9rem;border-bottom:1px solid #333;padding-bottom:5px;">IA (OPTIONNEL)</h3>
            <div class="setting-row">
                <label>Clé API (OpenAI/xAI)</label>
                <input type="password" id="keyinput" placeholder="sk-...">
            </div>
            <div style="text-align:right; margin-bottom:15px;">
                <button onclick="App.saveKey()" style="padding:6px 12px; font-size:0.8rem;">SAUVEGARDER CLÉ</button>
            </div>

            <h3 style="color:var(--ghost);font-size:0.9rem;border-bottom:1px solid #333;padding-bottom:5px;">RADIO & CAPTEURS</h3>
            <div class="setting-row">
                <label>Vitesse Balayage</label>
                <input type="range" id="sweepSpeed" min="10" max="100" step="5" value="40" oninput="Config.update(this)">
            </div>
            <div class="setting-row">
                <label>Seuil EMF (μT)</label>
                <input type="range" id="emfSensitivity" min="10" max="90" step="5" value="40" oninput="Config.update(this)">
            </div>
            <div class="setting-row">
                <label>Filtre EVP (Grave)</label>
                <input type="range" id="evpFilter" min="100" max="1000" step="50" value="400" oninput="Config.update(this)">
            </div>

            <button style="width:100%;margin-top:20px;" onclick="App.toggleSettings()">FERMER</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const Config = {
            data: { sweepSpeed: 40, emfSensitivity: 40, evpFilter: 400 },
            load() { 
                const saved = localStorage.getItem('supra_v30_5'); 
                if (saved) Object.assign(this.data, JSON.parse(saved)); 
                document.getElementById('sweepSpeed').value = this.data.sweepSpeed;
                document.getElementById('emfSensitivity').value = this.data.emfSensitivity;
                document.getElementById('evpFilter').value = this.data.evpFilter;
                document.getElementById('keyinput').value = localStorage.getItem('supra_api_key') || "";
            },
            save() { localStorage.setItem('supra_v30_5', JSON.stringify(this.data)); },
            update(el) { this.data[el.id] = parseFloat(el.value); this.save(); }
        };

        let apiKey = localStorage.getItem('supra_api_key') || "";
        let lastTrigger = 0;
        let isSystemRunning = false;
        
        // --- 2. MOTEUR AUDIO PRINCIPAL (MICRO) ---
        const AudioEngine = {
            ctx: null,
            analyser: null,
            stream: null,
            microphone: null,
            dataArray: null,
            
            async init() {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();

                    if (this.ctx.state === 'suspended') {
                        await this.ctx.resume();
                    }

                    const constraints = {
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false, channelCount: 1 }
                    };

                    App.log("🔍 Accès micro en cours...", "sys");
                    this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    
                    this.microphone = this.ctx.createMediaStreamSource(this.stream);
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 2048; 
                    this.microphone.connect(this.analyser);
                    
                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                    
                    App.log("✅ Micro OK", "sys");
                    
                    EVPRecorder.init(this.ctx, this.stream);
                    return true;

                } catch(e) {
                    console.error(e);
                    App.log("❌ ERREUR MICRO: " + e.message, "sys");
                    alert("Erreur Micro ! Vérifiez les permissions.");
                    return false;
                }
            },
            getVolume() {
                if(!this.analyser) return 0;
                this.analyser.getByteFrequencyData(this.dataArray);
                let sum = 0;
                for(let i=0; i<this.dataArray.length; i++) sum += this.dataArray[i];
                return sum / this.dataArray.length;
            },
            stop() {
                if(this.stream) this.stream.getTracks().forEach(t => t.stop());
                if(this.ctx) this.ctx.close();
                EVPRecorder.stop();
                SpiritBox.stop();
            }
        };

        // --- 3. MOTEUR SPIRIT BOX ---
        const SpiritBox = {
            node: null,
            gain: null,
            filter: null,
            isActive: false,
            currentFreq: 200,
            direction: 1,
            animationFrame: null,

            init(ctx) {
                if(!ctx) return;
                const bufferSize = 2 * ctx.sampleRate;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                this.node = ctx.createBufferSource();
                this.node.buffer = buffer;
                this.node.loop = true;

                this.filter = ctx.createBiquadFilter();
                this.filter.type = 'bandpass';
                this.filter.frequency.value = this.currentFreq;
                this.filter.Q.value = 1;

                this.gain = ctx.createGain();
                this.gain.gain.value = 0.4;

                this.node.connect(this.filter);
                this.filter.connect(this.gain);
            },

            toggle() {
                if (this.isActive) this.stop();
                else this.start();
            },

            start() {
                if (!AudioEngine.ctx) return;
                if (!this.node) this.init(AudioEngine.ctx);
                
                this.isActive = true;
                this.node.start(0);
                this.gain.connect(AudioEngine.ctx.destination);
                
                document.getElementById('btnGhostBox').classList.add('active-ghost');
                document.getElementById('spiritStatus').style.display = 'block';
                document.getElementById('ghostWaveform').style.display = 'block';
                
                App.log("📻 Ghost Box ON", "ghost");
                this.sweep();
            },

            stop() {
                this.isActive = false;
                if (this.node) {
                    try { this.node.stop(); } catch(e){}
                    this.gain.disconnect();
                }
                cancelAnimationFrame(this.animationFrame);
                document.getElementById('btnGhostBox').classList.remove('active-ghost');
                document.getElementById('spiritStatus').style.display = 'none';
                document.getElementById('ghostWaveform').style.display = 'none';
            },

            sweep() {
                if (!this.isActive) return;
                const speed = Config.data.sweepSpeed * 5; 
                this.currentFreq += (this.direction * speed);
                if (this.currentFreq > 4000) this.direction = -1;
                else if (this.currentFreq < 200) this.direction = 1;
                this.filter.frequency.setTargetAtTime(this.currentFreq, AudioEngine.ctx.currentTime, 0.05);
                this.animationFrame = requestAnimationFrame(() => this.sweep());
            }
        };

        // --- 4. MOTEUR EVP ---
        const EVPRecorder = {
            mediaRecorder: null,
            audioChunks: [],
            audioContext: null,
            isRecording: false,

            init(ctx, stream) {
                this.audioContext = ctx;
                try {
                    this.mediaRecorder = new MediaRecorder(stream);
                    this.mediaRecorder.ondataavailable = (e) => { this.audioChunks = [e.data]; };
                    this.start();
                } catch(e) { App.log("⚠️ EVP Erreur", "sys"); }
            },

            start() {
                if(this.mediaRecorder && this.mediaRecorder.state === "inactive") {
                    this.mediaRecorder.start(5000);
                    this.isRecording = true;
                    document.getElementById('evpStatus').style.display = 'block';
                    document.getElementById('evpWaveform').style.display = 'block';
                }
            },

            stop() {
                if(this.mediaRecorder && this.mediaRecorder.state !== "inactive") {
                    this.mediaRecorder.stop();
                    this.isRecording = false;
                    document.getElementById('evpStatus').style.display = 'none';
                }
            },

            async playLastCapture() {
                if(this.audioChunks.length === 0) return;
                App.log("📻 Relecture EVP...", "evp");
                const blob = new Blob(this.audioChunks, { type: 'audio/webm' });
                const arrayBuffer = await blob.arrayBuffer();
                const audioBuffer = await this.audioContext.decodeAudioData(arrayBuffer);
                const source = this.audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.playbackRate.value = 0.85;
                const filter = this.audioContext.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = Config.data.evpFilter;
                const gain = this.audioContext.createGain();
                gain.gain.value = 1.5;
                source.connect(filter);
                filter.connect(gain);
                gain.connect(this.audioContext.destination);
                source.start(0);
                document.getElementById('mainText').innerText = "REPLAY EVP";
                document.getElementById('mainText').style.color = "var(--evp)";
                source.onended = () => {
                    document.getElementById('mainText').innerText = "SURVEILLANCE";
                    document.getElementById('mainText').style.color = "#fff";
                };
            }
        };

        // --- 5. VISUALISATION ---
        const VisualEngine = {
            canvas: null,
            ctx: null,
            evpCanvas: null,
            evpCtx: null,
            ghostCanvas: null,
            ghostCtx: null,
            init() {
                this.canvas = document.getElementById('scopeCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.evpCanvas = document.getElementById('evpWaveform');
                this.evpCtx = this.evpCanvas.getContext('2d');
                this.ghostCanvas = document.getElementById('ghostWaveform');
                this.ghostCtx = this.ghostCanvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.loop();
            },
            resize() {
                this.canvas.width = this.canvas.parentElement.clientWidth;
                this.canvas.height = this.canvas.parentElement.clientHeight;
                this.evpCanvas.width = this.evpCanvas.parentElement.clientWidth;
                this.evpCanvas.height = 40;
                this.ghostCanvas.width = this.ghostCanvas.parentElement.clientWidth;
                this.ghostCanvas.height = 40;
            },
            loop() {
                if(!isSystemRunning) return;
                requestAnimationFrame(() => this.loop());
                const w = this.canvas.width;
                const h = this.canvas.height;
                this.ctx.fillStyle = 'rgba(5, 5, 16, 0.2)';
                this.ctx.fillRect(0, 0, w, h);

                if (AudioEngine.dataArray) {
                    const data = AudioEngine.dataArray;
                    const barWidth = (w / data.length) * 2.5;
                    let x = 0;
                    for (let i = 0; i < data.length; i++) {
                        const barHeight = (data[i] / 255) * h * 0.9;
                        this.ctx.fillStyle = `rgb(${barHeight+50},${250*(i/data.length)},255)`;
                        this.ctx.fillRect(x, h - barHeight, barWidth, barHeight);
                        x += barWidth + 1;
                    }
                }

                if(SpiritBox.isActive) {
                    const gw = this.ghostCanvas.width;
                    const gh = this.ghostCanvas.height;
                    this.ghostCtx.fillStyle = 'rgba(0,0,0,0.1)';
                    this.ghostCtx.fillRect(0,0,gw,gh);
                    const freqRatio = (SpiritBox.currentFreq - 200) / 3800;
                    const xPos = freqRatio * gw;
                    this.ghostCtx.fillStyle = '#ff3333';
                    this.ghostCtx.fillRect(xPos, 0, 10, gh);
                }

                if(Math.random() > 0.8) { 
                    const vol = Math.round(AudioEngine.getVolume());
                    document.getElementById('valAudio').innerText = vol > 30 ? vol : "--";
                }
            }
        };

        // --- 6. CERVEAU & VOIX (DEBUG MODE) ---
        const BrainEngine = {
            recognition: null,
            isListening: false,
            
            speak(text) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.rate = 0.9; u.pitch = 0.6; u.volume = 1.0;
                window.speechSynthesis.speak(u);
            },

            initVoice() {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    App.log("❌ Navigateur incompatible voix", "sys");
                    return;
                }
                
                // On recrée l'objet à chaque fois pour être sûr
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                this.recognition = new SR();
                this.recognition.lang = 'fr-FR';
                this.recognition.continuous = true;
                this.recognition.interimResults = true; // IMPORTANT : Affiche le texte pendant qu'on parle

                this.recognition.onstart = () => {
                    this.isListening = true;
                    const status = document.getElementById('micStatus');
                    status.style.display = 'block';
                    status.className = 'listening';
                    status.innerText = "🎤 MIKRO ÉCOUTE...";
                };

                this.recognition.onend = () => {
                    this.isListening = false;
                    const status = document.getElementById('micStatus');
                    if (isSystemRunning && FeatureEngine.vadActive) {
                        status.className = 'processing';
                        status.innerText = "⏳ RELANCE...";
                        setTimeout(() => { 
                            if(FeatureEngine.vadActive && isSystemRunning) {
                                try { this.recognition.start(); } 
                                catch(e) { App.log("⚠️ Relance mic échouée", "sys"); }
                            }
                        }, 1000);
                    } else {
                        status.style.display = 'none';
                    }
                };

                this.recognition.onerror = (e) => {
                    const status = document.getElementById('micStatus');
                    status.className = 'error';
                    status.innerText = "❌ ERREUR MIC";
                    if(e.error === 'not-allowed') App.log("❌ Permissions refusées", "sys");
                };

                this.recognition.onresult = (e) => {
                    // Récupérer le dernier résultat
                    const result = e.results[e.results.length-1];
                    const transcript = result[0].transcript;
                    
                    // Afficher en direct dans la case verte
                    document.getElementById('liveTranscript').innerText = transcript;

                    // Si la phrase est finie (isFinal = true)
                    if (result.isFinal) {
                        const conf = Math.round(result[0].confidence * 100);
                        App.log(`VOIX DITE : "${transcript}" (${conf}%)`, "entity");
                        
                        // Déclencher l'IA et l'EVP
                        App.handleDetection("VOIX", transcript);
                        EVPRecorder.playLastCapture();
                        
                        // Nettoyer l'affichage après un délai
                        setTimeout(() => {
                            if(document.getElementById('liveTranscript').innerText === transcript) {
                                document.getElementById('liveTranscript').innerText = "...";
                            }
                        }, 3000);
                    }
                };

                try {
                    this.recognition.start();
                } catch(e) {
                    App.log("⚠️ Départ mic impossible", "sys");
                }
            }
        };

        async function triggerAI(reason, contextText = "") {
            if (Date.now() - lastTrigger < 5000) return; // Cooldown réduit pour tests
            lastTrigger = Date.now();

            const display = document.getElementById('mainText');
            display.innerText = "CONNEXION IA...";
            display.style.color = "var(--secondary)";

            let reply = "";

            if (apiKey) {
                try {
                    App.log("🧠 Envoi IA...", "ai");
                    const response = await fetch("https://api.openai.com/v1/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                        body: JSON.stringify({
                            model: "gpt-3.5-turbo",
                            messages: [
                                { role: "system", content: "Tu es ZEUS, une IA sinistre. Réponds en moins de 25 mots." },
                                { role: "user", content: `Détection : ${reason}. Analyse.` }
                            ],
                            max_tokens: 60, temperature: 0.9
                        })
                    });
                    if (!response.ok) throw new Error("Erreur API");
                    const data = await response.json();
                    reply = data.choices[0].message.content;
                } catch (error) {
                    App.log(`❌ Erreur IA: ${error.message}`, "ai");
                    reply = "Connexion spirituelle instable.";
                }
            } else {
                const responses = ["Je sens une présence.", "Signal perturbé.", "Qui est là ?", "Fréquences anormales."];
                reply = responses[Math.floor(Math.random() * responses.length)];
                App.log("⚠️ Mode Simulation", "ai");
            }

            App.log(`ZEUS : ${reply}`, "ai");
            BrainEngine.speak(reply);
            display.innerText = reply.toUpperCase();
            setTimeout(() => { display.innerText = "SURVEILLANCE"; display.style.color = "#fff"; }, 4000);
        }

        // --- 7. FONCTIONS ---
        const FeatureEngine = {
            emfActive: true,
            vadActive: true,
            ghostActive: true,
            autoRecordActive: true,
            powerMode: true,
            evpActive: true,

            toggleEMF() { 
                this.emfActive = !this.emfActive; 
                document.getElementById('btnEMF').classList.toggle('active-state', this.emfActive); 
            },
            toggleVAD() { 
                this.vadActive = !this.vadActive; 
                document.getElementById('btnVAD').classList.toggle('active-state', this.vadActive);
                if(this.vadActive && isSystemRunning) BrainEngine.initVoice();
                else if(BrainEngine.recognition) { BrainEngine.recognition.stop(); document.getElementById('micStatus').style.display='none'; }
            },
            toggleGhostDetection() { 
                this.ghostActive = !this.ghostActive; 
                document.getElementById('btnRecord').classList.toggle('active-state', this.ghostActive); 
            },
            toggleAutoRecord() { 
                this.autoRecordActive = !this.autoRecordActive; 
                document.getElementById('btnRecord').classList.toggle('active-state', this.autoRecordActive); 
            },
            togglePower() { 
                this.powerMode = !this.powerMode; 
                document.getElementById('btnPower').classList.toggle('active-state', this.powerMode); 
            },
            toggleEVP() { 
                this.evpActive = !this.evpActive; 
                document.getElementById('btnEVP').classList.toggle('active-evp', this.evpActive); 
                if(this.evpActive) EVPRecorder.start(); else EVPRecorder.stop();
            }
        };

        const App = {
            log(msg, type) {
                const t = document.getElementById('terminal');
                const d = document.createElement('div');
                d.className = 'log-line log-' + type;
                const time = new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                d.innerText = `[${time}] ${msg}`;
                t.appendChild(d);
                t.scrollTop = t.scrollHeight;
            },
            clearLog() { document.getElementById('terminal').innerHTML = ''; },
            
            saveKey() {
                apiKey = document.getElementById('keyinput').value.trim();
                localStorage.setItem('supra_api_key', apiKey);
                App.log("✅ Clé API sauvegardée", "ai");
                this.toggleSettings();
            },

            toggleSettings() {
                const m = document.getElementById('settingsModal');
                m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
            },

            handleDetection(type, details) {
                if (!FeatureEngine.ghostActive) return;
                App.log(`DETECTION [${type}] : ${details}`, "entity");
                triggerAI(type, details);
            },

            async startFullSystem() {
                if(isSystemRunning) return;
                const btn = document.getElementById('btnMainStart');
                btn.innerHTML = "⏳ INITIALISATION...";
                
                const ok = await AudioEngine.init();
                if (!ok) { btn.innerHTML = "ERREUR MICRO"; return; }

                isSystemRunning = true;
                VisualEngine.init();
                if(FeatureEngine.vadActive) BrainEngine.initVoice();
                if(FeatureEngine.evpActive) EVPRecorder.start();

                btn.innerHTML = "SYSTÈME ACTIF";
                btn.classList.add("active-mode");
                document.getElementById('mainText').innerText = "SUPRA ACTIF";
                
                this.log("v30.5 DEMARRÉ", "sys");
                BrainEngine.speak("Système actif. Parlez pour communiquer.");
            },

            stopSystem() {
                isSystemRunning = false;
                AudioEngine.stop();
                if(BrainEngine.recognition) BrainEngine.recognition.stop();
                window.speechSynthesis.cancel();
                
                document.getElementById('btnMainStart').innerHTML = "DÉMARRER SYSTÈME COMPLET";
                document.getElementById('btnMainStart').classList.remove("active-mode");
                document.getElementById('mainText').innerText = "ARRÊTÉ";
                document.getElementById('mainText').style.color = "var(--danger)";
                document.getElementById('micStatus').style.display = 'none';
                
                this.log("ARRÊT TOTAL", "sys");
            },

            replayLastEVP() { EVPRecorder.playLastCapture(); }
        };

        // --- 8. CAPTEURS ---
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', e => {
                if(!isSystemRunning || !FeatureEngine.emfActive) return;
                const emf = (Math.abs(e.alpha-180) + Math.abs(e.beta) + Math.abs(e.gamma))/4 + (Math.random()*5);
                document.getElementById('valEmf').innerText = emf.toFixed(1);
                document.getElementById('valMag').innerText = Math.round(e.alpha||0);
                if (emf > Config.data.emfSensitivity && Date.now() - lastTrigger > 8000) {
                    App.handleDetection("EMF", `Spike ${emf.toFixed(1)} μT`);
                }
            });
        }

        window.onload = () => {
            Config.load();
            App.log("v30.5 DEBUG CHARGÉ", "sys");
        };
    </script>
</body>
</html>
