<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPATATOP REAL — DONNÉES BRUTES</title>
    <style>
        :root {
            --bg: #000000;
            --panel: #0a0a0a;
            --text: #e0e0e0;
            --real: #00ff00; /* Vert pour les données réelles */
            --warn: #ffcc00;
            --err: #ff3333;
            --border: #333;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0; font-family: 'Consolas', 'Monaco', monospace;
            background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* UI Structure */
        header {
            background: #000; border-bottom: 1px solid var(--real);
            padding: 10px; display: flex; justify-content: space-between; align-items: center;
            height: 40px;
        }
        h1 { margin: 0; font-size: 0.9rem; color: var(--real); text-transform: uppercase; letter-spacing: 1px; }

        main { flex: 1; display: flex; flex-direction: column; position: relative; }

        /* Canvas pour Audio Réel */
        #scopeContainer { flex: 1; background: #000; border-bottom: 1px solid var(--border); position: relative; }
        canvas { width: 100%; height: 100%; display: block; }
        
        /* Overlay Données Réelles */
        #dataOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; padding: 10px; display: grid;
            grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
        }

        .data-box {
            background: rgba(0, 20, 0, 0.6); border: 1px solid var(--real);
            padding: 5px; font-size: 0.7rem; color: var(--real);
            display: flex; flex-direction: column; justify-content: center;
        }
        .data-val { font-size: 1.2rem; font-weight: bold; margin-top: 5px; }
        .na { color: #555; } /* Style pour Non Disponible */

        /* Controls Grid */
        #controls {
            height: 180px; background: var(--panel); border-top: 1px solid var(--border);
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px;
            overflow-y: auto;
        }

        .ctrl-btn {
            background: #111; border: 1px solid #333; color: #888;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 0.7rem; padding: 5px; cursor: pointer; text-align: center;
        }
        .ctrl-btn:active { background: #222; }
        .ctrl-btn.active { background: rgba(0, 255, 0, 0.1); color: var(--real); border-color: var(--real); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #333; margin-bottom: 5px; }
        .ctrl-btn.active .status-dot { background: var(--real); box-shadow: 0 0 5px var(--real); }

        /* Terminal Logs */
        #terminal {
            height: 120px; background: #050505; border-top: 1px solid var(--border);
            padding: 5px; font-size: 0.65rem; overflow-y: auto; font-family: monospace;
            color: #aaa;
        }
        .log-entry { margin-bottom: 2px; border-left: 2px solid #333; padding-left: 5px; }
        .log-real { border-color: var(--real); color: #ccffcc; }
        .log-warn { border-color: var(--warn); color: var(--warn); }
        .log-err { border-color: var(--err); color: var(--err); }

        /* Bouton Permission iOS (Caché par défaut) */
        #iosPermBtn {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--real); color: #000; padding: 20px; border: none; font-weight: bold;
            z-index: 1000; cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>OPATATOP <span style="color:#fff">REAL DATA LINK</span></h1>
    <div id="systemTime" style="color:#fff; font-size:0.8rem;">00:00:00</div>
</header>

<main>
    <div id="scopeContainer">
        <canvas id="audioCanvas"></canvas>
        
        <div id="dataOverlay">
            <!-- Données Audio Réelles -->
            <div class="data-box">
                <div>FREQUENCE DOMINANTE</div>
                <div class="data-val" id="valFreq">-- Hz</div>
            </div>
            <div class="data-box">
                <div>AMPLITUDE RMS</div>
                <div class="data-val" id="valRms">-- dB</div>
            </div>
            
            <!-- Données Réseau Réelles -->
            <div class="data-box">
                <div>RÉSEAU (TYPE)</div>
                <div class="data-val" id="valNet">--</div>
            </div>
            <div class="data-box">
                <div>BATTERIE</div>
                <div class="data-val" id="valBatt">-- %</div>
            </div>
        </div>

        <!-- Bouton pour permission iOS 13+ -->
        <button id="iosPermBtn" onclick="RealSensors.requestPermission()">ACTIVER LES CAPTEURS</button>
    </div>
</main>

<div id="controls">
    <div class="ctrl-btn active" id="btn_audio" onclick="RealSensors.toggle('audio')">
        <div class="status-dot"></div><span>AUDIO IN</span>
    </div>
    <div class="ctrl-btn" id="btn_motion" onclick="RealSensors.toggle('motion')">
        <div class="status-dot"></div><span>ACCELÉROMÈTRE</span>
    </div>
    <div class="ctrl-btn" id="btn_orient" onclick="RealSensors.toggle('orientation')">
        <div class="status-dot"></div><span>GYRO / BOUSSOLE</span>
    </div>
    <div class="ctrl-btn" id="btn_geo" onclick="RealSensors.toggle('geo')">
        <div class="status-dot"></div><span>GEOLOCATION</span>
    </div>
    <div class="ctrl-btn" id="btn_batt" onclick="RealSensors.toggle('battery')">
        <div class="status-dot"></div><span>BATTERIE</span>
    </div>
    <div class="ctrl-btn" id="btn_net" onclick="RealSensors.toggle('network')">
        <div class="status-dot"></div><span>RÉSEAU</span>
    </div>
</div>

<div id="terminal"></div>

<script>
    /**
     * OPATATOP REAL ENGINE
     * Aucune simulation. Uniquement API Web du navigateur.
     */

    const Terminal = {
        log: (msg, type = 'real') => {
            const t = document.getElementById('terminal');
            const d = document.createElement('div');
            d.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString('fr-FR', {hour12:false});
            d.innerText = `[${time}] ${msg}`;
            t.appendChild(d);
            t.scrollTop = t.scrollHeight;
        }
    };

    /**
     * 1. MOTEUR AUDIO RÉEL (FFT & dB)
     */
    const RealAudio = {
        ctx: null,
        analyser: null,
        stream: null,
        active: false,
        dataArray: null,
        
        async init() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AC();
                // Pas de réglages de suppression de bruit pour garder le signal brut
                this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
                
                const source = this.ctx.createMediaStreamSource(this.stream);
                this.analyser = this.ctx.createAnalyser();
                this.analyser.fftSize = 2048;
                this.analyser.smoothingTimeConstant = 0.8;
                
                source.connect(this.analyser);
                this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                this.active = true;
                
                Terminal.log("AudioContext: Connecté. Fréquence d'échantillonnage: " + this.ctx.sampleRate + "Hz");
                Visuals.start();
                return true;
            } catch(e) {
                Terminal.log("Erreur Micro: " + e.message, 'err');
                return false;
            }
        },

        getMetrics() {
            if(!this.active) return { freq: 0, rms: 0, raw: new Uint8Array(0) };
            
            this.analyser.getByteFrequencyData(this.dataArray);
            
            let sum = 0;
            let maxVal = 0;
            let maxIndex = 0;

            for(let i = 0; i < this.dataArray.length; i++) {
                const v = this.dataArray[i];
                sum += v * v;
                if(v > maxVal) {
                    maxVal = v;
                    maxIndex = i;
                }
            }

            // RMS (Root Mean Square) - Indicateur réel de puissance
            const rms = Math.sqrt(sum / this.dataArray.length);
            
            // Fréquence dominante réelle
            const freq = maxIndex > 0 ? (maxIndex * this.ctx.sampleRate / this.analyser.fftSize) : 0;

            return { freq, rms, raw: this.dataArray };
        },

        stop() {
            if(this.stream) {
                this.stream.getTracks().forEach(t => t.stop());
                this.stream = null;
            }
            if(this.ctx) this.ctx.close();
            this.active = false;
            Terminal.log("AudioContext: Déconnecté.", 'warn');
        }
    };

    /**
     * 2. MOTEUR CAPTEURS RÉELS (Motion, Orient, Geo, Batt, Net)
     */
    const RealSensors = {
        state: {
            audio: false,
            motion: false,
            orientation: false,
            geo: false,
            battery: false,
            network: false
        },
        
        watchers: [], // Pour nettoyer les events (geoID)

        async toggle(sensor) {
            this.state[sensor] = !this.state[sensor];
            const btn = document.getElementById(sensor === 'network' ? 'btn_net' : 'btn_' + sensor);
            btn.classList.toggle('active', this.state[sensor]);

            if(this.state[sensor]) {
                await this.startSensor(sensor);
            } else {
                this.stopSensor(sensor);
            }
        },

        async requestPermission() {
            // iOS 13+ nécessite une interaction utilisateur pour les capteurs de mouvement
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceMotionEvent.requestPermission();
                    if (response === 'granted') {
                        document.getElementById('iosPermBtn').style.display = 'none';
                        this.toggle('motion');
                        this.toggle('orientation');
                    } else {
                        Terminal.log("Permission capteurs refusée.", 'err');
                    }
                } catch(e) {
                    Terminal.log("Erreur permission: " + e, 'err');
                }
            } else {
                // Android ou vieux iOS
                document.getElementById('iosPermBtn').style.display = 'none';
                this.toggle('motion');
                this.toggle('orientation');
            }
        },

        async startSensor(type) {
            switch(type) {
                case 'audio':
                    const ok = await RealAudio.init();
                    if(ok) Terminal.log("Microphone: ACTIF (Données brutes)", 'real');
                    else this.state.audio = false;
                    break;

                case 'motion':
                    window.addEventListener('devicemotion', this.handleMotion);
                    Terminal.log("Accéléromètre: Écoute en cours...", 'real');
                    break;

                case 'orientation':
                    window.addEventListener('deviceorientation', this.handleOrientation);
                    Terminal.log("Gyroscope/Boussole: Écoute en cours...", 'real');
                    break;

                case 'geo':
                    if("geolocation" in navigator) {
                        this.watchers.push(navigator.geolocation.watchPosition(this.handleGeo, this.handleGeoErr, { enableHighAccuracy: true }));
                        Terminal.log("GPS: Recherche satellite...", 'real');
                    } else {
                        Terminal.log("GPS: Non supporté par ce navigateur.", 'err');
                    }
                    break;

                case 'battery':
                    if("getBattery" in navigator) {
                        try {
                            const batt = await navigator.getBattery();
                            this.updateBattery(batt);
                            batt.addEventListener('levelchange', () => this.updateBattery(batt));
                            batt.addEventListener('chargingchange', () => this.updateBattery(batt));
                            Terminal.log("Batterie: Surveillance active.", 'real');
                        } catch(e) { Terminal.log("Batterie: API non accessible.", 'err'); }
                    } else {
                        Terminal.log("Batterie: Non supportée.", 'err');
                    }
                    break;

                case 'network':
                    if("connection" in navigator) {
                        this.updateNetwork();
                        navigator.connection.addEventListener('change', this.updateNetwork);
                        Terminal.log("Réseau: Surveillance active.", 'real');
                    } else {
                        Terminal.log("Réseau: API non supportée.", 'err');
                    }
                    break;
            }
        },

        stopSensor(type) {
            switch(type) {
                case 'audio': RealAudio.stop(); break;
                case 'motion': window.removeEventListener('devicemotion', this.handleMotion); break;
                case 'orientation': window.removeEventListener('deviceorientation', this.handleOrientation); break;
                case 'geo': 
                    this.watchers.forEach(id => navigator.geolocation.clearWatch(id)); 
                    this.watchers = [];
                    Terminal.log("GPS: Arrêté.", 'warn');
                    document.getElementById('valGeo').innerText = "N/A";
                    break;
                case 'battery': /* Battery API ne permet pas de stop propre, on arrête juste l'affichage */ break;
                case 'network': /* Network API est passif */ break;
            }
        },

        // --- HANDLERS (Traitement des données réelles) ---

        handleMotion(e) {
            if(!this.state.motion) return;
            // Accélération réelle en m/s²
            const acc = e.accelerationIncludingGravity;
            if(acc) {
                // Log seulement si mouvement significatif pour éviter spam
                if(Math.abs(acc.x || 0) > 0.2 || Math.abs(acc.y || 0) > 0.2) {
                    // On pourrait loguer ici, mais pour la perf on affiche juste
                }
            }
        },

        handleOrientation(e) {
            if(!this.state.orientation) return;
            // Alpha: Compas (0-360), Beta/Gamma: Inclinaison
            const heading = e.webkitCompassHeading || e.alpha; 
            if(heading) {
                // Affichage boussole réel
                document.getElementById('valOrient').innerText = Math.round(heading) + "°";
            }
        },

        handleGeo(pos) {
            if(!this.state.geo) return;
            const crd = pos.coords;
            const lat = crd.latitude.toFixed(5);
            const lng = crd.longitude.toFixed(5);
            const acc = crd.accuracy ? Math.round(crd.accuracy) + "m" : "N/A";
            const alt = crd.altitude ? crd.altitude.toFixed(1) + "m" : "N/A";
            
            const txt = `LAT:${lat} LNG:${lng} ALT:${alt} PRÉC:${acc}`;
            // Création dynamique d'un élément si besoin, ou utilisation de l'overlay existant
            // Pour ce layout, on log dans le terminal pour garder l'UI propre
            Terminal.log(`GPS UPDATE: ${txt}`, 'real');
        },

        handleGeoErr(err) {
            Terminal.log(`GPS ERR: ${err.message}`, 'err');
        },

        updateBattery(batt) {
            if(!this.state.battery) return;
            const p = Math.round(batt.level * 100);
            const ch = batt.charging ? "CHARGE" : "Décharge";
            document.getElementById('valBatt').innerText = `${p}% (${ch})`;
            Terminal.log(`Batterie: ${p}% - ${ch}`, 'real');
        },

        updateNetwork() {
            if(!this.state.network) return;
            const conn = navigator.connection;
            const type = conn.effectiveType ? conn.effectiveType.toUpperCase() : "N/A";
            const down = conn.downlink ? conn.downlink + " Mbps" : "N/A";
            const rtt = conn.rtt ? conn.rtt + " ms" : "N/A";
            
            document.getElementById('valNet').innerText = `${type} / ${down}`;
            Terminal.log(`Réseau: ${type}, Down: ${down}, Ping: ${rtt}`, 'real');
        }
    };

    /**
     * 3. VISUALISATION RÉELLE (Spectre Audio)
     */
    const Visuals = {
        canvas: null,
        ctx: null,
        active: false,

        init() {
            this.canvas = document.getElementById('audioCanvas');
            this.ctx = this.canvas.getContext('2d');
            this.resize();
            window.addEventListener('resize', () => this.resize());
        },

        resize() {
            const p = this.canvas.parentElement;
            this.canvas.width = p.clientWidth;
            this.canvas.height = p.clientHeight;
        },

        start() {
            if(!this.active) {
                this.active = true;
                this.loop();
            }
        },

        stop() {
            this.active = false;
            // Nettoyer canvas
            this.ctx.clearRect(0,0, this.canvas.width, this.canvas.height);
        },

        loop() {
            if(!this.active) return;
            requestAnimationFrame(() => this.loop());

            const w = this.canvas.width;
            const h = this.canvas.height;
            const { rms, freq, raw } = RealAudio.getMetrics();

            // Mise à jour Overlay Audio
            document.getElementById('valFreq').innerText = Math.round(freq) + " Hz";
            document.getElementById('valRms').innerText = rms.toFixed(2); // Unité arbitraire 0-255 (proche dB relatif)

            // Dessin Spectre (Données brutes)
            this.ctx.fillStyle = '#000';
            this.ctx.fillRect(0, 0, w, h);

            const barWidth = (w / raw.length) * 2.5;
            let x = 0;

            for(let i = 0; i < raw.length; i++) {
                const barHeight = (raw[i] / 255) * h;
                
                // Couleur basée sur l'intensité réelle
                const r = barHeight + (25 * (i/raw.length));
                const g = 250 * (i/raw.length);
                const b = 50;

                this.ctx.fillStyle = `rgb(${r},${g},${b})`;
                this.ctx.fillRect(x, h - barHeight, barWidth, barHeight);

                x += barWidth + 1;
            }
        }
    };

    /**
     * INITIALISATION HORLOGE SYSTÈME
     */
    setInterval(() => {
        const now = new Date();
        document.getElementById('systemTime').innerText = now.toLocaleTimeString('fr-FR');
    }, 1000);

    // Boot
    window.onload = () => {
        Visuals.init();
        Terminal.log("SYSTÈME OPATATOP REAL PRÊT.", 'real');
        Terminal.log("ATTENTION: Aucune donnée ne sera simulée.", 'warn');
        
        // Détection iOS pour afficher le bouton de permission
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            document.getElementById('iosPermBtn').style.display = 'block';
        }
    };

    // Expose handlers globalement pour les events HTML
    RealSensors.handleMotion = RealSensors.handleMotion.bind(RealSensors);
    RealSensors.handleOrientation = RealSensors.handleOrientation.bind(RealSensors);
    RealSensors.handleGeo = RealSensors.handleGeo.bind(RealSensors);
    RealSensors.handleGeoErr = RealSensors.handleGeoErr.bind(RealSensors);
    RealSensors.updateBattery = RealSensors.updateBattery.bind(RealSensors);
    RealSensors.updateNetwork = RealSensors.updateNetwork.bind(RealSensors);

</script>
</body>
</html>
