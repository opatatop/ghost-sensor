<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPRA NEURAL AI</title>

<style>

:root{
--bg:#02020a;
--cyan:#00ffff;
--mag:#ff00ff;
--panel:rgba(0,0,0,0.9);
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:white;
font-family:monospace;
overflow:hidden;
}

header{
position:absolute;
top:0;
left:0;
right:0;
padding:10px;
background:black;
border-bottom:1px solid var(--cyan);
z-index:10;
display:flex;
justify-content:space-between;
align-items:center;
}

header span{
color:var(--cyan);
font-weight:bold;
}

#controls button{
background:black;
border:1px solid var(--cyan);
color:var(--cyan);
padding:6px 10px;
margin-left:5px;
cursor:pointer;
}

#controls button:hover{
background:var(--cyan);
color:black;
}

canvas{
display:block;
}

#terminal{
position:absolute;
bottom:0;
left:0;
right:0;
height:160px;
background:var(--panel);
border-top:1px solid var(--cyan);
overflow:auto;
font-size:12px;
padding:6px;
}

.log-ai{color:var(--mag)}
.log-audio{color:var(--cyan)}
.log-sys{color:#aaa}

</style>
</head>

<body>

<header>
<span>SUPRA NEURAL AI</span>
<div id="controls">
<button id="btnMic">🎤 Micro</button>
<button id="btnVoice">🧠 Voice AI</button>
</div>
</header>

<canvas id="canvas"></canvas>

<div id="terminal"></div>

<script>

//////////////////////////////////////////////////
// LOGGER
//////////////////////////////////////////////////

class Logger{

static log(msg,type="sys"){

const t=document.getElementById("terminal")

const line=document.createElement("div")

line.className="log-"+type

line.textContent="["+new Date().toLocaleTimeString()+"] "+msg

t.appendChild(line)

t.scrollTop=t.scrollHeight

}

}

//////////////////////////////////////////////////
// AUDIO ENGINE
//////////////////////////////////////////////////

class AudioEngine{

constructor(){

this.ctx=null
this.analyser=null
this.enabled=false

}

async start(){

try{

this.ctx=new (window.AudioContext||window.webkitAudioContext)()

const stream=await navigator.mediaDevices.getUserMedia({audio:true})

const src=this.ctx.createMediaStreamSource(stream)

this.analyser=this.ctx.createAnalyser()

this.analyser.fftSize=1024

src.connect(this.analyser)

this.enabled=true

Logger.log("Microphone actif","audio")

}catch(e){

Logger.log("Erreur micro","sys")

}

}

getSpectrum(){

if(!this.enabled)return null

const data=new Uint8Array(this.analyser.frequencyBinCount)

this.analyser.getByteFrequencyData(data)

return data

}

}

//////////////////////////////////////////////////
// NEURAL NETWORK VISUAL
//////////////////////////////////////////////////

class NeuralBrain{

constructor(canvas){

this.canvas=canvas
this.ctx=canvas.getContext("2d")

this.nodes=[]

for(let i=0;i<120;i++){

this.nodes.push({

x:Math.random()*window.innerWidth,
y:Math.random()*window.innerHeight,
vx:(Math.random()-0.5)*0.5,
vy:(Math.random()-0.5)*0.5

})

}

}

update(){

for(let n of this.nodes){

n.x+=n.vx
n.y+=n.vy

if(n.x<0||n.x>window.innerWidth)n.vx*=-1
if(n.y<0||n.y>window.innerHeight)n.vy*=-1

}

}

draw(audio){

const ctx=this.ctx
const w=this.canvas.width
const h=this.canvas.height

ctx.fillStyle="rgba(0,0,20,0.4)"
ctx.fillRect(0,0,w,h)

for(let a of this.nodes){

for(let b of this.nodes){

const dx=a.x-b.x
const dy=a.y-b.y

const dist=Math.sqrt(dx*dx+dy*dy)

if(dist<120){

ctx.strokeStyle="rgba(0,255,255,0.1)"

ctx.beginPath()
ctx.moveTo(a.x,a.y)
ctx.lineTo(b.x,b.y)
ctx.stroke()

}

}

}

for(let n of this.nodes){

ctx.fillStyle="#00ffff"

ctx.beginPath()
ctx.arc(n.x,n.y,2,0,Math.PI*2)
ctx.fill()

}

if(audio){

const bar=w/audio.length

for(let i=0;i<audio.length;i++){

const val=audio[i]/255*h

ctx.fillStyle="#00ffff"

ctx.fillRect(i*bar,h-val,bar,val)

}

}

}

}

//////////////////////////////////////////////////
// AI ENGINE
//////////////////////////////////////////////////

class AIEngine{

process(text){

text=text.toLowerCase()

Logger.log("Voice: "+text,"ai")

if(text.includes("bonjour")){

this.speak("Bonjour humain")

}

else if(text.includes("qui es tu")){

this.speak("Je suis Supra Neural Intelligence")

}

else{

this.speak("Commande inconnue")

}

}

speak(text){

const u=new SpeechSynthesisUtterance(text)

u.lang="fr-FR"

speechSynthesis.speak(u)

Logger.log("AI: "+text,"ai")

}

}

//////////////////////////////////////////////////
// VOICE ENGINE
//////////////////////////////////////////////////

class VoiceEngine{

constructor(ai){

this.ai=ai

const SR=window.SpeechRecognition||window.webkitSpeechRecognition

if(!SR)return

this.rec=new SR()

this.rec.lang="fr-FR"

this.rec.continuous=true

this.rec.onresult=e=>{

const txt=e.results[e.results.length-1][0].transcript

this.ai.process(txt)

}

}

start(){

try{
this.rec.start()
Logger.log("Reconnaissance vocale activée","sys")
}catch{}

}

}

//////////////////////////////////////////////////
// MAIN APP
//////////////////////////////////////////////////

class SupraApp{

constructor(){

this.canvas=document.getElementById("canvas")

this.audio=new AudioEngine()

this.ai=new AIEngine()

this.voice=new VoiceEngine(this.ai)

this.brain=new NeuralBrain(this.canvas)

window.addEventListener("resize",()=>this.resize())

this.resize()

}

resize(){

this.canvas.width=window.innerWidth
this.canvas.height=window.innerHeight

}

async startMic(){

await this.audio.start()

}

startVoice(){

this.voice.start()

}

loop(){

requestAnimationFrame(()=>this.loop())

this.brain.update()

const spectrum=this.audio.getSpectrum()

this.brain.draw(spectrum)

}

}

//////////////////////////////////////////////////

const app=new SupraApp()

document.getElementById("btnMic").onclick=()=>app.startMic()

document.getElementById("btnVoice").onclick=()=>app.startVoice()

app.loop()

Logger.log("SUPRA NEURAL AI prêt")

</script>

</body>
</html>
