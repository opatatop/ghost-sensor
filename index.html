<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>KITT JARVIS</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--fg:#00ff41;--dim:#00aa2a;--muted:#006618;--red:#ff0033;--blue:#00ccff;--orange:#ff6600;--panel:#0a0a0a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;color:var(--fg);font-family:'VT323',monospace}
body{background-image:linear-gradient(rgba(0,255,65,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,65,.03) 1px,transparent 1px);background-size:28px 28px}
button,input,select,textarea{font-family:'VT323',monospace;font-size:16px}
.btn{background:transparent;border:3px solid var(--fg);color:var(--fg);padding:14px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.btn:active{background:var(--fg);color:#000}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.blue{border-color:var(--blue);color:var(--blue)}
.btn.on{background:var(--fg)!important;color:#000!important}
.btn.sm{min-height:46px;padding:10px 12px}
.btntitle{font-size:19px}
.btndesc{font-size:11px;color:var(--muted)}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid var(--fg);text-align:center;padding:20px;z-index:40}
#boot h1{font-size:32px;letter-spacing:2px;text-shadow:0 0 14px rgba(0,255,65,.7)}
#boot p{color:var(--red);margin:12px 0}
#boot .acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:20px}
#boot .acts .btn{min-width:170px;min-height:72px;font-size:20px}
#app{display:none;position:fixed;inset:0;border:3px solid var(--fg);flex-direction:column}
#app.show{display:flex}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:2px solid var(--fg);background:var(--panel)}
header .title{flex:1;text-align:center;font-size:14px}
main{flex:1;overflow-y:auto;padding:10px;padding-bottom:54px;display:flex;flex-direction:column;gap:9px}
footer{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:8px 10px;border-top:2px solid var(--fg);background:var(--panel);font-size:12px}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar .btn{min-height:68px;width:100%}
@media(min-width:700px){.bar{grid-template-columns:repeat(4,1fr)}}
.viz{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.panel{border:2px solid var(--fg);background:var(--panel);padding:10px;position:relative}
.panel .lab{position:absolute;top:-9px;left:8px;background:var(--panel);padding:0 5px;font-size:11px}
canvas{display:block;width:100%;height:60px;background:#000}
.live{border:2px solid var(--fg);background:#050505;padding:12px 10px;position:relative;min-height:76px}
.live .lab{position:absolute;top:-9px;left:8px;background:#050505;padding:0 5px;font-size:11px}
.live .badge{position:absolute;top:6px;right:8px;border:1px solid var(--muted);color:var(--muted);padding:2px 8px;font-size:12px}
.live .badge.listen{color:var(--blue);border-color:var(--blue)}
.live .badge.rec{color:var(--red);border-color:var(--red)}
.live .badge.speak{color:var(--blue);border-color:var(--blue)}
.live .badge.stop{color:var(--red);border-color:var(--red)}
.live .txt{margin-top:12px;font-size:16px}
.live .txt.dim{color:var(--muted);font-size:13px}
.live .txt.red{color:var(--red)}
.inputrow{display:flex;border:2px solid var(--dim);background:#050505}
.inputrow .pre{padding:10px;border-right:2px solid var(--dim);color:var(--dim)}
.inputrow input{flex:1;border:0;background:transparent;color:var(--fg);padding:10px;outline:0;font-size:16px}
.inputrow button{border:0;border-left:2px solid var(--dim);background:rgba(0,255,65,.1);color:var(--fg);padding:0 16px}
.out,.logbox{border:2px dashed var(--dim);background:#050505;padding:10px;min-height:80px;max-height:180px;overflow:auto;font-size:14px;white-space:pre-wrap}
.logbox{border-color:var(--orange);font-size:12px}
.logbox .err{color:var(--red)}
.logbox .info{color:var(--orange)}
.logbox .qa{color:var(--fg)}
.sys{font-size:12px;color:var(--muted)}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99999;padding:10px 14px;border:2px solid var(--fg);background:var(--panel);opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{border-color:var(--red);color:var(--red)}
#ptt{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;display:none;align-items:center;justify-content:center;text-align:center;z-index:100;background:#000;border:3px solid var(--fg);color:var(--fg)}
#ptt.show{display:flex}
#ptt.rec{background:var(--red);border-color:var(--red);color:#fff}
dialog{border:3px solid var(--fg);background:#000;color:var(--fg);width:95vw;max-width:700px;max-height:90vh;padding:0;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.93)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:2px solid var(--fg);position:sticky;top:0;background:#000}
.db{padding:12px}
.df{display:flex;gap:10px;justify-content:center;padding:12px;border-top:2px solid var(--muted);position:sticky;bottom:0;background:#000}
.sec{color:var(--red);margin:14px 0 8px;border-bottom:1px solid var(--muted);padding-bottom:3px}
.fl{margin-bottom:12px}
.fl label{display:block;margin-bottom:4px}
.fl input[type=text],.fl select,.fl textarea{width:100%;padding:11px;background:#050505;border:2px solid var(--dim);color:var(--fg);outline:0}
.fl textarea{min-height:58px}
.check{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.check input{width:24px;height:24px;accent-color:var(--fg)}
.desc{font-size:12px;color:var(--dim);padding-left:34px}
.range{display:flex;align-items:center;gap:8px}
.range input{flex:1}
.range span{color:var(--orange);min-width:40px;text-align:right}
#keystatus{margin-top:6px;padding:8px;border:1px dashed var(--dim)}
#keystatus.ok{border-color:var(--fg);color:var(--fg)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <div class="dh"><span>PARAMÈTRES</span><button class="btn sm" id="x" type="button">FERMER</button></div>
  <div class="db">
    <div class="sec">CLÉ GROQ</div>
    <div class="fl">
      <label>Clé API gsk_…</label>
      <textarea id="key" placeholder="gsk_..." spellcheck="false"></textarea>
      <div id="keystatus">Aucune clé</div>
    </div>
    <div class="grid3">
      <button class="btn blue sm" id="paste" type="button">COLLER</button>
      <button class="btn sm" id="savekey" type="button">SAUVER</button>
      <button class="btn blue sm" id="test" type="button">TESTER</button>
    </div>

    <div class="sec">PROFIL</div>
    <div class="fl">
      <select id="profile">
        <option value="bt">Dehors + BT</option>
        <option value="home">Maison</option>
        <option value="max" selected>Max 24/7</option>
      </select>
    </div>

    <div class="sec">OPTIONS</div>
    <div class="fl"><label class="check"><input type="checkbox" id="agentMode" checked> Agent</label><div class="desc">Rapporte autour</div></div>
    <div class="fl"><label class="check"><input type="checkbox" id="reportSpeech" checked> Paroles autour</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="always" checked> Sans mot d'appel</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="btFriendly"> Relâcher micro</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="noise" checked> Bruits</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="speakNoise" checked> Dire les bruits</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="useSensors" checked> Capteurs</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="tts" checked> Voix</label></div>
    <div class="fl"><label class="check"><input type="checkbox" id="wakelock" checked> Écran allumé</label></div>

    <div class="sec">RÉGLAGES</div>
    <div class="fl"><label>Sensibilité <span id="vsens">3</span></label><div class="range"><input type="range" id="sens" min="2" max="14" value="3"></div></div>
    <div class="fl"><label>Seuil bruit <span id="vnoisevol">6</span></label><div class="range"><input type="range" id="noisevol" min="3" max="18" value="6"></div></div>
    <div class="fl"><label>Silence ms <span id="vsil">700</span></label><div class="range"><input type="range" id="sil" min="400" max="1400" step="50" value="700"></div></div>
    <div class="fl"><label>Max rec s <span id="vmax">9</span></label><div class="range"><input type="range" id="max" min="4" max="16" value="9"></div></div>
    <div class="fl"><label>Pause ms <span id="vgap">1800</span></label><div class="range"><input type="range" id="gap" min="800" max="5000" step="100" value="1800"></div></div>

    <div class="sec">IA</div>
    <div class="fl">
      <select id="model">
        <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
        <option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option>
        <option value="llama3-70b-8192">llama3-70b-8192</option>
        <option value="mixtral-8x7b-32768">mixtral-8x7b-32768</option>
      </select>
    </div>
    <div class="fl"><label>Temp <span id="vtemp">0.22</span></label><div class="range"><input type="range" id="temp" min="0.05" max="0.4" step="0.01" value="0.22"></div></div>
    <div class="fl"><label>Tokens <span id="vtokens">400</span></label><div class="range"><input type="range" id="tokens" min="80" max="800" step="20" value="400"></div></div>
    <div class="fl"><label>Vitesse voix <span id="vrate">0.95</span></label><div class="range"><input type="range" id="rate" min="0.7" max="1.15" step="0.01" value="0.95"></div></div>
    <div class="fl"><label>Langue</label><select id="lang"><option value="fr">Français</option><option value="en">English</option></select></div>
    <div class="fl"><label>Nom</label><input type="text" id="aiName" value="Jarvis"></div>
    <div class="fl"><label>Mots d'appel</label><input type="text" id="wake" value="jarvis,kitt,hey,ok"></div>
    <div class="fl"><label>Mots stop</label><input type="text" id="stopw" value="stop,arrête,arrete,tais-toi,silence"></div>
  </div>
  <div class="df">
    <button class="btn" id="save" type="button" style="min-width:140px;min-height:56px">SAUVER</button>
    <button class="btn red" id="rst" type="button">RESET</button>
  </div>
</dialog>

<section id="boot">
  <h1>KITT × JARVIS</h1>
  <p>VERSION STABLE</p>
  <div class="acts">
    <button class="btn" id="go" type="button"><span class="btntitle">LANCER</span><span class="btndesc">Démarrer</span></button>
    <button class="btn blue" id="cfg" type="button"><span class="btntitle">PARAMÈTRES</span><span class="btndesc">Clé API</span></button>
  </div>
</section>

<div id="app">
  <header>
    <button class="btn sm" id="cfg2" type="button">MENU</button>
    <div class="title"><span id="nameTag">Jarvis</span> — <span id="mode">OFF</span> · <span id="profTag">MAX</span></div>
    <button class="btn sm red" id="halt" type="button">STOP</button>
  </header>
  <main>
    <div class="bar">
      <button class="btn blue" id="auto" type="button"><span class="btntitle">AUTO</span><span class="btndesc">Écoute</span></button>
      <button class="btn" id="comp" type="button"><span class="btntitle">24/7</span><span class="btndesc">Permanent</span></button>
      <button class="btn" id="agentBtn" type="button"><span class="btntitle">AGENT</span><span class="btndesc">Autour</span></button>
      <button class="btn" id="profBtn" type="button"><span class="btntitle">PROFIL</span><span class="btndesc">BT/Maison/Max</span></button>
      <button class="btn" id="export" type="button"><span class="btntitle">LOG</span><span class="btndesc">Export</span></button>
      <button class="btn red" id="clr" type="button"><span class="btntitle">EFFACER</span><span class="btndesc">Vider</span></button>
      <button class="btn" id="mute" type="button"><span class="btntitle">SON ON</span><span class="btndesc">Voix</span></button>
      <button class="btn" id="mail" type="button"><span class="btntitle">MAIL</span><span class="btndesc">Log</span></button>
    </div>
    <div class="viz">
      <div class="panel"><div class="lab">SPECTRO</div><canvas id="c1"></canvas></div>
      <div class="panel"><div class="lab">OSCILLO</div><canvas id="c2"></canvas></div>
      <div class="panel"><div class="lab">VOL</div><canvas id="c3"></canvas></div>
    </div>
    <div class="live">
      <div class="lab">STATUT</div>
      <div class="badge" id="badge">PRÊT</div>
      <div class="txt dim" id="live">En attente</div>
    </div>
    <div class="inputrow">
      <div class="pre">&gt;</div>
      <input id="txt" placeholder="Écris… ou stop" autocomplete="off">
      <button type="button" id="send">OK</button>
    </div>
    <div class="panel"><div class="lab">OREILLE</div><div class="out" id="out">…</div></div>
    <div class="panel"><div class="lab">JOURNAL</div><div class="logbox" id="log"></div></div>
    <div class="panel"><div class="lab">SYS</div><div class="sys" id="sys">—</div><div class="sys" id="stats">—</div></div>
  </main>
  <footer><span id="status">OFF</span><span>JARVIS · <span id="clock">--:--:--</span></span></footer>
</div>

<button class="btn" id="ptt" type="button">PTT<br>parler</button>

<script>
(function () {
  'use strict';

  var GROQ = 'https://api.groq.com/openai/v1';
  var MODELS = ['llama-3.3-70b-versatile', 'llama-3.1-8b-instant', 'llama3-70b-8192', 'mixtral-8x7b-32768'];
  var SAFE = 'llama-3.3-70b-versatile';
  var S_CFG = 'kj_cfg_v1';
  var S_LOG = 'kj_log_v1';

  var DEFAULT = {
    key: '', model: SAFE, lang: 'fr', tts: true, aiName: 'Jarvis', profile: 'max',
    agentMode: true, reportSpeech: true, always: true, btFriendly: false,
    noise: true, speakNoise: true, useSensors: true, wakelock: true,
    sens: 3, noiseVol: 6, silence: 700, maxRecord: 9, gapMs: 1800,
    temp: 0.22, maxTokens: 400, rate: 0.95,
    wakeWords: 'jarvis,kitt,hey,ok',
    stopWords: 'stop,arrête,arrete,tais-toi,silence',
    mailTo: ''
  };

  var cfg = {};
  for (var k in DEFAULT) cfg[k] = DEFAULT[k];

  var st = {
    stream: null, ctx: null, an: null, volNode: null,
    fdata: null, wdata: null, vdata: null,
    auto: false, comp: false, speaking: false, hardStop: false, muted: false,
    loopId: 0, ready: false, drawOn: false,
    hist: [], fullLog: [], ctrl: null, reqs: 0, lat: 0,
    lastVol: 0, lastBass: 0, lastMid: 0, lastHigh: 0, lastNoiseAt: 0,
    motionMag: 0, motionType: 'still', impactLevel: 0,
    ptt: false, pmr: null, piv: null, wake: null
  };

  function $(s) { return document.querySelector(s); }
  function now() { return new Date().toLocaleTimeString('fr-FR'); }
  function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function norm(t) {
    return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  }
  function cleanKey(k) {
    return String(k || '').replace(/[\u200B-\u200D\uFEFF\u00A0\r\n\t ]+/g, '').trim();
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function cleanSpeech(t) {
    return String(t || '').replace(/[*|#`]+/g, ' ').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
  }
  function aiName() { return (cfg.aiName || 'Jarvis').trim() || 'Jarvis'; }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function safeGet(k, f) {
    try { var v = localStorage.getItem(k); return v == null ? f : v; } catch (e) { return f; }
  }

  function isGarbage(t) {
    t = String(t || '').trim();
    if (t.length < 2) return true;
    if (t.replace(/[^a-zA-Zà-üÀ-Ü0-9]/gi, '').length < 2) return true;
    var n = norm(t);
    var junk = ['sous-titrage', 'subtitle', 'netflix', 'youtube'];
    for (var i = 0; i < junk.length; i++) {
      if (n.indexOf(junk[i]) !== -1 && n.length < 26) return true;
    }
    return false;
  }

  function isStop(t) {
    var n = norm(t);
    if (!n) return false;
    var words = (cfg.stopWords || '').split(',');
    for (var i = 0; i < words.length; i++) {
      var w = norm(words[i]);
      if (w && (n === w || n.indexOf(w) !== -1)) return true;
    }
    return /^(stop|arrete|arrête|silence)/.test(n);
  }

  function applyProfile(p) {
    cfg.profile = p || cfg.profile || 'max';
    if (cfg.profile === 'bt') {
      cfg.sens = 4; cfg.noiseVol = 7; cfg.gapMs = 2200; cfg.btFriendly = true; cfg.maxRecord = 9;
    } else if (cfg.profile === 'home') {
      cfg.sens = 3; cfg.noiseVol = 6; cfg.gapMs = 1500; cfg.btFriendly = false; cfg.maxRecord = 11;
    } else {
      cfg.sens = 3; cfg.noiseVol = 5; cfg.gapMs = 1200; cfg.btFriendly = false; cfg.maxRecord = 12;
    }
  }

  function profLabel() {
    return cfg.profile === 'home' ? 'MAISON' : (cfg.profile === 'max' ? 'MAX' : 'BT');
  }

  function getKey() {
    var el = $('#key');
    var from = el && el.value ? cleanKey(el.value) : '';
    var k = from || cleanKey(cfg.key);
    if (k && k !== cfg.key) {
      cfg.key = k;
      safeSet(S_CFG, JSON.stringify(cfg));
    }
    return k;
  }

  function hasKey() {
    return (getKey() || '').length >= 20;
  }

  function toast(msg, type) {
    var el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'toast ' + (type || '') + ' show';
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }

  function log(m, t) {
    t = t || 'ok';
    var el = $('#log');
    if (el) {
      var d = document.createElement('div');
      d.className = t;
      d.textContent = '[' + now() + '] ' + m;
      el.appendChild(d);
      el.scrollTop = el.scrollHeight;
      while (el.children.length > 50) el.firstChild.remove();
    }
    st.fullLog.push('[' + now() + '] ' + m);
    if (st.fullLog.length > 800) st.fullLog = st.fullLog.slice(-600);
    safeSet(S_LOG, JSON.stringify(st.fullLog.slice(-200)));
  }

  function status(t) {
    var el = $('#status');
    if (el) el.textContent = t;
  }

  function live(txt, mode) {
    var t = $('#live'), b = $('#badge');
    if (!t || !b) return;
    t.className = 'txt';
    b.className = 'badge';
    if (mode === 'idle') { t.classList.add('dim'); t.textContent = txt; b.textContent = 'PRÊT'; }
    else if (mode === 'listen') { t.classList.add('dim'); t.textContent = txt; b.textContent = 'ÉCOUTE'; b.classList.add('listen'); }
    else if (mode === 'rec') { t.classList.add('red'); t.textContent = txt; b.textContent = 'REC'; b.classList.add('rec'); }
    else if (mode === 'think') { t.textContent = txt; b.textContent = '…'; }
    else if (mode === 'speak') { t.textContent = txt; b.textContent = 'PARLE'; b.classList.add('speak'); }
    else if (mode === 'stop') { t.classList.add('red'); t.textContent = txt; b.textContent = 'STOP'; b.classList.add('stop'); }
    else { t.textContent = txt; b.textContent = 'OK'; }
  }

  function showOut(text) {
    var el = $('#out');
    if (!el) return;
    var d = document.createElement('div');
    d.textContent = '[' + now() + '] ' + text;
    d.style.margin = '3px 0';
    d.style.color = 'var(--fg)';
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
    while (el.children.length > 20) el.firstChild.remove();
  }

  function sys() {
    var el = $('#sys');
    if (el) {
      el.innerHTML = 'Micro ' + (st.stream ? '<span style="color:#00ff41">ON</span>' : 'OFF') +
        ' · ' + (st.hardStop ? 'STOP' : (st.comp ? '24/7' : (st.auto ? 'AUTO' : 'OFF'))) +
        ' · ' + profLabel() + (cfg.agentMode ? ' · AGENT' : '');
    }
    var s = $('#stats');
    if (s) s.textContent = st.reqs + ' req · ' + (st.lat || '—') + ' ms';
  }

  function updateTags() {
    var nt = $('#nameTag'); if (nt) nt.textContent = aiName();
    var pt = $('#profTag'); if (pt) pt.textContent = profLabel();
    var ab = $('#agentBtn');
    if (ab) {
      var t = ab.querySelector('.btntitle');
      if (t) t.textContent = cfg.agentMode ? 'AGENT ON' : 'AGENT OFF';
      ab.classList.toggle('on', !!cfg.agentMode);
    }
    var pb = $('#profBtn');
    if (pb) {
      var t2 = pb.querySelector('.btntitle');
      if (t2) t2.textContent = 'PROFIL ' + profLabel();
    }
    var mb = $('#mute');
    if (mb) {
      var t3 = mb.querySelector('.btntitle');
      if (t3) t3.textContent = st.muted ? 'SON OFF' : 'SON ON';
      mb.classList.toggle('on', !st.muted);
      mb.classList.toggle('red', !!st.muted);
    }
    var m = $('#mode');
    if (m) m.textContent = st.hardStop ? 'STOP' : (st.comp ? '24/7' : (st.auto ? 'AUTO' : 'OFF'));
  }

  function releaseMic() {
    try {
      if (st.stream) st.stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} });
    } catch (e) {}
    st.stream = null;
    st.ready = false;
    st.drawOn = false;
    st.an = null;
    st.volNode = null;
    st.fdata = null;
    st.wdata = null;
    st.vdata = null;
    try {
      if (st.ctx && st.ctx.state !== 'closed') {
        var c = st.ctx;
        st.ctx = null;
        c.close().catch(function () {});
      }
    } catch (e) {}
    sys();
  }

  function resumeCtx() {
    try { if (st.ctx && st.ctx.state === 'suspended') st.ctx.resume(); } catch (e) {}
  }

  function ensureMic() {
    if (st.hardStop) return Promise.resolve(false);
    if (st.stream && st.ready && st.ctx) {
      resumeCtx();
      return Promise.resolve(true);
    }
    try {
      if (!st.ctx || st.ctx.state === 'closed') {
        st.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return st.ctx.resume().then(function () {
        return navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true }
        });
      }).then(function (stream) {
        st.stream = stream;
        var src = st.ctx.createMediaStreamSource(stream);
        st.an = st.ctx.createAnalyser();
        st.an.fftSize = 2048;
        st.an.smoothingTimeConstant = 0.65;
        src.connect(st.an);
        st.fdata = new Uint8Array(st.an.frequencyBinCount);
        st.wdata = new Uint8Array(st.an.fftSize);
        st.volNode = st.ctx.createAnalyser();
        st.volNode.fftSize = 256;
        src.connect(st.volNode);
        st.vdata = new Uint8Array(st.volNode.frequencyBinCount);
        st.ready = true;
        st.drawOn = true;
        sizeCanvases();
        drawLoop();
        sys();
        return true;
      }).catch(function (e) {
        log('Micro: ' + (e.message || e), 'err');
        return false;
      });
    } catch (e) {
      log('Micro: ' + (e.message || e), 'err');
      return Promise.resolve(false);
    }
  }

  function vol() {
    if (!st.volNode || !st.vdata) return 0;
    st.volNode.getByteFrequencyData(st.vdata);
    var s = 0;
    for (var i = 0; i < st.vdata.length; i++) s += st.vdata[i];
    return s / st.vdata.length;
  }

  function bands() {
    if (!st.an || !st.fdata) return { bass: 0, mid: 0, high: 0 };
    st.an.getByteFrequencyData(st.fdata);
    var n = st.fdata.length, a = Math.floor(n * 0.1), b = Math.floor(n * 0.4);
    var bass = 0, mid = 0, high = 0, c1 = 0, c2 = 0, c3 = 0;
    for (var i = 0; i < n; i++) {
      var v = st.fdata[i];
      if (i < a) { bass += v; c1++; }
      else if (i < b) { mid += v; c2++; }
      else { high += v; c3++; }
    }
    return {
      bass: c1 ? Math.round(bass / c1) : 0,
      mid: c2 ? Math.round(mid / c2) : 0,
      high: c3 ? Math.round(high / c3) : 0
    };
  }

  function getMime() {
    var list = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    for (var i = 0; i < list.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(list[i])) return list[i];
    }
    return '';
  }

  function sizeCanvases() {
    document.querySelectorAll('canvas').forEach(function (c) {
      var r = c.parentElement.getBoundingClientRect();
      c.width = Math.max(40, Math.floor(r.width - 12));
      c.height = 60;
    });
  }

  function drawLoop() {
    if (!st.drawOn || !st.ready) return;
    requestAnimationFrame(drawLoop);
    try {
      st.an.getByteFrequencyData(st.fdata);
      st.an.getByteTimeDomainData(st.wdata);
      st.volNode.getByteFrequencyData(st.vdata);

      var c1 = $('#c1');
      if (c1) {
        var x = c1.getContext('2d'), w = c1.width, h = c1.height;
        x.fillStyle = '#000';
        x.fillRect(0, 0, w, h);
        var n = st.fdata.length, bw = Math.max(1, w / n);
        for (var i = 0; i < n; i++) {
          var v = st.fdata[i];
          if (v < 4) continue;
          x.fillStyle = 'hsl(' + Math.max(0, 110 - v * 0.3) + ',100%,' + Math.max(18, v * 0.25) + '%)';
          x.fillRect(i * bw, h - Math.log10(v + 1) * 11, bw + 0.2, Math.log10(v + 1) * 11);
        }
      }

      var c2 = $('#c2');
      if (c2) {
        var x2 = c2.getContext('2d'), w2 = c2.width, h2 = c2.height;
        x2.fillStyle = '#000';
        x2.fillRect(0, 0, w2, h2);
        x2.strokeStyle = '#00ff41';
        x2.beginPath();
        var step = w2 / st.wdata.length;
        for (var j = 0; j < st.wdata.length; j++) {
          var y = (st.wdata[j] / 128 - 0.5) * h2 * 0.65 + h2 / 2;
          if (j) x2.lineTo(j * step, y); else x2.moveTo(0, y);
        }
        x2.stroke();
      }

      var c3 = $('#c3');
      if (c3) {
        var x3 = c3.getContext('2d'), w3 = c3.width, h3 = c3.height;
        x3.fillStyle = '#000';
        x3.fillRect(0, 0, w3, h3);
        var s = 0;
        for (var k = 0; k < st.vdata.length; k++) s += st.vdata[k];
        var p = s / st.vdata.length / 255;
        x3.fillStyle = 'hsl(' + Math.max(0, 120 - p * 140) + ',100%,40%)';
        x3.fillRect(w3 * 0.3, h3 - Math.max(3, p * h3 * 0.7), w3 * 0.4, Math.max(3, p * h3 * 0.7));
      }
    } catch (e) {}
  }

  function transcribe(blob) {
    var key = getKey();
    if (!key) return Promise.resolve('');
    var fd = new FormData();
    fd.append('file', blob, 'a.webm');
    fd.append('model', 'whisper-large-v3');
    fd.append('language', cfg.lang || 'fr');
    fd.append('response_format', 'json');
    fd.append('temperature', '0');
    return fetch(GROQ + '/audio/transcriptions', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + key },
      body: fd
    }).then(function (r) {
      if (!r.ok) throw new Error('STT ' + r.status);
      return r.json();
    }).then(function (j) {
      return (j.text || '').trim();
    }).catch(function (e) {
      log('STT: ' + e.message, 'err');
      return '';
    });
  }

  function stopTTS() {
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
    st.speaking = false;
  }

  function speak(text) {
    if (!cfg.tts || st.muted || st.hardStop) return Promise.resolve();
    var cleaned = cleanSpeech(text);
    if (!cleaned) return Promise.resolve();
    return new Promise(function (resolve) {
      if (!window.speechSynthesis) { resolve(); return; }
      stopTTS();
      var u = new SpeechSynthesisUtterance(cleaned);
      u.lang = cfg.lang === 'en' ? 'en-US' : 'fr-FR';
      u.rate = clamp(cfg.rate || 0.95, 0.6, 1.3);
      var voices = speechSynthesis.getVoices();
      var pref = cfg.lang === 'en' ? 'en' : 'fr';
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang.indexOf(pref) === 0) { u.voice = voices[i]; break; }
      }
      st.speaking = true;
      var safety = setTimeout(function () { st.speaking = false; resolve(); }, Math.min(24000, cleaned.length * 150 + 1800));
      u.onend = function () { clearTimeout(safety); st.speaking = false; resolve(); };
      u.onerror = function () { clearTimeout(safety); st.speaking = false; resolve(); };
      speechSynthesis.speak(u);
    });
  }

  function systemPrompt() {
    var p = 'Tu es ' + aiName() + ', assistant personnel style Jarvis. Tu parles français, tu tutoies. Calme, précis, utile.\n';
    p += 'Heure: ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) + '.\n';
    p += 'Réponds toujours si on te parle. Phrases courtes. Pas de markdown. Ne répète pas mot pour mot.\n';
    return p;
  }

  function noiseLine(vol) {
    var force = vol >= 13 ? 'très fort' : (vol >= 9 ? 'fort' : (vol >= 6 ? 'assez présent' : 'léger'));
    var tone = 'équilibré';
    if (st.lastBass >= st.lastMid + 7 && st.lastBass >= st.lastHigh + 7) tone = 'plutôt grave';
    else if (st.lastHigh >= st.lastMid + 7 && st.lastHigh >= st.lastBass + 7) tone = 'plutôt aigu';
    return "J'entends un bruit " + force + ', ' + tone + '.';
  }

  function callAI(messages) {
    var key = getKey();
    if (!key) return Promise.reject(new Error('Pas de clé'));
    var ctrl = new AbortController();
    st.ctrl = ctrl;
    var tid = setTimeout(function () { ctrl.abort(); }, 26000);
    return fetch(GROQ + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + key
      },
      body: JSON.stringify({
        model: cfg.model,
        messages: messages,
        max_tokens: clamp(cfg.maxTokens, 30, 1200),
        temperature: clamp(cfg.temp, 0, 1),
        top_p: 0.9
      }),
      signal: ctrl.signal
    }).then(function (r) {
      clearTimeout(tid);
      if (!r.ok) {
        return r.text().then(function (txt) {
          var msg = 'Erreur ' + r.status;
          try {
            var j = JSON.parse(txt);
            if (j.error && j.error.message) msg = j.error.message;
          } catch (e) {}
          throw new Error(msg);
        });
      }
      return r.json();
    }).then(function (j) {
      return cleanSpeech((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '');
    }).catch(function (e) {
      clearTimeout(tid);
      if (e.name === 'AbortError') throw new Error('Timeout');
      throw e;
    });
  }

  function callWithRetry(messages, n) {
    n = n || 0;
    return callAI(messages).catch(function (e) {
      if (n >= 2) throw e;
      log('Retry ' + (n + 1) + ': ' + e.message, 'err');
      return delay(900 * (n + 1)).then(function () { return callWithRetry(messages, n + 1); });
    });
  }

  function addHist(role, content) {
    st.hist.push({ role: role, content: String(content).slice(0, 1500) });
    if (st.hist.length > 28) st.hist = st.hist.slice(-22);
  }

  function ctxMsgs() { return st.hist.slice(-12); }

  function shouldRelease() {
    return !!(cfg.btFriendly && cfg.profile !== 'max');
  }

  function hardStop(reason) {
    st.hardStop = true;
    st.auto = false;
    st.comp = false;
    st.loopId++;
    stopTTS();
    try { if (st.ctrl) st.ctrl.abort(); } catch (e) {}
    if (st.pmr && st.pmr.state === 'recording') {
      try { st.pmr.stop(); } catch (e) {}
    }
    st.ptt = false;
    clearInterval(st.piv);
    releaseMic();
    try { if (st.wake) { st.wake.release(); st.wake = null; } } catch (e) {}
    var a = $('#auto'), c = $('#comp');
    if (a) a.classList.remove('on');
    if (c) c.classList.remove('on');
    live(reason || 'Stop.', 'stop');
    status('STOP');
    log('STOP');
    toast('Stop');
    updateTags();
    sys();
  }

  function keepAlive() {
    if (!cfg.wakelock || !navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function (s) {
      st.wake = s;
    }).catch(function () {});
  }

  function waitSound(myId) {
    return new Promise(function (resolve) {
      var t0 = 0;
      var sens = Math.max(2, cfg.sens || 3);
      function tick() {
        if (!st.auto || st.loopId !== myId || st.hardStop || st.speaking) return resolve(false);
        var v = vol();
        if (v >= sens || st.impactLevel >= 2) {
          if (!t0) t0 = Date.now();
          if (Date.now() - t0 >= 85) return resolve(true);
        } else t0 = 0;
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }

  function recordUntilSilent(myId) {
    return new Promise(function (resolve) {
      if (!st.stream) return resolve(null);
      var mime = getMime();
      if (!mime) return resolve(null);
      var rec;
      try { rec = new MediaRecorder(st.stream, { mimeType: mime }); }
      catch (e) { return resolve(null); }
      var chunks = [];
      rec.ondataavailable = function (e) {
        if (e.data && e.data.size) chunks.push(e.data);
      };
      rec.onstop = function () {
        st.lastVol = vol();
        var b = bands();
        st.lastBass = b.bass;
        st.lastMid = b.mid;
        st.lastHigh = b.high;
        resolve(new Blob(chunks, { type: rec.mimeType }));
      };
      var start = Date.now();
      var last = Date.now();
      var spoken = false;
      var maxMs = (cfg.maxRecord || 9) * 1000;
      var sil = cfg.silence || 700;
      rec.start(40);
      var iv = setInterval(function () {
        if (!st.auto || st.loopId !== myId || st.hardStop) {
          clearInterval(iv);
          if (rec.state === 'recording') rec.stop();
          return;
        }
        var v = vol();
        if (v >= Math.max(2, (cfg.sens || 3) * 0.28) || st.impactLevel >= 2) {
          last = Date.now();
          spoken = true;
          st.lastVol = v;
        }
        if (spoken && (Date.now() - last >= sil || Date.now() - start >= maxMs)) {
          clearInterval(iv);
          if (rec.state === 'recording') rec.stop();
        }
        if (!spoken && Date.now() - start > 1900) {
          clearInterval(iv);
          if (rec.state === 'recording') rec.stop();
        }
      }, 40);
    });
  }

  function handleCmd(text) {
    var t = norm(text);
    if (isStop(text)) { hardStop('Stop.'); return true; }
    if (/mode auto/.test(t)) { st.hardStop = false; autoStart(false); return true; }
    if (/24\s*\/?\s*7|mode jarvis|mode agent/.test(t)) {
      st.hardStop = false; cfg.agentMode = true; updateTags(); autoStart(true); return true;
    }
    if (/profil bt|casque/.test(t)) {
      applyProfile('bt'); safeSet(S_CFG, JSON.stringify(cfg)); applyUI(); toast('BT'); return true;
    }
    if (/profil maison/.test(t)) {
      applyProfile('home'); safeSet(S_CFG, JSON.stringify(cfg)); applyUI(); toast('Maison'); return true;
    }
    if (/profil max/.test(t)) {
      applyProfile('max'); safeSet(S_CFG, JSON.stringify(cfg)); applyUI(); toast('Max'); return true;
    }
    if (/mute|tais.toi|coupe le son|silence/.test(t)) {
      st.muted = true; updateTags(); toast('Mute'); return true;
    }
    if (/unmute|son on|remets le son/.test(t)) {
      st.muted = false; updateTags(); toast('Son ON'); return true;
    }
    return false;
  }

  function processText(text, fromAround) {
    if (handleCmd(text)) return Promise.resolve();
    if (!hasKey()) { toast('Clé manquante', 'err'); openSettings(); return Promise.resolve(); }
    live('Réflexion…', 'think');
    addHist('user', fromAround ? '[autour] ' + text : text);
    var userContent = text;
    if (fromAround) {
      userContent = 'Parole autour (pas adressée à toi):\n« ' + text + ' »\nRésume en 1-2 phrases utiles, style Jarvis. Ne répète pas mot pour mot.';
    }
    var msgs = [{ role: 'system', content: systemPrompt() }].concat(ctxMsgs());
    if (msgs.length && msgs[msgs.length - 1].role === 'user') {
      msgs[msgs.length - 1].content = userContent;
    } else {
      msgs.push({ role: 'user', content: userContent });
    }
    var t0 = Date.now();
    return callWithRetry(msgs).then(function (resp) {
      st.lat = Date.now() - t0;
      st.reqs++;
      var r = resp || (fromAround ? '' : 'Oui ?');
      if (!r) return;
      log((fromAround ? 'Autour: ' : 'Réponse: ') + r, fromAround ? 'info' : 'qa');
      addHist('assistant', r);
      showOut(r);
      if (cfg.tts && !st.muted) {
        live('Je parle…', 'speak');
        return speak(r).then(function () { return delay(400); });
      }
    }).catch(function (e) {
      log('API: ' + e.message, 'err');
      toast('Erreur IA', 'err');
    });
  }

  function autoStart(comp) {
    if (st.hardStop) st.hardStop = false;
    if (st.auto && st.comp === !!comp) return;
    if (st.auto) autoStop();
    if (!hasKey()) { toast('Mets ta clé', 'err'); openSettings(); return; }

    st.auto = true;
    st.comp = !!comp;
    st.loopId++;
    var myId = st.loopId;

    var a = $('#auto'), c = $('#comp');
    if (a) a.classList.toggle('on', !comp);
    if (c) c.classList.toggle('on', !!comp);

    live(comp ? '24/7 actif' : 'AUTO actif', 'listen');
    status(comp ? '24/7' : 'AUTO');
    log((comp ? '24/7' : 'AUTO') + ' ON');
    updateTags();
    keepAlive();

    (function loop() {
      if (!st.auto || st.loopId !== myId || st.hardStop) return;

      ensureMic().then(function (ok) {
        if (!ok) {
          return delay(1200).then(function () {
            if (st.auto && st.loopId === myId && !st.hardStop) loop();
          });
        }
        live('En veille…', 'listen');
        return waitSound(myId);
      }).then(function (heard) {
        if (!heard || !st.auto || st.loopId !== myId || st.hardStop) {
          if (st.auto && st.loopId === myId && !st.hardStop) setTimeout(loop, 200);
          return;
        }
        live('Enregistre…', 'rec');
        return recordUntilSilent(myId);
      }).then(function (blob) {
        if (!blob || !st.auto || st.loopId !== myId || st.hardStop) {
          if (st.auto && st.loopId === myId && !st.hardStop) setTimeout(loop, 200);
          return;
        }

        if (blob.size < 650) {
          if (cfg.noise && cfg.speakNoise && Date.now() - st.lastNoiseAt > 8000 && st.lastVol >= cfg.noiseVol) {
            st.lastNoiseAt = Date.now();
            var line = noiseLine(st.lastVol);
            log('Bruit: ' + line, 'info');
            showOut(line);
            var p = Promise.resolve();
            if (cfg.tts && !st.muted) {
              live('Bruit…', 'speak');
              p = speak(line);
            }
            return p.then(function () { return delay(cfg.gapMs || 1800); });
          }
          if (shouldRelease()) releaseMic();
          return delay(150);
        }

        live('Transcription…', 'think');
        return transcribe(blob).then(function (text) {
          if (!st.auto || st.loopId !== myId || st.hardStop) return;

          if (isGarbage(text)) {
            if (cfg.noise && cfg.speakNoise && Date.now() - st.lastNoiseAt > 8000 && st.lastVol >= cfg.noiseVol) {
              st.lastNoiseAt = Date.now();
              var line2 = noiseLine(st.lastVol);
              showOut(line2);
              if (cfg.tts && !st.muted) return speak(line2);
            }
            if (shouldRelease()) releaseMic();
            return delay(160);
          }

          log('Entendu: « ' + text + ' »', 'qa');

          var addressed = cfg.always;
          if (!cfg.always) {
            var wakes = (cfg.wakeWords || '').split(',');
            var tn = norm(text);
            for (var i = 0; i < wakes.length; i++) {
              var w = norm(wakes[i]);
              if (w && tn.indexOf(w) !== -1) { addressed = true; break; }
            }
          }

          if (addressed) return processText(text, false);
          if (cfg.agentMode && cfg.reportSpeech) return processText(text, true);
        });
      }).then(function () {
        if (!st.auto || st.loopId !== myId || st.hardStop) return;
        if (shouldRelease()) releaseMic();
        sys();
        return delay(cfg.gapMs || 1800);
      }).then(function () {
        if (st.auto && st.loopId === myId && !st.hardStop) loop();
      }).catch(function (e) {
        log('Loop: ' + (e.message || e), 'err');
        if (st.auto && st.loopId === myId && !st.hardStop) setTimeout(loop, 1200);
      });
    })();
  }

  function autoStop() {
    st.auto = false;
    st.comp = false;
    st.loopId++;
    try { if (st.ctrl) st.ctrl.abort(); } catch (e) {}
    var a = $('#auto'), c = $('#comp');
    if (a) a.classList.remove('on');
    if (c) c.classList.remove('on');
    live('OFF', 'idle');
    status('OFF');
    log('OFF');
    stopTTS();
    try { if (st.wake) { st.wake.release(); st.wake = null; } } catch (e) {}
    if (shouldRelease()) releaseMic();
    updateTags();
    sys();
  }

  function sendText(text) {
    text = (text || '').trim();
    if (!text) return;
    if (isStop(text)) { hardStop('Stop.'); return; }
    if (handleCmd(text)) return;
    if (!hasKey()) { toast('Clé manquante', 'err'); openSettings(); return; }
    log('Texte: « ' + text + ' »', 'qa');
    processText(text, false);
  }

  function pttStart() {
    if (st.ptt || st.hardStop) return;
    if (!hasKey()) { toast('Clé manquante', 'err'); openSettings(); return; }
    st.ptt = true;
    var p = $('#ptt');
    if (p) p.classList.add('rec');
    live('PTT', 'rec');
    ensureMic().then(function (ok) {
      if (!ok) { st.ptt = false; return; }
      var mime = getMime();
      if (!mime) { st.ptt = false; return; }
      try { st.pmr = new MediaRecorder(st.stream, { mimeType: mime }); }
      catch (e) { st.ptt = false; return; }
      var chunks = [];
      st.pmr.ondataavailable = function (e) {
        if (e.data && e.data.size) chunks.push(e.data);
      };
      st.pmr.onstop = function () {
        st.ptt = false;
        if (p) p.classList.remove('rec');
        var blob = new Blob(chunks, { type: st.pmr.mimeType });
        if (blob.size < 400) { live('Trop court', 'idle'); return; }
        live('Transcription…', 'think');
        transcribe(blob).then(function (text) {
          if (isGarbage(text)) { live('Rien', 'idle'); return; }
          sendText(text);
        });
      };
      st.pmr.start(40);
      var n = 0;
      st.piv = setInterval(function () {
        n++;
        if (n >= (cfg.maxRecord || 9) * 25) {
          clearInterval(st.piv);
          if (st.pmr && st.pmr.state === 'recording') st.pmr.stop();
        }
      }, 40);
    });
  }

  function pttStop() {
    clearInterval(st.piv);
    if (st.pmr && st.pmr.state === 'recording') {
      try { st.pmr.stop(); } catch (e) {}
    }
    st.ptt = false;
    var p = $('#ptt');
    if (p) p.classList.remove('rec');
  }

  function openSettings() {
    updateKeyStatus();
    try { $('#dlg').showModal(); } catch (e) {}
  }
  function closeSettings() {
    var d = $('#dlg');
    if (d && d.open) d.close();
  }
  function updateKeyStatus() {
    var el = $('#keystatus');
    if (!el) return;
    el.textContent = hasKey() ? 'Clé OK' : 'Aucune clé';
    el.className = hasKey() ? 'ok' : '';
  }

  function load() {
    try {
      var raw = safeGet(S_CFG, null);
      if (raw) {
        var parsed = JSON.parse(raw);
        for (var k in parsed) cfg[k] = parsed[k];
      }
    } catch (e) {}
    try {
      var s = JSON.parse(safeGet(S_LOG, '[]') || '[]');
      if (Array.isArray(s)) st.fullLog = s;
    } catch (e) {}
    if (MODELS.indexOf(cfg.model) === -1) cfg.model = SAFE;
    if (!cfg.profile) cfg.profile = 'max';
    applyUI();
    updateKeyStatus();
    updateTags();
  }

  function applyUI() {
    function sv(id, v) { var e = $('#' + id); if (e) e.value = v; }
    function sc(id, v) { var e = $('#' + id); if (e) e.checked = !!v; }
    sv('key', cfg.key || '');
    sv('model', cfg.model);
    sv('lang', cfg.lang);
    sv('profile', cfg.profile);
    sv('aiName', cfg.aiName || 'Jarvis');
    sv('wake', cfg.wakeWords);
    sv('stopw', cfg.stopWords);
    sc('agentMode', cfg.agentMode !== false);
    sc('reportSpeech', cfg.reportSpeech !== false);
    sc('always', cfg.always !== false);
    sc('btFriendly', !!cfg.btFriendly);
    sc('noise', cfg.noise !== false);
    sc('speakNoise', cfg.speakNoise !== false);
    sc('useSensors', cfg.useSensors !== false);
    sc('tts', cfg.tts !== false);
    sc('wakelock', cfg.wakelock !== false);
    var pairs = [
      ['sens', 'vsens', cfg.sens],
      ['noisevol', 'vnoisevol', cfg.noiseVol],
      ['sil', 'vsil', cfg.silence],
      ['max', 'vmax', cfg.maxRecord],
      ['gap', 'vgap', cfg.gapMs],
      ['temp', 'vtemp', cfg.temp],
      ['tokens', 'vtokens', cfg.maxTokens],
      ['rate', 'vrate', cfg.rate]
    ];
    for (var i = 0; i < pairs.length; i++) {
      sv(pairs[i][0], pairs[i][2]);
      var el = $('#' + pairs[i][1]);
      if (el) el.textContent = pairs[i][2];
    }
    updateTags();
    sys();
  }

  function persistKey() {
    var k = cleanKey(($('#key') && $('#key').value) || '');
    if (k.length >= 10) {
      cfg.key = k;
      safeSet(S_CFG, JSON.stringify(cfg));
    }
    updateKeyStatus();
  }

  function saveAll() {
    persistKey();
    var prev = cfg.profile;
    cfg.model = $('#model').value;
    if (MODELS.indexOf(cfg.model) === -1) cfg.model = SAFE;
    cfg.lang = $('#lang').value;
    cfg.tts = $('#tts').checked;
    cfg.aiName = (($('#aiName').value) || 'Jarvis').trim();
    cfg.profile = $('#profile').value;
    if (cfg.profile !== prev) applyProfile(cfg.profile);
    cfg.agentMode = $('#agentMode').checked;
    cfg.reportSpeech = $('#reportSpeech').checked;
    cfg.always = $('#always').checked;
    cfg.btFriendly = $('#btFriendly').checked;
    cfg.noise = $('#noise').checked;
    cfg.speakNoise = $('#speakNoise').checked;
    cfg.useSensors = $('#useSensors').checked;
    cfg.wakelock = $('#wakelock').checked;
    cfg.sens = +$('#sens').value;
    cfg.noiseVol = +$('#noisevol').value;
    cfg.silence = +$('#sil').value;
    cfg.maxRecord = +$('#max').value;
    cfg.gapMs = +$('#gap').value;
    cfg.temp = +$('#temp').value;
    cfg.maxTokens = +$('#tokens').value;
    cfg.rate = +$('#rate').value;
    cfg.wakeWords = $('#wake').value.trim();
    cfg.stopWords = $('#stopw').value.trim();
    safeSet(S_CFG, JSON.stringify(cfg));
    applyUI();
    toast('Sauvé');
    closeSettings();
  }

  function testKey() {
    persistKey();
    if (!hasKey()) { toast('Clé ?', 'err'); return; }
    fetch(GROQ + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + getKey()
      },
      body: JSON.stringify({
        model: cfg.model,
        messages: [{ role: 'user', content: 'OK' }],
        max_tokens: 4,
        temperature: 0
      })
    }).then(function (r) {
      toast(r.ok ? 'Clé OK' : 'Erreur ' + r.status, r.ok ? '' : 'err');
    }).catch(function () {
      toast('Réseau', 'err');
    });
  }

  function resetAll() {
    if (!confirm('Reset ?')) return;
    for (var k in DEFAULT) cfg[k] = DEFAULT[k];
    safeSet(S_CFG, JSON.stringify(cfg));
    try { localStorage.removeItem(S_LOG); } catch (e) {}
    st.fullLog = [];
    st.hist = [];
    applyUI();
    toast('Reset');
    closeSettings();
  }

  function exportLog() {
    var lines = ['KITT x JARVIS', now(), 'Profil ' + cfg.profile, 'Model ' + cfg.model, ''];
    for (var i = 0; i < st.hist.length; i++) {
      lines.push((st.hist[i].role === 'user' ? 'IN: ' : 'OUT: ') + st.hist[i].content);
    }
    lines.push('---');
    for (var j = 0; j < st.fullLog.length; j++) lines.push(st.fullLog[j]);
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/plain;charset=utf-8' }));
    a.download = 'jarvis-' + Date.now() + '.txt';
    a.click();
    toast('Export');
  }

  function bind() {
    $('#go').onclick = function () {
      $('#boot').style.display = 'none';
      $('#app').classList.add('show');
      sizeCanvases();
    };
    $('#cfg').onclick = openSettings;
    $('#cfg2').onclick = openSettings;
    $('#x').onclick = closeSettings;
    $('#halt').onclick = function () { hardStop('Stop'); };
    $('#auto').onclick = function () {
      if (st.auto && !st.comp) autoStop(); else autoStart(false);
    };
    $('#comp').onclick = function () {
      if (st.comp) autoStop(); else autoStart(true);
    };
    $('#agentBtn').onclick = function () {
      cfg.agentMode = !cfg.agentMode;
      safeSet(S_CFG, JSON.stringify(cfg));
      updateTags();
      toast(cfg.agentMode ? 'Agent ON' : 'Agent OFF');
    };
    $('#profBtn').onclick = function () {
      var next = cfg.profile === 'bt' ? 'home' : (cfg.profile === 'home' ? 'max' : 'bt');
      applyProfile(next);
      safeSet(S_CFG, JSON.stringify(cfg));
      applyUI();
      toast(profLabel());
    };
    $('#export').onclick = exportLog;
    $('#mail').onclick = function () { toast('Configure un email si besoin'); };
    $('#clr').onclick = function () {
      var o = $('#out'), l = $('#log');
      if (o) o.textContent = '…';
      if (l) l.textContent = '';
      st.hist = [];
      toast('Effacé');
    };
    $('#mute').onclick = function () {
      st.muted = !st.muted;
      updateTags();
      toast(st.muted ? 'Mute' : 'Son');
    };
    $('#send').onclick = function () {
      var el = $('#txt');
      sendText(el.value);
      el.value = '';
    };
    $('#txt').onkeydown = function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendText(e.target.value);
        e.target.value = '';
      }
    };

    var ptt = $('#ptt');
    ptt.onmousedown = pttStart;
    ptt.onmouseup = pttStop;
    ptt.ontouchstart = function (e) { e.preventDefault(); pttStart(); };
    ptt.ontouchend = function (e) { e.preventDefault(); pttStop(); };

    $('#paste').onclick = function () {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function (t) {
          $('#key').value = t;
          persistKey();
          toast('Collé');
        }).catch(function () { toast('Refusé', 'err'); });
      } else toast('Non supporté', 'err');
    };
    $('#savekey').onclick = function () { persistKey(); toast('Clé'); };
    $('#test').onclick = testKey;
    $('#save').onclick = saveAll;
    $('#rst').onclick = resetAll;

    var sliders = [
      ['sens', 'vsens'], ['noisevol', 'vnoisevol'], ['sil', 'vsil'],
      ['max', 'vmax'], ['gap', 'vgap'], ['temp', 'vtemp'],
      ['tokens', 'vtokens'], ['rate', 'vrate']
    ];
    for (var i = 0; i < sliders.length; i++) {
      (function (id, vid) {
        var el = $('#' + id);
        if (el) {
          el.oninput = function () {
            var v = $('#' + vid);
            if (v) v.textContent = el.value;
          };
        }
      })(sliders[i][0], sliders[i][1]);
    }

    window.addEventListener('resize', sizeCanvases);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && st.auto) {
        keepAlive();
        ensureMic();
      }
    });
  }

  function boot() {
    load();
    bind();
    setInterval(function () {
      var el = $('#clock');
      if (el) el.textContent = now();
    }, 1000);
    setInterval(sys, 1200);
    if (window.speechSynthesis) {
      speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = function () { speechSynthesis.getVoices(); };
    }
    if ('ontouchstart' in window) {
      var p = $('#ptt');
      if (p) p.classList.add('show');
    }
    log('Jarvis prêt');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
