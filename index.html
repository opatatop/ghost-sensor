<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SUPRA LAB v12 — FONCTIONNEL</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            overflow: hidden;
            touch-action: manipulation;
        }
        #start-screen, #main {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #001100;
            border: 4px solid #00ff41;
            box-shadow: 0 0 30px #00ff41;
        }
        #main { display: none; padding: 10px; }
        #start-screen { text-align: center; }
        button {
            background: transparent;
            color: #00ff41;
            border: 3px solid #00ff41;
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            margin: 8px;
            font-family: 'Courier New', monospace;
        }
        button:hover { background: #00ff41; color: #000; }
        #log {
            position: fixed;
            bottom: 60px;
            left: 10px;
            right: 10px;
            max-height: 150px;
            overflow-y: auto;
            background: #001100;
            border: 2px solid #00ff41;
            padding: 8px;
            font-size: 14px;
        }
        .log-line { margin: 2px 0; }
        .log-line::before { content: "> "; color: #00cc33; }
        #status {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: #001100;
            border-top: 2px solid #00ff41;
            padding: 5px;
            font-size: 14px;
            text-align: center;
        }
        #voiceToggle {
            position: fixed;
            bottom: 60px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #00ff41;
            border: none;
            color: #000;
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
        }
        #micIndicator {
            position: fixed;
            bottom: 60px;
            left: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #001100;
            border: 3px solid #00cc33;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        #micIndicator.listening { background: #00ff41; border-color: #00ff41; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        canvas {
            background: #001100;
            border: 2px solid #00ff41;
            margin: 5px;
            display: block;
        }
        .panel {
            background: #001100;
            border: 2px solid #00ff41;
            padding: 8px;
            margin: 5px;
            position: relative;
        }
        .panel-header {
            position: absolute;
            top: -12px;
            left: 10px;
            background: #001100;
            padding: 0 8px;
            font-size: 14px;
        }
        #ai-report {
            background: #000;
            border: 2px dashed #00ff41;
            padding: 8px;
            margin: 5px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <!-- ÉCRAN DE DÉMARRAGE -->
    <div id="start-screen">
        <h1 style="color: #00ff41; text-shadow: 0 0 10px #00ff41;">SUPRA LAB v12</h1>
        <p style="color: #00cc33;">IA Vocale + Micro + Détection</p>
        <button id="btnStart">🚀 LANCER LE SYSTÈME</button>
        <button id="btnSettings">⚙️ PARAMÈTRES</button>
    </div>

    <!-- INTERFACE PRINCIPALE -->
    <div id="main">
        <div class="panel">
            <div class="panel-header">SPECTROGRAMME</div>
            <canvas id="spectrogram" width="400" height="200"></canvas>
            <div style="position: absolute; top: 10px; right: 10px; font-size: 14px;" id="dominant-freq">Fréq: -- MHz</div>
        </div>

        <div class="panel">
            <div class="panel-header">OSCILLOSCOPE</div>
            <canvas id="scope" width="400" height="200"></canvas>
        </div>

        <div class="panel">
            <div class="panel-header">RAPPORT IA</div>
            <div id="ai-report">[En attente d'analyse...]</div>
            <button id="readReportBtn" style="margin-top: 5px;">🔊 Lire le rapport</button>
        </div>

        <div id="log"></div>
        <div id="status">En attente...</div>
    </div>

    <!-- BOUTONS FLOTTANTS -->
    <button id="voiceToggle" title="Activer/Désactiver la voix">🎤</button>
    <div id="micIndicator" title="État du micro">🎙️</div>

    <!-- PAGE DE PARAMÈTRES -->
    <div id="settings-page" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 1000; padding: 20px; border: 4px solid #00ff41;">
        <h2 style="color: #00ff41; text-align: center;">⚙️ PARAMÈTRES</h2>
        <div style="margin: 10px 0;">
            <label style="display: block; margin: 5px 0;">
                <input type="checkbox" id="autoStartVoice" checked> Démarrer l'IA vocale automatiquement
            </label>
            <label style="display: block; margin: 5px 0;">
                <input type="checkbox" id="voiceFeedback" checked> Activer la voix pour les rapports
            </label>
            <label style="display: block; margin: 5px 0;">
                Clé API Groq: <input type="text" id="groqApiKey" style="background: #001100; color: #00ff41; border: 1px solid #00ff41; width: 100%;">
            </label>
        </div>
        <button id="saveSettings" style="margin-top: 10px;">💾 Sauvegarder</button>
        <button id="closeSettings" style="margin-top: 10px;">✕ Fermer</button>
    </div>

    <script>
        // ========== CONFIG ==========
        let config = {
            autoStartVoice: true,
            voiceFeedback: true,
            groqApiKey: ''
        };

        // ========== GLOBALS ==========
        let audioCtx, analyser, microphone, gainNode, mediaRecorder;
        let audioStream = null;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let isRunning = false;
        let isVoiceEnabled = false;
        let isListening = false;
        let frequencyArray, timeArray;
        let spectroHistory = [];

        // ========== FREQUENCY DB ==========
        const FREQUENCY_DB = {
            'AVIATION_EMERGENCY': { min: 121.4, max: 121.6, label: 'Aviation Emergency', critical: true },
            'DRONE_2_4': { min: 2400, max: 2483.5, label: 'Drone 2.4GHz', critical: true },
            'FM_RADIO': { min: 87.5, max: 108, label: 'FM Radio', critical: false }
        };
        const KEYWORDS = ['avion', 'drone', 'urgence', 'sos', 'alerte', 'danger'];

        // ========== UTILS ==========
        function log(text, important = false) {
            const logDiv = document.getElementById('log');
            if (!logDiv) return;
            const line = document.createElement('div');
            line.className = 'log-line';
            if (important) line.style.color = '#ff0044';
            line.innerHTML = `<span style="color: #00cc33;">[${new Date().toLocaleTimeString('fr-FR')}]</span> ${text}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(text) {
            const statusDiv = document.getElementById('status');
            if (statusDiv) statusDiv.textContent = text;
        }

        function speak(text) {
            if (!config.voiceFeedback || !isVoiceEnabled || !synthesis) return;
            try {
                synthesis.cancel(); // Annule toute lecture en cours
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 1.0;
                synthesis.speak(utterance);
            } catch (e) {
                log(`[VOIX] Erreur: ${e.message}`);
            }
        }

        // ========== AUDIO INIT ==========
        async function initAudio() {
            if (audioStream && !audioStream.getAudioTracks().some(t => t.readyState === 'ended')) {
                log("[AUDIO] Stream déjà actif");
                return true;
            }

            try {
                // Fermer l'ancien contexte et stream
                if (audioCtx) await audioCtx.close().catch(() => {});
                if (audioStream) audioStream.getTracks().forEach(t => t.stop());

                // Créer un nouveau contexte audio
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                await audioCtx.resume();

                // Demander le stream micro
                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: false
                    }
                });

                // Initialiser les nœuds audio
                microphone = audioCtx.createMediaStreamSource(audioStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 4096;
                gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.5;

                microphone.connect(analyser);
                analyser.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                // Initialiser les tableaux de données
                frequencyArray = new Uint8Array(analyser.frequencyBinCount);
                timeArray = new Uint8Array(analyser.frequencyBinCount);

                // Initialiser l'enregistreur
                mediaRecorder = new MediaRecorder(audioStream);
                mediaRecorder.ondataavailable = (e) => {
                    const blob = new Blob([e.data], { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `rec-${Date.now()}.webm`;
                    a.click();
                };

                isRunning = true;
                updateStatus("✅ Micro prêt");
                log("[AUDIO] Système audio activé");

                // Démarrer la boucle principale
                requestAnimationFrame(loop);

                // Démarrer l'IA vocale si configuré
                if (config.autoStartVoice) {
                    setTimeout(initSpeech, 500);
                }

                return true;
            } catch (err) {
                updateStatus(`❌ Erreur micro: ${err.message}`);
                log(`[ERREUR] ${err.message}`, true);
                document.getElementById('micIndicator').classList.add('error');
                return false;
            }
        }

        // ========== SPEECH RECOGNITION ==========
        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                log("[IA] Reconnaissance vocale non supportée (essayez Chrome/Firefox)", true);
                return;
            }

            try {
                if (recognition) {
                    recognition.stop();
                    recognition = null;
                }

                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'fr-FR';
                recognition.maxAlternatives = 1;

                let finalTranscript = '';

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript + ' ';
                            processTranscript(finalTranscript.trim());
                        } else {
                            interimTranscript += transcript;
                        }
                    }
                    if (interimTranscript) {
                        log(`[IA] (en cours) "${interimTranscript}"`);
                    }
                };

                recognition.onerror = (event) => {
                    log(`[IA ERREUR] ${event.error}`, true);
                    document.getElementById('micIndicator').classList.add('error');
                    if (event.error === 'not-allowed') {
                        updateStatus("❌ Permission micro refusée");
                    }
                };

                recognition.onstart = () => {
                    isListening = true;
                    isVoiceEnabled = true;
                    document.getElementById('micIndicator').classList.add('listening');
                    document.getElementById('micIndicator').textContent = '🎤';
                    updateStatus("🎤 Écoute en cours...");
                    log("[IA] Reconnaissance vocale activée");
                };

                recognition.onend = () => {
                    isListening = false;
                    document.getElementById('micIndicator').classList.remove('listening');
                    document.getElementById('micIndicator').textContent = '🎙️';
                    // Redémarrer automatiquement si l'IA vocale est activée
                    if (isVoiceEnabled) {
                        setTimeout(() => {
                            try {
                                if (recognition) recognition.start();
                            } catch (e) {
                                log(`[IA] Erreur redémarrage: ${e.message}`);
                            }
                        }, 1000);
                    }
                };

                recognition.start();
                isVoiceEnabled = true;
            } catch (e) {
                log(`[IA ERREUR] ${e.message}`, true);
            }
        }

        function stopSpeechRecognition() {
            if (recognition) {
                recognition.stop();
                isVoiceEnabled = false;
                isListening = false;
                document.getElementById('micIndicator').classList.remove('listening');
                document.getElementById('micIndicator').textContent = '🎙️';
                updateStatus("IA: Désactivée");
                log("[IA] Reconnaissance vocale arrêtée");
            }
        }

        function processTranscript(transcript) {
            if (!transcript) return;
            log(`[IA] 🎤 "${transcript}"`);

            // Vérifier les mots-clés
            const hasKeyword = KEYWORDS.some(kw => transcript.toLowerCase().includes(kw));
            if (hasKeyword) {
                log("[IA] ⚡ Mot-clé détecté ! Analyse IA déclenchée", true);
                triggerAIAnalysis(transcript);
                if (config.voiceAlerts) speak("Mot-clé détecté. Analyse IA en cours.");
            }
        }

        // ========== BAND DETECTION ==========
        function detectFrequencyBand(freq) {
            if (freq <= 0) return null;
            const freqMHz = freq / 1e6;
            for (const [name, data] of Object.entries(FREQUENCY_DB)) {
                if (freqMHz >= data.min && freqMHz <= data.max) return data;
            }
            return null;
        }

        function findDominantFrequency() {
            if (!analyser) return 0;
            analyser.getByteFrequencyData(frequencyArray);
            let maxIndex = 0;
            let maxValue = 0;
            // Ignorer les très basses fréquences (bruit)
            const startIndex = Math.floor(100 / (audioCtx.sampleRate / analyser.fftSize));
            for (let i = startIndex; i < frequencyArray.length; i++) {
                if (frequencyArray[i] > maxValue) {
                    maxValue = frequencyArray[i];
                    maxIndex = i;
                }
            }
            return maxIndex * (audioCtx.sampleRate / analyser.fftSize);
        }

        function updateBandDetection() {
            const dominantFreq = findDominantFrequency();
            const band = detectFrequencyBand(dominantFreq);
            const freqEl = document.getElementById('dominant-freq');
            if (freqEl) {
                freqEl.textContent = `Fréq: ${(dominantFreq/1e6).toFixed(3)} MHz${band ? ` (${band.label})` : ''}`;
                if (band && band.critical) {
                    freqEl.style.color = '#ff0044';
                    showAlert(`🚨 Bande critique: ${band.label}`);
                } else {
                    freqEl.style.color = '#00ff41';
                }
            }
        }

        function showAlert(message) {
            const alertBox = document.getElementById('criticalAlert') || (() => {
                const div = document.createElement('div');
                div.id = 'criticalAlert';
                div.style.position = 'fixed';
                div.style.top = '50%';
                div.style.left = '50%';
                div.style.transform = 'translate(-50%, -50%)';
                div.style.background = '#001100';
                div.style.border = '3px solid #ff0044';
                div.style.padding = '20px';
                div.style.color = '#ff0044';
                div.style.fontSize = '18px';
                div.style.textAlign = 'center';
                div.style.zIndex = '10000';
                div.style.display = 'none';
                document.body.appendChild(div);
                return div;
            })();
            alertBox.textContent = message;
            alertBox.style.display = 'block';
            setTimeout(() => alertBox.style.display = 'none', 3000);
        }

        // ========== DRAWING FUNCTIONS ==========
        function drawSpectrogram() {
            const canvas = document.getElementById('spectrogram');
            if (!canvas || !analyser) return;
            const ctx = canvas.getContext('2d');
            analyser.getByteFrequencyData(frequencyArray);
            spectroHistory.unshift([...frequencyArray]);
            if (spectroHistory.length > 100) spectroHistory.pop();
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width / frequencyArray.length;
            for (let y = 0; y < spectroHistory.length; y++) {
                for (let x = 0; x < spectroHistory[y].length; x++) {
                    const val = spectroHistory[y][x];
                    ctx.fillStyle = `hsl(${90 + val/2.5}, 100%, ${val/2.8}%)`;
                    ctx.fillRect(x * w, y * 2, w + 1, 2);
                }
            }
        }

        function drawScope() {
            const canvas = document.getElementById('scope');
            if (!canvas || !analyser) return;
            const ctx = canvas.getContext('2d');
            analyser.getByteTimeDomainData(timeArray);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#00ff41';
            ctx.lineWidth = 2;
            ctx.beginPath();
            const slice = canvas.width / timeArray.length;
            for (let i = 0; i < timeArray.length; i++) {
                const y = (timeArray[i] / 128) * canvas.height / 2;
                i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * slice, y);
            }
            ctx.stroke();
        }

        // ========== MAIN LOOP ==========
        function loop() {
            if (!isRunning) return;
            updateBandDetection();
            drawSpectrogram();
            drawScope();
            requestAnimationFrame(loop);
        }

        // ========== AI ANALYSIS ==========
        function generateReport(rms, freq, band, transcript) {
            return `
[RAPPORT SIGINT - ${new Date().toLocaleTimeString('fr-FR')}]
Fréquence: ${(freq/1e6).toFixed(3)} MHz
Bande: ${band ? band.label : 'Inconnue'}
RMS: ${rms.toFixed(2)} dB
Transcription: "${transcript || 'Aucune'}"
Statut: ${band && band.critical ? '🚨 CRITIQUE' : '✅ Normal'}
            `.trim();
        }

        function triggerAIAnalysis(transcript = "") {
            if (!isRunning) return;

            analyser.getByteFrequencyData(frequencyArray);
            const rms = Math.sqrt(frequencyArray.reduce((a,b) => a + b*b, 0) / frequencyArray.length) / 128;
            const freq = findDominantFrequency();
            const band = detectFrequencyBand(freq);

            const report = generateReport(rms, freq, band, transcript);
            const reportDiv = document.getElementById('ai-report');
            if (reportDiv) reportDiv.textContent = report;

            log(`[IA] Rapport généré: ${band ? band.label : 'Aucune bande'}`);

            if (config.voiceFeedback && isVoiceEnabled) {
                speak(report);
            }

            if (config.groqApiKey) {
                sendToGroq(report);
            }
        }

        async function sendToGroq(report) {
            try {
                const response = await fetch('https://api.groq.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.groqApiKey}`
                    },
                    body: JSON.stringify({
                        model: "mixtral-8x7b-32768",
                        messages: [{
                            role: "user",
                            content: `Analyse ce rapport SIGINT:\n${report}\nClassifie la menace et donne des recommandations en français.`
                        }],
                        temperature: 0.3,
                        max_tokens: 512
                    })
                });
                if (!response.ok) throw new Error("Erreur Groq API");
                const data = await response.json();
                const aiReportDiv = document.getElementById('ai-report');
                if (aiReportDiv) {
                    aiReportDiv.textContent += `\n\n[RÉPONSE GROQ]\n${data.choices[0].message.content}`;
                }
                log("[GROQ] Analyse terminée");
            } catch (e) {
                log(`[GROQ] Erreur: ${e.message}`, true);
            }
        }

        // ========== SETUP UI ==========
        function setupUI() {
            // Bouton Lancer le système
            document.getElementById('btnStart').addEventListener('click', async () => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main').style.display = 'block';

                // Initialiser tout
                await initAudio();
                resizeCanvases();
                window.addEventListener('resize', resizeCanvases);

                // Bouton Voice Toggle
                document.getElementById('voiceToggle').addEventListener('click', () => {
                    isVoiceEnabled = !isVoiceEnabled;
                    if (isVoiceEnabled) {
                        initSpeech();
                        document.getElementById('voiceToggle').style.background = '#ff0044';
                    } else {
                        stopSpeechRecognition();
                        document.getElementById('voiceToggle').style.background = '#00ff41';
                    }
                });

                // Bouton Lire le rapport
                document.getElementById('readReportBtn').addEventListener('click', () => {
                    const report = document.getElementById('ai-report').textContent;
                    if (report && report !== '[En attente d\'analyse...]') {
                        speak(report);
                    }
                });
            });

            // Bouton Paramètres
            document.getElementById('btnSettings').addEventListener('click', () => {
                document.getElementById('settings-page').style.display = 'block';
            });

            // Bouton Fermer les paramètres
            document.getElementById('closeSettings').addEventListener('click', () => {
                document.getElementById('settings-page').style.display = 'none';
            });

            // Bouton Sauvegarder les paramètres
            document.getElementById('saveSettings').addEventListener('click', () => {
                config.autoStartVoice = document.getElementById('autoStartVoice').checked;
                config.voiceFeedback = document.getElementById('voiceFeedback').checked;
                config.groqApiKey = document.getElementById('groqApiKey').value;
                localStorage.setItem('supraLabConfig', JSON.stringify(config));
                document.getElementById('settings-page').style.display = 'none';
                log("[PARAM] Configuration sauvegardée");
            });

            // Charger la config sauvegardée
            const savedConfig = localStorage.getItem('supraLabConfig');
            if (savedConfig) {
                try {
                    config = { ...config, ...JSON.parse(savedConfig) };
                    document.getElementById('autoStartVoice').checked = config.autoStartVoice;
                    document.getElementById('voiceFeedback').checked = config.voiceFeedback;
                    document.getElementById('groqApiKey').value = config.groqApiKey;
                } catch (e) {
                    console.error("Erreur chargement config:", e);
                }
            }
        }

        function resizeCanvases() {
            const canvases = document.querySelectorAll('canvas');
            canvases.forEach(canvas => {
                const container = canvas.parentElement;
                if (container) {
                    const rect = container.getBoundingClientRect();
                    canvas.width = rect.width - 16;
                    canvas.height = rect.height - 30;
                }
            });
        }

        // ========== INIT ==========
        window.addEventListener('DOMContentLoaded', () => {
            setupUI();
            log("=== SUPRA LAB v12 PRÊT ===");
            log("Cliquez sur 'LANCER LE SYSTÈME' pour commencer");
        });

        window.addEventListener('beforeunload', () => {
            stopSpeechRecognition();
            if (audioStream) audioStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close().catch(() => {});
        });
    </script>
</body>
</html>
