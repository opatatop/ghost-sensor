<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎤 SUPRA LAB - PRÊT À L'EMPLOI</title>
    <style>
        :root { --primary: #00ff41; --danger: #ff0044; --bg: #000; --bg-dark: #001100; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
        body { background: var(--bg); color: var(--primary); min-height: 100vh; padding: 15px; }
        #start-screen, #main { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; background: var(--bg); }
        #main { display: none; }
        .boot-text { font-size: 22px; margin-bottom: 25px; text-shadow: 0 0 10px var(--primary); text-align: center; }
        button { background: var(--bg-dark); color: var(--primary); border: 2px solid var(--primary); padding: 12px 24px; margin: 10px; cursor: pointer; font-size: 16px; }
        button:hover { background: var(--primary); color: var(--bg); }
        #btnStart { padding: 15px 30px; font-size: 18px; }
        .panel { background: var(--bg-dark); border: 1px solid var(--primary); padding: 15px; margin: 10px 0; width: 100%; }
        .panel-header { margin-bottom: 10px; font-size: 16px; color: #00cc33; }
        #log { height: 250px; overflow-y: auto; font-size: 14px; white-space: pre-wrap; }
        .log-line { margin-bottom: 5px; }
        .log-line::before { content: "> "; color: #00cc33; }
        #ai-report { min-height: 150px; font-size: 14px; white-space: pre-wrap; background: var(--bg-dark); border: 1px dashed var(--primary); padding: 15px; }
        .status-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-dark); border-top: 1px solid var(--primary); padding: 8px; font-size: 14px; display: flex; justify-content: space-between; }
        #voiceToggle { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; border-radius: 50%; background: var(--primary); border: none; color: var(--bg); font-size: 20px; cursor: pointer; }
        #micIndicator { position: fixed; bottom: 20px; left: 20px; width: 50px; height: 50px; border-radius: 50%; background: var(--bg-dark); border: 2px solid #00cc33; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        #micIndicator.listening { background: var(--primary); border-color: var(--primary); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .alert { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-dark); border: 2px solid var(--danger); padding: 15px; font-size: 16px; text-align: center; z-index: 20000; display: none; }
        .alert.active { display: block; }
    </style>
</head>
<body>
    <!-- ÉCRAN DE DÉMARRAGE -->
    <div id="start-screen">
        <div class="boot-text">
            🎤 SUPRA LAB
            <div style="color: #ffaa00;">PRÊT À L'EMPLOI</div>
        </div>
        <button id="btnStart">🚀 LANCER</button>
    </div>

    <!-- INTERFACE PRINCIPALE -->
    <div id="main">
        <div class="panel">
            <div class="panel-header">🤖 TRANSCRIPTION</div>
            <div id="ai-report">[PRÊT]</div>
            <div style="margin-top: 10px; text-align: center;">
                <button id="sendToGroqBtn">📤 ENVOYER À GROQ</button>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header">📜 JOURNAL</div>
            <div id="log"></div>
        </div>
    </div>

    <!-- BOUTONS VOIX -->
    <button id="voiceToggle" title="Activer/Désactiver la voix">🎤</button>
    <div id="micIndicator" title="État du micro">🎤</div>

    <!-- BARRE DE STATUS -->
    <div class="status-bar">
        <span id="status-text">En attente...</span>
        <span>v11 - Prêt à l'emploi</span>
    </div>

    <!-- ALERTE -->
    <div class="alert" id="criticalAlert">⚠️ ALERTE : <span id="alert-message"></span></div>

    <script>
        // CONFIG (ta clé est pré-remplie)
        const config = {
            groqApiKey: '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',
            voiceFeedback: true,
            voiceLanguage: 'fr-FR'
        };
        let finalTranscript = '';
        let recognition = null;
        let isListening = false;
        let isVoiceEnabled = false;
        let synthesis = window.speechSynthesis;
        let isSpeaking = false;

        // Liste des relais publics à essayer (par ordre)
        const RELAYS = [
            'https://supra-lab-relay.glitch.me',      // Relais principal
            'https://corsproxy.io/?',                 // Proxy CORS 1
            'https://api.allorigins.win/get?url='     // Proxy CORS 2
        ];
        let currentRelayIndex = 0;

        // INIT
        document.addEventListener('DOMContentLoaded', () => {
            setupUI();
            loadVoices();
        });

        // BASE FUNCTIONS
        function log(text, important = false) {
            const logDiv = document.getElementById('log');
            if (!logDiv) return;
            const line = document.createElement('div');
            line.className = 'log-line' + (important ? ' important' : '');
            line.innerHTML = `<span style="color: #00ff00;">[${new Date().toLocaleTimeString('fr-FR')}]</span> ${text}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(txt) {
            document.getElementById('status-text').textContent = txt;
        }

        function showAlert(message) {
            const alertBox = document.getElementById('criticalAlert');
            const alertMsg = document.getElementById('alert-message');
            if (alertMsg) alertMsg.textContent = message;
            if (alertBox) {
                alertBox.classList.add('active');
                setTimeout(() => alertBox.classList.remove('active'), 5000);
            }
            log(`⚠️ ALERTE: ${message}`, true);
        }

        function loadVoices() {
            if ('speechSynthesis' in window) {
                synthesis.getVoices();
                if (synthesis.onvoiceschanged) synthesis.onvoiceschanged = loadVoices;
            }
        }

        function getVoice(lang) {
            const voices = synthesis.getVoices();
            return voices.find(v => v.lang.startsWith(lang)) || voices[0];
        }

        function speakText(text) {
            if (!config.voiceFeedback || !isVoiceEnabled || !synthesis) return;
            if (isSpeaking) synthesis.cancel();
            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = config.voiceLanguage;
                utterance.voice = getVoice(config.voiceLanguage);
                utterance.onend = () => isSpeaking = false;
                synthesis.speak(utterance);
                isSpeaking = true;
                log(`[VOIX] "${text}"`);
            } catch (e) {
                log(`[VOIX ERREUR] ${e.message}`, true);
            }
        }

        function stopSpeaking() {
            if (synthesis) synthesis.cancel();
            isSpeaking = false;
        }

        // PERMISSIONS
        async function checkMicrophonePermission() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                log("[OK] Micro autorisé", true);
                return true;
            } catch (err) {
                log(`[ERREUR] ${err.message}`, true);
                showAlert("Activez le micro dans les paramètres !");
                return false;
            }
        }

        // TROUVE UN RELAIS FONCTIONNEL
        async function findWorkingRelay() {
            log("[RELAIS] Recherche d'un relais fonctionnel...", true);
            updateStatus("Recherche relais...");

            for (let i = 0; i < RELAYS.length; i++) {
                try {
                    // Teste le relais avec une requête simple
                    const testUrl = RELAYS[i] + (RELAYS[i].endsWith('?') || RELAYS[i].endsWith('=') ? '' : '/') + 'https://httpbin.org/get';
                    const response = await fetch(testUrl, { method: 'GET', cache: 'no-store' });
                    if (response.ok) {
                        currentRelayIndex = i;
                        log(`[OK] Relais trouvé: ${RELAYS[i]}`, true);
                        updateStatus("Relais configuré");
                        return RELAYS[i];
                    }
                } catch (error) {
                    log(`[ERREUR] Relais ${RELAYS[i]} inaccessible: ${error.message}`, true);
                }
            }

            log("[ERREUR] Aucun relais fonctionnel trouvé", true);
            updateStatus("Mode hors ligne");
            return null;
        }

        // TEST CLÉ API VIA RELAIS
        async function testGroqApiKey() {
            const relayUrl = await findWorkingRelay();
            if (!relayUrl) {
                showAlert("Aucun relais disponible. Essayez une autre connexion Internet.");
                return;
            }

            log(`[GROQ] Test de la clé via ${relayUrl}...`, true);
            updateStatus("Test API...");

            try {
                // Adaptation de l'URL du relais selon son type
                let endpoint;
                if (relayUrl === 'https://corsproxy.io/?') {
                    endpoint = `${relayUrl}https://api.groq.com/v1/chat/completions`;
                } else if (relayUrl === 'https://api.allorigins.win/get?url=') {
                    endpoint = `${relayUrl}https://api.groq.com/v1/chat/completions`;
                } else {
                    endpoint = `${relayUrl}/test-key`;
                }

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.groqApiKey}`
                    },
                    body: JSON.stringify({
                        model: "mixtral-8x7b-32768",
                        messages: [{ role: "user", content: "Réponds 'OK' si tu reçois ce message." }],
                        temperature: 0.3,
                        max_tokens: 10
                    })
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(`Erreur ${response.status}: ${error.error || 'Inconnue'}`);
                }

                const data = await response.json();
                if (data.choices && data.choices[0].message.content.trim() === "OK") {
                    log("[OK] Clé API VALIDE !", true);
                    updateStatus("Prêt");
                    localStorage.setItem('groqApiKey', config.groqApiKey);
                } else {
                    log("[ERREUR] Réponse inattendue", true);
                    updateStatus("Erreur");
                }
            } catch (error) {
                log(`[ERREUR] ${error.message}`, true);
                updateStatus("Erreur");
                showAlert(`Erreur: ${error.message}`);

                // Si échec, essaie le relais suivant
                currentRelayIndex++;
                if (currentRelayIndex < RELAYS.length) {
                    log(`[RELAIS] Essai avec ${RELAYS[currentRelayIndex]}...`, true);
                    testGroqApiKey();
                }
            }
        }

        // RECONNAISSANCE VOCALE
        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                log("[ERREUR] Reconnaissance vocale non supportée", true);
                showAlert("Utilisez Chrome");
                return;
            }

            try {
                if (recognition) recognition.stop();

                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'fr-FR';

                finalTranscript = '';

                recognition.onresult = (event) => {
                    let interim = '';
                    let final = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const trans = event.results[i][0].transcript;
                        if (event.results[i].isFinal) final += trans;
                        else interim += trans;
                    }
                    if (interim) log(`[IA] "${interim}"`);
                    if (final) {
                        finalTranscript = final.trim();
                        log(`[IA] ✅ "${finalTranscript}"`);
                        document.getElementById('ai-report').textContent =
                            `// TRANSCRIPTION\n> "${finalTranscript}"\n\n// STATUT: Prêt pour analyse`;
                        if (config.groqApiKey) sendToGroq(finalTranscript);
                        if (config.voiceFeedback) speakText(`Reçu: ${finalTranscript}`);
                    }
                };

                recognition.onerror = (event) => {
                    log(`[ERREUR] ${event.error}`, true);
                    if (event.error === 'not-allowed') showAlert("Micro bloqué !");
                    if (isVoiceEnabled) setTimeout(initSpeech, 1000);
                };

                recognition.onstart = () => {
                    isListening = true;
                    isVoiceEnabled = true;
                    log("[OK] Écoute activée", true);
                    updateStatus("Écoute...");
                    document.getElementById('micIndicator').classList.add('listening');
                    document.getElementById('voiceToggle').classList.add('active');
                };

                recognition.onend = () => {
                    isListening = false;
                    updateStatus("Prêt");
                    document.getElementById('micIndicator').classList.remove('listening');
                    document.getElementById('voiceToggle').classList.remove('active');
                    if (isVoiceEnabled) setTimeout(initSpeech, 100);
                };

                recognition.start();
            } catch (e) {
                log(`[ERREUR] ${e.message}`, true);
            }
        }

        function stopSpeechRecognition() {
            if (recognition) {
                recognition.stop();
                isVoiceEnabled = false;
                isListening = false;
                updateStatus("Désactivé");
                document.getElementById('micIndicator').classList.remove('listening');
                document.getElementById('voiceToggle').classList.remove('active');
            }
        }

        // ENVOI À GROQ VIA RELAIS
        async function sendToGroq(transcript) {
            if (!config.groqApiKey) {
                log("[ERREUR] Clé API manquante", true);
                return;
            }

            const relayUrl = RELAYS[currentRelayIndex];
            if (!relayUrl) {
                log("[ERREUR] Aucun relais disponible", true);
                return;
            }

            try {
                log(`[GROQ] Envoi via ${relayUrl}...`, true);
                updateStatus("Envoi à Groq...");

                // Adaptation de l'URL selon le relais
                let endpoint;
                if (relayUrl === 'https://corsproxy.io/?') {
                    endpoint = `${relayUrl}https://api.groq.com/v1/chat/completions`;
                } else if (relayUrl === 'https://api.allorigins.win/get?url=') {
                    endpoint = `${relayUrl}https://api.groq.com/v1/chat/completions`;
                } else {
                    endpoint = `${relayUrl}/send`;
                }

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.groqApiKey}`
                    },
                    body: JSON.stringify({
                        model: "mixtral-8x7b-32768",
                        messages: [{
                            role: "user",
                            content: `Analyse cette phrase en français: "${transcript}". Donne une réponse concise.`
                        }],
                        temperature: 0.3,
                        max_tokens: 256
                    })
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(`Erreur ${response.status}: ${error.error || 'Inconnue'}`);
                }

                const data = await response.json();
                const reply = data.choices ? data.choices[0].message.content : data.contents;
                document.getElementById('ai-report').textContent += `\n\n// RÉPONSE GROQ\n${reply}\n// =====`;
                if (config.voiceFeedback) speakText(`Groq: ${reply.split('\n')[0]}`);
                log("[OK] Réponse reçue", true);
                updateStatus("Prêt");
            } catch (error) {
                log(`[ERREUR] ${error.message}`, true);
                updateStatus("Erreur Groq");
                showAlert(`Erreur: ${error.message}`);

                // Si échec, essaie le relais suivant
                currentRelayIndex = (currentRelayIndex + 1) % RELAYS.length;
                if (currentRelayIndex < RELAYS.length) {
                    log(`[RELAIS] Essai avec ${RELAYS[currentRelayIndex]}...`, true);
                    sendToGroq(transcript);
                }
            }
        }

        // UI SETUP
        function setupUI() {
            document.getElementById('btnStart').addEventListener('click', async () => {
                const start = document.getElementById('start-screen');
                const main = document.getElementById('main');
                if (!start || !main) return;

                const ok = await checkMicrophonePermission();
                if (!ok) return;

                start.style.display = 'none';
                main.style.display = 'block';
                log("=== SYSTÈME LANCÉ ===");
                updateStatus("Prêt");

                const btnIA = document.createElement('button');
                btnIA.textContent = '🎤 ACTIVER VOIX';
                btnIA.id = 'btnStartIA';
                btnIA.style.cssText = 'margin: 10px;';
                document.querySelector('#main .panel:first-child').appendChild(btnIA);

                btnIA.addEventListener('click', () => {
                    isVoiceEnabled ? stopSpeechRecognition() : initSpeech();
                });

                // Teste automatiquement la clé API au démarrage
                testGroqApiKey();
            });

            document.getElementById('voiceToggle').addEventListener('click', () => {
                isVoiceEnabled = !isVoiceEnabled;
                if (isVoiceEnabled && !isListening) initSpeech();
                else if (!isVoiceEnabled) stopSpeechRecognition();
            });

            document.getElementById('sendToGroqBtn').addEventListener('click', () => {
                if (!finalTranscript) {
                    log("[ERREUR] Rien à envoyer", true);
                    return;
                }
                sendToGroq(finalTranscript);
            });
        }

        // CLEANUP
        window.addEventListener('beforeunload', () => {
            stopSpeechRecognition();
            stopSpeaking();
            if (recognition) recognition.stop();
        });
    </script>
</body>
</html>
