<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS ARCHITECT v20.1 - POLYGLOT TRANSLATOR RÉEL LIVE</title>
    <style>
        :root {
            --bg: #020202; --panel: #0a0f12; --primary: #00f3ff;
            --trans: #ffe600; --ghost: #bc13fe; --demon: #ff003c;
            --text: #e0f7fa; --dim: #445566; --font-mono: 'Consolas', 'Courier New', monospace;
        }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; overflow-y: auto; }
        header { background: rgba(0,0,0,0.9); border-bottom: 1px solid #333; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .brand { font-size: 1.1rem; font-weight: bold; color: var(--primary); letter-spacing: 2px; font-family: var(--font-mono); }
        .clock { font-family: var(--font-mono); color: #888; font-size: 0.9rem; }
        #main-layout { display: flex; flex-wrap: wrap; flex: 1; }
        aside { background: var(--panel); padding: 15px; font-family: var(--font-mono); font-size: 0.75rem; flex: 1; min-width: 250px; border-right: 1px solid #222; display: flex; flex-direction: column; }
        aside:last-child { border-right: none; border-left: 1px solid #222; }
        .panel-title { color: #666; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; font-weight: bold; }
        #logs { flex: 1; overflow-y: auto; color: #888; display: flex; flex-direction: column-reverse; max-height: 300px; }
        .log { margin-bottom: 4px; border-left: 2px solid #333; padding-left: 5px; font-size: 0.7rem; }
        .log.detected { color: var(--primary); border-color: var(--primary); }
        .log.speech { color: #fff; border-color: #fff; background: rgba(255,255,255,0.05); }
        .log.translate { color: var(--trans); border-color: var(--trans); font-weight: bold; }
        #stage { flex: 3; min-width: 300px; min-height: 400px; background: radial-gradient(circle at center, #0d1418 0%, #000 100%); position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #display-overlay { position: absolute; z-index: 5; text-align: center; pointer-events: none; width: 90%; }
        #main-text { font-size: 2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 20px #000; margin-bottom: 10px; transition: color 0.3s; }
        #sub-text { font-size: 0.9rem; background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 20px; border: 1px solid #444; color: #ccc; }
        #controls { background: var(--panel); border-top: 1px solid #333; padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; width: 100%; flex-shrink: 0; }
        .control-group { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 10px; }
        button { background: #111; border: 1px solid #444; color: #aaa; padding: 12px; font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase; cursor: pointer; transition: 0.2s; border-radius: 4px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:hover { background: #222; color: #fff; }
        button.active { border-color: var(--primary); color: var(--primary); background: rgba(0, 243, 255, 0.1); }
        button.trans-active { border-color: var(--trans); color: var(--trans); background: rgba(255, 230, 0, 0.1); animation: pulse-yellow 2s infinite; }
        @keyframes pulse-yellow { 0% { box-shadow: 0 0 0 0 rgba(255, 230, 0, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 230, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 230, 0, 0); } }
        .btn-power { height: 60px; font-weight: bold; font-size: 1.1rem; }
        .slider-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        .slider-label { display: flex; justify-content: space-between; color: #aaa; font-size: 0.75rem; font-family: var(--font-mono); }
        input[type="range"] { width: 100%; height: 6px; background: #222; outline: none; -webkit-appearance: none; border-radius: 3px; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .bar-container { width: 100%; height: 8px; background: #222; border-radius: 4px; overflow: hidden; margin-top: 2px; }
        .bar-fill { height: 100%; transition: width 0.1s; }
        @media (max-width: 800px) { #main-layout { flex-direction: column; } aside { width: 100%; border-right: none; border-bottom: 1px solid #222; min-height: auto; } #stage { height: 350px; flex: none; } #controls { flex-direction: column; } }
    </style>
</head>
<body>
    <header>
        <div class="brand">JARVIS ARCHITECT v20.1 - POLYGLOT RÉEL LIVE</div>
        <div class="clock" id="clock">00:00:00</div>
    </header>
    <div id="main-layout">
        <!-- LOGS -->
        <aside>
            <div class="panel-title">TRADUCTION & LOGS RÉELS</div>
            <div id="logs"></div>
        </aside>
        <!-- VISUEL -->
        <div id="stage">
            <canvas id="mainCanvas"></canvas>
            <div id="display-overlay">
                <div id="main-text" style="color:var(--primary)">VEILLE</div>
                <div id="sub-text">Parlez → Jarvis répond en direct</div>
            </div>
        </div>
        <!-- ANALYSE -->
        <aside>
            <div class="panel-title">ANALYSE AUDIO RÉELLE</div>
            <div style="margin-bottom: 15px;">
                <div class="slider-label"><span>BASSES (Démons)</span> <span id="val-bass">0%</span></div>
                <div class="bar-container"><div id="bar-bass" class="bar-fill" style="background:var(--demon); width:0%"></div></div>
            </div>
            <div style="margin-bottom: 15px;">
                <div class="slider-label"><span>AIGUS (Fantômes)</span> <span id="val-treble">0%</span></div>
                <div class="bar-container"><div id="bar-treble" class="bar-fill" style="background:var(--ghost); width:0%"></div></div>
            </div>
            <div style="margin-bottom: 15px;">
                <div class="slider-label"><span>VOLUME TOTAL</span> <span id="val-vol">0%</span></div>
                <div class="bar-container"><div id="bar-vol" class="bar-fill" style="background:var(--primary); width:0%"></div></div>
            </div>
            <div class="panel-title" style="margin-top:20px;">RÉGLAGES</div>
            <div class="slider-row">
                <div class="slider-label">SENSIBILITÉ <span id="sens-val">50</span></div>
                <input type="range" id="rng-sens" min="0" max="100" value="50" oninput="Config.update('sens', this.value)">
            </div>
            <button onclick="AudioSys.calibrate()">🎚️ CALIBRER LE SILENCE</button>
        </aside>
    </div>
    <!-- CONTROLS -->
    <div id="controls">
        <div class="control-group">
            <button id="btn-power" class="btn-power" onclick="App.togglePower()">⚡ DÉMARRER JARVIS</button>
            <button id="btn-translate" onclick="App.toggleTranslate()">🌐 MODE TRADUCTEUR (FR → EN)</button>
            <div style="font-size:0.75rem; color:#666; text-align:center; margin-top:5px;">Parlez → Jarvis répond TOUT DE SUITE (même sans commande)</div>
        </div>
        <div class="control-group">
            <div class="panel-title">MODES</div>
            <button id="mod-normal" class="active" onclick="App.setMode('normal')">👁️ STANDARD</button>
            <button id="mod-ghost" onclick="App.setMode('ghost')">👻 FANTÔMES</button>
            <button id="mod-demon" onclick="App.setMode('demon')">😈 DÉMONS</button>
        </div>
        <div class="control-group">
            <div class="panel-title">OPTIONS</div>
            <button id="mod-humor" class="active" onclick="App.toggle('humor')">🗣️ HUMEUR</button>
            <button id="mod-voice" class="active" onclick="App.toggle('voice')">🎙️ RÉPONSE VOCALE</button>
            <button onclick="App.clearLogs()" style="margin-top:auto; font-size:0.7rem; opacity:0.6;">🗑️ Effacer logs</button>
        </div>
    </div>

    <script>
        // ==================== CONFIG ====================
        const Config = {
            sens: 50,
            thresholdVol: 15,
            translateMode: false,
            update(key, val) {
                this[key] = parseInt(val);
                if (key === 'sens') {
                    document.getElementById('sens-val').innerText = val;
                }
            }
        };

        const State = {
            active: false,
            mode: 'normal',
            options: { humor: true, voice: true },
            lastEvent: 0
        };

        // ==================== DICTIONNAIRE + RÉPONSES RÉELLES ====================
        const Translator = {
            dict: {
                "bonjour": "hello", "salut": "hi", "comment ça va": "how are you",
                "qui es-tu": "who are you", "merci": "thank you", "aide-moi": "help me",
                "réponds moi": "yes i'm here", "parle": "speak", "qui es tu": "who are you"
            },
            translate(text) {
                let res = text;
                const lower = text.toLowerCase();
                for (let fr in this.dict) {
                    if (lower.includes(fr)) {
                        const regex = new RegExp(fr, 'gi');
                        res = res.replace(regex, this.dict[fr]);
                    }
                }
                return res;
            }
        };

        // ==================== AUDIO ENGINE ====================
        const AudioSys = {
            ctx: null,
            analyser: null,
            source: null,
            freqData: null,
            timeData: null,
            async init() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, sampleRate: 44100 } });
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 2048;
                    this.source = this.ctx.createMediaStreamSource(stream);
                    this.source.connect(this.analyser);
                    this.freqData = new Uint8Array(this.analyser.frequencyBinCount);
                    this.timeData = new Uint8Array(this.analyser.frequencyBinCount);
                    Log.add("Micro connecté – écoute réelle activée", "ok");
                    return true;
                } catch (e) {
                    Log.add("Micro refusé", "err");
                    return false;
                }
            },
            analyze() {
                if (!this.analyser) return { volume: 0, bassAvg: 0, trebleAvg: 0 };
                this.analyser.getByteFrequencyData(this.freqData);
                this.analyser.getByteTimeDomainData(this.timeData);
                let sum = 0;
                for (let i = 0; i < this.timeData.length; i++) {
                    const x = (this.timeData[i] / 128) - 1;
                    sum += x * x;
                }
                const volume = Math.min(100, Math.sqrt(sum / this.timeData.length) * 180);
                let bass = 0, treble = 0;
                for (let i = 0; i < 30; i++) bass += this.freqData[i];
                for (let i = 150; i < 400; i++) treble += this.freqData[i];
                return { volume, bassAvg: bass / 30, trebleAvg: treble / 250 };
            }
        };

        // ==================== RECOGNITION RÉELLE (TOUT CAPTÉ + RÉPONSE) ====================
        let RecognitionEngine = {
            rec: null,
            active: false,
            init() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) { Log.add("Reconnaissance non supportée (Chrome/Edge)", "err"); return false; }
                this.rec = new SR();
                this.rec.continuous = true;
                this.rec.interimResults = true;
                this.rec.lang = 'fr-FR';
                this.rec.onresult = e => {
                    let txt = '';
                    for (let i = e.resultIndex; i < e.results.length; i++) txt += e.results[i][0].transcript;
                    if (!txt.trim()) return;

                    Log.add(`VOUS : ${txt}`, "speech");
                    document.getElementById('main-text').innerText = txt.toUpperCase();

                    // RÉPONSE IMMÉDIATE À TOUT
                    const lower = txt.toLowerCase();
                    if (lower.includes('réponds') || lower.includes('parle') || lower.includes('qui es tu') || lower.includes('répond moi')) {
                        ChatBrain.respondToUser(txt);
                    } else if (Config.translateMode) {
                        const trans = Translator.translate(txt);
                        Log.add(`TRADUCTION : ${txt} → ${trans}`, "translate");
                        Voice.speak(trans, 'english');
                    } else {
                        ChatBrain.process(txt);
                    }
                };
                this.rec.onerror = e => Log.add(`Erreur micro : ${e.error}`, "err");
                this.rec.onend = () => { if (this.active) this.rec.start(); };
                return true;
            },
            start() { if (!this.rec || this.active) return; this.rec.start(); this.active = true; Log.add("ÉCOUTE RÉELLE ACTIVÉE", "ok"); },
            stop() { if (this.rec) { this.rec.stop(); this.active = false; } }
        };

        // ==================== VOICE & RÉPONSES ====================
        const Voice = {
            synth: window.speechSynthesis,
            voices: [],
            init() {
                this.voices = this.synth.getVoices();
                this.synth.onvoiceschanged = () => this.voices = this.synth.getVoices();
            },
            speak(text, lang = 'fr') {
                this.synth.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = lang === 'english' ? 'en-US' : 'fr-FR';
                u.rate = lang === 'english' ? 1.05 : 0.98;
                const voice = this.voices.find(v => v.lang.includes(lang === 'english' ? 'en' : 'fr')) || this.voices[0];
                if (voice) u.voice = voice;
                this.synth.speak(u);
            }
        };

        // ==================== CHATBRAIN (RÉPOND À TOUT) ====================
        const ChatBrain = {
            process(txt) {
                const lower = txt.toLowerCase();
                let response = "J'ai capté : " + txt;

                if (lower.includes("bonjour") || lower.includes("salut")) response = "Bonjour ! Comment puis-je vous aider ?";
                else if (lower.includes("qui es tu")) response = "Je suis Jarvis Architect, votre IA polyglotte.";
                else if (lower.includes("merci")) response = "Avec plaisir.";
                else if (State.mode === 'ghost') response = ["Je suis juste derrière toi...", "Il fait froid ici...", "Laisse-moi tranquille..."][Math.floor(Math.random()*3)];
                else if (State.mode === 'demon') response = ["Tu ne devrais pas être là...", "Je vais te prendre...", "Fuis maintenant !"][Math.floor(Math.random()*3)];

                Voice.speak(response, State.mode === 'normal' ? 'fr' : 'fr');
                Log.add(`JARVIS : ${response}`, "detected");
            },
            respondToUser(txt) {
                const responses = [
                    "Oui je suis là... que veux-tu ?",
                    "Je t'écoute... parle.",
                    "Entité très proche... tu m'as appelé ?",
                    "Je réponds seulement à toi maintenant.",
                    "Je suis juste à côté de toi."
                ];
                const rep = responses[Math.floor(Math.random() * responses.length)];
                Voice.speak(rep, 'fr');
                Log.add(`ENTITÉ RÉPOND : ${rep}`, "detected");
                document.getElementById('main-text').innerText = "RÉPONSE DIRECTE";
            }
        };

        // ==================== VISUALS ====================
        const Visuals = {
            canvas: null,
            ctx: null,
            resize() {
                this.canvas = document.getElementById('mainCanvas');
                this.canvas.width = this.canvas.parentElement.clientWidth;
                this.canvas.height = this.canvas.parentElement.clientHeight;
            },
            draw(volume) {
                const ctx = this.ctx || (this.ctx = this.canvas.getContext('2d'));
                const w = this.canvas.width, h = this.canvas.height;
                ctx.fillStyle = 'rgba(2,2,2,0.25)';
                ctx.fillRect(0, 0, w, h);

                const cx = w / 2, cy = h / 2;
                const radius = 40 + (volume / 100) * 80;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.shadowBlur = 40;
                ctx.shadowColor = Config.translateMode ? '#ffe600' : (State.mode === 'ghost' ? '#bc13fe' : (State.mode === 'demon' ? '#ff003c' : '#00f3ff'));
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.strokeStyle = ctx.shadowColor;
                ctx.lineWidth = 6;
                ctx.stroke();
                ctx.restore();
            }
        };

        // ==================== LOGS ====================
        const Log = {
            add(msg, type = '') {
                const d = document.createElement('div');
                d.className = `log ${type}`;
                d.innerText = `[${new Date().toLocaleTimeString('fr-FR')}] ${msg}`;
                const logs = document.getElementById('logs');
                logs.prepend(d);
                if (logs.children.length > 25) logs.lastChild.remove();
            }
        };

        // ==================== APP ====================
        const App = {
            async togglePower() {
                State.active = !State.active;
                const btn = document.getElementById('btn-power');
                if (State.active) {
                    btn.classList.add('active');
                    btn.innerHTML = "⚡ JARVIS ACTIF";
                    const ok = await AudioSys.init();
                    if (ok) {
                        Voice.init();
                        Visuals.resize();
                        RecognitionEngine.init();
                        RecognitionEngine.start();
                        Log.add("JARVIS RÉEL LIVE – Parlez maintenant", "ok");
                        Voice.speak("Jarvis en ligne. Je réponds à tout ce que vous dites.", 'fr');
                    }
                } else {
                    btn.classList.remove('active');
                    btn.innerHTML = "⚡ DÉMARRER JARVIS";
                    RecognitionEngine.stop();
                    Log.add("Système arrêté", "system");
                }
            },
            toggleTranslate() {
                Config.translateMode = !Config.translateMode;
                const btn = document.getElementById('btn-translate');
                if (Config.translateMode) {
                    btn.classList.add('trans-active');
                    Voice.speak("Mode traducteur activé. Je parle en anglais maintenant.", 'english');
                    Log.add("MODE TRADUCTEUR RÉEL ACTIVÉ", "translate");
                } else {
                    btn.classList.remove('trans-active');
                    Voice.speak("Mode traducteur désactivé.", 'fr');
                    Log.add("MODE TRADUCTEUR DÉSACTIVÉ", "system");
                }
            },
            setMode(mode) {
                State.mode = mode;
                ['normal','ghost','demon'].forEach(m => {
                    const b = document.getElementById('mod-' + m);
                    b.classList.toggle('active', m === mode);
                });
                Voice.speak(`Mode ${mode} activé.`, 'fr');
            },
            toggle(opt) {
                State.options[opt] = !State.options[opt];
                document.getElementById('mod-' + opt).classList.toggle('active');
            },
            clearLogs() { document.getElementById('logs').innerHTML = ''; }
        };

        // ==================== LOOP VISUEL & AUDIO ====================
        function mainLoop() {
            if (!State.active) {
                requestAnimationFrame(mainLoop);
                return;
            }
            const m = AudioSys.analyze();
            Visuals.draw(m.volume);
            document.getElementById('bar-vol').style.width = m.volume + '%';
            document.getElementById('val-vol').innerText = Math.round(m.volume);
            document.getElementById('bar-bass').style.width = (m.bassAvg / 255 * 100) + '%';
            document.getElementById('val-bass').innerText = Math.round(m.bassAvg);
            document.getElementById('bar-treble').style.width = (m.trebleAvg / 255 * 100) + '%';
            document.getElementById('val-treble').innerText = Math.round(m.trebleAvg);
            requestAnimationFrame(mainLoop);
        }

        window.onload = () => {
            Visuals.resize();
            window.addEventListener('resize', () => Visuals.resize());
            setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR'), 1000);
            Log.add("JARVIS v20.1 RÉEL – Parlez et je réponds à tout", "info");
            mainLoop();
        };
    </script>
</body>
</html>
