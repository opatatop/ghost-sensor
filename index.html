<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPRA NEURAL AI v3.8 FULL COMPLETE</title>
<style>
    :root { --bg:#020205; --primary:#00f3ff; --secondary:#ff00ff; --success:#33ff33; --danger:#ff3333; --panel:rgba(10,10,16,0.97); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:#e0e0e0; font-family:'Courier New',monospace; overflow:hidden; height:100vh; display:flex; flex-direction:column; }
    body::before { content:""; position:absolute; inset:0; background:linear-gradient(rgba(0,243,255,0.035)1px,transparent 1px),linear-gradient(90deg,rgba(0,243,255,0.035)1px,transparent 1px); background-size:28px 28px; z-index:0; pointer-events:none; }
    header { height:64px; background:rgba(0,0,0,0.93); border-bottom:2px solid var(--primary); display:flex; justify-content:space-between; align-items:center; padding:0 20px; z-index:10; }
    .brand { font-size:1.22rem; font-weight:bold; letter-spacing:3px; color:var(--primary); }
    .brand span { color:var(--secondary); }
    .env-badge { font-size:0.78rem; padding:5px 12px; border-radius:4px; font-weight:bold; }
    .blocked { background:var(--danger); color:#fff; animation:blink 1.2s infinite; }
    @keyframes blink { 50% { opacity:0.3; } }
    .controls button { background:rgba(0,0,0,0.7); border:1px solid var(--primary); color:var(--primary); padding:8px 18px; margin:0 4px; cursor:pointer; transition:0.2s; text-transform:uppercase; }
    button:hover { background:var(--primary); color:#000; box-shadow:0 0 15px var(--primary); }
    button.active { background:var(--danger); color:#fff; }
    button.success { background:var(--success); color:#000; }
    #canvas-container { flex:1; position:relative; }
    canvas { display:block; width:100%; height:100%; }
    #terminal { height:210px; background:var(--panel); border-top:2px solid var(--secondary); padding:12px; font-size:13px; overflow-y:auto; }
    .log-line { margin:4px 0; padding-left:10px; border-left:3px solid; }
    .log-user { color:var(--primary); border-color:var(--primary); }
    .log-ai { color:var(--secondary); border-color:var(--secondary); font-weight:bold; }
    .log-error { color:var(--danger); border-color:var(--danger); }
    .log-success { color:var(--success); border-color:var(--success); }
</style>
</head>
<body>

<header>
    <div class="brand">SUPRA <span>NEURAL</span> AI <span style="font-size:0.8rem;opacity:0.6;">v3.8 FULL</span></div>
    <div id="envBadge" class="env-badge">CHK...</div>
    <div class="controls">
        <button id="btnMic">MICRO</button>
        <button id="btnVoice">ÉCOUTE</button>
        <button id="btnAuto" class="success">🚀 FULL AUTO</button>
        <button id="btnTestNet">TEST RÉSEAU</button>
        <button id="btnClear">🗑️</button>
    </div>
</header>

<div id="canvas-container"><canvas id="canvas"></canvas></div>
<div id="terminal"></div>

<script>
// ====================== CLÉ (rien à cacher) ======================
const HARDCODED_KEY = "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";

const $ = id => document.getElementById(id);

const Logger = {
    log: (msg, type="sys") => {
        const d = document.createElement("div");
        d.className = `log-line log-${type}`;
        d.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
        $('terminal').appendChild(d);
        $('terminal').scrollTop = $('terminal').scrollHeight;
    },
    success: m => Logger.log(m, "success"),
    error: m => Logger.log(m, "error")
};

// ====================== AI ENGINE ======================
class AIEngine {
    constructor() {
        this.apiKey = localStorage.getItem('supra_key') || HARDCODED_KEY;
        localStorage.setItem('supra_key', this.apiKey);
        this.synth = window.speechSynthesis;
        this.isSpeaking = false;
        this.voices = [];
        speechSynthesis.onvoiceschanged = () => this.voices = speechSynthesis.getVoices();
        this.voices = speechSynthesis.getVoices();
    }
    async process(text) {
        if (text.length < 2) return;
        Logger.log(`VOIX: "${text}"`, "user");
        try {
            const resp = await this.fetchGPT(text);
            this.speak(resp);
        } catch(e) {
            Logger.error("RÉSEAU BLOQUÉ → " + e.message);
        }
    }
    async fetchGPT(p) {
        const res = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {"Content-Type":"application/json", "Authorization":`Bearer ${this.apiKey}`},
            body: JSON.stringify({
                model: "gpt-4o-mini",
                messages: [
                    {role:"system", content:"Tu es SUPRA NEURAL AI v3.8. Réponds en français, max 18 mots, style cyberpunk direct."},
                    {role:"user", content:p}
                ],
                max_tokens: 45
            })
        });
        if (!res.ok) throw new Error("CORS ou clé invalide");
        const data = await res.json();
        return data.choices[0].message.content;
    }
    speak(text) {
        this.synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const frVoice = this.voices.find(v => v.lang.includes('fr'));
        if (frVoice) u.voice = frVoice;
        u.rate = 1.08;
        u.onstart = () => { this.isSpeaking = true; Logger.log(`IA: "${text}"`, "ai"); };
        u.onend = () => { this.isSpeaking = false; };
        this.synth.speak(u);
    }
}

// ====================== AUDIO ENGINE ======================
class AudioEngine {
    constructor() { this.ready = false; this.analyser = null; this.dataArray = null; }
    async start() {
        if (this.ready) return;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const src = ctx.createMediaStreamSource(stream);
            this.analyser = ctx.createAnalyser();
            this.analyser.fftSize = 256;
            src.connect(this.analyser);
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
            this.ready = true;
            Logger.success("MICRO CONNECTÉ");
            $('btnMic').classList.add('active');
        } catch(e) { Logger.error("Micro refusé"); }
    }
    getData() {
        if (!this.ready) return { vol: 0, raw: null };
        this.analyser.getByteFrequencyData(this.dataArray);
        let sum = 0;
        for (let i = 0; i < this.dataArray.length; i++) sum += this.dataArray[i];
        return { vol: sum / this.dataArray.length, raw: this.dataArray };
    }
}

// ====================== VISUALS (NEURAL MAX) ======================
class Visuals {
    constructor() {
        this.c = $('canvas');
        this.ctx = this.c.getContext('2d');
        this.nodes = Array.from({length: 80}, () => ({
            x: Math.random() * innerWidth,
            y: Math.random() * innerHeight,
            vx: (Math.random() - 0.5) * 1.8,
            vy: (Math.random() - 0.5) * 1.8,
            s: Math.random() * 3 + 1.5
        }));
        window.onresize = () => { this.c.width = innerWidth; this.c.height = innerHeight - 274; };
        this.c.width = innerWidth; this.c.height = innerHeight - 274;
    }
    draw(audio, speaking) {
        const { vol, raw } = audio;
        const w = this.c.width, h = this.c.height;
        this.ctx.fillStyle = "rgba(2,2,5,0.18)";
        this.ctx.fillRect(0, 0, w, h);

        // Orb centrale pulse
        const pulse = 45 + vol * 0.9 + (speaking ? 28 : 0);
        this.ctx.shadowBlur = 45;
        this.ctx.shadowColor = "#00f3ff";
        this.ctx.beginPath();
        this.ctx.arc(w/2, h/2, pulse, 0, Math.PI*2);
        this.ctx.strokeStyle = `rgba(0,243,255,${speaking ? 0.95 : 0.45})`;
        this.ctx.lineWidth = 6;
        this.ctx.stroke();
        this.ctx.shadowBlur = 0;

        // Nodes
        for (let n of this.nodes) {
            n.x += n.vx; n.y += n.vy;
            if (n.x < 0 || n.x > w) n.vx *= -1;
            if (n.y < 0 || n.y > h) n.vy *= -1;
            this.ctx.fillStyle = "#00f3ff";
            this.ctx.shadowBlur = 15;
            this.ctx.shadowColor = "#00f3ff";
            this.ctx.beginPath();
            this.ctx.arc(n.x, n.y, n.s + vol/28, 0, Math.PI*2);
            this.ctx.fill();
        }
        this.ctx.shadowBlur = 0;

        // Connexions neurales
        this.ctx.lineWidth = 1.1;
        for (let i = 0; i < this.nodes.length; i++) {
            for (let j = i + 1; j < this.nodes.length; j++) {
                const a = this.nodes[i], b = this.nodes[j];
                const dist = Math.hypot(a.x - b.x, a.y - b.y);
                if (dist < 165) {
                    this.ctx.strokeStyle = `rgba(0,243,255,${(165 - dist)/165 * 0.6})`;
                    this.ctx.beginPath();
                    this.ctx.moveTo(a.x, a.y);
                    this.ctx.lineTo(b.x, b.y);
                    this.ctx.stroke();
                }
            }
        }

        // Barre fréquence
        if (raw) {
            const bw = w / raw.length;
            for (let i = 0; i < raw.length; i++) {
                const height = (raw[i] / 255) * h * 0.38;
                this.ctx.fillStyle = `rgba(255,0,255,0.35)`;
                this.ctx.fillRect(i * bw, h - height, bw - 1, height);
            }
        }
    }
}

// ====================== VOICE ENGINE ======================
class VoiceEngine {
    constructor(callback) {
        this.callback = callback;
        this.rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        this.rec.lang = 'fr-FR';
        this.rec.continuous = true;
        this.rec.interimResults = false;
        this.active = false;
        this.rec.onresult = e => this.callback(e.results[e.results.length-1][0].transcript);
        this.rec.onend = () => { if (this.active) this.rec.start(); };
    }
    toggle() {
        this.active = !this.active;
        this.active ? this.rec.start() : this.rec.stop();
        $('btnVoice').textContent = this.active ? "ÉCOUTE (ON)" : "ÉCOUTE";
        $('btnVoice').classList.toggle('active', this.active);
    }
}

// ====================== APP ======================
class App {
    constructor() {
        this.audio = new AudioEngine();
        this.ai = new AIEngine();
        this.visuals = new Visuals();
        this.voice = new VoiceEngine(t => this.ai.process(t));
        this.isNetworkOk = false;

        this.checkNetworkAndSecure();

        setTimeout(async () => {
            if (this.isNetworkOk) {
                Logger.success("🔑 RÉSEAU OK → FULL AUTO");
                await this.audio.start();
                this.voice.toggle();
            }
        }, 900);

        $('btnMic').onclick = () => this.audio.start();
        $('btnVoice').onclick = () => this.voice.toggle();
        $('btnAuto').onclick = () => { this.audio.start(); this.voice.toggle(); };
        $('btnTestNet').onclick = () => this.testNetwork();
        $('btnClear').onclick = () => { $('terminal').innerHTML = ''; Logger.success("Terminal vidé"); };

        document.addEventListener('keydown', e => { if (e.key === " ") this.voice.toggle(); });

        this.loop();
    }
    async checkNetworkAndSecure() {
        const badge = $('envBadge');
        if (!window.isSecureContext || location.protocol === 'file:') {
            badge.textContent = "RÉSEAU BLOQUÉ";
            badge.classList.add('blocked');
            Logger.error("MODE VOCAL BLOQUÉ → Ouvre avec Live Server");
            return;
        }
        try {
            const r = await fetch("https://api.openai.com/v1/models", { method: "HEAD", headers: { "Authorization": `Bearer ${this.ai.apiKey}` } });
            if (r.ok) {
                badge.textContent = "RÉSEAU OK";
                badge.style.background = "#003300";
                this.isNetworkOk = true;
            }
        } catch {
            badge.textContent = "RÉSEAU BLOQUÉ";
            badge.classList.add('blocked');
            Logger.error("CORS bloqué → Utilise Live Server");
        }
    }
    async testNetwork() {
        Logger.log("Test réseau OpenAI...");
        try {
            const r = await fetch("https://api.openai.com/v1/models", { headers: { "Authorization": `Bearer ${this.ai.apiKey}` } });
            r.ok ? Logger.success("✅ RÉSEAU OK") : Logger.error("Clé ou réseau invalide");
        } catch(e) {
            Logger.error("RÉSEAU BLOQUÉ → Live Server obligatoire");
        }
    }
    loop() {
        requestAnimationFrame(() => this.loop());
        this.visuals.draw(this.audio.getData(), this.ai.isSpeaking);
    }
}

const app = new App();
</script>
</body>
