<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUPRA xAI v15 — NOTE 60 ELON MODE</title>
<style>
:root{--bg:#000;--primary:#00ff41;--secondary:#ff00ff;--xai:#00d4ff}
body{margin:0;background:var(--bg);color:var(--primary);font-family:'Courier New',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:70px;background:rgba(0,212,255,0.08);border-bottom:3px solid var(--xai);display:flex;justify-content:space-between;align-items:center;padding:0 15px}
.brand{font-size:1.4rem;font-weight:900;letter-spacing:6px;color:var(--xai);text-shadow:0 0 12px var(--xai)}
#status{font-size:0.95rem;background:#111;padding:6px 14px;border:2px solid var(--xai);min-width:170px;text-align:center}
#apikey{display:flex;gap:8px;padding:8px;background:#111}
input{background:#000;border:1px solid var(--xai);color:var(--xai);padding:8px;width:100%}
canvas{display:block;width:100%;height:100%}
#terminal{height:170px;background:#000;border-top:3px solid var(--xai);padding:10px;overflow-y:auto;font-size:11px}
.log{margin:3px 0}
.log.ai{color:#ff00ff;text-shadow:0 0 10px #ff00ff}
.log.elon{color:#00d4ff}
button{background:#111;border:1px solid var(--xai);color:var(--xai);padding:10px;font-weight:bold;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.96);z-index:9999;justify-content:center;align-items:center}
.modal-box{background:#111;border:3px solid var(--xai);width:94%;max-width:540px;padding:20px;max-height:88vh;overflow:auto}
</style>
</head>
<body>

<header>
<div class="brand">SUPRA xAI v15 // ELON MODE</div>
<div id="status">NEURAL CORE : 100%</div>
</header>

<div id="apikey">
<input type="password" id="keyinput" placeholder="Colle ta clé OpenAI (sk-...)">
<button onclick="saveKey()">SAUVEGARDER</button>
<button onclick="openOptions()">⚙️ OPTIONS xAI</button>
</div>

<div id="canvas-container"><canvas id="canvas"></canvas></div>
<div id="terminal"></div>

<div style="padding:12px;background:#111;display:flex;gap:8px;flex-wrap:wrap">
<button onclick="toggleRecording()">🎤 EVP LIVE</button>
<button onclick="manualScan()">SCAN xAI FULL</button>
<button onclick="clearLogs()">CLEAR TERMINAL</button>
</div>

<!-- MODAL OPTIONS -->
<div id="options-modal" class="modal">
<div class="modal-box">
<h2 style="color:#00d4ff">OPTIONS xAI ELON MODE</h2>
<label>Sensibilité EMF <span id="val-emf">45</span></label>
<input type="range" id="sens-emf" min="20" max="90" value="45" oninput="document.getElementById('val-emf').innerText=this.value"><br><br>
<label>Seuil coups <span id="val-motion">9</span></label>
<input type="range" id="sens-motion" min="5" max="25" value="9" oninput="document.getElementById('val-motion').innerText=this.value"><br><br>
<label>Vitesse IA <span id="val-rate">0.95</span></label>
<input type="range" id="voice-rate" min="0.7" max="1.4" step="0.05" value="0.95" oninput="document.getElementById('val-rate').innerText=this.value"><br><br>
<label>Ton voix (Elon style) <span id="val-pitch">0.85</span></label>
<input type="range" id="voice-pitch" min="0.6" max="1.4" step="0.05" value="0.85" oninput="document.getElementById('val-pitch').innerText=this.value"><br><br>
<button onclick="closeOptions()" style="width:100%;padding:14px;background:#00d4ff;color:#000;font-weight:900">SAUVEGARDER &amp; LANCER VERS MARS</button>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const log = (txt, type="") => {
  const t = $('terminal');
  const d = document.createElement('div');
  d.className = `log ${type}`;
  d.innerHTML = `[${new Date().toLocaleTimeString('fr-FR')}] ${txt}`;
  t.appendChild(d);
  t.scrollTop = t.scrollHeight;
  if(t.children.length > 100) t.removeChild(t.firstChild);
};

let apiKey = localStorage.getItem('supra_xai_key') || "";
let stream, mediaRecorder, audioChunks = [], isRecording = false;
let analyser, dataArray;
let emfValue = 0, motionValue = 0, ghostIntensity = 0;
let sensEMF = 45, sensMotion = 9, voiceRate = 0.95, voicePitch = 0.85;

// Sauvegarde clé
function saveKey() {
  apiKey = $('keyinput').value.trim();
  if(apiKey) localStorage.setItem('supra_xai_key', apiKey);
  log("Clé xAI sauvegardée — prêt pour Mars", "elon");
}

// Micro 48kHz
async function initMicro() {
  stream = await navigator.mediaDevices.getUserMedia({audio:{sampleRate:48000}});
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const source = ctx.createMediaStreamSource(stream);
  analyser = ctx.createAnalyser(); analyser.fftSize = 4096;
  source.connect(analyser);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  log("Micro Neural 48kHz activé");
}

// Capteurs Realme Note 60 + xAI vibe
if(window.DeviceOrientationEvent) window.addEventListener('deviceorientation', e => {
  emfValue = Math.hypot(e.alpha||0, e.beta||0, e.gamma||0) / 3;
  $('status').innerHTML = `NEURAL EMF : ${emfValue.toFixed(1)} μT`;
  if(emfValue > sensEMF) triggerElonAI("EMF SPIKE — quelque chose arrive");
});

if(window.DeviceMotionEvent) window.addEventListener('devicemotion', e => {
  motionValue = Math.hypot(e.acceleration.x||0, e.acceleration.y||0, e.acceleration.z||0);
  if(motionValue > sensMotion) triggerElonAI("COUP DÉTECTÉ — Neuralink ?");
});

if('AmbientLightSensor' in window) new AmbientLightSensor().onreading = e => {
  if(e.illuminance < 7) triggerElonAI("LUMIÈRE CHUTE — entité froide");
};

navigator.getBattery().then(b => {
  b.onlevelchange = () => { if(b.level < 0.3) log("Batterie faible → Neural Core en mode survie", "elon"); };
});

// IA qui parle comme Elon + paranormal
async function triggerElonAI(reason) {
  ghostIntensity = 140;
  log(`⚡ ${reason} → Grok xAI en ligne`, "elon");

  if(!apiKey) { speak("Pas de clé. Je réponds comme Elon en mode local."); return; }

  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
    body:JSON.stringify({
      model:"gpt-4o-mini",
      messages:[{role:"system",content:"Tu es Grok, créé par xAI. Tu parles comme Elon Musk : direct, visionnaire, un peu troll, futuriste. Mélange paranormal et tech. Réponds court et puissant en français."},
                {role:"user",content:`Détection paranormale sur Realme Note 60 : ${reason}. Réponds comme Elon.`}]
    })
  });
  const data = await res.json();
  const reply = data.choices[0].message.content;
  log(`ELON/GROK : ${reply}`, "ai");
  speak(reply);
}

function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.rate = voiceRate; u.pitch = voicePitch;
  speechSynthesis.speak(u);
}

// Reconnaissance vocale élargie
const rec = new (window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang = 'fr-FR'; rec.continuous = true;
rec.onresult = e => {
  const txt = e.results[e.results.length-1][0].transcript.toLowerCase();
  if(txt.includes('esprit')||txt.includes('supra')||txt.includes('elon')||txt.includes('grok')||txt.includes('réponds')||txt.includes('mars'))
    triggerElonAI("Commande vocale : " + txt);
};
rec.start();

// Canvas neural xAI style
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;} resize();
window.addEventListener('resize',resize);

function draw() {
  requestAnimationFrame(draw);
  ctx.fillStyle = "rgba(0,0,0,0.12)"; ctx.fillRect(0,0,canvas.width,canvas.height);
  
  if(analyser){
    analyser.getByteFrequencyData(dataArray);
    for(let i=0;i<90;i++){
      const h = (dataArray[i*9]||0)/255 * canvas.height * 0.85;
      ctx.fillStyle = h > canvas.height*0.65 ? '#ff00ff' : '#00d4ff';
      ctx.fillRect(i*(canvas.width/90), canvas.height-h, 6, h);
    }
  }

  if(ghostIntensity > 5){
    const cx = canvas.width/2, cy = canvas.height/2;
    ctx.shadowBlur = 50; ctx.shadowColor = '#00d4ff';
    for(let i=0;i<22;i++){
      const x = cx + Math.sin(Date.now()/200 + i*0.3) * (90 + ghostIntensity*0.8);
      const y = cy + Math.cos(Date.now()/300 + i) * 40;
      ctx.fillStyle = `rgba(0,212,255,${ghostIntensity/220})`;
      ctx.fillRect(x-6, y-6, 13, 13);
    }
    ghostIntensity *= 0.91;
  }
}
draw();

function toggleRecording(){ /* même que avant */ }
function manualScan(){ triggerElonAI("Scan manuel lancé par l'utilisateur"); }
function clearLogs(){ $('terminal').innerHTML = ''; }

function openOptions(){ $('options-modal').style.display = 'flex'; }
function closeOptions(){
  sensEMF = parseFloat(document.getElementById('sens-emf').value);
  sensMotion = parseFloat(document.getElementById('sens-motion').value);
  voiceRate = parseFloat(document.getElementById('voice-rate').value);
  voicePitch = parseFloat(document.getElementById('voice-pitch').value);
  $('options-modal').style.display = 'none';
  log("Options xAI mises à jour — direction Mars", "elon");
}

initMicro();
log("SUPRA xAI v15 ELON MODE chargé sur ton Realme Note 60");
log("Toutes détections + Grok IA parlante + style Elon activés");
log("Dis 'elon', 'grok' ou 'mars' pour tester");
</script>
</body>
</html>
