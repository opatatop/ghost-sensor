<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SUPRA LAB v11 — FULL SPECTRUM BLACK OPS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --green: #00ff41;
            --red: #ff0044;
            --bg-dark: #001100;
            --bg-darker: #000;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: var(--bg-darker);
            color: var(--green);
            font-family: 'VT323', monospace;
            font-size: 18px;
            line-height: 1.35;
            min-height: 100vh;
            overflow-y: auto;
            touch-action: manipulation;
        }

        body.night-vision {
            --green: #00cc22;
            filter: brightness(1.2) contrast(1.3) hue-rotate(80deg);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(to bottom, rgba(0,255,65,0.045) 0px, rgba(0,255,65,0.045) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            z-index: 9999;
            animation: crt 0.12s linear infinite;
        }
        @keyframes crt { 0% { opacity: 0.9; } 100% { opacity: 1; } }

        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #000; border: 2px solid var(--green); }
        ::-webkit-scrollbar-thumb { background: var(--green); }

        header {
            background: var(--bg-dark);
            border-bottom: 6px solid var(--green);
            padding: 15px;
            text-align: center;
            font-size: 26px;
            text-shadow: 0 0 15px var(--green);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        #main {
            display: none;
            padding: 12px;
            gap: 14px;
            flex-direction: column;
        }

        .panel {
            background: var(--bg-dark);
            border: 4px solid var(--green);
            box-shadow: 0 0 30px var(--green);
            padding: 12px;
            position: relative;
            min-height: 240px;
        }

        .panel-header {
            position: absolute;
            top: -14px;
            left: 18px;
            background: var(--bg-dark);
            padding: 0 14px;
            font-size: 18px;
            z-index: 10;
        }

        canvas {
            width: 100% !important;
            height: 200px !important;
            background: #000;
            display: block;
            touch-action: none;
        }

        #log {
            min-height: 340px;
            max-height: 440px;
            overflow-y: auto !important;
            background: rgba(0,25,0,0.95);
            padding: 15px;
            font-size: 17px;
            border: 3px solid var(--green);
        }

        .log-line { white-space: pre-wrap; margin-bottom: 5px; }
        .log-line::before { content: "> "; color: #00cc33; margin-right: 8px; }
        .alert-critical { color: var(--red); animation: flash 0.4s infinite alternate; }

        .value {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(0,17,0,0.95);
            padding: 6px 14px;
            border: 3px solid var(--green);
            font-size: 19px;
            z-index: 20;
        }

        .control-bar {
            margin-top: 15px;
            padding: 10px;
            border: 3px solid var(--green);
            background: var(--bg-dark);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .btn {
            background: transparent;
            color: var(--green);
            border: 4px solid var(--green);
            padding: 12px 28px;
            font-size: 21px;
            cursor: pointer;
        }
        .btn:hover { background: var(--green); color: #000; }

        .floating-btn {
            position: fixed;
            right: 15px;
            z-index: 400;
            padding: 12px 18px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- SETTINGS -->
    <div id="settings-page" style="display:none; position:fixed; inset:0; background:var(--bg-darker); z-index:10001; padding:20px; overflow-y:auto; border:8px solid var(--green);">
        <button id="closeSettings" style="position:absolute;top:15px;right:15px;font-size:34px;background:none;border:none;color:var(--green);">✕</button>
        <div style="text-align:center;font-size:26px;margin-bottom:25px;">⚙️ PARAMÈTRES</div>

        <div style="margin-bottom:25px;">
            <h3>🔑 Clé API Groq</h3>
            <input type="text" id="groqApiKey" placeholder="gsk_..." style="width:100%; padding:12px; font-size:17px;">
        </div>

        <div style="text-align:center;">
            <button class="btn" id="saveSettings">💾 Sauvegarder</button>
        </div>
    </div>

    <!-- START SCREEN -->
    <div id="start-screen">
        <div style="text-align:center; margin-bottom:50px; font-size:28px;">
            SUPRA LAB v11<br>
            FULL SPECTRUM SIGINT + IA GROQ
        </div>
        <button id="btnStart" class="btn" style="padding:30px 90px; font-size:38px;">LANCER TOUT LE SYSTÈME</button>
        <button id="btnSettings" class="btn" style="margin-top:25px;">⚙️ PARAMÈTRES</button>
        <button id="btnStartIA" class="btn" style="margin-top:25px;">🎤 ACTIVER IA VOCALE</button>
    </div>

    <!-- MAIN INTERFACE -->
    <div id="main">
        <header>SUPRA LAB v11 — BLACK OPS FULL SPECTRUM</header>

        <div class="panel">
            <div class="panel-header">SPECTROGRAMME WATERFALL</div>
            <canvas id="spectrogram"></canvas>
        </div>

        <div class="panel">
            <div class="panel-header">OSCILLOSCOPE</div>
            <canvas id="scope"></canvas>
        </div>

        <div class="panel">
            <div class="panel-header">CAPTEURS + ANOMALIE</div>
            <canvas id="sensors"></canvas>
            <div class="value" id="rms-value">RMS: -- dB</div>
            <div class="value" id="anomaly-badge" style="top:60px;background:var(--red);color:white;display:none;">⚠️ ANOMALIE</div>
        </div>

        <div class="panel">
            <div class="panel-header">BAND ANALYSIS</div>
            <div id="band-info" style="padding:15px;font-size:18px;"></div>
        </div>

        <div class="panel" style="min-height:380px;">
            <div class="panel-header">SIGINT LOG + IA GROQ</div>
            <div id="log"></div>
        </div>
    </div>

    <!-- Floating Buttons -->
    <button class="floating-btn btn" id="btnFullscreen">⛶ PLEIN ÉCRAN</button>
    <button class="floating-btn btn" id="btnNightVision">🌙 NIGHT VISION</button>
    <button class="floating-btn btn" id="btnAnalyzeNow">📡 ANALYSE IA</button>

    <script>
        // ==================== CONFIG ====================
        let config = { groqApiKey: "" };
        let audioCtx, analyser, microphone, gainNode, mediaRecorder;
        let frequencyArray = new Uint8Array(2048);
        let timeArray = new Uint8Array(2048);
        let spectroHistory = [];
        let isRunning = false;
        let recognition = null;
        let isNightVision = false;

        let audioSummary = { rms: 0, peakFreq: 0, anomaly: false, transcript: "" };

        // ==================== LOG ====================
        function log(text, important = false) {
            const logDiv = document.getElementById('log');
            const line = document.createElement('div');
            line.className = 'log-line' + (important ? ' alert-critical' : '');
            line.innerHTML = `<span style="color:#00cc33">[${new Date().toLocaleTimeString('fr-FR')}]</span> ${text}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // ==================== NIGHT VISION ====================
        function toggleNightVision() {
            isNightVision = !isNightVision;
            document.body.classList.toggle('night-vision', isNightVision);
            document.getElementById('btnNightVision').textContent = isNightVision ? "☀️ NORMAL" : "🌙 NIGHT VISION";
        }

        function playCriticalAlert() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.value = 880;
                const gain = ctx.createGain();
                gain.gain.value = 0.3;
                osc.connect(gain).connect(ctx.destination);
                osc.start();
                setTimeout(() => osc.stop(), 700);
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            } catch(e) {}
        }

        // ==================== GROQ ANALYSIS ====================
        async function analyzeWithGroq() {
            if (!config.groqApiKey) {
                log("[GROQ] Veuillez entrer votre clé API dans les paramètres", true);
                return;
            }

            log("[GROQ] Analyse en cours...", true);

            const prompt = `Tu es SUPRA, analyste SIGINT militaire.
RMS: ${audioSummary.rms.toFixed(1)} dB
Dernier mot entendu: "${audioSummary.transcript || 'Aucun'}"
Analyse rapidement en français militaire.`;

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${config.groqApiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: prompt }],
                        temperature: 0.7,
                        max_tokens: 350
                    })
                });

                const data = await res.json();
                const answer = data.choices?.[0]?.message?.content || "Pas de réponse";
                log(`[SUPRA IA] ${answer}`, true);
            } catch (e) {
                log(`[GROQ ERREUR] ${e.message}`, true);
            }
        }

        // ==================== IA VOCALE LOCALE ====================
        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                log("[IA] Reconnaissance vocale non supportée sur ce navigateur", true);
                return;
            }

            recognition = new SR();
            recognition.continuous = true;
            recognition.lang = 'fr-FR';

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                audioSummary.transcript = transcript;
                log(`[VOIX] "${transcript}"`, true);

                if (transcript.toLowerCase().includes("supra")) {
                    log("[COMMANDE] Analyse Groq lancée...", true);
                    analyzeWithGroq();
                }
            };

            recognition.onerror = (e) => log(`[IA ERREUR] ${e.error}`, true);
            recognition.onend = () => setTimeout(() => recognition.start(), 600);

            recognition.start();
            log("[IA VOCALE] Activée - Dis 'Supra' pour tester", true);
        }

        // ==================== AUDIO + LOOP ====================
        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                await audioCtx.resume();

                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 4096;

                frequencyArray = new Uint8Array(analyser.frequencyBinCount);
                timeArray = new Uint8Array(analyser.frequencyBinCount);

                isRunning = true;
                requestAnimationFrame(loop);

                log("[AUDIO] Micro initialisé avec succès");
            } catch (err) {
                log(`[ERREUR MICRO] ${err.message}`, true);
            }
        }

        function loop() {
            if (!isRunning || !analyser) return;

            analyser.getByteFrequencyData(frequencyArray);
            const rms = Math.sqrt(frequencyArray.reduce((a,b) => a + b*b, 0) / frequencyArray.length) / 128;

            audioSummary.rms = rms;
            audioSummary.anomaly = rms > 40;

            document.getElementById('rms-value').textContent = `RMS: ${rms.toFixed(1)} dB`;

            // Dessins
            drawSpectrogram();
            drawScope();

            requestAnimationFrame(loop);
        }

        function drawSpectrogram() {
            const canvas = document.getElementById('spectrogram');
            if (!canvas || !analyser) return;
            const ctx = canvas.getContext('2d');
            analyser.getByteFrequencyData(frequencyArray);
            spectroHistory.unshift([...frequencyArray]);
            if (spectroHistory.length > 120) spectroHistory.pop();

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width / frequencyArray.length;
            for (let y = 0; y < spectroHistory.length; y++) {
                for (let x = 0; x < spectroHistory[y].length; x++) {
                    const val = spectroHistory[y][x];
                    ctx.fillStyle = `hsl(${90 + val/2.5}, 100%, ${val/2.8}%)`;
                    ctx.fillRect(x * w, y * 2, w + 1, 2);
                }
            }
        }

        function drawScope() {
            const canvas = document.getElementById('scope');
            if (!canvas || !analyser) return;
            const ctx = canvas.getContext('2d');
            analyser.getByteTimeDomainData(timeArray);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--green');
            ctx.lineWidth = 3;
            ctx.beginPath();
            const slice = canvas.width / timeArray.length;
            let x = 0;
            for (let i = 0; i < timeArray.length; i++) {
                const y = (timeArray[i] / 128) * canvas.height / 2;
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                x += slice;
            }
            ctx.stroke();
        }

        // ==================== DÉMARRAGE ====================
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnStart').addEventListener('click', async () => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main').style.display = 'flex';

                log("=== SUPRA LAB v11 FULLY ACTIVATED ===", true);
                log("Parle maintenant et dis 'Supra' pour tester l'IA", true);

                await initAudio();
                initSpeech();
            });

            document.getElementById('btnStartIA').addEventListener('click', initSpeech);
            document.getElementById('btnNightVision').addEventListener('click', toggleNightVision);
            document.getElementById('btnAnalyzeNow').addEventListener('click', analyzeWithGroq);
            document.getElementById('btnSettings').addEventListener('click', () => document.getElementById('settings-page').style.display = 'block');
            document.getElementById('closeSettings').addEventListener('click', () => document.getElementById('settings-page').style.display = 'none');

            document.getElementById('saveSettings').addEventListener('click', () => {
                config.groqApiKey = document.getElementById('groqApiKey').value.trim();
                localStorage.setItem('supraLabConfig', JSON.stringify(config));
                log("[CONFIG] Clé Groq sauvegardée", true);
                document.getElementById('settings-page').style.display = 'none';
            });
        });
    </script>
</body>
</html>
