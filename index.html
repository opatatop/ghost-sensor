<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SUPRA LAB v11 — FULL SPECTRUM BLACK OPS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        :root {
            --green: #00ff41;
            --night-green: #00cc22;
            --red: #ff0044;
            --bg-dark: #001100;
            --bg-darker: #000;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg-darker); color: var(--green); font-family: 'VT323', monospace;
            font-size: 17.5px; line-height: 1.25; overflow: hidden; height: 100vh;
        }
        body.night-vision {
            --green: #00cc22;
            filter: brightness(1.15) contrast(1.25) hue-rotate(80deg);
        }
        body::before {
            content: ""; position: fixed; inset: 0;
            background: repeating-linear-gradient(to bottom, rgba(0,255,65,0.05) 0px, rgba(0,255,65,0.05) 2px, transparent 2px, transparent 4px);
            pointer-events: none; z-index: 9999; animation: crt 0.1s linear infinite;
        }
        @keyframes crt { 0% { opacity: 0.92; } 100% { opacity: 1; } }

        header { background: var(--bg-dark); border-bottom: 6px solid var(--green); padding: 12px; text-align:center; font-size:24px; text-shadow:0 0 15px var(--green); letter-spacing:3px; position:sticky; top:0; z-index:200; }

        #main { display: none; height: calc(100vh - 52px); padding:10px; gap:10px; overflow:hidden; grid-template-columns: 1fr; grid-template-rows: auto; }
        @media (min-width: 900px) { #main { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto auto; } }

        .panel { background: var(--bg-dark); border:4px solid var(--green); box-shadow:0 0 35px var(--green); padding:12px; position:relative; overflow:hidden; display:flex; flex-direction:column; }
        .panel-header { position:absolute; top:-14px; left:16px; background:var(--bg-dark); padding:0 14px; font-size:18px; z-index:10; }

        canvas { flex:1; background:#000; touch-action:none; image-rendering:pixelated; }

        #log { flex:1; overflow-y:auto; font-size:16.5px; padding:12px; background:rgba(0,20,0,0.75); }
        .log-line { white-space:pre-wrap; margin-bottom:4px; }
        .log-line::before { content:"> "; color:#00cc33; }
        .alert-critical { color: var(--red); animation: flash 0.35s infinite alternate; }

        #log-cursor { display:inline-block; width:9px; height:18px; background:var(--green); animation:blink 0.75s step-end infinite; }
        @keyframes blink { 50% { opacity:0; } }
        @keyframes flash { from { opacity: 0.6; } to { opacity: 1; } }

        .value { position:absolute; top:14px; right:14px; background:rgba(0,17,0,0.95); padding:6px 14px; border:3px solid var(--green); font-size:19px; z-index:20; }

        .btn { background:transparent; color:var(--green); border:4px solid var(--green); padding:12px 24px; font-size:20px; cursor:pointer; margin:5px; }
        .btn:hover { background:var(--green); color:#000; }
        .btn-fullscreen { position:fixed; top:70px; right:15px; z-index:300; }
        .btn-night { position:fixed; top:120px; right:15px; z-index:300; }
        .btn-record { position:fixed; bottom:110px; right:15px; z-index:300; }
    </style>
</head>
<body>

    <!-- SETTINGS -->
    <div id="settings-page" style="display:none;position:fixed;inset:0;background:var(--bg-darker);z-index:10001;padding:20px;overflow-y:auto;border:8px solid var(--green);">
        <button id="closeSettings" style="position:absolute;top:15px;right:15px;font-size:32px;background:none;border:none;color:var(--green);">✕</button>
        <h2 style="text-align:center;margin-bottom:25px;">⚙️ SUPRA LAB v11 — ULTIMATE</h2>
        
        <div>
            <h3>🔑 Clé API Groq (Gratuite)</h3>
            <input type="text" id="groqApiKey" placeholder="gsk_..." style="width:100%;padding:12px;font-size:17px;">
        </div>
        <div style="margin-top:20px;">
            <button class="btn" id="saveSettings">💾 Sauvegarder</button>
        </div>
    </div>

    <div id="start-screen">... (ton écran de démarrage) ...</div>

    <div id="main">
        <header>SUPRA LAB v11 — BLACK OPS FULL SPECTRUM</header>

        <!-- Tes panels existants + Histogramme + Band Analysis -->

        <div class="panel">
            <div class="panel-header">HISTOGRAMME BANDES</div>
            <canvas id="bandHistogram" width="800" height="180"></canvas>
        </div>

        <div class="panel">
            <div class="panel-header">BAND ANALYSIS + EMERGENCY</div>
            <div id="band-info" style="flex:1; padding:15px; font-size:18px;"></div>
        </div>

        <div class="panel" style="grid-column:1/-1;">
            <div class="panel-header">SIGINT LOG + IA ANALYSIS</div>
            <div id="log"></div>
            <span id="log-cursor"></span>
        </div>
    </div>

    <button class="btn btn-fullscreen" id="btnFullscreen">⛶ PLEIN ÉCRAN</button>
    <button class="btn btn-night" id="btnNightVision">🌙 NIGHT VISION</button>
    <button class="btn" id="btnAnalyzeNow" style="position:fixed;bottom:170px;right:15px;z-index:300;">📡 ANALYSE IA</button>
    <button class="btn btn-record" id="btnSendAudio">🎤 ENREG. + ANALYSE AUDIO</button>

    <div class="status-bar" style="position:fixed;bottom:0;left:0;right:0;background:var(--bg-dark);border-top:5px solid var(--green);padding:8px 15px;font-size:16px;display:flex;justify-content:space-between;z-index:99999;">
        <span id="status-text">Scanner auto 10s • Night Vision • Alertes critiques</span>
        <span id="device-info">Realme Note 60 • Android 15</span>
    </div>

    <script>
        let config = { groqApiKey: "" };
        let isNightVision = false;
        let mediaRecorder, recordedChunks = [];
        let isRecordingForAI = false;

        let audioSummary = { rms: 0, peakFreq: 0, anomaly: false, band: "UNKNOWN", accel: {x:0,y:0,z:0}, heading: 0, transcript: "" };

        function log(text, important = false) {
            const logDiv = document.getElementById('log');
            const line = document.createElement('div');
            line.className = 'log-line';
            if (important) line.classList.add('alert-critical');
            line.innerHTML = `<span style="color:#00cc33">[${new Date().toLocaleTimeString('fr-FR')}]</span> ${text}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
            if (logDiv.children.length > 200) logDiv.removeChild(logDiv.children[0]);
        }

        // ==================== MODE NIGHT VISION ====================
        function toggleNightVision() {
            isNightVision = !isNightVision;
            document.body.classList.toggle('night-vision', isNightVision);
            document.getElementById('btnNightVision').textContent = isNightVision ? "☀️ NORMAL" : "🌙 NIGHT VISION";
            log(isNightVision ? "[DISPLAY] Mode Night Vision activé" : "[DISPLAY] Mode Normal restauré", true);
        }

        // ==================== SON ALERTE CRITIQUE ====================
        function playCriticalAlert() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.value = 0.3;
                oscillator.connect(gain);
                gain.connect(audioCtx.destination);
                oscillator.start();
                setTimeout(() => { oscillator.stop(); }, 600);
                
                // Vibration sur mobile
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            } catch(e) {}
        }

        // ==================== ANALYSE GROQ (avec alertes) ====================
        async function analyzeWithGroq(audioBlob = null) {
            if (!config.groqApiKey) {
                log("[GROQ] Clé API manquante — configurez-la", true);
                return;
            }

            // Prompt enrichi avec détection militaire / urgence
            let prompt = `Tu es SUPRA, analyste SIGINT militaire Black Ops niveau 5.
Données en temps réel :
- RMS: ${audioSummary.rms.toFixed(2)} dB
- Fréquence dominante: ${audioSummary.peakFreq} Hz → ${audioSummary.band}
- Anomalie > 3.2σ: ${audioSummary.anomaly ? "OUI - ALERTE CRITIQUE" : "Non"}
- Accéléromètre: X=${audioSummary.accel.x} Y=${audioSummary.accel.y} Z=${audioSummary.accel.z}
- Transcript: "${audioSummary.transcript || 'Aucun'}"`;

            if (audioBlob) prompt += "\nFichier audio joint → analyse prioritaire pour EVP, voix, signaux codés ou urgence.";

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${config.groqApiKey}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "user", content: prompt }], temperature: 0.6, max_tokens: 480 })
                });
                const data = await res.json();
                const analysis = data.choices?.[0]?.message?.content || "Pas de réponse";
                log(`[SUPRA IA] ${analysis.replace(/\n/g, ' • ')}`, true);

                // Si urgence dans la réponse → alerte sonore
                if (/urgence|critique|emergency|avion|drone|militaire/i.test(analysis)) playCriticalAlert();
            } catch (e) {
                log(`[GROQ ERREUR] ${e.message}`, true);
            }
        }

        // Scanner automatique toutes les 10s
        function startAutoScanner() {
            setInterval(() => {
                if (audioSummary.rms > 8 || audioSummary.anomaly) analyzeWithGroq();
            }, 10000);
        }

        // Enregistrement + envoi audio
        async function startAudioForAI() {
            if (isRecordingForAI) return;
            recordedChunks = [];
            isRecordingForAI = true;
            document.getElementById('btnSendAudio').textContent = "● EN COURS (15s)";
            mediaRecorder.start();
            setTimeout(() => stopAndSendAudio(), 15000);
        }

        function stopAndSendAudio() {
            if (!isRecordingForAI) return;
            isRecordingForAI = false;
            mediaRecorder.stop();
            document.getElementById('btnSendAudio').textContent = "🎤 ENREG. + ANALYSE AUDIO";

            mediaRecorder.onstop = async () => {
                const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                log("[AUDIO] Envoi du fichier à l'IA pour analyse approfondie...", true);
                await analyzeWithGroq(blob);
                recordedChunks = [];
            };
        }

        // Mise à jour (à appeler depuis loop())
        function updateAudioSummary(rms, frequencyArray, anomaly) {
            audioSummary.rms = rms;
            audioSummary.anomaly = anomaly;

            // Calcul fréquence dominante
            let maxIdx = 0, maxVal = 0;
            for (let i = 0; i < frequencyArray.length; i++) {
                if (frequencyArray[i] > maxVal) { maxVal = frequencyArray[i]; maxIdx = i; }
            }
            audioSummary.peakFreq = Math.round((maxIdx / frequencyArray.length) * 24000);
            audioSummary.band = classifyBand(audioSummary.peakFreq);   // fonction classifyBand à garder de la version précédente

            if (anomaly || audioSummary.peakFreq > 100000000) {
                playCriticalAlert();
                log(`[CRITIQUE] Bande urgente détectée : ${audioSummary.band}`, true);
                analyzeWithGroq();
            }
        }

        function updateTranscript(text) {
            audioSummary.transcript = text;
            if (/supra|analyse|urgence|avion|drone|esprit/i.test(text)) analyzeWithGroq();
        }

        // ==================== GUIDE CLÉ GROQ GRATUITE ====================
        function showGroqGuide() {
            log("=== COMMENT OBTENIR UNE CLÉ GROQ GRATUITE ===", true);
            log("1. Va sur → https://console.groq.com", true);
            log("2. Connecte-toi avec Google, GitHub ou Email (aucune carte bancaire)", true);
            log("3. Va dans https://console.groq.com/keys", true);
            log("4. Clique sur 'Create API Key'", true);
            log("5. Copie la clé (commence par gsk_...) et colle-la dans les paramètres", true);
            log("Limites gratuites : environ 30 requêtes/minute selon le modèle (suffisant pour ce lab)", true);
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('supraLabConfig');
            if (saved) config = JSON.parse(saved);
            document.getElementById('groqApiKey').value = config.groqApiKey || '';

            document.getElementById('saveSettings').addEventListener('click', () => {
                config.groqApiKey = document.getElementById('groqApiKey').value.trim();
                localStorage.setItem('supraLabConfig', JSON.stringify(config));
                log("[SYSTEM] Clé Groq sauvegardée", true);
                document.getElementById('settings-page').style.display = 'none';
            });

            document.getElementById('btnNightVision').addEventListener('click', toggleNightVision);
            document.getElementById('btnFullscreen').addEventListener('click', () => document.documentElement.requestFullscreen());
            document.getElementById('btnAnalyzeNow').addEventListener('click', () => analyzeWithGroq());
            document.getElementById('btnSendAudio').addEventListener('click', startAudioForAI);

            // Bouton démarrage
            document.getElementById('btnStart').addEventListener('click', () => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main').style.display = 'grid';
                log("=== SUPRA LAB v11 BLACK OPS FULLY ARMED ===", true);
                log("Night Vision • Alerte sonore • Scanner auto 10s • Analyse audio activés", true);
                showGroqGuide();   // Affiche le guide une fois au démarrage
                startAutoScanner();
            });
        });
    </script>
</body>
</html>
